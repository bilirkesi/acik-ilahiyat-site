uraklama ve Gerileme şeklinde dönemlendiren Avrupa merkezci yaklaşımdır. Günümüz tarih yazımında Osmanlı Devleti'nin gerilemediği, aksine askeri bir imparatorluktan bürokratik modern bir devlete evrildiği savunulmaktadır.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:1"}, {"front": "Şark Meselesi (Doğu Sorunu)", "back": "1774 Küçük Kaynarca Antlaşması sonrasında Avrupalı büyük güçlerin Osmanlı Devleti'ni hasta adam ilan ederek parçalama, paylaşma ve Türkleri Anadolu'dan atma politikasıdır. Türk milletinin başlattığı Millî Mücadele ve imzalanan antlaşmalarla bu mesele nihai olarak son bulmuştur.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:2"}, {"front": "Ebubekir Ratib Efendi", "back": "III. Selim'e 1791 Viyana sefareti gözlemlerine dayanarak 490 sayfalık Büyük Layiha'yı sunan devlet adamıdır. Avrupa'daki düzenli ordu, bütçe yönetimi, icatlar ve mülkiyet hakkının önemini vurgulayarak Tanzimat hareketinin düşünsel temellerini atmıştır.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:3"}, {"front": "Nizam-ı Cedit", "back": "İlk kez 1717'de Fransız mühendis Rockfort'un askerî ıslahat raporunda kullanılan ve III. Selim dönemindeki yenilikleri ifade eden kavramdır. III. Selim'in tahttan indirilmesine yol açan Kabakçı Mustafa İsyanı ile bu dönem sona ermiştir.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:4"}, {"front": "Gülhane Hatt-ı Hümayunu (Tanzimat Fermanı)", "back": "Sultan Abdülmecit döneminde 3 Kasım 1839'da Hariciye Nazırı Mustafa Reşid Paşa tarafından okunan mülki ıslahat fermanıdır. Müslim ve gayrimüslim tebaanın can, mal ve namus güvenliği ile kanun önünde eşitliğini hedefleyen Osmanlı milleti projesinin ilk adımıdır.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:5"}, {"front": "Asafnâme", "back": "Kanunî Sultan Süleyman'ın başveziri Lütfi Paşa tarafından kaleme alınan ve Osmanlı devlet kurumlarındaki çözülmeleri ele alan ilk ıslahat risalesidir. Nasihatname türü siyasi eleştiri geleneğinin başlangıcı kabul edilmektedir.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:6"}, {"front": "Edirne Vakası (1703)", "back": "Şeyhülislam Feyzullah Efendi'nin katli ve II. Mustafa'nın tahttan indirilmesiyle sonuçlanan siyasi krizdir. Osmanlı tarihinde ilk kez ulema ile asker iş birliği sonucu hanedanın meşruiyeti tartışmaya açılmış ve alternatif saltanat arayışları gündeme gelmiştir.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:7"}, {"front": "Tağşiş", "back": "Devletin mali krizleri aşmak amacıyla paranın içindeki değerli maden oranını düşürerek değerini azaltması uygulamasıdır. 16. ve 17. yüzyıllarda gümüş akını ve enflasyonla birleşerek ekonomik çalkantılara ve askerî isyanlara yol açmıştır.", "ch": 1, "chTitle": "Türk İnkılabını Hazırlayan Sebepler ve Doğu Sorunu", "id": "ataturk-ilkeleri-1:8"}, {"front": "İkinci Meşrutiyet", "back": "İttihat ve Terakki Cemiyeti'nin faaliyetleri ve Reval görüşmelerinin yarattığı tepki sonucu 23 Temmuz 1908 tarihinde Kanun-ı Esasi'nin yeniden yürürlüğe girmesiyle başlayan anayasal dönemdir. Bu gelişme 1936 yılına kadar her yıl 10 Temmuz Hürriyet Bayramı adıyla ülkenin ilk resmi bayramı olarak kutlanmıştır.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:9"}, {"front": "31 Mart Vakası", "back": "Rumi 31 Mart 1325 (13 Nisan 1909) tarihinde İstanbul'da İttihat ve Terakki'ye karşı şeriat talebiyle başlayan ve Meşrutiyet rejimini hedef alan reaksiyoner ayaklanmadır. İsyan Hareket Ordusu tarafından bastırılmış, ardından Sultan II. Abdülhamit tahttan indirilmiştir.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:10"}, {"front": "Hareket Ordusu", "back": "31 Mart Vakası'nı bastırmak amacıyla Rumeli'deki ordulardan oluşturulan ve komutanlığını Mahmut Şevket Paşa'nın üstlendiği askeri güçtür. 24 Nisan 1909'da İstanbul'a girerek şehirde denetimi sağlamış ve Meşrutiyet düzenini korumuştur.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:11"}, {"front": "Trablusgarp Savaşı", "back": "Siyasi birliğini geç tamamlayan İtalya'nın sömürgecilik amacıyla 28 Eylül 1911'de Osmanlı toprağı olan Libya'yı işgal etmesiyle başlayan savaştır. Mustafa Kemal Bey ve Enver Bey gibi gönüllü vatansever subayların yerli halkı örgütlemesiyle İtalyan ilerleyişi karada durdurulmuştur.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:12"}, {"front": "Uşi Antlaşması", "back": "Trablusgarp Savaşı'nı sona erdiren ve 18 Ekim 1912 tarihinde imzalanan antlaşmadır. Bu antlaşma ile Trablusgarp ve Bingazi İtalya'ya bırakılmış, böylece Osmanlı Devleti Kuzey Afrika'daki son toprak parçalarını da kaybetmiştir.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:13"}, {"front": "Bâb-ı Âlî Baskını", "back": "İttihat ve Terakki Cemiyeti'nin Birinci Balkan Savaşı'ndaki hezimet ve Edirne'nin kaybı üzerine 23 Ocak 1913'te Kamil Paşa hükümetini devirmek amacıyla gerçekleştirdiği askeri darbedir. Darbe sonrasında sadrazamlığa Mahmut Şevket Paşa getirilmiş ve cemiyetin devlet üzerindeki hakimiyeti kesinleşmiştir.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:14"}, {"front": "Midye-Enez Hattı", "back": "Birinci Balkan Savaşı'nı bitiren 30 Mayıs 1913 tarihli Londra Barış Antlaşması ile belirlenen Osmanlı Devleti'nin Batı sınırıdır. Bu sınır ile Edirne ve Doğu Trakya dahil olmak üzere Osmanlı Devleti Rumeli topraklarının neredeyse tamamını kaybetmiştir.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:15"}, {"front": "İkinci Balkan Savaşı", "back": "Birinci Balkan Savaşı'nda Osmanlı Devleti'nden alınan toprakların paylaşılamaması nedeniyle Balkan devletlerinin Bulgaristan'a karşı açtığı savaştır. Osmanlı Devleti bu karmaşadan yararlanarak Edirne ve Kırklareli'yi Bulgaristan'dan geri almıştır.", "ch": 2, "chTitle": "İkinci Meşrutiyet Dönemi, 31 Mart Vakası ve Yıkıcı Savaşlar", "id": "ataturk-ilkeleri-1:16"}, {"front": "Mondros Mütarekesi (7. ve 24. Maddeleri)", "back": "30 Ekim 1918'de imzalanan mütarekenin 7. maddesi İtilaf Devletlerine güvenliklerini tehdit eden herhangi bir stratejik noktayı işgal etme hakkı verirken, 24. maddesi Altı Vilayet'te karışıklık çıkması halinde bu illerin işgal edilebileceğini hükme bağlamıştır. İtilaf Devletleri bu iki maddeyi gerekçe göstererek Anadolu ve Trakya'da haksız işgaller başlatmıştır.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:17"}, {"front": "Kuvayı Milliye", "back": "Mondros Mütarekesi sonrası başlayan haksız işgaller ve İstanbul Hükümeti'nin yetersizliği karşısında vatanı korumak amacıyla halk tarafından kurulan silahlı yerel direniş birlikleridir. Düşman ilerleyişini yavaşlatarak Rum ve Ermeni çetelerine karşı halkı korumuş ve düzenli ordunun kurulmasına zaman kazandırmıştır.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:18"}, {"front": "İzmir'in İşgali (15 Mayıs 1919)", "back": "Paris Barış Konferansı kararları doğrultusunda Yunanistan'ın İzmir'i işgal etmesi, Türk halkında büyük bir tepki uyandırarak Millî Mücadele ruhunun doğmasında en önemli kırılma noktası olmuştur. Bu işgal üzerine ülke genelinde kitlesel mitingler düzenlenmiş ve direnme azmi kesinleşmiştir.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:19"}, {"front": "Trakya-Paşaeli Müdafaa-i Hukuk Cemiyeti", "back": "Mondros Mütarekesi'nden bir hafta sonra 7 Kasım 1918'de Edirne'de kurulan ve Trakya'nın Yunanistan'a verilmesini önlemeyi amaçlayan millî cemiyettir. Trakya-Paşaeli gazetesini çıkararak halkı bilinçlendirmiş ve bölgesel kongreler düzenleyerek direnişi örgütlemiştir.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:20"}, {"front": "Vilayat-ı Şarkiye Müdafaa-i Hukuk Cemiyeti", "back": "Aralık 1918'de İstanbul'da kurulan ve Doğu Anadolu vilayetlerinin haklarını savunarak bölgede bir Ermeni devleti kurulmasını önlemeyi amaçlayan cemiyettir. Trabzon Muhafaza-i Hukuk-ı Milliye Cemiyeti ile iş birliği yaparak Erzurum Kongresi'nin toplanmasını sağlamıştır.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:21"}, {"front": "Amasya Genelgesi (21-22 Haziran 1919)", "back": "Vatanın bütünlüğünün ve milletin bağımsızlığının tehlikede olduğunu, milletin bağımsızlığını yine milletin azim ve kararının kurtaracağını ilan eden tarihi belgedir. Millî Mücadele'nin gerekçesini, amacını ve yöntemini ortaya koyarak ulusal egemenliğe dayalı yeni bir devlet anlayışını dile getirmiştir.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:22"}, {"front": "Heyet-i Temsiliye", "back": "Erzurum Kongresi'nde kurulan ve Sivas Kongresi'nde tüm vatanı kapsayacak şekilde yetkileri genişletilen, TBMM açılana kadar Millî Mücadele'yi yöneten karar organıdır. Mustafa Kemal Paşa başkanlığında yürütme yetkisini üstlenmiş ve merkezi Ankara'ya taşıyarak milli hareketi sevk etmiştir.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:23"}, {"front": "Amasya Görüşmeleri (20-22 Ekim 1919)", "back": "Temsil Heyeti adına Mustafa Kemal Paşa ile İstanbul Hükümeti Bahriye Nazırı Salih Paşa arasında gerçekleştirilen görüşmelerdir. Bu görüşmeler sonunda imzalanan protokollerle İstanbul Hükümeti Heyet-i Temsiliye'nin hukuki varlığını resmen tanımıştır.", "ch": 3, "chTitle": "Mondros Mütarekesi, İlk İşgaller ve Millî Mücadelenin Doğuşu", "id": "ataturk-ilkeleri-1:24"}, {"front": "Misak-ı Millî", "back": "Son Osmanlı Mebusan Meclisi tarafından 28 Ocak 1920 tarihinde kabul edilen, Türk vatanının parçalanamaz sınırlarını ve tam bağımsızlık ilkesini ilan eden tarihî bildiridir.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:25"}, {"front": "23 Nisan 1920", "back": "Ankara'da Türkiye Büyük Millet Meclisinin açıldığı ve en yaşlı üye Sinop Milletvekili Mehmet Şerif Bey'in konuşmasıyla ilk toplantısının gerçekleştirildiği tarihi gündür.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:26"}, {"front": "Meclis Hükûmeti Sistemi", "back": "Birinci TBMM tarafından benimsenen, Meclis Başkanının aynı zamanda hükûmet başkanı kabul edildiği ve bakanların Meclis tarafından tek tek seçildiği idare sistemidir.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:27"}, {"front": "Hıyanet-i Vataniye Kanunu", "back": "29 Nisan 1920 tarihinde TBMM tarafından kabul edilen, Meclisin meşruiyetine yazılı veya sözlü olarak karşı çıkmayı vatana ihanet sayan ve iç güvenliği sağlamayı amaçlayan kanundur.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:28"}, {"front": "Nisâb-ı Müzakere Kanunu", "back": "5 Eylül 1920 tarihinde TBMM tarafından çıkarılan, Meclisin toplantı ve karar yeter sayıları ile çalışma düzenini belirleyen kanundur.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:29"}, {"front": "Kuvvetler Birliği İlkesi", "back": "Olağanüstü şartlarda hızlı kararlar alıp uygulayabilmek amacıyla yasama, yürütme ve yargı yetkilerinin doğrudan Türkiye Büyük Millet Meclisinde toplanması prensibidir.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:30"}, {"front": "İcra Vekilleri Heyeti", "back": "4 Mayıs 1920 tarihinde 11 üyeden oluşarak göreve başlayan ve Meclis adına yürütme görevini üstlenen ilk Türkiye Büyük Millet Meclisi Hükûmetidir.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:31"}, {"front": "Felah-ı Vatan Grubu", "back": "Son Osmanlı Mebusan Meclisinde Mustafa Kemal Paşa'nın kurulmasını istediği Müdafaa-i Hukuk Grubu yerine milletvekillerince oluşturulan ve Misak-ı Millî'nin kabulünde rol oynayan gruptur.", "ch": 4, "chTitle": "Yeni Türk Devleti'nin Kuruluşu, TBMM ve Millî Mücadelenin Temelleri", "id": "ataturk-ilkeleri-1:32"}, {"front": "Gediz Taarruzu", "back": "Batı Cephesi Komutanı Ali Fuat Paşa'nın Yunan kuvvetlerine karşı başlattığı ancak başarısızlıkla sonuçlanan askerî harekâttır. Bu başarısızlık üzerine Ali Fuat Paşa Moskova elçiliğine atanmış, Batı Cephesi ikiye bölünmüş ve düzenli orduya geçiş kararı hızlandırılmıştır.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:33"}, {"front": "Erkân-ı Harbiye-i Umumiye Vekâleti", "back": "TBMM tarafından 2 Mayıs 1920 tarihinde kurulan ve ordunun sevk ve idaresi, seferberlik işlemleri ile kadrolarını düzenlemekle görevlendirilen bakanlıktır. İlk başkanı Miralay İsmet Bey olup karargâhı Ankara'daki Ziraat Mektebi binasında hizmet vermiştir.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:34"}, {"front": "Millî Savunma Bakanlığı", "back": "2 Mayıs 1920 tarihinde kurulan ve ordunun idare, iaşe, silah, cephane ile her türlü lojistik ihtiyacını karşılamakla görevlendirilen bakanlıktır. İlk bakanı Korgeneral Mustafa Fevzi Paşa olup Osmanlı Devleti'ndeki Harbiye ve Bahriye Bakanlıklarının yetkilerini kendi bünyesinde birleştirmiştir.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:35"}, {"front": "Gümrü Antlaşması", "back": "TBMM Hükûmeti ile Ermenistan arasında 3 Aralık 1920 tarihinde imzalanan ve Doğu Cephesi'ndeki savaşı sona erdiren ilk uluslararası antlaşmadır. Bu antlaşmayla Ermeniler Misak-ı Millî sınırlarını ve Sevr Antlaşması'nın geçersizliğini kabul etmiştir.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:36"}, {"front": "Birinci İnönü Muharebesi", "back": "Yunan ordusunun Ankara'ya ulaşmak amacıyla başlattığı taarruzun Albay İsmet Bey komutasındaki düzenli Türk ordusu tarafından İnönü mevzilerinde durdurulduğu zaferdir. Düzenli ordunun kazandığı bu ilk zaferle birlikte Çerkez Ethem İsyanı da bastırılmıştır.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:37"}, {"front": "Tekâlif-i Milliye Emirleri", "back": "Sakarya Meydan Muharebesi öncesinde Başkomutan Mustafa Kemal Paşa tarafından 7-8 Ağustos 1921 tarihlerinde yayımlanan ve ordunun giyecek, gıda, taşıt ile silah ihtiyaçlarını karşılamayı amaçlayan emirlerdir. Her ilçede kurulan komisyonlar aracılığıyla halkın elindeki malzemelerin belirli oranlarına bedeli sonradan ödenmek üzere el konulmuştur.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:38"}, {"front": "Büyük Taarruz ve Başkomutanlık Meydan Muharebesi", "back": "Türk ordusunun Afyon ve Dumlupınar hattında Yunan kuvvetlerini kuşatarak imha ettiği ve işgalci güçleri Anadolu'dan atmak amacıyla başlattığı genel taarruzdur. Mustafa Kemal Paşa'nın 'Ordular! İlk hedefiniz Akdeniz'dir. İleri!' emriyle gelişen takip harekâtı 9 Eylül 1922'de İzmir'in kurtuluşuyla zaferle sonuçlanmıştır.", "ch": 5, "chTitle": "Türk İstiklal Harbi, Düzenli Ordunun Kurulması ve Cepheler", "id": "ataturk-ilkeleri-1:39"}, {"front": "Mudanya Mütarekesi", "back": "11 Ekim 1922 tarihinde imzalanarak Millî Mücadele'nin askerî safhasını zaferle sona erdiren ve Doğu Trakya'nın savaş yapılmadan kurtarılmasını sağlayan diplomatik antlaşmadır.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:40"}, {"front": "Saltanatın Kaldırılması", "back": "İtilaf Devletleri'nin Lozan Konferansı'na İstanbul Hükûmeti'ni de davet ederek ikilik çıkarma girişimini önlemek amacıyla 1 Kasım 1922'de TBMM tarafından alınan karardır. Bu kararla Osmanlı Hükûmeti'nin hukuki varlığı sona ermiş ve Lozan'da Türk milletini temsil etme yetkisi kesin olarak TBMM Hükûmeti'ne geçmiştir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:41"}, {"front": "İsmet Paşa", "back": "Mudanya Mütarekesi görüşmelerindeki başarısı üzerine Hariciye Vekilliğine getirilerek Lozan Barış Konferansı'na Türk Heyeti Başdelegesi atanan devlet adamıdır. Konferansta kapitülasyonların kaldırılması ve tam bağımsızlık ilkelerinden taviz vermeyerek kararlı bir duruş sergilemiştir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:42"}, {"front": "4 Şubat 1923", "back": "Lozan Barış Konferansı'nın birinci döneminde İtilaf Devletleri'nin kapitülasyonlar ve Osmanlı dış borçları konusundaki dayatmalarının Türk heyetince reddedilmesi üzerine görüşmelerin kesintiye uğradığı tarihtir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:43"}, {"front": "Türkiye İktisat Kongresi", "back": "Lozan görüşmelerinin kesintiye uğradığı dönemde İzmir'de toplanan ve Misak-ı İktisadi kararlarını kabul eden kongredir. Siyasi bağımsızlığın ekonomik zaferlerle taçlandırılması gerektiğini ilan ederek kapitülasyonların kaldırılması konusundaki kararlılığı vurgulamıştır.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:44"}, {"front": "24 Temmuz 1923", "back": "İsviçre'nin Lozan şehrindeki Rumine Sarayı'nda imzalanan ve Türkiye Cumhuriyeti'nin uluslararası hukuktaki kuruluş senedi niteliğini taşıyan barış antlaşmasının tarihidir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:45"}, {"front": "Kapitülasyonlar", "back": "Yabancı devlet uyruklularına tanınan adli, mali, idari ve ekonomik ayrıcalıkların tamamıdır. Lozan Barış Antlaşması ile tüm sonuçlarıyla kesin olarak kaldırılmış ve Türkiye'nin ekonomik bağımsızlığı tescil edilmiştir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:46"}, {"front": "Karaağaç", "back": "Lozan Barış Antlaşması müzakerelerinde Yunanistan'dan istenen tamirat bedeli ve savaş tazminatı karşılığında Türkiye'ye devredilen Doğu Trakya bölgesidir.", "ch": 6, "chTitle": "Lozan Barış Konferansı ve Türkiye Cumhuriyeti'nin Kuruluş Belgesi", "id": "ataturk-ilkeleri-1:47"}, {"front": "Terakkiperver Cumhuriyet Fırkası", "back": "17 Kasım 1924 tarihinde Kâzım Karabekir, Ali Fuat Cebesoy, Rauf Orbay, Refet Bele ve Adnan Adıvar tarafından kurulan Türkiye Cumhuriyeti'nin ilk muhalefet partisidir. Parti, Şeyh Sait İsyanı ile ilişkilendirildiği gerekçesiyle 5 Haziran 1925 tarihinde kapatılmıştır.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:48"}, {"front": "Serbest Cumhuriyet Fırkası", "back": "1929 Dünya Ekonomik Bunalımı sonrası hükûmeti denetlemek amacıyla Mustafa Kemal Paşa'nın teşvikiyle 12 Ağustos 1930'da Ali Fethi Okyar liderliğinde kurulan muhalefet partisidir. Parti, siyasi ortamın gerginleşmesi üzerine 17 Kasım 1930'da kendisini feshetmiştir.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:49"}, {"front": "Takrir-i Sükûn Kanunu", "back": "Şeyh Sait İsyanı'nın ardından ülkede asayiş ve otoriteyi yeniden sağlamak amacıyla 4 Mart 1925 tarihinde kabul edilen kanundur. Bu kanun doğrultusunda hükûmete geniş yetkiler verilmiş ve İstiklal Mahkemeleri kurulmuştur.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:50"}, {"front": "Dokuz Umde", "back": "Mustafa Kemal Paşa'nın 8 Nisan 1923 tarihinde Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti Başkanı sıfatıyla yayımladığı seçim beyannamesidir. Bu beyanname daha sonra kurulan Halk Fırkası'nın temel program ilkelerini oluşturmuştur.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:51"}, {"front": "Büyük Nutuk", "back": "Mustafa Kemal Atatürk'ün 1919-1927 yılları arasındaki tarihî gelişmeleri ve Millî Mücadele sürecini anlattığı, 15-23 Ekim 1927 tarihlerinde Cumhuriyet Halk Fırkası'nın II. Kurultayı'nda okuduğu eserdir.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:52"}, {"front": "Atatürk Dönemi Toprak Reformu Çalışmaları", "back": "Topraksız köylüyü mülk sahibi yapmak ve ağalık rejiminin köylü üzerindeki baskısını kırmak amacıyla yürütülen çalışmalardır. Atatürk, 1 Kasım 1937 meclis konuşmasında büyük çiftlik sahiplerinin arazilerinin sınırlandırılması gerektiğini belirtmiştir.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:53"}, {"front": "Birinci Genel Müfettişlik", "back": "Doğu Anadolu'da feodal yapının olumsuz etkilerini azaltmak, huzur ve devlet otoritesini tesis etmek amacıyla merkezi Diyarbakır olarak kurulan idari teşkilattır. İlk müfettişlik görevine İbrahim Tali Öngören atanmıştır.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:54"}, {"front": "Celal Bayar (1937)", "back": "İsmet İnönü'nün istifasının ardından 1 Kasım 1937 tarihinde başbakanlık görevine getirilen devlet adamıdır. Celal Bayar, Atatürk döneminin son başbakanı olarak görev yapmıştır.", "ch": 7, "chTitle": "Atatürk Dönemi İç Politika ve Siyasi Hayattaki Gelişmeler", "id": "ataturk-ilkeleri-1:55"}, {"front": "Yurtta Sulh, Cihanda Sulh", "back": "Mustafa Kemal Atatürk'ün 1931 yılında beyan ettiği ve Cumhuriyet'in bölgesel ile küresel barışı koruma gayesini simgeleyen temel dış politika ilkesidir. Bu ilke doğrultusunda Türkiye, komşularıyla dostane ilişkiler geliştirmiş ve uluslararası barış paktlarına katılmıştır.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:56"}, {"front": "Musul Meselesi", "back": "Lozan'da çözülemeyip İngiltere ile yaşanan ve 5 Haziran 1926 Ankara Antlaşması ile karara bağlanan sınır uyuşmazlığıdır. Antlaşma ile Musul Irak'a bırakılmış, buna karşılık Irak petrol gelirlerinin yüzde 10'u 25 yıl süreyle Türkiye'ye verilmiştir.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:57"}, {"front": "Kellogg-Briand Paktı", "back": "1928'de ABD ve Fransa öncülüğünde imzalanan ve savunma haricindeki savaşları kanun dışı sayan uluslararası barış belgesidir. Türkiye, barışçı dış politikasına uygun olarak bu anlaşmayı 19 Ocak 1929'da onaylayarak kabul etmiştir.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:58"}, {"front": "Milletler Cemiyeti'ne Üyelik (1932)", "back": "Türkiye'nin uluslararası barış ve iş birliğine katkı sunmak amacıyla 18 Temmuz 1932'de katıldığı küresel örgüttür. Atatürk'ün talebi üzerine Türkiye, kendi başvurusuyla değil cemiyetin resmi davetiyle üyeliğe kabul edilmiştir.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:59"}, {"front": "Balkan Antantı (9 Şubat 1934)", "back": "Türkiye, Yunanistan, Romanya ve Yugoslavya arasında imzalanan ve Balkanlar'daki mevcut sınırları karşılıklı garanti altına alan güvenlik ittifakıdır. Bu pakt ile bölge devletleri revizyonist tehditlere karşı sınırlarındaki statükoyu korumayı amaçlamıştır.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:60"}, {"front": "Montrö Boğazlar Sözleşmesi (20 Temmuz 1936)", "back": "20 Temmuz 1936'da imzalanarak uluslararası Boğazlar Komisyonunu kaldıran ve Boğazlarda tam Türk egemenliğini sağlayan antlaşmadır. Türkiye bu sözleşmeyle Boğazlar bölgesini askerileştirme ve geçişleri kontrol etme hakkı kazanmıştır.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:61"}, {"front": "Sâdâbât Paktı (8 Temmuz 1937)", "back": "Tahran'da Türkiye, İran, Irak ve Afganistan arasında imzalanan bölgesel saldırmazlık ve güvenlik paktıdır. İtalya'nın Doğu Akdeniz ve Orta Doğu'daki yayılmacı politikasına karşı doğu sınırlarında barış ve istikrarı korumayı hedeflemiştir.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:62"}, {"front": "Hatay Meselesi", "back": "Lozan'da Suriye sınırı dışında kalan İskenderun Sancağı'nın tam bağımsızlık kazanıp Türkiye'ye katılması sürecidir. Atatürk'ün yürüttüğü kararlı diplomasi neticesinde 1938'de Hatay Devleti kurulmuş, 1939'da ise ana vatana bağlanmıştır.", "ch": 8, "chTitle": "Atatürk Dönemi Türk Dış Politikası (1923-1938)", "id": "ataturk-ilkeleri-1:63"}], "quiz": [{"q": "Osmanlı Devleti'nin 17. ve 18. yüzyıl tarih yazımında geleneksel olarak öne çıkan \"gerileme paradigması\" yerine, günümüz tarihçiliğinde benimsenen modern yaklaşım aşağıdakilerden hangisidir?", "o": [{"t": "Devleti yıkılmaya giden çaresiz bir yapı değil, askeri bir imparatorluktan Bürokratik ve modern bir devlete evrilen dönüşüm süreci olarak görmek", "ok": true, "why": "Modern tarih yazımı, bu dönemi tek taraflı bir çöküş değil, devlet yapısının kadimden cedide doğru dönüşerek kendini yenilediği Bürokratik bir süreç olarak tanımlar."}, {"t": "Devletin kuruluş dönemindeki askeri ve toplumsal kurumlarına aynen geri dönerek ıslahat yapabileceğini kabul etmek", "ok": false, "why": "Geleneksel risalelerde iddialar bu yönde olsa da modern paradigma eski düzene dönüşün imkansızlığını ve yenileşmenin kaçınılmazlığını vurgular.", "p": true}, {"t": "Avrupa merkezci görüşü tamamen reddedip Osmanlı Devleti'nin hiç kriz yaşamadığını iddia etmek", "ok": false, "why": "Modern yaklaşım ekonomik ve siyasi krizlerin varlığını reddetmez; aksine krizlerin devleti dönüşüme zorlayan dinamikler olduğunu kabul eder."}, {"t": "17. yüzyılı doğrudan Cumhuriyet rejimine geçişin tamamlandığı nihai evre olarak nitelendirmek", "ok": false, "why": "17. yüzyıl dönüşümün temellerinin atıldığı ıslahatlar çağıdır; Cumhuriyet ise bu uzun dönüşümün nihai sonucudur."}], "hint": "Devletin kurumlarının çöküşünden ziyade yeni idari biçimlere evrilme kapasitesini dikkate alan görüşü düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "a55ua0", "ch": 0}, {"q": "İttihat ve Terakki Cemiyeti'nin 1902 Paris Kongresi'nde yaşadığı bölünmede, Prens Sabahattin önderliğindeki grubun Ahmet Rıza Bey grubundan ayrıştığı temel nokta aşağıdakilerden hangisidir?", "o": [{"t": "Rejim değişikliği sürecinde adem-i merkeziyetçiliği ve dış müdahaleyi savunmaları", "ok": true, "why": "Prens Sabahattin ve arkadaşları yerel yönetimi güçlendiren adem-i merkeziyetçi yapıyı ve İngiliz desteğiyle ihtilal yapmayı savunurken, Ahmet Rıza grubu merkezi yönetimi ve yabancı müdahalesiz değişimi savunmuştur."}, {"t": "Meşrutiyet rejimi yerine doğrudan saltanatın kaldırılmasını ve cumhuriyet ilan edilmesini talep etmeleri", "ok": false, "why": "Bu dönemde her iki grup da Kanun-ı Esasi'nin yeniden yürürlüğe konması ve Meşrutiyet idaresi üzerinde durmaktaydı."}, {"t": "Ordu mensuplarının cemiyete üye yapılmasını tamamen yasaklamak istemeleri", "ok": false, "why": "Kongredeki temel fikir ayrılığı ordunun rolünden ziyade idari yapılanma ve yabancı devlet müdahalesine bakış açısında ortaya çıkmıştır."}, {"t": "Makedonya bölgesindeki komitacılık faaliyetlerine son vererek basın yayın çalışmalarını durdurmaları", "ok": false, "why": "Her iki taraf da basın-yayın ve propaganda faaliyetlerini muhalefetlerinin odağında tutmaya devam etmişlerdir."}], "hint": "Yönetim erkinin yerelleşmesi ve dış güçlerin süreçteki rolüne dair görüş ayrılıklarını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1wnqw4b", "ch": 0}, {"q": "13 Nisan 1909'da gerçekleşen 31 Mart Vakası'nın bastırılmasının ardından Meclis-i Mebusan'ın fetvaya dayanarak tahttan indirdiği Osmanlı padişahı aşağıdakilerden hangisidir?", "o": [{"t": "Sultan II. Abdülhamid", "ok": true, "why": "İsyanın bastırılması ve Hareket Ordusu'nun İstanbul'da denetimi sağlamasının ardından 27 Nisan 1909'da çıkarılan fetvayla II. Abdülhamid tahttan indirilmiştir."}, {"t": "Sultan V. Mehmed Reşad", "ok": false, "why": "V. Mehmed Reşad, II. Abdülhamid'in tahttan indirilmesinden sonra meclis kararıyla tahta çıkarılan padişahtır.", "p": true}, {"t": "Sultan VI. Mehmed Vahdettin", "ok": false, "why": "VI. Mehmed Vahdettin, Osmanlı Devleti'nin son padişahı olup 1922 yılında saltanatın kaldırılmasıyla tahtını kaybetmiştir."}, {"t": "Sultan II. Osman", "ok": false, "why": "II. Osman (Genç Osman), 17. yüzyılda yeniçeri isyanı sonucu katledilen padişahtır."}], "hint": "33 yıllık hükümdarlığı Meşrutiyet'in ilanı ve Hareket Ordusu'nun İstanbul'a girişiyle sona eren padişahı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "ngn5i2", "ch": 0}, {"q": "Milli Mücadele döneminde işgallere karşı halkın kendiliğinden oluşturduğu Kuvayı Milliye birliklerinin sağladığı en kritik askeri katkı aşağıdakilerden hangisidir?", "o": [{"t": "Düşman kuvvetlerini belirli hatlarda oyalayarak TBMM'nin düzenli orduyu kurmasına zaman kazandırmak", "ok": true, "why": "Kuvayı Milliye düşmanı tamamen yurttan atacak güce sahip olmasa da ilerleyişi yavaşlatmış ve TBMM'ye düzenli ordunun örgütlenmesi için ihtiyaç duyduğu süreyi sağlamıştır."}, {"t": "Lozan Barış Konferansı'nda Türkiye'yi askeri delegasyon olarak temsil etmek", "ok": false, "why": "Lozan'daki diplomatik temsil TBMM hükümeti ve Dışişleri Bakanlığı tarafından yürütülmüştür."}, {"t": "İtilaf Devletleri donanmasını Çanakkale ve İstanbul boğazlarından tamamen söküp atmak", "ok": false, "why": "Kuvayı Milliye yerel gerilla kuvvetleri niteliğindeydi ve İtilaf donanmasını boğazlardan çıkaracak deniz gücüne sahip değildi."}, {"t": "Sevr Antlaşması'nın uluslararası alanda hukuken geçersiz kılınmasını doğrudan sağlamak", "ok": false, "why": "Sevr'in hukuken ve fiilen geçersiz kılınması düzenli ordunun zaferleri ve Lozan Antlaşması ile gerçekleşmiştir."}], "hint": "Düzensiz birliklerin işgalci orduların hızlı ilerleyişi karşısındaki zaman kazandırıcı rolünü değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "qid": "cac7xi", "ch": 0}, {"q": "Birinci TBMM'nin benimsediği Meclis Hükümeti sisteminde yasama, yürütme ve yargı yetkilerinin Mecliste toplanmasının (Kuvvetler Birliği) temel gerekçesi aşağıdakilerden hangisidir?", "o": [{"t": "Olağanüstü savaş koşullarında kararların hızlıca alınmasını ve derhal uygulanmasını sağlamak", "ok": true, "why": "Vatanın işgal altında olduğu ve iç isyanların sürdüğü olağanüstü dönemde yetkilerin tek elde toplanması hızlı karar alma ihtiyacından doğmuştur."}, {"t": "Çok partili siyasi hayata geçişi hızlandırmak ve parti içi muhalefeti engellemek", "ok": false, "why": "Kuvvetler birliği ilkesi parti içi süreçlerden ziyade devlet mekanizmasının işgal koşullarındaki sevk ve idaresiyle ilgilidir."}, {"t": "İstanbul Hükümeti ile idari yetkileri eşit olarak paylaşmak", "ok": false, "why": "TBMM, İstanbul Hükümeti'ni gayrimeşru saymış ve yetki paylaşımına gitmeyerek ulusal iradeyi tek temsilci kılmıştır."}, {"t": "Avrupa devletlerinin anayasal modellerini birebir kopyalamak", "ok": false, "why": "Bu tercih dış modellerin taklidinden ziyade Milli Mücadele'nin pratik ve olağanüstü ihtiyaçlarından kaynaklanmıştır."}], "hint": "Savaş zamanlarında karar alma mekanizmalarının hızlandırılması ihtiyacını göz önüne alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "43j8n8", "ch": 0}, {"q": "Amasya Genelgesi'nde yer alan \"Milletin bağımsızlığını yine milletin azim ve kararı kurtaracaktır\" maddesi Milli Mücadele tarihi açısından nasıl bir dönüşümü simgeler?", "o": [{"t": "Mücadelenin dayanağının padişah iradesi değil, ulusal irade olduğunu belirterek üstü kapalı biçimde milli egemenliğe işaret etmesi", "ok": true, "why": "Bu ifade, Kurtuluş Savaşı'nın yöntemini ve amacını belirlerken kararın millete ait olduğunu vurgulayarak egemenlik anlayışında tarihi bir değişim başlatmıştır."}, {"t": "Manda ve himaye fikrinin kesin olarak kabul edildiğini duyurması", "ok": false, "why": "Amasya Genelgesi manda fikrini değil, aksine tam bağımsızlığı ve milli iradeyi esas almaktadır."}, {"t": "Osmanlı Mebusan Meclisi'nin İstanbul'da süresiz toplanmasını garanti altına alması", "ok": false, "why": "Genelge, İstanbul Hükümeti'nin sorumluluğunu yerine getirmediğini tescil ederek milli bir heyetin kurulmasını önermiştir."}, {"t": "Kuvayı Milliye Birlikleri'nin ilga edilerek İtilaf Devletleri'ne teslim olunacağını bildirmesi", "ok": false, "why": "Amasya Genelgesi bir teslimiyet belgesi değil, işgallere karşı ulusal direnişin ihtilal bildirisi niteliğindedir."}], "hint": "Karar alma yetkisinin şahsi saltanattan halkın kendi iradesine geçişini ifade eden kavrama odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1pyc8bl", "ch": 0}, {"q": "Ekim 1920'de gerçekleşen Gediz Taarruzu'nun başarısızlıkla sonuçlanması, Milli Mücadele'nin askeri teşkilatlanmasında hangi radikal kararın alınmasına yol açmıştır?", "o": [{"t": "Düzensiz Kuvayı Milliye birliklerinin sevk-idare yetersizliği görülerek vakit kaybetmeden düzenli orduya geçilmesi", "ok": true, "why": "Gediz Taarruzu'ndaki başarısızlık, emri-komuta zincirinden yoksun birliklerle Yunan ordusunun durdurulamayacağını kanıtlamış ve düzenli ordunun kurulmasını zorunlu kılmıştır."}, {"t": "Batı Cephesi'ndeki tüm askeri birliklerin terhis edilerek mücadelenin diplomatik yollarla sürdürülmesi", "ok": false, "why": "Gediz sonrasında askeri mücadele terk edilmemiş, aksine daha disiplinli bir askeri yapı kurulmuştur."}, {"t": "Milli Savunma Bakanlığı'nın kapatılarak yetkilerinin Kolordu komutanlıklarına devredilmesi", "ok": false, "why": "Aksine, karar sonrasında merkezi askeri bürokrasi ve komuta kademesi güçlendirilmiştir."}, {"t": "Sevr Antlaşması şartlarının kabul edilerek Mondros Mütarekesi çizgisine dönülmesi", "ok": false, "why": "TBMM ve askeri liderlik Sevr'i reddetmeye ve bağımsızlık hedefine düzenli orduyla yürümeye karar vermiştir."}], "hint": "Düzensiz seyyar kuvvetlerin disiplinsizliği karşısında merkezi ve hiyerarşik bir askeri yapının kurulması gerekliliğini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1twmphr", "ch": 0}, {"q": "İtilaf Devletleri'nin Lozan Barış Konferansı'na hem TBMM Hükümeti'ni hem de İstanbul Hükümeti'ni birlikte davet etmesi üzerine TBMM'nin ikilik çıkarılmasını engellemek amacıyla 1 Kasım 1922'de aldığı tarihi karar aşağıdakilerden hangisidir?", "o": [{"t": "Saltanatın kaldırılması ve halifeliğin saltanattan ayrılması", "ok": true, "why": "İtilaf Devletleri'nin Türk tarafını bölme planına yanıt olarak TBMM, 1 Kasım 1922'de saltanatı kaldırarak Türk milletinin tek temsilcisinin Ankara Hükümeti olduğunu hukuken tescil etmiştir."}, {"t": "Hıyanet-i Vataniye Kanunu'nun yürürlükten kaldırılması", "ok": false, "why": "Hıyanet-i Vataniye Kanunu 1920'de çıkarılmış olup Meclis'in meşruiyetini korumayı amaçlayan bir kanundur."}, {"t": "Cumhuriyetin ilan edilmesi ve kabine sistemine geçilmesi", "ok": false, "why": "Cumhuriyetin ilanı Saltanatın kaldırılmasından yaklaşık bir yıl sonra, 29 Ekim 1923'te gerçekleşmiştir."}, {"t": "Takrir-i Sükun Kanunu'nun kabul edilerek örfi idare aşağıdakilerden hangisidir?", "o": [{"t": "Çelebiler Çağı", "ok": true, "why": "Bu dönem, kâtip sınıfının Osmanlı dışındaki gelişmeleri merak ederek geleneksel kalıpların ötesinde yeni fikirleri kavramaya başladığı dönemi temsil eder."}, {"t": "Münevverler Çağı", "ok": false, "why": "Bu kavram daha çok 19. yüzyıldaki Batılılaşma etkisindeki aydın bürokrat kuşağını ifade etmektedir."}, {"t": "Sefirler ve Reîsülküttâplar Çağı", "ok": false, "why": "Bu evre, diplomasinin ön plana çıktığı ve hariciye sınıfının belirleyici olduğu farklı bir dönemi tanımlar."}, {"t": "Kahramanlar Çağı", "ok": false, "why": "Bu adlandırma, devletin kuruluş ve yükselme dönemindeki askeri liderlik ve fetih sürecini tanımlamada kullanılır."}], "hint": "Bu dönemin adı, terbiye, görgü ve entelektüel merakı temsil eden geleneksel unvandan türetilmiştir.", "type": "multiple_choice", "a": "", "why": "", "qid": "5e8kjo", "ch": 2}, {"q": "23 Temmuz 1908'de II. Meşrutiyet'in ilan edilmesinden sonra İttihat ve Terakki Cemiyeti'nin yönetimine ve uygulamalarına tepki olarak başlayan siyasi olay aşağıdakilerden hangisidir?", "o": [{"t": "31 Mart Vakası", "ok": true, "why": "Rumi takvime göre 31 Mart 1325'te patlak veren bu isyan, meşrutiyet rejimine ve İttihatçıların iktidar nüfuzuna karşı gelişen en belirgin tepkidir."}, {"t": "Patrona Halil İsyanı", "ok": false, "why": "Bu ayaklanma 18. yüzyılda Lale Devri'ni sona erdiren toplumsal ve askeri bir huzursuzluktur."}, {"t": "Kabakçı Mustafa İsyanı", "ok": false, "why": "Bu olay III. Selim dönemi ıslahatlarına ve Nizam-ı Cedit ordusuna karşı gerçekleştirilmiş bir başkaldırıdır."}, {"t": "Vaka-i Hayriye", "ok": false, "why": "Bu gelişme II. Mahmud döneminde Yeniçeri Ocağı'nın kaldırılmasını ifade eden devlet hamlesidir."}], "hint": "Olay, Rumi takvimdeki meydana geliş tarihine atıfla anılmaktadır.", "type": "multiple_choice", "a": "", "why": "", "qid": "1jsdwu7", "ch": 2}, {"q": "I. Dünya Savaşı sonunda Almanya'nın sömürgelerini kaybetmesine, askeri sınırlamalara tabi tutulmasına ve ağır finansal yükümlülükler üstlenmesine yol açan antlaşma aşağıdakilerden hangisidir?", "o": [{"t": "Versay Barış Antlaşması", "ok": true, "why": "Savaş sonrasında Müttefik Devletler ile Almanya arasında imzalanan bu antlaşma, Almanya'ya dönük son derece ağır yaptırımlar içermektedir."}, {"t": "Neuilly Antlaşması", "ok": false, "why": "Bu antlaşma I. Dünya Savaşı sonrasında Bulgaristan ile imzalanmıştır."}, {"t": "Trianon Antlaşması", "ok": false, "why": "Bu metin I. Dünya Savaşı'nın ardından Macaristan sınırlarını ve yükümlülüklerini belirlemiştir."}, {"t": "St. Germain Barış Antlaşması", "ok": false, "why": "Bu düzenleme Avusturya İmparatorluğu'nun savaştan sonraki statüsünü tayin etmek üzere imzalanmıştır."}], "hint": "Fransa'da tarihi bir sarayda imzalanan ve II. Dünya Savaşı'na giden süreci tetikleyen barış metnini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "120t1kb", "ch": 2}, {"q": "Aşağıdakilerden hangisi Çanakkale Zaferi'nin küresel düzeyde yarattığı siyasi ve ekonomik neticelerden biri değildir?", "o": [{"t": "Osmanlı Boğazları yönetimi için uluslararası bir komisyonun kurulması", "ok": true, "why": "Boğazlar Komisyonu'nun kurulması Çanakkale Zaferi'nin değil, savaştan sonra imzalanan mütareke ve barış taslaklarının bir sonucudur."}, {"t": "Rusya'ya yardım ulaştırılamaması sebebiyle Çarlık rejiminin çöküş sürecinin hızlanması", "ok": false, "why": "Müttefiklerin Boğazları geçememesi Rusya'daki ekonomik ve askeri krizi derinleştirerek Bolşevik İhtilali'ne zemin hazırlamıştır."}, {"t": "İngiltere ve Fransa'nın sömürgeleri üzerindeki sarsılmaz askeri itibarının darbe alması", "ok": false, "why": "Çanakkale'de alınan yenilgi, Batılı güçlerin yenilmezliği algısını kırarak sömürgelerde bağımsızlık düşüncesini cesaretlendirmiştir."}, {"t": "İngiltere'de savaş harcamalarının getirdiği baskıyla hükümet krizinin yaşanması", "ok": false, "why": "Uzayan savaş ve ağır maliyetler İngiliz iç siyasetinde hükümet değişikliklerine yol açmıştır."}], "hint": "Çanakkale Savaşı Osmanlı Devleti'nin zaferiyle sonuçlandığından, Boğazlar üzerindeki kontrol derhal Müttefiklerin eline geçmemiştir.", "type": "multiple_choice", "a": "", "why": "", "qid": "rxc6d0", "ch": 2}, {"q": "XVII. yüzyıl Osmanlı düşünürü Katip Çelebi'nin, devlet mekanizmasındaki aksaklıkları ve bürokratların basiretsizliğini cesur bir dille eleştirerek çözüm yolları sunduğu eseri aşağıdakilerden hangisidir?", "o": [{"t": "Düstûrü'l-Amel li Islahı'l-Halel", "ok": true, "why": "Katip Çelebi bu risalesinde devlet yapısındaki bozulmaları bir tıp benzetmesiyle ele almış ve ıslahat önerileri sunmuştur."}, {"t": "Keşfü'z-Zünûn", "ok": false, "why": "Bu eser binlerce yazma eseri ve yazarlarını içeren geniş bir bibliyografya çalışmasıdır."}, {"t": "Künhü’l-Ahbar", "ok": false, "why": "Bu çalışma Gelibolulu Mustafa Âlî tarafından kaleme alınmış genel bir tarih eseridir."}, {"t": "Asafnâme", "ok": false, "why": "Sadrazam Lütfi Paşa'ya ait olan bu eser devlet yönetimi ilkelerini ele alır."}], "hint": "Eserin adı Türkçe karşılık olarak 'Bozuklukların Düzeltilmesinde Uygulanacak Düsturlar' anlamına gelmektedir.", "type": "multiple_choice", "a": "", "why": "", "qid": "rui2ql", "ch": 2}, {"q": "Osmanlı Devleti ile İtalya arasında gerçekleşen Trablusgarp Savaşı'nı resmi olarak sona erdiren diplomatik antlaşma aşağıdakilerden hangisidir?", "o": [{"t": "Uşi Antlaşması", "ok": true, "why": "1912 yılında imzalanan bu antlaşma ile Osmanlı Devleti Kuzey Afrika'daki son toprak parçası olan Trablusgarp ve Bingazi'yi İtalya'ya bırakmıştır."}, {"t": "Bükreş Antlaşması", "ok": false, "why": "Bu antlaşma Balkan Savaşları sonrasında Balkan devletlerinin kendi aralarında yaptığı paylaşımı kapsar."}, {"t": "Londra Antlaşması", "ok": false, "why": "I. Balkan Savaşı'nı sona erdiren ve Midye-Enez hattını sınır kabul eden düzenlemedir."}, {"t": "Atina Antlaşması", "ok": false, "why": "Balkan Savaşları sonrasında Osmanlı Devleti ile Yunanistan arasında imzalanan ikili antlaşmadır."}], "hint": "İsviçre'de imzalanan ve Osmanlı Devleti'nin Kuzey Afrika varlığını sona erdiren antlaşmayı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "zjqi64", "ch": 2}, {"q": "I. TBMM Hükûmeti'nin açılışından sonra Anadolu'da hızla yayılan iç ayaklanmaları bastırmak ve kamu düzenini tesis etmek amacıyla 29 Nisan 1920'de kabul edilen kanun aşağıdakilerden hangisidir?", "o": [{"t": "Hıyanet-i Vataniye Kanunu", "ok": true, "why": "Meclisin meşruiyetine karşı çıkan her türlü ayaklanma ve direnci yasaklayan ve ağır cezai yaptırımlar getiren temel yasal düzenlemedir."}, {"t": "Takrir-i Sükûn Kanunu", "ok": false, "why": "Bu kanun 1925 yılında Şeyh Sait İsyanı sonrasında devlet otoritesini yeniden kurmak amacıyla çıkarılmıştır."}, {"t": "Nisab-ı Müzakere Kanunu", "ok": false, "why": "TBMM'nin çalışma esaslarını ve toplantı yeter sayısını düzenleyen iç tüzük niteliğinde bir kanundur."}, {"t": "Men-i Müskirat Kanunu", "ok": false, "why": "Savaş dönemi tasarruf tedbirleri kapsamında alkollü içeceklerin üretim ve tüketimini engellemeye yönelik yasadır."}], "hint": "Vatana ihanet edenlerin cezalandırılmasını öngören yasayı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "x4obr3", "ch": 2}, {"q": "Milli Mücadele Dönemi'nde işgalci Batılı devletlerin kendi güvenliğine tehdit oluşturması ve kendi bünyesindeki Türk-Müslüman unsurlara sempatik görünme arzusuyla Ankara Hükûmeti'ne finansal ve askeri destek sağlayan ülke aşağıdakilerden hangisidir?", "o": [{"t": "Sovyet Rusya", "ok": true, "why": "Bolşevik yönetimi, ortak düşman olarak gördüğü Müttefik Devletler'e karşı Milli Mücadele'ye parasal ve cephane yardımı yapmıştır."}, {"t": "Almanya", "ok": false, "why": "Almanya, I. Dünya Savaşı'ndan yenik ayrıldığı için Mondros sonrası süreçte destek verecek durumda değildi."}, {"t": "Bulgaristan", "ok": false, "why": "Bulgaristan savaştan yenik çıkmış ve kendi toprak kayıplarıyla mücadele etmek durumunda kalmıştır."}, {"t": "Arnavutluk", "ok": false, "why": "Arnavutluk o dönemde kendi bağımsızlığını ve sınırlarını korumaya çalışan küçük bir Balkan devletidir."}], "hint": "Çarlık rejiminin yıkılmasından sonra kurulan ve Batılı devletlerle rekabet halinde olan komşu devleti hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1mbx5jq", "ch": 2}, {"q": "Milli Mücadele Dönemi'nde Ankara'da yayımlanan, TBMM Hükûmeti'nin yarı resmî yayın organı kabul edilen ve 1934 yılında adını 'Ulus' olarak değiştiren gazete aşağıdakilerden hangisidir?", "o": [{"t": "Hâkimiyet-i Milliye", "ok": true, "why": "Mustafa Kemal Paşa'nın Ankara'ya gelişinden sonra çıkarılan bu gazete, Anadolu hareketinin temel yayın organı olmuştur."}, {"t": "İrade-i Milliye", "ok": false, "why": "Sivas Kongresi kararlarını duyurmak amacıyla Sivas'ta çıkarılan ilk gazeteydi."}, {"t": "Minber", "ok": false, "why": "Mondros sonrasında İstanbul'da Ali Fethi (Okyar) ve Mustafa Kemal tarafından çıkarılan gazetedir."}, {"t": "Tasvir-i Efkâr", "ok": false, "why": "Şinasi tarafından Tanzimat Dönemi'nde İstanbul'da kurulmuş tarihi bir basın organıdır."}], "hint": "İsmi 'Millet Egemenliği' anlamına gelen bu yayın organı Ankara merkezli mücadeleyi seslendirmiştir.", "type": "multiple_choice", "a": "", "why": "", "qid": "bvnlpa", "ch": 2}, {"q": "28 Ocak 1920'de Son Osmanlı Mebusan Meclisi tarafından kabul edilen, Türk vatanının sınırlarını çizen ve siyasi-ekonomik bağımsızlığın asgari şartlarını belirleyen tarihi bildiri aşağıdakilerden hangisidir?", "o": [{"t": "Misak-ı Milli", "ok": true, "why": "'Milli And' olarak da bilinen bu kararlar metni, Türkiye Cumhuriyeti'nin temel sınırlarını ve bağımsızlık koşullarını ilke edinmiştir."}, {"t": "Sened-i İttifak", "ok": false, "why": "1808 yılında II. Mahmud ile ayanlar arasında yapılan yetki paylaşımı sözleşmesidir."}, {"t": "Amasya Tamimi", "ok": false, "why": "Milli Mücadele'nin gerekçe, amaç ve yöntemini ilk kez belirten ihtilal beyannamesidir."}, {"t": "Kanun-ı Esasi", "ok hoice", "a": "", "why": "", "qid": "1n6ybah", "ch": 5}, {"q": "I. TBMM açıldıktan sonra iç huzuru sağlamak, bozgunculuğu önlemek ve TBMM'ye karşı çıkan ayaklanmaları bastırmak amacıyla 29 Nisan 1920'de kabul edilen yasal düzenleme aşağıdakilerden hangisidir?", "o": [{"t": "Hıyanet-i Vataniye Kanunu", "ok": true, "why": "TBMM'nin otoritesini korumak ve vatana ihanet eden isyancıları cezalandırmak için çıkarılan ilk sert önlem kanunudur."}, {"t": "Takrir-i Sükûn Kanunu", "ok": false, "why": "Şeyh Sait İsyanı sonrasında 1925 yılında ülke genelinde asayişi yeniden kurmak amacıyla çıkarılmıştır."}, {"t": "Nisab-ı Müzakere Kanunu", "ok": false, "why": "TBMM'nin çalışma usul ve esaslarını, iç tüzüğünü belirlemek üzere çıkarılan ilk düzenlemedir."}, {"t": "Men-i Müskirat Kanunu", "ok": false, "why": "Savaş dönemi bütçesine katkı sağlamak ve içki kullanımını yasaklamak amacıyla çıkarılan kanundur."}], "hint": "Meclisin varlığına ve meşruiyetine kasteden hareketleri vatan hainliği kapsamında değerlendiren yasayı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1pszx1h", "ch": 5}, {"q": "Mondros Mütarekesi'nin ardından İstanbul'da siyasi faaliyetlerini sürdüren Mustafa Kemal Paşa'nın Ali Fethi (Okyar) Bey ile birlikte çıkardığı gazete aşağıdakilerden hangisidir?", "o": [{"t": "Minber", "ok": true, "why": "Mütareke İstanbul'unda halkı bilinçlendirmek ve fikirlerini yaymak amacıyla iki yakın arkadaşın sermayesiyle kurulan gazetedir."}, {"t": "Tercüman-ı Ahvâl", "ok": false, "why": "Şinasi ve Agâh Efendi tarafından çıkarılan ilk özel Türkçe gazetedir."}, {"t": "Ceride-i Havadis", "ok": false, "why": "İngiliz William Churchill tarafından çıkarılan yarı resmî Osmanlı gazetesidir."}, {"t": "Sabah", "ok": false, "why": "Mütareke döneminde İstanbul'da yayımlanan ve genellikle Millî Mücadele karşıtı tutumuyla bilinen basın organlarından biridir."}], "hint": "Camiilerde hatiplerin konuşma yaptığı yüksekçe yeri ifade eden kelime ile aynı adı taşıyan gazeteyi arayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "kd8ay3", "ch": 5}, {"q": "I. Dünya Savaşı sonunda Bulgaristan'ın İttifak Devletleri yanında yer alması nedeniyle kaybettiği toprakları düzenleyen ve Bulgaristan'ın Ege Denizi ile bağlantısını kesen barış antlaşması aşağıdakilerden hangisidir?", "o": [{"t": "Neuilly (Nöyi) Antlaşması", "ok": true, "why": "Bulgaristan ile müttefikler arasında imzalanarak ülkenin Ege Denizi kıyılarını Yunanistan'a bırakan ağır şartlı antlaşmadır."}, {"t": "Versailles (Versay) Antlaşması", "ok": false, "why": "I. Dünya Savaşı sonunda Almanya ile İtilaf Devletleri arasında imzalanan barış antlaşmasıdır."}, {"t": "St. Germen Antlaşması", "ok": false, "why": "Savaş sonrasında Avusturya İmparatorluğu'nun parçalanmasını ve yeni sınırlarını belirleyen antlaşmadır."}, {"t": "Trianon Antlaşması", "ok": false, "why": "I. Dünya Savaşı sonucunda Macaristan ile İtilaf Devletleri arasında imzalanan barış antlaşmasıdır."}], "hint": "Balkan Savaşları'nda elde edilen toprakların bir kısmının kaybedilmesine ve Trakya sınırlarının daralmasına yol açan antlaşmadır.", "type": "multiple_choice", "a": "", "why": "", "qid": "4c2s9j", "ch": 5}, {"q": "Bütün bölgesel yararlı cemiyetlerin 'Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti' adı altında tek bir çatı altında birleştirildiği ve Manda-Himaye fikrinin kesin olarak reddedildiği kongre aşağıdakilerden hangisidir?", "o": [{"t": "Sivas Kongresi", "ok": true, "why": "4-11 Eylül 1919 tarihlerinde toplanarak Millî Mücadele'yi ulusal çapta tek bir merkezden yönetme kararı alan kongredir."}, {"t": "Erzurum Kongresi", "ok": false, "why": "Toplanış bakımından bölgesel, aldığı kararlar bakımından milli bir kongre olup bölgesel birleşmeyi sağlamıştır."}, {"t": "Balıkesir Kongresi", "ok": false, "why": "Batı Cephesi'ni örgütlemek amacıyla toplanan ancak Mustafa Kemal Paşa'nın liderliğini henüz doğrudan tanımayan bölgesel bir kongredir."}, {"t": "Alaşehir Kongresi", "ok": false, "why": "Yunan işgaline karşı Batı Anadolu'da direnişi organize etmek için toplanan bölgesel nitelikli toplantılardan biridir."}], "hint": "Anadolu'nun her bakımdan en güvenli yeri olarak görülen ve ulusal ölçekte temsilcilerin katıldığı merkezdeki kongredir.", "type": "multiple_choice", "a": "", "why": "", "qid": "1aou2zp", "ch": 5}, {"q": "Millî Mücadele sürecinde düzenli ordunun kurulması kararına karşı çıkarak kendi otoritesini korumak amacıyla I. TBMM'ye karşı ayaklanan Kuvayı Milliye lideri aşağıdakilerden hangisidir?", "o": [{"t": "Demirci Mehmet Efe", "ok": true, "why": "Güneybatı Anadolu'da direniş gösteren ancak emir altına girmek istemeyerek düzenli ordu kararına karşı isyan eden milis komutanıdır."}, {"t": "Çopur Musa", "ok": false, "why": "Afyon bölgesinde Yunan teşviki ve hilafet yanlısı propaganda ile çıkarılan yerel bir ayaklanmanın lideridir."}, {"t": "Anzavur Ahmet", "ok": false, "why": "Marmara bölgesinde Doğrudan İstanbul Hükûmeti tarafından desteklenen Kuvayı İnzibatiye kökenli bir isyancıdır."}, {"t": "Milli Aşiret", "ok": false, "why": "Doğu ve Güneydoğu Anadolu bölgesinde Fransız kışkırtmasıyla TBMM'ye karşı ayaklanan bir aşirettir."}], "hint": "Ege bölgesinde işgale karşı milis birlikleri yöneten ancak disiplinli ordu yapısına geçişi kabullenmeyen efe liderlerinden biridir.", "type": "multiple_choice", "a": "", "why": "", "qid": "l7uw97", "ch": 5}, {"q": "I. Dünya Savaşı sırasında Osmanlı ordusunun Britanya birliklerine karşı büyük bir başarı elde ederek General Townshend ve birliklerini esir aldığı muharebe aşağıdakilerden hangisidir?", "o": [{"t": "Kutü'l-Amâre Muharebesi", "ok": true, "why": "Irak Cephesi'nde Halil Paşa komutasındaki Osmanlı kuvvetlerinin İngiliz ordusunu kuşatarak büyük bir zafer kazandığı muharebedir."}, {"t": "Kirte Muharebeleri", "ok": false, "why": "Çanakkale Kara Savaşları sırasında Gelibolu Yarımadası'nda gerçekleşen savunma muharebelerindendir."}, {"t": "Sarıkamış Harekâtı", "ok": false, "why": "Kafkas Cephesi'nde Rus iklim ve arazi koşulları nedeniyle büyük kayıpların verildiği taarruz harekâtıdır."}, {"t": "Kerevizdere Muharebesi", "ok": false, "why": "Çanakkale Cephesi'nde Fransız ve İngiliz kuvvetlerine karşı verilen çetin kanat savunmalarından biridir."}], "hint": "Irak Cephesi'nde gerçekleşen ve İngiliz kuvvetlerinin ağır bir mağlubiyet aldığı tarihi zaferi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1yloduh", "ch": 5}, {"q": "Rumi takvimle 31 Mart 1325 (13 Nisan 1909) tarihinde meşrutiyet düzenine ve İttihat ve Terakki Cemiyetine karşı bir tepki olarak İstanbul'da patlak veren ayaklanma aşağıdakilerden hangisidir?", "o": [{"t": "31 Mart Vakası", "ok": true, "why": "Osmanlı tarihinde mevcut anayasal rejimi değiştirmeye yönelik gerçekleşen ilk gerici (irticai) nitelikli isyandır."}, {"t": "Patrona Halil İsyanı", "ok": false, "why": "1730 yılında Lale Devri'ne ve III. Ahmed'in saltanatına son veren ayaklanmadır."}, {"t": "Kabakçı Mustafa İsyanı", "ok": false, "why": "1807 yılında Nizam-ı Cedit yeniliklerine karşı çıkıp III. Selim'i tahtından indiren ayaklanmadır."}, {"t": "Bab-ı Ali Baskını", "ok": false, "why": "1913 yılında İttihat ve Terakki üyelerinin Hükûmet darbesi yaparak iktidarı tamamen ele geçirdiği askerî olaydır."}], "hint": "Selanik'ten gelen Hareket Ordusu tarafından bastırılan ve II. Abdülhamit'in tahttan indirilmesine yol açan olaydır.", "type": "multiple_choice", "a": "", "why": "", "qid": "vv1nsk", "ch": 5}, {"q": "23 Aralık 1876 tarihinde ilan edilen, Batılı devletlerin iç işlerine karışmasını önlemeyi hedefleyen ve Osmanlı Devleti'nin ilk anayasası olan belge aşağıdakilerden hangisidir?", "o": [{"t": "Kanun-i Esasi", "ok": true, "why": "I. Meşrutiyet ile birlikte yürürlüğe giren ve Osmanlı halkına kısıtlı da olsa ilk kez seçme-seçilme hakkı tanıyan anayasadır."}, {"t": "Tanzimat Fermanı", "ok": false, "why": "1839'da ilan edilen, kanun üstünlüğünü ve tüm vatandaşların can, mal, namus güvenliğini devlet güvencesine alan fermandır."}, {"t": "Islahat Fermanı", "ok": false, "why": "1856'da Paris Antlaşması öncesinde özellikle gayrimüslim tebaaya ekstra haklar sağlayan mülki düzenlemedir."}, {"t": "Teşkilat-ı Esasiye", "ok": false, "why": "1921 yılında I. TBMM tarafından kabul edilen yeni Türk devletinin ilk kurucu anayasasıdır."}], "hint": "Tersane (İstanbul) Konferansı toplandığı gün ilan edilen meşrutiyet dönemi anayasasını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "xqlub0", "ch": 5}, {"q": "Millî Mücadele Dönemi'nde işgalcilerin kendi düşmanı olması ve kendi sınırları içindeki Türk-Müslüman halka sempatik görünmek amacıyla Ankara Hükûmetine maddi yardım sağlayan dış güç aşağıdakilerden hangisidir?", "o": [{"t": "Sovyet Rusya", "ok": true, "why": "İtilaf Devletleri'nin Doğu Avrupa ve Kafkaslar üzerindeki baskısını kırmak ve dostça ilişkiler kurmak amacıyla mali ve askerî destek veren devlettir."}, {"t": "Almanya", "ok": false, "why": "I. Dünya Savaşı'ndan yenik ayrılıp Versay Antlaşması ile ağır kısıtlamalar altına girdiğinden Millî Mücadele'ye yardım edecek durumda değildir."}, {"t": "Fransa", "ok": false, "why": "Güney Anadolu topraklarını bizzat işgal eden İtilaf devletlerinden biri olup Ankara Antlaşması'na kadar mücadele edilen taraftır."}, {"t": "Bulgaristan", "ok": false, "why": "Savaş sonrası kendi iç meseleleri ve toprak kayıplarıyla uğraşan, mali yardım yapabilecek konumda olmayan bir Balkan ülkesidir."}], "hint": "1917 Bolşevik İhtilali sonrası Çarlık rejimini yıkarak İtilaf Devletleri ile bağlarını koparan yönetimi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1o6x10y", "ch": 5}, {"q": "XVII. yüzyıl Osmanlı ıslahat düşünürlerinden Kâtip Çelebi'nin, devlet adamlarının yetersizliğini eleştirerek bozulan devlet düzenine çözüm yolları aradığı eseri aşağıdakilerden hangisidir?", "o": [{"t": "Düstûrü'l-Amel li Islahı'l-Halel", "ok": true, "why": "Kâtip Çelebi'nin devlet bütçesindeki açıkları, askerî ve idari bozulmaları analiz edip çözüm tavsiyeleri sunduğu risalesidir."}, {"t": "Asafnâme", "ok": false, "why": "XVI. yüzyılda Kanuni Sultan Süleyman'ın sadrazamı Lûtfi Paşa tarafından yazılan devlet yönetimi risalesidir."}, {"t": "Keşfü'z-Zünûn", "ok": false, "why": "Kâtip Çelebi'ye ait olmakla birlikte, binlerce eseri ve yazarı tanıtan devasa bir biyografik-bibliyografik ansiklopedidir."}, {"t": "Cihannüma", "ok": false, "why": "Kâtip Çelebi'nin coğrafya alanında kaleme aldığı dünya coğrafyasını ve haritaları inceleyen eseridir."}], "hint": "'Bozuklukların düzeltilmesi için çalışma düsturu' anlamına gelen idari eleştiri risalesini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "19n9a0k", "ch": 5}, {"q": "XVII. yüzyıl Osmanlı ıslahatçılarından Kâtip Çelebi'nin, devlet idaresindeki aksaklıkları ve devlet adamlarının yönetim yetersizliklerini eleştirerek çözüm önerileri sunduğu risale aşağıdakilerden hangisidir?", "o": [{"t": "Keşfü'z-zünûn", "ok": false, "why": "Bu eser Kâtip Çelebi'nin ünlü bir bibliyografik çalışması olup devlet yönetimi ve idari ıslahat risalesi niteliğinde değildir."}, {"t": "Düstûrü'l-Amel li Islahı'l-Halel", "ok": true, "why": "Kâtip Çelebi bu eserinde devlet yapısındaki bozulmaları ve idarecilerin basiretsizliğini eleştirerek çözüm yolları sunmuştur."}, {"t": "Asafnâme", "ok": false, "why": "Bu eser Kâtip Çelebi'ye değil, XVI. yüzyıl sadrazamlarından Lûtfî Paşa'ya aittir."}, {"t": "Künhü’l-Ahbar", "ok": false, "why": "Bu eser Gelibolulu Mustafa Âlî tarafından kaleme alınmış genel bir tarih çalışmasıdır."}], "hint": "Yazarın bozulmaları teşhis edip düzeni iyileştirme amacını taşıyan öğüt ve analiz risalesini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "17l6m18", "ch": 6}, {"q": "Kanuni Sultan Süleyman döneminde sadrazamlık yapmış olan Lûtfî Paşa'nın, devlet teşkilatındaki bozulmaları ve idari ıslahat gereksinimlerini ele aldığı eser aşağıdakilerden hangisidir?", "o": [{"t": "Asafnâme", "ok": true, "why": "XVI. yüzyılda Sadrazam Lûtfî Paşa tarafından devlet adamlarına öğütler vermek ve idari aksaklıkları eleştirmek amacıyla kaleme alınmıştır."}, {"t": "Cihannüma", "ok": false, "why": "Bu eser Kâtip Çelebi tarafından yazılmış coğrafya türünde bir çalışmadır."}, {"t": "Usulü'l-Hikem", "ok": false, "why": "Bu eser İbrahim Müteferrika'nın devlet düzenine ve askeri yeniliklere dair yazdığı bir metindir."}, {"t": "Düstûrü'l-Amel li Islahı'l-Halel", "ok": false, "why": "XVII. yüzyılda Kâtip Çelebi tarafından kaleme alınan bir ıslahat risalesidir."}], "hint": "Hz. Süleyman'ın ünlü vezirinin adıyla anılan ve devlet adamlarına rehberlik eden metni hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1a831zv", "ch": 6}, {"q": "3 Kasım 1839 tarihinde Gülhane Parkı'nda okunan Tanzimat Fermanı'nın içerdiği temel esaslar düşünüldüğünde, aşağıdakilerden hangisi bu fermanda doğrudan yer alan konulardan biri değildir?", "o": [{"t": "Vergilerin herkesin gücüne göre düzenlenmesi", "ok": false, "why": "Mali adaleti sağlamak adına her vatandaştan gelirine göre vergi alınması ilkesi fermanın temel maddelerindendir."}, {"t": "Mülkiyet hakkı, mal ve namus güvenliğinin teminat altına alınması", "ok": false, "why": "Kişi haklarının korunması, can, mal ve namus güvenliğinin sağlanması fermanın öncelikli maddelerindendir."}, {"t": "Devlet yönetiminin ilk kez anayasal parlamenter sisteme geçirilmesi", "ok": true, "why": "Anayasal parlamenter düzene geçiş 1876 Kanun-i Esasi ile gerçekleşmiş olup Tanzimat Fermanı anayasa niteliği taşımayan mülki bir ıslahat programıdır."}, {"t": "Askerlik hizmetinin adil kurallara bağlanarak ıslah edilmesi", "ok": false, "why": "Askerlik işlerinin belirli kurallara ve süreye bağlanarak bir vatan görevi sayılması hedeflenmiştir."}], "hint": "Osmanlı Devleti'nin ilk yazılı anayasasının ilan edildiği tarih ile bu fermanın ilan tarihi arasındaki farkı dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1fn9rgw", "ch": 6}, {"q": "III. Selim döneminde devletin gerilemesini önlemek amacıyla devlet adamları ve aydınlardan alınan ıslahat layihalarında (raporlarında) en fazla vurgulanan ve ortak görüş sağlanan alan aşağıdakilerden hangisidir?", "o": [{"t": "Mülki ve idari yapı", "ok": false, "why": "İdari konular layihalarda yer bulmakla birlikte acil çözüm aranan birincil odak noktası değildir."}, {"t": "Askerî sistem", "ok": true, "why": "III. Selim dönemi layihalarının ortak paydası, devletin varlığını koruması için öncelikle askerî yapının modernleştirilmesi gerektiği fikridir."}, {"t": "Mali düzenlemeler", "ok": false, "why": "Maliye alanındaki tedbirler daha çok yenilenen ordunun ve askerî ocakların finansmanını sağlamak amacına hizmet etmiştir."}, {"t": "Eğitim ve kültür politikaları", "ok": false, "why": "Eğitimdeki yenilikler bu dönemde genel bir sivil eğitim reformundan ziyade askerî okulların açılmasıyla sınırlı kalmıştır."}], "hint": "Nizam-ı Cedit ordusunun kurulması ve askerî mühendishanelerin açılması kararlarının arkasındaki temel ihtiyacı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "h6fb9k", "ch": 6}, {"q": "II. Meşrutiyet'in ilan edilmesinden sonra, Rumi 31 Mart 1325 (13 Nisan 1909) tarihinde İttihat ve Terakki Cemiyeti'nin politikalarına bir tepki olarak ortaya çıkan gerici nitelikli ayaklanma aşağıdakilerden hangisidir?", "o": [{"t": "Kabakçı Mustafa İsyanı", "ok": false, "why": "Bu isyan III. Selim'i tahttan indiren ve Nizam-ı Cedit yeniliklerini sona erdiren XVIII. yüzyıl isyanıdır."}, {"t": "Patrona Halil İsyanı", "ok": false, "why": "Bu olay Lale Devri'ni sona erdiren 1730 tarihli ayaklanmadır."}, {"t": "31 Mart Vakası", "ok": true, "why": "Rumi takvime göre 31 Mart 1325'te meşrutiyet rejimine ve İttihat ve Terakki Cemiyeti'ne tepki olarak başlayan isyandır."}, {"t": "Vaka-i Hayriye", "ok": false, "why": "II. Mahmud döneminde Yeniçeri Ocağı'nın kaldırılması olayına verilen isimdir."}], "hint": "Olayın meydana geldiği Rumi takvim tarihinin adıyla anılan isyanı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "bercev", "ch": 6}, {"q": "I. Dünya Savaşı devam ederken 1916 yılında İtilaf Devletleri arasında yapılan ve Irak'ın güneyini İngiltere'ye, Suriye kıyıları ile Adana ve Mersin çevresini ise Fransa'ya bırakan gizli antlaşma aşağıdakilerden hangisidir?", "o": [{"t": "Petrograt Protokolü", "ok": false, "why": "Bu protokol Çarlık Rusyası'na Doğu Anadolu ve Boğazlar çevresinde pay ayrılmasını öngörür."}, {"t": "Mc Mahon Antlaşması", "ok": false, "why": "İngiltere ile Hicaz Emiri Şerif Hüseyin arasında Arap Yarımadası'na yönelik yapılan gizli görüşmelerdir."}, {"t": "Sykes-Picot Antlaşması", "ok": true, "why": "1916 yılında İngiltere ve Fransa diplomatları arasında Orta Doğu Osmanlı topraklarının paylaşılması amacıyla imzalanmıştır."}, {"t": "St. Jean de Maurienne Antlaşması", "ok": false, "why": "İtalya'ya Batı Anadolu ve İzmir çevresini vaat eden gizli antlaşmadır."}], "hint": "İngiliz ve Fransız diplomatların soyadlarıyla anılan paylaşım antlaşmasını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "t8e0k1", "ch": 6}, {"q": "Milli Mücadele Dönemi'nde Ankara'da yayımlanan, TBMM Hükûmeti'nin yarı resmi yayın organı konumunda bulunan ve 1934 yılından itibaren 'Ulus' adıyla yayın hayatına devam eden gazete aşağıdakilerden hangisidir?", "o": [{"t": "İrade-i Milliye", "ok": false, "why": "Bu gazete Sivas Kongresi sonrasında Sivas'ta çıkarılmaya başlanan ilk Milli Mücadele gazetesidir."}, {"t": "Hâkimiyet-i Milliye", "ok": true, "why": "Ankara'da çıkarılan, TBMM Hükûmeti'nin yarı resmi organı işlevini gören ve sonradan Ulus adını alan gazetedir."}, {"t": "Minber", "ok": false, "why": "Mustafa Kemal Paşa'nın Mondros sonrasında İstanbul'da Ali Fethi Bey ile birlikte çıkardığı gazetedir."}, {"t": "Albayrak", "ok": false, "why": "Erzurum'da Doğu Anadolu Müdafaa-i Hukuk Cemiyeti bünyesinde yayımlanan yerel gazetedir."}], "hint": "Milletin egemenliğini vurgulayan ve Ankara'daki meclisin sesini duyuran gazete adını hatırlayınız.", "type": "multiple_ch ", "type": "multiple_choice", "a": "", "why": "", "qid": "4aflj8", "ch": 8}, {"q": "III. Selim Dönemi'nde (Nizam-ı Cedid) hazırlanan ıslahat layihalarında (raporlarında) yenilik yapılması gerektiği konusunda birleşilen öncelikli alan aşağıdakilerden hangisidir?", "o": [{"t": "Askerî", "ok": true, "why": "III. Selim dönemi raporları ve yapılan düzenlemeler öncelikli olarak ordunun ıslahı ve Nizam-ı Cedid'in kurulmasına odaklanmıştır."}, {"t": "İdari", "ok": false, "why": "İdari reformlar yapılsa da layihaların merkezinde ordunun durumu yer almaktaydı."}, {"t": "Mali", "ok": false, "why": "İrad-ı Cedid hazinesi kurulmuş fakat bu yeni ordunun masraflarını karşılamak amacını taşımıştır."}, {"t": "Kültürel", "ok": false, "why": "Matbaa kullanımı ve tercüme faaliyetleri artırılmış olsa da temel odak askerliktir."}], "hint": "Nizam-ı Cedid ordusunun kurulması bu dönemin en belirgin özelliğidir.", "type": "multiple_choice", "a": "", "why": "", "qid": "gdaoo9", "ch": 8}], "units": {"1": "Türk İnkılabını Hazırlayan Sebepler", "2": "Yeni Bir İktidar, Yıkıcı ve Yıpratıcı Savaşlar Dönemi", "3": "Millî Mücadele Başlıyor", "4": "Yeni Türk Devleti'nin Kuruluşu", "5": "Türk İstiklal Harbi", "6": "Lozan Barış Antlaşması", "7": "Atatürk Dönemi İç Politika", "8": "Atatürk Dönemi Türk Dış Politikası"}, "sources": [{"title": "ATATÜRK İLKELERİ VE İNKILAP TARİHİ I - Ünite 1 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=wJFIhoBmzdA", "type": "youtube"}, {"title": "ATATÜRK İLKELERİ VE İNKILAP TARİHİ I - Ünite 1 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=gjAMoN_n2JA", "type": "youtube"}, {"title": "ATATÜRK İLKELERİ VE İNKILAP TARİHİ I - Ünite 2 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=ALBBsyH5WRU", "type": "youtube"}, {"title": "ATATÜRK İLKELERİ VE İNKILAP TARİHİ I Ünite 2 - Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=p5pCMCJkWWI", "type": "youtube"}, {"title": "ATATÜRK İLKELERİ VE İNKILAP TARİHİ I - Ünite 3 Konu Anlatımı 1", "url": "h
