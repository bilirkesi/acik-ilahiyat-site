hi:18"}, {"front": "Ehl-i Şurat", "back": "Haricilerin kendileri için benimsedikleri ve canlarını ile mallarını cennet karşılığında Allah'a satanlar anlamına gelen olumlu adlandırmadır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:19"}, {"front": "Haruriye", "back": "Hz. Ali'nin ordusundan ayrılan ilk Harici grubun Kûfe yakınlarında toplandıkları Harûrâ kasabasına nispetle verilen adlandırmadır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:20"}, {"front": "Ezrika", "back": "Nâfi b. el-Ezrak'a nispet edilen Hariciliğin en radikal fırkasıdır. Kendilerinden olmayan Müslümanları müşrik kabul etmiş ve onlara karşı şiddeti savunmuşlardır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:21"}, {"front": "İsti'raz", "back": "Ezrika mensuplarının karşılaştıkları Müslümanları dini inançları konusunda sorguya çekerek kendi görüşlerine uymayanları öldürmelerini ifade eden uygulamadır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:22"}, {"front": "İbaziyye", "back": "Abdullah b. İbâd'a nispet edilen ve aşırı fikirleri reddederek günümüze kadar varlığını sürdürmeyi başaran tek ılımlı Harici fırkasıdır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:23"}, {"front": "Küfr-i Nimet", "back": "İbaziyye'nin büyük günah işleyen Müslümanları dinden çıkmış müşrik saymayıp Allah'ın nimetine nankörlük etmiş kimseler olarak tanımladığı kavramdır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:24"}, {"front": "Mürtekib-i Kebîre", "back": "Büyük günah işleyen Müslümanı ifade eden kavramdır. Haricilerin büyük günah işleyeni imandan çıkmış sayması üzerine bu kimsenin dindeki durumu erken dönem kelami tartışmaların ana odağı olmuştur.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:25"}, {"front": "Mürcie (İrcâ)", "back": "Büyük günah işleyen kimsenin durumunu ve cezasını Allah'a erteleyen (irca eden) itikadi gruptur. Günahın imana zarar vermediğini savunarak ameli imanın ayrılmaz bir parçası saymamışlardır.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:26"}, {"front": "Mu'tezile", "back": "Büyük günah işleyen kimsenin ne tam mümin ne de kafir olduğunu, ikisi arasında fasık bir konumda (el-menzile beyne'l-menzileteyn) bulunduğunu savunan kelam ekolüdür. Vâsıl b. Atâ'nın Hasan-ı Basrî'nin ders halkasından ayrılmasıyla teşekkül etmiştir.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:27"}, {"front": "Usûl-i Hamse", "back": "Mu'tezile mezhebinin inanç sistemini oluşturan beş temel esastır. Bu ilkeler tevhit, adalet, el-va'd ve'l-va'îd, el-menzile beyne'l-menzileteyn ve el-emri bi'l-ma'rûf nehyi ani'l-münkerden oluşur.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:28"}, {"front": "Mihne Dönemi", "back": "Abbasi Halifesi Me'mûn döneminde başlayan ve alimlere 'Kur'an'ın mahluk olduğu' görüşünün zorla kabul ettirilmeye çalışıldığı baskı dönemidir. Ahmed b. Hanbel bu dönemdeki direnişiyle öne çıkmıştır.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:29"}, {"front": "Cebriyye", "back": "İnsanın fiillerinde hiçbir irade ve hürriyete sahip olmadığını, tamamen Allah'ın zorlaması (cebri) altında bulunduğunu savunan yaklaşımdır. İnsanın durumunu rüzgarda savrulan bir yaprağa benzetmişlerdir.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:30"}, {"front": "Kaderiyye", "back": "Sorumluluk doğuran fiillerin tamamen insanın kendi iradesi ve gücüyle gerçekleştiğini ileri sürerek ilahi kaderi reddeden akımdır. İnsanın kendi fiillerinin tek faili ve mucidi olduğunu savunmuşlardır.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:31"}, {"front": "Kesp", "back": "Ehl-i Sünnet alimlerince geliştirilen ve kulun fiilini kendi iradesiyle seçip kazanmasını (kesp etmesini), Allah'ın ise o fiili yaratmasını ifade eden ilkedir. Cebriyye ile Kaderiyye arasındaki orta yolu temsil eder.", "ch": 4, "chTitle": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "id": "islam-mezhepleri-tarihi:32"}, {"front": "Şîa (Lügat ve Terim Anlamı)", "back": "Sözlükte taraftar, dost ve yardımcı anlamına gelir. Terim olarak ise Hz. Peygamber'den sonra devlet başkanlığının Hz. Ali ve soyuna ait olduğunu savunan itikadi mezheptir.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:33"}, {"front": "İmâmet Doktrini", "back": "Şia düşüncesinde devlet başkanlığının ilahi atamayla Hz. Ali ve soyuna ait olduğunu ve nübüvvetin bir uzantısı kabul edildiğini savunan inanç esasıdır.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:34"}, {"front": "Nass ve Tayin", "back": "Ehl-i Beyt imamlarının halkın seçimi veya biatla değil, Allah ve Resulü'nün açık nassı ve vasiyetiyle belirlendiğini ifade eden ilkedir.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:35"}, {"front": "İsmet (İmamların Masumluğu)", "back": "Şia'da imamların peygamberler gibi her türlü günah, hata ve yanılmadan ilahi koruma altında (masum) olduklarına inanılmasıdır.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:36"}, {"front": "Gaybet (Gaybet-i Kübrâ)", "back": "On ikinci İmam Muhammed el-Mehdî'nin Abbasilerin baskısından korunmak için saklanması ve kıyamete yakın Mehdi olarak döneceği zamana kadar süren büyük gizlilik dönemidir.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:37"}, {"front": "Takiyye", "back": "Şiilikte baskı ve tehlike zamanlarında can ile topluluk emniyetini sağlamak maksadıyla mezhebi kimliği gizleme prensibidir.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:38"}, {"front": "İsnâaşeriyye (Caferiyye)", "back": "İmamlara sırasıyla 12 sayısı ile sınırlayan, fıkıh usulünde Cafer es-Sâdık'ı merkeze alan günümüzün en yaygın Şii mezhebidir.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:39"}, {"front": "Kerbelâ Olayı", "back": "Hz. Hüseyin ve maiyettindekilerin şehit edilmesiyle Şii taraftarlığının siyasi bir hareketten itikadi ve duygusal bir mezhebe dönüşmesini sağlayan temel kırılma olayıdır.", "ch": 5, "chTitle": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "id": "islam-mezhepleri-tarihi:40"}, {"front": "Zeyd b. Ali", "back": "Ali Zeynelâbidîn'in oğlu ve Zeydiyye mezhebinin adını aldığı Ehlibeyt imamıdır. Emevî idaresinin haksızlıklarına karşı Kûfe'de isyan başlatarak şehit düşmüş ve eylemci Zeydî imamet çizgisinin öncüsü olmuştur.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:41"}, {"front": "Efdal ve Mefdûl Nazariyesi", "back": "Zeydiyye'ye göre toplumun en faziletlisi (efdal) dururken, maslahat gereği daha az faziletli olan ehil bir kimsenin (mefdûl) imameti caizdir. Bu ilke sayesinde Hz. Ebû Bekir ve Hz. Ömer'in hilâfetleri meşru sayılmıştır.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:42"}, {"front": "Zeydiyye'de İmamet Şartları", "back": "İmamın Hz. Hasan veya Hz. Hüseyin soyundan, dini ilimlerde alim, zahit olması ve kılıcıyla açıktan ortaya çıkıp (huruç) biat alması şarttır. Zeydiyye'de gâip, gizli veya masum imam anlayışı bulunmamaktadır.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:43"}, {"front": "İsmâiliyye", "back": "Câfer es-Sâdık'ın büyük oğlu İsmail'in ve onun soyunun imametini savunan Şii fırkadır. Dinin gizli ve batıni anlamlarına verdikleri önem sebebiyle Bâtıniyye, yedili devir anlayışlarından dolayı Seb'iyye olarak da anılırlar.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:44"}, {"front": "Zâhir ve Bâtın Ayrımı", "back": "İsmâilî doktrinde kutsal metinlerin ve şeriat hükümlerinin görünen bir dış kabuğu (zâhir) ile ancak masum imamın öğretmesiyle (ta'lîm) bilinebilen gizli hakikat anlamı (bâtın) bulunmaktadır.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:45"}, {"front": "Yedi Devir (Hareketi Seb'iyye) Anlayışı", "back": "İsmâiliyye'de insanlık tarihi yedi ana devre ayrılır ve her devir şeriatı getiren bir Nâtık peygamberle başlar. Altıncı devrin Nâtıkı Hz. Muhammed iken, yedinci ve son devir Muhammed b. İsmâil ile başlatılmıştır.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:46"}, {"front": "Nizâriyye ve Musta'liyye Bölünmesi", "back": "Fâtımî Halifesi Mustansır'ın vefatından sonra imametin büyük oğlu Nizâr'a mı yoksa küçük kardeşi Musta'lî'ye mi geçeceği tartışmasıyla İsmâiliyye iki ana kola ayrılmıştır. Nizâri kolu Alamut Devleti ve Ağa Hanlık silsilesiyle, Musta'li kolu ise Bohralar adıyla günümüze ulaşmıştır.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:47"}, {"front": "Ağa Han", "back": "Nizâri İsmâilîlerinin imamlarına verilen şeref unvanıdır. İlk defa 46. İmam Hasan Ali Şah'a Kaçar hükümdarı tarafından verilmiş olup günümüzde 49. İmam Kerim Ağa Han önderliğinde devam etmektedir.", "ch": 6, "chTitle": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "id": "islam-mezhepleri-tarihi:48"}], "quiz": [{"q": "Mezhepler Tarihi literatüründe kullanılan \"mezhep\" ve \"fırka\" kavramlarının kökeni ve anlamsal çerçevesi düşünüldüğünde, aşağıdakilerden hangisi doğrudur?", "o": [{"t": "\"Mezhep\" kelimesi bir hedefe ulaştıran olumlu anlamdaki yolu ifade ederken, \"fırka\" kelimesi bütünden kopan ve bölünen parçayı simgeler.", "ok": true, "why": "Mezhep kelimesi zehebe kökünden gelip gitme eyleminin yapıldığı olumlu yolu ifade ederken, fırka kelimesi kök anlamı itibarıyla bir bütünün bozulması ve parçalanması anlamını taşır."}, {"t": "\"Fırka\" kelimesi fıkhi ve ameli gruplaşmalar için kullanılırken, \"mezhep\" kelimesi sadece siyasi ve itikadi ayrışmaları ifade etmek için tercih edilir.", "ok": false, "why": "Arapça kullanımda itikadi ve siyasi oluşumlar için daha ziyade fırka, ameli oluşumlar için ise mezhep kelimesinin tercih edildiği belirtilmektedir."}, {"t": "Arapça literatürde itikadi oluşumlar için ısrarla \"mezhep\", ameli ihtilaflar sonucunda doğan gruplar için ise \"fırka\" kelimesi seçilir.", "ok": false, "why": "Metinde Arapçada itikadi gruplar için fırka, ameli gruplar için mezhep kelimesinin daha yaygın kullanıldığı ifade edilmektedir."}, {"t": "Her iki kelime de köken itibarıyla olumsuz içerik taşır ve toplumsal bütünlüğün bozulmasını ifade etmek üzere sözlüğe girmiştir.", "ok": false, "why": "Mezhep kelimesi 'yol' anlamına geldiği için özünde olumsuz bir içerik barındırmaz, aksine hedefe götüren bir imkanı temsil eder."}], "hint": "Kelimelerin Arapça kök anlamlarına (zehebe ve feraka) ve ders metninde belirtilen olumlu/olumsuz içerik farklarına odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "133rnih", "ch": 0}, {"q": "Bir fikri hareketin veya cemaatin zamanla kurumsallaşarak müstakil bir \"mezhep\" haline gelmesi sürecinde, kurucu imamdan sonra gelen ve \"ikinci adam\" olarak adlandırılan şahsiyetin temel rolü aşağıdakilerden hangisidir?", "o": [{"t": "Mezhebin fikirlerini sistemleştirip belirgin bir doktrin, kimlik ve literatür haline getirmek.", "ok": true, "why": "Kurucu imamdan sonra gelen ikinci adam, mezhebin görüşlerini derleyip sistemleştirerek gruba ayırt edici bir kimlik ve yazılı gelenek kazandırır."}, {"t": "Siyasi iktidarın desteğini alarak mezhebi devletin tek resmi mezhebi ilan ettirmek.", "ok": false, "why": "Devlet desteği mezheplerin yayılmasında etkili olsa da 'ikinci adam'ın asli görevi siyasi nüfuz kurmaktan ziyade düşünceyi sistemleştirmektir.", "p": true}, {"t": "Mezhep içerisindeki tüm farklı içtihatları iptal ederek tek bir fıkhi görüşü zorunlu kılmak.", "ok": false, "why": "İkinci adam hiyerarşiyi ve metodolojiyi belirlese de mezhep içi dinamizmi ve içtihat çeşitliliğini tamamen yok etmez."}, {"t": "Dış kültürlerden gelen eleştirilere karşı sadece rivayetlere sığınarak kelami tartışmaları sonlandırmak.", "ok": false, "why": "Sistemleştirme süreci sadece rivayete dayanmaz; metot belirleme ve yazılı literatür oluşturma çabasını kapsar."}], "hint": "Sivil inisiyatiften kurumsallaşmaya giden yolda kimlik inşası ve öğretinin derlenip toparlanması aşamasını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "phpaav", "ch": 0}, {"q": "Derslerde vurgulanan \"İhtilaf\" ve \"İftirak\" ayrımı ile \"Mezhepsizlik\" söylemi dikkate alındığında, aşağıdaki yargılardan hangisi kaynak metinlerdeki görüşlerle bağdaşır?", "o": [{"t": "Farklı düşünmek ve ihtilaf etmek doğaldır; problem bu farklılıkların ümmet birliğini parçalayan \"iftirak\"a dönüştürülmesi veya tek hak benim iddiasıdır.", "ok": true, "why": "İnsan yaratılışı gereği ihtilaf kaçınılmazdır; dinin yasakladığı şey farklı düşünmek değil, bu düşünce ayrılıklarını ayrıştırıcı kargaşaya (iftirak) dönüştürmektir."}, {"t": "Mezhepleri tamamen aradan çıkarıp doğrudan Kur'an ve Sünnete bakmak ihtilafları kökten çözer ve tam bir birlik sağlar.", "ok": false, "why": "Doğrudan metne gitmek mezhepleri ortadan kaldırmaz; aksine ehil olmayan kişilerin usulsüz yorumlarıyla yeni ihtilaflara kapı aralar."}, {"t": "İslam dininin hak olması, müntesiplerinin hiçbir zaman mezheplere ve görüş ayrılıklarına bölünmeyeceği anlamına gelir.", "ok": false, "why": "Dinin hak oluşu insanların beşeri çabalarla mezheplere bölünmeyeceği anlamına gelmez, çünkü din insan için bir imtihandır."}, {"t": "Her bir mezhep mensubunun kendi mezhebini dinin kendisiyle eşitlemesi, taassubu önleyen en temel zihniyet yapısıdır.", "ok": false, "why": "Mezhebini dinin kendisiyle eşitlemek ve 'tek hak benim' demek taassubu önlemez, aksine mezhepçilik istismarını doğurur."}], "hint": "Dinin bölünmeyi yasaklaması ile insan yaratılışındaki farklı yaklaşım biçimlerinin (beşeri yöntemin) farkını gözetiniz.", "type": "multiple_choice", "a": "", "why": "", "qid": "jgqze5", "ch": 0}, {"q": "Müslümanların fütuhat hareketleriyle kısa sürede geniş coğrafyalara yayılması ve Kadim medeniyetlerle yüzleşmesi neticesinde ortaya çıkan tartışmalardan biri de \"Halku'l-Kur'an\" (Kur'an'ın yaratılmışlığı) meselesidir. Metne göre bu tartışmanın erken dönemdeki arka planında aşağıdakilerden hangisi etkili olmıştır?", "o": [{"t": "Hristiyan bilginlerin (Yuhanna el-Dımeşki gibi) Kur'an'daki \"Kelime\" ifadesinden hareketle Hz. İsa'nın ezeli tanrısallığını temellendirme çabaları.", "ok": true, "why": "Hristiyan ilahiyatçılar Kur'an'daki 'Hz. İsa Allah'ın kelimesidir' ayetini gerekçe göstererek kelamın ezeliliğinden Hz. İsa'nın tanrısallığına ulaşmaya çalışmış, Müslümanlar da buna cevap üretirken Kur'an'ın mahluk olup olmadığını tartışmışlardır."}, {"t": "Sasani İmparatorluğu'nun çift tanrılı inanç esaslarının İslam kelamcıları tarafından doğrudan benimsenebilecek bir yapı sunması.", "ok": false, "why": "Sasani zerdüşt etkileri daha çok kader ve iyilik-kötülük (kaderiye) tartışmalarında gündeme gelmiş, Halku'l-Kur'an ile doğrudan ilişkilendirilmemiştir."}, {"t": "Hz. Peygamber döneminde sahabe arasında Kur'an'ın mahluk olup olmadığının açıkça tartışılması ama bir karara bağlanamaması.", "ok": false, "why": "Metinde bu konunun sahabe döneminde hiç gündeme gelmediği, dış kültürlerle temas sonucu ortaya çıktığı vurgulanmaktadır."}, {"t": "Haricilerin tahkim kararına karşı çıkarken Kur'an-ı Kerim'in metinsel yapısını yetersiz görerek eleştirmeleri.", "ok": false, "why": "Hariciler tahkim kararına 'Hüküm ancak Allah'a aittir' sloganıyla karşı çıkmış, Kur'an'ın halkı/mahluk oluşuyla ilgilenmemişlerdir."}], "hint": "Emevi sarayında görev yapan Doğu kilisesi patriğinin Kur'an ayetlerindeki kelam/kelime kavramı üzerinden getirdiği eleştiriyi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1fsnv4b", "ch": 0}, {"q": "İlk siyasi-itikadi fırka olarak kabul edilen Hâricîlere muhalifleri veya kendileri tarafından verilen isimler ve anlamlarıyla ilgili aşağıdakilerden hangisi yanlıştır?", "o": [{"t": "\"Marika\" ismi, Kur'an-ı Kerim'i çokça okuyup Allah yolunda mallarını ve canlarını cennet karşılığında satanları övmek için haricilerin kendilerine verdiği isimdir.", "ok": true, "why": "Marika, 'okun yaydan fırlayıp çıkması' gibi dinden çıkanları ifade etmek üzere muhalifler tarafından yergi amacıyla kullanılan olumsuz bir isimdir."}, {"t": "\"Muhakkime\" ismi, Sıffin Savaşı sonrasındaki tahkim olayında \"Hüküm ancak Allah'a aittir\" ilkesini savunmalarından dolayı kullanılmıştır.", "ok": false, "why": "Muhakkime, tahkimi reddedip 'La hükme illa lillah' sloganını merkeze aldıkları için kendilerinin de benimsediği tarihsel bir isimdir."}, {"t": "\"Haruriye\" adı, Hz. Ali'nin ordusundan ayrıldıktan sonra ilk toplandıkları yer olan Harura köyüne nispetle verilmiştir.", "ok": false, "why": "Hz. Ali'den ayrılan ilk kitlenin Harura köyünde toplanması sebebiyle bu isim literatürde sıklıkla kullanılmıştır."}, {"t": "\"Şat\" kelimesi, Allah yolunda canlarını ve mallarını satanlar anlamında kendilerinin benimsediği olumlu bir adlandırmadır.", "ok": false, "why": "Şat (çoğulu Şıra/Şarii), ayetlerde geçen 'canını Allah yolunda satanlar' övgüsüne dayanarak Haricilerin kendileri için tercih ettiği olumlu bir kavralamdır."}], "hint": "\"Marika\" teriminin \"okun yaydan fırlaması\" hadisine dayanan pejoratif (olumsuz) bir adlandırma olduğunu unutmayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1c7nsx8", "ch": 0}, {"q": "Hariciliğin günümüze kadar ulaşan tek kolu olan İbâziyye'nin radikal Ezârika kolundan ayrılan en temel ılımlı görüşü aşağıdakilerden hangisidir?", "o": [{"t": "Kendileri dışındaki büyük günah işleyen veya farklı düşünen Müslümanları müşrik değil, \"küfr-i nimet\" (nimete nankörlük eden) sayıp dünyada Mümin muamelesi yapmaları.", "ok": true, "why": "İbaziler, Ezarika'nın aksine kendilerinden olmayan Müslümanları müşrik ilan etmemiş; onları dini inkar eden değil nimete nankörlük eden olarak görüp dünyevi haklarını tanımışlardır."}, {"t": "Sadece Kureyş soyundan gelen takva sahibi kişilerin devlet başkanı olabileceğini kabul etmeleri.", "ok": false, "why": "İbaziler de diğer Hariciler gibi devlet başkanlığında Kureyşli olma şartını aramazlar."}, {"t": "Hz. Ali ve Hz. Osman da dahil olmak üzere tüm halifelerin meşruiyetini kayıtsız şartsız reddetmeleri.", "ok": false, "why": "Hariciler genel olarak Hz. Ebubekir ve Ömer'i tam model görür, Hz. Osman'ın ilk 6 yılını ve Hz. Ali'nin tahkime kadarki dönemini meşru sayarlar."}, {"t": "Müslümanların canlarını, mallarını ve çocuklarını helal görüp \"istıraz\" (sorgulama/imtihan) uygulamasını zorunlu kılmaları.", "ok": false, "why": "İstıraz (yolda durdurup insanları imtihan edip öldürme) Ezariqa'nın şiddet yanlısı uygulamasıdır, İbaziyye bunu reddeder.", "p": true}], "hint": "İbazilerin büyük günah işleyen kişiye ahiret ve dünya ahkamı açısından nasıl baktığını ve \"nankörlük\" kavramını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "19z22ez", "ch": 0}, {"q": "Haricilerin katı tekfirci tutumuna ve toplumdaki kargaşaya tepki olarak doğan Mürcie ekolünün temel çıkış noktası ve yaklaşımı aşağıdakilerden hangisidir?", "o": [{"t": "Ameli imanın ayrılmaz bir parçası saymayıp, büyük günah işleyen kimsenin durumunu ve nihai yargısını Allah'a ertelemek (irca etmek).", "ok": true, "why": "Mürcie, Haricilerin ameli imandan sayıp günahkarları tekfir etmesine karşı çıkarak, inandığını söyleyen herkesi Mümin kabul etmiş ve son kararı Allah'a bırakmıştır."}, {"t": "İmanı sadece dille ikrardan ibaret görüp kalbin tasdikini tamamen değersizleştirmek.", "ok": false, "why": "Mürcie ekolünün genel gövdesi ve Ebu Hanife gibi isimler imanın aslı olarak kalbin tasdikini görürler."}, {"t": "Hz. Ali ile Muaviye arasındaki çatışmada Muaviye'nin tamamen haklı olduğunu ve Hz. Ali'nin dinden çıktığını savunmak.", "ok": false, "why": "Mürcie, sahabeler arasındaki siyasi çatışmalarda taraf tutmayıp onların durumunu Allah'a ertelemeyi ilk edinmiştir."}, {"t": "Büyük günah işleyen kimsenin ne mümin ne de kafir olduğunu, \"fısk\" adında üçüncü bir mertebede bulunduğunu iddia etmek.", "ok": false, "why": "Büyük günah işleyeni fasık ilan edip iki konum arasında bir yere koyan görüş Mürcie'ye değil, Mutezile'ye aittir."}], "hint": "Kelime anlamı \"ertelemek\" veya \"ümit vermek\" olan bu akımın amel-iman ilişkisindeki konumunu düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "guinv", "ch": 0}, {"q": "Mutezile mezhebinin tarihsel gelişimi ve Mihne süreci düşünüldüğünde aşağıdakilerden hangisi doğru bir bilgidir?", "o": [{"t": "Mihne süreci, Halife Memun'un \"Kur'an mahluktur\" görüşünü ulemaya dayatmasıyla başlamış; Ahmed bin Hanbel bu dayatmaya karşı direnerek simge isim olmıştır.", "ok": true, "why": "Memun döneminde devlet eliyle Kur'an'ın mahluk olduğu fikri dayatılmış, Ahmed bin Hanbel buna boyun eğmeyerek hapis yatmış ve ashabü'l-hadisin lideri haline gelmiştir."}, {"t": "Mutezile mezhebi, Bağdat'ta kurulmuş ve tüm tarihi boyunca sadece devlet desteğiyle varlığını sürdürmüş siyasi bir teşkilattır.", "ok": false, "why": "Mutezile Basra merkezli doğmuş akademik/fikri bir harekettir; devlet desteği sadece Bağdat Mutezilesi'nin bir dönemi için geçerlidir."}, {"t": "Mihne olayları Basra Mutezilesi tarafından planlanıp yürütülmüş, Bağdat Mutezilesi ise bu uygulamaya şiddetle karşı çıkmıştır.", "ok": false, "why": "Mihne uygulamasını sarayda etkili olan bazı Bağdat Mutezili isimleri (Ahmet b. Ebi Duat gibi) yürütmüş, Basra ekolü buna mesafeli durmuştur."}, {"t": "Mutezile kelamcıları usul-i hamse ilkelerinden biri olan el-Menzile beyne'l-Menzileteyn ile rüyetullahı (Allah'ın ahirette görülmesini) kanıtlamışlardır.", "ok": false, "why": "Mutezile, Tevhit ilkesi gereği rüyetullahı (Allah'ın görülmesini) tamamen reddeder; el-Menzile ise büyük günah işleyenin durumuyla ilgilidir."}], "hint": "Kur'an'ın yaratılmışlığı dayatmasına karşı sabreden muhaddis alimin kim olduğunu ve bu dönemin adını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1xqphcc", "ch": 0}, {"q": "İslam kelam tarihinde \"Kaderiye\" olarak adlandırılan akım ile ilgili yapılan nitelemeler dikkate alındığında, aşağıdakilerden hangisi bu kavramın özgün kullanımını doğru açıklar?", "o": [{"t": "\"Kaderiye\" ismi, insanın kendi fiillerinin mucidi ve faili olduğunu, fiillerinde hür bulunduğunu savunup kader konusunu sıkça tartışanlara verilen isimdir.", "ok": true, "why": "Tarihsel kelam kullanımında Kaderiye, 'kaderci' olanları değil; kader konusunu gündeme getirip kulun fiillerinde hür olduğunu (tefviz) savunanları ifade eder."}, {"t": "İnsanın rüzgar önündeki yaprak gibi olduğunu ve hiçbir iradesinin bulunmadığını savunan cebirci gruplara verilen addır.", "ok": false, "why": "İnsanın iradesiz olduğunu savunan görüş Kaderiye değil, Cebriye olarak adlandırılır."}, {"t": "Allah'ın ezeli takdirini ve kaderi harfiyen kabul edip insanın hiçbir sorumluluğu olmadığını iddia eden kişileri ifade eder.", "ok": false, "why": "Kaderiye, kulun sorumluluğunu ve adalet ilkesini vurgulayarak kaderi/alın yazısını insanın fiilleri bağlamında reddeden görüştür."}, {"t": "Emevi idarecilerinin yaptıkları zulümleri \"Allah'ın kaderi\" diyerek meşrulaştırma söylemine verilen genel isimdir.", "ok": false, "why": "Emevi yöneticilerinin bu meşrulaştırma söylemine karşı çıkan Mabet el-Cüheni ve Gaylan ed-Dımeşki gibi isimlere Kaderiye denilmiştir."}], "hint": "Terimin bugünkü \"kaderci\" kelimesinin aksine, kader konusunu problem edip kulun hürriyetini (tefviz) savunanlar için kullanıldığını dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1p4y0xw", "ch": 0}, {"q": "Allah'ın zatı ve sıfatları ile ilgili tartışmalarda Cehm bin Safvan ile simgeleşen ve Mutezile'nin de belirli ölçüde etkilendiği \"Tatil\" (Muattıla) anlayışının temel iddiası nedir?", "o": [{"t": "Allah'ın zatına ilave ezeli sıfatların varlığını reddederek, Taaddüd-i Kudema'yı önlemek adına zatı sıfatlardan soyutlamak.", "ok": true, "why": "Tatil anlayışı, birden fazla ezeli varlık (Taaddüd-i Kudema) oluşmasını engellemek amacıyla Allah'ın zattan ayrı ezeli sıfatları olduğunu reddeder ve negatif teolojiye kayar."}, {"t": "Allah'ın haberi sıfatlarını (el, yüz, arşa istiva) olduğu gibi bedensel biçimde kabul edip O'nu yaratılmışlara benzetmek.", "ok": false, "why": "Allah'ı yaratılmışlara benzetip cisimleştiren anlayış Tatil değil, Müşebbihe ve Mücessime'dir."}, {"t": "Allah'ın zattan ayrı ve ezeli ilim, kudret, irade gibi subuti sıfatlarının bulunduğunu savunmak.", "ok": false, "why": "Zatına ilave ezeli sıfatları kabul eden yaklaşım Tatil değil, Ehli Sünnet'in de dahil olduğu Sıfatiye anlayışıdır."}, {"t": "Allah'ın ahirette müminler tarafından baş gözüyle ve şekilsel olarak görülebileceğini (rüyetullah) kabul etmek.", "ok": false, "why": "Muattıla ve Mutezile gibi tenzih merkezli gruplar rüyetullahı kesinlikle reddederler."}], "hint": "Tatil kelimesinin \"boşaltmak, soyutlamak\" anlamını ve \"birden fazla ezeli varlık kabul etmeme\" endişesini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "i3cvuy", "ch": 0}, {"q": "Şia mezhebinin doğuşu ve erken dönem gelişimiyle ilgili aşağıdaki bilgilerden hangisi metinlerde verilen tarihsel gerçeklerle uyuşmaktadır?", "o": [{"t": "Şia'ya muhalifleri tarafından verilen \"Rafıza\" ismi, Zeyd bin Ali'nin Hz. Ebubekir ve Hz. Ömer hakkındaki olumlu tutumu üzerine bazı taraftarlarının kendisini terk etmesine dayanır.", "ok": true, "why": "Zeyd b. Ali, ilk iki halifeyi hayırla anınca ordusundaki radikal bir grup 'Seni terk ediyoruz' diyerek ayrılmış ve muhaliflerce bu gruba 'Rafıza' (terk edenler) adı verilmiştir."}, {"t": "Şia, en başından itibaren tamamen Sasani/İran kökenli bir proje olarak kurgulanmış ve Arap coğrafyasında hiç zemin bulamamıştır.", "ok": false, "why": "Metinde Şia'nın doğuşu itibarıyla Farisi değil, tamamen Arap kaynaklı bir siyasi/dini hareket olduğu açıkça ifade edilmektedir."}, {"t": "Hazreti Hüseyin Kerbela'da şehit edildikten sonra oğlu Ali Zeynel Abidin hemen Emevilere karşı büyük bir ordu toplayıp isyan başlatmıştır.", "ok": false, "why": "Ali Zeynel Abidin siyasi hareketlerden tamamen uzak durmuş, Medine'de kendisini ibadet ve ilme vermiştir."}, {"t": "\"Beda\" inancı, Hz. Ali'nin Sıffin Savaşı'nda hakem olayını kabul etmesi üzerine ilahi emrin değiştiğini savunmak amacıyla doğmuştur.", "ok": false, "why": "Beda inancı, Muhtar es-Sekafi'nin zafer vaadinin gerçekleşmemesi üzerine 'Allah'ın fikrini/kararını değiştirdiği' iddiasıyla ortaya atılmıştır."}], "hint": "Zeyd b. Ali'nin \"Beni terk ettiniz\" (rafadtunî) sözünün hangi sahabeler hakkındaki soru üzerine söylendiğini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "16hnodx", "ch": 0}, {"q": "12 İmam Şiiliği (İsnaaşeriyye / Caferiyye) bünyesinde benimsenen \"Gaybet\" ve \"İmamet\" anlayışı ile ilgili aşağıdakilerden hangisi yanlıştır?", "o": [{"t": "12. İmam Muhammed el-Mehdi'nin küçük yaşta gaybete girmesiyle birlikte imamet silsilesi son bulmuş ve Şia yeni imam belirleme usulünü tamamen terk etmiştir.", "ok": true, "why": "İsnaaşeriyye'ye göre imamet son bulmamıştır; 12. İmam ölmemiş, gaybete çekilmiştir ve kıyametten önce Mehdi olarak dönüp dünyayı adaletle dolduracaktır."}, {"t": "12 İmam Şiiliğine göre imamlar tıpkı peygamberler gibi masumdurlar, ilahi bilgiye sahiptirler ve nasla belirlenmişlerdir.", "ok": false, "why": "İsnaaşeriyye'de imamlar masumiyet, ledünni ilim ve peygamber tayini (nas) vasıflarına sahip otoriter figürlerdir."}, {"t": "Gaybet dönemi \"Gaybet-i Suğra\" (sefirler dönemi) ve günümüze kadar devam eden \"Gaybet-i Kübra\" olmak üzere iki aşamadan oluşur.", "ok": false, "why": "12. İmam'ın gaybet süreci önce elçiler aracılığıyla iletişim kurulan küçük gaybet, ardından tam kesintinin olduğu büyük gaybet olarak ikiye ayrılır."}, {"t": "Dini hükümlerin çıkarılmasında imamlardan gelen rivayetlerle yetinen Ahbariler ile akıl ve içtihadı devreye sokan Usuliler şeklinde iki ana eğilim vardır.", "ok": false, "why": "12 İmam Şiiliği fıkhında ve usulünde Ahbari ve Usuli şeklinde iki temel metodolojik ekol mevcuttur."}], "hint": "Gaybet inancında imamet zincirinin kesintiye uğramadığı, 12. İmam'ın Mehdi olarak gizlendiği ve döneceği fikrini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "17v6hhy", "ch": 0}, {"q": "Zeydiyye mezhebinin İmamet anlayışını diğer Şiî gruplardan (İsnaaşeriyye ve İsmailiyye) ayıran en temel özellik aşağıdakilerden hangisidir?", "o": [{"t": "İmamın gizli (Gaip) ve masum olmadığını; Fatımi soyundan, alim, takva sahibi ve bizzat ortaya çıkıp (huruc) davet eden bir şahıs olması gerektiğini savunmaları.", "ok": true, "why": "Zeydiler gaybet ve masumiyet inancını reddederler; imamın açıkça ortaya çıkmasını, alim ve takva sahibi olarak kılıcıyla davet etmesini şart koşarlar."}, {"t": "İmametin sadece Hz. Hüseyin'in soyundan gelen tek bir kişiye nasla geçtiğine ve babadan oğula aktarıldığına inanmaları.", "ok": false, "why": "Zeydiler imametin hem Hz. Hasan hem de Hz. Hüseyin soyundan (Fatımi) gelen şartları taşıyan herhangi bir alime geçebileceğini savunurlar.", "p": true}, {"t": "Hz. Ebubekir ve Hz. Ömer'in hilafetini tamamen batıl görüp, \"Meftul'ün İmameti\" fikrini kesinlikle reddetmeleri.", "ok": false, "why": "Zeydiyye 'Meftul'ün (üstün olmayan) imametini' caiz gördüğü için Hz. Ebubekir ve Ömer'in hilafetini meşru sayar."}, {"t": "Dini emir ve ibadetlerin zahiri anlamlarını tamamen iptal edip sadece batıni yorumlara uymayı zorunlu kılmaları.", "ok": false, "why": "Zeydilik zahiri şeriatı ve fıkhi hükümleri esas alır, Batıni aşırılıklara uzak durur."}], "hint": "Zeydilerin davet ve isyan (aşikar olma) şartını, ayrıca Eftal varken Meftul'ün de imam olabileceği görüşünü düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1u2tx99", "ch": 0}, {"q": "İsmailiyye mezhebinin temel doktrinleri ve tarihsel kolları ile ilgili aşağıdakilerden hangisi doğrudur?", "o": [{"t": "Tarihte Nizariler (Alamut, Hasan Sabbah, Ağa Han) ve Müsta'liler (Bohralar, Daî-i Mutlak) olarak ikiye ayrılmışlar; Batıni tevil ve 7'li devir anlayışını benimsemişlerdir.", "ok": true, "why": "İsmailiyye, Fatımi halifesi Mustansır'ın ölümünden sonra Nizariler ve Müsta'liler olarak ayrılmış, öğretilerinde Batıni tevil ve 7'li periyot ilkelerini benimsemişlerdir."}, {"t": "Zahiri hükümleri tamamen uygulayan ve batıni tevili kesinlikle reddeden mütedil bir Sünni kelam ekolüdür.", "ok": false, "why": "İsmailiyye, nasların gizli/öz anlamını esas alan Batıni ekollerin başında gelir."}, {"t": "İmameti Cafer es-Sadık'tan sonra oğlu Musa el-Kazım ve onun soyu üzerinden 12 imama kadar tamamlayan gruptur.", "ok": false, "why": "Cafer es-Sadık'tan sonra Musa el-Kazım'ı değil, en büyük oğlu İsmail'i ve onun oğlu Muhammed b. İsmail'i imam kabul etmişlerdir."}, {"t": "Tarih boyunca hiçbir devlet kurmamış, sadece gizli bir tebliğ örgütü olarak kalmışlardır.", "ok": false, "why": "İsmailler tarihte Fatımiler Devleti, Alamut İsmaili Devleti gibi önemli siyasi yapılar kurmuşlardır."}], "hint": "Mısır'da Fatımiler, Alamut'ta Nizariler ve Mısır/Yemen/Hindistan hattındaki bölünmeleri hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "14rd1y6", "ch": 0}, {"q": "İslam Mezhepleri Tarihi edebiyatının gelişimi dönemi (Hicri 4. Asır ve sonrası) ile ilgili aşağıdakilerden hangisi doğrudur?", "o": [{"t": "Eş'ari (Makalâtü'l-İslamiyyin), Bağdadi (el-Fark beyne'l-Fırak) ve Şehristani (el-Milel ve'n-Nihal) gibi müellifler eserlerinde çoğunlukla \"73 Fırka\" hadisini esas alan tasnifler yapmışlardır.", "ok": true, "why": "Gelişim döneminde yazılan bu klasikler, mezhepleri tanıtırken çoğunlukla ümmetin 73 fırkaya bölüneceğini belirten hadisi çerçeve olarak kullanmışlardır."}, {"t": "Bu dönemde yazılan ilk Makalat türü eserlerin tamamı ehli hadis ve Sünni alimler tarafından kaleme alınmış, Mutezile bu alana hiç katkı vermemiştir.", "ok": false, "why": "İlk Makalat örneklerini Mutezili, Harici, Şii müellifler kaleme almış; Sünni alimler başlangıçta yazmaya istekli olmamışlardır."}, {"t": "Duraklama ve taklit dönemi eserlerinde Osmanlı-Safevi mücadelesinin hiçbir etkisi görülmemiş, tam aksine tarafsız metinler yazılmıştır.", "ok": false, "why": "Osmanlı-Safevi siyasi mücadelesi, İbn Kemal gibi dönemin Osmanlı müelliflerinin üslubuna ve Şia eleştirilerine sert bir şekilde yansımıştır."}, {"t": "Mezhepler Tarihi, Cumhuriyet öncesinde hiçbir medrese müfredatında yer almamış, ilk kez 11 Eylül olaylarından sonra akademide bir disiplin olmuştur.", "ok": false, "why": "Disiplin İkinci Meşrutiyet sonrası medrese müfredatına girmiş, ardından Darülfünun İlahiyat Fakültesi'nde yer almıştır."}], "hint": "Hicri 4. asırda Şiiliğin teşekkülü ile Sünni kelamcıların yazmaya başladığı temel eserleri ve 73 fırka hadisi çerçevesini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "vnfw99", "ch": 0}, {"q": "Dinî anlayışlardaki farklılaşmaların zamanla kurumsallaşmasıyla ortaya çıkan mezheplerin yapısı göz önüne alındığında, aşağıdakilerden hangisi mezhepler hakkında doğru bir değerlendirmedir?", "o": [{"t": "Mezhepler, ilahî vahyin kendisiyle birebir özdeş kabul edilmelidir.", "ok": false, "why": "Mezhepler dinin değişmez metinlerinin kendisi değil, insanların bu metinleri anlama ve yorumlama biçimleridir."}, {"t": "Bir mezhebin teşekkülü yalnızca tek bir tarihî olaya veya şahsa indirgenebilir.", "ok": false, "why": "Mezheplerin ortaya çıkışında politik, sosyal, ekonomik ve insani birçok etken birlikte rol oynar."}, {"t": "Mezhepler, oluştukları coğrafi, kültürel ve siyasi vasatın izlerini bünyelerinde barındıran beşerî yapılardır.", "ok": true, "why": "Mezhepler dinin sabit ilkelerinden ziyade insanların onu algılama biçimlerinin zamanla kurumlaşmasıyla şekillenen tarihsel ve beşerî oluşumlardır."}, {"t": "Din anlayışındaki farklılaşmalar zorunlu olarak mensuplarının dinden çıkmasıyla sonuçlanır.", "ok": false, "why": "Din anlayışındaki yorum farklılıkları dinden çıkış anlamına gelmeyip düşünsel zenginliği ve zihniyet çeşitliliğini ifade eder."}], "hint": "Dinin sabit ilkeleri ile bu ilkelerin insanlar tarafından zaman ve mekâna bağlı olarak yorumlanması arasındaki nitelik farkını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1a5z5ju", "ch": 1}, {"q": "İslam Mezhepleri Tarihi araştırmalarında betimleyici (tasviri) yöntem esastır. Buna göre aşağıdakilerden hangisi bu disiplinin temel amaçları arasında yer almaz?", "o": [{"t": "Mezheplerin tarihî süreç içerisinde İslam medeniyetine sağladığı katkıları ortaya koymak", "ok": false, "why": "Mezheplerin düşünsel ve kültürel mirasa katkılarını incelemek disiplinin ana hedeflerindendir."}, {"t": "İncelenen dinî grupların hangilerinin 'hak', hangilerinin 'batıl' olduğunu hükme bağlamak", "ok": true, "why": "Mezhepler Tarihi normatif değer yargılarında bulunmayı ve mezhepleri hak/batıl diye sınıflandırmayı Kelâm gibi kelamî/teolojik disiplinlere bırakır."}, {"t": "Müslüman toplumların sosyal ve psikolojik dinamiklerine dair verilere ulaşmak", "ok": false, "why": "Toplumsal yapıyı ve grup davranışlarını anlamaya dönük veri toplamak mezhepler tarihçisinin görevlerindendir."}, {"t": "Dinî grupların zaman içerisinde tarihte bıraktıkları izleri tarafsızca görünür kılmak", "ok": false, "why": "Tarihsel süreçteki izleri ve değişimleri tespit etmek araştırmacının temel sorumlulukları arasında bulunur."}], "hint": "Mezhepler Tarihi'nin tarafsız ve betimleyici bir bilim dalı olduğunu, yargılayıcı olmadığını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1gq6e3g", "ch": 1}, {"q": "Sözlük anlamı itibarıyla 'daha önce benzeri olmayıp sonradan ortaya konulan şey' anlamına gelen, dinî bir terim olarak ise dinin aslından olmayan inanç veya uygulamaların dine eklenmesini ifade eden kavram aşağıdakilerden hangisidir?", "o": [{"t": "Tefrika", "ok": false, "why": "Tefrika, toplumdaki birlik ve beraberliğin bozulması ve gruplaşmaların meydana gelmesi anlamını taşır."}, {"t": "Bid’at", "ok": true, "why": "Bid'at, dinin aslî kaynaklarında yer almadığı halde sonradan ihdas edilen ve dinî bir gereklilik gibi sunulan yenilikleri tanımlar."}, {"t": "Makâlât", "ok": false, "why": "Makâlât, mezheplerin görüş ve düşüncelerinin derlendiği klasik eser türlerine verilen addır."}, {"t": "İttifak", "ok": false, "why": "İttifak, uyuşma ve görüş birliği sağlama durumunu ifade eden olumlu bir kavramdır."}], "hint": "Dinin aslî yapısına sonradan eklenen ve geleneksel dokuyu bozan yenilikleri tanımlayan terimi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "yfhirl", "ch": 1}, {"q": "İslam Mezhepleri Tarihi ile Din Sosyolojisi disiplinlerinin ortak inceleme alanları dikkate alındığında, aşağıdakilerden hangisi her iki disiplinin kesiştiği konulardan biri olamaz?", "o": [{"t": "Bir dinî grupta cemaatsel hiyerarşinin ve örgütlenme yapısının teşekkülü", "ok": false, "why": "Toplumsal hiyerarşi ve cemaatleşme süreçleri hem sosyolojinin hem de mezhepler tarihinin ortak konusudur."}, {"t": "Mezhep mensupları arasındaki grupsal dayanışma ve sosyal bağlar", "ok": false, "why": "Grup içi bütünleşme ve dayanışma mekanizmaları sosyal bilim araştırmalarında ortaklaşa incelenir."}, {"t": "İncelenen bir mezhebin inanç esaslarının mutlak doğruluğunun teolojik olarak kanıtlanması", "ok": true, "why": "Bir mezhebin inançlarının doğruluğunu kanıtlamaya çalışmak normatif bir çaba olup betimleyici sosyal bilimlerin amacına aykırıdır."}, {"t": "Toplumsal kriz dönemlerinde ortaya çıkan 'kurtarıcı bekleme' (mehdilik) fikrinin psiko-sosyal nedenleri", "ok": false, "why": "Toplumsal beklentiler ve psiko-sosyal tepkiler her iki disiplinin de ortaklaşa odaklandığı alanlardandır."}], "hint": "Sosyal bilimlerin betimleyici yaklaşımı ile teolojinin doğrulama çabası arasındaki sınırı göz önüne alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "ce61bl", "ch": 1}, {"q": "Her insanın zihinsel kapasitesi, algılama biçimi, mizaç ve karakter yapısının birbirinden farklı olması dinî metinleri yorumlarken çeşitliliğe yol açar. Bu durum mezheplerin ortaya çıkış sebeplerinden hangisine doğrudan örnektir?", "o": [{"t": "Nassların tabiatı", "ok": false, "why": "Nassların tabiatı, dinî metinlerin dilsel özellikleri ve anlam katmanlarıyla ilişkilidir."}, {"t": "İnsanın tabiatı", "ok": true, "why": "İnsanın kişisel, psikolojik ve zihinsel farkları metinleri anlama ve dünyayı algılama biçimlerini doğrudan yönlendirir."}, {"t": "Coğrafi ve çevresel şartlar", "ok": false, "why": "Coğrafi şartlar, fiziki çevre ve iklim gibi dış unsurlarla bağlantılıdır."}, {"t": "Sosyo-politik gelişmeler", "ok": false, "why": "Sosyo-politik gelişmeler iktidar, yönetim ve toplumsal olayları kapsar."}], "hint": "Bireyin kendi kişisel psikolojisi ve zihinsel yapısının algı üzerindeki rolünü değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "qid": "99tuwc", "ch": 1}, {"q": "Kur'an-ı Kerim'de yer alan bazı ayetlerin muhkem, bazılarının müteşâbih olması veya dilsel açıdan farklı anlamlara gelmeye elverişli yapısı mezhepleşme sürecini hızlandırmıştır. Bu durum hangi temel sebeple açıklanır?", "o": [{"t": "Farklı kültürlerle karşılaşılması", "ok": false, "why": "Farklı kültürlerle karşılaşma, dış düşünce sistemlerinin İslam coğrafyasına girmesiyle ilgilidir."}, {"t": "İnsanın toplumsal bir varlık olması", "ok": false, "why": "Toplumsal varlık olmak cemaatleşme ve kurumlaşma olgusunu açıklar."}, {"t": "Nassların tabiatı", "ok": true, "why": "Dinî metinlerin açık, kapalı, mecaz veya yorumlanmaya elverişli dilsel özellikleri farklı içtihatların doğmasını sağlar."}, {"t": "Ekonomik faktörler", "ok": false, "why": "Ekonomik faktörler ganimet, vergi ve gelir dağılımı gibi maddi süreçlerle ilişkilidir."}], "hint": "Kutsal metinlerin anlamsal ve dilsel özelliklerinin yorum çeşitliliğine imkân tanımasını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "9c4eom", "ch": 1}, {"q": "Din Fenomenolojisi yaklaşımının İslam Mezhepleri Tarihi araştırmalarına sağladığı en belirgin katkı aşağıdakilerden hangisidir?", "o": [{"t": "Hangi mezhebin inanç ilkelerinin ayetlere daha uygun olduğunu ispatlaması", "ok": false, "why": "Din fenomenolojisi normatif doğruluk veya yanlışlık değerlendirmesinde bulunmaz."}, {"t": "Dinler ve mezhepler arasındaki ortak olguları, sembolleri ve tezahürleri tespit etmesi", "ok": true, "why": "Din fenomenolojisi, dinî olgu ve tecrübeleri önyargısız bir şekilde tanımlayıp ortak sembol ve yapıları ortaya çıkarmayı sağlar."}, {"t": "Siyasi mücadelelerin mezhepleşmeye etkisini belgelere dayanarak açıklaması", "ok": false, "why": "Tarihsel belgeleri analiz etmek genel tarih metodolojisinin konusudur."}, {"t": "Yalnızca fıkhi mezheplerin içtihat usullerini incelemesi", "ok": false, "why": "Fenomenoloji belirli bir fıkhi usulle sınırlı olmayıp geniş çaplı dinî tezahürlerle ilgilenir."}], "hint": "İnançların özündeki yapısal benzerlikleri ve ortak dinsel tecrübe biçimlerini inceleyen yöntemi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "cm4yaw", "ch": 1}, {"q": "Dinin özünde yer alan birlik ruhunun ve toplumsal bütünlüğün bozulmasını, Müslümanlar arasında fikirsel ve siyasal ayrılıkların baş göstermesini ifade eden kavram aşağıdakilerden hangisidir?", "o": [{"t": "Makâlât", "ok": false, "why": "Makâlât, mezhep görüşlerini derleyen literatür türüdür."}, {"t": "İttifak", "ok": false, "why": "İttifak görüş birliği ve uzlaşma anlamı taşır."}, {"t": "Tefrika", "ok": true, "why": "Tefrika, Müslüman toplum bünyesinde meydana gelen bölünmeleri ve anlaşmazlıkları tanımlayan temel kavramdır."}, {"t": "Celâdet", "ok": false, "why": "Celâdet kahramanlık ve cesaret anlamına gelen bir sözcüktür."}], "hint": "Birlik ve beraberliğin zıddı olan bölünme ve gruplaşma durumunu ifade eden terimi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "ilg0bs", "ch": 1}, {"q": "İslam Mezhepleri Tarihi araştırmalarında bir mezhebin doğuşunu tek bir olaya veya şahsa indirgemek metodolojik bir hata olarak kabul edilir. Buna göre mezhepleşme süreciyle ilgili en doğru yaklaşım aşağıdakilerden hangisidir?", "o": [{"t": "Mezhepler; psiko-sosyal, politik, ekonomik ve dinî etkenlerin zamanla birleşmesiyle oluşan süreçsel yapılardır.", "ok": true, "why": "Mezhepleşme birdenbire değil, çok boyutlu unsurların uzun süreli etkileşimi sonucu kademeli olarak gerçekleşir."}, {"t": "Mezhepler, Hz. Peygamber'in vefatının hemen ardından eksiksiz birer sistem olarak ortaya çıkmıştır.", "ok": false, "why": "Mezhepler kısa sürede değil, tarihsel süreçte kurumsallaşarak oluşmuştur."}, {"t": "Politik çekişmeler mezheplerin teşekkülünde hiçbir rol oynamamıştır.", "ok": false, "why": "Siyasal iktidar ve liderlik mücadeleleri mezhepleşmeyi tetikleyen ana unsurlardandır."}, {"t": "Dinin anlaşılma biçimleri yaşanılan zaman ve coğrafyadan tamamen bağımsızdır.", "ok": false, "why": "İnsanların dini algılama tarzları içinde bulundukları zamandan ve sosyo-kültürel ortamdan doğrudan etkilenir."}], "hint": "Mezheplerin oluşumundaki çok faktörlü ve zamana yayılan kurumsallaşma karakterini göz önüne alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1hyjibe", "ch": 1}, {"q": "Mezhepler Tarihi kaynakları incelenirken mezheplerin birbirini tekfir etmesi veya suçlayıcı bir dil kullanması araştırmacı açısından bir zorluk oluşturur. Bu durum aşağıdakilerden hangisine yol açar?", "o": [{"t": "Ana kaynaklardaki verilerin nesnel ve tarafsız biçimde analiz edilmesini zorlaştırır.", "ok": true, "why": "Eserlerdeki tarafgir ve ötekileştirici ifadeler, olguların tarafsız bir gözle tespit edilmesini ve doğru verilere ulaşılmasını güçleştirir."}, {"t": "Farklı gruplar arasında bilimsel diyalog kurulmasını kolaylaştırır.", "ok": false, "why": "Suçlayıcı ve tekfirci üslup diyalog imkânlarını ortadan kaldırır."}, {"t": "Mezheplerin tarihsel açıdan haklılığının bilimsel olarak kanıtlanmasını sağlar.", "ok": false, "why": "Suçlayıcı ifadeler bilimsel kanıt sunmaz, aksine önyargı oluşturur."}, {"t": "Metinlerin tek bir mutlak doğru yorumunun yapılmasına katkı sunar.", "ok": false, "why": "Tarafgir üslup yorum zenginliğini objektif şekilde değerlendirmeyi engeller."}], "hint": "Tarafgir kaynakların nesnellik ve bilimsel tarafsızlık üzerindeki olumsuz etkisini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "pnfv6g", "ch": 1}, {"q": "Hz. Peygamber'in vefatının ardından yaşanan halife seçimi tartışmaları, Sıffîn Savaşı ve Tahkim Olayı gibi tarihî gelişmeler mezheplerin ortaya çıkışında öncelikle hangi faktörün etkili olduğunu gösterir?", "o": [{"t": "İnsanın tabiatı", "ok": false, "why": "İnsanın tabiatı bireysel psikolojik ve zihinsel farklılıklarla ilgilidir."}, {"t": "Nassların tabiatı", "ok": false, "why": "Nassların tabiatı metinsel yorum imkânlarını kapsar."}, {"t": "Sosyo-politik faktörler", "ok": true, "why": "Yönetim, hilafet ve iktidar mücadeleleri toplumsal ve siyasal nitelikte olup mezhepleşmeyi tetikleyen ana olaylardandır."}, {"t": "Farklı din ve kültürlerle temas", "ok": false, "why": "Kültürel temas fetihler sonrasında dış dünyayla kurulan ilişkileri kapsar."}], "hint": "Devlet yönetimi, iktidar ve liderlik mücadelelerinin hangi alanla ilgili olduğunu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1dl725g", "ch": 1}, {"q": "Aşağıdakilerden hangisi 'mezhep' kavramının 'din' kavramı ile olan ilişkisini en doğru şekilde ifade eder?", "o": [{"t": "Mezhep dinin bizzat kendisidir ve hiçbir şekilde değiştirilemez.", "ok": false, "why": "Mezhep dinin kendisi değil, insanların onu anlama ve uygulama biçimidir."}, {"t": "Mezhepler, dinin sabit metinlerinin insanlar tarafından zamana ve mekâna göre yapılan farklı anlayış ve yorum biçimleridir.", "ok": true, "why": "Din vahye dayalı ilahi ilkeler bütünü iken mezhep bu ilkelerin beşerî düzlemde algılanış ve uygulanış şeklidir."}, {"t": "Belli bir mezhebe mensup olmak dine inanmanın mutlak şartıdır.", "ok": false, "why": "Dinin temeli ilahi nasslardır; belirli bir beşerî ekolü benimsemek dinin varlık şartı değildir."}, {"t": "Mezhepler dinin aslına hiçbir katkısı olmayan yapay oluşumlardır.", "ok": false, "why": "Mezhepler dinin farklı coğrafyalarda ve kültürlerde yaşanmasına imkân tanıyan düşünsel zenginliklerdir."}], "hint": "İlahî olan 'din' ile beşerî olan 'din anlayışı' arasındaki temel farkı göz önüne alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "16imf0f", "ch": 1}, {"q": "Mezheplerin doğuşunda etkili olan bireysel unsurlar göz önüne alındığında, insanların aynı nassı veya olayı farklı şekillerde algılayıp yorumlamalarının temel sebebi aşağıdakilerden hangisidir?", "o": [{"t": "İnsanın doğuştan gelen mizaç, zihinsel kapasite ve kişilik yapısının farklı olması", "ok": true, "why": "İnsanın yapısının kendine özgü olması, kendisini ve dış dünyayı algılama ve yorumlama biçimlerini doğrudan etkiler."}, {"t": "Siyasi otoritenin toplumda tek tip düşünce yapısını zorunlu kılması", "ok": false, "why": "Siyasi baskılar farklı yorumları bastırabilir ancak bireysel algı farklılıklarının temel nedeni insani mizaç ve kişisel yapıdır."}, {"t": "Dini metinlerin sadece tek bir somut anlama izin verecek şekilde yazılması", "ok": false, "why": "Nassların yapısında yorumlanmaya açık veya müteşâbih ifadelerin bulunması çeşitliliğe imkân tanır, bireysel farklılıklar ise bunu belirler."}, {"t": "Ekonomik gelir düzeyinin bireylerin mezhepsel tercihlerini tamamen belirlemesi", "ok": false, "why": "Ekonomik faktörler toplumsal süreçlerde etkili olsa da bireysel algı ve yorum farkının öz kaynağı insanın mizaç ve kişilik yapısıdır."}], "hint": "İnsanların düşünce ve tutumlarının oluşumunda doğuştan sahip oldukları bireysel özellikleri dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "b2u2uv", "ch": 2}, {"q": "Tarihte ortaya çıkan farklı mezheplerin kendi görüşlerini temellendirmek için Kur'an-ı Kerim ayetlerine başvurması, mezheplerin ortaya çıkışındaki hangi faktöre örnek teşkil eder?", "o": [{"t": "Nassların tabiatı", "ok": true, "why": "Ayetlerin yorumlanmaya elverişli yapısı ve farklı anlam boyutları barındırması (müteşâbih/muhkem niteliği), mezheplerin kendi fikirlerini metne dayandırmasına imkân tanır."}, {"t": "Farklı din ve kültürlerle karşılaşma", "ok": false, "why": "Bu durum dış felsefi geleneklerle etkileşimi ifade eder, metinlerin kendi iç yapısıyla ilgili değildir."}, {"t": "Coğrafi ve fiziki şartlar", "ok": false, "why": "İklim ve coğrafya yaşam tarzını etkiler ancak dini metinlerin farklı yorumlanmasıyla doğrudan ilgili değildir."}, {"t": "Toplumsal tabakalaşma ve ekonomik dinamikler", "ok": false, "why": "Ekonomik etkenler sosyal gruplaşmayı açıklayabilir ancak nasslara atıfta bulunarak görüş meşrulaştırma nassların yapısıyla ilgilidir."}], "hint": "Kutsal metinlerin dilsel, yorumsal ve anlamsal özelliklerini göz önünde bulundurunuz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1heas38", "ch": 2}, {"q": "Neo-Platonist ve Gnostik felsefi düşüncelerin İsmailîlik aracılığıyla İslam düşüncesine taşınması, mezheplerin doğuşuna etki eden hangi unsurun sonucudur?", "o": [{"t": "Farklı din, inanç, kültür ve felsefelerle karşılaşma", "ok": true, "why": "İslam coğrafyasının genişlemesiyle Yunan, Mısır ve İran felsefi birikimleriyle temas kurulmuş ve bu durum bazı mezheplerin fikir yapısını şekillendirmiştir."}, {"t": "İnsanın psikolojik yapısı ve mizaç farklılıkları", "ok": false, "why": "Bireysel mizaç içsel bir etken olup dış medeniyetlerden ve felsefi akımlardan aktarılan düşünceler dış çevresel etkileşimdir."}, {"t": "Hz. Peygamber'in vefatından hemen sonraki halife seçimi tartışmaları", "ok": false, "why": "Halife seçimleri iç sosyo-politik bir faktördür; felsefi akımların transferi ise kültürlerarası karşılaşmanın ürünüdür."}, {"t": "Arap dilinin gramer ve edebi yapısındaki değişimler", "ok": false, "why": "Dilsel yapı nassların anlaşılmasında etkili olmakla birlikte dış felsefi sistemlerin benimsenmesini açıklamakta yetersiz kalır."}], "hint": "İslam fetihleri sonrası farklı medeniyet havzalarıyla kurulan fikir alışverişini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1bu11cd", "ch": 2}, {"q": "Sıffîn Savaşı'nın ardından gerçekleşen Tahkim Hadisesi sonucunda, Hz. Ali'nin hakem tayin etmesini kabul etmeyerek ondan ayrılan ve ilk siyasi/itikadi fırkalardan biri kabul edilen grup aşağıdakilerden hangisidir?", "o": [{"t": "Haricilik", "ok": true, "why": "Tahkim olayını kabul ettiği gerekçesiyle Hz. Ali'ye karşı çıkan ve ordudan ayrılan topluluk Hariciler (Hâricîlik) olarak adlandırılmıştır."}, {"t": "Mu'tezile", "ok": false, "why": "Mu'tezile daha sonraki dönemde Hasan-ı Basrî'nin meclisinden ayrılan Vâsıl b. Atâ tarafından kurulan kelami bir mezheptir."}, {"t": "Mürcie", "ok": false, "why": "Mürcie, iç çatışmalar karşısında tarafsız kalıp hükmü Allah'a ertelemeyi savunan gruptur; Tahkim'de ayrılan sert mizaçlı grup değildir."}, {"t": "Eş'arîlik", "ok": false, "why": "Eş'arîlik, Ebû'l-Hasan el-Eş'arî tarafından kurulan Ehl-i Sünnet kelam ekolüdür."}], "hint": "Siyasi uzlaşıyı reddedip 'Hüküm ancak Allah'ındır' sloganıyla ortaya çıkan ayrılıkçı grubu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "rwokv6", "ch": 2}, {"q": "Hz. Osman'ın hilafetinin son yıllarında otoritesinin sarsılmasına ve toplumsal huzursuzlukların tırmanmasına yol açan temel sosyo-politik sebep aşağıdakilerden hangisidir?", "o": [{"t": "Devlet makamlarına akrabalarını getirmesiyle Hâşimî-Ümeyyeoğulları çekişmesinin yeniden canlanması", "ok": true, "why": "Hz. Osman'ın akrabalarını önemli görevlere ataması İslam öncesi kabilevi rekabetleri tetiklemiş ve siyasi muhalefeti artırmıştır."}, {"t": "Kur'an metinlerinin tamamen yok edilerek yerine yeni bir kitabın yazılması", "ok": false, "why": "Hz. Osman Kur'an'ı çoğaltıp ana merkezlere göndermiştir; yok etme gibi bir durum söz konusu değildir."}, {"t": "Yalancı peygamberler ve zekât vermeyen kabilelerle savaşmayı reddetmesi", "ok": false, "why": "Yalancı peygamberler ve zekât vermeyenlerle mücadele Hz. Ebû Bekir döneminin ilk icraatıdır."}, {"t": "Orduyu tamamen dağıtarak fetih hareketlerini kalıcı olarak bitirmesi", "ok": false, "why": "Hz. Osman döneminde fetihler genişlemiş, ilk dönemlerde büyük askeri başarılar kazanılmıştır."}], "hint": "İslam öncesi döneme kadar uzanan kabilevi aidiyetlerin devlet yönetimine yansımasını göz önünde bulundurunuz.", "type": "multiple_choice", "a": "", "why": "", "qid": "6u5gq9", "ch": 2}, {"q": "Mezheplerin 'dinin anlaşılma biçimleri' ve 'beşerî oluşumlar' olarak değerlendirilmesi, aşağıdakilerden hangisini doğrular?", "o": [{"t": "Mezheplerin dinin kendisiyle özdeşleştirilemeyeceğini ve içinde geliştikleri ortamın izlerini taşıdığını", "ok": true, "why": "Dinin kendisi ilahi iken, mezhepler insanların dini anlama ve yorumlama süreçlerinin zamanla kurumsallaşmış beşerî ürünleridir."}, {"t": "Mezheplerin mutlak ve değişmez ilahi vahiyler olduğunu", "ok": false, "why": "Mezhepler beşerî anlayışlar olduğu için mutlak ilahi vahiy niteliğinde değildir."}, {"t": "Farklı mezhepsel yorumların insanları zorunlu olarak dinden çıkardığını", "ok": false, "why": "Anlayış farklılıkları zenginlik veya beşerî yorum farkıdır, doğrudan dinden çıkma sebebi sayılamaz."}, {"t": "Bir mezhebin ortaya çıkışının tek bir nedene veya kişiye indirgenebileceğini", "ok": false, "why": "Mezheplerin doğuşunda psiko-sosyal, politik ve ekonomik pek çok etken birlikte rol oynar."}], "hint": "İlahi olan din ile beşeri olan yorum arasındaki farkı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1kb94b3", "ch": 2}, {"q": "Dinin özündeki ve Müslüman toplumun bütünlüğündeki bozulmayı ifade eden, sözlükte ise 'önceden olmadığı halde sonradan icat edilen şey' anlamına gelen kavram aşağıdakilerden hangisidir?", "o": [{"t": "Bid’at", "ok": true, "why": "Bid'at sözlükte sonradan çıkarılan şey, terim olarak ise dinin aslında olmadığı halde dine eklenen veya eksiltilen hususları ifade eder."}, {"t": "Makâlât", "ok": false, "why": "Makâlât, mezheplerin görüşlerini ve mezhep edebiyatını ifade eden klasik eser türüdür."}, {"t": "İttifak", "ok": false, "why": "İttifak birlik ve uyuşma anlamına gelir, bozulmayı değil bütünlüğü temsil eder."}, {"t": "Tefrika", "ok": false, "why": "Tefrika ayrılık ve bölünme demektir; dinin özündeki icat edilmiş yenilik anlamını doğrudan karşılayan kavram Bid'attır."}], "hint": "Din alanında sonradan ortaya çıkarılan usul veya inanç yenilikleri için kullanılan kavramı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1mkfj9w", "ch": 2}, {"q": "Erken dönem İslam tarihinde yaşanan Cemel ve Sıffîn Savaşları sonrasında Müslümanların birbirini öldürmesi, ikilamda kalan Müslümanlar arasında aşağıdaki konulardan hangisinin tartışılmasına zemin hazırlamıştır?", "o": [{"t": "Büyük günah işleyen kişinin (mürtekib-i kebîre) dini statüsü ve iman-amel ilişkisi", "ok": true, "why": "Müslümanların birbirleriyle savaşması 'büyük günah işleyen mümin midir, kâfir midir?' tartışmasını tetiklemiş ve ilk kelami kutuplaşmaları doğurmuştur."}, {"t": "Arapça gramer kurallarının tespiti ve sözlük çalışmaları", "ok": false, "why": "Gramer çalışmaları dilsel bir ihtiyaçtır, iç savaşların yarattığı itikadi krizle doğrudan ilgili değildir."}, {"t": "Kutsal mekânların ziyaret edilme usulleri", "ok": false, "why": "Bu konu ibadet fıkhı ile ilgilidir, iç savaşların doğurduğu iman ve yönetim tartışmalarından bağımsızdır."}, {"t": "Yunan felsefi eserlerinin Arapçaya tercüme edilip edilmemesi", "ok": false, "why": "Tercüme faaliyetleri Abbasiler döneminde yoğunlaşmıştır; ilk savaşların hemen arkasından çıkan temel sorun iman-küfür sınırıdır."}], "hint": "Büyük günah işleyenin durumu etrafında şekillenen iman tartışmasını göz önünde bulundurunuz.", "type": "multiple_choice", "a": "", "why": "", "qid": "jr1g3c", "ch": 2}, {"q": "Bedevi kabilelerin sert ve tavizsiz yaşam tarzlarının dini metinleri okuma biçimlerine yansıması ve katı bir tutum takınmaları, mezheplerin doğuşunda etkili olan faktörlerden hangisine örnektir?", "o": [{"t": "İnsanın tabiatı ve sosyal çevresi", "ok": true, "why": "Topluluğun yaşam şartları, kültürel yapısı ve mizaç özellikleri dini anlama ve yaşama biçimlerini doğrudan etkiler."}, {"t": "Sadece yabancı felsefe metinlerinin tercüme edilmesi", "ok": false, "why": "Çöl yaşamındaki bedevilerin tutumu felsefi tercümelerden ziyade kendi mizaç ve sosyal şartlarının ürünüdür."}, {"t": "Kur'an ayetlerinin çoğaltılarak merkezlere gönderilmesi", "ok": false, "why": "Metinlerin çoğaltılması standardize etme amacı taşır, bedevi mizacının sertliğini açıklamaz."}, {"t": "Zekât vergilerinin toplanma yöntemlerindeki teknik değişimler", "ok": false, "why": "İdari düzenlemeler mizaç ve katı dini tutum oluşumunun temel nedeni değildir."}], "hint": "Karakter, mizaç ve yaşam çevresinin insan tutumlarına etkisini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "164xzkq", "ch": 2}, {"q": "İnsanın fiillerinde tamamen özgür olduğunu, Allah'ın belirlediği bir kader yerine insanın kendi kaderini kendisinin tayin ettiğini savunan ilk mezhep aşağıdakilerden hangisidir?", "o": [{"t": "Kaderiyye", "ok": true, "why": "Kaderiyye, kaderi reddederek insanın kendi fiillerinin yaratıcısı olduğunu ve kaderini kendisinin belirlediğini savunur."}, {"t": "Cebriyye", "ok": false, "why": "Cebriyye, insanın hiçbir iradesi olmadığını ve rüzgâr önündeki yaprak gibi tamamen mecbur olduğunu savunur."}, {"t": "Mücessime", "ok": false, "why": "Mücessime, Allah'ı cisimlere benzeterek somutlaştıran akımdır."}, {"t": "İbâdiyye", "ok": false, "why": "İbâdiyye Hariciliğin günümüze ulaşan tek ılımlı koludur; kader tartışmasının merkezindeki ilk akım değildir."}], "hint": "İnsana fiil ve kader tayin etme gücü veren mezhebin adını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1d9vtev", "ch": 2}, {"q": "Emeviler döneminde yaşanan siyasi çatışmalar ve karşılıklı tekfir söylemleri karşısında; amel ile imanı ayırarak 'günah işleyen kimsenin durumunu Allah'a ertelemeyi' ilke edinen kuşatmacı anlayış aşağıdakilerden hangisidir?", "o": [{"t": "Mürcie", "ok": true, "why": "Mürcie, 'ertelemek' anlamına gelir ve büyük günah işleyenlerin durumunu Allah'a bırakarak Müslüman toplumda bütünleştirici bir rol oynamıştır."}, {"t": "Haricilik", "ok": false, "why": "Haricilik günah işleyenleri doğrudan tekfir eden dışlayıcı ve radikal bir tutum sergilemiştir."}, {"t": "Cebriyye", "ok": false, "why": "Cebriyye fiillerin insana değil Allah'a ait olduğunu savunur, imanı erteleme ilkesiyle öne çıkmaz."}, {"t": "Mu'tezile", "ok": false, "why": "Mu'tezile büyük günah işleyeni ne mümin ne kâfir sayıp iki konum arasında bir yerde görür."}], "hint": "Kelime anlamı 'erteleyen / tehir eden' olan ve Müslümanları tekfir etmekten kaçınan mezhebi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1vdpib3", "ch": 2}, {"q": "Mu'tezile mezhebinin kurucusu Vâsıl b. Atâ'nın, büyük günah işleyen kimsenin ne tam mümin ne de tam kâfir olduğunu, iki konum arasında bir yerde (el-Menzile beyne'l-Menzileteyn) bulunacağını belirtmesi aşağıdaki tartışmalardan hangisine verilen bir yanıttır?", "o": [{"t": "Büyük günah işleyenin (mürtekib-i kebîre) durumu meselesi", "ok": true, "why": "el-Menzile beyne'l-Menzileteyn prensibi doğrudan büyük günah işleyen kişinin iman-küfür bakımından konumu ile alakalıdır."}, {"t": "Allah'ın sıfatlarının zâtı ile aynı olup olmadığı meselesi", "ok": false, "why": "Bu konu Mu'tezile'nin Tevhid prensibi kapsamındadır."}, {"t": "Kötülüklerin engellenmesi ve iyiliğin emredilmesi ilkesi", "ok": false, "why": "Bu konu Emir bi'l-Ma'rûf Nehiy 'ani'l-Münker ilkesi ile alakalıdır."}, {"t": "Ahirette müminlerin cennet ve cehenneme sevk edilmesi kararı", "ok": false, "why": "Bu konu Va'd ve Vaîd prensibiyle açıklanır."}], "hint": "Hasan-ı Basrî'nin meclisinde büyük günah işleyenin durumu tartışılırken Vâsıl b. Atâ'nın ortaya koyduğu görüşü hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "yzcs16", "ch": 2}, {"q": "Dinî terim olarak Hz. Peygamber ve Ashâbı döneminde bulunmayıp sonradan ortaya çıkan, dinin özüne müdahale niteliğindeki yeni anlayış ve uygulamaları ifade eden kavram aşağıdakilerden hangisidir?", "o": [{"t": "Bid’at", "ok": true, "why": "Dinde Asr-ı Saadet'ten sonra ortaya çıkan ve şer'i dayanağı bulunmayan yenilikler bid’at olarak tanımlanır."}, {"t": "Tefrika", "ok": false, "why": "Birlik ve beraberliğin bozulması, ayrılık ve toplumsal bölünme anlamına gelir."}, {"t": "Dalâlet", "ok": false, "why": "Doğru yoldan sapma ve hidayetin zıddı durumu ifade eden genel bir kavramdır."}, {"t": "Celâdet", "ok": false, "why": "Yiğitlik, cesaret ve sertlik anlamına gelen ahlaki bir vasıftır."}], "hint": "Sözlük anlamı 'önceden benzeri olmadan icat edilen şey' olan bu kavram, dinde sonradan ortaya çıkan yenilikleri ifade eder.", "type": "multiple_choice", "a": "", "why": "", "qid": "1v3kjhf", "ch": 3}, {"q": "Sıffîn Savaşı sırasında yaşanan Tahkim Hadisesi'nin ardından, Hz. Ali'nin insanları hakem tayin etmesini kabul etmeyerek onun ordusundan ayrılan ilk siyasi fırka aşağıdakilerden hangisidir?", "o": [{"t": "Haricilik", "ok": true, "why": "Tahkim olayında insan hakemliğine itiraz ederek 'Hüküm ancak Allah'ındır' düşüncesiyle ana gövdeden ayrılan ilk gruptur."}, {"t": "Mu’tezile", "ok": false, "why": "Büyük günah tartışması sonucu Hasan-ı Basrî'nin meclisinden ayrılarak akılcı kelam ekolünü kurmuşlardır."}, {"t": "Mürcie", "ok": false, "why": "Sahabe arasındaki siyasi çekişmelerde tarafsız kalmayı ve hükmü Allah'a ertelemeyi tercih eden gruptur."}, {"t": "Zeydiyye", "ok": false, "why": "Zeyd b. Ali'nin Emevilere karşı başlattığı hareketle şekillenen ılımlı Şiî koludur."}], "hint": "Hakem olayına sert bir tutumla karşı çıkan ve ayrılıkçı bir yapı oluşturan gruptur.", "type": "multiple_choice", "a": "", "why": "", "qid": "5o3swp", "ch": 3}, {"q": "Büyük günah işleyen kimsenin (mürtekib-i kebîre) durumu konusunda hocası Hasan-ı Basrî ile görüş ayrılığına düşerek onun ders halkasını terk eden ve Mu'tezile mezhebinin temellerini atan alim kimdir?", "o": [{"t": "Vâsıl b. Atâ", "ok": true, "why": "Büyük günah işleyenin ne tam mümin ne de tam kafir olduğunu ileri sürerek hocasının meclisinden ayrılmış ve Mu'tezile'yi kurmuştur."}, {"t": "Cehm b. Safvân", "ok": false, "why": "İnsanın fiillerinde tamamen mecbur olduğunu savunan Cebriyye düşüncesinin önde gelen ismidir."}, {"t": "Ebû'l-Hüzeyl el-Allâf", "ok": false, "why": "Mu'tezile'nin sistemli kelam konularını geliştiren sonraki dönem alimlerindendir."}, {"t": "Bişr b. el-Mu'temir", "ok": false, "why": "Mu'tezile'nin Bağdat ekolünün kurucusu kabul edilen kelamcıdır."}], "hint": "Hocası Hasan-ı Basrî'nin 'O bizden ayrıldı' ifadesiyle anılan kurucu şahsiyettir.", "type": "multiple_choice", "a": "", "why": "", "qid": "1rugctn", "ch": 3}, {"q": "Mu'tezile ekolünün temel prensiplerinden biri olan 'el-Menzile beyne'l-menzileteyn' esası, kelam tarihindeki hangi temel tartışmayla doğrudan ilgilidir?", "o": [{"t": "Büyük günah işleyen kişinin imandaki durumu", "ok": true, "why": "Bu prensip, büyük günah işleyen kimsenin iman ile küfür arasında ara bir konumda yer aldığını savunur."}, {"t": "Allah'ın sıfatlarının ezeli olup olmaması", "ok": false, "why": "Bu tartışma Mu'tezile'nin tevhid ilkesi çerçevesinde sıfatları zatın aynı sayması konusudur."}, {"t": "Kur'an-ı Kerim'in yaratılmışlığı meselesi", "ok": false, "why": "Kur'an'ın kadim değil mahluk olduğu iddiası yine tevhid prensibine dayanır."}, {"t": "Devlet başkanının Kureyş soyundan seçilmesi gerekliliği", "ok": false, "why": "Bu husus imamet ve siyaset teorisine dair içtihadı bir konudur."}], "hint": "'İki konum arasında bir konum' anlamına gelen bu ilke, günahkar Müslümanın statüsünü konu edinir.", "type": "multiple_choice", "a": "", "why": "", "qid": "bkza6p", "ch": 3}, {"q": "İnsan fiillerinin yaratılmasında ilahi kaderin belirleyiciliğini reddederek fiilleri tamamen insanın özgür iradesine ve kudretine isnat eden mezhep aşağıdakilerden hangisidir?", "o": [{"t": "Kaderiyye", "ok": true, "why": "İnsanın kendi fiillerinin yaratıcısı olduğunu savunarak ilahi kaderin insan fiillerindeki mutlak belirleyiciliğini reddederler."}, {"t": "Cebriyye", "ok": false, "why": "İnsanın hiçbir irade ve güce sahip olmadığını, rüzgardaki yaprak gibi mecbur olduğunu savunur."}, {"t": "Mücessime", "ok": false, "why": "Allah'ı cismâni niteliklere ve insan uzuvlarına benzeterek tecsim eden akımdır."}, {"t": "Mürcie", "ok": false, "why": "İman ile ameli birbirinden ayırarak günahların imana zarar vermediğini ileri sürer."}], "hint": "İnsanın kendi fiillerinin kadir ve yaratıcısı olduğunu iddia eden gruptur.", "type": "multiple_choice", "a": "", "why": "", "qid": "9xmbro", "ch": 3}, {"q": "Büyük günah işleyenlerin durumunu Allah'a erteleyen, kapsayıcı ve bütünleştirici tutumu sayesinde Türk boylarının İslam dinini benimsemesinde olumlu rol oynayan mezhebi anlayış aşağıdakilerden hangisidir?", "o": [{"t": "Mürcie", "ok": true, "why": "Ameli imandan bir cüz saymayıp Müslümanları tekfir etmekten kaçınması, farklı toplumların İslam'a girişini kolaylaştırmıştır."}, {"t": "Haricilik", "ok": false, "why": "Katı tekfirci tutumları nedeniyle toplumsal bütünleşmeyi engelleyen dışlayıcı bir yaklaşım sergilemiştir."}, {"t": "Müşebbihe", "ok": false, "why": "Somut ilah tasavvuru ile kelami tartışmalara odaklanmış olup kitlesel İslamlaşmada olumlu rol üstlenmemiştir."}, {"t": "Şîa", "ok": false, "why": "İmamet esasını dinin merkezine koyarak siyasi ve itikadi şartlar öne sürmüştür."}], "hint": "Görüşleri 'ertelemek' anlamına gelen ve ameli imanın şartı görmeyen mezheptir.", "type": "multiple_choice", "a": "", "why": "", "qid": "uk8oc0", "ch": 3}, {"q": "Şîa düşüncesini diğer tüm İslâmî fırkalardan ayıran, dinî ve siyasi otoritenin Hz. Peygamber'in soyundan gelen masum şahıslara ait olduğu inancına dayanan temel itikat esası aşağıdakilerden hangisidir?", "o": [{"t": "İmâmet", "ok": true, "why": "Şîa'da imamet inancı dinin asıllarından kabul edilerek diğer mezheplerden temel ayrışma noktasını oluşturur."}, {"t": "Meâd", "ok": false, "why": "Ahiret hayatı ve yeniden dirilme inancı olup tüm İslam mezheplerinin ortak aslıdır."}, {"t": "Adâlet", "ok": false, "why": "Allah'ın adil olduğu prensibi Mu'tezile ve Şîa'da ortak temel ilkelerden biridir."}, {"t": "Nübüvvet", "ok": false, "why": "Peygamberlik müessesesi bütün Müslüman fırkalarca kabul edilen genel bir inanç esasıdır."}], "hint": "Devlet başkanlığı ve dini rehberliğin nas ile Ehl-i Beyt'e aidiyetini savunan esastır.", "type": "multiple_choice", "a": "", "why": "", "qid": "18lg5dn", "ch": 3}, {"q": "Şiî gelenekte Hz. Peygamber'in Veda Haccı dönüşünde Hz. Ali'yi kendisinden sonraki imam ve halife olarak açıkça tayin ettiğine inanılan tarihi olay aşağıdakilerden hangisidir?", "o": [{"t": "Gadir Hum Hadisesi", "ok": true, "why": "Şiî literatürde Hz. Peygamber'in Hz. Ali'yi açıkça veli ve halife tayin ettiği iddia edilen tarihi olaydır."}, {"t": "Kırtas Hadisesi", "ok": false, "why": "Hz. Peygamber'in vefatına yakın bir vasiyetyazdırmak istemesi ve çıkan tartışmayla ilgili olaydır."}, {"t": "Ridde Olayları", "ok": false, "why": "Hz. Ebû Bekir döneminde dinden dönen ve zekat vermeyen kabilelere karşı yürütülen askeri harekatlardır."}, {"t": "Ebvâ Toplantısı", "ok": false, "why": "Emevîlerin son döneminde Haşimoğulları'nın halife adayını belirlemek üzere toplandığı buluşmadır."}], "hint": "Mekke ile Medine arasında bir su birikintisi konaklama yerinde vuku bulduğu rivayet edilen gelişmedir.", "type": "multiple_choice", "a": "", "why": "", "qid": "11vpip7", "ch": 3}, {"q": "Hanefî çizgideki ameli anlayışı kelam düzeyinde sistemleştirerek Ehl-i Sünnet'in iki ana omurgasından birini oluşturan İmam Mâtürîdî'nin temel kelam eseri aşağıdakilerden hangisidir?", "o": [{"t": "Kitâbü't-Tevhîd", "ok": true, "why": "Mâtürîdî kelam sisteminin temel ilkelerini metotlu bir şekilde ortaya koyan ana eserdir."}, {"t": "el-Fark beyne'l-Fırak", "ok": false, "why": "Abdülkâhir el-Bağdâdî'nin mezhepler tarihine dair yazdığı klasik eserdir."}, {"t": "Makâlâtü'l-İslâmiyyîn", "ok": false, "why": "Ebû'l-Hasan el-Eş'arî'nin mezheplerin görüşlerini aktardığı eseridir."}, {"t": "el-Mevâkıf", "ok": false, "why": "Adudüddin el-Îcî'ye ait müteahhirûn dönemi kelam kitabıdır."}], "hint": "Allah'ın varlığı, birliği ve sıfatlarını ele alan, mezhebin temel metni niteliğindeki kitaptır.", "type": "multiple_choice", "a": "", "why": "", "qid": "1nrg0sd", "ch": 3}, {"q": "Şîa'nın günümüze kadar varlığını sürdürmüş kollarından biri olan ve günümüzde Yemen'de resmi ve yaygın bir mezhep olarak varlığını koruyan fırka aşağıdakilerden hangisidir?", "o": [{"t": "Zeydiyye", "ok": true, "why": "Dini ve hukuki görüşleriyle Ehl-i Sünnet'e en yakın duran Zeydiyye, Yemen bölgesinde varlığını sürdürmektedir."}, {"t": "İsmailiyye", "ok": false, "why": "Yedi imam inancına dayanan ve bâtınî tevil anlayışıyla tanınan bir Şiî koldur."}, {"t": "Kerbiyye", "ok": false, "why": "Muhammed b. el-Hanefiyye'nin gaybetine inanan erken dönem aşırı Şiî gruplardandır."}, {"t": "Bahailik", "ok": false, "why": "19. yüzyılda Şiilik bünyesinden çıkıp müstakil yeni bir dine dönüşen harekettir."}], "hint": "Efdal dururken mefzulün imametini caiz gören ılımlı Şiî koldur.", "type": "multiple_choice", "a": "", "why": "", "qid": "cloxah", "ch": 3}, {"q": "Hz. Ebû Bekir'in halife seçildikten hemen sonra devlet otoritesini sağlamak ve toplum bütünlüğünü korumak adına öncelikle odaklandığı temel sorun aşağıdakilerden hangisidir?", "o": [{"t": "Yalancı peygamberler ve zekat vermeyen kabilelerle mücadele etmek", "ok": true, "why": "Hz. Ebû Bekir, hilafetinin ilk döneminde Ridde savaşları ile iç düzeni ve ümmet birliğini yeniden tesis etmiştir."}, {"t": "Bizans ve Sâsânî imparatorluklarına karşı fetih hareketlerini durdurmak", "ok": false, "why": "Hz. Ebû Bekir döneminde fetihler durdurulmamış, Suriye ve Irak cephelerinde başlatılmıştır."}, {"t": "Kur'ân-ı Kerim nüshalarını çoğaltıp eyalet merkezlerine göndermek", "ok": false, "why": "Kur'an'ın çoğaltılıp dağıtılması Hz. Osman döneminde gerçekleşmiştir."}, {"t": "Kûfe ve Basra gibi ordu şehirlerini (emsâr) kurmak", "ok": false, "why": "Bu ordu şehirleri Hz. Ömer'in hilafeti döneminde inşa edilmiştir."}], "hint": "Dinden dönme emareleri gösteren ve zekat yükümlülüğüne başkaldıran gruplara karşı yürütülen mücadeledir.", "type": "multiple_choice", "a": "", "why": "", "qid": "kfubpw", "ch": 3}, {"q": "Selefî anlayışı yeniden canlandırarak Suud hanedanı nezdinde siyasi bir güç haline getiren ve Vehhâbiyye hareketinin kurucusu olan şahsiyet kimdir?", "o": [{"t": "Muhammed b. Abdülvahhâb", "ok": true, "why": "İbn Teymiyye çizgisindeki Selefî anlayışı siyasallaştırarak Suud emirliği bünyesinde resmi mezhep haline getirmiştir."}, {"t": "İbn Teymiyye", "ok": false, "why": "14. yüzyılda yaşamış ve Selefî düşüncenin teorik temellerini atmış Hanbelî alimdir."}, {"t": "Şevkânî", "ok": false, "why": "Yemenli müctehid alim olup mutlak ictihadı savunmuştur."}, {"t": "İbn Kayyım el-Cevziyye", "ok": false, "why": "İbn Teymiyye'nin en tanınmış öğrencisidir."}], "hint": "18. yüzyılda Necid bölgesinde ortaya çıkan itikadi hareketin lideridir.", "type": "multiple_choice", "a": "", "why": "", "qid": "1jv6und", "ch": 3}, {"q": "Ehl-i Sünnet ekolünü tanımlamak ve Müslümanların ana gövdesini ifade etmek amacıyla tarih boyunca çeşitli unvan ve tanımlamalar kullanılmıştır. Aşağıdakilerden hangisi bu isimlerden biri değildir?", "o": [{"t": "Sevâd-ı a'zam", "ok": false, "why": "Toplumun büyük çoğunluğunu ve ana gövdesini ifade etmek için kullanılan klasik bir Ehl-i Sünnet unvanıdır."}, {"t": "Ehl-i Beyt", "ok": true, "why": "Hz. Peygamber'in ev halkını ve soyunu ifade eden bir kavram olup Ehl-i Sünnet'i tanımlayan mezhepsel bir isim veya unvan değildir."}, {"t": "Fırka-i nâciye", "ok": false, "why": "Kurtuluşa eren topluluk anlamında Ehl-i Sünnet mensuplarını tanımlamada sıklıkla başvurulan bir nitelendirmedir."}, {"t": "Ehl-i Hak ve Ehl-i Hüdâ", "ok": false, "why": "Doğru yol ve hak üzere olanları tanımlamak amacıyla kullanılan geleneksel Sünni Unvanlardandır."}], "hint": "Bu kavram mezhepsel bir çatı ismi olmaktan ziyade Hz. Peygamber'in yakın hane halkını ifade eder.", "type": "multiple_choice", "a": "", "why": "", "qid": "10k6pvl", "ch": 4}, {"q": "Kelam ve tefsir alanında kaleme aldığı 'Kitâbü't-Tevhîd' ve 'Te'vîlâtü'l-Kur'ân' isimli eserleriyle tanınan ve Ehl-i Sünnet itikadının sistemleşmesine öncülük eden alim aşağıdakilerden hangisidir?", "o": [{"t": "Ebû'l-Hasan el-Eş'arî", "ok": false, "why": "Eş'arî ekolünün kurucusu olup en meşhur mezhepler tarihi eseri 'Makâlâtü'l-İslâmiyyîn'dir."}, {"t": "Ebû Mansur el-Mâtürîdî", "ok": true, "why": "Söz konusu iki temel eser Mâtürîdîlik ekolünün kurucusu sayılan Ebû Mansur el-Mâtürîdî tarafından kaleme alınmıştır."}, {"t": "Ebû'l-Mu'în en-Nesefî", "ok": false, "why": "Mâtürîdî kelam düşüncesini daha sonraki dönemlerde sistemleştirip yayan alimlerden biridir."}, {"t": "İmam-ı A'zam Ebû Hanîfe", "ok": false, "why": "Sünni fıkıh ve itikat geleneğinin öncülerindendir ancak 'Kitâbü't-Tevhîd' ve 'Te'vîlât' eserleri ona ait değildir."}], "hint": "Semerkand coğrafyasında yetişmiş, akıl ve nakil dengesini kuran Sünni kelam ekolünün kurucu figürüdür.", "type": "multiple_choice", "a": "", "why": "", "qid": "17h1qpt", "ch": 4}, {"q": "Selefî anlayışın 18. yüzyılda Vehhâbîlik hareketi çerçevesinde siyasallaşarak Suud hanedanlığı nezdinde resmi bir devlet mezhebine dönüşmesini sağlayan isim aşağıdakilerden hangisidir?", "o": [{"t": "İbn Kayyım el-Cevziyye", "ok": false, "why": "İbn Teymiyye'nin öğrencisi olup klasik Selefî çizginin orta çağdaki önemli temsilcilerindendir."}, {"t": "Şevkânî", "ok": false, "why": "Yemen bölgesinde yetişmiş bağımsız içtihat yanlısı ve Hadis ağırlıklı bir alimdir."}, {"t": "Muhammed b. Abdülvahhâb", "ok": true, "why": "Selefi düşünceyi siyasi bir ittifakla Vehhabilik adı altında kurumsallaştırarak devlet mezhebi haline getirmiştir."}, {"t": "İbnü'l-Vezîr", "ok": false, "why": "Hadis odaklı düşünceyi savunan ancak Vehhabilik hareketinin kurucusu olmayan bir alimdir."}], "hint": "Kendi adından türetilen hareketle Suudi Arabistan'ın kuruluş sürecindeki dinsel ve siyasal temeli atmıştır.", "type": "multiple_choice", "a": "", "why": "", "qid": "1hfqvjb", "ch": 4}, {"q": "İmam Rabbânî ile Mevlâna Hâlid Bağdâdî'nin Ehl-i Sünnet vurgusu ve tasavvufi yaklaşımı, aşağıdaki dönemlerin hangisinde kaleme alınan Mezhepler Tarihi eserlerine güçlü bir şekilde yansımıştır?", "o": [{"t": "Emeviler", "ok": false, "why": "Söz konusu alimlerin yaşadığı dönemlerden çok daha önceki ilk siyasi mezhepleşme dönemidir."}, {"t": "Abbasiler", "ok": false, "why": "Mu'tezile ve erken dönem mezhepleşme süreçlerinin öne çıktığı dönemi ifade eder."}, {"t": "Osmanlılar", "ok": true, "why": "Nakşibendî geleneğin bu iki büyük figürünün Ehl-i Sünnet vurgusu Osmanlı son dönemi mezhepler tarihi metinlerini derinden etkilemiştir."}, {"t": "Safeviler", "ok": false, "why": "İran coğrafyasında Şii-İmâmiyye anlayışını devlet mezhebi olarak benimseyen yapıya sahiptir."}], "hint": "Mücellid-i Elf-i Sânî ve Müceddidî kollarıyla Balkanlar ve Anadolu'da etkili olan devlet yapısını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1jm005a", "ch": 4}, {"q": "Ebû'l-Hasan el-Eş'arî'nin, İslam mezheplerini ve bu fırkaların temel görüşlerini tarafsız bir üslupta ele aldığı meşhur kaynağı aşağıdakilerden hangisidir?", "o": [{"t": "Makâlâtü'l-İslâmiyyîn", "ok": true, "why": "Eş'arî'nin mezheplerin görüşlerini sistemli ve betimleyici tarzda sunduğu en bilinen klasik eseridir."}, {"t": "el-Fark beyne'l-Fırak", "ok": false, "why": "Eş'arî kelamcısı Abdülkāhir el-Bağdâdî tarafından kaleme alınan mezhepler tarihi eseridir."}, {"t": "el-Milel ve'n-Nihal", "ok": false, "why": "Şehristânî'nin dinler ve mezhepler tarihine dair ünlü çalışmasıdır."}, {"t": "Kitâbü't-Tevhîd", "ok": false, "why": "Ebû Mansur el-Mâtürîdî'nin kelam konularını işlediği temel eseridir."}], "hint": "Eserin adı 'Müslümanların Makaleleri/Görüşleri' anlamına gelmektedir.", "type": "multiple_choice", "a": "", "why": "", "qid": "fyklos", "ch": 4}, {"q": "Şîa itikadında Hz. Ali'nin Hz. Peygamber tarafından açıkça vası tayin edildiği ve imametinin ilahi rıza ile kesinleştiği kabul edilen tarihi olay aşağıdakilerden hangisidir?", "o": [{"t": "Kırtas Hadisesi", "ok": false, "why": "Hz. Peygamber'in vefatına yakın vasiyet yazmak istemesi üzerine yaşanan tartışmalı olaydır."}, {"t": "Gadir Hum Hadisesi", "ok": true, "why": "Şii anlayışa göre Hz. Peygamber'in Veda Haccı dönüşü Hz. Ali'yi veli ve halef ilan ettiği mekandır."}, {"t": "Tahkim Olayı", "ok": false, "why": "Sıffîn Savaşı sonrasında Hariciliğin doğuşuna zemin hazırlayan siyasi süreçtir."}, {"t": "Hayber'in Fethi", "ok": false, "why": "Hz. Ali'nin kahramanlık gösterdiği askeri bir zafer olup imametin tespitiyle doğrudan ilgili değildir."}], "hint": "Veda Haccı dönüşünde Mekke ile Medine arasında yer alan bir su birikintisi ve mevki adıdır.", "type": "multiple_choice", "a": "", "why": "", "qid": "1rz1yb9", "ch": 4}, {"q": "Şîa mezhebini diğer tüm İslami fırka ve ekollerden ayıran, dinin temel esaslarından biri (aslü'd-dîn) sayılan prensip aşağıdakilerden hangisidir?", "o": [{"t": "Tevhid", "ok": false, "why": "Bütün İslami mezheplerin ortak kabul ettiği Allah'ın birliği esasıdır."}, {"t": "Nübüvvet", "ok": false, "why": "Peygamberlik müessesesi tüm Müslüman gruplarca kabul gören ortak inanç esasıdır."}, {"t": "İmâmet", "ok": true, "why": "Devlet başkanlığı ve manevi rehberliğin nass ile tayin edilmiş masum imamlara ait olduğunu savunmak Şîa'nın belirleyici rüknüdür."}, {"t": "Meâd", "ok": false, "why": "Ahiret gününe ve yeniden dirilişe iman İslam dininin genel ilkesidir."}], "hint": "Hz. Ali ve soyundan gelenlerin dini ve siyasi liderliğini inanç esaslarına dahil eden görüştür.", "type": "multiple_choice", "a": "", "why": "", "qid": "hdtl2n", "ch": 4}, {"q": "Şîa'nın günümüze kadar varlığını sürdürmüş büyük kollarından biri olan ve Yemen'de resmi düzeyde temsil edilen fırka aşağıdakilerden hangisidir?", "o": [{"t": "Zeydiyye", "ok": true, "why": "Zeyd b. Ali'ye nispet edilen ve Ehl-i Sünnet'e en yakın Şii kol olarak Yemen'de varlığını sürdüren gruptur."}, {"t": "Kerbiyye", "ok": false, "why": "Erken dönemde yok olmuş aşırı (gālî) Şii gruplardandır."}, {"t": "Beyâniyye", "ok": false, "why": "Tarihte kalmış ve günümüze ulaşamamış gulat-ı Şîa teşekküllerindendir."}, {"t": "Muhammire", "ok": false, "why": "Kızıl giysiler giyen ve günümüzde yaşayan ana Şii kollardan biri olmayan tarihi bir gruptur."}], "hint": "İmamet konusunda silahlı kıyamı şart koşan ve Zeyd b. Ali'nin imametini benimseyen fırkadır.", "type": "multiple_choice", "a": "", "why": "", "qid": "eezaaw", "ch": 4}, {"q": "Mu'tezile mezhebinin temel ilkelerinden biri olan 'el-Menzile beyne'l-Menzileteyn' prensibi doğrudan hangi tartışma sonucunda ortaya çıkmıştır?", "o": [{"t": "Allah'ın sıfatlarının ezeli olup olmaması", "ok": false
