tarihi örselenmelere bir cevap olarak yıldönü­"}, {"p": "mü tepkileri, mensuplara uygulanan beyin yıkama ve karizmatik ikna taktikleri yine Din… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025-2026 · Soru 1**: ------- dinin özündeki ve Müslüman toplumun bütünlüğündeki bozulmayı ifade eden kavramdır. Yukarıdaki cümlede boş bırakılan yeri aşağıdakile"}, {"li": "[2] **2025-2026 · Soru 2**: Aşağıdakilerden hangisi İslam mezhepleri tarihi disiplini ile din sosyolojisinin ortak çalışma konuları arasında yer almaz?"}, {"li": "[3] **2025-2026 · Soru 3**: Aşağıdakilerden hangisi mezhepleri isimlendirme ve sınıflama konusunda ki metodolojik problemlerden biri değildir?"}, {"li": "[4] **2025-2026 · Soru 4**: Aşağıdakilerden hangisi İslam mezhepleri tarihi biliminin amaçlarından biri değildir?"}, {"li": "[5] **2025-2026 · Soru 17**: -------, Şîa’yı diğer İslamî fırkalardan ayıran en önemli itikat esasıdır. Yukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğ"}, {"li": "[6] **2025-2026 · Soru 19**: Aşırı Şii fırkalar tarafından ileri sürülen ve ilâhî ruhun Hz. Peygamber’e, sonra da Ali ve evlatlarına intikal ettiği düşüncesini ifade ede"}, {"li": "[7] **2024-2025 · Soru 2**: Aşağıdakilerden hangisi İslam mezhepleri tarihinin araştırma alanları arasında yer almaz?"}, {"li": "[8] **2024-2025 · Soru 4**: ------- dinin özündeki ve Müslüman toplumun bütünlüğündeki bozulmayı ifade eden kavramdır. Yukarıdaki cümlede boş bırakılan yeri aşağıdakile"}, {"li": "[9] **2024-2025 · Soru 19**: - 2025 Güz Dönemi Ara Sınav -------, Şîa’yı diğer İslamî fırkalardan ayıran en önemli itikat esasıdır. Yukarıdaki cümlede boş bırakılan yeri"}, {"li": "[10] **2023-2024 · Soru 1**: Aşağıdakilerden hangisi İslam mezhepleri tarihi biliminin amaçlarından biri değildir?"}, {"li": "[11] **2023-2024 · Soru 2**: ------- dinin özündeki ve Müslüman toplumun bütünlüğündeki bozulmayı ifade eden kavramdır. Yukarıdaki cümlede boş bırakılan yeri aşağıdakile"}, {"li": "[12] **2023-2024 · Soru 4**: Aşağıdakilerden hangisi İslam Mezhepleri tarihçisinin ana kaynakları okuyup anlamlandırırken karşılaştığı metodolojik problemlerden biridir?"}], "sources": [{"title": "1- The Relationship Between Religion and Sects | History of Sects | Assoc. Prof. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=b4gBBKiduvg"}, {"title": "2- Bir Mezhep Nasıl Oluşur? | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=-7EaH53FX1U"}]}, {"n": 2, "title": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "summary": "Bu bölümde ihtilaf ile tefrika arasındaki farklar açıklanarak mezheplerin birer zenginlik mi yoksa problem mi olduğu tartışılmaktadır. İslam toplumunda itikadi mezhepleşmeye zemin hazırlayan dış kültürlerle karşılaşma, metinlerin yapısı ve siyasi olaylar ayrıntılı olarak sunulmaktadır. Ayrıca mezhepsizlik ve mezhepçilik gibi uç yaklaşımların tehlikeleri ve hakkaniyetli orta yolun önemi belirtilmektedir.", "objectives": ["İhtilaf ve iftirak kavramları arasındaki farkı ayırt edebilmek.", "İslam'da itikadi mezhepleşmeye yol açan iç ve dış sebepleri sıralayabilmek.", "Mezhepçilik ile mezhepsizlik söylemlerinin getirdiği problemleri değerlendirebilmek."], "notes": [{"h": "2. Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri"}, {"p": "Bu bölümde ihtilaf ile tefrika arasındaki farklar açıklanarak mezheplerin birer zenginlik mi yoksa problem mi olduğu tartışılmaktadır. İslam toplumunda itikadi mezhepleşmeye zemin hazırlayan dış kültürlerle karşılaşma, metinlerin yapısı ve siyasi olaylar ayrıntılı olarak sunulmaktadır. Ayrıca mezhepsizlik ve mezhepçilik gibi uç yaklaşımların tehlikeleri ve hakkaniyetli orta yolun önemi belirtilmektedir."}, {"h": "Öğrenme hedefleri"}, {"li": "İhtilaf ve iftirak kavramları arasındaki farkı ayırt edebilmek."}, {"li": "İslam'da itikadi mezhepleşmeye yol açan iç ve dış sebepleri sıralayabilmek."}, {"li": "Mezhepçilik ile mezhepsizlik söylemlerinin getirdiği problemleri değerlendirebilmek."}, {"h": "Ünite 2: Mezheplerin Ortaya Çıkış Nedenleri"}, {"p": "*AÖF ders kitabı, Ünite 2, PDF sayfa ~35-45.*"}, {"li": "Ünite - Mezheplerin Ortaya Çıkış Nedenleri"}, {"p": "Hariciler’in sert mizaçları din anlayışlarına ne şekilde yansımıştır? Hariciler’in hangi itika­"}, {"p": "di görüşlerinde bu mizaçlarının etkisi görülmektedir?"}, {"p": "Nassların Tabiatı"}, {"p": "Mezheplerin doğuşuna yol açan farklılaşmalar zaman zaman nassların yoru­mu konu­"}, {"p": "sundaki görüş ayrılıklarından beslenmiştir. Nasslardan kast edilen Kur’an ayetleri ve ha­"}, {"p": "dislerdir. Nassların mezheplerin ortaya çıkışı ve gelişim süreçleri açısından çok yönlü et­"}, {"p": "kileri olmuştur. Nasslar kimi zaman görüş ayrılıklarının doğrudan sebebi olurken, kimi"}, {"p": "zaman da nasslardan bağımsız olarak oluşan yaklaşım tarzlarının temellendirilmesinde"}, {"p": "kullanılmışlardır."}, {"p": "Kur’an’ın insan aklına tanıdığı geniş hareket alanının, bunda etkili olduğu kuşkusuz­"}, {"p": "dur. Pek çok ayette insan düşünmeye ve aklını kullanmaya davet edilmekte, körü körüne"}, {"p": "bir inanma şekli şiddetle eleştirilmektedir. Kendisine yaklaşılması için Kuran’ın hiçbir ön"}, {"p": "şart getirmemiş olması, her insan veya topluluğun psiko-sosyal eğilimleri doğrultusunda"}, {"p": "Kuran’a yaklaşmalarını beraberinde getirmiştir. Aslında bu farklılaşmaya bizzat Kuran’ın"}, {"p": "kendisi imkân tanımaktadır. Çünkü Kur’an-ı Kerim’de bütün insanlar tarafından aynı şe­"}, {"p": "kilde anlaşılabilecek muhkem ayetlerin yanı sıra farklı şekillerde anlaşılabilecek ayetler de"}, {"p": "bulunmaktadır."}, {"p": "Müteşabihât olarak adlandırılan ve ne anlama geldiği hususunda doğrudan değerlen­"}, {"p": "dirmede bulunmanın mümkün olmadığı ayetler pek çok farklı yorumun ortaya çıkmasına"}, {"p": "sebep olmuştur. “Allah’ın eli”, “Allah’ın yüzü”, “Allah’ın arşa istiva etmesi” gibi anlamı kapalı"}, {"p": "ifadeler farklı değerlendirme­lere konu olmuş ve bu çerçevede farklı mezhebi tutumların"}, {"p": "ortaya çıkmasına yol açmıştır. Örneğin Mücessime ve Müşebbihe olarak adlandırılan"}, {"p": "mezhepler, bu ayetleri zahiri anlamları doğrultusunda yorumlamış ve Allah’a insanlarda­"}, {"p": "kine benzer tarzda uzuvlar nispet etmişlerdir."}, {"p": "Nassların kendisinden kaynaklanmayan kimi görüş ayrılıkları da zaman zaman yine"}, {"p": "nasslardan delil getirilerek doğrulanmaya çalışılmıştır. Zira Kur’an ve Sünnet İslâm dini­"}, {"p": "nin en temel iki kaynağıdır. Bir yaklaşım tarzının doğru olup olmadığının en temel göster­"}, {"p": "gesi, bu yaklaşımın bu iki kaynakta herhangi bir dayanağının bulunup bulunmadığıdır. Bu"}, {"p": "yüzden Müslümanlar, hem bireysel hem de toplumsal düzeyde sahip oldukları bakış açı­"}, {"p": "larının doğruluğunu Kuran veya hadislerden buldukları delillerle desteklemeye ve meşru"}, {"p": "göstermeye çalışmışlardır."}, {"p": "Bunun en tipik yansımalarını Haricîlik’te ve Şiîlik’te görebilmek müm­kündür. Ha­"}, {"p": "riciler Hz. Ali’yi kötülemek için ayetlerden deliller getirmeye çalışırken, Şiiler de yine"}, {"p": "onu ve diğer imamların üstünlüğünü ortaya koymak için Kur’an ayetlerine müracaat et­"}, {"p": "mişlerdir. Klasik İslâm mezheplerinin yanı sıra son dönemde ortaya çıkan, Ahmedîlik,"}, {"p": "Bâbîlik, Bahâilik gibi yeni mezhep ve dinlerin bile yaklaşımlarını Kur’an’a atıfta bulunarak"}, {"p": "doğrula­maya çalışmaları, nassların mezheplerin ortaya çıkışındaki rolünü ortaya koyması"}, {"p": "bakımından önemlidir. ⟦1⟧"}, {"p": "**Farklı Din, Kültür ve Medeniyetlerle Olan Etkileşimler**"}, {"p": "İslâm dini, Arap Yarımadası’nda doğdu. Arap Yarımadası, Asya, Afrika ve Avrupa’nın ke­"}, {"p": "siştiği önemli bir kavşak noktasıdır. Doğu’da Basra ve Umman körfezlerine, güneyde Hint"}, {"p": "Okyanusu’na ve batıda Kızıldeniz’e kıyısı olup, üç tarafı denizlerle çevrilidir. İklim koşulla­"}, {"p": "rının elverişsiz olması bölgede tek ve hâkim bir uygarlığın oluşmasına engel teşkil etmiştir."}, {"p": "Buna karşın Arap Yarımadası’nın Uzak Doğu, Afrika ve Akdeniz ülkeleri arasında­"}, {"p": "ki ticaret yolu üzerinde köprü görevi görmesi, bölgeyi çok sayıda kültür ve medeniyetin"}, {"p": "etkisine açık hale getirmiştir. İslâm’ın doğuşu sırasında bölge, kültür ve medeniyet bakı­ ⟦2⟧"}, {"p": "mından güçlü devletlerle çevrelenmişti. Kuzeyinde Bizans İmparatorluğu, Doğu’da Sasani"}, {"p": "Devleti, Güney’de Yemen ve Habeşistan Krallıkları bulunmaktaydı. Kâbe önemli bir dinî"}, {"p": "figür olmasının yanı sıra aynı zamanda Mekke’yi bir ticaret ve kültür değişim merkezi"}, {"p": "haline getiren bir buluşma noktasıydı."}, {"p": "Bölgede dini açıdan Yahudilik, Hıristiyanlık, Mecusilik ve Putperestlik hâkim inanma"}, {"p": "biçimleriydi. İslâm, Mekke ve Medine sınırlarını aşıp geniş kitlelere ulaştıkça, farklı dinle­"}, {"p": "re ve kültürlere mensup kişileri de kendi bünyesinde eritti. Yeni Müslüman olan kimseler,"}, {"p": "eski düşünme ve inanma biçimlerini terk etmelerine karşın, eski kültürel dokularını ve"}, {"p": "yaşam şekillerini belirli ölçüde muhafaza ettiler. Bu durum, İslâm bünyesinde farklı algı"}, {"p": "ve düşünme biçimlerinin oluşmasına yol açtı. Bu farklılaşmalar da zamanla mezheplerin"}, {"p": "ortaya çıkışını hazırladı. İslâm sınırları coğrafi olarak genişledikçe yeni Müslüman olanlar"}, {"p": "aracılığıyla yeni kültür ve medeniyetler de İslâm içerisinde kendine yer bulmaya başladı."}, {"p": "Örneğin Sasani kültüründeki yarı ilahî, yarı insanî kral anlayışı, İslâm düşüncesinde bazı"}, {"p": "Şiî oluşumların zeminini oluşturdu."}, {"p": "İslâm, özünde şehir yaşamını merkeze alan bir dindir. Medine döneminde inen ayet­"}, {"p": "lerin içeriklerine bakıldığında yeni dinin mesajının toplumsal alan üzerinde şekillendiği"}, {"p": "dikkatlerden kaçmamaktadır. Hz. Peygamber döneminden itibaren Mekke ve Medine,"}, {"p": "yeni dinin merkezi olmaları dolayısıyla bir cazibe merkezine dönüştü ve çok fazla göç"}, {"p": "almaya başladı. Bu durum, söz konusu şehirlerin nüfusunun kısa sürede artmasına ve… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "Ünite 3: Yönetim, İman-Küfür ve Kader Meseleleri Etrafında Oluşan İlk Mezhepler"}, {"p": "*AÖF ders kitabı, Ünite 3, PDF sayfa ~49-65.*"}, {"li": "Ünite - Yönetim, İman-Küfür ve Kader Meseleleri Etrafında Oluşan İlk Mezhepler"}, {"p": "riye kalanlar Abdullah b. Vehb er-Râsibî’yi kendilerine emîr seçti (37/658). Küçük gruplar"}, {"p": "halinde gizlice Kûfe’den çıkarak Nehrevan kasabasında toplanıp kısa zamanda çevrede"}, {"p": "tam bir terör havası estirmeye başladılar. Kendi görüşlerine katılmayan, önderlerini halife"}, {"p": "olarak tanımayan, Hz. Ali ve Hz. Osman’ı tekfir etmeyen ve lânetlemeyen Müslümanları"}, {"p": "kâfir sayıyorlar, acımasızca öldürüyorlardı."}, {"p": "Ashâbtan Abdullah b. Habbâb b. Eret ile hamile eşini sorguya çekmişler (isti’raz) ve ‘Ali"}, {"p": "müşriktir’ demediği için öldürmüşlerdi. Bunun üzerine Nehrevân’da, Hz. Ali’nin ordusu"}, {"p": "tarafından Hâricîlerin tamamına yakını öldürüldü (38/658). Böylece Haricîler’le münase­"}, {"p": "betler koptu ve artık onların Hz. Ali’nin saflarına katılmaları ümidi kesin olarak kalmadı."}, {"p": "Çünkü Haricîler, Nehrevan’da dostlarının başına gelenleri hatırladıkça gayrete geliyor ve"}, {"p": "kinleri alevleniyordu. Nehrevan olayının sonuçlarından birisi de sağ olarak kurtulanlar­"}, {"p": "dan ikisinin Uman’a, ikisinin Kirman’a, ikisinin Sicistan’a, ikisinin el-Cezîre’ye, birinin de"}, {"p": "Yemen’e gitmesi ve Hariciyye düşüncesinin bu bölgelerde zuhur eden şer toplulukları tesir"}, {"p": "altına almasıdır. Nehrevân hezimetinden sonra hayatta kalabilen Hâricîlerin başka bölge­"}, {"p": "lere kaçtıkları ve buralarda çok sayıda Hâricî kollar oluşturdukları bilinmektedir."}, {"p": "Nehrevân bozgunu Hâriciler üzerinde silinmez bir etki bırakmış, onlar için Allah yo­"}, {"p": "lunda ölmenin, şahâdetin bir simgesi hâline gelmiştir. Bu olaydan sonra Hâricileri yön­"}, {"p": "lendiren en önemli duygu, intikam duygusu olmuş ve bu, bir türlü tatmin edilememiştir."}, {"p": "Bundan sonra Haricîler, Hz. Ali’nin şehid edilmesine kadar zaman zaman küçük mahallî"}, {"p": "isyanlar çıkardılar. Bunların en önemlisi, Nehrevan’dan kurtulup Şehrezûr’a kaçan Ebû"}, {"p": "Meryem es-Sa’dî’nin isyanıdır. Hâricîler, Mekke’de hazırladıkları son eylem plânına göre,"}, {"p": "Hz. Ali, Muâviye ve Amr b. el-As’ı öldürerek hilafet meselesine kendilerince bir çözüm"}, {"p": "getirmeyi hedeflemişlerdi. Bu amaçla her üç şahıs için birer suikastçı görevlendirmişlerdi."}, {"p": "Hz. Ali’nin öldürülmesiyle görevlendirilen kişi Abdurrahman b. Mülcem idi. Sabah na­"}, {"p": "mazına gitmekte olan halîfeye saldırarak onu yaraladı. Bu yara neticesinde Ali, 21 Rama­"}, {"p": "zan 40 (28 Ocak 661) tarihinde şehid oldu."}, {"p": "Emevîler döneminde Hârici isyanları devam etmiştir. Ancak isyanların Muâviye tara­"}, {"p": "fından çok şiddetli bir şekilde bastırıldığını gören Hâricîler, Nehrevan’da ölen Abdullah"}, {"p": "b. Vehb er-Râsibî’den beri ilk defa şûra yoluyla kendilerine bir halife seçerek Müstevrid b."}, {"p": "Ullefe et-Teymî’ye biat ettiler. 42/662 ve 43/663 yılında yeni bir ayaklanmaya karar verdi­"}, {"p": "ler. Müstevrid’in de hayatını kaybettiği bu isyandan çok az sayıda Haricî kurtulabildi. Kufe"}, {"p": "Hâricîleri’nin Müstevrid’den sonra yeni bir halife seçmeleri ve ikinci bir isyana teşebbüs­"}, {"p": "leri, hapisten çıkan Hâricîler’in Hayyân b. Zabyân’a biat etmelerinin ardından 58 (677) yılı"}, {"p": "sonunda vuku buldu. Ancak bu ayaklanma da Kufe valisinin sert tedbirleriyle 59 (678)"}, {"p": "yılı başında bastırıldı ve Kufe yakınlarındaki Bânikyâ’da Hâricîler’in neredeyse tamamı"}, {"p": "öldürüldü. Bu yenilgi bir bakıma Kufe Hâricîliği’nin sonu olmuştur.… ⟦1⟧"}, {"p": "**MÜRCİE MEZHEBİ**"}, {"p": "İsimlendirme ve Kavramsal Çerçeve"}, {"p": "Mürcie kelimesi, “tehir etmek, “ümit vermek” anlamlarına gelen “ircâ’” kökünden türe­"}, {"p": "tilmiş çoğul bir isimdir. Kur’an-ı Kerim’de ircâ’ kelimesi bu manalarda çeşitli şekillerde"}, {"p": "geçmektedir (A’râf, 8/111; ayrıca bk. Tevbe, 9/16; Şuara, 26/36). Mürtekib-i kebîre (büyük"}, {"p": "günah sahibi müslüman) hakkındaki son kararı Allah’a ve âhiret gününe bırakan bu gru­"}, {"p": "ba, “tehir edenler, erteleyenler” anlamında “Mürcie” denmiştir."}, {"p": "Mürcie kelimesinin “ertelemek, sonraya bırakmak” anlamına gelen “ircâ’ veya “bek­"}, {"p": "lenti içinde olmak, ümit etmek” mânasındaki recâ’ kökünden geldiği konusunda farklı"}, {"p": "görüşler ileri sürülmüşse de kelimenin, aslî harflerinin sonuncusu hemze olan ircâ’dan"}, {"p": "türemiş olduğu fikri tercih edilmektedir. Bunun yanında, aslî harflerinin sonuncusu vâv"}, {"p": "olan recâ’ kökünden ircâ’ kalıbında kullanıldığında birinci anlamın değişmediği konusun­"}, {"p": "da da ittifak vardır. Terim olarak ise, “günahın imana zarar vermediği tezini savunarak,"}, {"p": "büyük günah işleyene ümit veren ve onun hakkındaki nihai kararı Allah’a havale edip"}, {"p": "tehir edenler” anlamına gelmektedir. Bu bağlamda Mürcie, siyasî ve itikadî bir fırka olarak"}, {"p": "büyük günah işleyenlerin durumlarını Allah’a bırakıp, manevî sorumlulukları hakkında"}, {"p": "düşüncelerini açıklamayan topluluklara verilen ortak bir isimdir. Ayrıca Mürcie kavramı"}, {"p": "“amelleri niyet ve inançtan sonraya bırakan”, “büyük günah işleyenlere ümit veren” veya"}, {"p": "“imanı sırf dille ikrardan ibaret gören” şeklinde de tanımlanmıştır. Başlangıçta siyasî alan­"}, {"p": "da bir tarafsızlığın ifadesi olan Mürcie, tarihi süreç içerisinde akaid sahasındaki tarafsız­"}, {"p": "lığın da adı olmuştur. Buna göre, Mürcie, “tâatın kâfire bir faydası olmadığı gibi, günahın ⟦2⟧"}, {"p": "da imana bir zararı yoktur” şeklindeki ilkeyi kabul etmek suretiyle büyük günah işleyen"}, {"p": "kimseye ümit vermiştir. Diğer bir görüşe göre ise, imamet konusunda, Hz. Ali’yi birinci"}, {"p": "sıradan dördüncü sıraya bıraktıkları, başka bir ifade ile hilafete geçişte erteleme yaptıkları"}, {"p": "için onlara “erteleyen” anlamında Mürcie denilmiştir.… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025-2026 · Soru 6**: İslâm mezheplerinin oluşumunda etkili olan unsurların başında insanın kişisel özelliklerinden kaynaklanan farklılıklar gelmektedir . İnsanın"}, {"li": "[2] **2025-2026 · Soru 7**: Mezhepler ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?"}, {"li": "[3] **2024-2025 · Soru 6**: Tarihte ortaya çıkan tüm mezheplerin kendi görüşlerini Kur’ân’a atıfta bulunarak doğrulamaya çalışmaları, mezheplerin ortaya çıkışında etkil"}, {"li": "[4] **2024-2025 · Soru 8**: Çeşitli felsefi gelenekler İslam düşüncesine ve mezheplerin doğuşuna etki etmiştir. Yunan ve Mısır medeniyetlerine ait felsefi birikim Şiî m"}, {"li": "[5] **2023-2024 · Soru 3**: Aşağıdakilerden hangisi İslam Mezhepleri Tarihi ile Din Sosyolojisi’nin ortak çalışma alanlarından biridir?"}, {"li": "[6] **2023-2024 · Soru 6**: Mezhepler, bireysel ve toplumsal bir kişilik olarak insanın, dini anlama ve yorumlama biçimlerinin zamanla kurumsallaşması üzerine kuruludur"}, {"li": "[7] **2023-2024 · Soru 7**: Mezhepler ile ilgili a şağıdaki ifadelerden hangisi doğrudur?"}, {"li": "[8] **2023-2024 · Soru 8**: - 2024 Güz Dönemi Mezheplerin “dinin anlaşılma biçimleri” ve “din alanındaki farklılaşmaların birer ürünü” olması ne anlam ifade etmektedir?"}, {"li": "[9] **2022-2023 · Soru 3**: Aşağıdakilerden hangisi İslam Mezhepleri Tarihi ile Din Sosyolojisi’nin ortak çalışma alanlarından biridir?"}, {"li": "[10] **2022-2023 · Soru 6**: Mezhepler ile ilgili a şağıdaki ifadelerden hangisi doğrudur?"}, {"li": "[11] **2022-2023 · Soru 7**: Mezheplerin “dinin anlaşılma biçimleri” ve “din alanındaki farklılaşmaların birer ürünü” olması ne anlam ifade etmektedir?"}, {"li": "[12] **2022-2023 · Soru 2**: Aşağıdakilerden hangisi İslam Mezhepleri Tarihi ile Din Sosyolojisi’nin ortak çalışma alanlarından biridir?"}], "sources": [{"title": "3- \"Hak Mezhep\" Söylemi | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=hNIKhXt1hDw"}, {"title": "4- İslam'da Mezhepleşmenin Sebepleri | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=NbB-jbETFFY"}]}, {"n": 3, "title": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "summary": "Bu bölümde Sıffin Savaşı ve Tahkim Hadisesi sonrasında Hz. Ali ordusundan ayrılarak ortaya çıkan ilk itikadi grup olan Hariciler incelenmektedir. Hariciliğin isimleşme süreci, kabilevi ve sosyal yapısı ile itikadi söylemlerinin gelişim aşamaları ele alınmaktadır. Ayrıca Ezrika gibi radikal kollar ile günümüze ulaşan tek kol olan İbaziyye arasındaki farklar açıklanmaktadır.", "objectives": ["Hariciliğin ortaya çıkışında etkili olan siyasi ve dini faktörleri açıklayabilmek.", "Haricilere verilen isimleri ve bu isimlerin anlam içeriklerini analiz edebilmek.", "Ezrika'nın radikal tutumu ile İbaziyye'nin ılımlı çizgisi arasındaki niteliksel farkları kavrayabilmek."], "notes": [{"h": "3. İlk Siyasi-İtikadi Mezhepleşme: Hariciler"}, {"p": "Bu bölümde Sıffin Savaşı ve Tahkim Hadisesi sonrasında Hz. Ali ordusundan ayrılarak ortaya çıkan ilk itikadi grup olan Hariciler incelenmektedir. Hariciliğin isimleşme süreci, kabilevi ve sosyal yapısı ile itikadi söylemlerinin gelişim aşamaları ele alınmaktadır. Ayrıca Ezrika gibi radikal kollar ile günümüze ulaşan tek kol olan İbaziyye arasındaki farklar açıklanmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Hariciliğin ortaya çıkışında etkili olan siyasi ve dini faktörleri açıklayabilmek."}, {"li": "Haricilere verilen isimleri ve bu isimlerin anlam içeriklerini analiz edebilmek."}, {"li": "Ezrika'nın radikal tutumu ile İbaziyye'nin ılımlı çizgisi arasındaki niteliksel farkları kavrayabilmek."}, {"h": "Ünite 4: Ehl-i Sünnet ve’l Cemaat"}, {"p": "*AÖF ders kitabı, Ünite 4, PDF sayfa ~69-87.*"}, {"li": "Ünite - Ehl-i Sünnet ve’l Cemaat"}, {"p": "sıfatlarını kabul etmesi sebebiyle özellikle Mutezile tarafından Sıfâtiyye (sıfatçılar) olarak"}, {"p": "isimlendirilmiştir. Haberî sıfatları hakiki anlamlarında ve Zât’a ait birer gerçeklik olarak"}, {"p": "ispat etmelerinden dolayı Müşebbihe, Allah’ı cisim sayanlar anlamında Müces­sime isim­"}, {"p": "leri verilmiştir. Yine, Allah’ın âleme her an müdahale etme­sini gerektiren sıfatları kabul"}, {"p": "ettikleri, kula kısıtlı bir irade hürriyeti verdikleri için Mücbire adı verilmiştir. Bu sıfatları"}, {"p": "kaba manalarda ele aldıkları, Allah ile mahlukâtı arasında kaba benzetmeler yaptıkları"}, {"p": "için Haşviyye diye adlandırılmıştır. Nâsıbe ise, Hz. Ali ve Ehl-i Beyt’i ümmetin tayin edil­"}, {"p": "miş liderleri saymadıkları için, Şîa tarafından kullanılan aşağılayıcı bir isimdir. Bu tabirler"}, {"p": "daha çok Sünnîliğin Ehl-i Hadis kanadı için kullanılmıştır."}, {"p": "Ehl-i Sünnet ve’l-Cemaat tabirinin, sadece bir mezhebe verilmiş bir isim olmadığına dikkat"}, {"p": "ediniz. Söz konusu ifade birçok fıkıh ve kelam mezhep­lerinin yanında, mutedil tasavvufî"}, {"p": "grupları da içine alan geniş bir şemsiye ifadedir."}, {"p": "Doğuşu ve Gelişimi"}, {"p": "Hasan el-Basrî’nin (v. 110/728), yönetimin ve toplumun ıslahı için Haricîliğin isyan fik­"}, {"p": "rine karşı çıkışı Sünnî siyaset anlayışı için sağlam bir temel teşkil etmiştir. Basrî haksızlık"}, {"p": "karşısında suskunluk ve tepkisizliği de onaylamamış, nasihat yöntemini uygulamış, Emevî"}, {"p": "idarecilerine yazdığı mektuplarda, yapılan yanlışları eleştirmiştir. Toplumda fitneye yol"}, {"p": "açan unsurlardan tümüyle kaçınılması gerektiğini öğütlemiş, hatta bu konuda Hz. Ali’yi"}, {"p": "bile hatalı bulmuştur. Yine Basrî’nin büyük günah sahibi Müslümanı İslâm dairesi için­"}, {"p": "de görmesi ve insanın fiilerinde kaderin mutlak belirleyiciliğini (cebir) reddetmesi de"}, {"p": "Sünnîlik için önemli referansları teşkil etmiştir."}, {"p": "Ehl-i sünnet akaidinin oluşumunu etkileyen diğer önemli isim Ebû Hanife’dir (v."}, {"p": "150/767). Bazı kaynaklarda Ebû Hanife’nin Mürcie grupların­dan birinin kurucusu olarak"}, {"p": "gösterilmesi, o dönemde mezheplerin henüz teşekkül aşamasında olmasından kaynaklan­"}, {"p": "maktadır. Ebû Hanife’nin bizzat kendisi tarafından kaleme alınmış eseri yoktur, öğrencileri"}, {"p": "tarafından fikirleri yazıya geçirilmiştir. Ehl-i sünnet’in temel inaçlarını oluşturan görüşle­"}, {"p": "rinden bazıları şöyledir: Allah sayı yönünden değil ortağı bulunmaması yönünden birdir."}, {"p": "Peygamberlerin hepsi günahlardan, küfür ve çirkin fiillerden münezzehtir. Peygamber­"}, {"p": "lerden sonra en üstün insanlar sırasıyla Ebû Bekir, Ömer b. Hattab, Osman b. Affan ve"}, {"p": "Ali b. Ebî Talib’tir. Bir Müslüman, helal saymamak şartıyla büyük günah işlemiş olsa bile"}, {"p": "küfürle suçlanamaz. Bir müminin kâfir olmamakla birlikte fâsık olması caizdir. Nebilerin"}, {"p": "mucizeleri ile velilerin kerametleri haktır. Allah Teâlâ ahirette görülecektir. İman, dil ile"}, {"p": "ikrar ve kalp ile tasdikten ibarettir. Peygamberlerin şefaati haktır. Kıyamet ve hesap haktır."}, {"p": "Ehl-i Sünnet kavramı ile ifade edilen ana kitlenin zihniyeti, mevâli arasından Hasan el-"}, {"p": "Basrî ve Ebû Hanîfe ile başlamış ve cumhûr ulema denilen âlimlerle devam etmiştir. Bun­"}, {"p": "lardan ilki Mâlik b. Enes’tir (v. 179/795). Gündelik politik çekişmelerden bağımsız kalma­"}, {"p": "ya özen gösteren İmam Mâlik, Hicaz bölgesinde Medine halkının yaşayışıyla bütünleşen… ⟦1⟧"}, {"p": "**ASHÂB-I HADİS VE SELEFÎLİK**"}, {"p": "Hadis ve sünnet, tarif edenlerin mensup oldukları ilmî camiaya göre birtakım farklı ta­"}, {"p": "nımlara konu olmakla birlikte, genellikle Hz. Peygamber’den nakledilen söz, fiil ve takrir­"}, {"p": "lerin toplamı olarak kabul edilmiştir."}, {"p": "İslâm kaynaklarında, genellikle Müslümanların Şâfiî’den önce Ashâb-ı Hadis ve"}, {"p": "Ashâb-ı Rey diye iki fırkaya ayrıldığı bildirilmektedir. Hadis ashâbı, insanları hadislere"}, {"p": "bağlanmaya teşvik edenler ve bunun dışındaki fikirlere uymaktan sakındıranlardır. İmam"}, {"p": "Şâfiî ve ashabı bu sıfatla anılan en önemli topluluk olarak tanınmıştır. Öte yandan bir mu­"}, {"p": "haddis ile Ashâb-ı hadis arasında da ayırıma dikkat çekilmiştir. Buna göre muhaddis, sa­"}, {"p": "dece rivayete ve râvilerin hallerini bilmeye muktedir olan kimse; Ashâb-ı hadis ise haberle"}, {"p": "istidlal yapabilen ve ondan ahkâm çıkarma usulünü bilen kimse demektir. Bu durumda"}, {"p": "Hadis ehli, hakkında nass bulunmayan herhangi bir meselede asla görüş belirtmez. Bun­"}, {"p": "lar Hicaz ehli, yani Mâlik ve ashâbı, Şâfiî ve ashâbı, Süfyân es-Sevrî ve ashâbı, Ahmed b."}, {"p": "Hanbel ve ashâbı, Dâvud b. Ali ve ashâbından müteşekkildir. Başka bir tasnife göre ashab-ı"}, {"p": "hadis beş tabakaya ayrılmıştır: Mâlikiyye, Şâfiîyye, Hanbeliyye, Râheviyye ve Huzeymiy­"}, {"p": "ye. Ashâb-ı hadis tabirinin sadece Şafiîler’e has olduğunu belirten ifadeler de vardır. Fakat"}, {"p": "kaynaklarda yer alan bilgiler, genellikle ilk dönem ulemasını birlikte değerlendirip kesin"}, {"p": "bir ayrıma tabi tutmaz."}, {"p": "Ashâb-ı hadis ya da Selefiyye, hicri 2-4. asırlar arasında yaşamış ve ana bünyenin önde"}, {"p": "gelen tefsir, hadis, fıkıh ve Arap dili âlimleri tarafından temsil edilmiştir. Temel özellikleri,"}, {"p": "inanç esasları konusunda nasslarda ifade edilen esasları olduğu gibi kabul etmeleri, bilhas­"}, {"p": "sa Allah’ın yed, vech, istivâ gibi haberî sıfatlarını (müteşâbihât) hiç tevil etmeden tasdik"}, {"p": "etmeleri ve konuyla ilgili aklî delil aramamalarıdır. Selefiyye’nin klasik kelam kaynakların­"}, {"p": "da rastlanan inanç esaslarını ortaya koymada takip ettikleri metodik prensipleri; tasdik… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "Ünite 5: Şiîlik I"}, {"p": "*AÖF ders kitabı, Ünite 5, PDF sayfa ~93-111.*"}, {"li": "Ünite - Şiîlik I"}, {"p": "idareceyi iş başına geçirme özlemi ortaya çıkmamış; dolayısıyla Ali taraftarlığı belirli ölçü­"}, {"p": "de, siyasî bir taraftarlıktan öteye geçmemiştir. Hatta Hz. Ali bu iki halifenin en yakın da­"}, {"p": "nışmanı olarak çalışmıştır. Ammâr gibi bir taraftarı da onların valileri arasındadır. Fakat"}, {"p": "Hz. Osman devrinde (23-35/644-656) bu durum değişmiş; halifenin yaşlılığı, icraatındaki"}, {"p": "bazı zaaflar, Ümeyye ailesine mensubiyeti dolayısıyla valilik ve memuriyetlere yakınlarını"}, {"p": "tayin etmesi, onları kontrol edememesi, yaptıkları yanlış işlere göz yumması, kendilerine"}, {"p": "ölçüyü aşan ihsanlarda bulunması, Emevîler’in idare ettikleri yerlerin ahalisine kötü dav­"}, {"p": "ranmaları, sonuçta halk arasında Hz. Osman ve çevresine karşı husumet oluşmasına ve"}, {"p": "siyasî anlamda Şîa’nın gelişmesine zemin hazırlamıştır."}, {"p": "Hz. Ali lehindeki ilk hareket Velid b. Ukbe’nin valiliği devrinde Kufe’de ortaya çıktı."}, {"p": "Kurrâ (Kur’ân okuyucuları) diye anılan bir takım zâhid kişiler, Ali’nin hilâfeti döneminde"}, {"p": "ve daha sonra, Ali Şîası’nın liderleri oldular. Bu devrede Şîatu Osman yahut Osman ta­"}, {"p": "raftarları adıyla mevcut halifeyi destekleyen kesim zayıfladı ve adaletli bir devlet başkanı"}, {"p": "arayışı ve özlemiyle, Şîatü Ali yahut Ali taraftarları olarak anılan; fakat toplumun diğer"}, {"p": "kesiminden farklı belirgin bir yapısı olmayan grup, güç ve itibar kazanmaya başladı (Öz,"}, {"p": "s. 60-1)."}, {"p": "Başkent Medine dışındaki İslâm beldelerinde, yukarıda belirtilenler yanında, İslâm’a"}, {"p": "sonradan girip ihtidâ edenler sebebiyle, halife aleyhinde başlatılan cereyanlar hızla gelişti."}, {"p": "Şiîliğin Hz. Osman dönemindeki fitne olaylarına bağlı olarak ortaya çıktığı görüşünde"}, {"p": "olanlar, daha çok İbn Sebe meselesinden hareket etmektedirler. Her ne kadar erken dö­"}, {"p": "nem Şiî kaynaklarda da, Hz. Ali hakkında, onun imâmetinin farz olduğunu ileri süren"}, {"p": "ilk kimsenin Yemenli İbn Sebe olduğu şeklinde kayıtlar mevcut ise de (Nevbahtî, s. 20),"}, {"p": "Şiîliğin İbn Sebe ile birlikte Hz Osman döneminde başladığı iddiası önemli sorunları"}, {"p": "içermektedir. Öncelikle İbn Sebe’nin kimliği meçhuldür ve kim olduğu hakkında farklı"}, {"p": "rivayetler bulunmaktadır. İkincisi İbn Sebe meselesinde, konuyla ilgilenen araştırıcılar"}, {"p": "arasında görüş birliği olmadığı gibi, müşterek noktalar bulmak da pek mümkün değildir."}, {"p": "Diğer bazı kaynaklarda ise, Hz. Osman döneminden hiç söz edilmeksizin, doğrudan İbn"}, {"p": "Sebe’nin Ali’nin tanrılığını iddia ettiği, bunun üzerine Ali’nin onun yakılmasını emrettiği;"}, {"p": "fakat daha sonra vazgeçtiği söylenmektedir."}, {"p": "Kısacası İbn Sebe’yle ilgili rivayetler birbirleriyle çelişkilidir. Bu yüzden Şiîliğin doğu­"}, {"p": "şunun, Hz. Osman dönemindeki, tarihe fitne olayları olarak geçen hadiselerle ve Sebeiy­"}, {"p": "ye ile doğrudan irtibatlandırılması pek mümkün gözükmemektedir. İbn Sebe’ye atfedilen"}, {"p": "fikirler ise, birinci asrın sonlarıyla ikinci asrın başlarında tartışılan fikirler arasındadır."}, {"p": "Hz. Osman dönemindeki olaylara katılanların çoğunluğunun güneyli olması sebebiyle,"}, {"p": "onlara Sebeiyye sıfatının verilmiş olması mümkündür. Ancak o dönemde bu kavramın"}, {"p": "içeriğinde muhtemelen Osman aleyhtarlığı vardır. Nitekim 51/671 yılında Ali’ye ve soyu­"}, {"p": "na sövülmesini protesto ederek ayaklanan Hucr b. Adiy için de Sebeî sıfatı kullanılmıştır… ⟦1⟧"}, {"p": "**ZEYDİYYE ŞÎASI**"}, {"p": "Zeydiyye’nin Teşekkülü ve Tarihçesi"}, {"p": "Zeydîlik, İmâmiyye Şîası’nın dördüncü imamı Ali b. Hüseyin Zeynelâbidîn’in (ö. 712/94)"}, {"p": "oğlu Zeyd’e (ö. 74/1220), ondan sonra da oğlu Yahya’ya (125/743) uyarak onların imâmetini"}, {"p": "ileri sürenlerin mezhebidir (Fığlalı, 1996, s. 123). Şiî fırkalar arasında mutedil ve Ehl-i"}, {"p": "Sünnet’e en yakın olması ve diğer Şiî grupların aksine, ilk üç halifeyi kabullerinden dolayı"}, {"p": "Makdisî ve Mesûdî gibi bazı ilk devir müellifleri, haklı olarak Zeydîliği Şîa’nın dışında"}, {"p": "tutmuşlardır. Onların itikatta Mu‘tezile, amelde de Ebû Hanife’nin mezhebini takip etmiş"}, {"p": "olmaları, bu yakınlaşmayı daha da güçlendirmektedir. Her şeyden önce, daha sonra Ehl-i"}, {"p": "Sünnet adını alacak ana bünyenin mensuplarıyla İmam Zeyd ve tabileri aynı siyasî ve top­"}, {"p": "lumsal şartlara tepki gösteriyorlardı. Ebû Hanife’nin, Zeyd’e yardım ederek onu destekle­"}, {"p": "menin gerekliliğini söyleyip onunla birlikte zâlim saydıkları Emevî idarecilerine karşı baş­"}, {"p": "kaldırmanın vâcip olduğuna dair fetvâlar vermiş olması, bunun en önemli kanıtlarından"}, {"p": "birisidir. Bugün Zeydîler’in yoğun olarak yaşadığı Yemen’de, Sünnî Şâfiîler’le bu mezhebin"}, {"p": "mensupları arasında dinî, hukukî ve toplumsal açıdan herhangi bir çatışma olmadığı gibi,"}, {"p": "her iki topluluk aynı camide, aynı imamın arkasında namaz kılabilmektedir."}, {"p": "80/699 yılında, İmâmiyye’nin dördüncü imamı kabul edilen Ali Zeynelâbidîn’in oğlu"}, {"p": "olarak Medine’de doğan Zeyd’in yetişip olgunluk çağına geldiği devrede Hz. Ali taraftarla­"}, {"p": "rı, Hz. Hüseyin ve ailesinin Kerbela’da katledilmeleri sebebiyle, Emevîler’e karşı büyük bir"}, {"p": "düşmanlık besliyorlar ve onlara isyan etmek için fırsat kolluyorlardı. Kerbela faciasından"}, {"p": "sonra Tevvâbun hareketi ve Muhtar es-Sakafî’nin isyanına Emevîler’in kanlı müdahaleleri"}, {"p": "ve toplum genelinde uygulamış oldukları zulüm politikaları, Halife Hişâm b. Abdülmelik"}, {"p": "zamanında Zeyd b. Ali’nin liderliğinde yeni bir isyan hareketinin ortaya çıkmasına sebep"}, {"p": "olmuştur."}, {"p": "Emevîler’in haksızlıkları ve Ehl-i Beyt’e düşmanlıkları, özellikle Ehl-i Beyt’in içinde… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025-2026 · Soru 5**: Aşağıdaki tarihi gelişmelerden hangisi İslam mezheplerini doğuran sosyo-politik etkenler arasında sayılamaz?"}, {"li": "[2] **2025-2026 · Soru 8**: Aşağıdakilerden hangisi Emevi ve Abbasiler döneminde alemin yaratılması, Allah’ın sıfatları gibi felsefi ve kelami konulardaki tartışmaların"}, {"li": "[3] **2025-2026 · Soru 9**: Aşağıdakilerden hangisi Mu‘tezile 'nin temel ilkelerinden biri değildir?"}, {"li": "[4] **2025-2026 · Soru 10**: Mu'tezile mezhebinin kurucusu aşağıdakilerden hangisidir?"}, {"li": "[5] **2025-2026 · Soru 11**: Ebû Hanîfe ve Mürcie ilişkisi bağlamında aşağıdakilerden hangisi yanlıştır?"}, {"li": "[6] **2025-2026 · Soru 12**: Aşağıdakilerden hangisi Abbasi halifeleri Me'mun, Mu'tasım ve Vasık dönemlerinde Mu'tezili fikirleri kabul etmeyen kadılara ve âlimlere uygu"}, {"li": "[7] **2025-2026 · Soru 13**: Hakkında nass bulunmayan herhangi bir meselede asla görüş belirtmeyen, sadece haberle (âsârla) yetinenlere ------- adı verilir. Yukarıdaki c"}, {"li": "[8] **2025-2026 · Soru 14**: Mâtürîdîler’in; ilâhî sıfatlar, halku’l-Kur’ân, insan fiilleri, kader ve kerâmet konularında; nasları görmezlikten gelerek insanı yanıltan a"}, {"li": "[9] **2025-2026 · Soru 15**: Aşağıdakilerden hangisi “hilafet, iman-küfür ve kader” meseleleri etrafında oluşan ilk mezheplerden biri değildir?"}, {"li": "[10] **2024-2025 · Soru 7**: Aşağıdakilerden hangisi Cemel ve Sıffin Savaşları sonrasında ortaya çıkan problemlerden biridir?"}, {"li": "[11] **2024-2025 · Soru 9**: - 2025 Güz Dönemi Ara Sınav Aşağıdakilerden hangisi “yönetim, iman-küfür ve kader” meseleleri etrafında oluşan ilk mezheplerden biri değildi"}, {"li": "[12] **2024-2025 · Soru 10**: ------- hakem tayinini, yani tahkimi kabul etmesinden dolayı Hz. Ali'yi suçlayıp ondan ayrılanların meydana getirdiği bir fırkadır. Yukarıda"}], "sources": [{"title": "5- İlk Siyasî-İtikadî Mezhepleşme: Hâricîler | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=3R20cPXxFXU"}]}, {"n": 4, "title": "Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler", "summary": "Bu bölümde Haricilerin tekfir söylemine tepki olarak doğan Mürcie, orta yolu arayan Mu'tezile ve ameli esas alan Ashabü'l-Hadis'in büyük günah meselesine yaklaşımları işlenmektedir. Ayrıca insan fiilleri bağlamında Cebir, Kader ve Kesp görüşleri ile Allah'ın zatı ve sıfatları etrafındaki kelami tartışmalar değerlendirilmektedir. Böylece erken dönem kelami meselelerin mezhepleşme sürecine etkileri bütüncül bir bakışla sunulmaktadır.", "objectives": ["Büyük günah (kebire) tartışması etrafında şekillenen Mürcie ve Mu'tezile'nin görüşlerini karşılaştırabilmek.", "İnsan fiilleri ve kader konusunda Cebriyye, Kaderiyye ve Kesp anlayışlarını değerlendirebilmek.", "Sıfatlar meselesindeki Tatil, Teşbih, Tecsim ve Sıfatiyye yaklaşımlarını kavrayabilmek."], "notes": [{"h": "4. Kebire Tartışması ve Temel Kelami Meseleler Etrafında Oluşan Mezhepler"}, {"p": "Bu bölümde Haricilerin tekfir söylemine tepki olarak doğan Mürcie, orta yolu arayan Mu'tezile ve ameli esas alan Ashabü'l-Hadis'in büyük günah meselesine yaklaşımları işlenmektedir. Ayrıca insan fiilleri bağlamında Cebir, Kader ve Kesp görüşleri ile Allah'ın zatı ve sıfatları etrafındaki kelami tartışmalar değerlendirilmektedir. Böylece erken dönem kelami meselelerin mezhepleşme sürecine etkileri bütüncül bir bakışla sunulmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Büyük günah (kebire) tartışması etrafında şekillenen Mürcie ve Mu'tezile'nin görüşlerini karşılaştırabilmek."}, {"li": "İnsan fiilleri ve kader konusunda Cebriyye, Kaderiyye ve Kesp anlayışlarını değerlendirebilmek."}, {"li": "Sıfatlar meselesindeki Tatil, Teşbih, Tecsim ve Sıfatiyye yaklaşımlarını kavrayabilmek."}, {"h": "Ünite 6: Şiîlik II"}, {"p": "*AÖF ders kitabı, Ünite 6, PDF sayfa ~91-137.*"}, {"li": "Ünite - Şiîlik I"}, {"p": "c. Hz. Ali’nin bizzat Hz. Peygamber tarafından imamlık ve halifeliğe tayin olunduğu­"}, {"p": "nu; dolayısıyla halifeliğin onun ve Ehl-i Beyt’inin hakkı olduğunu ileri sürenlerin,"}, {"p": "d. Hz. Ali’den sonraki imamların da mutlaka onun soyundan (Ehl-i Beyt), açık veya"}, {"p": "gizli bir nass ile tayin ve vasiyet olunacağını kabul edenlerin,"}, {"p": "e. İmamların büyük ve küçük günahlardan korunmuş (masûm) ve özel (vehbî) bir"}, {"p": "bilgiyle donatılmış olduklarını söyleyenlerin teşkil ettiği bir topluluktur (Fığlalı,"}, {"p": "1984, s. 18)."}, {"p": "İlk dönemde kullanılan Şîatü Ali ifadesiyle lafzî mi yoksa ıstılahî anlam mı kastedilmektedir?"}, {"p": "Şiî müelliflerin yukarıda ortaya koyduğu tarifler, ilk bakışta Şîa’nın sanki Hz."}, {"p": "Ali ve hatta Hz. Peygamber zamanında vücud bulmuş bir fırka olduğu izlenimini"}, {"p": "uyandırmaktadır. Halbuki Şiîlik, tarihi gerçekler ışığında Hz. Ali’nin zamanında bile"}, {"p": "bir fırka haline gelmiş değildir. Görünen o ki, Arap dilinde ve günlük hayatta ıstılah"}, {"p": "anlamının dışında taraftar manasında kullanılan Şîa kelimesinin Hz. Peygamber’in bazı"}, {"p": "hadislerinde geçmesi, Şîa’yı böyle bir anlayışa sevk etmiş olmalıdır (Fığlalı, 1984, s. -19"}, {"p": "20). Görüldüğü gibi Şiî müellifler, meşruiyet gerekçesiyle Şîa’nın lafzî ve ıstılahî anlamını"}, {"p": "birbiri yerine kullanırken, bazı Sünnî kaynaklar da o dönemdeki mevcut siyasî topluluk"}, {"p": "için Râfıziyye veya Sebeiyye isimlerini kullanmışlardır. Muhaliflerinin zem, dışlama ve"}, {"p": "ayıplama maksadıyla kullanmış oldukları bu kavramların dinî içeriklerinin ve bununla"}, {"p": "ilgili diğer görüşlerin ne zaman, kimler tarafından ve hangi şartlarda savunulduğu ve aidi­"}, {"p": "yeti konusunda ise önemli tartışmalar vardır."}, {"p": "Sonuç olarak imam veya halifenin, yani devlet başkanının gerekliliği konusunda Ehl-i"}, {"p": "Sünnet’le aynı görüşü paylaşmasına rağmen Şîa, Ehl-i Sünnet’in aksine, imâmetin üm­"}, {"p": "metin seçimine ve takdirine bırakılmış, umumun yürüteceği işlerden olmayıp bilakis"}, {"p": "İslâm’ın temeli ve dinin rüknü olduğuna inanmaktadır. Yine onlara göre Peygamber’in"}, {"p": "bunu gizlemesi ve yürütülmesini ümmete bırakması düşünülemez. Aksine, Allah’ın Pey­"}, {"p": "gamber vasıtasıyla ümmete bir imam tayin etmesi ve o imamın da masûm (büyük-küçük"}, {"p": "günahlardan arınmış) olması gereklidir. Nitekim Şîa nass ve tayin nazariyesine, yani Hz."}, {"p": "Ali’nin Allah tarafından Peygamber vasıtasıyla imam tayin edilişine inanmakta ve nassları"}, {"p": "bu istikamette yorumlamaktadır. Ayrıca imâmet iddialarına mesned teşkil edebilecek bir"}, {"p": "hadis külliyatı da vücuda getirilmiştir. Şiîliğin tanımını bununla irtibatlı olarak ele alan"}, {"p": "Şîa, Şiîliğin tohumlarının bizzat şeriatın sahibi tarafından atıldığını söylemek suretiyle"}, {"p": "sözkonusu mezhebin zuhurunu Hz. Peygamber dönemine kadar geri götürmektedir."}, {"p": "Şîa’nın, mezhebin ortaya çıkışıyla ilgili ileri sürmüş oldukları rivâyet ve deliller için ayrıca"}, {"li": "Ünite’ye müracaat ediniz."}, {"p": "Şiîliğin Teşekkülü"}, {"p": "Şiîliğin ne zaman ortaya çıktığı konusunda, Sünnî ve Şiî âlimler arasında görüş ayrılığı"}, {"p": "bulunduğu gibi, Şiî ulemanın kendi içinde de bir birliktelik mevcut değildir. Bu karışıklığın"}, {"p": "en önemli sebebi, Şiîliğin siyasi ve dini tarihinin iyi kavranamamış ve hangi cephesinin"}, {"p": "ne zaman ortaya çıktığının sağlıklı bir şekilde değerlendirilememiş olmasıdır. Belki… ⟦1⟧"}, {"p": "**ZEYDİYYE ŞÎASI**"}, {"p": "Zeydiyye’nin Teşekkülü ve Tarihçesi"}, {"p": "Zeydîlik, İmâmiyye Şîası’nın dördüncü imamı Ali b. Hüseyin Zeynelâbidîn’in (ö. 712/94)"}, {"p": "oğlu Zeyd’e (ö. 74/1220), ondan sonra da oğlu Yahya’ya (125/743) uyarak onların imâmetini"}, {"p": "ileri sürenlerin mezhebidir (Fığlalı, 1996, s. 123). Şiî fırkalar arasında mutedil ve Ehl-i"}, {"p": "Sünnet’e en yakın olması ve diğer Şiî grupların aksine, ilk üç halifeyi kabullerinden dolayı"}, {"p": "Makdisî ve Mesûdî gibi bazı ilk devir müellifleri, haklı olarak Zeydîliği Şîa’nın dışında"}, {"p": "tutmuşlardır. Onların itikatta Mu‘tezile, amelde de Ebû Hanife’nin mezhebini takip etmiş"}, {"p": "olmaları, bu yakınlaşmayı daha da güçlendirmektedir. Her şeyden önce, daha sonra Ehl-i"}, {"p": "Sünnet adını alacak ana bünyenin mensuplarıyla İmam Zeyd ve tabileri aynı siyasî ve top­"}, {"p": "lumsal şartlara tepki gösteriyorlardı. Ebû Hanife’nin, Zeyd’e yardım ederek onu destekle­"}, {"p": "menin gerekliliğini söyleyip onunla birlikte zâlim saydıkları Emevî idarecilerine karşı baş­"}, {"p": "kaldırmanın vâcip olduğuna dair fetvâlar vermiş olması, bunun en önemli kanıtlarından"}, {"p": "birisidir. Bugün Zeydîler’in yoğun olarak yaşadığı Yemen’de, Sünnî Şâfiîler’le bu mezhebin"}, {"p": "mensupları arasında dinî, hukukî ve toplumsal açıdan herhangi bir çatışma olmadığı gibi,"}, {"p": "her iki topluluk aynı camide, aynı imamın arkasında namaz kılabilmektedir."}, {"p": "80/699 yılında, İmâmiyye’nin dördüncü imamı kabul edilen Ali Zeynelâbidîn’in oğlu"}, {"p": "olarak Medine’de doğan Zeyd’in yetişip olgunluk çağına geldiği devrede Hz. Ali taraftarla­"}, {"p": "rı, Hz. Hüseyin ve ailesinin Kerbela’da katledilmeleri sebebiyle, Emevîler’e karşı büyük bir"}, {"p": "düşmanlık besliyorlar ve onlara isyan etmek için fırsat kolluyorlardı. Kerbela faciasından"}, {"p": "sonra Tevvâbun hareketi ve Muhtar es-Sakafî’nin isyanına Emevîler’in kanlı müdahaleleri"}, {"p": "ve toplum genelinde uygulamış oldukları zulüm politikaları, Halife Hişâm b. Abdülmelik"}, {"p": "zamanında Zeyd b. Ali’nin liderliğinde yeni bir isyan hareketinin ortaya çıkmasına sebep"}, {"p": "olmuştur."}, {"p": "Emevîler’in haksızlıkları ve Ehl-i Beyt’e düşmanlıkları, özellikle Ehl-i Beyt’in içinde… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "Ünite 7: Nusayrîlik, Dürzîlik, Yezidîlik"}, {"p": "*AÖF ders kitabı, Ünite 7, PDF sayfa ~141-155.*"}, {"li": "Ünite - Nusayrîlik, Dürzîlik, Yezidîlik"}, {"p": "İsmailîler ve öteki muhalif guruplarla mücadeleye giren fırka, Sincâr dağlarından gelen"}, {"p": "Emîr Mekzûn es-Sincârî’nin 622/1223 yılında muhalifleri yenilgiye uğratıp bölgeyi ele ge­"}, {"p": "çirmesiyle birlikte belirli bir rahatlık yakalamıştır."}, {"p": "Memlükler döneminde Nusayrîler’in yaşadığı Cebel-i Ensâriyye’nin güneyindeki ka­"}, {"p": "leleri İsmailîler’den alan Sultan Baybars, toplumun yaygın İslamî anlayışa mensup züm­"}, {"p": "relere katılması için teşebbüslerde bulunmuştur. Batınîlere karşı sert tutumuyla tanınan"}, {"p": "Sultan Kalavun (1277-1290) döneminde fırkaya intisap etme yasaklandığı gibi, fırka men­"}, {"p": "suplarının bulunduğu yerlere cami yapma mecburiyeti getirmiş, ancak bu çabalar sonuç"}, {"p": "vermemiş, kısa bir süre sonra camiler tamamen atıl kalmıştır."}, {"p": "Osmanlılar’ın 1526’da Mercidabık savaşı sonrasında ilgili bölgeleri imparatorluğa kat­"}, {"p": "masıyla birlikte Nusayrîler Osmanlı idaresine girmiş, uzun dönem Halep eyaletine bağlı"}, {"p": "olarak, mahalli şeyhlerin denetiminde muhtar bir hayat yaşamışlardır. Mısır’lı İbrahim"}, {"p": "Paşa’nın devlete karşı giriştiği harekatta (1839) büyük kayıplar vermelerine rağmen devlete"}, {"p": "karşı sadık kalan Nusayrî toplumu, siyasi ve ekonomik gelişmelere bağlı olarak bazı küçük"}, {"p": "çaplı isyanlara girişmişse de bunlar büyümeden bastırılmıştır. II. Abdülhamid zamanında"}, {"p": "diğer batınî topluluklar gibi Müslüman ahali arasında kabul edilerek mecburi askerliğe"}, {"p": "tabi tutulmuş, ayrıca bölgedeki Hıristiyan misyonerlerinin propagandalarına karşı tedbir"}, {"p": "talepleri dikkate alınarak destek vaadinde bulunulmuş, belli yerleşim merkezlerine cami­"}, {"p": "ler inşa edilip imamlar tayin edilmiştir. Ancak bu tedbirler sınırlı oranda kabul görmüş,"}, {"p": "Birinci Dünya Savaşı sonunda bölgenin önce İngilizler sonra Fransızlar tarafından işgali"}, {"p": "sonrasında ise tamamen son bulmuştur. Birinci Dünya Savaşı’nın ardından Fransızlar’la"}, {"p": "Suriye’li yetkililer arasında gerçekleşen görüşmelerden sonra 1920 yılında Alevî otonom"}, {"p": "bölgesi kurulmuş, 1936 yılında burası Suriye devletinin bir vilayeti kabul edilmiş, 1939"}, {"p": "yılında Fransa Lazkiye bölgesini Suriye’den ayırarak müstakil bir statü vermiş, aynı tarihte"}, {"p": "İskenderun sancağı Türkiye’de kalmış, uzun görüşmelerin ardından Lazkiye idaresi 1942"}, {"p": "yılında resmi törenle Suriye’ye katılmıştır."}, {"p": "Nusayrî toplumu günümüzde Suriye, Türkiye ve Lübnan’da yaşamaktadır. Suriye’de"}, {"p": "Lazkiye ve Cebel-i Ensâriyye bölgesi başta olmak üzere ülkede tahminî olarak % 8-12 ara­"}, {"p": "sında gösterilen bir nüfus oranına sahiptir. Türkiye’de Hatay ile kısmen Adana ve Mersin’in"}, {"p": "çeşitli yerleşim birimlerinde, Lübnan’da ise daha çok kuzey kesimlerde on bin dolayında"}, {"p": "nüfusa sahip küçük bir gurup olarak varlığını devam ettirmektedir."}, {"p": "İnanç Esasları ve İbadet Anlayışları"}, {"p": "İslâm coğrafyasında ortaya çıkmış olmakla birlikte, doğup geliştiği mekanlardaki ön­"}, {"p": "ceki inanç ve geleneklerin kalıntılarını üzerinde taşıyan Nusayrîlik, inanç karakteri ba­"}, {"p": "kımından, başta On İki İmam Şiîliği ve İsmailî Şiîlik olmak üzere Sabiîlik, Yahudilik ve"}, {"p": "Hıristiyanlık’a ait kimi inanç ve anlayışların harmanlandığı bir yapı hüviyetindedir."}, {"p": "Daha sonra bazı sınırlı tasarruflara maruz kalmış olmakla birlikte, fırkanın temel"}, {"p": "inançları, Hamdan el-Hâsibî tarafından düzenlendiği kesin olan Kitabü’l-Mecmû’ya da­… ⟦1⟧"}, {"p": "**DÜRZÎLİK**"}, {"p": "Dürzîlik Fatımî halifelerinden Hâkim-Biemrillah döneminde (996-1021), onun ilah ol­"}, {"p": "duğunu, bütün dinlerin geçerliliklerinin bittiğini ileri süren aşırı (ğâlî) bir fırkadır. Şiî-"}, {"p": "İsmailî çevreden çıkan ve tamamen batınî bir karakter taşıyan fırka, Hâkim’in veziri Ham­"}, {"p": "za b. Ali tarafından kurulmuştur. Fırka, bütün dinî gerçekleri en geniş anlamıyla kapsayan"}, {"p": "müstakil bir sistem olduğunu savunması sebebiyle nadiren Hâkimiyye diye anılmışsa da"}, {"p": "genellikle Dürzîlik (Dürziyye) adıyla yaygınlaşmıştır. Bu isim fırkaya, önceleri Hamza’nın"}, {"p": "yakını ve dâisi iken daha sonra mürted sayılan Anuş Tekin (Neştekin) ed-Derezî’nin yo­"}, {"p": "ğun propagandalarından dolayı verilmiştir. Dürzîler, her ne kadar zamanla bu ismi belli"}, {"p": "ölçüde kabullenmişlerse de, tam anlamıyla tevhidi gerçekleştirdiklerini düşünerek ken­"}, {"p": "dilerini “Muvahhidûn” veya “Ehlü’t-tevhîd” diye anmış, kimi zaman da “Benû Marûf”"}, {"p": "ismini kullanmışlardır. ⟦2⟧"}, {"p": "**Teşekkülü ve Tarihi Gelişimi**"}, {"p": "Dürzîlik siyasi olarak Fatımî Devleti, kültürel olarak ise bu devletin dayandığı Batınî-"}, {"p": "İsmailî bir ortamda teşekkül edip gelişmiştir. Fırkanın kökeni ile ilgili çok farklı tezler ileri"}, {"p": "sürülmüşse de bu yapıya mensup insanların genel olarak kendilerini Arap asıllı saydıkları,"}, {"p": "İsmailî-Batınî-Ğâlî fikirlerin arkaplanında ise Maniheizm, Zerdüştîlik, Yeni Eflatunculuk,"}, {"p": "Helenizm, Gnostisizm ve Doğu Hıristiyan mezheplerinin izlerinin bulunduğu dikkate"}, {"p": "alındığında, fırkanın menşeine dair bir fikre ulaşılabilir."}, {"p": "Dürzîlere göre, Hâkim-Biemrillah altıncı Fatimî halifesi olarak tahta çıktıktan kısa bir"}, {"p": "zaman sonra yeni bir dönemin geldiğini müjdelemek üzere etrafa davetçiler göndermiş­"}, {"p": "tir. “Keşf Dönemi” olarak da isimlendirilen bu devrede hakikatin ortaya çıkacağı, tevhidî"}, {"p": "bilginin kendisini bu harekete hazırlayan kimselere kapalı kalmayacağı ifade olunmuştur."}, {"p": "Bunun için ilkin Seleme b. Abdülvehhab, ardından Muhmmed b. Vehb, onun ardından da"}, {"p": "İsmail b. Muhammed seçilmiş, her biri yedişer yıl görev yaparak gittikleri yerlerde ön ça­… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025-2026 · Soru 5**: Aşağıdaki tarihi gelişmelerden hangisi İslam mezheplerini doğuran sosyo-politik etkenler arasında sayılamaz?"}, {"li": "[2] **2025-2026 · Soru 8**: Aşağıdakilerden hangisi Emevi ve Abbasiler döneminde alemin yaratılması, Allah’ın sıfatları gibi felsefi ve kelami konulardaki tartışmaların"}, {"li": "[3] **2025-2026 · Soru 9**: Aşağıdakilerden hangisi Mu‘tezile 'nin temel ilkelerinden biri değildir?"}, {"li": "[4] **2025-2026 · Soru 10**: Mu'tezile mezhebinin kurucusu aşağıdakilerden hangisidir?"}, {"li": "[5] **2025-2026 · Soru 11**: Ebû Hanîfe ve Mürcie ilişkisi bağlamında aşağıdakilerden hangisi yanlıştır?"}, {"li": "[6] **2025-2026 · Soru 12**: Aşağıdakilerden hangisi Abbasi halifeleri Me'mun, Mu'tasım ve Vasık dönemlerinde Mu'tezili fikirleri kabul etmeyen kadılara ve âlimlere uygu"}, {"li": "[7] **2025-2026 · Soru 13**: Hakkında nass bulunmayan herhangi bir meselede asla görüş belirtmeyen, sadece haberle (âsârla) yetinenlere ------- adı verilir. Yukarıdaki c"}, {"li": "[8] **2025-2026 · Soru 14**: Mâtürîdîler’in; ilâhî sıfatlar, halku’l-Kur’ân, insan fiilleri, kader ve kerâmet konularında; nasları görmezlikten gelerek insanı yanıltan a"}, {"li": "[9] **2025-2026 · Soru 15**: Aşağıdakilerden hangisi “hilafet, iman-küfür ve kader” meseleleri etrafında oluşan ilk mezheplerden biri değildir?"}, {"li": "[10] **2025-2026 · Soru 16**: Mâtürîdî bilgi teorisine göre aşağıdaki ifadelerden hangisi yanlıştır?"}, {"li": "[11] **2024-2025 · Soru 7**: Aşağıdakilerden hangisi Cemel ve Sıffin Savaşları sonrasında ortaya çıkan problemlerden biridir?"}, {"li": "[12] **2024-2025 · Soru 9**: - 2025 Güz Dönemi Ara Sınav Aşağıdakilerden hangisi “yönetim, iman-küfür ve kader” meseleleri etrafında oluşan ilk mezheplerden biri değildi"}], "sources": [{"title": "6- Hâricîlerle Başlayan Temel Tartışma: Kebîre | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=e_CDpYpnfqU"}, {"title": "7- Temel Kelamî Meseleler ve Etrafında Oluşan Mezhepler | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=dZ8nMOAz3_Y"}]}, {"n": 5, "title": "İslam Toplumunun Temel Ayrılığı: Şia ve İmamet", "summary": "Bu bölümde Hz. Peygamber sonrası liderlik tartışmalarıyla başlayıp zamanla itikadi bir yapıya dönüşen Şiilik düşüncesi ve İmamet nazariyesi ele alınmaktadır. Kerbela olayı ve Tevvabun hareketi gibi tarihsel kırılmaların Şii kimliğin teşekkülündeki belirleyici rolü açıklanmaktadır. Gaybet, takiyye, tenasüh ve Beda gibi Şii kavramlar ile 12 İmam Şiiliğinin (İsnaaşeriyye) temel esasları sunulmaktadır.", "objectives": ["Şia kavramını, doğuşunu etkileyen tarihsel ve siyasi olayları açıklayabilmek.", "İmamet anlayışının Nübüvvetin devamı olarak görülmesinin itikadi temellerini kavrayabilmek.", "12 İmam Şiiliğinin (İsnaaşeriyye) temel doktrinlerini ve ameli farklılıklarını değerlendirebilmek."], "notes": [{"h": "5. İslam Toplumunun Temel Ayrılığı: Şia ve İmamet"}, {"p": "Bu bölümde Hz. Peygamber sonrası liderlik tartışmalarıyla başlayıp zamanla itikadi bir yapıya dönüşen Şiilik düşüncesi ve İmamet nazariyesi ele alınmaktadır. Kerbela olayı ve Tevvabun hareketi gibi tarihsel kırılmaların Şii kimliğin teşekkülündeki belirleyici rolü açıklanmaktadır. Gaybet, takiyye, tenasüh ve Beda gibi Şii kavramlar ile 12 İmam Şiiliğinin (İsnaaşeriyye) temel esasları sunulmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Şia kavramını, doğuşunu etkileyen tarihsel ve siyasi olayları açıklayabilmek."}, {"li": "İmamet anlayışının Nübüvvetin devamı olarak görülmesinin itikadi temellerini kavrayabilmek."}, {"li": "12 İmam Şiiliğinin (İsnaaşeriyye) temel doktrinlerini ve ameli farklılıklarını değerlendirebilmek."}, {"h": "Ünite 8: Alevîlik ve Bektaşîlik"}, {"p": "*AÖF ders kitabı, Ünite 8, PDF sayfa ~159-171.*"}, {"li": "Ünite - Alevîlik ve Bektaşîlik"}, {"p": "1240 yılında Selçuklu hükümdarı II. Gıyâseddin Keyhusrev devrindeki bu isyan kısaca"}, {"p": "şöyle gelişmiştir: Amasya yakınındaki dergâhında etrafına, daha çok eski Türk inançları­"}, {"p": "nın İslâmiyet’le yorumlanmış şeklini tasavvufî bir hüviyetle öğreten Baba İlyâs-ı Horasânî,"}, {"p": "sosyal ve ekonomik sıkıntılar içinde bunalan Türkmenler’e büyük bir kurtarıcı sıfatıyla"}, {"p": "davranmış, yetiştirdiği halifeleri çeşitli bölgelere dağıtarak isyan için hazırlıklar yapmış­"}, {"p": "tır. Halifelerinden Baba İshak liderliğinde Kefersud bölgesinde ayaklanan Türkmenler,"}, {"p": "önemli başarılar kazandıktan sonra Orta Anadolu’ya intikal etmiştir. Burada da bir ölçüde"}, {"p": "başarı elde edilirken Baba İlyas, Selçuklu kuvvetleri tarafından Amasya’da idam edilmiş,"}, {"p": "Türkmenler’in çoğu Kırşehir’de Malya ovasında kılıçtan geçirilmiştir. İsyan hedefine ula­"}, {"p": "şamamış olmakla birlikte kaçıp kurtulabilen Türkmenler sıkı bir dayanışma içine girmiş,"}, {"p": "Babaîlik hareketi ortaya çıkmıştır."}, {"p": "Babaîlik hareketi Baba İlyas’ın idamından sonra küçük oğlu Muhlis Paşa tarafından"}, {"p": "devam ettirilmiştir. Siyasi olmaktan çok dinî-mistik bir karakter taşıyan hareket, onun"}, {"p": "halifeleri vasıtasıyla Anadolu’nun değişik yerlerine nakledilerek sürdürülmüştür. Baba"}, {"p": "İlyas’ın Aynüddevle (Ayna Dola) Dede, Şeyh Osman ve Bağdın Hacı gibi halifeleri To­"}, {"p": "kat ve Kırşehir’de, diğer bir halifesi Şeyh Bâlî muhtemelen Yozgat ve Kırıkkale’de, Şeyh"}, {"p": "Edebâli Bilecik çevresinde, Emîrcem Sultan Sulucakarahöyük’ün kuzey taraflarında, Hacı"}, {"p": "Bektâş-ı Velî Kırşehir, Nevşehir bölgelerinde düşüncelerini Türkmen halkına aktarmış­"}, {"p": "lardır. Bunların dışında 14. yüzyılda aynı çizginin devamı olan ve “baba” unvanını taşı­"}, {"p": "yan Babaî şeyhleri de vardır. Anadolu ve Rumeli’nin İslâmlaşması tarihinde önemli bir"}, {"p": "şahsiyet olarak görülen Sarı Saltuk ve onun en önde gelen halifesi Barak Baba, Amasya’da"}, {"p": "Aybek Baba, Konya’da Buzağı Baba, muhtemelen Sakarya civarında Tapduk Baba gibi şah­"}, {"p": "siyetler bunlardandır."}, {"p": "Hünkar Hacı Bektaş Veli ve Rum Abdalları"}, {"p": "Tarihi şahsiyeti itibariyle Hünkar’ın asıl adı Bektaş’tır. Kendisi “Horasan erenleri” diye bi­"}, {"p": "linen Kalenderîyye akımına mensup sûfîlerden biridir. 13. yüzyılda Moğol istilası sebebiy­"}, {"p": "le Anadolu’ya doğru vuku bulan derviş göçleri arasında, aynı mektebe mensup Yesevî veya"}, {"p": "daha kuvvetli bir ihtimalle Haydarî dervişlerinden biri olarak Anadolu’ya gelmiş olmalıdır."}, {"p": "Burada kardeşi Menteş’le birlikte Baba İlyas-ı Horasânî’ye intisap etmiş ve halifelik maka­"}, {"p": "mına gelmiştir. Ancak kardeşi Menteş, Babaî İsyanına katılıp Sivas’ta Selçuklu kuvvetle­"}, {"p": "riyle yapılan savaşta öldürülmüş olmasına karşılık, Hacı Bektaş isyana iştirak etmemiştir."}, {"p": "Muhtemelen 1250 yılı dolaylarında Karayol’a (o günkü adıyla Sulucakarahöyük, bugünkü"}, {"p": "Nevşehir’in Hacıbektaş ilçesi) gelerek buraya yerleşmiştir. Burada bir yandan Türkmen"}, {"p": "şeyhi olarak halkı irşat ederken bir yandan da Göreme bölgesindeki Hıristiyanlar’la te­"}, {"p": "masa geçip onların ihtidasına zemin hazırlamış, ayrıca şamanist Moğallar’ın müslüman"}, {"p": "olması için yoğun faaliyetlerde bulunmuş, bu amaçla Anadolu’nun muhtelif bölgelerine"}, {"p": "halifeler yollamıştır. Hünkar’a başta Makâlât olmak üzere Kitâbü’l-Fevâid, Şerh-i Besmele"}, {"p": "gibi eserler izafe edilmiştir.… ⟦1⟧"}, {"p": "**İNANÇLAR, İBADETLER VE ÂDÂB-ERKÂN**"}, {"p": "Alevîlik ve Bektaşîlik inançlar, ibadet anlayışları ve âdâb-erkân bakımından üç tarihsel"}, {"p": "dönemin izlerini taşımaktadır. İlk dönem göçebe toplulukların İslam’ı kabul edip Gök"}, {"p": "Türk inancı, Şamanlık yahut Kamlık geleneğini İslam’la içiçe benimsedikleri dönemdir."}, {"p": "Bu dönem başta Yesevîlik olmak üzere bazı bağdaştırmacı anlayışların, çok muhtemelen"}, {"p": "batınî İsmailî anlayışlardan da etkilenerek tasavvufi yapılar halinde kendisini ifade ettiği ⟦2⟧"}, {"p": "devirdir. İkinci dönem ise 15. yüzyılın ilk yarısında Hurûfî anlayışların nüfuz ettiği dö­"}, {"p": "nemdir. Şu kadarını ifade etmek gerekir ki Hurûfîlik, Kızılbaşlığa daha sınırlı, Bektaşîliğe"}, {"p": "ise nispeten daha güçlü olarak sirayet etmiştir. Üçüncü dönem ise aynı asrın ikinci yarı­"}, {"p": "sından sonra bünyeye On İki İmam Şiîliği’nin (İsnâaşeriyye) kimi anlayışlarının nüfuz"}, {"p": "ettiği dönemdir."}, {"p": "Bu üç dönemde İslamiyet’le birlikte önceki inançların, Hurûfî ve Şiî unsurların oymak"}, {"p": "ve ocaklara yansıması ve yorumlanması aynı biçimde olmamış, bazı dönem ve yörelerde"}, {"p": "yahut ocaklarda söz gelimi bazı inanç ve unsurlar öne çıkarken bazı dönem ve yörelerde"}, {"p": "diğerleri öne çıkmış, böylece tarih ve bölgeler arasında farklılıklar ortaya çıkmıştır. Bu"}, {"p": "farklılıklar kaynaklara da yansımış, dolayısıyla kaynaklar arasında birtakım önemli fark­"}, {"p": "lılıklar gözlenmiştir."}, {"p": "Esas olarak Alevîlik ve Bektaşîlik toplumsal ve tarihsel yapısı dolayısıyla “sözel kültü­"}, {"p": "re” dayalıdır. Ancak bu yazılı kaynaklarının bulunmadığı anlamına gelmemelidir. Alevî ve"}, {"p": "Bektaşî ulularının üstünlük ve kerametlerinin anlatıldığı vilâyetnâmeler, erkân kitapları"}, {"p": "ve tarih boyunca ozanların inanç ve duygularını dile getirdikleri deyişler temel kaynaklar"}, {"p": "hüviyetindedir."}, {"p": "Şu unutulmamalı ki Alevîlik ve Bektaşîlik itikadî yahut fıkhî konulardaki ihtilaflara bağlı"}, {"p": "olarak ortaya çıkmadığı için bir mezhep değildir ve bu nedenle de işlenip geliştirilmiş teo­"}, {"p": "lojik yahut fıkhî metodolojisi yoktur. Bu açıdan söz konusu yapının inanç ve ibadet anlayış­"}, {"p": "larından bahsetmek bir takım güçlükler içermektedir. Burada ilgili kaynaklar göz önünde… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "Ünite 9: Mehdilik İnancı Temelinde Oluşan Geç Dönem Mezhepler"}, {"p": "*AÖF ders kitabı, Ünite 9, PDF sayfa ~177-189.*"}, {"li": "Ünite - Mehdilik İnancı Temelinde Oluşan Geç Dönem Mezhepler"}, {"p": "genellikle Şiî çevrelerce sahiplenilmiştir. Ancak üçüncü asra kadar mehdinin kim oldu­"}, {"p": "ğu konusu net değildir. Mehdi kavramı Şiî çevrelerde ilk defa Hz. Ali’nin Hz. Fâtıma’dan"}, {"p": "olmayan oğlu Muhamed b. el-Hanefiyye ile ilişkili olarak kullanılmaya başlanmış, daha"}, {"p": "sonra oğlu Ebû Haşim ve Abdullah b. Muâviye için de benzer nitelemelerde bulunulmuş­"}, {"p": "tur (Hakyemez, 2004, s. 133)."}, {"p": "Şiî Mehdi tasavvurlarındaki ortak nokta, adı geçen imamların ölmediği, belirli bir yerde"}, {"p": "gizlenmiş olduğu ve zamanı gelince mutlaka döneceği düşüncesidir. Bu ilişkilendirmeler,"}, {"p": "genellikle Şiîliğin Keysâniyye kolunda ve ğulât Şiî çevrelerde karşılık bulmuştur. Mehdilik"}, {"p": "kavramı, Nefsü’z-Zekiyye gibi Ehl-i Beyt liderlerinin siyasî isyanlarında motivasyon aracı"}, {"p": "olarak kullanılmıştır. Zeydîler, Nefsü’z-Zekiyye olarak bilinen Muhammed b. Abdullah’ı"}, {"p": "mehdi olarak nitelemişlerdir. Şiîliğin İsmâiliyye kolunda ise beklenen kurtarıcının İsmail"}, {"p": "b. Cafer ya da Muhammed b. İsmail olduğu ileri sürülmüştür. Fâtımî İsmâilîleri ise Fâtımî"}, {"p": "devletinin kurucusu Ubeydullah’ı mehdi olarak adlandırmıştır."}, {"p": "Mehdilik kavramı, İmâmiyye (İsnâaşeriyye) Şîası ile birlikte farklı bir içerik kazan­"}, {"p": "mıştır. İmâmiyye mezhebi on ikinci imamın beklenen kurtarıcı olduğunu ileri sürmüş"}, {"p": "ve mehdiliği onun önemli bir vasfı haline getirmiştir. Bu yüzden beklenen mehdi inancı,"}, {"p": "zamanla Şiîliğin temel inanç esaslarından biri haline gelmiştir. Buna göre beklenen kur­"}, {"p": "tarıcı, yani mehdi, on ikinci imam olan Muhammed b. Hasan el-Askerî’dir. (el-Kummî,"}, {"p": "1978, s. 124)"}, {"p": "Muhammed Mehdî, babası Hasan el-Askeri’nin h. 260 yılındaki ölümünden sonra"}, {"p": "ortadan kaybolmuştur. 260 yılından 318 yılına kadarki bu süreç, küçük gaybet (gaybet-i"}, {"p": "suğra) olarak nitelendirilmiştir. Bu dönemde imamla insanlar arasındaki ilişkinin sıra­"}, {"p": "sıyla dört sefir tarafından devam ettirildiği, son sefirin h. 318 yılındaki ölümüyle bir­"}, {"p": "likte de büyük gaybet (gaybet-i kübra) döneminin başladığı ileri sürülmüştür. Bu dö­"}, {"p": "nem sefirlerin ve aracıların ortadan kalktığı ve mehdinin tekrar döneceği zamana kadar"}, {"p": "eleme, imtihan ve arınma gibi hususların gerçekleşeceği yeni bir süreçtir. (Hakyemez,"}, {"p": "2004, s. 138) On ikinci imam olan mehdinin tekrar dönüşüyle birlikte yeryüzünde zu­"}, {"p": "lüm ortadan kalkacak ve adalet hakim olacaktır. Onun dönüşü aynı zamanda Hz. İsa’nın"}, {"p": "da yeryüzüne inmesine zemin hazırlayacak, Hz. İsa ise onun arkasında namaz kılacaktır"}, {"p": "(el-Kummi, 1978, s. 69–70)."}, {"p": "Mehdi inancının Şîa itikadının kilit taşlarından biri olmasını, tarihsel süreçte yaşa­"}, {"p": "dıkları hayal kırıklıkları ve maruz kaldıkları baskılarla yakından alakalı olarak görmek"}, {"p": "mümkündür. Tarih boyunca sosyal sarsıntıların ve bunalımların yaşandığı dönemlerin,"}, {"p": "hep kurtarıcı fikrini ön plana çıkardığını vurgulamak gerekir. Hz. Hüseyin’in Kerbelâ’da"}, {"p": "öldürülmesiyle başlayan bunalım sürecinin Şîa açısından da benzer motifler taşıdığı mu­"}, {"p": "hakkaktır. Bu yüzden Şiîlik’teki mehdi algısı, Emevî ve Abbasî idarelerine karşı girişilen"}, {"p": "iktidar mücadelelerinde yaşanan başarısızlık ve hayal kırıklığının tipik bir dışa vurumu"}, {"p": "olarak değerlendirilebilir. Ancak bu durum, yalnızca Şiîlikle sınırlı kalmamış, zaman za­… ⟦1⟧"}, {"p": "**AHMEDÎLİK**"}, {"p": "Mirza Gulam Ahmed Kadiyânî (1835-1908) tarafından Hindistan Pencap-Kâdiyân’da"}, {"p": "XIX. yüzyılın sonlarına doğru kurulan bir dini hareket olan Ahmedîlik, Mirzaîlik ve"}, {"p": "Kâdiyânîlik adlarıyla da anılmaktadır. Hareketin kurucusu ve bağlıları, kendileri için Ah­"}, {"p": "mediyye ismini kullanmışlar, resmi makamlarca da bu isimle anılmışlardır. Ancak İslâm"}, {"p": "dünyasında tanımlan­dıkları isim, genellikle Kâdiyâniyye olmuştur."}, {"p": "Ahmedîliğin Sosyo-Kültürel Arkaplanı"}, {"p": "Ahmedîlik 19. yüzyılın ikinci yarısında Hindistan alt kıtasında kurulmuş bir harekettir."}, {"p": "Söz konusu zaman diliminde Hindistan, siyasi, kültürel, dini ve iktisadi açıdan olduk­"}, {"p": "ça çalkantılı bir bölgedir. Osmanlı İmparatorluğu’nun Batılı devletler karşısında siyasî ve"}, {"p": "iktisadi gücünü yitirmesi, İslâm coğrafyasının büyük bir kısmı için sıkıntılı bir sürecin"}, {"p": "başlangıcı oldu. İslâm topraklarının batılı devletler tarafından sömürge haline getirilmek"}, {"p": "istenmesi, buralarda siyasî ve iktisadi temelli ciddi gerilimlerin yaşanmasına yol açtı."}, {"p": "Hindistan bu gerilimin en fazla yaşandığı bölgelerden birisiydi. Her şeyden önce bölge"}, {"p": "birçok etnik unsurun ve dinin bir arada yaşadığı çok kültürlü bir yapıya sahipti. Bu ço­"}, {"p": "ğulcu yapı, tarihin belirli dönemlerinde dinler ve mezhepler arasında veya farklı etnik un­"}, {"p": "surlar arasındaki çatışma­ların ana sebebiydi. Bölgede yaşanan din ve kültür eksenli sosyal"}, {"p": "değişmenin tonu, diğer bölgelerle kıyaslandığında yüksekti ve yaşanan siyasî mücadele­"}, {"p": "lerin zeminini oluşturuyordu."}, {"p": "İslâm, Hindistan bölgesine sufiler aracılığıyla taşındı. Bu durum özünde mistik bir din anla­"}, {"p": "yışını ihtiva eden Hinduizm’le İslâm arasında ve her iki dinin temsilcileri arasında bir yakın­"}, {"p": "laşmayı beraberinde getirdi. Ancak ilerleyen süreçte Müslümanlarla Hindular arasındaki ya­"}, {"p": "kınlaşma Müslüman sufilerin Hind mistiklerinden etkilenmelerine ve aşırı inzivacı ve zühtçü,"}, {"p": "dış dünyaya tümüyle kapalı ve hurafelerle dolu bir din anlayışını benimsemelerine sebebiyet"}, {"p": "verdi. Buna 16.. yüzyılda Ekber Şah’ın Hinduizm ile İslâm’ı da içine alacak şekilde eklektik bir… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025-2026 · Soru 18**: Zeydiyye’nin itikâdî görüşleriyle ilgili aşağıdakilerden hangisi doğrudur?"}, {"li": "[2] **2025-2026 · Soru 20**: İsmailî düşüncenin en önemli unsuru aşağıdakilerden hangisidir?"}, {"li": "[3] **2024-2025 · Soru 17**: İsmailî düşüncenin en önemli unsuru aşağıdakilerden hangisidir?"}, {"li": "[4] **2024-2025 · Soru 18**: Aşağıdakilerden hangisi Şîa’nın günümüze kadar yaşamış büyük kollarından biridir?"}, {"li": "[5] **2024-2025 · Soru 20**: Zeydiyye’nin imamet anlayışıyla ilgili aşağıdakilerden hangisi doğrudur?"}, {"li": "[6] **2023-2024 · Soru 17**: Şiiliğe göre Hz. Ali'nin imametinin belirlendiği olay aşağıdakilerden hangisidir?"}, {"li": "[7] **2023-2024 · Soru 18**: Aşağıdakilerden hangisi Şiiliğin oluşmasında belirleyici bir rol oynamıştır?"}, {"li": "[8] **2023-2024 · Soru 19**: Aşağıdakilerden hangisi Şîa’nın günümüze kadar yaşamış büyük kollarından biridir?"}, {"li": "[9] **2023-2024 · Soru 20**: Şia'yı diğer mezheplerden ayıran en temel görüşü aşağıdakilerden hangisidir?"}, {"li": "[10] **2022-2023 · Soru 17**: Aşağıdakilerden hangisi Şîa’nın günüzümüze kadar yaşamış büyük kollarından biridir?"}, {"li": "[11] **2022-2023 · Soru 18**: - 2023 Güz Dönemi Şiiliğe göre Hz. Ali'nin imametinin belirlendiği olay aşağıdakilerden hangisidir?"}, {"li": "[12] **2022-2023 · Soru 19**: Şiiliğe göre Hz. Ali'nin imametinin belirlendiği olay aşağıdakilerden hangisidir?"}], "sources": [{"title": "8- İslam Toplumunun Temel Ayrılığı: Şia ve İmâmet | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=I6uc87hI5uE"}]}, {"n": 6, "title": "Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye", "summary": "Bu bölümde Şia'nın günümüze kadar varlığını sürdüren kollarından Zeydiyye ve İsmailiyye mezhepleri detaylı olarak incelenmektedir. Zeydiyye'nin meftulün imameti ve harici huruç anlayışı ile Ehl-i Sünnet'e ve Mu'tezile'ye yakın yönleri sunulmaktadır. İsmailiyye'nin ise Zahir-Batın ayrımı, Yedi Devir anlayışı, Nizariler ve Müsta'liler şeklindeki tarihsel kolları açıklanmaktadır.", "objectives": ["Zeydiyye'nin İmamet anlayışını ve diğer Şii kollardan ayrılan ılımlı yönlerini açıklayabilmek.", "İsmailiyye'deki Batıni tevil metodunu ve Yedi Devir anlayışını kavrayabilmek.", "Zeydiyye ve İsmailiyye'nin tarihsel gelişim süreçlerini ve günümüzdeki durumlarını değerlendirebilmek."], "notes": [{"h": "6. Günümüze Ulaşan Kollarıyla Şia: Zeydiyye ve İsmailiyye"}, {"p": "Bu bölümde Şia'nın günümüze kadar varlığını sürdüren kollarından Zeydiyye ve İsmailiyye mezhepleri detaylı olarak incelenmektedir. Zeydiyye'nin meftulün imameti ve harici huruç anlayışı ile Ehl-i Sünnet'e ve Mu'tezile'ye yakın yönleri sunulmaktadır. İsmailiyye'nin ise Zahir-Batın ayrımı, Yedi Devir anlayışı, Nizariler ve Müsta'liler şeklindeki tarihsel kolları açıklanmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Zeydiyye'nin İmamet anlayışını ve diğer Şii kollardan ayrılan ılımlı yönlerini açıklayabilmek."}, {"li": "İsmailiyye'deki Batıni tevil metodunu ve Yedi Devir anlayışını kavrayabilmek."}, {"li": "Zeydiyye ve İsmailiyye'nin tarihsel gelişim süreçlerini ve günümüzdeki durumlarını değerlendirebilmek."}, {"h": "Ünite 10: Çağdaş İslâmî Akımlar"}, {"p": "*AÖF ders kitabı, Ünite 10, PDF sayfa ~193-213.*"}, {"li": "Ünite - Çağdaş İslâmî Akımlar"}, {"p": "Yeni selefîlik ile daha çok Vehhâbîlik’le özdeşleştirilen ve geleneksel Ehl-i Hadîs çizgisini"}, {"p": "sürdüren günümüz selefîliği arasında “ana kaynaklara dönüşçü” ortak payda dışında be­"}, {"p": "lirgin bir benzerlik ve yakınlık bulunmamak­ta­dır. İhyâcılık/İslâmcılık İslâm toplumunu"}, {"p": "modernleştirmek adına yükseltilen, entelektüel, rasyonel, bilimci, gelişimci, aktivist yönleri"}, {"p": "ağır basan, Müslüman­ları birleştirici bir amaç güden küresel bir siyasi projenin adı iken;"}, {"p": "geleneksel selefiyye, daha çok hadis merkezli bir metinciliği esas alarak akılcı çözümlere"}, {"p": "mesafeli, dışlamacı karakteri baskın muhafazakâr yaklaşımı temsil etmektedir."}, {"p": "b. İslâmiyet’in modern ihtiyaçları karşılayacak evrensel bir siyasi-sosyal muhtevaya"}, {"p": "sahip olduğu fikri, İslâmcıların sıklıkla vurguladıkları bir tez olmuştur. İslâmiyet’in"}, {"p": "modern dünyadaki bu kapsayıcılığı, kaynağını kutsaldan almakla birlikte akılla da"}, {"p": "kavranıp temellendirilebilir. Zira İslâm, akla uygun bir dindir. Bu nedenle çağın"}, {"p": "yeniliklerine kolaylıkla intibak edebilir. Gelişmeye (terakki) engel olmadığı gibi"}, {"p": "bizzat gelişmeyi emreder. Dinin gelişmeye engel olan unsurları, dine sonradan"}, {"p": "ilave edilen geleneğin ürünleridir. Tutucu bağlardan kurtulmak ve asli kaynakla­"}, {"p": "rı gelişmeci bir dini sistemin hizmetine sunmak için, Ortaçağ’da kapanan ictihat"}, {"p": "kapısı yeniden açılmalı, yeni hükümler üretilmeli, mezhep taklitçiliğinin önüne"}, {"p": "geçilmelidir (Özcan, Kutluer, 2001)."}, {"p": "c. Müslümanlar batıyı üstün kılan ilmi, medeni ve teknik usulleri alarak kendi top­"}, {"p": "lumlarını kalkındırmak zorundadır. Zaten batı medeniyeti bugünkü yüksek sevi­"}, {"p": "yesine daha önce Müslümanlardan öğrendikleriyle ulaşmıştır. Hz. Peygamber’in"}, {"p": "“hikmet müminin yitik malıdır, nerede bulursa onu alır” sözü referans alınmalıdır."}, {"p": "Fakat bu yararlanma faaliyeti seçmeci (eklektik) bir tarzda yapılmalıdır (Özcan,"}, {"p": "Kutluer, 2001). Yabancı ideolojiler ve ahlak anlayışları da bu arada alınırsa, bunlar"}, {"p": "İslâm’ın asli değerlerine uymadığından, bu tarz bir taklit gelişmeye değil yıkıma"}, {"p": "sebep olur."}, {"p": "d. Gelenekle hesaplaşma bağlamında İslâmcılar, genel olarak tasavvuf ve tarikatlara"}, {"p": "menfi bakmışlardır. Tarikatların atâlet ve miskinlik yuvaları haline geldiği; insan"}, {"p": "iradesini değersizleştirdiği; hurafeciliği geliştirdiği; takva, tevekkül ve zühd kav­"}, {"p": "ramlarını yanlış yorumlayarak ilerlemeye mani olduğu iddiaları sık sık dile ge­"}, {"p": "tirilmiştir. Bununla birlikte felsefi bir boyut taşıması ve bütün dinleri içine alan"}, {"p": "müsamahakâr birlik anlayışı nedeniyle vahdet-i vücûd düşüncesi bazı İslâmcılar"}, {"p": "nezdinde özel ilgi görmüştür (Özcan, Kutluer, 2001)."}, {"p": "e. İslâmcılar, eğitim-öğretimin ıslahı üzerinde önemle durmuşlardır. Onlara göre,"}, {"p": "medrese sistemini değiştirmek, ıslah etmek, pratik hiçbir faydası olmayan veya"}, {"p": "devri geçmiş dersler yerine günün ihtiyaçlarına cevap verecek konuları okutmak,"}, {"p": "felsefenin ve pozitif bilimlerin tahsiline önem vermek gerekmekteydi (Kara, 1995,"}, {"p": "s. 77). Bu hedefler doğrultusunda Seyyid Ahmed Han, Aligarh Mektebi’ni kurmuş;"}, {"p": "Muhammed Abduh el-Ezher müfredatının ıslahı için çalışmış, Said Nursî ise Doğu"}, {"p": "Anadolu’da Zehrâ Medresesi adıyla açmayı düşündüğü bir yüksek öğretim kuru­"}, {"p": "munu projelendirmişti.… ⟦1⟧"}, {"p": "**GÜNÜMÜZ İSLÂM DÜNYASINDA ANA DİNÎ AKIMLAR**"}, {"p": "Ünitemizin bu bölümünde, günümüz İslâm dünyasının üç büyük akımı olan gelenekçilik,"}, {"p": "ıslahatçılık ve modernizmi, bunların teşkilat veya şahıs teme­linde önemli temsilcilerini"}, {"p": "ve bunların görüşlerini değerlendirmeye alacağız."}, {"p": "Söz konusu akımların kesin hatlarla birbirlerinden ayrıldığını söyle­yemiyoruz. Aralarında"}, {"p": "mutlaka benzerliklerin olduğunu, geçişkenliklerin yaşandığını görüyoruz. Gelenekçi yapılar­"}, {"p": "da ıslahatçı eğilimlere veya ıslahatçı yapılarda güçlü modernist motiflere sıklıkla rastlıyoruz."}, {"p": "Fakat bu benzerlik ve geçişkenliklere rağmen, mevcut dini, siyasi ve kültürel oluşumların söz"}, {"p": "ve icraatlarına ve tabii ki tarihsel köklerine bakarak üçlü bir sınıflamanın yapılmasının ve bu"}, {"p": "sınıfların kendi altlarında detaylandırılmasının mümkün olacağını düşünüyoruz."}, {"p": "Gelenekçi Oluşumlar"}, {"p": "Bir toplum veya toplulukta eskiden kalmış olmaları dolayısıyla saygın tutulup kuşaktan"}, {"p": "kuşağa iletilen, üyeler arasında manevi bağları güçlendiren, özgüven kazandıran ve belli"}, {"p": "bir yaptırım gücü olan bilgiler, adetler, davranışlar, alışkanlıklar, sözlü ya da yazılı kültürel"}, {"p": "kalıntılar geleneği oluş­turmaktadır. Örneğin mezheplerin, tarikatların, medrese tedrisatı­"}, {"p": "nın ken­dilerine özgü gelenekleri bulunmaktadır. Bunlar ümmet veya İslâm geleneği deni­"}, {"p": "len geleneksel ana yapı içerisinde önemli bir kısmı oluşturur."}, {"p": "Gelenek birikimi içinde sıhhatli unsurlar yanında sıhhatsiz, temelsiz, marazi unsurlar"}, {"p": "da tabii ki bulunacaktır. Gelenekçilik, muhafazakâr bir tutumla sıhhatli-sıhhatsiz ayrı­"}, {"p": "mına çok itibar etmeden, sadece “müslümanlar arasında intikal etmesi” özelliğini dik­"}, {"p": "kate alarak geleneğin sürdürülmesini, yaşanmasını ister. Gelenekçi oluşumların liderleri"}, {"p": "çoğunlukla şeyh, üstad, mevlâna, âlim, imam gibi lakaplarla anılırlar ve geleneksel dini"}, {"p": "eğitim almış kişiler arasından çıkarlar. Silsile sistemi bu yapılarda bugünü geçmişe bağ­"}, {"p": "lar. Ayrıca gelenek içinde bazı mertebeler oluşmuştur ve bu hiyerarşiye saygılı davranışlar"}, {"p": "beklenir. Yapılanmada erkek egemen bir çalışma sistemi mevcuttur. Meseleler karşısında… ⟦2⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2021-2022 · Soru 17**: İsmailiyye imamları, Ubeydullah el-Mehdî’nin Fâtımî devletini kurduğu 296/908 tarihine kadar -------, yani gizlenme dönemini devam ettirdile"}, {"li": "[2] **2021-2022 · Soru 19**: İsmailiyye imamları, Ubeydullah el-Mehdî’nin Fâtımî devletini kurduğu 296/908 tarihine kadar -------, yani gizlenme dönemini devam ettirdile"}], "sources": [{"title": "9- Günümüze Ulaşan Kollarıyla Şîa: \"Zeydiyye\" | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=YXT_gTinJXY"}, {"title": "10- Günümüze Ulaşan Kollarıyla Şîa: \"İsmailiyye\" | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=EDOncSKtEX0"}]}], "cards": [{"front": "Mezhep (Lügat ve Terim Anlamı)", "back": "Arapça 'zehebe' (gitmek) kökünden türeyen mezhep, sözlükte 'gidilecek yol ve yöntem' anlamına gelir. Terim olarak ise dinin anlaşılması ve algılanmasından kaynaklanan grupları ve bunların kurumsallaşmış fikir ve pratiklerini ifade eder.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:1"}, {"front": "Fırka", "back": "Arapçada bölünüp parçalanma ve bir bütünün bozulması anlamına gelen fırka, klasik literatürde daha çok siyasi ve itikadi saiklerle ayrışan somut sosyal grupları tanımlamak için kullanılır.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:2"}, {"front": "Din ile Mezhep Arasındaki Temel Fark", "back": "Din, peygamber vasıtasıyla vahyedilen ilahi kaynaklı ve tek ilkedir. Mezhepler ise masum olmayan alimlerin insani ceht ve gayretleriyle şekillenen beşeri, çoklu ve zamana göre değişebilen yorumlardır.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:3"}, {"front": "Sivil İnisiyatif Aşaması", "back": "Mezhepleşme sürecinin ilk merhalesi olup yetkin bir alimin toplumun karşılaştığı yeni soru ve sorunlara bağımsız ilmi birikimiyle bireysel çözümler üretmesini ifade eder.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:4"}, {"front": "Cemaatleşme Aşaması", "back": "Karizmatik bir alimin veya ilim insanının ürettiği görüşler ve duruş etrafında bir takipçi kitlesinin toplanmasıyla sivil inisiyatifin sosyal bir gruba dönüşmesidir.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:5"}, {"front": "İkinci Adam (Sistemleştirici Şahsiyet)", "back": "Kurucu imamdan sonra gelen ve devraldığı fikir birikimini derleyip yazılı literatüre dönüştürerek gruba ayırt edici mezhebi kimliğini kazandıran sistemleştirici alimdir.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:6"}, {"front": "Mezhepleşmede Kurumsallaşma", "back": "Sistemleştirilen fikirlerin medreseler, hiyerarşik hoca-talebe yapıları ve ilmi gelenekler vasıtasıyla müstakil bir mezhebi kimliğe ve kalıcılığa kavuşması sürecidir.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:7"}, {"front": "Üst Kimlik ve Alt Kimlik Bağlamında Din ile Mezhep", "back": "İslam dini Müslüman bir birey için birleştirici üst kimliği oluşturur. Mezhep ise bu ilahi dinin farklı yorumlanma biçimlerinden kaynaklanan alt kimliği temsil eder.", "ch": 1, "chTitle": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "id": "islam-mezhepleri-tarihi:8"}, {"front": "İhtilaf", "back": "Dinin temel esaslarını kabul etmekle birlikte, açık hüküm bulunmayan konularda alternatif düşünceler ve farklı çözümler üretilmesidir. İnsanın yapısından kaynaklanan doğal bir durum olup toplum için bir zenginlik niteliği taşır.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:9"}, {"front": "İftirak (Tefrika)", "back": "Fikir ayrılıklarının taassup ve düşmanlığa dönüştürülerek ümmetin sosyal bütünlüğünün ve birliğinin parçalanmasıdır. Kur'an-ı Kerim'de yasaklanan husus farklı düşünmek değil, toplumu bölen bu ayrılıktır.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:10"}, {"front": "Hak Mezhep Söylemi", "back": "Her mezhebin kendi anlayışını naslara ve İslam'ın ruhuna en uygun yorum olarak görmesidir. Bu söylem, bir mezhebin kendini dinin yerine koyarak diğer grupları tekfir etmesi veya sapkınlıkla suçlaması durumunda bir probleme dönüşür.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:11"}, {"front": "Mezhepçilik", "back": "Kişinin kendi mezhebini dinin kendisiyle eşitleyip taassup sebebiyle diğer mezhep ve grupları din dışı ilan etmesidir. Genellikle cehaletten beslenen bu tutum, ümmetin birliğini tehdit eden aşırı bir istismar biçimidir.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:12"}, {"front": "Mezhepsizlik", "back": "Mezhepleri bidat ve sapma kabul edip asırlık metot ve usul birikimini reddederek doğrudan naslara dönme iddiasıdır. Yerleşik metodolojiyi yok saydığı için kişileri usulsüzlüğe, kafa karışıklığına ve yeni ihtilaflara sürükler.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:13"}, {"front": "Psiko-Sosyal Faktörler", "back": "İnsanın bireysel mizaç farklılıkları, algılama biçimi ve içinde yaşadığı toplumsal çevrenin dini anlama ve yorumlama sürecine etkisidir. Mezheplerin oluşumunda insan ve toplum unsurundan kaynaklanan temel nedenleri ifade eder.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:14"}, {"front": "Yuhanna el-Dımeşki", "back": "Emevi sarayında görev yapan ve Müslümanlara Kur'an'daki kelime kavramı üzerinden Hristiyanlık lehine sorular yönelten Doğu Kilisesi patriğidir. Bu itirazlar Müslümanlar arasında Kur'an'ın mahluk olup olmadığı gibi ilk kelami tartışmaları tetiklemiştir.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:15"}, {"front": "Sosyo-Politik Faktörler", "back": "Hz. Peygamber'in vefatının ardından yaşanan halife seçimleri, Hz. Osman dönemi olayları ve iç savaşlar gibi siyasi gelişmelerdir. Bu siyasi olaylar Müslümanları tavır almaya ve görüşlerini temellendirmek için teolojik tartışmalar yürütmeye sevk etmiştir.", "ch": 2, "chTitle": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "id": "islam-mezhepleri-tarihi:16"}, {"front": "Hariciler (Havaric)", "back": "Sıffin Savaşı'ndaki Tahkim Olayı sonrasında Hz. Ali'den ayrılan ve meşru idareye isyan eden ilk siyasi-itikadi fırkadır. Muhaliflerince dinden ve itaat dairesinden ayrılanlar anlamında bu isimle anılmışlardır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tarihi:17"}, {"front": "Muhakkime", "back": "Sıffin Savaşı sonrasında insan hakemliğine başvurulmasını reddeden ve 'Hüküm ancak Allah'ındır' ilkesini savunan Haricilerin kullandığı ilk dönem adlandırmasıdır.", "ch": 3, "chTitle": "İlk Siyasi-İtikadi Mezhepleşme: Hariciler", "id": "islam-mezhepleri-tari
