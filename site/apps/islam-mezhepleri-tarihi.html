, "why": "Bu konu Mu'tezile'nin 'Tevhid' prensibi kapsamında ele alınmaktadır."}, {"t": "Büyük günah işleyen kişinin (mürtekib-i kebîre) imandaki durumu", "ok": true, "why": "Büyük günah işleyenin ne tam mümin ne de tam kafir olup ikisi arasında bir konumda bulunacağını ifade eder."}, {"t": "Kulların kendi fiillerini yaratması", "ok": false, "why": "Bu mesele Mu'tezile'nin 'Adalet' prensibiyle ilişkilidir."}, {"t": "İyiliği emredip kötülükten alıkoyma sorumluluğu", "ok": false, "why": "Bu ilke 'Emir bi'l-Ma'rûf Nehiy ani'l-Münker' prensibini açıklar."}], "hint": "Vâsıl b. Atâ'nın hocası Hasan-ı Basrî ile görüş ayrılığına düştüğü ana meseledir.", "type": "multiple_choice", "a": "", "why": "", "qid": "9ou2tj", "ch": 4}, {"q": "Dinin özündeki bütünlüğün bozulması, aslından olmayan şeylerin dine sonradan eklenmesi veya icat edilmesi durumunu ifade eden kavram aşağıdakilerden hangisidir?", "o": [{"t": "Tefrika", "ok": false, "why": "Toplumsal ve siyasal ayrışma, gruplaşma ve bölünmeyi ifade eder."}, {"t": "Bid’at", "ok": true, "why": "Sözlükte önceden benzeri olmadan sonradan icat edilen şey, dini terim olarak dine dahi edilen yenilik anlamındadır."}, {"t": "Dalâlet", "ok": false, "why": "Doğru yoldan saptırma veya hak yoldan ayrılma durumunu anlatır."}, {"t": "Celâdet", "ok": false, "why": "Güçlükler karşısında yiğitlik, yiğitçe duruş ve sertlik anlamına gelen kavramdır."}], "hint": "Sünnet kavramının zıttı olarak dinde sonradan ortaya çıkarılan uygulamaları tanımlar.", "type": "multiple_choice", "a": "", "why": "", "qid": "12h3flx", "ch": 4}, {"q": "Mâtürîdî kelamcılarının; ilahi sıfatlar, Kur'an'ın yaratılmışlığı (halku'l-Kur'an) ve insan fiilleri gibi konularda aşırı ve tutarsız yorumlara giderek nasları göz ardı etmekle eleştirdikleri ekol aşağıdakilerden hangisidir?", "o": [{"t": "Mu'tezile", "ok": true, "why": "Akılcı yorumları aşırıya kaçırarak nasların açık anlamlarını tahrif ettikleri gerekçesiyle Mâtürîdîlerce eleştirilmişlerdir."}, {"t": "Hâricîler", "ok": false, "why": "Aşırı katı lafızcı ve siyasi olarak tekfirci tutumlarıyla bilinen ilk muhalif fırkadır."}, {"t": "Mürcie", "ok": false, "why": "Ameli imandan bir cüz saymayıp hükmü erteleyen ilk dönem fırkasıdır."}, {"t": "Selefiyye", "ok": false, "why": "Müteşâbih naslarda tevil yapmayıp teslimiyeti seçen nakilci yaklaşımdır."}], "hint": "Akla verdikleri aşırı önem ve 'Beş Esas' (El-Usûlü'l-Hamse) anlayışlarıyla bilinen kelam ekolüdür.", "type": "multiple_choice", "a": "", "why": "", "qid": "1j2d33g", "ch": 4}, {"q": "İsmailî düşünce sisteminin metinleri anlama ve yorumlamadaki en belirleyici prensibi aşağıdakilerden hangisidir?", "o": [{"t": "Aklın nasların önüne geçirilerek tamamen re'y ile hareket edilmesi", "ok": false, "why": "İsmailîlik tamamen akılcılık yerine imamın gizli öğretisine ve batıni teviline dayanır."}, {"t": "Kutsal metin ve şer'i hükümlerin zahir ve batın şeklinde iki boyutta değerlendirilmesi", "ok": true, "why": "Ayet ve hükümlerin görünür (zahir) anlamının ötesinde gizli ve derin (batın) anlamları olduğunu savunurlar."}, {"t": "Kader konusunda insanın tamamen mecbur olduğunu savunmak", "ok": false, "why": "İsmailîliğin temeli cebir anlayışı değil, masum imamın batıni rehberliğidir."}, {"t": "Büyük günah işleyen kimsenin kafir kabul edilmesi", "ok": false, "why": "Bu yaklaşım Haricilik ekolünün temel niteliğidir."}], "hint": "Bu sebeple söz konusu fırka tarihte sıklıkla 'Bâtınîlik' adıyla da anılmıştır.", "type": "multiple_choice", "a": "", "why": "", "qid": "bpi8c3", "ch": 4}, {"q": "Şîa gelenek ve literatüründe, Hz. Peygamber'in Veda Haccı dönüşünde Hz. Ali'yi kendisinden sonraki dini ve siyasi lider (imam) olarak tayin ettiğine inanılan tarihî olay aşağıdakilerden hangisidir?", "o": [{"t": "Gadir Hum Hadisesi", "ok": true, "why": "Gadir Hum, Şîa inancında Hz. Ali'nin açıkça velayet ve imametle görevlendirildiği belirleyici mekan ve olay olarak kabul edilir."}, {"t": "Kırtas Hadisesi", "ok": false, "why": "Hz. Peygamber'in vefatına yakın bir kağıt ve kalem istemesi olayı olup doğrudan bir imam tayin merasimi şeklinde gerçekleşmemiştir."}, {"t": "Ebvâ Toplantısı", "ok": false, "why": "Emeviler döneminde Haşimoğulları mensuplarının siyasi biat konusunu görüşmek üzere toplandığı özel bir buluşmadır."}, {"t": "Hakem Olayı", "ok": false, "why": "Sıffîn Savaşı sonrasında Hz. Ali ile Muaviye taraftarları arasındaki halifelik anlaşmazlığını çözmek amacıyla kurulan tahkim sürecidir."}], "hint": "Hz. Peygamber'in Veda Haccı dönüşü yol üzerindeki bir su birikintisi mevkiinde gerçekleşen olayı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "rifaj1", "ch": 5}, {"q": "Klasik İslam mezhepleri tarihinde Şîa'yı Ehl-i Sünnet ve diğer ana İslami ekollerden ayıran ve dinin temel esasları (usûlü'd-dîn) arasında sayılan en belirleyici itikadi ilke aşağıdakilerden hangisidir?", "o": [{"t": "İmâmet", "ok": true, "why": "Şîa mektebinde devlet başkanlığı sıradan bir siyasi seçim değil, Peygamberlik müessesesinin devamı niteliğinde ilahi bir tayindir."}, {"t": "Adâlet", "ok": false, "why": "Adalet ilkesi Mu'tezile ve Şîa'da ortak esaslardan biri olup Şîa'yı diğer tüm fırkalardan ayıran tekil unsur değildir."}, {"t": "Tevhid", "ok": false, "why": "Tevhid bütün İslami ekollerin ortak inanç esası olduğundan Şîa'ya özgü ayrıştırıcı bir çizgi niteliği taşımaz."}, {"t": "Nübüvvet", "ok": false, "why": "Peygamberlik müessesesi tüm Müslüman gruplarca kabul edilen genel bir İslam inanç esasıdır."}], "hint": "Siyasi ve dini liderliğin ilahi bir nassa dayandığı inancını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1a6l6jb", "ch": 5}, {"q": "Günümüzde nüfusunun önemli bir kısmını bünyesinde barındıran ve devletin resmi mezhepsel yapısında belirgin ağırlığı bulunan Zeydiyye mensupları yoğun olarak hangi ülkede yaşamaktadır?", "o": [{"t": "Yemen", "ok": true, "why": "Zeydiyye mezhebi tarihsel süreçten günümüze kadar varlığını en güçlü şekilde Yemen coğrafyasında sürdürmüştür."}, {"t": "Azerbaycan", "ok": false, "why": "Azerbaycan'daki Şii nüfusun büyük çoğunluğu On İki İmam (İsnâaşeriyye/Ca'feriyye) koluna mensuptur."}, {"t": "Hindistan", "ok": false, "why": "Hindistan'da İsnâaşeriyye ve İsmailiyye kollarının toplulukları bulunmakta olup Zeydiyye hâkim mezhep değildir."}, {"t": "Mısır", "ok": false, "why": "Mısır günümüzde ağırlıklı olarak Sünni nüfusun ve Sünni ameli mezheplerin yaygın olduğu bir ülkedir."}], "hint": "Güney Arap Yarımadası'nda yer alan ve Zeydi imamların tarih boyunca hüküm sürdüğü coğrafyayı anımsayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "wwfshd", "ch": 5}, {"q": "İsmailiyye tarihinde, imamların kimliklerini gizlediği ve Ubeydullah el-Mehdî'nin Fatımi Devleti'ni kurduğu döneme kadar devam eden 'gizlenme dönemi' hangi terimle ifade edilir?", "o": [{"t": "Setr", "ok": true, "why": "İsmaili geleneğinde devlet kurulana kadarki imamların gizli faaliyet yürüttüğü döneme 'dövrü's-setr' adı verilir."}, {"t": "Gaybet", "ok": false, "why": "İsnâaşeriyye (On İki İmam) ekolünde son imamın gizlenmesi ve gözlerden uzaklaşması durumunu ifade eder."}, {"t": "Rec'at", "ok": false, "why": "Vefat eden imamın veya kişilerin ahir zamanda adaleti tesis etmek üzere tekrar dünyaya döneceği inancıdır."}, {"t": "Bâtın", "ok": false, "why": "Ayet ve hadislerin dış anlamının ötesindeki gizli ve içsel derin anlamını simgeleyen kavramdır."}], "hint": "Arapçada örtünme, gizlenme ve saklanma anlamına gelen kökten türeyen terimi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "14bmwdz", "ch": 5}, {"q": "İsmailî düşünce sisteminin teşekkülünde Neo-Platonist ve Gnostik felsefi akımların etkisiyle öne çıkan ve dini metinlerin yorumlanmasında uygulanan temel yaklaşım aşağıdakilerden hangisidir?", "o": [{"t": "Kutsal metinlerin zahir ve batın şeklinde ayrıştırılması", "ok": true, "why": "İsmailîlik, ayetlerin dış anlamının (zahir) yanında yalnızca masum imamın öğretebileceği gizli bir anlamının (batın) bulunduğunu savunur."}, {"t": "Nassların tamamen lafzi (zahiri) anlamlarıyla sınırlandırılması", "ok": false, "why": "Lafzi ve şekilsel okuma Bâtınî/İsmailî felsefenin aksine Zahiriyye ve Selefiyye ekollerine aittir."}, {"t": "Hadis metinlerinin akli gerekçelerle tamamen reddedilmesi", "ok": false, "why": "İsmailîlik hadisleri tümüyle reddetmez; kendi silsileleri üzerinden batıni tevil metoduna tabi tutarak aktarır."}, {"t": "Siyasi iktidarın halk oylamasıyla belirlenmesi zorunluluğu", "ok": false, "why": "Şii/İsmailî anlayışta liderlik seçimle değil, nass ve ilahi tayinle belirlenir."}], "hint": "Dış görünüş ile gizli ve derin anlam arasındaki ikiliği kuran Bâtınî yorum yöntemini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "17kd8oo", "ch": 5}, {"q": "Hz. Hüseyin'in Kerbela'da şehit edilmesinden sonra, pişmanlık duyarak Emeviler'e karşı vicdan azabıyla harekete geçen ve Şiiliğin duygusal/siyasi kimlik kazanmasında önemli rol oynayan kitlesel hareket aşağıdakilerden hangisidir?", "o": [{"t": "Tevvabun Hareketi", "ok": true, "why": "Tevvabun Hareketi, Kerbela'da Hz. Hüseyin'i yalnız bırakan Kûfelilerin kefaret ödeme ve intikam alma amacıyla başlattıkları bir 'Tövbeler Edenler' eylemidir."}, {"t": "Zeyd b. Ali İsyanı", "ok": false, "why": "Tevvabun hareketinden daha sonraki bir dönemde Emevi yönetimine karşı gerçekleştirilmiş silahlı ihya hareketidir."}, {"t": "Ridde Savaşları", "ok": false, "why": "Hz. Ebu Bekir döneminde dinden dönen ve zekat vermeyen kabilelere karşı yürütülen askeri mücadeledir."}, {"t": "Ezrakiyye Ayaklanması", "ok": false, "why": "Ezrakiyye, Şîa ile ilişkisi bulunmayan ve radikal eylemleriyle bilinen bir Harici fırkasıdır."}], "hint": "Kelime anlamı 'günahlarına pişman olup tövbe eden topluluk' olan grubu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1t1zg67", "ch": 5}, {"q": "Şîa’nın bazı kollarında görülen; vefat eden imamın ahir zamanda adaleti sağlamak üzere dünyaya yeniden döneceği yönündeki inanç kavramı aşağıdakilerden hangisidir?", "o": [{"t": "Rec'at", "ok": true, "why": "Rec'at, sözlükte 'geri dönmek' anlamına gelip Şii teolojisinde imamın ahir zamanda dünyaya rücu etmesi fikrini ifade eder."}, {"t": "Bedâ", "ok": false, "why": "Allah'ın önceden takdir ettiği veya bildirdiği bir durumun sonradan başka bir şekilde tecelli etmesi tezidir."}, {"t": "Tenâsüh", "ok": false, "why": "Ruhun bir bedenden çıkıp ölümden sonra başka bir insan veya hayvan bedenine geçmesi inancıdır."}, {"t": "Hulûl", "ok": false, "why": "İlahi varlığın veya ruhun bir insan bedenine girmesi ve onunla birleşmesi anlayışıdır."}], "hint": "Arapçada 'rücu etmek' veya 'geri dönmek' kökünden gelen terimi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1yge148", "ch": 5}, {"q": "Şîa’nın tarihsel teşekkül sürecinde, Müslümanlar arasındaki ilk büyük iç savaş olarak kabul edilen ve Hz. Ali ile Hz. Aişe taraftarları arasında gerçekleşen olay aşağıdakilerden hangisidir?", "o": [{"t": "Cemel Vak'ası", "ok": true, "why": "Deve Olayı olarak da bilinen Cemel Vak'ası, Müslümanlar arasındaki ilk iç savaştır ve siyasi kutuplaşmayı derinleştirmiştir."}, {"t": "Sıffîn Savaşı", "ok": false, "why": "Hz. Ali ile Muaviye b. Ebi Süfyan ordusu arasında gerçekleşen ikinci büyük iç savaştır."}, {"t": "Nahrevan Savaşı", "ok": false, "why": "Hz. Ali'nin ordusu ile ordusundan ayrılan Harici gruplar arasında yapılan mücadeledir."}, {"t": "Kerbela Hadisesi", "ok": false, "why": "Emevi halifesi Yezid'in ordusu ile Hz. Hüseyin ve beraberindekiler arasında gerçekleşen trajik çatışmadır."}], "hint": "Hz. Aişe'nin devesinin etrafında cereyan ettiği için bu adla anılan olayı anımsayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "124b08z", "ch": 5}, {"q": "Şîa mezhebi içinde, günümüze kadar varlığını sürdürmüş ana kollar arasında yer alan ve ilk üç halifenin hilafetini tamamen reddetmeyip Hz. Ali'nin en üstün (efdal) olduğunu savunmakla yetinen ılımlı Şii kolu aşağıdakilerden hangisidir?", "o": [{"t": "Zeydiyye", "ok": true, "why": "Zeydiyye, Sünni ameli ve fikri yapıya en yakın Şii fırkasıdır; mefzulün (daha az üstün olanın) imametini caiz görerek ilk halifelerin idaresini kategorik olarak reddetmez."}, {"t": "Kerbiyye", "ok": false, "why": "Muhammed b. el-Hanefiyye'nin ölmediğini savunan, aşırı fikirli ve tarihi süreçte yok olmuş bir koldur."}, {"t": "Muhammire", "ok": false, "why": "Aşırı (Gulat) görüşler taşıyan ve günümüze ulaşamayan marjinal bir gruptur."}, {"t": "Beyâniyye", "ok": false, "why": "Beyan b. Sem'an'a nispet edilen ve uluhiyet iddiası barındıran yok olmuş radikal bir fırkadır."}], "hint": "Zeyd b. Ali'ye mensup olan ve Sünniliğe en yakın kabul edilen Şii mezhebini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "1obq779", "ch": 5}, {"q": "Aşağıdakilerden hangisi Şîa’nın tarihsel olarak teşekkül etmesinde ve Emeviler yönetimine karşı bir muhalefet odağı haline gelmesinde etkili olan gelişmelerden biri DEĞİLDİR?", "o": [{"t": "Ridde Hadiseleri", "ok": true, "why": "Ridde Hadiseleri, Hz. Ebu Bekir döneminde zekat vermeyen ve sahte peygamberlerin peşinden giden kabilelere karşı yürütülmüş olup Şii teşekkülle doğrudan ilişkili değildir."}, {"t": "Kerbela Hadisesi", "ok": false, "why": "Kerbela, Şii bilincinin, matem kültürünün ve direniş kimliğinin oluşmasındaki ana milattır."}, {"t": "Muhtar es-Sakafi Hareketi", "ok": false, "why": "Kûfe merkezli bu hareket Hz. Hüseyin'in intikamını alma vaadiyle Şii siyasi örgütlenmesini güçlendirmiştir."}, {"t": "Hucr b. Adiyy İsyanı", "ok": false, "why": "Emevi valilerinin Ali evladına lanet okuma politikasına karşı Şiilerin gösterdiği ilk açık tepki ve başkaldırılardandır."}], "hint": "Hz. Ebu Bekir'in halifeliğinin ilk zamanlarında yalancı peygamberler ve zekat vermeyen kabilelere karşı yapılan mücadeleyi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "nu0l9e", "ch": 5}, {"q": "Allah'ın bilmesinde veya takdirinde sonradan bir değişme olması, önceden ilan edilen bir durumun başka şekilde tecelli etmesi anlamına gelen ve bazı Şii grupların imamet nakillerindeki sapmaları açıklamakta başvurduğu kavram aşağıdakilerden hangisidir?", "o": [{"t": "Bedâ", "ok": true, "why": "Bedâ, sözlükte 'sonradan ortaya çıkmak' anlamında olup imamlara dair öngörülerin gerçekleşmemesini açıklamakta kullanılan teolojik bir terimdir."}, {"t": "Hulûl", "ok": false, "why": "İlahın insan bedenine intikal etmesi veya onda tecelli etmesi fikridir."}, {"t": "Teşbîh", "ok": false, "why": "Yaratıcıyı yaratılmış varlıklara ve insan organlarına benzetme anlayışıdır."}, {"t": "Tenâsüh", "ok": false, "why": "Ölen bir kimsenin ruhunun başka bir bedene geçerek yaşamaya devam etmesi inancıdır."}], "hint": "İmamet sırasının belirlenmesinde vuku bulan beklenmedik değişimleri açıklamak için kullanılan kavramı anımsayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "105accl", "ch": 5}, {"q": "Şiilikte Ehl-i Beyt sevgisi ve imamet düşüncesinin kurumsallaşmasında, Hz. Peygamber'in soyunun devam ettiği ve evlilik bağıyla Hz. Ali ile birleştiği kilit kızı kimdir?", "o": [{"t": "Hz. Fatıma", "ok": true, "why": "Hz. Fatıma, Hz. Peygamber'in soyunun devamını sağlayan ve Hz. Ali ile evliliğinden imamlar silsilesi doğan kilit şahsiyettir."}, {"t": "Hz. Hatice", "ok": false, "why": "Hz. Peygamber'in ilk eşidir; Peygamber soyunun Ali evladı üzerinden sürdüğü doğrudan halkanın anası Hz. Fatıma'dır."}, {"t": "Hz. Âişe", "ok": false, "why": "Hz. Peygamber'in eşi olup Cemel Vak'ası'nda Hz. Ali'nin karşısındaki grupta yer almıştır."}, {"t": "Hz. Zeyneb", "ok": false, "why": "Hz. Ali ve Hz. Fatıma'nın kızıdır; Kerbela sonrası süreçte rol oynamış olmakla birlikte soy silsilesinin kökünü oluşturmaz."}], "hint": "Hz. Peygamber'in 'benden bir parçadır' dediği ve Hz. Hasan ile Hz. Hüseyin'in annesi olan kızı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "cf8te4", "ch": 5}, {"q": "İslam Mezhepleri Tarihi disiplininin temel metodolojisi ve akademik yaklaşımı göz önüne alındığında, aşağıdakilerden hangisi bu bilim dalının amaçları arasında yer almaz?", "o": [{"t": "Mezhepleri 'hak' veya 'batıl' olarak sınıflandırıp doğru inanç esaslarını tespit etmek", "ok": true, "why": "Mezhepler Tarihi normatif ve teolojik değerlendirmeler yapmak yerine tarafsız, tasviri ve objektif bir inceleme yapmayı hedefler."}, {"t": "Mezhep ve dinî grupların tarih boyunca bıraktıkları izleri görünür kılmak", "ok": false, "why": "Dini hareketlerin ve mezheplerin tarihsel süreçteki etkilerini tespit etmek bu disiplinin temel hedeflerindendir."}, {"t": "Müslümanlar arasındaki mezhepsel çatışma ve sorunlara yönelik yapıcı çözümler sunmak", "ok": false, "why": "Toplumsal barışa katkı sunmak ve mezhepsel önyargıları gidermek akademik Mezhepler Tarihi çalışmalarının gayelerindendir."}, {"t": "Müslüman toplumların sosyo-psikolojik kuvvet ve zaaflarına dair verilere ulaşmak", "ok": false, "why": "Toplumsal yapıların din anlayışıyla etkileşimini anlamak disiplinin veri toplama amaçları arasında yer alır."}], "hint": "Bu disiplinin normatif (yargılayıcı/kelamî) değil, tasvirî (betimleyici) bir bilim dalı olduğunu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "1yjr2m0", "ch": 6}, {"q": "Dinin özündeki uygulamalardan sapmayı/sonradan uydurulan şeyleri ve Müslüman toplumun bütünlüğündeki bozulmayı ifade eden temel kavramlar aşağıdakilerin hangisinde sırasıyla doğru verilmiştir?", "o": [{"t": "Bid’at - Tefrika", "ok": true, "why": "Sözlükte önceden benzeri olmadan icat edilen şey anlamına gelen Bid’at dinin özündeki sonradan olma şeyleri, Tefrika ise toplum bütünlüğünün bozulmasını ifade eder."}, {"t": "Tefrika - Makâlât", "ok": false, "why": "Makâlât, İslam düşüncesindeki görüşlerin derlendiği eser türlerini ifade eder, toplumsal ayrışmayla doğrudan ilgisi yoktur.", "p": true}, {"t": "Celâdet - Dalâlet", "ok": false, "why": "Celâdet yiğitlik/sertlik anlamına gelir; dinin bozulması veya toplumsal bölünmeyle kavrayış olarak örtüşmez."}, {"t": "Furkat - İttifak", "ok": false, "why": "İttifak, ayrışma veya bozulmayı değil aksine birlik ve uzlaşmayı simgeler."}], "hint": "İlk kavram dinî yenilik/icadı, ikinci kavram ise toplumsal bölünmeyi ifade etmektedir.", "type": "multiple_choice", "a": "", "why": "", "qid": "3m83zq", "ch": 6}, {"q": "Din Sosyolojisi ile İslam Mezhepleri Tarihi’nin ortak çalışma alanları değerlendirildiğinde, aşağıdakilerden hangisi bu iki disiplinin ortak odak noktalarından biri değildir?", "o": [{"t": "Bir mezhebin itikadi görüşlerinin kelami açıdan doğruluğunu kanıtlama", "ok": true, "why": "İtikadi görüşlerin doğruluğunu kanıtlama çabası sosyolojik veya tarihsel bir analiz değil, Kelam ilminin konusudur."}, {"t": "Bir mezhepte cemaatsel hiyerarşinin nasıl teşekkül ettiği", "ok": false, "why": "Dini gruplar içerisindeki otorite yapısı ve hiyerarşi hem sosyolojinin hem de mezhepler tarihinin inceleme alanıdır."}, {"t": "Bir mezhebin 'kurtarıcı bekleme' inancı geliştirmesinin sosyo-psikolojik sebepleri", "ok": false, "why": "Kurtarıcı beklentisi ve mehdilik gibi inançların toplumsal zeminini araştırmak her iki disiplinin ortak konusudur."}, {"t": "Mezhep mensupları arasındaki grupsal dayanışma ve ekonomik yardımlaşma", "ok": false, "why": "Grup içi bağlılık ve sosyal dayanışma mekanizmaları toplumsal ve mezhepsel incelemelerde ortak konudur."}], "hint": "Disiplinlerin betimleyici nitelikte mi yoksa inanç savunucusu (savunmacı/teolojik) nitelikte mi olduğunu göz önüne alınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "bdhh0z", "ch": 6}, {"q": "İslam Mezhepleri Tarihi'nin klasik kaynaklarından kabul edilen 'el-Fark beyne'l-Fırak' ve 'Makâlâtü'l-İslâmiyyîn' adlı eserlerin yazarları sırasıyla aşağıdakilerden hangisidir?", "o": [{"t": "Abdülkāhir el-Bağdâdî - Ebû'l-Hasan el-Eş'arî", "ok": true, "why": "el-Fark beyne'l-Fırak Bağdâdî'nin, Makâlâtü'l-İslâmiyyîn ise Eş'arî'nin İslam fırkalarını ele alan en önemli klasik eserlerindendir."}, {"t": "Ebû Mansur el-Mâtürîdî - Vâsıl b. Atâ", "ok": false, "why": "Ebû Mansur el-Mâtürîdî Kitâbü't-Tevhîd'in yazarıdır; bahsedilen klasik makâlât eserleri bu alimlere ait değildir."}, {"t": "İmam Rabbânî - Mevlâna Hâlid Bağdâdî", "ok": false, "why": "Bu isimler tasavvufi geleneğin (Nakşibendiyye) önemli simaları olup klasik mezhepler tarihi makâlât literatürünün ana yazarları değillerdir."}, {"t": "Ebû'l-Mu’în en-Nesefî - Ebû Yûsuf", "ok": false, "why": "Nesefî Mâtürîdî kelamcısı, Ebû Yûsuf ise Hanefî fıkıh alimidir; sözü edilen eserler bu kişilere ait değildir."}], "hint": "Eserlerden biri Eş'arîliğin kurucusu olan ünlü kelamcıya aittir.", "type": "multiple_choice", "a": "", "why": "", "qid": "1cop7di", "ch": 6}, {"q": "Sıffîn Savaşı sonrasında gerçekleşen Tahkim Hadisesi ve Hz. Ali'nin hakeme başvurmayı kabul etmesi neticesinde ortaya çıkan ilk siyasi mezhep aşağıdakilerden hangisidir?", "o": [{"t": "Hâricîlik", "ok": true, "why": "Tahkim kararına 'Hüküm ancak Allah'ındır' diyerek karşı çıkan ve Hz. Ali'nin ordusundan ayrılan grup Hâricîliği oluşturmuştur."}, {"t": "Mürcie", "ok": false, "why": "Mürcie, iç çatışmalar karşısında tarafsız kalıp büyük günah işleyenin durumunu Allah'a erteleyen fikri akımdır; doğrudan tahkim ayrışmasıyla doğmamıştır."}, {"t": "Mu'tezile", "ok": false, "why": "Mu'tezile, Hasan-ı Basrî'nin ders halkasından ayrılan Vâsıl b. Atâ tarafından daha sonraki bir dönemde kurulmuştur."}, {"t": "İbâdiyye", "ok": false, "why": "İbâdiyye, Hâricîliğin ılımlı bir kolu olarak daha sonra teşekkül etmiş, doğrudan tahkim olayının kendisinde bağımsız bir fırka olarak çıkmamıştır."}], "hint": "Sloganları 'Hüküm ancak Allah'ındır' (Lâ hükme illâ lillâh) olan gruptur.", "type": "multiple_choice", "a": "", "why": "", "qid": "1coiqmp", "ch": 6}, {"q": "Hz. Ebû Bekir'in halife seçildikten hemen sonra toplumsal düzeni ve devlet otoritesini korumak adına üstlendiği ilk büyük mücadele aşağıdakilerden hangisidir?", "o": [{"t": "Yalancı peygamberlerle ve zekat vermeyen kabilelerle mücadele etmek", "ok": true, "why": "Hz. Ebû Bekir hilafetinin başlangıcında dinî ve siyasi bütünlüğü tehdit eden dinden dönme (ridde) hareketleri, sahte peygamberler ve zekat karşıtlarıyla mücadele etmiştir."}, {"t": "Hz. Ali'yi Kûfe valisi olarak atamak", "ok": false, "why": "Hz. Ebû Bekir döneminde Kûfe şehri henüz kurulmamıştı ve Hz. Ali Kûfe valisi olarak atanmamıştır."}, {"t": "Sa’d b. Ubâde’yi cezalandırarak sürgüne göndermek", "ok": false, "why": "Hz. Ebû Bekir Sa'd b. Ubâde'yi cezalandırma yoluna gitmemiş, siyasi uzlaşma zeminini korumuştur."}, {"t": "Emevi soyundan gelen yöneticileri görevden uzaklaştırmak", "ok": false, "why": "Emevi valilerine yönelik tasfiye politikası Hz. Ebû Bekir döneminin bir önceliği veya ilk işi olmamıştır."}], "hint": "İslam tarih literatüründe 'Ridde Savaşları' olarak adlandırılan olayları düşününüz.", "type": "multiple_choice", "a": "", "why": "", "qid": "oxcz6v", "ch": 6}, {"q": "Mu'tezile mezhebinin beş temel esasından biri olan 'el-Menzile beyne'l-Menzileteyn' (iki konum arasında bir konum) prensibi aşağıdaki tartışmalardan hangisiyle doğrudan ilgilidir?", "o": [{"t": "Büyük günah işleyen Müslümanın (mürtekib-i kebîre) durumu", "ok": true, "why": "Bu ilke, büyük günah işleyen kişinin ne tam mümin ne de tam kâfir olduğunu, imansızlık ile iman arasında fâsık bir konumda yer aldığını savunur."}, {"t": "İmanın artıp eksilmesi meselesi", "ok": false, "why": "İmanın artması ve eksilmesi tartışması daha çok Mürcie, Ehl-i Hadis ve Mâtürîdî/Eş'arî kelamında ele alınan farklı bir konudur."}, {"t": "Allah'ın sıfatlarının zatı ile olan ilişkisi", "ok": false, "why": "Sıfatlar meselesi Mu'tezile'nin 'Tevhid' prensibi altında incelenir."}, {"t": "İnsan fiillerinin yaratıcısının kim olduğu sorunu", "ok": false, "why": "Kulun fiilleri ve adalet konusu Mu'tezile'nin 'Adâlet' esasının kapsamına girer."}], "hint": "Vâsıl b. Atâ'nın Hasan-ı Basrî'nin meclisinden ayrılmasına neden olan ana meseledir.", "type": "multiple_choice", "a": "", "why": "", "qid": "ql6mdl", "ch": 6}, {"q": "Fiillerin yaratılmasında kaderin mutlak belirleyiciliğini reddederek insanın kendi fiillerinin yaratıcısı olduğunu savunan ve fiili Allah'a değil insana nispet eden mezhep aşağıdakilerden hangisidir?", "o": [{"t": "Kaderiyye", "ok": true, "why": "Kaderiyye, Allah'ın belirlediği kader anlayışına karşı çıkarak insanın özgür iradesiyle fiillerini yarattığını ileri süren mezheptir."}, {"t": "Cebriyye", "ok": false, "why": "Cebriyye tam tersine insanın hiçbir iradesinin bulunmadığını, rüzgarda yaprak gibi kaderin sürüklemesinde olduğunu savunur."}, {"t": "Mücessime", "ok": false, "why": "Mücessime, Allah'ı cisim olarak tahayyül eden ve teşbihe düşen anlayıştır; kader tartışmasıyla doğrudan tanımlanmaz."}, {"t": "Mürcie", "ok": false, "why": "Mürcie ana odağını amelin imandan bir cüz olmadığı ve hükmün tehir edilmesi fikrine oturtur."}], "hint": "Kaderi kul lehine yorumlayıp, 'kader insan iradesidir' diyen fırkadır.", "type": "multiple_choice", "a": "", "why": "", "qid": "lwt96q", "ch": 6}, {"q": "Mâtürîdîlerin; ilâhî sıfatlar, halku'l-Kur'ân, kader ve insan fiilleri gibi konularda nasları aşırı rasyonel zorlamalarla yorumlayarak sapmaya düştüğü iddiasıyla en çok eleştirdiği mezhep aşağıdakilerden hangisidir?", "o": [{"t": "Mu'tezile", "ok": true, "why": "Mâtürîdî kelamcılar akla verdikleri aşırı rolle nasların zahirini zedeledikleri gerekçesiyle Mu'tezile'yi tutarsız yorum yapmakla eleştirmişlerdir."}, {"t": "Eş'arîyye", "ok": false, "why": "Eş'arîyye, Mâtürîdiyye ile birlikte Ehl-i Sünnet'in iki ana kolundan biridir; aralarında köklü zıtlıktan ziyade küçük cüz'i farklar bulunur."}, {"t": "Selefiyye", "ok": false, "why": "Selefiyye aklı ikincil plana atar; Mâtürîdîlerin aşırı akılcılıkla eleştirdiği grup Selefiyye değildir."}, {"t": "Haşviyye", "ok": false, "why": "Haşviyye, aklı hiç kullanmayıp metinlerin yüzeysel anlamına takılan grubu ifade eder; akılcı yorum yapmakla suçlanmaz."}], "hint": "Akılcılığı ve beş esası (Usûl-i Hamse) ile tanınan kelam mezhebidir.", "type": "multiple_choice", "a": "", "why": "", "qid": "eo3zeg", "ch": 6}, {"q": "XVIII. yüzyılda Muhammed b. Abdülvahhâb tarafından Selefî düşünce temellerine dayanarak sistemleştirilen ve Suud hanedanı nezdinde siyasi bir devlet mezhebine dönüştürülen akım aşağıdakilerden hangisidir?", "o": [{"t": "Vehhâbiyye", "ok": true, "why": "Muhammed b. Abdülvahhâb'ın fikirleri doğrultusunda siyasallaşan ve Arap Yarımadası'nda yaygınlaşan hareket Vehhâbiyye olarak adlandırılır."}, {"t": "Zeydiyye", "ok": false, "why": "Zeydiyye Şîa'nın Mutedil koludur, XVIII. yüzyıl Suud devletleşmesiyle ilintili değildir."}, {"t": "Zâhiriyye", "ok": false, "why": "Dâvûd ez-Zâhirî ve İbn Hazm ile özdeşleşen klasik hukuk ekolüdür."}, {"t": "Mâtürîdiyye", "ok": false, "why": "Aklî-naklî dengeyi kuran Ehl-i Sünnet kelam ekolüdür, Vehhabîlik anlayışıyla örtüşmez."}], "hint": "Kurucusunun ismine nispetle adlandırılan ve günümüzde Suudi Arabistan'da resmi nitelik kazanan akımdır.", "type": "multiple_choice", "a": "", "why": "", "qid": "k3wxdm", "ch": 6}, {"q": "Mâtürîdiyye mezhebinin kurucusu Ebû Mansur el-Mâtürîdî'ye ait olan, sırasıyla kelam ve tefsir alanındaki iki temel eser aşağıdakilerden hangisinde doğru eşleştirilmiştir?", "o": [{"t": "Kitâbü't-Tevhîd - Te'vîlâtü'l-Kur'ân", "ok": true, "why": "Kitâbü't-Tevhîd Mâtürîdî'nin ana kelam eseri, Te'vîlâtü'l-Kur'ân (Te'vîlâtü Ehli's-Sünne) ise tefsir eseridir."}, {"t": "el-Fiqhü'l-Ekber - Makâlâtü'l-İslâmiyyîn", "ok": false, "why": "el-Fiqhü'l-Ekber Ebû Hanîfe'ye, Makâlâtü'l-İslâmiyyîn ise Eş'arî'ye aittir."}, {"t": "el-İbâne - Usûlü'd-Dîn", "ok": false, "why": "el-İbâne Eş'arî'ye ait bir kelam eseridir."}, {"t": "et-Tebsıra - Dürerü’l-Hukkâm", "ok": false, "why": "et-Tebsıra Ebû'l-Mu'în en-Nesefî'ye ait bir kelam kaynağıdır."}], "hint": "İlk eser tevhidi ve kelami konuları ele alırken, ikincisi bir Kur'an yorumlama çalışmasıdır.", "type": "multiple_choice", "a": "", "why": "", "qid": "1cn3biw", "ch": 6}, {"q": "Şîa düşüncesinde Hz. Ali'nin Hz. Peygamber tarafından kendisinden sonraki imam ve halife olarak açıkça tayin edildiğine inanılan tarihsel olay aşağıdakilerden hangisidir?", "o": [{"t": "Gadir Hum Hadisesi", "ok": true, "why": "Şiiler, Hz. Peygamber'in Veda Haccı dönüşü Gadir Hum denilen mevkide Hz. Ali'yi veli ve imam tayin ettiğini kabul ederler."}, {"t": "Kırtas Hadisesi", "ok": false, "why": "Kırtas Hadisesi, Hz. Peygamber'in vefatına yakın kağıt ve kalem istemesi üzerine yaşanan tartışmayı ifade eder."}, {"t": "Hayber'in Fethi", "ok": false, "why": "Hayber'in fethi askeri bir gazvedir; imametin ilanı meselesi olarak temellendirilmez."}, {"t": "Sedd-i Ebvâb Olayı", "ok": false, "why": "Mescid-i Nebevî'ye açılan kapıların kapatılmasıyla ilgili husustur, siyasi vasiyet ilanı kabul edilmez."}], "hint": "Veda Haccı dönüşünde su birikintisi/vaha yakınında gerçekleşen olayı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "qid": "ip2wof", "ch": 6}, {"q": "Şîa'yı Ehl-i Sünnet ve diğer tüm İslami fırkalardan ayıran, dinin asılları (Usûlü'd-Dîn) arasında gördükleri en temel itikadi esas aşağıdakilerden hangisidir?", "o": [{"t": "İmâmet", "ok": true, "why": "İmamet, Şîa nezdinde sadece siyasi bir idare meselesi değil, dinin ve inancın temel rükünlerinden biridir."}, {"t": "Tevhid", "ok": false, "why": "Tevhid bütün İslami mezheplerin ortak inanç esasıdır, Şîa'yı diğerlerinden ayıran özgün esas değildir."}, {"t": "Nübüvvet", "ok": false, "why": "Peygamberlik kurumu tüm Müslüman mezheplerce kabul edilen ortak esastır."}, {"t": "Meâd", "ok": false, "why": "Ahiret günü ve öldükten sonra dirilme (Meâd) İslam inanç esaslarının tamamında mevcuttur."}], "hint": "Hz. Peygamber'den sonra Müslümanların dinî ve dünyevi liderliği/masum yöneticiliği ilkesidir.", "type": "multiple_choice", "a": "", "why": "", "qid": "k702rf", "ch": 6}, {"q": "Günümüzde ana nüfusu Yemen'de varlığını sürdüren, imametin Fatımi soyundan ilim ve kılıçla huruç eden kişiye ait olabileceğini savunan Şîa kolu aşağıdakilerden hangisidir?", "o": [{"t": "Zeydiyye", "ok": true, "why": "Zeyd b. Ali'ye nispet edilen Zeydiyye, Yemen'de yaygın olan ve Ehl-i Sünnet'e görüş itibarıyla en yakın kabul edilen mütadil Şiî koldur."}, {"t": "İsnâaşeriyye", "ok": false, "why": "İsnâaşeriyye (Ca'feriyye) İran, Irak ve Lübnan'da yaygındır; gizli imam anlayışına dayanır."}, {"t": "İsmailiyye", "ok": false, "why": "İsmailiyye daha çok Hindistan, Pakistan ve Kanada gibi ülkelerde dağınık yaşar ve yedi imam anlayışına/bâtınî yorumlara odaklanır."}, {"t": "Kerbiyye", "ok": false, "why": "Kerbiyye tarihte kalmış, günümüze ulaşamamış aşırı (gulat) Şiî kollardandır."}], "hint": "Şîa'nın Ehl-i Sünnet'e en yakın mütadil kolu kabul edilir.", "type": "multiple_choice", "a": "", "why": "", "qid": "dggu3o", "ch": 6}, {"q": "İsmailiyye mezhebinin din ve metin anlayışındaki en karakteristik yaklaşım biçimi aşağıdakilerden hangisidir?", "o": [{"t": "Ayetlerin ve şer'i hükümlerin hem bir 'zahir' hem de gizli bir 'batın' anlamı olduğunu kabul etmek", "ok": true, "why": "İsmailiyye, dinî metinlerin dış görünüşünün (zahir) ötesinde sadece imamların öğretebileceği derin bir bâtınî anlam taşıdığına inanır."}, {"t": "Büyük günah işleyen kişileri dinden çıkmış kâfirler olarak nitelendirmek", "ok": false, "why": "Bu katı yaklaşım Hâricîliğin genel tutumudur."}, {"t": "Hilafetin sadece Kureyş kabilesi arasında seçimle belirleneceğini savunmak", "ok": false, "why": "Şiilikte ve İsmailiyye'de imamet seçimle değil nass ve tayinle gerçekleşir."}, {"t": "İman ile ameli tamamen birbirinden ayırarak ameli önemsizleştirmek", "ok": false, "why": "Ameli imandan ayırıp erteleyen yaklaşım Mürcie'ye aittir."}], "hint": "Bu sebeple bu mezhep tarihsel literatürde 'Bâtıniyye' adıyla da anılmaktadır.", "type": "multiple_choice", "a": "", "why": "", "qid": "xeyfzb", "ch": 6}], "units": {"1": "Din, Mezhep İlişkisi ve Mezhepleşme Süreci", "2": "Mezheplerin Ortaya Çıkış Nedenleri", "3": "İlk Mezhepler (Haricilik, Şia, Maturidilik vb.)", "4": "Ehl-i Sünnet ve Sonraki Mezhepler", "5": "Şîa Tarihi ve Çağdaş Akımlar", "6": "Günümüz İslâm Mezhepleri"}, "sources": [{"title": "1- The Relationship Between Religion and Sects | History of Sects | Assoc. Prof. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=b4gBBKiduvg", "type": "youtube"}, {"title": "2- Bir Mezhep Nasıl Oluşur? | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=-7EaH53FX1U", "type": "youtube"}, {"title": "3- \"Hak Mezhep\" Söylemi | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=hNIKhXt1hDw", "type": "youtube"}, {"title": "4- İslam'da Mezhepleşmenin Sebepleri | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=NbB-jbETFFY", "type": "youtube"}, {"title": "5- İlk Siyasî-İtikadî Mezhepleşme: Hâricîler | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=3R20cPXxFXU", "type": "youtube"}, {"title": "6- Hâricîlerle Başlayan Temel Tartışma: Kebîre | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=e_CDpYpnfqU", "type": "youtube"}, {"title": "7- Temel Kelamî Meseleler ve Etrafında Oluşan Mezhepler | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=dZ8nMOAz3_Y", "type": "youtube"}, {"title": "8- İslam Toplumunun Temel Ayrılığı: Şia ve İmâmet | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=I6uc87hI5uE", "type": "youtube"}, {"title": "9- Günümüze Ulaşan Kollarıyla Şîa: \"Zeydiyye\" | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=YXT_gTinJXY", "type": "youtube"}, {"title": "10- Günümüze Ulaşan Kollarıyla Şîa: \"İsmailiyye\" | Mezhepler Tarihi | Doç. Dr. Kadir Gömbeyaz", "url": "https://www.youtube.com/watch?v=EDOncSKtEX0", "type": "youtube"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Kitap", "url": "", "type": "file"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Çıkmış Sınav Soruları (1)", "url": "", "type": "file"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Çıkmış Sınav Soruları (2)", "url": "", "type": "file"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Çıkmış Sınav Soruları (3)", "url": "", "type": "file"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Çıkmış Sınav Soruları (4)", "url": "", "type": "file"}, {"title": "İSLÂM MEZHEPLERİ TARİHİ - Çıkmış Sınav Soruları", "url": "", "type": "file"}], "counts": {"chapters": 6, "cards": 48, "quiz": 90, "sources": 16}, "lang": "tr"}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var KEY = DATA.storageKey + ".app";
  var st = {known: {}, best: 0, seen: 0, done: {}, q: {}, pick: {}};
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  st.q = st.q || {}; st.pick = st.pick || {};
  // A rebuilt course can retire a question: its log entry and option counts go with it.
  (function prune() {
    var ids = {};
    DATA.quiz.forEach(function (q) { ids[q.qid] = 1; });
    Object.keys(st.q).forEach(function (k) { if (!ids[k]) delete st.q[k]; });
    Object.keys(st.pick).forEach(function (k) {
      if (!ids[k.slice(0, k.lastIndexOf(":"))]) delete st.pick[k];
    });
  })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function $(s) { return document.querySelector(s); }
  function norm(s) { return (s || "").toLocaleLowerCase(); }
  var query = "";

  function cut(text, n) {
    text = String(text || "");
    return text.length > n ? text.slice(0, n - 1) + "…" : text;
  }

  function unitName(q) {
    return (DATA.units && DATA.units[String(q.ch || 0)]) || "";
  }

  // ---- review schedule -----------------------------------------------------
  // Each answered question keeps a box and a due day (days since the epoch). A right answer moves
  // it up one box; a partly right answer stays where it is and comes back tomorrow; a wrong answer
  // drops to the first box and comes back tomorrow. A question never returns inside one run.
  var STEPS = [0, 1, 3, 7, 16];
  function today() { return Math.floor(Date.now() / 86400000); }
  function entry(qid) {
    var e = st.q[qid];
    if (!e || typeof e !== "object") e = st.q[qid] = {n: 0, ok: 0, part: 0, bad: 0, box: 0, due: 0};
    return e;
  }
  function record(q, verdict, picked) {
    var e = entry(q.qid);
    e.n += 1;
    if (verdict === "ok") {
      e.ok += 1;
      e.box = Math.min(e.box + 1, STEPS.length - 1);
      e.due = today() + STEPS[e.box];
    } else if (verdict === "partial") {
      e.part += 1;
      e.due = today() + 1;
    } else {
      e.bad += 1;
      e.box = 0;
      e.due = today() + 1;
    }
    (picked || []).forEach(function (j) {
      if (!q.o[j] || q.o[j].ok) return;
      var key = q.qid + ":" + j;
      st.pick[key] = (st.pick[key] || 0) + 1;
    });
    save();
  }
  // Only a question that has been answered already can be due: an unseen one belongs to Test, not
  // to the review queue, or Tekrar would just repeat the whole quiz.
  function dueQuestions() {
    var now = today();
    return DATA.quiz.filter(function (q) {
      var e = st.q[q.qid];
      return e && e.n && e.due <= now;
    });
  }

  function blocks(parent, list) {
    var ul = null;
    list.forEach(function (b) {
      if (b.h) { ul = null; parent.appendChild(el("h4", null, b.h)); }
      else if (b.li) {
        if (!ul) { ul = el("ul", "notes"); parent.appendChild(ul); }
        ul.appendChild(el("li", null, b.li));
      } else { ul = null; parent.appendChild(el("p", null, b.p)); }
    });
  }

  // ---- progress ------------------------------------------------------------
  function progressRow(name, n, total, unitText, cls) {
    var wrap = el("div", "prog");
    wrap.appendChild(el("p", "muted", name + ": " + n + " / " + total + " " + unitText));
    var bar = el("div", "bar" + (cls ? " " + cls : ""));
    var fill = el("i");
    fill.style.width = (total ? Math.round(100 * n / total) : 0) + "%";
    bar.appendChild(fill);
    wrap.appendChild(bar);
    return wrap;
  }

  function paintChapterDone(btn, card, n) {
    var done = Boolean(st.done[n]);
    btn.textContent = done ? "Tamamlandı ✓" : "Tamamlandı işaretle";
    btn.setAttribute("aria-pressed", done ? "true" : "false");
    card.dataset.done = done ? "1" : "0";
  }

  function toggleChapter(btn, card, n) {
    if (st.done[n]) delete st.done[n]; else st.done[n] = 1;
    save();
    paintChapterDone(btn, card, n);
    paintPanel();
  }

  // ---- panel ---------------------------------------------------------------
  function paintPanel() {
    var v = $("#view-panel");
    v.textContent = "";
    var stats = el("div", "stats");
    [["Bölüm", DATA.counts.chapters], ["Kart", DATA.counts.cards],
     ["Soru", DATA.counts.quiz], ["Kaynak", DATA.counts.sources]].forEach(function (s) {
      var d = el("div", "stat");
      d.appendChild(el("b", null, String(s[1])));
      d.appendChild(el("span", null, s[0]));
      stats.appendChild(d);
    });
    v.appendChild(stats);

    var doneCh = DATA.chapters.filter(function (c) { return st.done[c.n]; }).length;
    var known = DATA.cards.filter(function (c) { return st.known[c.id]; }).length;
    var box = el("div", "card");
    box.appendChild(el("h3", null, "İlerleme"));
    box.appendChild(progressRow("Bölüm", doneCh, DATA.counts.chapters, "bölüm tamamlandı", "b1"));
    box.appendChild(progressRow("Kart", known, DATA.counts.cards, "kart biliniyor", ""));
    if (st.best) box.appendChild(el("p", "muted", "En iyi test: " + st.best + "%"));
    var row = el("div", "row");
    row.style.marginTop = "14px";
    var b1 = el("button", "act primary", "Kartlara başla");
    b1.onclick = function () { show("kartlar"); };
    var b2 = el("button", "act ghost", "Teste gir");
    b2.onclick = function () { show("test"); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    v.appendChild(box);

    var answered = DATA.quiz.filter(function (q) { return st.q[q.qid] && st.q[q.qid].n; });
    if (answered.length) {
      var hits = answered.reduce(function (a, q) { return a + st.q[q.qid].ok; }, 0);
      var tries = answered.reduce(function (a, q) { return a + st.q[q.qid].n; }, 0);
      var an = el("div", "card");
      an.appendChild(el("h3", null, "Soru analizi"));
      an.appendChild(el("p", "muted", answered.length + " soru cevaplandı · " + tries + " denemede "
        + hits + " doğru (" + Math.round(100 * hits / tries) + "%)"));
      var hard = answered.slice().sort(function (a, b) {
        return st.q[b.qid].bad - st.q[a.qid].bad;
      }).filter(function (q) { return st.q[q.qid].bad; }).slice(0, 3);
      if (hard.length) {
        an.appendChild(el("div", "kicker", "En çok yanlış yapılan sorular"));
        var ul = el("ul", "list");
        hard.forEach(function (q) {
          ul.appendChild(el("li", null, cut(q.q, 100) + " · " + st.q[q.qid].bad + " yanlış"));
        });
        an.appendChild(ul);
      }
      // A partly correct option is not a trap: it is worth seeing on its own, because picking it
      // repeatedly means the learner knows part of the answer and stops there.
      var picks = Object.keys(st.pick).map(function (k) {
        var at = k.lastIndexOf(":"), id = k.slice(0, at), index = Number(k.slice(at + 1));
        var q = DATA.quiz.filter(function (x) { return x.qid === id; })[0];
        return q && q.o[index] ? {text: q.o[index].t, n: st.pick[k], part: Boolean(q.o[index].p)} : null;
      }).filter(Boolean).sort(function (a, b) { return b.n - a.n; });
      [["Kısmen doğru seçenekler", picks.filter(function (t) { return t.part; })],
       ["En çok yanıltan seçenekler", picks.filter(function (t) { return !t.part; })]]
        .forEach(function (group) {
          if (!group[1].length) return;
          an.appendChild(el("div", "kicker", group[0]));
          var ul2 = el("ul", "list");
          group[1].slice(0, 3).forEach(function (t) {
            ul2.appendChild(el("li", null, t.text + " · " + t.n + " kez seçildi"));
          });
          an.appendChild(ul2);
        });
      var due = dueQuestions();
      if (due.length) {
        var row2 = el("div", "row");
        row2.style.marginTop = "14px";
        var rb = el("button", "act ghost", "Tekrar (" + due.length + ")");
        rb.onclick = function () { quizKind = "tekrar"; show("test"); };
        row2.appendChild(rb);
        an.appendChild(row2);
      }
      v.appendChild(an);
    }

    if (DATA.brand.tagline) v.appendChild(el("p", "muted", DATA.brand.tagline));
  }

  // ---- cards ---------------------------------------------------------------
  var queue = [], qIndex = 0, revealed = false;
  function startCards() {
    queue = DATA.cards.filter(function (c) { return !st.known[c.id]; });
    if (!queue.length) queue = DATA.cards.slice();
    queue = queue.filter(function (c) {
      return !query || norm(c.front + " " + c.back + " " + c.chTitle).indexOf(query) >= 0;
    });
    qIndex = 0; revealed = false;
    paintCard();
  }
  function paintCard() {
    var v = $("#view-kartlar");
    v.textContent = "";
    if (!queue.length) {
      v.appendChild(el("p", "empty", DATA.counts.cards
        ? "Aramanıza uyan kart yok." : "Bu ders için henüz kart üretilmedi. Defterden kart üretmek için pipeline'ın flashcards aşamasını çalıştırın."));
      return;
    }
    var c = queue[qIndex % queue.length];
    var box = el("div", "card flash");
    box.appendChild(el("div", "kicker", (c.chTitle || "Kart") + " · " + (qIndex + 1) + "/" + queue.length));
    box.appendChild(el("div", "front", c.front));
    if (revealed) box.appendChild(el("div", "back", c.back));
    else box.appendChild(el("div", "muted", "Cevabı görmek için karta dokunun."));
    box.onclick = function () { revealed = true; paintCard(); };
    v.appendChild(box);

    var row = el("div", "row");
    var know = el("button", "act primary", "Biliyorum");
    know.onclick = function () {
      st.known[c.id] = 1; save(); revealed = false;
      queue.splice(qIndex % queue.length, 1);
      if (!queue.length) { paintPanel(); paintCard(); return; }
      paintCard();
    };
    var again = el("button", "act ghost", "Tekrar");
    again.onclick = function () {
      revealed = false; qIndex = (qIndex + 1) % queue.length; paintCard();
    };
    row.appendChild(know); row.appendChild(again);
    v.appendChild(row);
  }

  // ---- chapters ------------------------------------------------------------
  function paintChapters() {
    var v = $("#view-konular");
    v.textContent = "";
    var shown = DATA.chapters.filter(function (ch) {
      if (!query) return true;
      var hay = ch.title + " " + ch.summary + " " + ch.objectives.join(" ");
      ch.notes.forEach(function (b) { hay += " " + (b.p || b.h || b.li || ""); });
      return norm(hay).indexOf(query) >= 0;
    });
    if (!shown.length) { v.appendChild(el("p", "empty", "Aramanıza uyan bölüm yok.")); return; }
    shown.forEach(function (ch) {
      var card = el("section", "card");
      var head = el("div", "chhead");
      var left = el("div");
      left.appendChild(el("div", "kicker", "Bölüm " + ch.n));
      left.appendChild(el("h3", null, ch.title));
      var mark = el("button", "chdone", "");
      mark.type = "button";
      mark.title = "Bu bölümü bitirdiniz mi?";
      mark.onclick = function () { toggleChapter(mark, card, ch.n); };
      paintChapterDone(mark, card, ch.n);
      head.appendChild(left);
      head.appendChild(mark);
      card.appendChild(head);
      if (ch.summary) card.appendChild(el("p", "muted", ch.summary));
      if (ch.objectives.length) {
        var ul = el("ul", "obj");
        ch.objectives.forEach(function (o) { ul.appendChild(el("li", null, o)); });
        card.appendChild(ul);
      }
      if (ch.notes.length) blocks(card, ch.notes);
      if (ch.sources.length) {
        var k = el("div", "kicker", "Kaynaklar");
        k.style.marginTop = "14px";
        card.appendChild(k);
        ch.sources.forEach(function (s) {
          if (s.url) {
            var a = el("a", null, s.title);
            a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
            card.appendChild(a);
            card.appendChild(document.createElement("br"));
          } else card.appendChild(el("div", "muted", s.title));
        });
      }
      v.appendChild(card);
    });
  }

  // ---- quiz ----------------------------------------------------------------
  var pool = [], qi = 0, right = 0, partialRight = 0, answered = false, quizKind = "all";
  function startQuiz() {
    var source = quizKind === "tekrar" ? dueQuestions() : DATA.quiz;
    pool = source.filter(function (q) {
      if (!query) return true;
      return norm(q.q + " " + (q.a || "") + " "
        + q.o.map(function (o) { return o.t; }).join(" ")).indexOf(query) >= 0;
    });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    qi = 0; right = 0; partialRight = 0; answered = false;
    paintQuiz();
  }
  function paintQuiz() {
    var v = $("#view-test");
    v.textContent = "";
    if (!pool.length) {
      v.appendChild(el("p", "empty", DATA.counts.quiz
        ? (quizKind === "tekrar"
           ? "Tekrar sırasında soru yok. Yanlış ve kısmen doğru cevaplar yarın burada görünür."
           : "Aramanıza uyan soru yok.") : "Bu ders için henüz test sorusu yok."));
      return;
    }
    if (qi >= pool.length) {
      var pct = Math.round(100 * right / pool.length);
      if (quizKind !== "tekrar") {  // a review run is not a new best score
        st.seen = (st.seen || 0) + 1;
        if (pct > (st.best || 0)) st.best = pct;
        save();
      }
      var box = el("div", "card");
      box.appendChild(el("div", "kicker", quizKind === "tekrar" ? "Tekrar bitti" : "Test bitti"));
      box.appendChild(el("h3", null, right + " / " + pool.length + " doğru · " + pct + "%" +
        (partialRight ? " · " + partialRight + " kısmen doğru" : "")));
      box.appendChild(el("p", "muted", pct >= Math.round(DATA.passMark * 100)
        ? "Geçme sınırının üstündesiniz." : "Geçme sınırı " + Math.round(DATA.passMark * 100) + "%."));
      if (quizKind !== "tekrar") box.appendChild(el("p", "muted",
        "Yanlış ve kısmen doğru cevaplar yarın Tekrar sekmesinde geri gelir."));
      var row = el("div", "row");
      // A finished review has nothing due again today, so it goes back to Tekrar instead of rerunning.
      var again = el("button", "act primary", quizKind === "tekrar" ? "Tekrara dön" : "Yeniden çöz");
      again.onclick = quizKind === "tekrar" ? function () { show("tekrar"); } : startQuiz;
      var cards = el("button", "act ghost", "Kartlara dön");
      cards.onclick = function () { show("kartlar"); };
      row.appendChild(again); row.appendChild(cards);
      box.appendChild(row);
      v.appendChild(box);
      paintPanel();
      return;
    }
    var q = pool[qi];
    var card = el("section", "card");
    card.appendChild(el("div", "kicker", "Soru " + (qi + 1) + " / " + pool.length
      + (unitName(q) ? " · " + unitName(q) : "")));
    card.appendChild(el("h3", null, q.q));
    if (q.hint) card.appendChild(el("p", "muted", q.hint));
    if (!q.o.length) {  // boşluk doldurma / kısa cevap: cevap açılır, okuyucu kendi karar verir
      var rev = el("button", "act primary", "Cevabı göster");
      rev.onclick = function () { revealAnswer(card, q); };
      card.appendChild(rev);
      v.appendChild(card);
      return;
    }
    var selected = {}, labels = q.o.map(function (o) {
      var b = el("button", "opt", o.t);
      card.appendChild(b);
      return b;
    });
    // Tek doğru: tıklanan şık cevabı verir. Çoktan seçmeli: şıklar işaretlenir, küme "Kontrol et"te karşılaştırılır.
    // Üç sonuç var: doğru, kısmen doğru, yanlış. Kısmen doğru puan kazandırmaz; seçim doğru bilgi
    // içeriyor ama sorunun tam yanıtı değil.
    function pickedIndexes() {
      return q.o.map(function (o, j) { return j; }).filter(function (j) { return selected[j]; });
    }
    function settle(verdict, note) {
      answered = true;
      if (verdict === "ok") right += 1;
      if (verdict === "partial") partialRight += 1;
      record(q, verdict, pickedIndexes());
      q.o.forEach(function (o, j) {
        if (verdict === "partial" && selected[j]) labels[j].dataset.state = "partial";
        else labels[j].dataset.state = o.ok ? "ok" : (selected[j] ? "bad" : "");
      });
      var picked = q.o.filter(function (o, j) { return selected[j] && o.why; })[0];
      var why = verdict === "partial" ? picked : q.o.filter(function (x) { return x.ok && x.why; })[0];
      if (why) card.appendChild(el("p", verdict === "partial" ? "why partial" : "why", why.why));
      if (note) card.appendChild(el("p", "muted", note));
      card.appendChild(nextButton());
    }
    if (q.type === "multiple_select") {
      card.appendChild(el("p", "muted", "Doğru olan tüm seçenekleri işaretleyin."));
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = !selected[j];
          b.dataset.state = selected[j] ? "ok" : "";
        };
      });
      var check = el("button", "act primary", "Kontrol et");
      check.style.marginTop = "6px";
      check.onclick = function () {
        if (answered) return;
        var hits = 0, misses = 0;
        q.o.forEach(function (o, j) {
          if (!selected[j]) return;
          if (o.ok) hits += 1; else misses += 1;
        });
        if (q.o.every(function (o, j) { return Boolean(o.ok) === Boolean(selected[j]); })) {
          settle("ok", "Doğru.");
        } else if (hits && !misses) {
          settle("partial", "Kısmen doğru: doğru seçeneklerin bir kısmını işaretlediniz.");
        } else if (hits) {
          settle("partial", "Kısmen doğru: doğru seçeneklerden bazılarını işaretlediniz, ayrıca yanlış seçenek var.");
        } else {
          settle("bad", "Yanlış: doğru seçeneklerden hiçbirini işaretlemediniz.");
        }
      };
      card.appendChild(check);
    } else {
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = true;
          if (q.o[j].ok) settle("ok");
          else if (q.o[j].p) settle("partial", "Kısmen doğru: bu seçenek doğru bilgi içeriyor, ama sorunun tam yanıtı değil.");
          else settle("bad");
        };
      });
    }
    v.appendChild(card);
  }

  function nextButton() {
    var next = el("button", "act primary", qi + 1 >= pool.length ? "Sonucu gör" : "Sonraki soru");
    next.style.marginTop = "12px";
    next.onclick = function () { qi += 1; answered = false; paintQuiz(); };
    return next;
  }

  function revealAnswer(card, q) {
    if (answered) return;
    answered = true;
    if (q.a) card.appendChild(el("p", "why", q.why ? q.a + " " + q.why : q.a));
    else if (q.why) card.appendChild(el("p", "why", q.why));
    var row = el("div", "row");
    var know = el("button", "act primary", "Bildim");
    know.onclick = function () { right += 1; record(q, "ok"); qi += 1; answered = false; paintQuiz(); };
    var mid = el("button", "act ghost", "Kısmen bildim");
    mid.onclick = function () { partialRight += 1; record(q, "partial"); qi += 1; answered = false; paintQuiz(); };
    var no = el("button", "act ghost", "Bilemedim");
    no.onclick = function () { record(q, "bad"); qi += 1; answered = false; paintQuiz(); };
    row.appendChild(know); row.appendChild(mid); row.appendChild(no);
    card.appendChild(row);
  }

  // ---- review ---------------------------------------------------------------
  function paintTekrar() {
    var v = $("#view-tekrar");
    v.textContent = "";
    var box = el("div", "card");
    box.appendChild(el("h3", null, "Tekrar"));
    if (!DATA.counts.quiz) {
      box.appendChild(el("p", "empty", "Bu ders için henüz test sorusu yok."));
      v.appendChild(box);
      return;
    }
    var due = dueQuestions();
    box.appendChild(el("p", "muted", due.length
      ? due.length + " soru tekrar sırasında. Doğru cevap soruyu 1, 3, 7 ve 16 gün sonraya taşır; "
        + "yanlış ve kısmen doğru cevap yarın geri gelir."
      : "Şu an tekrar sırasında soru yok. Yanlış cevaplar ertesi gün burada görünür."));
    if (due.length) {
      var start = el("button", "act primary", "Tekrarı başlat (" + due.length + ")");
      start.onclick = function () { quizKind = "tekrar"; show("test"); };
      box.appendChild(start);
      var ul = el("ul", "list");
      ul.style.marginTop = "14px";
      due.slice(0, 12).forEach(function (q) {
        var e = st.q[q.qid];
        ul.appendChild(el("li", null, cut(q.q, 100)
          + " · " + (e.bad ? e.bad + " yanlış · " : "") + (e.part ? e.part + " kısmen · " : "")
          + e.n + " deneme"));
      });
      if (due.length > 12) {
        ul.appendChild(el("li", "muted", "+" + (due.length - 12) + " soru daha"));
      }
      box.appendChild(ul);
    }
    v.appendChild(box);
  }

  // ---- sources -------------------------------------------------------------
  function paintSources() {
    var v = $("#view-kaynaklar");
    v.textContent = "";
    var list = DATA.sources.filter(function (s) { return !query || norm(s.title).indexOf(query) >= 0; });
    if (!list.length) { v.appendChild(el("p", "empty", "Kaynak bulunamadı.")); return; }
    list.forEach(function (s) {
      var card = el("div", "card");
      card.appendChild(el("div", "kicker", s.type || "kaynak"));
      if (s.url) {
        var a = el("a", null, s.title);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        card.appendChild(a);
      } else card.appendChild(el("div", null, s.title));
      v.appendChild(card);
    });
  }

  // ---- shell ---------------------------------------------------------------
  var VIEWS = {panel: paintPanel, kartlar: startCards, konular: paintChapters, test: startQuiz,
              tekrar: paintTekrar, kaynaklar: paintSources};
  var current = "panel";
  function show(name) {
    current = name;
    Object.keys(VIEWS).forEach(function (k) {
      $("#view-" + k).hidden = k !== name;
      var b = $('#tabs button[data-view="' + k + '"]');
      if (b) b.setAttribute("aria-selected", k === name ? "true" : "false");
    });
    VIEWS[name]();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.onclick = function () {
      query = ""; $("#q").value = "";
      if (b.dataset.view === "test") quizKind = "all";
      show(b.dataset.view);
    };
  });
  var timer = null;
  $("#q").oninput = function (e) {
    clearTimeout(timer);
    var value = e.target.value;
    timer = setTimeout(function () { query = norm(value.trim()); VIEWS[current](); }, 120);
  };
  if (!DATA.counts.cards) document.querySelector('#tabs button[data-view="kartlar"]').hidden = true;
  if (!DATA.counts.quiz) {
    document.querySelector('#tabs button[data-view="test"]').hidden = true;
    document.querySelector('#tabs button[data-view="tekrar"]').hidden = true;
  }
  show("panel");
})();
</script>
</body>
</html>
