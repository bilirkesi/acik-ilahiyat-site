ine özgü kalıplarla yazıldı."}, {"h": "Alfabe"}, {"p": "Alfabenin temeli 28 harfli Arap alfabesidir. İranlılar pe پ, çe چ ve je ژ harflerini ekledi. Türkler genizden gelen ñ sesi için **kâf-ı nûnî** (sağır kef) ڭ harfini kullandı. Yumuşak g için **kâf-ı fârisî** (gef) گ, lam ile elifin birleşmesinden de **lamelif** لا vardır."}, {"li": "ا elif · ب be · پ pe · ت te · ث se · ج cim · چ çim · ح ha · خ hı · د dal · ذ zel"}, {"li": "ر re · ز ze · ژ je · س sin · ش şın · ص sad · ض dad · ط tı · ظ zı · ع ayın · غ gayın"}, {"li": "ف fe · ق kaf · ك kef · گ gef · ڭ sağır kef · ل lam · م mim · ن nun · و vav · ه he · لا lamelif · ى ye"}, {"p": "Bunların yanında hemze ء, yuvarlak te ة ve he şeklindeki ha-i resmiye yardımcı işaret olarak kullanılır."}, {"h": "Harekeler"}, {"p": "Arapçada uzun ünlüler harfle (elif, vav, ye) yazılır, kısa ünlüler yazılmaz. Kısa ünlüleri göstermek için **hareke** konur. Harekeler Kur'ân'ın yanlış okunmasını önlemek için ortaya çıktı. Türkler de 16. yüzyılın sonuna kadar Türkçe metinlerde hareke kullandı, sonra imlâ oturdukça bıraktı."}, {"li": "**Üstün** (fetha) ـَ harfin üstüne konur, harfi **a/e** okutur: بَن ben."}, {"li": "**Ötre** (damme) ـُ harfin üstüne konur, **o/ö/u/ü** okutur: بُن bün."}, {"li": "**Esre** (kesre) ـِ harfin **altına** konur, **ı/i** okutur: بِن bin."}, {"li": "**Tenvin**: harekenin kelimenin son harfinde çift yazılmasıdır. **Üstünlü tenvin** ـً son harfi **an/en** okutur ve yazılırken sona tenvin elifi eklenir: عموماً umûmen, سالماً sâlimen. **Esreli tenvin** ـٍ **ın/in**, **ötreli tenvin** ـٌ **un/ün** okutur."}, {"h": "Med, şedde ve cezm"}, {"li": "**Med** آ: elifin üstüne konur ve **uzun â** okutur: آمر âmir, آكل âkil. İlk sesi a olan Türkçe kelimelerde de kullanılır: آت at, آل al, آش aş. Türkçe kelimelerin içinde uzatma yapılmaz."}, {"li": "**Şedde** ـّ: Arapça kelimelerde yan yana gelen iki aynı ünsüz tek yazılır, üstüne şedde konur ve iki kez okunur: جنّت cennet, ملّت millet, مكّه Mekke. Türkçe kelimelerde şedde yerine harf iki kez yazılır: اللى elli, بللى belli. Sonu şeddeli kelimeler ünlüyle başlayan ek alınca ikiz okunur: حق hak, حقّى hakkı."}, {"li": "**Cezm** (sükûn) ـْ: harfin üstüne konur ve harfi **ünlüsüz** okutur: برْ bir, ترْك terk. Kelime sonundaki ünsüzler zaten sakin okunur."}, {"h": "Şekilce benzeyen harfler"}, {"p": "Bazı harfler yalnızca noktalarının sayısı ve yeriyle ayrılır:"}, {"li": "ب پ ت ث · ج چ ح خ · د ذ · ر ز ژ · س ش · ص ض · ط ظ · ع غ · ف ق"}, {"h": "Harflerin bitişmesi"}, {"p": "Yazı sağdan sola yazılır ve harfler çoğunlukla birbirine bitiştirilir. Harfin başta ve ortadaki şekli kısalır, sonda yalın şeklini korur."}, {"li": "Kendinden sonraki harfle **bitişmeyen** harfler: **ا د ذ ر ز ژ و ه** (he kelime sonunda). Bu harflerin başta, ortada ve sondaki şekli aynı kalır: دستور destûr, وار var."}, {"li": "Diğer harfler hem önceki hem sonraki harfle bitişir: ى, ش, ح, ق gibi."}, {"h": "Sınavda sık çıkanlar"}, {"li": "Harfin **altına** konan hareke yalnızca esredir."}, {"li": "Esreli tenvin \"ın/in\", üstünlü tenvin \"an/en\" okutur."}, {"li": "Med uzun â; cezm ünsüz; şedde iki harf okutur."}, {"li": "Arap alfabesinde olmayan harfler: پ چ ژ گ ڭ."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 1: Osmanlı Türkçesi Alfabesi", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 1 Özet videosu", "url": "https://www.youtube.com/watch?v=k4Cl5j777xs"}]}, {"n": 2, "title": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "summary": "Türkçe kelimelerin Arap harfleriyle nasıl yazıldığını anlatır: kalın ve ince ünsüz harfleri, genizsi n'yi gösteren kâf-ı nûnîyi, l sesini ve a, e, ı/i, o/ö/u/ü ünlülerinin kelime başında, ortasında ve sonunda yazılışını.", "objectives": ["Türkçe ünsüzleri Arap harfleriyle yazabilmek.", "Arapçada kalın ve ince hâlleri ayrı harfle gösterilen sesleri tanıyabilmek.", "Genizsi n'nin (kâf-ı nûnî) yazılışını kavrayabilmek.", "Kalın ve ince l sesini tanıyabilmek.", "Türkçe kelimelerde ünlülerin yazılışını uygulayabilmek."], "notes": [{"h": "Kalın ve ince ünsüzler"}, {"p": "Türkçede her ünsüzün tek bir harfi vardır; Arapçada ise bazı seslerin kalın ve ince hâlleri ayrı harflerle gösterilir:"}, {"li": "**k**: kalını kaf ق, incesi kef ك"}, {"li": "**t**: kalını tı ط, incesi te ت"}, {"li": "**s**: kalını sad ص, incesi sin س"}, {"li": "**z**: kalını zı ظ, incesi ze ز"}, {"li": "**ğ/g**: kalını gayın غ, incesi gef گ"}, {"p": "Türkçe kelimelerde çoğunlukla ince harfler kullanılır. Hecenin kalın okunacağını göstermek için kalın harf seçilir: اق ak, اك ek, طاش taş. Kelime başındaki s ve t, ardından gelen ünlü kalınsa kalın harfle yazılır: طوت tut, صو su."}, {"p": "Bu ayrım okumayı kolaylaştırır: سوز süz, سوك sök, صوص sus."}, {"h": "Genizsi n"}, {"p": "Türkçede diş n'si ve genizden gelen **ñ** olmak üzere iki n vardır. Genizsi ñ, üç noktalı kef ile, yani **kâf-ı nûnî** (sağır kef, nun kefi) ڭ ile yazılır: دڭز deñiz, اوڭ öñ, اڭلامق añlamak. Bu ses zamanla diş n'sine dönüştü."}, {"h": "L harfi"}, {"p": "Türkçede kalın (kalmak) ve ince (dilmek) iki l sesi vardır. Osmanlı alfabesinde ikisi için de aynı harf, lam ل kullanılır."}, {"h": "Ünlülerin yazılışı"}, {"p": "Ünlüleri gösteren harfler **elif ا, vav و, ye ى ve he ه**'dir. Türkçe kelimelerde ünlüler her zaman yazılmaz: ترلك terlik."}, {"li": "**a**: başta medli elif آش aş, آز az; ortada elif باش baş; sonda elif ya da bazen he."}, {"li": "**e**: başta elif (bazen hemzeli elif) ال el, او ev; ortada çoğunlukla yazılmaz كچ geç; sonda **güzel he** ile yazılır: دره dere."}, {"li": "**ı/i**: başta elif ve ye ايش iş, ايت it; ortada ye قيريق kırık; sonda ye."}, {"li": "**o/ö/u/ü**: başta elif ve vav اوكوز öküz; ortada vav (bazen ye); sonda vav."}, {"p": "Bazı eski kelimelerde ye, bugün \"e\" okunan sesi karşılar: كيجه gece."}, {"h": "Birden fazla okunan yazılışlar"}, {"p": "Vav dört ünlüyü (o, ö, u, ü), ye iki ünlüyü (ı, i) gösterdiği için bir yazılış birkaç kelimeye karşılık gelebilir. Hangisi olduğu cümlenin anlamından çıkarılır:"}, {"li": "قوش kuş / koş"}, {"li": "اولو ulu / ölü"}, {"li": "كور gör / kör"}, {"h": "Sınavda sık çıkanlar"}, {"li": "Kalın-ince ayrı harfi olan sesler: **k, t, s, z** (ve ğ)."}, {"li": "Ünlü yerine kullanılan harfler: ا و ى ه."}, {"li": "Kalın ünlülü kelimelerde kaf ve sad tercih edilir: آتقی atkı, قوراق kurak."}, {"li": "Kâf-ı nûnî = ڭ = genizsi ñ."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 2: Türkçe Ünlü ve Ünsüzlerin Yazılışı", "url": ""}]}, {"n": 3, "title": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "summary": "Türkçe kelimelerin kök ve eklerden kuruluşunu, ünlü ve ünsüz uyumlarını; dilek-şart, istek-emir, gereklilik kipleri ile -makta/-mekte ekinin yazılışını ve Osmanlı Türkçesinde çok kullanılan ön edatları, bağlama edatlarını ve ünlemleri anlatır.", "objectives": ["Türkçe kelimelerin yapısını başlıca özellikleriyle tanıyabilmek.", "Dilek-şart kipini tanıyıp yazabilmek.", "İstek ve emir kipini tanıyıp yazabilmek.", "Gereklilik kipini ve -makta/-mekte ekini tanıyıp yazabilmek.", "Osmanlı Türkçesindeki edatları ve ünlemleri tanıyabilmek."], "notes": [{"h": "Türkçe kelimelerin yapısı"}, {"p": "Kelime bir ya da birkaç heceden oluşan, tek başına anlamı olan ses topluluğudur. Heceler açık (ünlüyle biten) ve kapalı (ünsüzle biten) olarak ikiye ayrılır. Türkçe kelimeler bir **kök** ve ona eklenen **yapım** ve **çekim** eklerinden oluşur: göz (kök), göz-lük (yapım eki), göz-lük-ler (çekim eki)."}, {"li": "Yapım eki yeni kelime yapar: gözlük, işsiz, Türkçe."}, {"li": "Çekim eki kelimeyi cümleye bağlar: ev-de (bulunma hâli), gel-di."}, {"p": "Ünsüzlerle ilgili kurallar:"}, {"li": "Türkçe kelimeler ğ, l, m, n, ñ, r, z ile başlamaz ve iki ünsüzle başlamaz."}, {"li": "Tek heceli kelimelerin sonunda ikiz ünsüz bulunmaz."}, {"li": "Kelime sonunda b, c, d, g yerine p, ç, t, k bulunur."}, {"li": "Tonlu-tonsuz ünsüzler yan yana gelince benzeşir: ايتدى itti."}, {"h": "Dilek-şart kipi"}, {"p": "-sa/-se eki tek şekilli olarak **سه** ile yazılır, ünlü uyumuna göre okunur: كيرسه م girsem, اويوسه uyusa, سوسه لر sevseler. Olumsuzu için araya مه girer: كلمه سه كز gelmeseniz."}, {"h": "İstek ve emir kipi"}, {"p": "İstek ve emir kipleri zamanla birleşmiş, tek şekilli yazılır; hangisi olduğu anlamdan çıkarılır: كوره يم göreyim, اويويه لم uyuyalım, سويله söyle, كيرسينلر girsinler. Olumsuzu ما / مه ile yapılır."}, {"h": "Gereklilik kipi"}, {"p": "-malı/-meli eki **ملى** ile yazılır; bazı kalın ünlülü fiillerde **مالى** şeklinde de görülür: قوشمالى يم koşmalıyım, كچملى سك geçmelisin, ايچملى يز içmeliyiz. Olumsuzu için araya -ma/-me girer: باقماماليم bakmamalıyım."}, {"h": "Şimdiki zaman -makta/-mekte"}, {"p": "Fiil tabanına kalın ünlülülerde **مقده**, ince ünlülülerde **مكده** eklenir: چاليشمقده يز çalışmaktayız, بكلمكده يم beklemekteyim."}, {"h": "Ön edatlar"}, {"li": "**ez** از (-den): ازبر ez-ber (ezber), ez-cân u dil (candan, gönülden)"}, {"li": "**bâ** با (ile, -lı): باوقار bâ-vakâr (vakarlı)"}, {"li": "**be** به / ب (-e, ile): بنام be-nâm (ünlü), بدوش be-dûş (omuzda)"}, {"li": "**ber** بر (üzerine): بردار ber-dâr (asılmış), بركمال ber-kemâl (mükemmel), hâne ber-dûş (evsiz barksız)"}, {"li": "**der** در (-de, içinde): درحال der-hâl (hemen), دردست der-dest (elde, elde etme), درآغوش der-âgûş (kucakta, kucaklama), دركنار der-kenâr (kenarda)"}, {"li": "**berây-ı** براى (için), **tâ** تا (-e kadar): tâ-be-ebed (ebediyete kadar)"}, {"h": "Bağlama edatları"}, {"p": "ammâ, **fe-emmâ** فامّا (amma, lâkin), fakat, lâkin, **fi'l-hakîka** فى الحقيقه (gerçekte), **kezâ** كذا (aynı şekilde), **mâ-adâ** ماعدا (-den başka), **vâkı'a** واقعا (gerçi), **vaktâki** وقتاكى (ne vakit ki), **velev** ولو (-se bile), **gerekse** كركسه, **imdi** امدى (şimdi, öyleyse), hâlbuki, nitekim, **binâen alâ zâlik** (buna göre), **ale'l-husûs** (özellikle)."}, {"p": "Tekrarlı edatlar: hem...hem هم...هم, ne...ne, gerek...gerek, yâ...yâ, ister...ister."}, {"h": "Ünlemler"}, {"p": "ey, **yâ** يا (ey: Fuzûlîyâ), âh, âferîn, **ahsentü** (ne güzel), **hayf / hayfâ** (yazık), **dirîğ / dirîğâ** (ne yazık), **efsûs** (ne yazık, eyvah), heyhât, **zihî** (ne güzel, ne hoş), **zinhâr** (sakın, dikkat), **destûr** (çekil, yol ver), şâbâş (aferin)."}, {"h": "Sınavda sık çıkanlar"}, {"li": "Gereklilik: ملى · dilek-şart: سه · -makta: مقده / مكده."}, {"li": "\"kucaklama\" = der-âgûş; \"elde etme\" = der-dest; \"hemen\" = der-hâl."}, {"li": "Yâ bir ünlemdir, ön edat değildir."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 3: Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 3 Özet videosu", "url": "https://www.youtube.com/watch?v=RjVpM8DAUPI"}]}, {"n": 4, "title": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "summary": "Türkçe eklerin Arap harfleriyle kalıplaşmış yazılışlarını (çokluk, soru, yapım, zarf fiil, sıfat fiil, bildirme, hâl, iyelik ve zaman ekleri), şahıs ve işaret zamirlerinin çekimlerini, Osmanlı metinlerinde sık geçen zarfları ve rakamları anlatır.", "objectives": ["Türkçe çokluk, yapım, zarf fiil, sıfat fiil, bildirme, hâl, iyelik ve zaman eklerini tanıyıp yazabilmek.", "Türkçe zamirleri tanıyıp yazabilmek.", "Osmanlı Türkçesinde sık kullanılan zarfları tanıyabilmek.", "Türkçe sayıları ve rakamları tanıyıp yazabilmek."], "notes": [{"h": "Eklerin yazılışında ortak özellikler"}, {"li": "Eklerin çoğu **tek şekilli** ve kalıplaşmıştır: اولدى oldu."}, {"li": "Bazı ekler kalınlık-incelik uyumuna göre iki şekillidir: -lık لق / -lik لك."}, {"li": "Eklerin yardımcı ünlüleri yazılmaz: كتابلر kitaplar. Okunuş ise bugünkü söyleyişe göredir."}, {"h": "Başlıca ekler"}, {"li": "**Çokluk eki** -lar/-ler her zaman **لر** yazılır: كتابلر kitaplar, كوزلر gözler, آغاچلر ağaçlar. Araya elif konmaz."}, {"li": "**Soru eki** مى ayrı yazılır."}, {"li": "**İsim yapım ekleri**: -lık/-lik لق/لك, -cı/-ci جى / چى (ايشچى işçi), -sız/-siz سز, -ca/-ce جه."}, {"li": "**Zarf fiil ekleri**: **-ıp, -ip, -up, -üp tek şekilli** وب yazılır (آلوب alıp, كلوب gelip); -arak/-erek, -ınca/-ince, -dıkça, -madan, -alı/-eli, -(ı)ken كن."}, {"li": "**Sıfat fiil ekleri**: -an/-en ان, -dık/-dik, -acak/-ecek, -mış/-miş."}, {"li": "**Bildirme ekleri** isim cümlesinin yüklemini kurar: -dır/-dir در, -ım/-im م."}, {"h": "Hâl ekleri"}, {"li": "Yükleme -ı/-i: ى · Yönelme -a/-e: ه / يه · Bulunma -da/-de: **ده** (جنتده cennette) · Ayrılma -dan/-den: **دن** (اودن evden)"}, {"li": "İlgi -ın/-in: ڭ · Vasıta ile / -le: ايله, له (بزمله bizimle) · Eşitlik -ca/-ce: جه"}, {"h": "Zaman ekleri"}, {"li": "Görülen geçmiş -dı: دى (كلدى geldi) · Öğrenilen geçmiş -mış: مش · Geniş zaman -r: ر / ور / ير"}, {"li": "Şimdiki zaman -yor: يور · Gelecek zaman -acak/-ecek: **جق / جك** (كوره جكلر görecekler)"}, {"li": "i-mek: ايدى idi, ايمش imiş, ايسه ise"}, {"h": "Zamirler"}, {"p": "Şahıs zamirleri: بن ben, سن sen, او o, بز biz, سز siz, اونلر onlar. İşaret zamirleri: بو bu, شو şu. Bunlar hâl ekleriyle çekimlenir: بڭا bana, بزمله bizimle (vasıta hâli)."}, {"h": "Zarflar"}, {"li": "**fi'l-hâl** في الحال: hemen, o anda · **der-akab** در عقب: hemen ardından"}, {"li": "**berren** برّاً: kara yoluyla · **bahren**: deniz yoluyla"}, {"li": "**muhibbâne** محبانه: dostça · **babayâne** بابايانه: babacan, gösterişsiz"}, {"li": "**nice** نيجه: nasıl · **kanda** قنده: nerede · **ayruk** آيرق: başka"}, {"li": "**gey** كى, **iñen** ايڭن, **yavlak** ياولاق: çok, pek"}, {"li": "**binâen alâ zâlik** بناءً على ذالك: buna göre · **vâkı'a** واقعا: gerçi"}, {"li": "**dâimen** دائماً: daima · **ba'de** بعده: sonra · **bıldır/boldur**: geçen yıl · **bi'l-iltizâm**: bilerek"}, {"li": "**ne gûne** نه كونه: ne şekilde · **ne makûle** نه مقوله: ne türlü · **her kaçan** هر قاچان: ne zaman ki"}, {"h": "Sayılar"}, {"p": "Rakamlar Arap işaretleriyle yazılır ama yazının tersine **soldan sağa** okunur:"}, {"li": "٠ sıfır صفر · ١ bir بر · ٢ iki ايكى · ٣ üç اوچ · ٤ dört دورت · ٥ beş بش"}, {"li": "٦ altı آلتى · ٧ yedi يدى · ٨ sekiz سكز · ٩ dokuz دوقوز · ١٠ on اون"}, {"li": "٢٠ yirmi · ٣٠ otuz · ٤٠ kırk · ٥٠ elli · ٦٠ altmış · ٧٠ yetmiş · ٨٠ seksen · ٩٠ doksan · ١٠٠ yüz · ١٠٠٠ bin"}, {"h": "Sınavda sık çıkanlar"}, {"li": "Çokluk eki لر; -ıp ekinin tek şekilli yazılışı."}, {"li": "٤ dört, ٦ altı; ٥٠ elli, ٦٠ altmış, ٧٠ yetmiş, ٨٠ seksen."}, {"li": "\"hemen\" fi'l-hâl, \"kara yoluyla\" berren, \"dostça\" muhibbâne, \"nasıl\" nice, \"başka\" ayruk, \"buna göre\" binâen alâ zâlik."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 4: Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 4 Özet videosu", "url": "https://www.youtube.com/watch?v=0vFS6f94LFA"}]}, {"n": 5, "title": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "summary": "Arapça ve Farsça kelimelerdeki uzun ve kısa ünlüleri, bu dillere özgü ünsüzleri, Türkçede karşılığı olmayan sesleri (özellikle ayın ve hemze), Arapça ve Farsça kelimeleri tanıma yollarını ve hicrî ay adları, gün adları ile rakamları anlatır.", "objectives": ["Arapça ve Farsça kelimelerdeki ünlü ve ünsüzleri tanıyabilmek.", "Türkçede ses karşılığı olmayan harfleri ve Türkçede nasıl okunduklarını belirleyebilmek.", "Türkçedeki Arapça ve Farsça kelimeleri Türkçe kelimelerden ayırabilmek.", "Ay adlarını, haftanın günlerini ve rakamları tanıyabilmek."], "notes": [{"h": "Ünlüler"}, {"p": "Türkçenin sekiz ünlüsüne karşılık Arapça ve Farsçada ünlüleri gösteren dört harf (ا و ى ه) ve harekeler vardır. Bu dillerde ünlülerin **uzun** ve **kısa** hâlleri bulunur. Uzun ünlüler harfle yazılır, kısalar yazılmaz:"}, {"li": "**â** elif ile: والى vâlî"}, {"li": "**û** vav ile: بوسه bûse"}, {"li": "**î** ye ile: جميل cemîl"}, {"p": "Elif, vav ve ye aynı zamanda ünsüz olarak da kullanılır."}, {"h": "Arapçaya ve Farsçaya özgü harfler"}, {"li": "Arapçaya özgü: hemze ء, se ث, zel ذ, ha ح, sad ص, dad ض, tı ط, zı ظ, ayın ع."}, {"li": "Farsçaya özgü: pe پ, çe چ, je ژ, gef گ."}, {"h": "Türkçede karşılığı olmayan sesler"}, {"p": "Bu sesler Türkçedeki en yakın sesle okunur:"}, {"li": "ث peltek se → **s** · ح ha, خ hı, ه he → **h** · ذ zel → **z** · ض dad → **z** ya da **d** · ط tı → **t** · ظ zı → **z**"}, {"li": "**Ayın** ع bir boğaz sesidir; Türkçede çoğu zaman yazılmaz ya da kesme (') ile gösterilir: معلم mu'allim, عثمانلى Osmanlı."}, {"li": "**Hemze** ء kelime başında elifin üstüne/altına, içinde bir diş üzerine, sonunda tek başına yazılır: هيئت hey'et, جزء cüz'. Kelime sonundaki hemze Türkçede okunmaz."}, {"li": "Hı (خ) Türkçe kelimelerde pek bulunmaz; Farsça kelimelerde ve bazı Anadolu ağızlarında görülür (خان han gibi az sayıda Türkçe kelime de vardır)."}, {"h": "Arapça ve Farsça kelimeleri tanıma"}, {"li": "İçinde ث ح ص ض ط ظ ع harflerinden biri geçen kelime Arapçadır; içinde ya da sonunda hemze olan kelime de Arapçadır."}, {"li": "ژ bulunan kelime Farsçadır."}, {"li": "Türkçe kelimeler (birkaç istisna dışında) c, f, h, j, l, m, n, p, r, ş, z ile başlamaz."}, {"h": "Ay adları"}, {"p": "Osmanlılar hicrî-kamerî takvimi kullandı; başlangıcı Hz. Peygamber'in hicretidir. Belgelerde ay adları kısaltmayla yazılır:"}, {"li": "Muharrem محرم (م) · Safer صفر (ص) · Rebîülevvel ربيع الاول (را) · Rebîülâhir ربيع الآخر (ر)"}, {"li": "Cemâziyelevvel جمادى الاولى (جا) · Cemâziyelâhir جمادى الآخره (ج) · Receb رجب (ب) · Şa'bân شعبان (ش)"}, {"li": "Ramazân رمضان (ن) · Şevvâl شوال (ل) · Zilka'de ذى القعده (ذا) · Zilhicce ذى الحجه (ذ)"}, {"p": "Ayın ilk günü **gurre** غرّه, son günü **selh** سلخ; 1-10 arası **evâil** اوائل, 11-20 arası **evâsıt** اواسط, 21-30 arası **evâhir** اواخر."}, {"h": "Haftanın günleri"}, {"p": "پازار Pazar · پازارايرتسى Pazartesi · صالى Salı · چارشنبه Çarşamba · پنجشنبه Perşembe · جمعه Cuma · جمعه ايرتسى Cumartesi"}, {"h": "Sınavda sık çıkanlar"}, {"li": "Arap alfabesinde olmayan harf soruları: ژ (jîr, ژير)."}, {"li": "Türkçede kullanılmayan harf: ذ zel; Türkçede bulunmayan ama Farsçada ve ağızlarda geçen: خ hı."}, {"li": "Kelimenin doğru okunuşu: آمل âmil, ولايت vilâyet, صداقت sadâkat."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 5: Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 5 Özet videosu", "url": "https://www.youtube.com/watch?v=3HtOWWxmAD8"}]}, {"n": 6, "title": "Arapça Kelimelerin Yapısı", "summary": "Arapçanın bükünlü yapısını, kelimelerin kök (aslî) ve ek (zâid) harflerini, fa'l (ف ع ل) kalıbıyla vezin bulmayı, isimlerde müennes ve müzekkerliği ve tekil, ikil (tesniye) ve çoğul (cem') yapılarını anlatır.", "objectives": ["Osmanlı Türkçesindeki Arapça kelimelerin yapısını tanıyabilmek.", "Arapça kelimelerde vezni kavrayıp kelimelerin veznini çıkarabilmek.", "Arapça isimlerde müennes ve müzekker yapıyı tanıyabilmek.", "Tesniye ve cem' yapılarını tanıyıp sık kullanılan çokluk vezinlerini kullanabilmek."], "notes": [{"h": "Bükünlü bir dil"}, {"p": "Arapça bükünlü bir dildir: yeni kelimeler kökün başına, ortasına ve sonuna harf eklenerek ve harekeler değiştirilerek türetilir. Kelimeler üç gruptur: **fiil**, **isim** ve **harf** (edat). Fiillerin çekimli hâlleri Osmanlı Türkçesinde kullanılmaz."}, {"p": "İsimler ikiye ayrılır:"}, {"li": "**İsm-i câmid** (asıl isim): özel isimler, cins isimleri, sayılar."}, {"li": "**İsm-i müştak** (türemiş isim): masdar, ism-i fâil, ism-i mef'ûl, sıfat-ı müşebbehe, mübâlağa, ism-i tafdîl, ism-i zaman, ism-i mekân, ism-i âlet, ism-i tasgîr, ism-i mensûb."}, {"h": "Aslî ve zâid harfler"}, {"p": "Kelimenin kökünü oluşturan harfler **aslî**, sonradan eklenenler **zâid** harflerdir. Zâid harfler şunlardır: ء ا ت س ل م ن ه و ى (kolay ezber: \"sel'ütümûnîhâ\" سألتمونيها)."}, {"h": "Vezin bulmak"}, {"p": "Her kelime türünün bir kalıbı (vezni) vardır. Vezin, **ف ع ل** harfleriyle gösterilir: birinci aslî harf yerine **fe** ف, ikinci yerine **ayın** ع, üçüncü yerine **lam** ل yazılır; zâid harfler ve harekeler olduğu gibi aktarılır."}, {"li": "شكران şükrân: aslî harfler ş-k-r → **fu'lân** فعلان"}, {"li": "اكرام ikrâm: aslî harfler k-r-m → **if'âl** افعال"}, {"li": "كاتب kâtib → **fâ'il** فاعل · مكتوب mektûb → **mef'ûl** مفعول · مكتب mekteb → **mef'al** مفعل"}, {"li": "كرم kerem → **fa'al** فعل"}, {"h": "Müennes ve müzekker"}, {"p": "İsimler müzekker (eril) ya da müennes (dişil) olur. Müzekkerde işaret yoktur; müennes işaretleri:"}, {"li": "**Kapalı te** ة: Osmanlıcada ت ya da \"e/a\" okunan ه ile yazılır: فاضله fâzıla, جميله cemîle."}, {"li": "**Elif-i maksûre** ى (sonda ye yazılır, \"a\" okunur): كبرى kübrâ."}, {"li": "**Elif-i memdûde** اء (sondaki hemze Osmanlıcada gösterilmez): بيضا beyzâ, حمرا hamrâ."}, {"p": "İşareti olmadığı hâlde müennes sayılanlar: kadın isimleri, ülke ve şehir adları (مصر Mısır, شام Şam) **ma'nevî müennes**; arz, nâr, firdevs gibi kelimeler **semâî müennes**tir. Tamlamada sıfat isme uyar: vâlide-i muhtereme."}, {"h": "Sayı: tekil, ikil, çoğul"}, {"li": "**Müfred** tekil hâldir."}, {"li": "**Tesniye** (ikilik) -eyn / -ân ile yapılır; Osmanlıcada -eyn kullanılır: والدين vâlideyn, Haremeyn-i muhteremeyn."}, {"li": "**Cem'** (çokluk) üç ve daha fazlasıdır:"}, {"li": "**Cem'-i sâlim** eklerle yapılır. Müzekker: -în / -ûn (معلمين muallimîn); müennes: -ât (حيوانات hayvanât, عنايات inâyât)."}, {"li": "**Cem'-i mükesser** (kırık çokluk) kalıplarla yapılır ve semâîdir: ef'âl (افكار efkâr, احوال ahvâl), fu'ûl (علوم ulûm, عيون uyûn, بيوت büyût), fu'alâ (علما ulemâ, شعرا şuarâ), fu''âl (كفّار küffâr, حكّام hükkâm), mefâ'il (مساجد mesâcid), mefâ'îl (مكاتيب mekâtîb)."}, {"h": "Sınavda sık çıkanlar"}, {"li": "Vezin eşleştirmesi: şükrân = fu'lân, ikrâm = if'âl, kâtib = fâ'il."}, {"li": "Tesniye eki -eyn; müennes çokluk eki -ât; müzekker çokluk -în/-ûn."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 6: Arapça Kelimelerin Yapısı", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 6 Özet videosu", "url": "https://www.youtube.com/watch?v=f_sPl7P0Lpw"}]}, {"n": 7, "title": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "summary": "Arapça kelimelerin aslî harflerine göre yedi kısma (aksâm-ı seb'a) ayrılmasını, masdar türlerini, sülâsî mücerred, mimli ve mec'ûl masdarları ve bu masdarlardan ism-i fâil ve ism-i mef'ûl türetmeyi anlatır.", "objectives": ["Arapça kelimelerin yedi kısmını (aksâm-ı seb'a) tanıyabilmek.", "Masdar türlerini belirleyip mücerred, mimli ve mec'ûl masdarları tanıyabilmek.", "Mücerred sülâsî ve rubâî masdarların ism-i fâillerini çıkarabilmek.", "Mücerred sülâsî ve rubâî masdarların ism-i mef'ûllerini çıkarabilmek."], "notes": [{"h": "Aksâm-ı seb'a (kelimenin yedi kısmı)"}, {"p": "Arapça kelimeler aslî harflerinde illet harfi (و ى ا) bulunup bulunmamasına göre ayrılır. İllet harfi yoksa **sahih**, varsa **mu'tel** denir."}, {"p": "Sahih kelimeler:"}, {"li": "**Sâlim**: aslî harflerinde illet harfi, hemze ve tekrar eden harf yoktur: شعر şi'r."}, {"li": "**Mehmûz**: aslî harflerinde hemze vardır: ادب edeb."}, {"li": "**Muzâaf**: ikinci ve üçüncü aslî harfi aynıdır: قدّ kadd."}, {"p": "Mu'tel kelimeler:"}, {"li": "**Misâl**: birinci aslî harfi vav ya da ye: وقت vakt."}, {"li": "**Ecvef**: ikinci aslî harfi illetli: كون kevn."}, {"li": "**Nâkıs**: üçüncü aslî harfi illetli: نهى nehy."}, {"li": "**Lefîf**: iki aslî harfi illetli: وفا vefâ."}, {"h": "Masdarlar"}, {"p": "Masdar fiilden türeyen hareket ismidir; Türkçedeki -mak, -ma, -ış karşılığıdır. Dört türü vardır:"}, {"li": "**Mücerred** (yalın) masdarlar **semâîdir**, belli bir kurala göre türemez. Üç aslî harfli olanlara **sülâsî**, dört harflilere **rubâî**, beş harflilere **humâsî** denir."}, {"li": "**Mimli** masdarlar başta mim ile yapılır; dört kalıbı vardır: mef'al, mef'il, mef'ale, mef'ile (مغفرت mağfiret, مسئله mes'ele)."}, {"li": "**Mec'ûl** (yapma) masdarlar isim ve sıfatlara **-iyyet** eklenerek yapılır; Türkçedeki -lık karşılığıdır: مسئوليت mes'ûliyet, انسانيت insâniyet."}, {"li": "**Mezîdünfih** masdarlar mücerred masdarlara belli anlamlar katan kurallı kalıplardır (8. bölüm)."}, {"p": "Osmanlı Türkçesinde sık görülen sülâsî mücerred kalıplarından bazıları: fa'l (قتل katl), fi'l (علم ilm), fu'l (شكر şükr), fa'al (طلب taleb), fa'âlet (صداقت sadâkat), fi'âlet (عبادت ibâdet, عنايت inâyet, ولايت vilâyet), fu'ûl (دخول dühûl, خروج hurûc), fu'lân (شكران şükrân), fi'lân (عرفان irfân)."}, {"h": "İsm-i fâil"}, {"p": "Masdarın bildirdiği işi yapanı gösterir; Türkçedeki -an/-en sıfat fiili gibidir (koşan). Geçici bir durumu anlatır ve yalnızca etken fiillerden yapılır."}, {"li": "Sülâsî mücerredden **fâ'il** فاعل vezni: كاتب kâtib (yazan), عالم âlim (bilen), ناظر nâzır (bakan), حاكم hâkim."}, {"li": "Rubâî mücerredden **mufa'lil** مفعلل vezni: مترجم mütercim (tercüme eden)."}, {"h": "İsm-i mef'ûl"}, {"p": "Fiilin bildirdiği işe maruz kalanı gösterir (yazılmış, bilinen)."}, {"li": "Sülâsî mücerredden **mef'ûl** مفعول vezni: مكتوب mektûb (yazılmış), معلوم ma'lûm (bilinen), مظلوم mazlûm, محبوس mahbûs."}, {"li": "Rubâî mücerredden **mufa'lel** مفعلل vezni: مترجم mütercem (tercüme edilmiş)."}, {"h": "İ'lâl"}, {"p": "İllet harfi taşıyan kelimelerde vezne çevirirken bu harf değişebilir:"}, {"li": "Ecvef kelimelerin fâil vezninde ortadaki illet harfi hemzeye döner: ق و ل → قائل kâil (söyleyen); mef'ûlde düşer: مقول makûl."}, {"li": "Nâkıs kelimelerin fâilinde son harf ye olur: قاضى kâdî."}, {"h": "Sınavda sık çıkanlar"}, {"li": "Yedi kısım ve örnekleri: sâlim şi'r, mehmûz edeb, muzâaf kadd, misâl vakt, ecvef kevn, nâkıs nehy, lefîf vefâ."}, {"li": "Fâil = yapan (kâtib), mef'ûl = yapılan (mektûb)."}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 7: Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 7 Özet videosu", "url": "https://www.youtube.com/watch?v=tO8LLK5-AkI"}]}, {"n": 8, "title": "Mezîdünfih Masdarlar (I)", "summary": "Mücerred masdarlara geçişlilik, dönüşlülük, işteşlik gibi anlamlar katan mezîdünfih kalıplardan if'âl, tef'îl, tefa''ul, tefâ'ul ve müfâ'ale bâblarını, bu bâbların ism-i fâil ve ism-i mef'ûl vezinlerini ve i'lâlli örneklerini anlatır.", "objectives": ["If'âl bâbını, ism-i fâil ve ism-i mef'ûlünü tanıyabilmek.", "Tef'îl bâbını, ism-i fâil ve ism-i mef'ûlünü tanıyabilmek.", "Tefa''ul bâbını, ism-i fâil ve ism-i mef'ûlünü tanıyabilmek.", "Tefâ'ul bâbını, ism-i fâil ve ism-i mef'ûlünü tanıyabilmek.", "Müfâ'ale bâbını, ism-i fâil ve ism-i mef'ûlünü tanıyabilmek."], "notes": [{"h": "Mezîdünfih masdarlar"}, {"p": "Mücerred masdara harf eklenerek yapılan kurallı masdarlardır. Osmanlı Türkçesinde kullanılanlar: **if'âl, tef'îl, tefa''ul, tefâ'ul, müfâ'ale**, infi'âl, ifti'âl, if'ilâl, istif'âl. Her bâb kelimeye belli bir anlam katar; örneğin geçişsiz bir fiil geçişli bir bâba geçince geçişli olur. Bu bölümde ilk beşi işlenir."}, {"p": "Her bâbın ism-i fâili ve ism-i mef'ûlü **mu-** (mü-) ile başlar; fâilde sondan önceki hece esreli (i), mef'ûlde üstünlü (a/e) okunur."}, {"h": "If'âl (افعال): geçişli"}, {"li": "Örnek: خروج hurûc (çıkma) → اخراج ihrâc (çıkarma); اكرام ikrâm (ağırlama); اقناع iknâ' (ikna etme)."}, {"li": "İsm-i fâil **muf'il** مفعل: مخرج muhric (çıkaran), مكرم mükrim."}, {"li": "İsm-i mef'ûl **muf'al** مفعل: مخرج muhrac (çıkarılmış), مكرم mükrem."}, {"li": "İ'lâl: ecvefte اقامه ikâme → مقيم mukîm, مقام mukâm; misâlde ايجاد îcâd → موجد mûcid; nâkısta اخفا ihfâ → مخفى muhfî."}, {"h": "Tef'îl (تفعيل): geçişli, çokluk ve pekiştirme"}, {"li": "Örnek: تعليم ta'lîm (öğretme), تبديل tebdîl (değiştirme), تقديم takdîm (sunma)."}, {"li": "İsm-i fâil **mufa''il** مفعّل: معلّم muallim (öğreten)."}, {"li": "İsm-i mef'ûl **mufa''al** مفعّل: معلّم muallem (öğretilmiş)."}, {"li": "İ'lâl: sonu illetli ya da hemzeli köklerde **tef'ile** kalıbı kullanılır: تسميه tesmiye (adlandırma), تبرئه tebriye."}, {"h": "Tefa''ul (تفعّل): dönüşlü, geçişsiz, bazen yapmacıklık"}, {"li": "Örnek: تعلّم teallüm (öğrenme), تكبّر tekebbür (büyüklenme), تحمّل tahammül (katlanma)."}, {"li": "İsm-i fâil **mütefa''il** متفعّل: متكبّر mütekebbir, متعلّم müteallim."}, {"li": "İsm-i mef'ûl **mütefa''al** متفعّل: متحمّل mütehammel."}, {"li": "İ'lâl: sonu illetli köklerde son hece -î olur: تمنّى temennî → متمنّى mütemennî."}, {"h": "Tefâ'ul (تفاعل): işteş, dönüşlü, yapmacıklık"}, {"li": "Örnek: تعاون teâvün (yardımlaşma), تجاهل tecâhül (bilmezlikten gelme), تداول tedâvül (elden ele geçme)."}, {"li": "İsm-i fâil **mütefâ'il** متفاعل: متجاهل mütecâhil."}, {"li": "İsm-i mef'ûl **mütefâ'al** متفاعل: متداول mütedâvel."}, {"li": "İ'lâl: تداوى tedâvî → متداوى mütedâvî (tedavi eden); تباقى tebâkî → متباقى mütebâkî (geri kalan)."}, {"h": "Müfâ'ale (مفاعله): işteş, geçişli ya da geçişsiz"}, {"li": "Örnek: مجادله mücâdele, محاربه muhârebe (savaşma), مكالمه mükâleme (konuşma), مدافعه müdâfaa (savunma)."}, {"li": "İsm-i fâil **mufâ'il** مفاعل: مجاهد mücâhid, محارب muhârib, مدافع müdâfi'."}, {"li": "İsm-i mef'ûl **mufâ'al** مفاعل: مدافع müdâfa'."}, {"h": "Özet tablo"}, {"li": "if'âl → muf'il / muf'al · geçişli"}, {"li": "tef'îl → mufa''il / mufa''al · geçişli"}, {"li": "tefa''ul → mütefa''il / mütefa''al · dönüşlü, geçişsiz"}, {"li": "tefâ'ul → mütefâ'il / mütefâ'al · işteş, dönüşlü"}, {"li": "müfâ'ale → mufâ'il / mufâ'al · işteş"}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 8: Mezîdünfih Masdarlar (I)", "url": ""}, {"title": "AÖF Osmanlı Türkçesi I, Ünite 8 Özet videosu", "url": "https://www.youtube.com/watch?v=R-mD_GaXGeM"}]}], "cards": [{"front": "Cezm (sükûn) işaretinin işlevi nedir ve kelime sonundaki ünsüzlerde nasıl uygulanır?", "back": "Cezm işareti harfin üstüne konularak o harfin sakin/ünsüz olarak okunmasını sağlar. Türkçe kelimelerde kapalı heceleri kapatan ünsüzlerin telaffuzu için kullanılır. Ayrıca Osmanlı Türkçesi alfabesinde kelime sonundaki ünsüzler kural olarak sakin (cezm) okunmaktadır.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:1"}, {"front": "Med işareti hangi harf üzerinde kullanılır ve işlevi nedir?", "back": "Med işareti elif harfinin üstüne konarak kelimeye uzun â sesi kazandırır. Arapça kökenli kelimelerin yanı sıra ilk sesi 'a' olan Türkçe kelimelerde de kullanılmıştır. Ders kitabında ve özet ses kaydında bu duruma 'aş', 'al' ve 'at' gibi Türkçe kelimeler örnek gösterilmiştir.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:2"}, {"front": "Metinlerde hareke kullanma ihtiyacı nasıl ortaya çıkmıştır ve Osmanlı Türkçesindeki tarihsel gelişimi nasıldır?", "back": "Arapça kelimelerde kısa ünlüler harfle yazılmadığından doğru okumayı sağlamak için hareke işaretleri geliştirilmiştir. Kur'an-ı Kerim'in Arap olmayanlarca yanlış okunmasını önlemek amacıyla başlayan bu uygulama, Türkler tarafından da 16. yüzyılın sonlarına kadar kullanılmıştır. Zamanla imla oturdukça hareke kullanımı azaltılmış, Kur'an-ı Kerim ve sözlük gibi hassas eserler dışında kaldırılmıştır.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:3"}, {"front": "Osmanlı Türkçesi alfabesi kaç harflidir ve Arap alfabesine hangi ilave harfler eklenmiştir?", "back": "Osmanlı Türkçesi alfabesinin temeli 28 harfli Arap alfabesine dayanmaktadır. Farsçadan pe (پ), çe (چ) ve je (ژ) harfleri alfabeye eklenmiştir. Ayrıca Türkçeye mahsus nazal ñ (kâf-ı nûnî) için (ڭ), ince sesli kelimelerdeki yumuşak g için kâf-ı fârisî (گ) ve lam-elif (ال) harfleri dahil edilmiştir.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:4"}, {"front": "Osmanlı Türkçesi dönemi hangi tarihleri ve coğrafyayı kapsar, kaç döneme ayrılır?", "back": "AÖF ders kitabına ve özet ses kaydına göre Osmanlı Türkçesi, Oğuz Türklerinin 13. yüzyıldan 20. yüzyılın başlarına kadar Anadolu'da geliştirdikleri Batı Türkçesi yazı dilidir. Batı Türkçesinin ilk dönemine Eski Osmanlıca, Eski Türkiye Türkçesi veya Eski Anadolu Türkçesi adı verilmektedir. Bu ilk dönem Anadolu Selçukluları, Beylikler Çağı ve Osmanlı Devleti'nin İstanbul'un fethine kadar olan süresini kapsar.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:5"}, {"front": "Osmanlı Türkçesinde kendisinden sonraki harfle bitişmeyen harfler hangileridir?", "back": "Osmanlı alfabesinde sağdan sola yazımda harflerin çoğu iki tarafa birleşirken bazı harfler kendinden sonrakiyle birleşmez. Bu bitişmeyen harfler elif (ا), dal (د), zel (ذ), rı (ر), ze (ز), je (ژ) ve vav (و) harfleridir. Ayrıca kelime sonunda ünlü yerine kullanılan güzel he (ه) harfi de (hâ-i resmiye) kendinden sonrakiyle bitişmez.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:6"}, {"front": "Osmanlı alfabesindeki farklı hat stilleri ve yazma eser varyasyonları kaynaklarda yer almakta mıdır?", "back": "Ders kitabı ve özet ses kaydı matbu metinlerde şeddenin çoğu zaman kullanılmadığını belirtmekle birlikte hat türlerine (rik'a, sülüs vb.) dair ayrıntılı bilgi vermemektedir. Kaynaklarda yalnızca matbu imla ve temel hareke kaideleri işlenmiş, farklı kaligrafi stilleri kapsanmamıştır. Dolayısıyla kaynakların kapsamadığı ileri hat türleri hakkında tahmin yürütülemez.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:7"}, {"front": "Tenvin işareti nedir ve çeşitlerinin okunuş kuralları nelerdir?", "back": "Tenvin; üstün, esre ve ötre işaretlerinin kelimenin son harfinde çift yazılmasıdır. Üstünlü tenvin kelime sonunu /an/en/ okutur ve genellikle tenvin elifi ile yazılır. Esreli tenvin /ın/in/, ötreli tenvin ise /un/ün/ seslerini okutur.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:8"}, {"front": "Üstün, esre ve ötre harekelerinin Arapça adları nedir ve hangi sesleri okuturlar?", "back": "Üstün işaretinin Arapça adı fetha olup harfin üstüne konur ve /a/e/ seslerini okutur. Esre işaretinin Arapça adı kesre olup harfin altına konur ve /ı/i/ seslerini verir. Ötre işaretinin Arapça adı damme olup harfin üstüne konur ve /o/ö/u/ü/ seslerini okutur.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:9"}, {"front": "Şedde işareti Türkçe ve Arapça kelimelerin yazımında nasıl uygulanır?", "back": "Şedde işareti Arapça kelimelerde yan yana gelen aynı ünsüzü iki defa okutmak için üzerine konur. Türkçe kelimelerde şedde kullanımı genel olarak tercih edilmeyip ünsüz harf iki kez yan yana yazılmıştır. Ayrıca matbu metinlerde şedde çoğu zaman gösterilmez; ancak kelime ünlüyle başlayan ek aldığında ikiz okunur.", "ch": 1, "chTitle": "Osmanlı Türkçesi Alfabesi", "id": "osmanlica-1:10"}, {"front": "Arap harfli Osmanlı alfabesinde Türkçe ünsüzlerin gösterilmesinde bir eksiklik var mıdır ve Arapçadaki kalın-ince ünsüz ayrımı Türkçe kelimelere nasıl yansır?", "back": "AÖF Osmanlı Türkçesi I ders kitabının 2. ünitesine göre Türkçe ünsüzleri göstermede ciddi bir eksiklik bulunmayıp her ünsüzün bir harf karşılığı vardır. Türkçedeki ünsüzlerde kalınlık ve incelik ayrımı yokken Arapçada k, t, z, s, ğ seslerinin ince ve kalın şekilleri ayrı harflerle gösterilmektedir. Türkçe kelimelerin imlasında genel olarak bu harflerin ince halleri tercih edilir, ancak hecenin kalın ünlüsünü vurgulamak amacıyla az da olsa kalın şekiller de kullanılır.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:11"}, {"front": "Genizsi n (sağır kef / kâf-ı nûnî) nedir, Osmanlı imlasında hangi harfle gösterilmiştir ve tarihsel gelişimi nasıl olmuştur?", "back": "Genizsi n, küçük dilin geniz yolunu açmasıyla havanın burundan salınarak çıkarıldığı n sesidir ve Osmanlı Türkçesinde sağır kef (kâf-ı nûnî) denilen kef (ك / ڭ) harfiyle gösterilmiştir. Konuşma dilinde Osmanlı döneminden itibaren diş sesi olan normal n'ye dönüşmüş, günümüzde Türkiye Türkçesinde yerini tamamen 'n'ye bırakmıştır. Dönem metinlerinde kimi zaman normal nun (ن) harfiyle yazıldığı da görülmüş olup günümüzde yalnızca bazı yöre ağızlarında varlığını sürdürmektedir.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:12"}, {"front": "Kelime başındaki 's' ve 't' ünsüzlerinin yazılışında harf seçimi neye göre belirlenir?", "back": "Ders kitabının 2. ünitesinde belirtildiğine göre Türkçe kelimelerin başındaki 's' ve 't' ünsüzleri kendilerinden sonra gelen ünlünün niteliğine göre belirlenir. Eğer sonra gelen ünlü kalınsa kalın harfler olan sad (ص) ve tı (ط), ince ise ince harfler olan sin (س) ve te (ت) kullanılır. Kelime içindeki 's' ve 't' harfleri ise genellikle ince şekiller olan sin ve te ile gösterilmektedir.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:13"}, {"front": "Osmanlı Türkçesi alfabesinde yer alıp Türkçe kelimelerin imlasında kullanılmayan Arapça ve Farsça ünsüzler hangileridir?", "back": "Alfabede bulunmasına rağmen Türkçe kelimelerde kullanılmayan harfler peltek se (ث), ha (ح), hı (خ), zel (ذ), ze (ز), je (ژ), sad (ص), dad (ض), tı (ط), zı (ظ), ayın (ع) ve gayın (غ) harfleridir. Bunlardan peltek se, ha, zel, dad ve ayın yalnızca Arapça veya kimi Farsça kelimelerde yer alır; je harfi ise Farsçadan geçmiştir. İstisna olarak sad, tı, zı ve gayın gibi bazı kalın harfler Türkçe kelimelerin kalın sırasını göstermek için kullanılmıştır.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:14"}, {"front": "Türkçe kelimelerde 'a' ünlüsü kelime başında, içinde ve sonunda hangi harflerle yazılır?", "back": "Ders kitabına göre 'a' ünlüsü kelime başında kural olarak medli elif (آ) ile gösterilir. Kelime içinde sadece elif (ا) harfiyle yazılırken, iki hecesinde de 'a' sesi bulunan kelimelerin ilk hecesinde elif yazılmayabilir. Kelime sonunda ise elif harfiyle veya kimi kelime ve eklerin sonunda güzel he (ه) ile gösterilir.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:15"}, {"front": "Türkçe kelimelerde 'e' ünlüsünün kelime başı, içi ve sonundaki imla kuralları nelerdir ve alfabedeki yenilik arayışlarının akıbeti ne olmuştur?", "back": "'e' ünlüsü kelime başında elif (ا) ile, kelime sonunda güzel he (ه) ile gösterilirken kelime içinde kural olarak yazılmaz. 19. yüzyılın sonlarındaki alfabe yenilik çalışmaları çerçevesinde kelime ortasındaki 'e' sesini de güzel he (ه) ile gösterme temayülü ortaya çıkmış ancak bu uygulama tutulmamıştır. Dolayısıyla klasik imlada kelime içinde 'e' ünlüsünün harfle gösterilmeme esası korunmuştur.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:16"}, {"front": "Türkçe kelimelerdeki 'ı' ve 'i' ünlüleri Osmanlı alfabesinde nasıl gösterilir ve bu ünlülerin kelime içi yazımında istisnalar var mıdır?", "back": "'ı' ve 'i' ünlüleri kelime başında elif ve ye (ای) birleşimiyle, kelime içinde ve sonunda ise ye (ى) okutucu harfiyle gösterilir. Ye harfi kelime içinde ve sonunda kendi özel birleşik şekilleriyle yazılır. 'Şimdi' (مجدى), 'bir' (بر) ve 'ıslak' (اصلاق) gibi kelimelerde görüldüğü üzere bu ünlülerin başta, ortada veya sonda gösterilmediği farklı yazım uygulamaları da bulunmaktadır.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:17"}, {"front": "Türkçede bulunan kalın ve ince 'l' ünsüzleri Osmanlı Türkçesi alfabesinde farklı harflerle gösterilir mi?", "back": "Ders kitabındaki bilgilere göre Türkçede kelime örneğine bağlı olarak kalın (çukur) ve ince (düz) olmak üzere iki ayrı 'le' (l) sesi bulunmaktadır. 'Kalmak' kelimesindeki 'l' kalın, 'dilmek' kelimesindeki 'l' ise incedir. Ancak Arap harfli Osmanlı alfabesinde bu iki farklı ses için ayrı işaretler veya harfler bulunmayıp her ikisi için de tek lam (ل) harfi kullanılmıştır.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:18"}, {"front": "Türkçedeki 'o, ö, u, ü' yuvarlak ünlüleri Osmanlı alfabesinde nasıl yazılır ve okunuşta ortaya çıkan karmaşa nasıl çözülür?", "back": "Dört yuvarlak ünlü kelime başında elif ve vav (او), kelime içinde ve sonunda ise vav (و) okutucu harfiyle gösterilir. Tek bir vav harfinin dört ayrı sesle (o, ö, u, ü) okunabilmesi okumada karışıklık yaratsa da kelimedeki kaf (ق), kef (ك), tı (ط), te (ت) gibi kalın-ince ünsüz harfler ile metnin genel anlamı rehberlik eder. Kelime başındaki yuvarlak ince ünlüyü (ö, ü) kalınından (o, u) ayırmak için ise bazen elif yerine hemzeli elif kullanılır.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:19"}, {"front": "Türkçedeki sekiz ünlüye karşılık Osmanlı alfabesinde hangi okutucu harfler kullanılır ve bunların işlevleri nelerdir?", "back": "Arapçada üç kısa ünlü harekelerle gösterilirken Türkçe kelimelerdeki 8 ünlüyü yazıda göstermek için elif (ا), he (ه), vav (و) ve ye (ى) okutucu harflerinden yararlanılır. Bunlardan elif (ا) ve he (ه) a ve e ünlülerini, ye (ى) ı ve i ünlülerini, vav (و) ise o, ö, u, ü ünlülerini karşılamada kullanılır. Dört ayrı yuvarlak ünlünün tek bir vav harfiyle gösterilmesi nedeniyle alfabenin Türkçe ünlüleri karşılamada yetersiz kaldığı ifade edilmektedir.", "ch": 2, "chTitle": "Türkçe Ünlü ve Ünsüzlerin Yazılışı", "id": "osmanlica-1:20"}, {"front": "Gereklilik kipi (-malı/-meli) eki Arap harfleriyle nasıl yazılır, eklerin birleşme kuralı nedir?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre gereklilik kipi eki temel olarak 'mali' (ملى) şeklinde yazılmakla birlikte bazı kalın fiillerde (مالى), ince fiillerde ise (مه‌لى) şeklinde de yazılabilir. Bu ek fiil tabanına birleşik yazılır; ancak kendisinden sonra gelen şahıs ekleriyle (3. çoğul şahıs hariç) birleşmez. Olumsuzu ise fiil tabanı ile gereklilik eki arasına ma/me (ما / مه) getirilerek sağlanır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:21"}, {"front": "Osmanlı Türkçesinde dilek-şart kipi (-sa/-se) eki nasıl yazılır ve şahıs çekimlerindeki imla özellikleri nelerdir?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre dilek-şart kipi eki -sa/-se, Osmanlı imlasında sin ve güzel he ile 'se' (سه) şeklinde tek biçimli yazılır ve ses uyumuna göre okunur. İnce ünlülü fiillerde 2. teklik (girsen) ve 2. çokluk (girseniz) şahıs yazılışları aynıyken, olumsuz çekimi ince ünlülü fiillerde güzel he (مه), kalın ünlülü fiillerde elif (ما) ile yapılır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:22"}, {"front": "Osmanlı Türkçesinde kullanılan Farsça ve Arapça kökenli ön edatlar (ez, ba, be, ber, der, berây-ı, tâ) ne anlama gelir ve nasıl yazılır?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre ez (از) -dan/-den, ba (با) ile/-lı/-li, be (ب/به) -a/-e/ile, ber (بر) üzerine/üzerinde, der (در) -da/-de/içinde, berây-ı (براى) için, tâ (تا) kadar/değin anlamı katar. Örnek olarak ez-cân u dil (candan ve gönülden), bâ-vekâr (vakar sahibi), ber-kemâl (mükemmel), der-hâl (hemen) ve tâ-be-ebed (sonsuza kadar) yazımları gösterilebilir.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:23"}, {"front": "Osmanlı Türkçesindeki tekil ve tekrarlı bağlama edatları nelerdir?", "back": "AÖF ders kitabının 3. ünitesine göre tekli bağlama edatları arasında ancak (اجنق), gayrı (غريى), çün (چون), eger (اكر), ile (ايله), imdi (امدى), vaktâki (وقتاكى), fe'emmâ (فاما), mamafih (مع ما فيه) ve belki (بلكى) bulunur. İkili ya da tekrarlı bağlaçlar ise cümle içinde hem...hem (هم...هم), ne...ne (نه...نه), gerek...gerekse (كرك...كركسه), ha...ha (ها...ها) ve ister...ister (ايسرت...ايسرت) şeklinde iki kez tekrarlanarak kullanılır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:24"}, {"front": "Osmanlı Türkçesindeki ünlemlerin (nida edatları) başlıca çeşitleri ve örnekleri nelerdir, şair isimlerine eklenen nida ekleri hakkında kaynaklar bilgi vermekte midir?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre ah (آه), efsûs (افسوس), ey (ای), yâ (يا), zihî (زهى), diriğâ (دريغا) ve destûr (دستور) gibi kelimeler duygu ve seslenme bildiren ünlemlerdir. Ayrıca 3. ünite özet ses kaydı, şair adlarının sonuna eklenen 'a' veya 'ya' seslerinin (Fuzûlî-yâ, Nedîm-â) ey anlamına gelen nida eki olduğunu açıklar. Ders kitabı bu ekleri nida başlığı altında genel ünlemlerle örneklendirirken, detaylı şair örneklerini özet ses kaydı tamamlar.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:25"}, {"front": "Türkçe kelimelerde büyük ve küçük ünlü uyumu kuralları Osmanlı imlasında nasıl işler?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre Türkçe kelime kök ve eklerinde kalınlık-incelik (büyük ünlü uyumu) ile düzlük-yuvarlaklık (küçük ünlü uyumu) esas alınır. Kelimenin ilk hecesindeki ünlüye göre sonraki hecelerin ünlüleri kalın veya ince, düz veya yuvarlak benzeşmeye uyar. XVII. yüzyıl ve sonrasında kullanılan '-yor' şimdiki zaman eki ile birleşik kelimeler dışında ilk heceden sonraki hecelerde geniş yuvarlak (o, ö) ünlüler bulunmaz.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:26"}, {"front": "Türkçe kelimelerin başında ve sonunda hangi ünsüzlerin yer almayacağı veya değişeceği kurala bağlanmıştır?", "back": "AÖF ders kitabının 3. ünitesine göre Türkçe kelimeler ğ, l, m, n, ñ, r, z ünsüzleriyle, iki ünsüzle ve sonradan giren c, f, j sesleriyle başlamaz. Tek heceli kelimelerin sonunda düzensiz çift ünsüz ve ikiz ünsüz yer almazken, kelime sonunda tonlu b, c, d, g yerine tonsuz p, ç, t, k sesleri bulunur. Ayrıca tonlu-tonsuz ünsüz eşleşmelerinde benzeşme işleyerek ünsüz uyumu sağlanır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:27"}, {"front": "Türkçe kelimelerin ses (lafz) ve mana boyutu nedir, hece tipleri açık ve kapalı hece olarak Osmanlı alfabesinde nasıl sınıflandırılır?", "back": "AÖF ders kitabının 3. ünitesine göre kelime, lafz denilen ses birleşimi ile belli bir kavramı yansıtan anlam yönünün bir araya gelmesiyle oluşan dil ögesidir. Türkçede heceler açık (ünlüyle biten) ve kapalı (ünsüzle biten) olmak üzere iki grupta incelenir. Kelimelerin hece yapısında tek ünlü, ünsüz-ünlü, ünlü-ünsüz, ünsüz-ünlü-ünsüz, ünlü-ünsüz-ünsüz ve ünsüz-ünlü-ünsüz-ünsüz tipleri yer alır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:28"}, {"front": "İstek ve emir kipleri Osmanlı Türkçesinde nasıl yazılır ve zaman içindeki değişimi nasıl açıklanır?", "back": "AÖF ders kitabının 3. ünitesine göre istek ve emir kipleri tarihi süreçte ayrı eklerle yazılmış olsa da yakın dönemde birleşerek tek şekil haline gelmiştir; hangisinin kastedildiği cümledeki anlamdan çıkarılır. Birinci şahıs istek ekleri (-a, -e) yazıda kullanılmazken, 3. şahıstaki -sın, -sin, -sun, -sün ekleri önceleri daima yuvarlak ünlülü (سون) yazılmış, ünlü uyumunun yerleşmesiyle (سني) biçimini almıştır. Emir ve istek kiplerinin olumsuzu ise fiil tabanına getirilen ma (ما) ve me (مه) ekleriyle yapılır.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:29"}, {"front": "Şimdiki zaman -makta/-mekte ekleri fiil tabanlarına nasıl ilave edilir ve ünsüz sertleşmesi gösterir mi?", "back": "AÖF ders kitabının 3. ünitesi ve özet ses kaydına göre -makta eki 'makda' (مقده), -mekte eki ise 'mekde' (مكده) şeklinde fiil tabanına eklenerek yazılır. İmlada kalıplaşma esas olduğu için konuşmadaki d/t sertleşmesi yazıda gösterilmez ve dal (د) harfi korunur. Örneğin 'çalışmaktayım' veya 'üşümekteyim' çekimlerinde dal harfi aynen muhafaza edilmiştir.", "ch": 3, "chTitle": "Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "id": "osmanlica-1:30"}, {"front": "Geniş zaman ve görülen geçmiş zaman eklerinin olumsuz çekimlerinde hangi imla kuralları uygulanır?", "back": "Ders kitabının 4. ünitesi ve özet ses kaydına göre görülen geçmiş zamanın olumsuzu fiil gövdesine ma (ما) veya me (مه) ekleri getirilerek yapılır. Geniş zamanın olumsuzu ise genel olarak -maz/-mez (maz ماز / mez مز) şeklinde yazılmakla birlikte 1. teklik ve 1. çokluk şahıslarda ek biçim değiştirir. Örneğin 1. teklikte 'gelmem' (كلمم), 1. çoğulda 'duymayız' (دومیايز) şeklinde çekimlenir.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:31"}, {"front": "Hal eklerinden yaklaşma (yönelme), bulunma ve ayrılma eklerinin imla kalıpları nelerdir?", "back": "Ders kitabının 4. ünitesine göre yaklaşma hal eki elif-he veya güzel he (اه / ه), bulunma hal eki dal-he (ده), ayrılma hal eki ise dal-nun (دن) biçiminde yazılır. Bulunma ve ayrılma ekleri ünsüz sertleşmesine uğrasa bile imlada kalıplaşmış olan dal (د) harfi korunur. Bu eklerin imlasında ünsüz değişimi gösterilmez.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:32"}, {"front": "Osmanlı Türkçesinde Türkçe eklerin yazılışındaki temel ortak özellikler ve yardımcı ünlülerin imlası nasıldır?", "back": "AÖF Osmanlı Türkçesi I ders kitabının 4. ünitesine göre Türkçe ekler dönem metinlerinde genellikle kalıplaşmış tek biçimli imlalarla yazılır. Seri ve pratik yazımı sağlamak amacıyla eklerdeki yardımcı ünlüler çoğunlukla yazılmaz. Buna karşın eklerin okunuşu bugünkü söyleyişe ve ünlü uyumlarına göre gerçekleştirilir.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:33"}, {"front": "Osmanlı Türkçesinde isim cümlelerinin yüklemini oluşturan bildirme eklerinin yazılış özellikleri ve şahıslara göre dağılımı nasıldır?", "back": "AÖF ders kitabının 4. ünitesine göre bildirme eklerinde eklerin yardımcı ünlüleri harfle gösterilmez. Birinci şahıslarda mim (م / يم), ikinci şahıslarda sin-kef (سک), üçüncü şahıslarda dal-rı (در) ve çokluk şahıslarda z / zed (ز / سکز / درلر) ekleri kullanılır. Kelime ünlüyle bittiğinde 1. teklik şahısta araya kaynaştırma 'y' harfi eklenerek yazılır.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:34"}, {"front": "Osmanlı Türkçesinde zarfların cümledeki işlevi nedir ve tarihi metinlerde karşılaşılan bazı zarf örnekleri nelerdir?", "back": "Ders kitabının 4. ünitesi ve özet ses kaydına göre zarflar sıfat ve fiilleri zaman, yer, miktar ve hal bakımlarından niteleyerek onlara bağımlı olarak bulunurlar. Osmanlı metinlerinde Türkçe kökenli zarfların yanı sıra Farsça ve Arapça kökenli zarflar da sıkça yer alır. Örnek olarak sonra (صوکره), kanda (قنده), iñen (ايكن), ale'l-husûs (علی اخلصوص) ve der-akab (در عقب) kelimeleri verilebilir.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:35"}, {"front": "Türkçe sayı isimleri ile rakamların Osmanlı Türkçesindeki yazılış kuralları ve yön özellikleri nelerdir?", "back": "AÖF ders kitabının 4. ünitesi ile 5. ünite açıklayıcı notlarına göre sayı isimleri Türkçe kelimelerle (bir, iki, üç, yirmi ikrmi يكرمی vb.) yazılır. Rakam simgeleri ise Arap alfabesinde kullanılan işaretlerle gösterilir ve metinlerin aksine soldan sağa doğru yazılır. Öte yandan üleştirmeli sayılar ile sıra sayılarının tüm tarihsel varyasyonları ve roman rakamları kaynaklarda yer almamakta olup kapsanmayan durumlar hakkında tahminde bulunulamaz.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:36"}, {"front": "Türkçe şahıs zamirlerinin imla kalıpları ve yönelme hali çekimlerinde görülen özel ses/harf durumu nedir?", "back": "Ders kitabının 4. ünitesine ve özet ses kaydına göre şahıs zamirleri ben (بن), sen (سن), o (او), biz (بز), siz (سز) ve onlar (اونلر) şeklinde yazılır. Şahıs zamirlerinin yönelme hallerinde (bana بكا, sana سكا, ona اوكا) ve ilgi hallerinde (senin سنك, onun اونك) damaksı n / sağır kef (ك) harfi kullanılır. Bu durum eski Türkçe döneminden gelen kalıplaşmış bir imla özelliğidir.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:37"}, {"front": "Zarf fiil eklerinden -ıp/-ip/-up/-üp ve -iken/-ken ekleri Arap harfleriyle nasıl yazılır?", "back": "Ders kitabının 4. ünitesi ve özet ses kaydına göre -ıp/-ip/-up/-üp eki vav ve pe/be (وپ) şeklinde kalıplaşmış yuvarlak imlayla yazılır, ünlüyle biten fiillerde araya yardımcı y harfi girer. -iken/-ken eki ise 'iken' (ايکن) veya 'ken' (کن) şeklinde iki türlü yazılabilmektedir. Bu eki taşıyan kelimelerde ünlü uyumu aranmaz.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:38"}, {"front": "Çokluk eki (-lar/-ler) ve soru eki (-mı/-mi/-mu/-mü) Osmanlı imlasında nasıl gösterilir?", "back": "Ders kitabının 4. ünitesine ve özet ses kaydına göre çokluk eki -lar/-ler tek şekilli olarak lam ve rı (لر) harfleriyle yazılır ve ünlüsü gösterilmez. Soru eki -mı/-mi/-mu/-mü ise kelimelere birleşik olarak yalnızca mim ve ye (می) biçiminde kalıplaşmış şekilde kaleme alınır. Her iki ek de kelimenin kalınlık-incelik durumuna uygun olarak okunur.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:39"}, {"front": "İsim yapım eklerinden -lık/-lik/-luk/-lük ve -sız/-siz/-suz/-süz eklerinin yazılış kuralları nelerdir?", "back": "AÖF ders kitabının 4. ünitesine göre -lık/-lik eki kalın ünlülü kelimelerde lam-kaf (لق), ince ünlülü kelimelerde ise lam-kef (لك) şeklinde iki biçimli yazılır. -sız/-siz/-suz/-süz eki ise tek şekilli olarak sin-ze (سز) biçiminde yazılır ve ekin ünlüsü harfle gösterilmez. Bu ekler sıfat ve isim yapımında yaygın olarak kullanılır.", "ch": 4, "chTitle": "Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "id": "osmanlica-1:40"}, {"front": "Arapça kökenli kelimelerde hemze (ء) harfi kelime başında, içinde ve sonunda nasıl yazılır?", "back": "AÖF ders kitabının 5. ünitesine göre hemze harfi kelime başında elif harfinin üstünde veya altında yer alsa da metinlerde çoğunlukla yazılmasına gerek görülmez. Kelime içinde bir diş üzerine (rü'yâ, mes'ele), kelime sonunda ise tek başına (şey', cüz') yazılır. Kelime sonundaki hemzeler Türkçede okunmaz, günümüz basımında gösterilmezken ilmî transkripsiyonda kesme işaretiyle yansıtılır.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:41"}, {"front": "Arapça ve Farsça kelimelerdeki uzun ünlüler (â, û, î) Osmanlı alfabesinde hangi harflerle gösterilir?", "back": "AÖF ders kitabının 5. ünitesi ve 5. ünite özet videosuna göre Arapça ve Farsçadaki uzun ünlüler harflerle gösterilir. Uzun 'â' ünlüsü elif (ا) harfiyle, uzun 'û' ünlüsü vav (و) harfiyle, uzun 'î' ünlüsü ise ye (ى) harfiyle yazılır. Kısa ünlüler ise harfle yazılmayıp gerektiğinde hareke işaretleriyle gösterilir.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:42"}, {"front": "Arapça ve Farsça sayı isimleri ile sıra sayıları Osmanlı Türkçesinde nasıl sınıflandırılır?", "back": "AÖF ders kitabının 5. ünitesindeki Tablo 5.3'e ve özet videoya göre Arapça sayılar vâhid (1), isneyn (2), selâse (3) şeklinde giderken Farsça sayılar yek (1), dü (2), se (3) olarak sıralanır. Arapça sıra sayıları ise hâdî (birinci), sânî (ikinci), sâlis (üçüncü), râbi' (dördüncü) biçiminde türetilir. Ayrıca 20 kelimesinin 'yirmi' (يكرمی) ve 100 kelimesinin 'mi'e' (مائه) olarak özel imlaları bulunmaktadır.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:43"}, {"front": "Arapçaya özgü olan ve Türkçede ses karşılığı bulunmayan ayın (ع) harfi kelime başında, ortasında ve hece sonunda nasıl okunur ve telaffuz edilir?", "back": "AÖF ders kitabının 5. ünitesi ve 5. ünite özet videosuna göre ayın boğaz ünsüzü olup Türk konuşma dilinde yer almaz. Kelime ve hece başında ünlü bir ses olarak okunurken (ilm, ömr), hece sonunda düşerek kendinden önceki ünlüye uzun ses değeri kazandırır (Kâbe, rânâ). Latin harfli transkripsiyonda ise hemzeden ayırt edilmek için kuyruğu sağa bakan kesme işaretiyle gösterilir.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:44"}, {"front": "Bir kelimenin Arapça veya Farsça kökenli olduğunu belirleyen temel harf ve yapı özellikleri nelerdir?", "back": "AÖF ders kitabının 5. ünitesi ve 5. ünite özet videosuna göre peltek se (ث), ha (ح), sad (ص), dad (ض), tı (ط), zı (ظ) ve ayın (ع) harflerinin bulunduğu kelimeler ile hemze içeren kelimeler Arapçadır. Buna karşılık je (ژ) harfi barındıran kelimeler Farsçadır. Ayrıca Türkçe kelimelerin başında c, f, h, j, l, m, n, p, r, ş, z harflerinin istisnalar dışında bulunmaması ve büyük ünlü uyumuna uyması yabancı kelimeleri ayırt etmede kullanılır.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:45"}, {"front": "Farsça kelimelerde görülen 'vâv-ı ma'dûle' nedir ve imlada nasıl bir işlevi vardır?", "back": "AÖF ders kitabının 5. ünitesinde ve 5. ünite özet videosunda belirtildiğine göre vâv-ı ma'dûle, Farsça kelimelerde hı (خ) harfinden sonra yazıldığı halde hiçbir ünlü veya ünsüz sesi karşılamayan okutulmayan vav harfidir. Uyku anlamına gelen 'hˇâb' (خواب) ve sofra anlamına gelen 'hˇân' (خوان) kelimelerinde yer alan bu vav harfi yazılışta muhafaza edilir ancak okunmaz.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:46"}, {"front": "Hicrî-kamerî takvimde kullanılan ay adları ile ayların 10'ar günlük dönemleri için kullanılan Arapça terimler nelerdir?", "back": "AÖF ders kitabının 5. ünitesi ile özet videosuna göre Hicrî-kamerî takvim ayın hareketlerini esas alır ve 1 yılı 355 gündür. Ayın ilk gününe 'gurre', son gününe 'selh' denir; ilk 10 günü 'evâil', ikinci 10 günü 'evâsıt', son 10 günü ise 'evâhir' olarak adlandırılır. Ayrıca resmi yazışmalarda ayların isimleri kısaltmalarıyla (örneğin Muharrem için 'm', Safer için 's') kaydedilmiştir.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:47"}, {"front": "Kelime başında uzun 'â' ve uzun 'î' sesleri Arap harfleriyle nasıl yazılır?", "back": "AÖF ders kitabının 5. ünitesine ve 5. ünite özet videosuna göre kelime başındaki uzun 'â' sesi medli elif (آ) ile yazılır; amil (âmil) ve amir (âmir) kelimeleri buna örnektir. Kelime başındaki uzun 'î' sesi ise elif ve ye (اي) harflerinin birleşimiyle gösterilir; ikaz (îkâz) ve icat (îcâd) kelimeleri bu kuralı örneklendirir.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:48"}, {"front": "Osmanlı yazışmalarında Yeniçeri ulûfelerinin ödendiği üçer aylık dönemlerin kısaltma isimleri nelerdir?", "back": "AÖF ders kitabının 5. ünitesi ve 5. ünite özet videosuna göre üç aylık dönemler ayların baş harflerinden oluşan rumuzlarla anılır. Muharrem-Safer-Rebî'ülevvel dönemi 'masar' (مصر), Rebî'ülâhir-Cumâdelûlâ-Cumâdelâhir dönemi 'recec' (رجج), Recep-Şa'bân-Ramazân dönemi 'reşen' (رشن) ve Şevval-Zilka'de-Zilhicce dönemi 'lezez' (لذذ) şeklinde kısaltılmıştır.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:49"}, {"front": "Rakamların yazılış yönü, okunuşu ve basamak sıralaması Osmanlı metinlerinde nasıl uygulanır ve kaynaklarda sayıların okunuşuna dair hangi kısıtlamalar belirtilmiştir?", "back": "AÖF ders kitabının 5. ünitesi ve 5. ünite özet videosuna göre metinler sağdan sola yazılsa da rakamlar soldan sağa doğru yazılır. Toplu sayılar yazılırken önce onlar, sonra yüzler, sonra binler sıralanır ve aralarına vav eklenerek okunur; örneğin '1105' sayısı 'Hamse ve mi'e ve elf' olarak okunur. Öte yandan Osmanlı bürokrasisinde kullanılan divan rakamları (siyakat rakamları) gibi özel yazı türlerinin detayları 5. ünite kaynaklarında kapsanmamıştır.", "ch": 5, "chTitle": "Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "id": "osmanlica-1:50"}, {"front": "Arapça isimlerde keyfiyet (müzekkerlik-müenneslik) nedir ve tamlamalar açısından önemi nasıldır?", "back": "Arapçada isimler erkek durumunu gösteren müzekker ve dişilik özelliği taşıyan müennes olmak üzere iki gramer cinsiyetine ayrılır. Müzekker kelimelerde belirleyici bir alamet bulunmazken müennes kelimeler lafzî veya manevi dişilik belirtileri taşır. Tamlayan ve tamlanan kelimelerin cinsiyet yönünden birbiriyle uyumlu olması gerektiği AÖF ders kitabında ve özet videoda vurgulanmıştır.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:51"}, {"front": "Arapça kelime yapısındaki 'aslî harfler' ile 'zâid harfler' neyi ifade eder ve zâid olabilen harfler hangileridir?", "back": "Aslî harfler, Arapça kelimelerin kökünü oluşturan ve anlam bağını koruyan en az üç temel harftir. Zâid harfler ise kök harflerine eklenerek kelimeye yeni anlamlar kazandıran ilave seslerdir. AÖF ders kitabında ve özet ses kaydında zâid olabilecek harfler hemze, elif, te, sin, mim, nun, he, vav ve ye olarak sıralanmıştır.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:52"}, {"front": "Arapça kelimelerin türetilmesinde bükünlü (tasrîfli) dil yapısı ne anlama gelir ve Osmanlı Türkçesinde Arapçanın hangi ögeleri kullanılır?", "back": "Arapça bükünlü bir dil olduğundan yeni kelimeler köke ek getirmek yerine kelime kökü kırılarak başında, ortasında veya sonunda ses değişiklikleri ve eklemeler yapılmasıyla türetilir. Osmanlı Türkçesinde Arapçadan yalnızca isim ve isim soylu kelimeler ile kalıplaşmış dua ve özlü sözler alınmış; fiil çekimleri ise hiçbir şekilde kullanılmamıştır. Bu ilke AÖF ders kitabı ve 6. ünite özet ses kaydında temel kural olarak belirtilir.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:53"}, {"front": "Arapçada iki nesneyi ifade eden tesniye (ikilik) yapısı Osmanlı imlasında nasıl oluşturulur?", "back": "Arapçada üç ve üzerindeki sayılar çoğul sayılırken, iki nesneyi göstermek için tesniye adı verilen özel ikilik formu uygulanır. Osmanlı Türkçesinde kelimenin sonu üstünlü okunup peşine '-eyn' (ين) eki getirilerek türetilir. 'Tarafeyn' (iki taraf), 'devleteyn' (iki devlet) ve 'Haremeyn' (Mekke ve Medine) kelimeleri bu kuralın ders kitabındaki başlıca örnekleridir.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:54"}, {"front": "Bir Arapça kelimenin vezni bulunurken izlenen adımlar ve aslî harflerin vezindeki karşılıkları nelerdir?", "back": "Vezin bulunurken öncelikle kelimedeki aslî harfler ve zâid harfler tespit edilir. İlk aslî harfin yerine fe (ف), ikinci aslî harfin yerine ayn (ع) ve üçüncü aslî harfin yerine lam (ل) getirilirken zâid harfler ile kelimenin harekeleri aynen aktarılır. Ortaya çıkan yeni kalıp kelimenin veznini oluşturur ve bu kural ders kitabında 'kerem' ve 'ikrâm' örnekleriyle açıklanır.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:55"}, {"front": "Cem'-i mükesser (kırık çoğul) ne demektir ve türetilmesinde belirli bir kural var mıdır?", "back": "Cem'-i mükesser, tekil kelimenin kök yapısının ve vezninin değiştirilmesiyle elde edilen düzensiz çokluk şeklidir. Belirli bir kurala bağlı olmayıp semâî nitelik taşıdığından hangi kelimenin hangi vezinde çoğaltılacağı ancak sözlüklerden öğrenilir. Osmanlı Türkçesinde 'ef'âl' (efrâd), 'fu'ûl' (hurûf) ve 'mefâ'il' (mecâlis) gibi kırık çoğul kalıpları oldukça yaygın biçimde kullanılmıştır.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:56"}, {"front": "Cem'-i sâlim (kurallı çoğul) çeşitleri nelerdir ve Osmanlı Türkçesinde en çok hangi ekler tercih edilir?", "back": "Cem'-i sâlim, tekil kelimenin yapısı bozulmadan ek getirilerek yapılan kurallı çokluktur. Eril çoğul olan cem'-i müzekker-i sâlim '-în' (ين) veya '-ûn' (ون) ekleriyle yapılır ve Osmanlıda '-în' eki (mü'minîn, me'mûrîn) daha yaygındır. Dişil çoğul olan cem'-i müennes-i sâlim ise kelime sonuna '-ât' (ات) eki getirilerek oluşturulur.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:57"}, {"front": "Müenneslik alâmetleri (lafzî müenneslik) nelerdir ve Osmanlı Türkçesinde kapalı te harfi nasıl yazılır?", "back": "Dişil kelimelerdeki lafzî müenneslik alametleri kelime sonundaki kapalı te (tâ-i merbûte), elif-i maksûre (kısa elif) ve elif-i memdûde (uzun elif) şeklindedir. Osmanlı Türkçesinde kapalı te harfi (ة) yazılmayıp yerine açık te (ت) veya güzel he (ه) harfi kullanılır. Ders kitabı bu duruma 'mu'allime' ve 'edîbe' kelimelerini örnek verir.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:58"}, {"front": "Semâî müennes nedir ve ma'nevî müenneslerden hangi yönüyle ayrılır?", "back": "Semâî müennesler, bünyesinde hiçbir lafzî veya manevî dişil belirti barındırmadığı halde dişil kabul edildiği ancak işitilerek veya sözlüklerden öğrenilen kelimelerdir. Yaklaşık 60 kelimeden oluşan bu grupta 'arz' (yer), 'nâr' (ateş) ve 'şems' (güneş) gibi sözcükler yer alır. Bu kelimelerin bir kısmı daima dişil sayılırken bazıları hem müzekker hem müennes olarak kullanılabilir.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:59"}, {"front": "Şekilsel bir dişilik alameti taşımadığı halde dişil kabul edilen ma'nevî (i'tibârî) müennesler hangileridir?", "back": "Gövdesinde müenneslik alameti bulunmayıp manen dişil sayılan kelimelere ma'nevî veya i'tibârî müennes denir. Bütün kadın isimleri, ülke, şehir ve kabile adları, çift organ isimleri (el, göz), harf isimleri ile cem'-i müzekker-i sâlim dışındaki çoğullar bu gruba girer. Ayrıca türemiş masdarların da ma'nevî müennes kabul edildiği kaynaklarda açıkça ifade edilmiştir.", "ch": 6, "chTitle": "Arapça Kelimelerin Yapısı", "id": "osmanlica-1:60"}, {"front": "Arapça kelime yapısında 'Aksâm-ı Seb'a' (kelimenin yedi kısmı) nedir ve kök harflerin sahih ve illetli oluşuna göre genel sınıflandırma nasıl yapılır?", "back": "AÖF ders kitabının 7. ünitesi ve 7. ünite özet ses kaydına göre Aksâm-ı Seb'a, Arapçada isim ve fiillerin kök harflerinin niteliğine (sahih veya illetli oluşuna ve tekrarlanışına) göre ayrıldığı yedi kısımdır. İlletli harfler elif, vav ve ye (ا, و, ی) olup bunlardan birini barındıran fiillere mu'tel, barındırmayanlara ise sahih kelimeler denir. Sahih grubunu sâlim, mehmûz ve muzâaf oluştururken; mu'tel grubunu misâl, ecvef, nâkıs ve lefîf oluşturur.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:61"}, {"front": "Arapça mu'tel (illetli) kelimelerden misâl, ecvef ve nâkıs yapıları kök harflerinin konumuna göre nasıl ayırt edilir?", "back": "AÖF ders kitabının 7. ünitesi ve 7. ünite özet ses kaydına göre ilk kök harfi illetli (vav veya ye) olan kelimelere misâl denir. İkinci (ortadaki) kök harfi illetli olan kelimeler ecvef, üçüncü (sondaki) kök harfi illetli olan kelimeler ise nâkıs olarak adlandırılır. Ayrıca ecvef ve nâkıs kelimeler kendi içlerinde vavi, yayi veya elifli türlere ayrılmaktadır.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:62"}, {"front": "Arapçada sülâsî mücerred masdarlar ne anlama gelir ve bunlarda vezin-anlam ilişkisi nasıldır?", "back": "AÖF ders kitabının 7. ünitesi ile 7. ünite özet ses kaydına göre sülâsî mücerred masdarlar, yapısında ilave (zâid) harf bulunmayan üç aslî harfli basit masdarlardır. Bu masdarlar belirli bir kurala veya kalıp anlama bağlı olmayıp semâî nitelik taşırlar, dolayısıyla anlamları ancak işitilerek veya sözlüklere bakılarak öğrenilir. Osmanlı Türkçesinde fa'l, fi'l, fu'l gibi yaklaşık 40 civarında sülâsî mücerred masdar vezni yaygın biçimde kullanılmıştır.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:63"}, {"front": "Lefîf kelime ne demektir ve lefîf-i mefrûk ile lefîf-i makrûn arasındaki fark nedir?", "back": "AÖF ders kitabının 7. ünitesi ve özet ses kaydında açıklandığı üzere lefîf, kök harflerinden ikisi illetli harflerden oluşan kelimelerdir. İlletli harflerden biri kelimenin başında, diğeri sonunda (1. ve 3. harfte) yer alıyorsa buna lefîf-i mefrûk (örneğin vefâ) adı verilir. Kelimeyi oluşturan harflerin son ikisi (2. ve 3. harf) illetli ise buna lefîf-i makrûn (örneğin tayy) denir.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:64"}, {"front": "Mec'ûl (yapma/sun'î) masdarlar nasıl oluşturulur, hangi işlevi görür ve Osmanlı Türkçesinde kullanımı nasıldır?", "back": "AÖF ders kitabının 7. ünitesi ve 7. ünite özet ses kaydına göre mec'ûl masdarlar, türemiş sıfat veya isimlerin sonuna şeddeli ye ve te (-iyyet) eki getirilerek yapılan yapma/sun'î masdarlardır. Türkçedeki '-lık, -lik' ekine karşılık gelen bu yapıyla insâniyyet (insanlık), hürriyyet (hürlük) ve İslâmiyyet gibi soyut kavramlar türetilir. Arapçada masdarlara bu ek getirilmezken Osmanlı Türkçesinde bazı masdarlara da eklenerek yeni kelimeler türetilmiştir.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:65"}, {"front": "Mimli masdarlar nedir, hangi vezinlerde bulunurlar ve ism-i mekân veya ism-i zaman yapılarıyla karışması nasıl önlenir?", "back": "AÖF ders kitabının 7. ünitesi ile özet ses kaydına göre başlarında zâid bir mim (م) harfi bulunan sülâsî mücerred masdarlara mimli masdar denir. Mimli masdarlar mef'al, mef'il, mef'alet ve mef'ilet olmak üzere dört temel vezinde türetilir. İsm-i mekân, ism-i âlet ve ism-i zaman vezinleriyle aynı kalıbı taşısalar da cümle içerisindeki anlamlarına bakılarak birbirlerinden ayırt edilirler.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:66"}, {"front": "Mücerred rubâ'î masdarlar nedir, masdar vezni ile ism-i fâ'il ve ism-i mef'ûl vezinleri nasıl oluşturulur?", "back": "AÖF ders kitabının 7. ünitesi ve 7. ünite özet ses kaydına göre dört aslî harften oluşan masdarlara rubâ'î masdar denir ve tek vezni fa'lele (örneğin vesvese, terceme) şeklindedir. Rubâ'î masdarların ism-i fâ'ili mufa'lil (örneğin müverim, mütercim) vezninde türetilir. İsm-i mef'ûlü ise mufa'lel (örneğin mütercem, müselsel, mutantan) vezninde elde edilir.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:67"}, {"front": "Mücerred sülâsî masdarların ism-i fâ'ili hangi vezinde türetilir, hangi tür fiillerden yapılır ve illetli kelimelerde i'lâl nasıl işler?", "back": "AÖF ders kitabının 7. ünitesi ve özet ses kaydına göre mücerred sülâsî masdarların ism-i fâ'ili fâ'il (فاعل) vezninde türetilir ve sadece etken (aktif) fiillerden yapılır. Muzâaf kelimelerde vezin fâ'' (örneğin farr), ecveflerde fâ'il/fâyil (örneğin mâyil), nâkıslarda ise fâ'î (örneğin dâ'î, kārî) şeklini alır. Geçici durum ve eylemi yapanı gösteren bu isimler Türkçedeki '-an, -en' ekine karşılık gelir.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:68"}, {"front": "Mücerred sülâsî masdarların ism-i mef'ûlü hangi vezinde türetilir ve ecvef ile nâkıs kelimelerde i'lâl durumunda vezinler nasıl değişir?", "back": "AÖF ders kitabının 7. ünitesi ile 7. ünite özet ses kaydına göre sülâsî mücerred masdarların ism-i mef'ûlü mef'ûl (مفعول) vezninde yapılır ve edilgen (pasif) anlam taşır. İ'lâl durumunda vavi ecveflerde mef'ûl (örneğin makūl), yayi ecveflerde mef'îl (örneğin mehîb) vezni kullanılır. Vavi nâkıslarda mef'ûvv/mef'û (örneğin ma'fû), yayi nâkıslarda ise mef'iyy/mef'î (örneğin mermî) biçimine dönüşür.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:69"}, {"front": "Sahih fiiller grubuna giren sâlim, mehmûz ve muzâaf kelimelerin temel nitelikleri ve farkları nelerdir?", "back": "AÖF ders kitabının 7. ünitesi ve özet ses kaydına göre sâlim kelimeler, kök harflerinde illet harfi, hemze veya tekrarlanan harf bulunmayan en düzenli yapılardır. Mehmûz kelimeler, kök harflerinden biri hemze olan yapılardır; hemzenin yerine göre mehmûzü'l-fâ, mehmûzü'l-ayn veya mehmûzü'l-lâm adını alırlar. Muzâaf kelimeler ise kök harflerinden ikinci ve üçüncüsü aynı olan (illetli olmayan) ve genellikle şedde ile gösterilen kelimelerdir.", "ch": 7, "chTitle": "Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "id": "osmanlica-1:70"}, {"front": "AÖF kaynaklarına göre kök harflerin mezîdünfih bâblara aktarılmasında dikkat edilmesi gereken kural ve sınırlama nedir?", "back": "Ders kitabı ve 8. ünite özet ses kaydına göre bir kelimeyi teorik olarak her bâba sokmak mümkün görünse de pratik kullanım sözlüklere bağlıdır. Örneğin 'harb' kelimesine işteşlik kazandırmak için 'tefâ'ul' yerine 'müfâ'ale' bâbı seçilerek 'muhârebe' kelimesi türetilmeli, kurallarda bulunmayan uydurma biçimlerden kaçınılmalıdır. Dolayısıyla hangi kökün hangi bâbda kullanıldığı ancak sözlükler vasıtasıyla teyit edilebilir.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:71"}, {"front": "Mezîdünfih masdarlar (kıyasî masdarlar) ne demektir, sülâsî mücerred masdarlardan hangi temel özellikleriyle ayrılırlar ve Osmanlı Türkçesinde kaç babı kullanılmıştır?", "back": "AÖF ders kitabının 8. ünitesine ve 8. ünite özet ses kaydına göre mezîdünfih (kıyasî) masdarlar, sülâsî mücerred masdarlara belirli ekler getirilerek türetilen kurallı masdarlardır. Sülâsî mücerred masdarlar semâî olup belirli bir kurala dayanmazken, mezîdünfih masdarlar kıyasîdir ve kelimenin çatısında belirli anlam değişiklikleri gerçekleştirir. Arapçada daha fazla mezîdünfih babı bulunmakla birlikte Osmanlı Türkçesinde bunlardan 9 adedi tercih edilip kullanılmıştır.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:72"}, {"front": "Müfâ'ale bâbı (مُفَاعَلَه) yapısı, zâid harfleri ve kazandırdığı çatı özellikleri bakımından nasıl tanımlanır?", "back": "AÖF ders kitabının 8. ünitesine göre Müfâ'ale bâbında baştaki mim, ilk aslî harften sonraki elif ve sondaki te (veya güzel he) harfleri zâiddir. Bu bâb, eylemin karşılıklı olarak yapıldığını ifade ederek kelimeye işteşlik (müşâreket) kazandırır veya geçişsizleştirme işlevi görür. İsm-i fâ'ili müfâ'il (muhâfız, muhâbir), ism-i mef'ûlü ise müfâ'al (muhâtab, mübârek) veznindedir.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:73"}, {"front": "Sülâsî mezîdünfih masdarlarda 'bâb' kavramı neyi ifade eder ve kelimelere ne tür anlamlar kazandırır?", "back": "Ders kitabının 8. ünitesine göre sülâsî mezîdünfih masdarların elde edildiği özel yapılara 'bâb' adı verilir. Bâblar kelimenin temel anlamını değiştirmeden geçişsiz (lâzım) bir fiili geçişli (müteaddî) yapmak, geçişliliğin derecesini artırmak, dönüşlülük kazandırmak veya işteşlik (müşâreket) sağlamak gibi işlevler üstlenir.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:74"}, {"front": "Tef'îl bâbı (تفعيل) hangi zâid harflerle kurulur ve Osmanlı Türkçesinde üstlendiği temel işlevler nelerdir?", "back": "AÖF ders kitabının 8. ünitesine göre Tef'îl bâbı, kökün başına te ve ikinci aslî harften sonra ye harfi eklenerek oluşturulur. Bu bâb geçişsiz fiilleri geçişli yapma, geçişli fiillerin ettirgenliğini artırma, saymak/kabul etmek (ta'yîb, tasvîb), sayı isimlerine geçişlilik verme (tevhîd, teslîs) ve kalıplaşmış dua/ibare ifadelerini adlandırma (tesbîh, tehlîl) işlevlerini yerine getirir.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:75"}, {"front": "Tef'îl bâbının ism-i fâ'il ve ism-i mef'ûl vezinleri nelerdir, nâkıs kelimelerde bu vezinler nasıl biçim değiştirir?", "back": "Ders kitabının 8. ünitesine göre Tef'îl bâbının ism-i fâ'ili mufa''il (ُمَفعِّْل / mu'allim, müderris), ism-i mef'ûlü ise mufa''al (ُمَفعَّْل / mürekkeb, mükerrem) vezninde kalıplanır. İ'lâl durumunda nâkıs fiillerin ism-i fâ'ili mufa''î (mürebbî, mukavvî), ism-i mef'ûlü ise mufa''â (müberrâ, müsemmâ) şeklini alır.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:76"}, {"front": "Tefa''ul bâbı (تَفَعُّل) nasıl türetilir, cümleye hangi anlamları katar ve ism-i mef'ûlü neden az kullanılır?", "back": "Tefa''ul bâbı, baştaki zâid te harfi ve ikinci aslî harfin şeddelenmesiyle kurulur. Sülâsî mücerred ve Tef'îl bâbındaki geçişsiz masdarlara dönüşlülük kazandırdığı gibi bazı kelimelerde yapmacıklık (teşeccü') anlamı da ifade eder. Bâbın temel işlevi dönüşlülük olduğundan, edilgenliği bildiren ism-i mef'ûl formu (mütefa''al) dilde oldukça nadir kullanılır.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:77"}, {"front": "Tefâ'ul bâbı (تَفَاعُل) ne tür anlam ilişkileri kurar ve tefâ'ul ile tefa''ul bâbları arasındaki temel fark nedir?", "back": "AÖF ders kitabının 8. ünitesi ve özet ses kaydına göre Tefâ'ul bâbı iki veya daha fazla kişi arasında işteşlik (te'âvün), yapmacıklık/sahtelik (tecâhül), dönüşlülük veya derece derece gerçekleşme (tekâmül, tezâyüd) anlamı katar. Tefa''ul bâbı ağırlıklı olarak dönüşlülük bildirirken Tefâ'ul bâbı öncelikle karşılıklı yapmayı (işteşliği) esas almasıyla ayrılır. İsmi-i fâ'ili mütefâ'il (mütekâmil) vezninde türetilmektedir.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:78"}, {"front": "İf'âl bâbı (افعال) Arap harfleriyle nasıl oluşturulur, temel işlevi nedir ve i'lâl durumunda vezinde ne gibi değişiklikler meydana gelir?", "back": "İf'âl bâbı, mücerred sülâsî masdarın ilk aslî harfinden önce hemze, ikinci aslî harfinden sonra elif eklenerek türetilir. Osmanlı Türkçesinde ağırlıklı olarak geçişsiz fiillere geçişlilik kazandırma (ettirgenlik) işlevi görür. İ'lâl durumunda, ilk harfi hemze veya vav olan kelimeler 'îfâl' (îcâd, îkāz) sesini alırken, ortasında illet harfi bulunan ecvef kelimeler 'ifâle' (ِافَاَلْة) veznine dönüşür.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:79"}, {"front": "İf'âl bâbının ism-i fâ'ili ve ism-i mef'ûlü hangi vezinlerde türetilir ve öğrenmeyi kolaylaştırmak için özet ses kaydında hangi örnek kodlama tavsiye edilmiştir?", "back": "AÖF ders kitabına ve 8. ünite özet ses kaydına göre İf'âl bâbının ism-i fâ'ili müf'il (ُمفِعْل), ism-i mef'ûlü ise müf'al (ُمْفَعْل) vezninde türetilir. Özet ses kaydında soyut vezin kalıplarını ezberlemek yerine zihinde 'kerem - ikrâm - mükrim - mükrem' veya 'hüsün - ihsân - muhsin - muhsen' gibi örnek kelime dizilerini kodlamanın mantığı kavramada çok daha etkili olduğu vurgulanmıştır.", "ch": 8, "chTitle": "Mezîdünfih Masdarlar (I)", "id": "osmanlica-1:80"}], "quiz": [{"q": "Osmanlı Türkçesinin 15. yüzyılın ortasından 19. yüzyıla kadar süren dönemine ne ad verilir?", "o": [{"t": "Eski Anadolu Türkçesi", "ok": false, "why": "Eski Anadolu Türkçesi İstanbul'un fethine kadarki dönemdir."}, {"t": "Klasik Osmanlı Türkçesi", "ok": true, "why": "Doğru. Klasik dönem 15. yüzyıl ortasından 19. yüzyıla kadar sürer."}, {"t": "Yeni Osmanlı Türkçesi", "ok": false, "why": "Yeni Osmanlı Türkçesi Tanzimat'tan 1908'e kadardır."}, {"t": "Yeni Türkiye Türkçesi", "ok": false, "why": "Yeni Türkiye Türkçesi 1908 sonrasıdır."}], "hint": "Dönemler: kuruluş, klasik, Tanzimat sonrası.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki harflerden hangisi Arap alfabesine İranlılar tarafından eklenmiştir?", "o": [{"t": "ح", "ok": false, "why": "Ha (ح) asıl Arap harfidir."}, {"t": "ع", "ok": false, "why": "Ayın (ع) Arapçaya özgü bir harftir."}, {"t": "چ", "ok": true, "why": "Doğru. Çe (چ), pe (پ) ve je (ژ) İranlılarca eklenmiştir."}, {"t": "ق", "ok": false, "why": "Kaf (ق) asıl Arap harfidir."}], "hint": "İranlıların eklediği harfler pe, çe ve je'dir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Harfin altına konup onu \"ı/i\" okutan hareke hangisidir?", "o": [{"t": "Üstün", "ok": false, "why": "Üstün harfin üstüne konur ve a/e okutur."}, {"t": "Ötre", "ok": false, "why": "Ötre harfin üstüne konur ve o/ö/u/ü okutur."}, {"t": "Esre", "ok": true, "why": "Doğru. Esre (kesre) harfin altına konur."}, {"t": "Cezm", "ok": false, "why": "Cezm harfi ünsüz okutur."}], "hint": "Harfin altına konan tek hareke.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "عموماً (umûmen) kelimesinin sonundaki işaret hangisidir?", "o": [{"t": "Üstünlü tenvin", "ok": true, "why": "Doğru. Üstünlü tenvin son harfi an/en okutur ve sona tenvin elifi yazılır."}, {"t": "Esreli tenvin", "ok": false, "why": "Esreli tenvin ın/in okutur."}, {"t": "Ötreli tenvin", "ok": false, "why": "Ötreli tenvin un/ün okutur."}, {"t": "Şedde", "ok": false, "why": "Şedde harfi iki kez okutur."}], "hint": "Kelimenin sonunu \"en\" diye okutuyor.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "\"Millet\" kelimesinde iki lam yerine tek lam yazılıp iki kez okunmasını sağlayan işaret hangisidir?"
