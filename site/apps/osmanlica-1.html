{"t": "r", "ok": true, "why": "Türkçe kelimeler ğ, l, m, n, ñ, r, z ünsüzleriyle başlamaz."}, {"t": "k", "ok": false, "why": "Türkçe kökenli kelimeler 'k' ünsüzü ile başlayabilir."}, {"t": "s", "ok": false, "why": "Türkçe kökenli kelimeler 's' ünsüzü ile başlayabilir."}, {"t": "t", "ok": false, "why": "Türkçe kökenli kelimeler 't' ünsüzü ile başlayabilir."}], "hint": "Türkçe kelime başlarında bulunmayan sekiz ünsüz harf grubunu (ğ, l, m, n, ñ, r, z) hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçe kelimelerde tonlu-tonsuz ünsüz benzeşmesi kuralına örnek gösterilen 'it-ti' fiilinin Osmanlı Türkçesindeki doğru yazılışı aşağıdakilerden hangisidir?", "o": [{"t": "ايتدى", "ok": true, "why": "Türkçe 'it-ti' fiilinde kökten sonra gelen görülen geçmiş zaman eki imlada 'dal' harfiyle korunarak 'ايتدى' biçiminde yazılır fakat okunuşta benzeşmeye uğrar."}, {"t": "ايتتى", "ok": false, "why": "Okunuştaki sertleşmeyi imlaya yansıtarak 'te' harfiyle yazmak Osmanlı Türkçesi ek imla geleneğine uymaz."}, {"t": "ايتى", "ok": false, "why": "Bu yazımda görülen geçmiş zaman ekinin 'dal' harfi eksiktir."}, {"t": "ايتديك", "ok": false, "why": "Bu biçim teklik 3. şahıs 'it-ti' çekimini değil, çokluk 1. şahıs eki almış halini gösterir."}], "hint": "Türkçe eklerdeki tonlu-tonsuz ünsüz değişiminde fiil kökünden sonra gelen 'd' harfinin imladaki kalıbını göz önüne getiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Osmanlı Türkçesinde Türkçe dilek-şart kipi eki olan '-sa / -se' aşağıdakilerden hangisi şeklinde tek kalıp olarak yazılır?", "o": [{"t": "سه", "ok": true, "why": "Dilek-şart eki ses uyumlarına göre okunsa da imlada standart olarak 'sin' ve güzel 'he' (سه) birleşimiyle yazılır."}, {"t": "سا", "ok": false, "why": "Kalın ünlülü fiillerde 'sa' okunsa dahi ek imlasında elif kullanılmaz."}, {"t": "سي", "ok": false, "why": "Dilek-şart eki imlasında 'ye' harfi standart ek kalıbı değildir."}, {"t": "سو", "ok": false, "why": "Dilek-şart eki yuvarlak ünlü taşıyan bir harfle gösterilmez."}], "hint": "Ek ünlü uyumuna göre -sa veya -se olarak okunsa da yazımda sonuna güzel he getirilerek tek kalıp olarak gösterilir.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Osmanlı Türkçesi dilek-şart kipinde ince ünlülü fiillerin teklik 2. şahıs yazılışı ile aşağıdaki şahıslardan hangisinin yazılışı aynıdır (örneğin كلسه ك)?", "o": [{"t": "Çokluk 1. şahıs", "ok": true, "why": "İnce ünlülü fiillerde 'gelsen' (teklik 2. şahıs) ile 'gelsek' (çokluk 1. şahıs) çekimlerinin ikisi de 'كلسه ك' şeklinde yazılır."}, {"t": "Teklik 1. şahıs", "ok": false, "why": "Teklik 1. şahıs çekimi sonuna mim harfi alarak 'كلسه م' biçiminde biter."}, {"t": "Çokluk 2. şahıs", "ok": false, "why": "Çokluk 2. şahıs çekiminde ek sonunda kef-zeyn 'كز' birleşimi yer alır."}, {"t": "Çokluk 3. şahıs", "ok": false, "why": "Çokluk 3. şahıs çekiminde ek sonunda çokluk eki 'لر' bulunur."}], "hint": "'كلسه ك' (gelsen / gelsek) örneğinde olduğu gibi cümledeki bağlamdan ayırt edilen şahıs çekimini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Aşağıdaki fiillerden hangisi dilek-şart kipinin olumsuz şekliyle yazılmıştır?", "o": [{"t": "دونمه سه", "ok": true, "why": "'Dönmese' fiili olumsuzluk eki 'مه' ve dilek-şart eki 'سه' ile 'دونمه سه' biçiminde yazılır."}, {"t": "كلسه م", "ok": false, "why": "Bu kelime olumsuzluk eki içermeyen olumlu 'gelsem' çekimidir."}, {"t": "اويوسه ق", "ok": false, "why": "Bu kelime olumsuzluk eki içermeyen olumlu 'uyusak' çekimidir."}, {"t": "بيلسه", "ok": false, "why": "Bu kelime olumsuzluk eki içermeyen olumlu 'bilse' çekimidir."}], "hint": "Dilek-şart kipinde olumsuzluk için ince ünlülü fiillerde مه, kalın ünlülü fiillerde ما ekinin eklendiğini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Osmanlı Türkçesinde gereklilik kipi eki olan '-malı / -meli' standart olarak aşağıdakilerden hangisi biçiminde yazılır?", "o": [{"t": "ملى", "ok": true, "why": "Gereklilik kipi eki standart olarak mim-lam-ye (ملى) harfleriyle yazılır."}, {"t": "مالى", "ok": false, "why": "Elif kullanımı bazı kalın örneklerde görülse de ek temel standart kalıbı elifsiz yazılır."}, {"t": "ملو", "ok": false, "why": "Gereklilik eki son harf olarak vav değil ye alır."}, {"t": "مه لى", "ok": false, "why": "Ayrı güzel he kullanımı standart gereklilik eki imlası değildir."}], "hint": "Mim, lam ve ye harflerinden oluşan standart ek kalıbını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Gereklilik kipinin olumsuz çekimine örnek olan 'bitirmemeliyiz' ifadesinin Osmanlı Türkçesi imlası aşağıdakilerden hangisidir?", "o": [{"t": "بيتيرمه ملى يز", "ok": true, "why": "Fiil tabanı ile gereklilik eki arasına olumsuzluk eki -me (مه) getirilerek 'بيتيرمه ملى يز' şeklinde yazılır."}, {"t": "بيتيرملى يز", "ok": false, "why": "Bu yazım olumsuzluk eki içermeyen olumlu 'bitirmeliyiz' çekimidir."}, {"t": "بيتيرمه مكده يز", "ok": false, "why": "Bu yazım gereklilik kipi değil şimdiki zaman kipinin olumsuz çekimidir."}, {"t": "بيتيرمه سه ك", "ok": false, "why": "Bu yazım gereklilik kipi değil, dilek-şart kipindeki 'bitirmesek' çekimidir."}], "hint": "Fiil kökü ile '-malı/-meli' eki arasına 'me' (مه) olumsuzluk ekinin girdiği şekli arayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçedeki şimdiki zaman eki olan '-makta / -mekte' eklerinin Osmanlı Türkçesindeki temel yazılış biçimi aşağıdakilerden hangisidir?", "o": [{"t": "مقده / مكده", "ok": true, "why": "Şimdiki zaman eki kalın fiillerde 'مقده', ince fiillerde 'مكده' biçiminde fiil tabanına eklenir."}, {"t": "مقتى / مكتى", "ok": false, "why": "Ek sonundaki bulunma hali 'dal-he' birleşimi yerine 'te-ye' ile yazılmaz."}, {"t": "مقدا / مكدا", "ok": false, "why": "Ekin sonundaki geniş ünlü elif ile değil güzel he ile gösterilir."}, {"t": "ماقده / ميكده", "ok": false, "why": "Mastar ekindeki ünlüler elif veya ye ile uzatılarak yazılmaz."}], "hint": "Fiil tabanına eklenen mastar eki (-mak/-mek) üzerine bulunma hali ekinin (-ta/-te) gelmesiyle oluşan kalıbı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Aşağıdaki ifadelerin hangisinde Farsça kökenli 'ez' (از) ön edatının Türkçe karşılığı doğru verilmiştir?", "o": [{"t": "ez-cân u dil (از جان و دل) - Candan ve gönülden", "ok": true, "why": "Farsça 'ez' (از) ön edatı Türkçe isim çekimindeki '-dan, -den' ayrılma halinin işlevini görür."}, {"t": "ezber (از بر) - Yüzünden, başkası adına", "ok": false, "why": "'Ezber' kelimesindeki 'ez' edatıyla oluşan yapı 'zihinden, göğüsten' anlamına gelir."}, {"t": "ez-cân u dil (از جان و دل) - Can ile gönül", "ok": false, "why": "Birliktelik (ile) anlamını sağlayan edat 'ez' değil 'ba' edatıdır."}, {"t": "ez-cân u dil (از جان و دل) - Cana ve gönüle", "ok": false, "why": "Yönelme (-a, -e) anlamını sağlayan edat 'ez' değil 'be' edatıdır."}], "hint": "'ez' (از) ön edatının Türkçe isim çekimindeki ayrılma (-dan / -den) haline karşılık geldiğini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Osmanlı Türkçesi metinlerinde 'üzerine, üzerinde, üzere' anlamlarına gelen Farsça ön edat aşağıdakilerden hangisidir?", "o": [{"t": "ber (بر)", "ok": true, "why": "'Ber' edatı 'üzerine, üzerinde, üzere' anlamı katar (örneğin ber-kemâl, ber-dâr)."}, {"t": "der (در)", "ok": false, "why": "'Der' edatı bulunma hali olan '-da, -de, içinde' anlamı katar."}, {"t": "ba (با)", "ok": false, "why": "'Ba' edatı vasıta/birliktelik gösteren 'ile, -lı, -li' anlamı katar."}, {"t": "be (به)", "ok": false, "why": "'Be' edatı yönelme gösteren '-a, -e' anlamı katar."}], "hint": "'ber-kemâl' (kemal üzere) veya 'ber-dâr' (asılmış) kelimelerindeki edatı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Aşağıdakilerden hangisi Osmanlı Türkçesinde sıklıkla kullanılan ünlem (nidâ) kelimelerinden biridir?", "o": [{"t": "zihî (زهى)", "ok": true, "why": "'Zihî' (ne güzel, ne hoş) Osmanlı Türkçesinde metinlerde sıkça yer alan ünlemlerdendir."}, {"t": "gayrı (غيرى)", "ok": false, "why": "'Gayrı' kelimesi ünlem değil, 'başka, artık' anlamında kullanılan bir kelimedir."}, {"t": "ancak (انجق)", "ok": false, "why": "'Ancak' kelimesi bir bağlama edatıdır."}, {"t": "berây-ı (براى)", "ok": false, "why": "'Berây-ı' tamlaması 'için' anlamına gelen bir ön edattır."}], "hint": "Coşku, şaşırma veya beğeni ifade eden, 'ey' veya 'yâ' gibi ünlem grubunda yer alan sözcüğü düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Aşağıdaki fiil çekimlerinden hangisi '-makta / -mekte' şimdiki zaman ekiyle oluşturulmuştur?", "o": [{"t": "اوشومكده يم", "ok": true, "why": "'Üşü-' fiiline -mekte (مكده) şimdiki zaman eki ve teklik 1. şahıs eki (يم) eklenerek 'üşümekteyim' elde edilir."}, {"t": "اوشوسه م", "ok": false, "why": "Bu kelime dilek-şart eki (-se) ile oluşturulmuş 'üşüsem' çekimidir."}, {"t": "اوشوملى يز", "ok": false, "why": "Bu kelime gereklilik eki (-meli) ile oluşturulmuş 'üşümeliyiz' çekimidir."}, {"t": "اوشودم", "ok": false, "why": "Bu kelime görülen geçmiş zamanla çekimlenmiş 'üşüdüm' biçimidir."}], "hint": "Fiil tabanından sonra mim-kef-dal-he (مكده) ekini ve şahıs ekini içeren seçeneği arayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Osmanlı Türkçesinde şahıs zamirlerinin yönelme (yaklaşma) hâli çekiminde belirgin bir imlâ kuralı uygulanmaktadır. Buna göre \"bana\" ve \"sana\" kelimelerinin doğru yazılışı aşağıdakilerden hangisidir?", "o": [{"t": "بكا / سکا", "ok": true, "why": "Şahıs zamirlerinin yönelme hâlinde kökteki genizsi/damaksı 'n' sesi 'ك' (kef/sağır nun) harfi kullanılarak yazılır."}, {"t": "بنا / سنا", "ok": false, "why": "Standart 'nun' harfiyle yazım, günümüz okunuşuna uygun görünse de klasik Osmanlı Türkçesi zamir imlâ kalıbına uymamaktadır."}, {"t": "بگا / سگا", "ok": false, "why": "'Gef' harfi yumuşak 'g' veya 'g' seslerini temsil ettiğinden zamir yönelme çekimindeki damaksı 'n' sesini karşılamaz."}, {"t": "بيا / سيا", "ok": false, "why": "'Ye' harfi yönelme ekindeki kaynaştırma sesiyle karıştırılmış olup kökteki damaksı 'n' yapısını yansıtmamaktadır."}], "hint": "Zamirlerde yönelme hâli eki getirilirken kökte damaksı/genizsi n (sağır nun) harfi tercih edilir.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesi metinlerinde geçen \"fi'l-hâl\" (فى الحال) zarfının Türkçe karşılığı aşağıdakilerden hangisidir?", "o": [{"t": "Hemen, o anda", "ok": true, "why": "Arapça kökenli 'fi'l-hal' birleşik zarfı metinlerde 'o anda, hemen, gecikmeksizin' anlamında kullanılır."}, {"t": "Arada sırada", "ok": false, "why": "'Arada sırada' anlamı Osmanlı Türkçesinde 'akîbinde' veya benzeri zaman zarflarıyla ifade edilir."}, {"t": "Yıldan yıla", "ok": false, "why": "'Yıldan yıla' ifadesinin Osmanlı Türkçesindeki karşılığı 'sal be-sâl' zarfıdır."}, {"t": "Kara yoluyla", "ok": false, "why": "'Kara yoluyla' anlamını taşıyan zarf 'berren' kelimesidir."}], "hint": "Bu zarf, 'hal' (mevcut durum/an) kelimesiyle bağlantılı olup eylemin anındalığını ifade eder.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde \"başka\" anlamında kullanılan Türkçe kökenli zarf aşağıdakilerden hangisidir?", "o": [{"t": "ايرق (ayrık)", "ok": true, "why": "Eski Türkçe kökenli 'ayrık' kelimesi Osmanlı metinlerinde 'başka, ayrı, diğer' anlamında zarf olarak kullanılır."}, {"t": "بولدر (boldur)", "ok": false, "why": "'Boldur' veya 'bıldır' kelimesi zaman zarfı olup 'geçen yıl' anlamına gelir."}, {"t": "قنده (kanda)", "ok": false, "why": "'Kanda' kelimesi yer-yön/soru zarfı olup 'nerede' anlamında kullanılır."}, {"t": "اشته (işte)", "ok": false, "why": "'İşte' kelimesi bir gösterme edatıdır, 'başka' anlamına gelmez."}], "hint": "'Ayrı' kökünden türemiş, günümüz Türkiye Türkçesinde yerini 'başka' kelimesine bırakmış tarihî bir kelimedir.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde \"yirmi\" ve \"bin\" sayılarının imlâsı kalıplaşmış özel yapılara sahiptir. Aşağıdakilerin hangisinde bu iki sayının yazılışı doğru sıralanmıştır?", "o": [{"t": "يكرمی – بيك", "ok": true, "why": "'Yirmi' kelimesi 'يكرمی' ve 'bin' kelimesi 'بيك' biçiminde kalıplaşmış tarihî imlâlarıyla yazılır."}, {"t": "يرمى – بين", "ok": false, "why": "'Bin' kelimesinde 'nun' harfi kullanımı Arapça 'bint/bin' kelimeleriyle karıştırılmasından kaynaklanır; Türkçe 'bin' kelimesi kef (sağır nun) ile yazılır."}, {"t": "يرمى – بيك", "ok": false, "why": "'Yirmi' kelimesinde ortadaki 'kef' harfinin yazılmaması kalıplaşmış imlâ kuralının ihlal edilmesine yol açar."}, {"t": "يكرمی – بين", "ok": false, "why": "'Yirmi' doğru yazılmasına rağmen 'bin' kelimesinin son harfi 'nun' değil damaksı n temsilcisi olan 'kef' olmalıdır."}], "hint": "Her iki kelimede de günümüzde 'n' veya sesli olan yerlerde tarihî imlâ gereği 'kef' (ك) harfi bulunur.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde rakamların yazılışı ve biçimsel özellikleri ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": [{"t": "Metinler sağdan sola yazılmasına rağmen rakamlar soldan sağa doğru yazılır.", "ok": true, "why": "Osmanlı Türkçesi yazısı sağdan sola doğru akarken sayısal rakamlar soldan sağa dizilir."}, {"t": "İki (۲) ve altı (٦) rakamları aynı yöne bakar.", "ok": false, "why": "İki rakamı sağa bakarken, altı rakamı sola bakacak şekilde yazılır."}, {"t": "Yedi (٧) rakamı ters v harfine, sekiz (٨) ise düz v harfine benzer.", "ok": false, "why": "Yedi rakamı düz 'v' harfine benzerken, sekiz rakamı 'v' harfinin ters dönmüş biçimine benzer."}, {"t": "Çok basamaklı rakamlar yazılırken önce birler sonra onlar basamağı sağdan sola dizilir.", "ok": false, "why": "Basamaklar soldan sağa doğru sıralanır ve okuma düzeni buna göre gerçekleşir."}], "hint": "Arap alfabesi temelli metin akış yönü ile sayısal dizilim yönünün birbirinden farklı olduğunu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde \"bu\" ve \"şu\" işaret zamirlerinin yükleme (belirtme) hâlindeki doğru yazılışları aşağıdakilerin hangisinde birlikte verilmiştir?", "o": [{"t": "بونى – شونى", "ok": true, "why": "İşaret zamirlerinin yükleme hâli 'بونى' (bunu) ve 'شونى' (şunu) biçiminde yazılır."}, {"t": "بوندن – شوندن", "ok": false, "why": "Bu yazım yükleme değil ayrılma hâlindeki 'bundan, şundan' biçimidir."}, {"t": "بونك – شونك", "ok": false, "why": "'بونك' ve 'شونك' biçimleri yükleme değil, ilgi (tamlayan) hâli çekimleridir."}, {"t": "بونده – شونده", "ok": false, "why": "'بونده' ve 'شونده' biçimleri bulunma hâli çekimleridir."}], "hint": "İşaret zamirlerinin yükleme hâli kalıplaşmış kısa yazımlara sahiptir ve ek kelimeye bitişik durur.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde isimlere getirilen bildirme eklerinden 2. tekil şahıs eki (örneğin \"talebesin\", \"boşsun\") imlâda hangi harf birleşimiyle temsil edilir?", "o": [{"t": "سک", "ok": true, "why": "2. şahıs bildirme ekleri 'sin/sun' imlâda 'sin' ve damaksı n olan 'kef' harflerinin birleşimiyle (سک) yazılır."}, {"t": "سن", "ok": false, "why": "Günümüz Türkçesindeki 'sen' kelimesi 'سن' şeklinde yazılsa da şahıs bildirme eki imlâda 'سک' olarak kalıplaşmıştır."}, {"t": "سم", "ok": false, "why": "'سم' harf birleşimi 1. tekil şahıs ekinin veya şart kipinin çekimlerinde yer alır."}, {"t": "سز", "ok": false, "why": "'سز' harf birleşimi 2. çoğul şahıs ekini temsil eder."}], "hint": "İkinci şahıs eklerinde genellikle kullanılan damaksı n (kef) harfini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesi metinlerinde sıklıkla karşılaşılan \"berren\" (برًا) zarfının anlamı aşağıdakilerden hangisidir?", "o": [{"t": "Kara yoluyla", "ok": true, "why": "Arapça 'berr' (kara) kökünden tenvin ile türetilen 'berren' zarfı metinlerde 'kara yoluyla' anlamına gelmektedir."}, {"t": "Gecikmeksizin", "ok": false, "why": "'Gecikmeksizin' anlamı 'der-akab' zarfı ile karşılanır."}, {"t": "Bilerek", "ok": false, "why": "'Bilerek, kasten' anlamı 'bi'l-iltizâm' zarfı ile ifade edilir."}, {"t": "Dostça", "ok": false, "why": "'Dostça' anlamını veren zarf 'muhibbâne' kelimesidir."}], "hint": "Kelimenin kökü deniz veya hava yolunun zıttı olan coğrafi mekânı ifade eder.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Metinlerde geçen \"vakı'a\" (واقعا) zarfı Türkçe cümle içinde hangi anlama gelmektedir?", "o": [{"t": "Gerçi", "ok": true, "why": "'Vakı'a' kelimesi zarf olarak kullanıldığında 'gerçi, nitekim, her ne kadar' anlamını taşır."}, {"t": "Ne kadar", "ok": false, "why": "'Ne kadar' miktar sorusu Osmanlı Türkçesinde 'niçe' ile gösterilir."}, {"t": "Dışarı", "ok": false, "why": "'Dışarı' anlamındaki zarf 'bîrûn' kelimesidir."}, {"t": "Aceleyle", "ok": false, "why": "'Aceleyle' anlamı 'ber-vech-i ta'cîl' veya 'ale'l-acele' ifadeleriyle sağlanır."}], "hint": "Cümlede bir durumu kabullenip ardından zıt bir düşünceye geçiş yaparken kullanılan 'gerçi' bağlamını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde görülen geçmiş zaman 1. çoğul şahıs fiil çekiminde (örneğin \"bulduk\") fiil gövdesine getirilen eklerin yazılışı aşağıdakilerin hangisinde doğru verilmiştir?", "o": [{"t": "بولدق", "ok": true, "why": "Görülen geçmiş zaman eki 'dal' harfi ve 1. çoğul şahıs eki olan 'kaf' (kalın fiillerde) birleşimiyle 'بولدق' biçiminde yazılır."}, {"t": "بولدك", "ok": false, "why": "'بولدك' kelimesi 1. çoğul değil, 2. tekil şahıs ('buldun') çekimidir."}, {"t": "بولدم", "ok": false, "why": "'بولدم' kelimesi 1. tekil şahıs ('buldum') çekimidir."}, {"t": "بولديلر", "ok": false, "why": "'بولديلر' kelimesi 3. çoğul şahıs ('buldular') çekimidir."}], "hint": "1. çoğul şahıs ekinde kalın fiillere 'kaf' (ق), ince fiillere 'kef' (ك) getirilir.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı Türkçesinde zaman bildiren zarflardan \"boldur\" (veya \"bıldır\") kelimesi ne anlama gelmektedir?", "o": [{"t": "Geçen yıl", "ok": true, "why": "Eski Türkçe ve halk ağzında yaşayan 'boldur/bıldır' zarfı 'bir önceki yıl, geçen yıl' anlamında kullanılır."}, {"t": "Daha önce", "ok": false, "why": "'Daha önce' anlamını karşılayan zarf 'akdemce' kelimesidir."}, {"t": "Yıldan yıla", "ok": false, "why": "'Yıldan yıla' anlamını veren ifade Farsça kökenli 'sal be-sâl' birleşiğidir."}, {"t": "Nerede", "ok": false, "why": "'Nerede' anlamı soru zarfı olan 'kanda' ile sağlanır."}], "hint": "Bir önceki seneyi ifade eden geleneksel zaman zarfını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Osmanlı alfabesinde kullanılan rakamlar incelendiğinde, birbirinin zıttı yönlere bakan 7 ve 8 rakamlarının doğru gösterimi sırasıyla aşağıdakilerden hangisidir?", "o": [{"t": "٧ – ٨", "ok": true, "why": "7 rakamı 'v' harfi biçiminde (٧), 8 rakamı ise onun ters çevrilmiş hâli biçiminde (٨) yazılır."}, {"t": "٨ – ٧", "ok": false, "why": "Bu seçenekte rakamların sırası karıştırılmış olup ilk sembol 8, ikinci sembol 7'dir."}, {"t": "٦ – ۲", "ok": false, "why": "Bu semboller sırasıyla 6 ve 2 rakamlarını temsil etmektedir."}, {"t": "٤ – ٥", "ok": false, "why": "Bu semboller sırasıyla 4 ve 5 rakamlarını temsil etmektedir."}], "hint": "Yedi rakamı Latin alfabesindeki 'v' harfine benzer, sekiz ise onun tepe noktası yukarıda olan hâlidir.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Arapça ve Farsça kelimelerdeki uzun \"â\" ünlüsünü göstermek için metin içerisinde aşağıdaki harflerden hangisi kullanılır?", "o": [{"t": "Elif (ا)", "ok": true, "why": "Arapça ve Farsça kökenli sözcüklerde uzun \"â\" sesini temsil etmek için elif harfi bir uzatma harfi olarak görev yapar."}, {"t": "Vav (و)", "ok": false, "why": "Bu harf uzun \"â\" sesini değil, uzun \"û\" ünlüsünü veya ünsüz olan \"v\" sesini göstermek için kullanılır."}, {"t": "Ye (ى)", "ok": false, "why": "Bu harf kelime içinde veya sonunda uzun \"î\" ünlüsünü veya ünsüz olan \"y\" sesini karşılar."}, {"t": "Güzel he (ه)", "ok": false, "why": "Bu harf genellikle kelime sonunda kısa \"e\" ünlüsünü veya ünsüz olan \"h\" sesini göstermek için tercih edilir."}], "hint": "Arapça ve Farsçada uzun ünlüleri göstermek için kullanılan üç ana harften ilkidir.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Arapça ve Farsça kökenli kelimelerin başında bulunan \"u\" veya uzun \"û\" sesini ifade etmek için elif (ا) harfi hangi hareke ile birlikte kullanılır?", "o": [{"t": "Ötre", "ok": true, "why": "Kelime başında \"u\" veya \"û\" sesini verebilmek için elif harfinin üzerine ötre harekesi konulur."}, {"t": "Üstün", "ok": false, "why": "Elif harfi üzerine konulan üstün harekesi \"u\" sesini değil, \"a\" veya \"e\" seslerini üretir."}, {"t": "Esre", "ok": false, "why": "Elif harfinin altına konulan esre harekesi \"u\" sesini değil, \"ı\" veya \"i\" seslerini verir."}, {"t": "Cezm", "ok": false, "why": "Cezm bir ünlü harekesi olmayıp, harfin ünsüz ve harekesiz duraklama halini belirtir."}], "hint": "Sesin dudaklar büzülerek okunmasını sağlayan harekeyi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Farsların Arap alfabesini benimsedikten sonra eklediği ve Farsçaya özgü olan dört harfli grup aşağıdakilerden hangisidir?", "o": [{"t": "پ (pe), چ (çim), گ (gef), ژ (je)", "ok": true, "why": "Arap alfabesinde bulunmayan bu dört harf Fars dili tarafından eklenerek alfabe 32 harfe çıkarılmıştır."}, {"t": "ث (se), ح (ha), ذ (zel), ض (dad)", "ok": false, "why": "Bu harf grubu Farsçaya değil, doğrudan Arapça kelimelere özgü aslî ünsüzlerdir."}, {"t": "ص (sad), ض (dad), ط (tı), ظ (zı)", "ok": false, "why": "Bu harfler Farsların eklediği harfler olmayıp Arapçadaki kalın ünsüz grubunu oluşturur."}, {"t": "ع (ayın), غ (gayn), خ (hı), ك (kaf)", "ok": false, "why": "Bu harfler Arapçanın temel harfleridir ve Farsların alfabeye sonradan kazandırdığı sesler değildir."}], "hint": "Arap alfabesini 32 harfe çıkaran ek sesleri düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Farsça kelimelerde \"خ\" (hı) harfinden sonra yazıldığı halde okunmayan \"و\" (vav) harfine ne ad verilir?", "o": [{"t": "Vâv-ı ma'dûle", "ok": true, "why": "Yazıda yer aldığı halde okunmayan veya özel bir sesle telaffuz edilmeyen bu vav harfi vâv-ı ma'dûle olarak adlandırılır."}, {"t": "Vâv-ı atıf", "ok": false, "why": "Bu kavram kelimeleri veya cümleleri birbirine bağlayan bağlaç görevindeki vav için kullanılır."}, {"t": "Vâv-ı mef'ûl", "ok": false, "why": "Arapça türetme kalıplarında yer alan ve nesne durumu bildiren bir terim olup yazılıp okunmayan vavı açıklamaz."}, {"t": "Vâv-ı nisbet", "ok": false, "why": "Aitlik gösteren ekler veya yapısal durumlar için kullanılan bir kavramdır, okunmayan vav terimi değildir."}], "hint": "\"Uyku\" anlamına gelen \"خواب\" (hˇâb) ve \"sofra\" anlamına gelen \"خوان\" (hˇân) kelimelerindeki yazılıp okunmayan vavı hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Aşağıdaki harflerden hangisi yalnızca Arapça kelimelerde bulunan ve Türkçede ses karşılığı olmadığı için genellikle \"z\" (nadiren \"d\") sesiyle okunan harftir?", "o": [{"t": "ض (dad)", "ok": true, "why": "Arapçaya özgü bir ses olan dad harfi, Türkçeye geçen kelimelerde z sesiyle telaffuz edilir."}, {"t": "پ (pe)", "ok": false, "why": "Bu harf Arapçaya değil, Farsçaya özgüdür ve p sesiyle okunur."}, {"t": "چ (çim)", "ok": false, "why": "Bu harf Farsça kökenli olup ç sesini karşılar, z veya d sesiyle okunmaz."}, {"t": "ژ (je)", "ok": false, "why": "Farsça ve Batı dillerinden geçen kelimelerde görülen bu harf j sesini temsil eder."}], "hint": "Türkçeye geçen Arapça kelimelerde z sesiyle telaffuz edilen kalın ünsüz harfi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Bir kelimenin yapısında veya başında \"ژ\" (je) harfinin yer alması, o kelimenin kökeni hakkında aşağıdaki yargılardan hangisini kesinleştirir?", "o": [{"t": "Kelimenin Farsça (veya Batı dillerinden geçmiş) olduğunu gösterir.", "ok": true, "why": "Je harfi Arapçada ve öz Türkçe kelimelerde bulunmaz; yalnızca Farsça ve Batı kökenli sözcüklerde yer alır."}, {"t": "Kelimenin öz Türkçe bir kökten geldiğini doğrular.", "ok": false, "why": "Öz Türkçe kelimelerin yapısında ve başında j sesi/harfi bulunmaz."}, {"t": "Kelimenin Arapça bükünlü bir kökten türediğini gösterir.", "ok": false, "why": "Arap alfabesinde j (ژ) harfi yer almadığı için Arapça sözcüklerde bulunamaz."}, {"t": "Kelimenin Göktürkçe dönemine ait bir ek aldığını kanıtlar.", "ok": false, "why": "Tarihî Türkçe dönemlerinde j sesi yer almamaktadır."}], "hint": "Arapçada bulunmayan, Fars alfabesine eklenip Osmanlıcaya geçen sesin kullanım alanını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Hicrî-Kamerî takvim sisteminde bir ayın ilk gününü ifade etmek için kullanılan kalıp terim aşağıdakilerden hangisidir?", "o": [{"t": "Gurre", "ok": true, "why": "Hicrî ayların ilk gününü belirtmek amacıyla resmî ve edebî metinlerde gurre terimi kullanılır."}, {"t": "Selh", "ok": false, "why": "Selh terimi ayın ilk gününü değil, tam aksine ayın son gününü ifade etmek için tercih edilir."}, {"t": "Evâ'il", "ok": false, "why": "Evâ'il terimi tek bir günü değil, ayın ilk on günlük (1-10) zaman dilimini kapsar."}, {"t": "Evâsıt", "ok": false, "why": "Evâsıt kavramı ayın ikinci on günlük (11-20) dönemini ifade eder."}], "hint": "Ayın son günü olan \"selh\" veya ilk on günü olan \"evâ'il\" terimleri ile karıştırmayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Hicrî takvimde ayın 11 ile 20. günleri arasındaki ikinci on günlük dönemi tanımlamak için kullanılan terim aşağıdakilerden hangisidir?", "o": [{"t": "Evâsıt", "ok": true, "why": "Arapçada \"orta\" kökünden gelen evâsıt terimi, ayın ortasındaki ikinci on günlük zaman dilimini ifade eder."}, {"t": "Evâ'il", "ok": false, "why": "Evâ'il terimi ayın birinci on günlük (1-10) başlangıç dönemini kapsar."}, {"t": "Evâhir", "ok": false, "why": "Evâhir terimi ayın son on günlük (21-30) bitiş dönemini tanımlar."}, {"t": "Gurre", "ok": false, "why": "Gurre terimi on günlük bir dönemi değil, yalnızca ayın birinci gününü gösterir."}], "hint": "Arapçada \"orta\" anlamına gelen kökten türeyen kavrama odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Hicrî ay adlarının resmî belgelerde kullanılan rumuz veya kısaltmalarında \"رمضان\" (Ramazan) ayı hangi harf ile temsil edilir?", "o": [{"t": "ن (nun)", "ok": true, "why": "Ramazan ayının resmî belge ve yazışmalardaki geleneksel kısaltması kelimenin sonundaki \"ن\" harfidir."}, {"t": "ر (rı)", "ok": false, "why": "Rı harfi Ramazan ayının değil, Rebî'ü'l-âhire ayının kısaltmasıdır."}, {"t": "ش (şın)", "ok": false, "why": "Şın harfi Ramazan ayının değil, Şa'bân ayının resmî kısaltmasıdır."}, {"t": "ص (sad)", "ok": false, "why": "Sad harfi Ramazan ayını değil, Safer ayını temsil eden kısaltmadır."}], "hint": "Ramazan kelimesinin son harfi olan işaretin kısaltma olarak kullanıldığını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Farsçada \"gün\" anlamına gelen \"şenbe\" kelimesinden hareketle, \"Düşenbe\" ifadesi günümüz Türkçesinde hangi güne karşılık gelmektedir?", "o": [{"t": "Pazartesi", "ok": true, "why": "Farsçada \"dü\" (iki) ve \"şenbe\" (gün) kelimelerinin birleşimiyle oluşan Düşenbe, haftanın ikinci günü kabul edilen Pazartesi günüdür."}, {"t": "Pazar", "ok": false, "why": "Pazar günü Farsçada \"Yekşenbe\" (birinci gün) şeklinde adlandırılır."}, {"t": "Salı", "ok": false, "why": "Salı günü Farsçada \"Seşenbe\" (üçüncü gün) ifadesiyle karşılanır."}, {"t": "Çarşamba", "ok": false, "why": "Çarşamba günü Farsçada \"Çehârşenbe\" (dördüncü gün) olarak isim almaktadır."}], "hint": "Farsça sıra sayılarında \"dü\" iki demektir; haftanın ikinci günü olarak değerlendirilen günü seçiniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Osmanlı Türkçesinde metin içinde geçen \"خمسه و مائه والف\" (Hamse ve mi'e ve elf) ifadesinin rakamla gösterimi aşağıdakilerden hangisidir?", "o": [{"t": "١١٠٥", "ok": true, "why": "Arapça sayılarda elf (1000) + mi'e (100) + hamse (5) toplamı 1105 eder ve rakamlar soldan sağa \"١١٠٥\" şeklinde yazılır."}, {"t": "١٢٠٨", "ok": false, "why": "Bu rakam dizilimi (1208) \"semâniye ve mi'eteyn ve elf\" ifadesinin karşılığıdır."}, {"t": "١١١٨", "ok": false, "why": "Bu rakam dizilimi (1118) \"semâniye ve aşara mi'e ve elf\" ifadesine karşılık gelir."}, {"t": "١٠٠٥", "ok": false, "why": "Bu sayı 1005 olup yüzlük basamağı belirten \"mi'e\" sözcüğünü içermez."}], "hint": "Sayı isimleri soldan sağa basamak değerlerine göre çözümlenir: hamse (5), mi'e (100), elf (1000).", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Aşağıdaki harf çiftinden hangisi yabancı (Arapça veya Farsça) kökenli kelimeleri tanımada kullanılır ve birkaç istisna dışında öz Türkçe kelimelerde yer almaz?", "o": [{"t": "خ (hı) ve ذ (zel)", "ok": true, "why": "Hı ve zel harfleri Arapça ve Farsça kelimelere özgüdür; Türkçe kelimelerde birkaç istisna (\"han\" gibi) dışında kullanılmazlar."}, {"t": "ب (be) ve ت (te)", "ok": false, "why": "Be ve te harfleri öz Türkçe sözcüklerin imlasında da sıkça kullanılan temel harflerdendir."}, {"t": "د (dal) ve ر (rı)", "ok": false, "why": "Dal ve rı harfleri Türkçe kelimelerde geniş bir kullanım alanına sahiptir."}, {"t": "ك (kaf) ve ل (lam)", "ok": false, "why": "Kef ve lam harfleri Türkçe kökenli sözcüklerin yazımında yaygın olarak yer alır."}], "hint": "Biri \"h\" sesine yakındır, diğeri ise peltek okunan ve Türkçe kökenli sözcüklerde bulunmayan harflerdendir.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Arapça ve Farsça kökenli kelimelerin sonunda yer alan kısa \"e\" sesini göstermek için aşağıdaki harflerden hangisi tercih edilir?", "o": [{"t": "Güzel he (ه)", "ok": true, "why": "Arapça ve Farsça kelimelerin sonunda yer alan kısa \"e\" ünlüsü güzel he harfi ile gösterilir (çeşme - چشمه gibi)."}, {"t": "Elif (ا)", "ok": false, "why": "Kelime sonundaki elif harfi kısa \"e\" ünlüsünü değil, uzun \"â\" ünlüsünü temsil eder."}, {"t": "Ye (ى)", "ok": false, "why": "Kelime sonundaki ye harfi kısa \"e\" sesini değil, uzun \"î\" veya kısa \"i\" seslerini karşılar."}, {"t": "Vav (و)", "ok": false, "why": "Kelime sonundaki vav harfi \"e\" ünlüsünü değil, \"u/ü/o/ö\" veya uzun \"û\" seslerini gösterir."}], "hint": "\"Çeşme\" (چشمه) ve \"beyhûde\" (بيهوده) kelimelerinin son harfini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Arap dilinin genel yapısı ve kelime türetme mantığı ile ilgili aşağıdakilerden hangi ifade doğrudur?", "o": [{"t": "Kelimelerin anlamını değiştirmek ve yeni manalar türetmek için kelime kökünün başına, ortasına veya sonuna zâid sesler getirilerek bükünlü (tasrîfli) bir yapı oluşturulur.", "ok": true, "why": "Arapça bükünlü bir dil olduğu için kelime kökü içerisindeki ses değişimi ve eklenen zâid harfler vasıtasıyla yeni kavramlar türetilir."}, {"t": "Kelime kökleri hiçbir zaman değişikliğe uğramaz ve yalnızca sonuna getirilen eklerle yeni kelimeler elde edilir.", "ok": false, "why": "Bu durum bitişken (eklemeli) diller için geçerlidir; Arapçada ise kelime kökünün iç yapısı kırılarak veya genişletilerek türetme yapılır."}, {"t": "Osmanlı Türkçesinde Arapça kökenli fiiller çekimlenerek ve cümle içinde yüklem yapılarak yoğun şekilde kullanılmıştır.", "ok": false, "why": "Osmanlı Türkçesinde Arapçadan fiiller çekimli halleriyle değil, çoğunlukla isim ve masdar formlarıyla ödünç alınmıştır."}, {"t": "Arapçada kelimeler türetilirken aslî harfler tamamen çıkarılır ve sadece zâid harflerden oluşan yeni kelimeler kurulur.", "ok": false, "why": "Kelime türetiminde aslî (kök) harfler korunur veya kalıba göre düzenlenir; aslî harflerin tamamen atılması söz konusu değildir."}], "hint": "Arapçanın bükünlü (tasrîfli) yapısını ve köke eklenen zâid seslerin işlevini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Arapça kelimelerin vezinleri çıkarılırken kelimenin birinci, ikinci ve üçüncü aslî (kök) harflerinin yerine sırasıyla hangi harfler yazılır?", "o": [{"t": "ف (fe) – ع (ayn) – ل (lam)", "ok": true, "why": "Arapçada vezin kalıbı oluşturulurken birinci kök harf fe, ikinci kök harf ayn, üçüncü kök harf ise lam temsilci harfleriyle gösterilir."}, {"t": "ا (elif) – ب (be) – ت (te)", "ok": false, "why": "Bu harfler alfabenin ilk harfleri olup gramerde vezin temsili için kullanılan standart sembol harfler değildir."}, {"t": "م (mim) – ن (nun) – ه (he)", "ok": false, "why": "Bu harfler genellikle kelimelere türetme aşamasında eklenen zâid harfler arasında yer alır."}, {"t": "س (sin) – ت (te) – م (mim)", "ok": false, "why": "Söz konusu harfler vezin kalıbını oluşturmak için kök harfleri temsil etmez, türetme ekleri olarak zâid harflerde kullanılır."}], "hint": "Arap gramerinde vezin kalıbı oluşturulurken standart olarak seçilen üç sembolik kök harfi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Arapçada \"كرم\" (k-r-m) kökünden türetilen \"اِكْرَام\" (ikrâm) kelimesinin vezni aşağıdakilerden hangisidir?", "o": [{"t": "إفعال (if‘âl)", "ok": true, "why": "Kök harfler (k-r-m) yerlerine fe-ayn-lam konulup baştaki esreli elif ve dördüncü sıradaki üstünlü elif zâid harfleri eklendiğinde if'âl kalıbı elde edilir."}, {"t": "فَعَل (fa‘al)", "ok": false, "why": "Bu kalıp üç aslî harften oluşan ve zâid harf içermeyen yalın masdar kalıbıdır."}, {"t": "مَفْعُول (mef‘ûl)", "ok": false, "why": "Bu kalıp başında mim ve dördüncü harfinde vav bulunan edilgen sıfat (ism-i mef'ûl) kalıbıdır."}, {"t": "تَفَعُّل (tefa‘‘ul)", "ok": false, "why": "Bu kalıp başında te bulunan ve ikinci kök harfi şeddeli olan farklı bir masdar babıdır."}], "hint": "Kelimenin başındaki elif (ا) ve dördüncü sırasındaki uzun elif (ا) zâid harflerdir.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "\"مَجْهُول\" (mechûl) kelimesinin aslî ve zâid harfleri dikkate alındığında vezni aşağıdakilerden hangisi olur?", "o": [{"t": "مَفْعُول (mef‘ûl)", "ok": true, "why": "Kök harfleri 'c-h-l' olan kelimenin başına ötreli mim ve üçüncü harfinden sonra vav gelerek mef'ûl vezni oluşmuştur."}, {"t": "فَاعِل (fâ‘il)", "ok": false, "why": "Fâ'il kalıbı etken sıfat yapısında olup ilk harfinden sonra elif alan üç kök harfli yapıdır."}, {"t": "اِفْتِعَال (ifti‘âl)", "ok": false, "why": "İfti'âl kalıbı beş harfli bir mezidünfih masdar veznidir."}, {"t": "فَعَلَة (fe‘ale)", "ok": false, "why": "Fe'ale kalıbı çoğul veya isim kalıbı olarak kullanılır ve mim/vav zâid harflerini barındırmaz."}], "hint": "Mim harfiyle başlayan ve dördüncü harfinde uzun u (و) barındıran edilgen sıfat kalıbını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Aşağıdakilerden hangisi Arapça isimlerde dişil (müennes) yapıyı gösteren açık alametlerden biri değildir?", "o": [{"t": "Kelimenin başında zâid mim (م) harfinin bulunması", "ok": true, "why": "Baştaki mim harfi müenneslik eki değildir; genellikle mekân, zaman, alet isimleri veya ism-i mef'ûl yapımında kullanılan bir zâid harftir."}, {"t": "Kelime sonunda kapalı te (ة / ت) veya he (ه) bulunması", "ok": false, "why": "Kelime sonundaki kapalı te veya okutucu he harfi en yaygın dişil (müennes) alametidir."}, {"t": "Kelime sonunda kısa elif (elif-i maksûre, ى) bulunması", "ok": false, "why": "Kelime sonunda 'a' sesini veren ve 'ye' şeklinde yazılan elif-i maksûre belirgin bir müenneslik ekidir."}, {"t": "Kelime sonunda uzun elif (elif-i memdûde, اء / ا) bulunması", "ok": false, "why": "Kelime sonundaki uzatılan elif (elif-i memdûde) sıfatlarda ve isimlerde dişilik gösteren alametlerdendir."}], "hint": "Dişilik belirten son ekler ile isim türetmede kullanılan ön ekleri ayırt ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Kendisinde herhangi bir müenneslik alameti bulunmadığı hâlde anlamı veya sözlüksel kullanımı gereği dişil kabul edilen \"mü'ennes-i ma'nevî\" veya \"semâî müennes\" kelimelere aşağıdakilerden hangisi örnektir?", "o": [{"t": "ارض (arz) ve نار (nâr)", "ok": true, "why": "Arz (yer) ve nâr (ateş) kelimeleri biçimsel bir dişilik eki taşımamalarına rağmen semâî müennes kabul edilen sözcüklerdendir."}, {"t": "kâtib (كاتب) ve me'mûr (مأمور)", "ok": false, "why": "Bu kelimeler eril (müzekker) yapıda olup isim/sıfat kategorisindedir."}, {"t": "ahmer (احمر) ve esved (اسود)", "ok": false, "why": "Bu kelimeler renk bildiren eril (müzekker) sıfat kalıbındadır; dişil halleri hamrâ ve sevdâ şeklindedir."}, {"t": "mu'allim (معلم) ve sâbir (صابر)", "ok": false, "why": "Her iki sözcük de dişil eki taşımayan kurallı eril sıfatlardır."}], "hint": "Sözlükten veya işitilerek dişil kabul edilen coğrafi ve tabiat unsurlarını içeren örnekleri düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Arapçada iki nesneyi veya kavramı ifade etmek için kullanılan \"tesniye\" (ikilik) yapısı Osmanlı Türkçesinde çoğunlukla hangi ek ile sağlanır?", "o": [{"t": "–eyn (ـَيْن)", "ok": true, "why": "Osmanlı Türkçesinde iki kavramı bir arada ifade etmek için tekil ismin sonuna –eyn eki getirilir (örn. devleteyn, tarafeyn)."}, {"t": "–ât (ات)", "ok": false, "why": "–ât eki ikilik değil, çoğul (cem'-i mü'ennes-i sâlim) yapmak için kullanılır."}, {"t": "–în (ين)", "ok": false, "why": "Uzun i sesi veren –în eki cem'-i müzekker-i sâlim (eril çoğul) yapımında kullanılır."}, {"t": "–iyye (يه)", "ok": false, "why": "–iyye eki nispet ve soyut masdar yapımında kullanılır, ikilik anlamı katmaz."}], "hint": "Arapçada iki nesne veya durum için kullanılan özel ikilik ekini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "\"Taraf\" (طرف) kelimesinin tesniye (ikilik) biçimi aşağıdakilerden hangisidir?", "o": [{"t": "Tarafeyn (طرفين)", "ok": true, "why": "Taraf kelimesine ikilik eki olan –eyn getirilerek 'iki taraf' anlamına gelen tarafeyn yapısı oluşturulur."}, {"t": "Etrâf (اطراف)", "ok": false, "why": "Etrâf kelimesi taraf sözcüğünün ikilik değil, çoğul (cem'-i mükesser) halidir."}, {"t": "Tarafât (طرفات)", "ok": false, "why": "Dişil çoğul eki olan –ât ile yapılan bu form ikilik anlamı taşımaz."}, {"t": "Tarafûn (طرفون)", "ok": false, "why": "–ûn eki eril çoğul yapımında kullanılır, ikilik bildiren cezm kalıbından farklıdır."}], "hint": "Doğu ve batı için kullanılan 'maşrıkeyn' veya iki deniz için kullanılan 'bahreyn' örneklerindeki eki hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Akıllı varlıklara (zevi'l-ukūl) ait eril sıfatların ve isimlerin cem'-i müzekker-i sâlim (düzenli eril çoğul) yapılması için kelime sonuna yaygın olarak hangi ek getirilir?", "o": [{"t": "–în (ين) / –ûn (ون)", "ok": true, "why": "Osmanlı Türkçesinde akıllı varlıkların eril sıfatları ve isimleri tekil halin sonuna –în (veya –ûn) eki getirilerek kurallı çoğul yapılır (örn. me'mûrîn, mü'minîn)."}, {"t": "–ât (ات)", "ok": false, "why": "–ât eki dişil varlıkların ve masdarların kurallı çoğulunda kullanılır."}, {"t": "–eyn (ين - cezmli)", "ok": false, "why": "Cezmli okunarak eyn sesini veren yapı çoğul değil, tesniye (ikilik) bildirir."}, {"t": "–ân (ان)", "ok": false, "why": "–ân eki Farsça çoğul eki veya Arapça tesniye alternatifi olup standart eril çoğul biçimi değildir."}], "hint": "Memur, mümin ve muallim gibi akıllı varlıkların kurallı çoğul yapılma şeklini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Osmanlı Türkçesinde masdarların ve dişil isimlerin sonuna \"–ât\" (ات) eki getirilerek yapılan çoğul türü aşağıdakilerden hangisidir?", "o": [{"t": "Cem‘-i Mü’ennes-i Sâlim", "ok": true, "why": "Düzenli dişil çoğul olarak adlandırılan cem'-i mü'ennes-i sâlim, kelimelerin sonuna –ât eki getirilerek oluşturulur (örn. hissiyyât, nakliyyât)."}, {"t": "Cem‘-i Müzekker-i Sâlim", "ok": false, "why": "Cem'-i müzekker-i sâlim yapısı –ât ile değil, –în veya –ûn ekleri ile kurulur."}, {"t": "Cem‘-i Mükesser", "ok": false, "why": "Cem'-i mükesser düzensiz (kırık) çoğul olup eklerle değil, vezin değişimiyle elde edilir."}, {"t": "Tesniye", "ok": false, "why": "Tesniye iki adedi gösteren ikilik yapısıdır, çoğul kategorisinde yer almaz."}], "hint": "Hissiyyât, neşriyyât ve edebiyyât örneklerinde görülen kurallı çoğul türünü hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "\"Kâtib\" (katip) -> \"Küttâb\" (katipler), \"Hâkim\" -> \"Hükkâm\", \"Tâlib\" -> \"Tullâb\" çoğul kelimeleri hangi cem'-i mükesser (kırık çoğul) veznindedir?", "o": [{"t": "Fu‘‘âl (فُعَّال)", "ok": true, "why": "Fâ'il veznindeki meslek ve sıfat isimlerinin kırık çoğulu çoğunlukla ilk harfi ötreli, ikinci harfi şeddeli fu‘‘âl vezninde yapılır (küttâb, hükkâm, tullâb)."}, {"t": "Ef‘âl (َافْـَعال)", "ok": false, "why": "Ef'âl kalıbı başı elifli olan farklı bir kırık çoğul veznidir (örn. eser -> âsâr)."}, {"t": "Mefâ‘il (َمَفاِعل)", "ok": false, "why": "Mefâ'il kalıbı meclis -> mecâlis örneğinde olduğu gibi mim ile başlayan dört harfli kelimelerin çoğul kalıbıdır."}, {"t": "Fi‘âl (ِفَعاْل)", "ok": false, "why": "Fi'âl kalıbının ilk harfi esreli olup cebel -> cibâl veya recül -> ricâl kelimelerinde görülür."}], "hint": "Fâ'il veznindeki meslek veya sıfat isimlerinin çoğullaştırılmasında kullanılan ve ikinci harfi şeddeli olan kalıbı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Tekil kelimenin yapısı ve vezni değiştirilerek oluşturulan \"Cem'-i Mükesser\" (kırık çoğul) ile ilgili aşağıdakilerden hangi ifade doğrudur?", "o": [{"t": "Kurallı bir ek getirmek yerine tekil kelimenin kök yapısına ve veznine müdahale edilerek elde edilen semâî çoğullardır.", "ok": true, "why": "Cem'-i mükesser, ek ekleyerek değil kelimenin iç ses düzenini ve veznini değiştirerek yapılan semâî (işitilerek öğrenilen) kırık çoğuldur."}, {"t": "Yalnızca –ât eki kullanılarak tekil kelimenin sonuna ek yapılmasıyla elde edilir.", "ok": false, "why": "–ât eki ile yapılan çoğullar kırık çoğul değil, kurallı (sâlim) dişil çoğuldur."}, {"t": "Sadece akılsız varlıkların ikili (tesniye) durumlarını göstermek için kullanılır.", "ok": false, "why": "Cem'-i mükesser iki adedi değil, üç ve daha fazla çoğul durumları ifade eder."}, {"t": "Osmanlı Türkçesinde fiil çekimlerini çoğul yapmak için kullanılan temel kuraldır.", "ok": false, "why": "Cem'-i mükesser fiillere değil, Arapça isim ve sıfatlara uygulanan bir çoğaltma yöntemidir."}], "hint": "Kırık çoğulun kurala bağlı eklerle değil, kelime kalıbının değiştirilmesiyle (semâî) oluştuğunu dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "\"Meclis\" (مجلس) kelimesinin cem'-i mükesser (kırık çoğul) biçimi olan \"Mecâlis\" (مجالس) kelimesinin vezni aşağıdakilerden hangisidir?", "o": [{"t": "Mefâ‘il (مَفَاعِل)", "ok": true, "why": "Meclis kelimesindeki m-c-l-s düzeni kırık çoğul kalıbına sokulduğunda mefâ'il vezni (mecâlis) ortaya çıkar."}, {"t": "Fe‘âlîl (فَعَالِيل)", "ok": false, "why": "Fe'âlîl kalıbı kandîl -> kanâdîl örneğinde olduğu gibi uzun i sesi barındıran beş harfli çoğul yapısıdır."}, {"t": "Ef‘ile (أَفْعِلَة)", "ok": false, "why": "Ef'ile kalıbı mekân -> emkine veya cevâb -> ecvibe örneklerinde görülen başında elif bulunan kalıptır."}, {"t": "Fu‘alâ (فُعَلَاء)", "ok": false, "why": "Fu'alâ kalıbı şerîk -> şürekâ örneğinde görülen sonu hemzeli çoğul yapısıdır."}], "hint": "İlk harfi mim (m) ile başlayan isimlerin çoğullaştırılmasında kullanılan mefâ'il kalıbını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Arapça kelime yapısında aslî harflerinde illet harfi (ا، و، ی), hemze veya şedde/harf tekrarı bulunmayan sahih kelimelere ne ad verilir?", "o": [{"t": "Sâlim", "ok": true, "why": "Aslî harflerinde illet harfi, hemze ve şeddeli harf tekrarı bulunmayan kelimeler sahih grubunun sâlim kısmını oluşturur."}, {"t": "Mehmûz", "ok": false, "why": "Mehmûz kelimelerin aslî harflerinden biri hemze içerdiği için bu tanıma uymaz."}, {"t": "Muzâ'af", "ok": false, "why": "Muzâ'af kelimelerde ikinci ve üçüncü aslî harfler aynı olup şeddeli tekrar oluşturur."}, {"t": "Misâl", "ok": false, "why": "Misâl kelimeler sahih değil, ilk harfi illetli olan mu'tell kelimelerdendir."}], "hint": "Sahih kelimelerin herhangi bir illet, hemze veya harf tekrarı barındırmayan en yalın türünü düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Aksâm-ı seb'a sınıflandırmasına göre 'vakt' (وقت) kelimesi ilk aslî harfi illetli olduğu için hangi grupta yer almaktadır?", "o": [{"t": "Misâl", "ok": true, "why": "Kök harflerinden birincisi 'vav' veya 'ye' olan illetli kelimeler misâl kategorisindedir."}, {"t": "Ecvef", "ok": false, "why": "Ecvef kelimelerin ilk harfi değil, orta (ikinci) aslî harfi illetlidir."}, {"t": "Nâkıs", "ok": false, "why": "Nâkıs kelimelerde illet harfi birinci konumda değil, son (üçüncü) aslî harf konumundadır."}, {"t": "Lefîf", "ok": false, "why": "Lefîf kelimelerde tek bir illet harfi değil, iki ayrı aslî illet harfi yer alır."}], "hint": "Kelimenin başındaki ilk kök harfin illetli olmasına odaklanın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "'Edeb' (أدب) ve 'emr' (امر) kelimelerinde olduğu gibi kök harflerinden biri hemze olan sahih kelimeler aksâm-ı seb'ada nasıl adlandırılır?", "o": [{"t": "Mehmûz", "ok": true, "why": "Aslî harflerinden biri hemze olan sahih kelimeler mehmûz olarak adlandırılır."}, {"t": "Sâlim", "ok": false, "why": "Sâlim kelimelerde hemze bulunmaması şartı vardır."}, {"t": "Muzâ'af", "ok": false, "why": "Muzâ'af kelimeler kök harflerinin ikincisi ve üçüncüsü aynı olan kelimelerdir."}, {"t": "Ecvef", "ok": false, "why": "Ecvef sınıfı sahih kelimeleri değil, orta harfi illetli kelimeleri kapsar."}], "hint": "Terimin kökeni Arapçada 'hemze' barındırma durumuna dayanmaktadır.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Aksâm-ı seb'a kurallarına göre 'nevm' (نوم) kelimesi orta harfi illetli ('vav') olduğu için hangi gruba girer?", "o": [{"t": "Ecvef", "ok": true, "why": "İkinci (orta) aslî harfi illetli olan kelimeler ecvef olarak sınıflandırılır."}, {"t": "Misâl", "ok": false, "why": "Misâl grubunda illet harfi kelimenin ortasında değil ilk harfindedir."}, {"t": "Nâkıs", "ok": false, "why": "Nâkıs grubundaki kelimelerin illet harfi son kök harfidir."}, {"t": "Sâlim", "ok": false, "why": "Sâlim kelimelerde hiç illet harfi bulunmaz."}], "hint": "Kelimenin 'içi/ortası oyuk' anlamına da gelen, orta harfi illetli kelime türünü hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Aşağıdaki kelimelerden hangisi kökünün başına eklenen zâid 'mîm' (م) harfiyle oluşturulmuş bir mimli masdardır?", "o": [{"t": "Maksad (مقصد)", "ok": true, "why": "'Maksad' kelimesi kasd kökünün başına zâid mîm getirilerek yapılmış bir mimli masdardır."}, {"t": "Mükrim (مكرم)", "ok": false, "why": "'Mükrim' kelimesi masdar değil, fâil (yapan) anlamı taşıyan ism-i fâildir."}, {"t": "Metrûk (متروك)", "ok": false, "why": "'Metrûk' kelimesi masdar olmayıp mef'ûl vezninde bir ism-i mef'ûldür."}, {"t": "Müdâvemet (مداومت)", "ok": false, "why": "'Müdâvemet' kelimesi mufâ'ale babından bir mezîdünfih masdardır."}], "hint": "Yalın kök harflerinin önüne eklenen mîm harfiyle masdarlaşan yapılara odaklanın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Arapçada kelimelerin sonuna 'iyyet' (يت) eki getirilerek oluşturulan yapay masdarlara ne ad verilir?", "o": [{"t": "Mec'ûl masdar", "ok": true, "why": "Kelime sonuna 'iyyet' eki eklenerek sonradan yapılan mastarlara mec'ûl masdar denir."}, {"t": "Mimli masdar", "ok": false, "why": "Mimli masdarlar kelimenin sonuna ekle değil, başına zâid mîm getirilerek yapılır."}, {"t": "Sülâsî mücerred masdar", "ok": false, "why": "Sülâsî mücerred masdarlar ek almamış üç kök harfli yalın masdarlardır."}, {"t": "Rubâ'î masdar", "ok": false, "why": "Rubâ'î masdarlar ekle değil, doğrudan dört kök harfle kurulan mastarlardır."}], "hint": "Yapay olarak sonradan oluşturulmuş, kurgulanmış masdar anlamındaki terimi hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "'Vaz'iyet' (وضعيت) kelimesi masdar yapısı bakımından aşağıdakilerden hangisine bir örnektir?", "o": [{"t": "Mec'ûl masdar", "ok": true, "why": "'Vaz'' kelimesine 'iyyet' eki eklenerek yapay masdar üretildiği için mec'ûl masdardır."}, {"t": "Mimli masdar", "ok": false, "why": "Kelimenin başında zâid bir mîm harfi yer almadığı için mimli masdar değildir."}, {"t": "Sülâsî mücerred masdar", "ok": false, "why": "Yalın üç harfli kök halinde kalmayıp ek aldığı için mücerred sayılmaz."}, {"t": "Rubâ'î masdar", "ok": false, "why": "Dört aslî kök harfe sahip olmayıp ekle türetilmiştir."}], "hint": "Kelimenin sonundaki '-iyet / -iyyet' ekine dikkat edin.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Sülâsî mücerred masdarlardan işi yapanı gösteren 'ism-i fâ'il' türetilirken aşağıdaki vezinlerden hangisi kullanılır?", "o": [{"t": "Fâ'il (فَاعِل)", "ok": true, "why": "Üç kök harfli sülâsî mücerred masdarların etken özne biçimi (ism-i fâ'ili) fâ'il vezniyle yapılır."}, {"t": "Mef'ûl (مَفْعُول)", "ok": false, "why": "Mef'ûl vezni işi yapanı değil, işten etkileneni (ism-i mef'ûlü) gösterir."}, {"t": "Mufa'lil (مُفَعْلِل)", "ok": false, "why": "Mufa'lil vezni sülâsî değil, rubâ'î mücerred masdarların ism-i fâ'ilidir."}, {"t": "Mufa'lel (مُفَعْلَل)", "ok": false, "why": "Mufa'lel vezni rubâ'î masdarların ism-i mef'ûlü için kullanılır."}], "hint": "'Kâtib', 'şâkir', 'hâfız' gibi kelimelerin ortak kalıbını düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Sülâsî mücerred bir masdardan yapılan işten etkilenen unsuru gösteren 'ism-i mef'ûl' hangi vezin ile elde edilir?", "o": [{"t": "Mef'ûl (مَفْعُول)", "ok": true, "why": "Üç harfli yalın masdarların edilgen nesne hali (ism-i mef'ûlü) mef'ûl kalıbıyla türetilir."}, {"t": "Fâ'il (فَاعِل)", "ok": false, "why": "Fâ'il kalıbı edilgen nesneyi değil, etken özneyi türetmek için kullanılır."}, {"t": "Fu'ûl (فُعُول)", "ok": false, "why": "Fu'ûl bir ism-i mef'ûl kalıbı değil, sülâsî masdar kalıplarından biridir."}, {"t": "Mufa'lel (مُفَعْلَل)", "ok": false, "why": "Mufa'lel kalıbı üç harfli masdarların değil, dört kök harfli rubâ'î masdarların ism-i mef'ûlüdür."}], "hint": "'Mektûb', 'mahfûz', 'maktu'' gibi kelimelerin türetildiği standart kalıbı hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Dört kök harfli (rubâ'î) mücerred masdarların ism-i fâ'ilini türetmek için aşağıdaki vezinlerden hangisi kullanılır?", "o": [{"t": "Mufa'lil (مُفَعْلِل)", "ok": true, "why": "Rubâ'î mücerred masdarların etken yapanı (ism-i fâ'ili) mufa'lil vezni ile yapılır."}, {"t": "Mufa'lel (مُفَعْلَل)", "ok": false, "why": "Mufa'lel vezni rubâ'î masdarların ism-i fâ'ili değil, ism-i mef'ûlüdür."}, {"t": "Fâ'il (فَاعِل)", "ok": false, "why": "Fâ'il vezni rubâ'î masdarlar için değil, sülâsî (üç harfli) masdarlar için kullanılır."}, {"t": "Mef'ûl (مَفْعُول)", "ok": false, "why": "Mef'ûl vezni sülâsî masdarların edilgen nesne halidir."}], "hint": "Başı 'mu-' ile başlayıp son harekesi esreli olan dört harfli kök kalıbını arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Aşağıdaki kelimelerden hangisi dört aslî kök harften oluşan bir 'rubâ'î masdar' örneğidir?", "o": [{"t": "Saltanat (سلطنت)", "ok": true, "why": "'Saltanat' kelimesi bünyesinde dört aslî kök harf barındıran mücerred rubâ'î masdardır."}, {"t": "Maslahat (مصلحت)", "ok": false, "why": "'Maslahat' mimli masdar yapısındadır, rubâ'î masdar değildir."}, {"t": "Vaz'iyet (وضعيت)", "ok": false, "why": "'Vaz'iyet' türetilmiş bir mec'ûl masdardır."}, {"t": "Mansıb (منصب)", "ok": false, "why": "'Mansıb' kelimesi zâid mîm içeren mimli masdardır."}], "hint": "Kökünde üç değil, dört asli harf bulunduran kelimeler grubunu düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Aksâm-ı seb'ada 'nâkıs' kelime grubu ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": [{"t": "Kelimenin üçüncü (son) aslî harfi illetlidir.", "ok": true, "why": "Nâkıs kelimelerde sonuncu kök harfi 'vav', 'ye' veya 'elif' olan illetli harftir."}, {"t": "Kelimenin birinci aslî harfi illetlidir.", "ok": false, "why": "Birinci aslî harfi illetli olan kelimeler nâkıs değil, misâl kelimelerdir."}, {"t": "Kelimenin ikinci (orta) aslî harfi illetlidir.", "ok": false, "why": "Orta harfi illetli olanlar nâkıs değil, ecvef kelimelerdir."}, {"t": "Kelimenin iki aslî harfi birden illetlidir.", "ok": false, "why": "İki aslî harfi illetli olan kelimeler lefîf kategorisindedir."}], "hint": "İllet harfinin kelimenin en sonunda bulunması durumunu göz önüne alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Sülâsî mücerred bir kelime İf‘âl bâbına aktarıldığında oluşan etken sıfat (ism-i fâ‘il) hangi vezinde gelir?", "o": [{"t": "müf‘il", "ok": true, "why": "İf‘âl bâbının etken yapıda işi yapanı gösteren ism-i fâ‘ili, başa ötreli mîm getirilip aynü'l-fiilin esrelenmesiyle müf‘il vezninde oluşur."}, {"t": "müf‘al", "ok": false, "why": "Müf‘al vezni, İf‘âl bâbının etken ismi değil edilgen yapıdaki ism-i mef‘ûlüne ait kalıptır."}, {"t": "mufa‘‘il", "ok": false, "why": "Mufa‘‘il vezni şeddeli orta harfiyle Tef‘îl bâbının ism-i fâ‘il kalıbıdır."}, {"t": "mütefa‘‘il", "ok": false, "why": "Mütefa‘‘il vezni başında 'müte-' eki bulunan Tefa‘‘ul bâbının ism-i fâ‘il kalıbıdır."}], "hint": "Baştaki ötreli mîm harfinden sonra ortadaki aslî harfin esreli okunduğu kalıbı düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "İf‘âl bâbından türetilen ve 'idare eden' anlamına gelen 'müdîr' kelimesi, ecvef (orta harfi illetli) köklerde hangi ism-i fâ‘il veznindedir?", "o": [{"t": "müfîl", "ok": true, "why": "Ecvef fiiller İf‘âl bâbında ism-i fâ‘il yapılırken orta harf uzatıcı 'yâ' sesine dönüşerek müfîl veznini alır."}, {"t": "mû‘il", "ok": false, "why": "Mû‘il vezni misâl veya mehmûzü'l-fâ fiillerin İf‘âl bâbı ism-i fâ‘il veznidir."}, {"t": "müfi‘‘", "ok": false, "why": "Müfi‘‘ vezni muzâ‘af fiillerin İf‘âl bâbındaki ism-i fâ‘il veznidir."}, {"t": "müf‘î", "ok": false, "why": "Müf‘î vezni nâkıs fiillerin İf‘âl bâbındaki ism-i fâ‘il veznidir."}], "hint": "Kelimedeki 'î' sesinin, orta harf olan illetli harfin uzatılmasıyla ortaya çıktığını dikkate alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Aşağıdaki kelimelerden hangisi Tef‘îl bâbının ism-i fâ‘il kalıbına (mufa‘‘il) örnek gösterilebilir?", "o": [{"t": "mu‘allim", "ok": true, "why": "'Öğreten' anlamına gelen mu‘allim kelimesi, ta‘lîm (Tef‘îl) masdarının şeddeli ve esreli orta harfe sahip mufa‘‘il kalıbındaki ism-i fâ‘ilidir."}, {"t": "mürekkeb", "ok": false, "why": "Mürekkeb kelimesi Tef‘îl bâbının ism-i fâ‘ili değil, mufa‘‘al veznindeki ism-i mef‘ûlüdür."}, {"t": "muhzır", "ok": false, "why": "Muhzır kelimesi İf‘âl bâbının (ihzâr) müf‘il veznindeki ism-i fâ‘ilidir."}, {"t": "mütekebbir", "ok": false, "why": "Mütekebbir kelimesi Tefa‘‘ul bâbının (tekebbür) mütefa‘‘il veznindeki ism-i fâ‘ilidir."}], "hint": "Şeddeli orta harfi esreli okunan ve 'öğreten / ders veren' gibi eylemi yapanı gösteren kelimeyi arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tef‘îl bâbında nâkıs (son harfi illetli) kelimelerin ism-i mef‘ûlü hangi özel vezinde gelir?", "o": [{"t": "mufa‘‘â", "ok": true, "why": "Nâkıs fiiller Tef‘îl bâbında ism-i mef‘ûl yapılırken son illet harfi üstünleşerek mufa‘‘â (müberrâ, müsemmâ gibi) veznini oluşturur."}, {"t": "mufa‘‘î", "ok": false, "why": "Mufa‘‘î vezni nâkıs kelimelerin Tef‘îl bâbındaki ism-i fâ‘il veznidir."}, {"t": "müf‘al", "ok": false, "why": "Müf‘al vezni İf‘âl bâbının genel ism-i mef‘ûl veznidir."}, {"t": "mütefe‘‘î", "ok": false, "why": "Mütefe‘‘î vezni Tefa‘‘ul bâbındaki nâkıs kelimelerin ism-i fâ‘il veznidir."}], "hint": "Müsemmâ ve müberrâ gibi sonu uzun 'â' sesi ile biten edilgen kalıbı hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tefa‘‘ul bâbı (تَـَفعُّْل) sülâsî mücerred masdarlara aktarıldığında genel olarak hangi anlam özelliğini kazandırır?", "o": [{"t": "Dönüşlülük ve eylemin kendinde gerçekleşmesi", "ok": true, "why": "Tefa‘‘ul bâbı, eylemin öznenin kendi üzerinde gerçekleştiğini gösteren dönüşlülük anlamı ve bazen de yapmacıklık katar."}, {"t": "Sadece dışa dönük ettirgenlik ve geçişlilik", "ok": false, "why": "Ettirgenlik ve dışa dönük geçişlilik daha çok İf‘âl ve Tef‘îl bâblarının temel işlevidir."}, {"t": "İki kişi arasında karşılıklı işteşlik", "ok": false, "why": "İki veya daha fazla kişi arasındaki işteşlik eylemleri ağırlıklı olarak Tefâ‘ul ve Müfâ‘ale bâblarının özelliğidir."}, {"t": "Sadece edilgenlik ve nesnesizlik", "ok": false, "why": "Tefa‘‘ul bâbı doğrudan edilgenlikten ziyade dönüşlülük veya geçişsiz/bazen geçişli fiil türetmede kullanılır."}], "hint": "Bu bâbın 'tahassul' veya 'tekebbür' örneklerinde olduğu gibi eylemin kişinin kendisinde meydana gelmesini ifade ettiğini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tefa‘‘ul bâbının etken nitelik taşıyan ism-i fâ‘il vezni aşağıdakilerden hangisidir?", "o": [{"t": "mütefa‘‘il", "ok": true, "why": "Tefa‘‘ul bâbının etken ismi olan ism-i fâ‘ili, başında 'müte-' eki ve şeddeli esreli orta harfiyle mütefa‘‘il (örneğin mütekebbir) veznindedir."}, {"t": "mütefâ‘il", "ok": false, "why": "Mütefâ‘il vezni Tefâ‘ul bâbının ism-i fâ‘ilidir."}, {"t": "mufa‘‘il", "ok": false, "why": "Mufa‘‘il vezni Tef‘îl bâbının ism-i fâ‘ilidir."}, {"t": "mütefa‘‘al", "ok": false, "why": "Mütefa‘‘al vezni Tefa‘‘ul bâbının ism-i mef‘ûl veznidir."}], "hint": "Başında 'müte-' eki bulunan ve ikinci aslî harfi şeddeli olan etken kalıbı değerlendirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tefa‘‘ul bâbının ism-i mef‘ûlünün (mütefa‘‘al) dilde son derece az kullanılmasının temel sebebi nedir?", "o": [{"t": "Bâbın temel işlevinin dönüşlülük olması ve nesne almaması", "ok": true, "why": "Tefa‘‘ul bâbı dönüşlülük bildirdiğinden eylem öznenin üzerinde kalır; bu yüzden nesne alan edilgen yapıdaki ism-i mef‘ûlüne pek ihtiyaç duyulmaz."}, {"t": "Bâbın yalnızca isim türetmek için kullanılması", "ok": false, "why": "Bu bâbdan hem masdar hem de ism-i fâ‘il gibi sıfat türleri yaygın olarak türetilmektedir."}, {"t": "Bâbda hiçbir zaman ism-i fâ‘il türetilememesi", "ok": false, "why": "Bâbın mütekebbir, mütehassıl gibi dilde son derece yaygın kullanılan ism-i fâ‘illeri bulunmaktadır."}, {"t": "Bâbın sadece geçişli fiillerden oluşması", "ok": false, "why": "Bu bâb aksine çoğunlukla geçişsiz ve dönüşlü fiiller türetir."}], "hint": "Eylemin özneye geri dönmesi ile dışarıdan bir nesne gereksinimi arasındaki ilişkiyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "'Bakışmak, yardımlaşmak' gibi işteşlik eylemlerinin yanı sıra bazen var olmayan bir durumu varmış gibi gösterme (yapmacıklık) anlamı da katan bâb hangisidir?", "o": [{"t": "Tefâ‘ul Bâbı", "ok": true, "why": "Tefâ‘ul bâbı (تَـَفاُعْل), birden fazla kişi arasında işteşlik sağladığı gibi 'tecâhül' örneğindeki gibi yapmacıklık ve sahtelik anlamı da taşır."}, {"t": "İf‘âl Bâbı", "ok": false, "why": "İf‘âl bâbı geçişlilik ve ettirgenlik ifade eder."}, {"t": "Tef‘îl Bâbı", "ok": false, "why": "Tef‘îl bâbı çoğunlukla geçişlilik ve pekiştirme ifade eder."}, {"t": "Müfâ‘ale Bâbı", "ok": false, "why": "Müfâ‘ale bâbı işteşlik ve geçişlilik sağlasa da sahtelik/yapmacıklık anlamı katma özelliği Tefâ‘ul bâbına aittir."}], "hint": "Tecâhül (bilmezlikten gelme) ve tenâzur (bakışma) örneklerinin ait olduğu bâbı hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tefâ‘ul bâbının ism-i fâ‘ili olan ve 'olgunlaşmış' anlamına gelen 'mütekâmil' kelimesi hangi vezinde türetilmiştir?", "o": [{"t": "mütefâ‘il", "ok": true, "why": "Tekâmül (Tefâ‘ul) masdarının ism-i fâ‘ili olan mütekâmil, mütefâ‘il vezninde türetilmiştir."}, {"t": "mütefa‘‘il", "ok": false, "why": "Mütefa‘‘il vezni şeddeli orta harfe sahiptir ve Tefa‘‘ul bâbına aittir."}, {"t": "müfâ‘il", "ok": false, "why": "Müfâ‘il vezni Müfâ‘ale bâbının ism-i fâ‘il veznidir."}, {"t": "mütefâ‘al", "ok": false, "why": "Mütefâ‘al vezni Tefâ‘ul bâbının ism-i mef‘ûl veznidir."}], "hint": "Başında 'müte-' eki olan ve ilk aslî harften sonra uzatıcı elif bulunan etken kalıbı arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Müfâ‘ale bâbı (ُمَفاَعَله) masdarları ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": [{"t": "Genellikle işteşlik (karşılıklılık) ve geçişlilik anlamı taşır.", "ok": true, "why": "Müfâ‘ale bâbı eylemin karşılıklı yapılmasını (işteşlik) sağlar ve geçişli/geçişsiz yapıda bulunabilir."}, {"t": "Yalnızca tek taraflı ettirgenlik ve edilgenlik anlamları oluşturur.", "ok": false, "why": "Ettirgenlik ve edilgenlik bu bâbın temel işlevi değildir."}, {"t": "Başındaki mîm harfi kelimenin aslî kök harflerinden biridir.", "ok": false, "why": "Başındaki ötreli mîm (mü-) harfi bâbın zâid (eklenmiş) harfidir, kök harf değildir."}, {"t": "Bâbın ism-i fâ‘il ve ism-i mef‘ûlleri dilde hiç kullanılmaz.", "ok": false, "why": "Müşâhed, muhâtab, mübârek gibi ism-i mef‘ûller dilde sıklıkla kullanılır."}], "hint": "Muhâtabe (karşılıklı konuşma) ve mücâdele gibi kelimelerin kattığı eylem biçimini dikkate alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "'İnkâr edilmiş' anlamına gelen 'münker' ve 'sağlamlaştırılmış' anlamına gelen 'muhkem' kelimeleri İf‘âl bâbının hangi kalıbındadır?", "o": [{"t": "müf‘al", "ok": true, "why": "İf‘âl bâbının edilgen nitelikteki ism-i mef‘ûlü, aynü'l-fiili üstünlü olan müf‘al veznindedir."}, {"t": "müf‘il", "ok": false, "why": "Müf‘il vezninde aynü'l-fiil esrelidir ve etken (ism-i fâ‘il) anlam verir."}, {"t": "mufa‘‘al", "ok": false, "why": "Mufa‘‘al vezni Tef‘îl bâbının ism-i mef‘ûlüdür."}, {"t": "mütefa‘‘al", "ok": false, "why": "Mütefa‘‘al vezni Tefa‘‘ul bâbının ism-i mef‘ûlüdür."}], "hint": "Baştaki ötreli mîmden sonra ortadaki kök harfi üstünlü okunarak edilgen nitelik kazanan kalıbı düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Tef‘îl bâbının ism-i mef‘ûlü olan 'mürekkeb' (birleştirilmiş) ve 'müşerref' (şereflendirilmiş) kelimeleri hangi vezinde türetilmiştir?", "o": [{"t": "mufa‘‘al", "ok": true, "why": "Tef‘îl bâbının ism-i mef‘ûlü, ikinci aslî harfi şeddeli ve üstünlü okunan mufa‘‘al veznindedir."}, {"t": "mufa‘‘il", "ok": false, "why": "Mufa‘‘il vezni Tef‘îl bâbının etken sıfatı olan ism-i fâ‘il veznidir."}, {"t": "müf‘al", "ok": false, "why": "Müf‘al vezni İf‘âl bâbının ism-i mef‘ûlüdür."}, {"t": "mütefa‘‘al", "ok": false, "why": "Mütefa‘‘al vezni Tefa‘‘ul bâbının ism-i mef‘ûlüdür."}], "hint": "Ortadaki aslî harfi hem şeddeli hem de üstünlü okunarak yapılan edilgen sıfat kalıbını hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}], "sources": [{"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 1: Osmanlı Türkçesi Alfabesi", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 2: Türkçe Ünlü ve Ünsüzlerin Yazılışı", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 3: Türkçe Kelimelerin Yapısı, Türkçe Kiplerin ve Edatların Yazılışı", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 4: Türkçe Ek, Zamir, Zarf ve Sayıların Yazılışı", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 5: Arapça ve Farsça Kelimelerde Ünlüler ve Yazılışları", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 6: Arapça Kelimelerin Yapısı", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 7: Aksâm-ı Seb'a, Mücerred Masdarlar, İsm-i Fâil ve İsm-i Mef'ûl", "url": "", "type": "book"}, {"title": "Osmanlı Türkçesi I ders kitabı, Bölüm 8: Mezîdünfih Masdarlar (I)", "url": "", "type": "book"}], "counts": {"chapters": 8, "cards": 80, "quiz": 123, "   try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function $(s) { return document.querySelector(s); }
  function norm(s) { return (s || "").toLocaleLowerCase(); }
  var query = "";

  function blocks(parent, list) {
    var ul = null;
    list.forEach(function (b) {
      if (b.h) { ul = null; parent.appendChild(el("h4", null, b.h)); }
      else if (b.li) {
        if (!ul) { ul = el("ul", "notes"); parent.appendChild(ul); }
        ul.appendChild(el("li", null, b.li));
      } else { ul = null; parent.appendChild(el("p", null, b.p)); }
    });
  }

  // ---- panel ---------------------------------------------------------------
  function paintPanel() {
    var v = $("#view-panel");
    v.textContent = "";
    var stats = el("div", "stats");
    [["Bölüm", DATA.counts.chapters], ["Kart", DATA.counts.cards],
     ["Soru", DATA.counts.quiz], ["Kaynak", DATA.counts.sources]].forEach(function (s) {
      var d = el("div", "stat");
      d.appendChild(el("b", null, String(s[1])));
      d.appendChild(el("span", null, s[0]));
      stats.appendChild(d);
    });
    v.appendChild(stats);

    var known = DATA.cards.filter(function (c) { return st.known[c.id]; }).length;
    var pc = DATA.counts.cards ? Math.round(100 * known / DATA.counts.cards) : 0;
    var box = el("div", "card");
    box.appendChild(el("h3", null, "Kart ilerlemesi"));
    box.appendChild(el("p", "muted", known + " / " + DATA.counts.cards + " kart biliniyor" +
      (st.best ? " · en iyi test: " + st.best + "%" : "")));
    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = pc + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    var row = el("div", "row");
    row.style.marginTop = "14px";
    var b1 = el("button", "act primary", "Kartlara başla");
    b1.onclick = function () { show("kartlar"); };
    var b2 = el("button", "act ghost", "Teste gir");
    b2.onclick = function () { show("test"); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    v.appendChild(box);

    if (DATA.brand.tagline) v.appendChild(el("p", "muted", DATA.brand.tagline));
  }

  // ---- cards ---------------------------------------------------------------
  var queue = [], qIndex = 0, revealed = false;
  function startCards() {
    queue = DATA.cards.filter(function (c) { return !st.known[c.id]; });
    if (!queue.length) queue = DATA.cards.slice();
    queue = queue.filter(function (c) {
      return !query || norm(c.front + " " + c.back + " " + c.chTitle).indexOf(query) >= 0;
    });
    qIndex = 0; revealed = false;
    paintCard();
  }
  function paintCard() {
    var v = $("#view-kartlar");
    v.textContent = "";
    if (!queue.length) {
      v.appendChild(el("p", "empty", DATA.counts.cards
        ? "Aramanıza uyan kart yok." : "Bu ders için henüz kart üretilmedi. Defterden kart üretmek için pipeline'ın flashcards aşamasını çalıştırın."));
      return;
    }
    var c = queue[qIndex % queue.length];
    var box = el("div", "card flash");
    box.appendChild(el("div", "kicker", (c.chTitle || "Kart") + " · " + (qIndex + 1) + "/" + queue.length));
    box.appendChild(el("div", "front", c.front));
    if (revealed) box.appendChild(el("div", "back", c.back));
    else box.appendChild(el("div", "muted", "Cevabı görmek için karta dokunun."));
    box.onclick = function () { revealed = true; paintCard(); };
    v.appendChild(box);

    var row = el("div", "row");
    var know = el("button", "act primary", "Biliyorum");
    know.onclick = function () {
      st.known[c.id] = 1; save(); revealed = false;
      queue.splice(qIndex % queue.length, 1);
      if (!queue.length) { paintPanel(); paintCard(); return; }
      paintCard();
    };
    var again = el("button", "act ghost", "Tekrar");
    again.onclick = function () {
      revealed = false; qIndex = (qIndex + 1) % queue.length; paintCard();
    };
    row.appendChild(know); row.appendChild(again);
    v.appendChild(row);
  }

  // ---- chapters ------------------------------------------------------------
  function paintChapters() {
    var v = $("#view-konular");
    v.textContent = "";
    var shown = DATA.chapters.filter(function (ch) {
      if (!query) return true;
      var hay = ch.title + " " + ch.summary + " " + ch.objectives.join(" ");
      ch.notes.forEach(function (b) { hay += " " + (b.p || b.h || b.li || ""); });
      return norm(hay).indexOf(query) >= 0;
    });
    if (!shown.length) { v.appendChild(el("p", "empty", "Aramanıza uyan bölüm yok.")); return; }
    shown.forEach(function (ch) {
      var card = el("section", "card");
      card.appendChild(el("div", "kicker", "Bölüm " + ch.n));
      card.appendChild(el("h3", null, ch.title));
      if (ch.summary) card.appendChild(el("p", "muted", ch.summary));
      if (ch.objectives.length) {
        var ul = el("ul", "obj");
        ch.objectives.forEach(function (o) { ul.appendChild(el("li", null, o)); });
        card.appendChild(ul);
      }
      if (ch.notes.length) blocks(card, ch.notes);
      if (ch.sources.length) {
        var k = el("div", "kicker", "Kaynaklar");
        k.style.marginTop = "14px";
        card.appendChild(k);
        ch.sources.forEach(function (s) {
          if (s.url) {
            var a = el("a", null, s.title);
            a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
            card.appendChild(a);
            card.appendChild(document.createElement("br"));
          } else card.appendChild(el("div", "muted", s.title));
        });
      }
      v.appendChild(card);
    });
  }

  // ---- quiz ----------------------------------------------------------------
  var pool = [], qi = 0, right = 0, answered = false;
  function startQuiz() {
    pool = DATA.quiz.filter(function (q) {
      if (!query) return true;
      return norm(q.q + " " + (q.a || "") + " "
        + q.o.map(function (o) { return o.t; }).join(" ")).indexOf(query) >= 0;
    });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    qi = 0; right = 0; answered = false;
    paintQuiz();
  }
  function paintQuiz() {
    var v = $("#view-test");
    v.textContent = "";
    if (!pool.length) {
      v.appendChild(el("p", "empty", DATA.counts.quiz
        ? "Aramanıza uyan soru yok." : "Bu ders için henüz test sorusu yok."));
      return;
    }
    if (qi >= pool.length) {
      var pct = Math.round(100 * right / pool.length);
      st.seen = (st.seen || 0) + 1;
      if (pct > (st.best || 0)) st.best = pct;
      save();
      var box = el("div", "card");
      box.appendChild(el("div", "kicker", "Test bitti"));
      box.appendChild(el("h3", null, right + " / " + pool.length + " doğru · " + pct + "%"));
      box.appendChild(el("p", "muted", pct >= Math.round(DATA.passMark * 100)
        ? "Geçme sınırının üstündesiniz." : "Geçme sınırı " + Math.round(DATA.passMark * 100) + "%."));
      var row = el("div", "row");
      var again = el("button", "act primary", "Yeniden çöz");
      again.onclick = startQuiz;
      var cards = el("button", "act ghost", "Kartlara dön");
      cards.onclick = function () { show("kartlar"); };
      row.appendChild(again); row.appendChild(cards);
      box.appendChild(row);
      v.appendChild(box);
      paintPanel();
      return;
    }
    var q = pool[qi];
    var card = el("section", "card");
    card.appendChild(el("div", "kicker", "Soru " + (qi + 1) + " / " + pool.length));
    card.appendChild(el("h3", null, q.q));
    if (q.hint) card.appendChild(el("p", "muted", q.hint));
    if (!q.o.length) {  // boşluk doldurma / kısa cevap: cevap açılır, okuyucu kendi karar verir
      var rev = el("button", "act primary", "Cevabı göster");
      rev.onclick = function () { revealAnswer(card, q); };
      card.appendChild(rev);
      v.appendChild(card);
      return;
    }
    var selected = {}, labels = q.o.map(function (o) {
      var b = el("button", "opt", o.t);
      card.appendChild(b);
      return b;
    });
    // Tek doğru: tıklanan şık cevabı verir. Çoktan seçmeli: şıklar işaretlenir, küme "Kontrol et"te karşılaştırılır.
    function settle(ok, note) {
      answered = true;
      if (ok) right += 1;
      q.o.forEach(function (o, j) {
        labels[j].dataset.state = o.ok ? "ok" : (selected[j] ? "bad" : "");
      });
      var why = q.o.filter(function (x) { return x.ok && x.why; })[0];
      if (why) card.appendChild(el("p", "why", why.why));
      if (note) card.appendChild(el("p", "muted", note));
      card.appendChild(nextButton());
    }
    if (q.type === "multiple_select") {
      card.appendChild(el("p", "muted", "Doğru olan tüm seçenekleri işaretleyin."));
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = !selected[j];
          b.dataset.state = selected[j] ? "ok" : "";
        };
      });
      var check = el("button", "act primary", "Kontrol et");
      check.style.marginTop = "6px";
      check.onclick = function () {
        if (answered) return;
        var ok = q.o.every(function (o, j) { return Boolean(o.ok) === Boolean(selected[j]); });
        settle(ok, ok ? "Doğru." : "Tam değil.");
      };
      card.appendChild(check);
    } else {
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = true;
          settle(q.o[j].ok);
        };
      });
    }
    v.appendChild(card);
  }

  function nextButton() {
    var next = el("button", "act primary", qi + 1 >= pool.length ? "Sonucu gör" : "Sonraki soru");
    next.style.marginTop = "12px";
    next.onclick = function () { qi += 1; answered = false; paintQuiz(); };
    return next;
  }

  function revealAnswer(card, q) {
    if (answered) return;
    answered = true;
    if (q.a) card.appendChild(el("p", "why", q.why ? q.a + " " + q.why : q.a));
    else if (q.why) card.appendChild(el("p", "why", q.why));
    var row = el("div", "row");
    var know = el("button", "act primary", "Bildim");
    know.onclick = function () { right += 1; qi += 1; answered = false; paintQuiz(); };
    var no = el("button", "act ghost", "Bilemedim");
    no.onclick = function () { qi += 1; answered = false; paintQuiz(); };
    row.appendChild(know); row.appendChild(no);
    card.appendChild(row);
  }

  // ---- sources -------------------------------------------------------------
  function paintSources() {
    var v = $("#view-kaynaklar");
    v.textContent = "";
    var list = DATA.sources.filter(function (s) { return !query || norm(s.title).indexOf(query) >= 0; });
    if (!list.length) { v.appendChild(el("p", "empty", "Kaynak bulunamadı.")); return; }
    list.forEach(function (s) {
      var card = el("div", "card");
      card.appendChild(el("div", "kicker", s.type || "kaynak"));
      if (s.url) {
        var a = el("a", null, s.title);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        card.appendChild(a);
      } else card.appendChild(el("div", null, s.title));
      v.appendChild(card);
    });
  }

  // ---- shell ---------------------------------------------------------------
  var VIEWS = {panel: paintPanel, kartlar: startCards, konular: paintChapters, test: startQuiz, kaynaklar: paintSources};
  var current = "panel";
  function show(name) {
    current = name;
    Object.keys(VIEWS).forEach(function (k) {
      $("#view-" + k).hidden = k !== name;
      var b = $('#tabs button[data-view="' + k + '"]');
      if (b) b.setAttribute("aria-selected", k === name ? "true" : "false");
    });
    VIEWS[name]();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.onclick = function () { query = ""; $("#q").value = ""; show(b.dataset.view); };
  });
  var timer = null;
  $("#q").oninput = function (e) {
    clearTimeout(timer);
    var value = e.target.value;
    timer = setTimeout(function () { query = norm(value.trim()); VIEWS[current](); }, 120);
  };
  if (!DATA.counts.cards) document.querySelector('#tabs button[data-view="kartlar"]').hidden = true;
  if (!DATA.counts.quiz) document.querySelector('#tabs button[data-view="test"]').hidden = true;
  show("panel");
})();
</script>
</body>
</html>
