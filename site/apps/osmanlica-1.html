, "o": [{"t": "Med", "ok": false, "why": "Med elifin üstünde uzun â okutur."}, {"t": "Şedde", "ok": true, "why": "Doğru: ملّت."}, {"t": "Cezm", "ok": false, "why": "Cezm harfi ünlüsüz okutur."}, {"t": "Tenvin", "ok": false, "why": "Tenvin kelime sonunda an/en, ın/in, un/ün okutur."}], "hint": "Arapça kelimelerde yan yana gelen aynı ünsüzler.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki harflerden hangisi kendinden sonraki harfle bitişmez?", "o": [{"t": "ب", "ok": false, "why": "Be her iki yandan bitişir."}, {"t": "س", "ok": false, "why": "Sin her iki yandan bitişir."}, {"t": "ر", "ok": true, "why": "Doğru. Re kendinden sonrakiyle bitişmez."}, {"t": "ك", "ok": false, "why": "Kef her iki yandan bitişir."}], "hint": "Bitişmeyen harfler: ا د ذ ر ز ژ و.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Genizsi ñ sesini gösteren kâf-ı nûnî hangisidir?", "o": [{"t": "ڭ", "ok": true, "why": "Doğru. Kâf-ı nûnî (sağır kef): دڭز deñiz."}, {"t": "گ", "ok": false, "why": "Gef (kâf-ı fârisî) yumuşak g'yi gösterir."}, {"t": "غ", "ok": false, "why": "Gayın kalın ğ'yi gösterir."}, {"t": "ق", "ok": false, "why": "Kaf kalın k'yi gösterir."}], "hint": "Sağır kef ya da nun kefi de denir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki seslerden hangisinin Osmanlı alfabesinde ayrı bir kalın ve ince harfi yoktur?", "o": [{"t": "k", "ok": false, "why": "k: kaf ق / kef ك."}, {"t": "t", "ok": false, "why": "t: tı ط / te ت."}, {"t": "s", "ok": false, "why": "s: sad ص / sin س."}, {"t": "m", "ok": true, "why": "Doğru. m için yalnızca mim (م) vardır."}], "hint": "Kalın-ince çiftleri: ق/ك, ط/ت, ص/س, ظ/ز.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Türkçe kelimelerin sonundaki \"e\" ünlüsü genellikle hangi harfle yazılır?", "o": [{"t": "Elif", "ok": false, "why": "Elif kelime başında e için de kullanılır ama sondaki e için değil."}, {"t": "Güzel he", "ok": true, "why": "Doğru: دره dere, بكله bekle."}, {"t": "Vav", "ok": false, "why": "Vav o/ö/u/ü ünlülerini gösterir."}, {"t": "Ye", "ok": false, "why": "Ye ı/i ünlülerini gösterir."}], "hint": "دره (dere) örneğini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "قوش yazılışı hangi iki kelime olarak okunabilir?", "o": [{"t": "kış / kaş", "ok": false, "why": "Kış ve kaş için vav kullanılmaz."}, {"t": "kuş / koş", "ok": true, "why": "Doğru. Hangisi olduğu cümlenin anlamından anlaşılır."}, {"t": "koç / kuç", "ok": false, "why": "Sonda şın (ش) vardır, ç değil."}, {"t": "kuş / kış", "ok": false, "why": "Kış için vav yazılmaz."}], "hint": "Vav o, ö, u, ü seslerini gösterir; kaf kalındır.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Gereklilik kipi eki (-malı/-meli) Osmanlı Türkçesinde nasıl yazılır?", "o": [{"t": "سه", "ok": false, "why": "سه dilek-şart ekidir."}, {"t": "ملى", "ok": true, "why": "Doğru. Bazı kalın ünlülü fiillerde مالى de görülür."}, {"t": "مقده", "ok": false, "why": "مقده -makta ekidir."}, {"t": "جق", "ok": false, "why": "جق gelecek zaman ekidir."}], "hint": "ايچملى içmeli.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "كلسه (gelse) kelimesindeki ek hangi kiptir?", "o": [{"t": "Dilek-şart", "ok": true, "why": "Doğru. سه dilek-şart ekidir."}, {"t": "Gereklilik", "ok": false, "why": "Gereklilik eki ملى'dir."}, {"t": "İstek", "ok": false, "why": "İstek kipinde -a/-e eki olur."}, {"t": "Şimdiki zaman", "ok": false, "why": "Şimdiki zaman -yor ya da -makta ekiyle yapılır."}], "hint": "-sa/-se eki tek şekilli سه ile yazılır.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "\"Kucakta, kucaklama\" anlamına gelen kelime hangisidir?", "o": [{"t": "der-dest", "ok": false, "why": "Der-dest \"elde, elde etme\" demektir."}, {"t": "der-hâl", "ok": false, "why": "Der-hâl \"hemen\" demektir."}, {"t": "der-âgûş", "ok": true, "why": "Doğru: درآغوش."}, {"t": "der-kenâr", "ok": false, "why": "Der-kenâr \"kenarda\" demektir."}], "hint": "Âgûş Farsçada \"kucak\" demektir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdakilerden hangisi \"yazık, ne yazık\" anlamında bir ünlemdir?", "o": [{"t": "zinhâr", "ok": false, "why": "Zinhâr \"sakın, dikkat\" demektir."}, {"t": "efsûs", "ok": true, "why": "Doğru. Efsûs \"ne yazık, eyvah\" demektir."}, {"t": "destûr", "ok": false, "why": "Destûr \"çekil, yol ver\" demektir."}, {"t": "ahsentü", "ok": false, "why": "Ahsentü \"ne güzel\" demektir."}], "hint": "Hayf, hayfâ, dirîğâ ve efsûs aynı anlamdadır.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Çokluk eki -lar/-ler Osmanlı Türkçesinde nasıl yazılır?", "o": [{"t": "Ünlüsü yazılmadan, tek şekilde لر", "ok": true, "why": "Doğru. Çokluk eki her zaman لر yazılır."}, {"t": "Kalınlarda لار, incelerde لر", "ok": false, "why": "Ekin ünlüsü yazılmaz; لار yanlıştır."}, {"t": "Her zaman لار", "ok": false, "why": "Elifli yazım yanlıştır."}, {"t": "Kelimeden ayrı ve ünlüsüyle", "ok": false, "why": "Ek kelimeye bitişik ve ünlüsüz yazılır."}], "hint": "كتابلر kitaplar, كوزلر gözler.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "٧٠ rakamı nasıl okunur?", "o": [{"t": "Yedi", "ok": false, "why": "Yedi yalnızca ٧ ile yazılır."}, {"t": "Yetmiş", "ok": true, "why": "Doğru: ٧ ve ٠ yan yana \"yetmiş\" olur."}, {"t": "Yediyüz", "ok": false, "why": "Yediyüz ٧٠٠ olurdu."}, {"t": "On yedi", "ok": false, "why": "On yedi ١٧ olurdu."}], "hint": "Rakamlar soldan sağa okunur; ٧ yedidir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Osmanlı Türkçesinde \"hemen, o anda\" anlamına gelen zarf hangisidir?", "o": [{"t": "berren", "ok": false, "why": "Berren \"kara yoluyla\" demektir."}, {"t": "muhibbâne", "ok": false, "why": "Muhibbâne \"dostça\" demektir."}, {"t": "fi'l-hâl", "ok": true, "why": "Doğru: في الحال."}, {"t": "vâkı'a", "ok": false, "why": "Vâkı'a \"gerçi\" demektir."}], "hint": "Hâl \"şimdiki durum\" demektir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki harflerden hangisi Türkçe kelimelerde bulunmaz, Arapçaya özgüdür?", "o": [{"t": "ذ", "ok": true, "why": "Doğru. Zel (ذ) Arapçaya özgüdür; Türkçede z okunur."}, {"t": "ب", "ok": false, "why": "Be Türkçe kelimelerde de geçer."}, {"t": "ر", "ok": false, "why": "Re Türkçe kelimelerde de geçer."}, {"t": "ق", "ok": false, "why": "Kaf Türkçe kelimelerde kalın k için kullanılır."}], "hint": "Peltek z sesi.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Hicrî takvimde ayın ilk gününe ne ad verilir?", "o": [{"t": "Selh", "ok": false, "why": "Selh ayın son günüdür."}, {"t": "Gurre", "ok": true, "why": "Doğru. Gurre ayın ilk günüdür."}, {"t": "Evâsıt", "ok": false, "why": "Evâsıt ayın 11-20. günleridir."}, {"t": "Evâhir", "ok": false, "why": "Evâhir ayın son on günüdür."}], "hint": "غرّه.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "شكران (şükrân) kelimesinin vezni hangisidir?", "o": [{"t": "fa'al", "ok": false, "why": "Fa'al vezninde zâid harf yoktur."}, {"t": "fu'lân", "ok": true, "why": "Doğru: ş → fe, k → ayın, r → lam; -ân aynen kalır: فعلان."}, {"t": "if'âl", "ok": false, "why": "If'âl başta elif ve ortada elif taşır."}, {"t": "fâ'il", "ok": false, "why": "Fâ'il ism-i fâil veznidir."}], "hint": "Aslî harfler ş-k-r; zâid harfler elif ve nun.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Osmanlı Türkçesinde Arapça ikilik (tesniye) eki hangisidir?", "o": [{"t": "-ât", "ok": false, "why": "-ât müennes çokluk ekidir."}, {"t": "-în", "ok": false, "why": "-în müzekker çokluk ekidir."}, {"t": "-eyn", "ok": true, "why": "Doğru. -eyn tesniye ekidir."}, {"t": "-ûn", "ok": false, "why": "-ûn müzekker çokluk ekidir."}], "hint": "Vâlideyn, Haremeyn.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aslî harflerinin ikincisi illet harfi olan kelimelere ne ad verilir?", "o": [{"t": "Misâl", "ok": false, "why": "Misâlde birinci aslî harf illetlidir (وقت vakt)."}, {"t": "Ecvef", "ok": true, "why": "Doğru. Ecvef: ortası illetli."}, {"t": "Nâkıs", "ok": false, "why": "Nâkısta üçüncü aslî harf illetlidir (نهى nehy)."}, {"t": "Mehmûz", "ok": false, "why": "Mehmûzda aslî harflerde hemze vardır."}], "hint": "كون kevn örneği.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "مكتوب (mektûb) hangi kelime türüne örnektir?", "o": [{"t": "İsm-i fâil", "ok": false, "why": "İsm-i fâil kâtib (yazan) olurdu."}, {"t": "İsm-i mef'ûl", "ok": true, "why": "Doğru. mef'ûl vezni: yazılmış."}, {"t": "Mimli masdar", "ok": false, "why": "Mimli masdar mef'al gibi kalıplardır ama hareket ismidir."}, {"t": "Mec'ûl masdar", "ok": false, "why": "Mec'ûl masdar -iyyet ile yapılır."}], "hint": "\"Yazılmış\" anlamı.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki mezîdünfih bâblarından hangisi kelimeye işteşlik anlamı katar?", "o": [{"t": "If'âl", "ok": false, "why": "If'âl geçişlilik katar."}, {"t": "Tef'îl", "ok": false, "why": "Tef'îl geçişlilik ve çokluk katar."}, {"t": "Tefâ'ul", "ok": true, "why": "Doğru. Tefâ'ul işteşlik bildirir (müfâ'ale de öyle)."}, {"t": "Tefa''ul", "ok": false, "why": "Tefa''ul dönüşlülük bildirir."}], "hint": "تعاون teâvün: yardımlaşma.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "معلّم (muallim, öğreten) kelimesi hangi bâbın ism-i fâilidir?", "o": [{"t": "If'âl", "ok": false, "why": "If'âl'in fâili muf'il: mükrim."}, {"t": "Tef'îl", "ok": true, "why": "Doğru. Tef'îl'in fâili mufa''il: muallim."}, {"t": "Tefa''ul", "ok": false, "why": "Tefa''ul'ün fâili mütefa''il: müteallim."}, {"t": "Müfâ'ale", "ok": false, "why": "Müfâ'ale'nin fâili mufâ'il: mücâhid."}], "hint": "Masdarı تعليم ta'lîm.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Batı Türkçesinin 13. yüzyıldan İstanbul'un fethine (15. yüzyıl ortası) kadar süren ilk dönemine ne ad verilir?", "o": [{"t": "Eski Anadolu Türkçesi", "ok": true, "why": "Anadolu Selçukluları, Beylikler Çağı ve Osmanlı'nın İstanbul'un fethine kadar olan ilk evresi Eski Anadolu Türkçesi (Eski Osmanlıca) olarak adlandırılır."}, {"t": "Klâsik Osmanlı Türkçesi", "ok": false, "why": "Klâsik dönem, İstanbul'un fethinden (15. yüzyıl ortası) 19. yüzyıla kadar süren ikinci ana evreyi ifade eder."}, {"t": "Yeni Osmanlı Türkçesi", "ok": false, "why": "Yeni Osmanlı Türkçesi veya Türkiye Türkçesi dönemi Batı Türkçesinin üçüncü ve son aşamasını temsil eder."}, {"t": "Çağatay Türkçesi", "ok": false, "why": "Çağatay Türkçesi Batı Türkçesi koluna değil, Doğu Türkçesi gelişme alanına aittir."}], "hint": "Bu dönem Anadolu Selçukluları ve Beylikler Çağı'nı kapsayan kuruluş evresidir.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Osmanlı Türkçesi alfabesi 28 harfli Arap alfabesine dayanmakla birlikte Türklerin ve İranlıların katkılarıyla genişletilmiştir. Aşağıdakilerden hangisi bu ilave edilen harflerden biridir?", "o": [{"t": "pe (پ)", "ok": true, "why": "Arap alfabesinde bulunmayan 'p' sesi için Türk ve İranlıların ilavesiyle 'pe' harfi alfabeye dahil edilmiştir."}, {"t": "te (ت)", "ok": false, "why": "Te harfi asıl Arap alfabesinin 28 harfi arasında zaten yer almaktadır."}, {"t": "re (ر)", "ok": false, "why": "Re harfi Arap alfabesinin temel harflerinden biridir."}, {"t": "fe (ف)", "ok": false, "why": "Fe harfi Arap alfabesinin asıl kadrosunda bulunan bir ünsüzdür."}], "hint": "Arapça kökenli kelimelerde bulunmayan ve altına üç nokta konularak türetilen harfi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Harfin üstüne konulan ve ilgili harfi /o/, /ö/, /u/ veya /ü/ sesleriyle okutmaya yarayan hareke aşağıdakilerden hangisidir?", "o": [{"t": "Ötre (damme)", "ok": true, "why": "Ötre işareti harfin üstüne konur ve yuvarlak ünlü seslerini (/o/, /ö/, /u/, /ü/) temsil eder."}, {"t": "Üstün (fetha)", "ok": false, "why": "Üstün işareti harfin üstüne konarak düz-geniş ünlüleri (/a/, /e/) okutur."}, {"t": "Esre (kesre)", "ok": false, "why": "Esre işareti harfin altına konur ve düz-dar ünlüleri (/ı/, /i/) ifade eder."}, {"t": "Cezm (sükûn)", "ok": false, "why": "Cezm işareti ünlü okutmaz, harfi harekesiz yani ünsüz (sakin) duruma getirir."}], "hint": "Arapça ismi 'damme' olan ve yuvarlak ünlülere karşılık gelen harekeyi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Kelime sonundaki harfi \"ın / in\" sesleriyle okutmayı sağlayan hareke/tenvin işareti aşağıdakilerden hangisidir?", "o": [{"t": "Esreli tenvin", "ok": true, "why": "Kelime sonundaki harfin altına çift çizgi şeklinde konan esreli tenvin, kelime sonunu 'ın/in' sesleriyle okutur."}, {"t": "Üstünlü tenvin", "ok": false, "why": "Üstünlü tenvin harfin üstüne konur ve 'an/en' sesleriyle okunmasını sağlar."}, {"t": "Ötreli tenvin", "ok": false, "why": "Ötreli tenvin harfin üstüne konur ve 'un/ün' seslerini üretir."}, {"t": "Şedde", "ok": false, "why": "Şedde tenvin türü değildir; ünsüzün ikizleşmesini (iki defa okunmasını) sağlar."}], "hint": "Tek başına /ı/i/ sesi veren esre harekesinin kelime sonunda çift yazılmış hâlini değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Elif harfinin üzerine konularak kelimeye uzun \"â\" sesi kazandıran ve Türkçe kelimelerin başında da (örneğin \"ak\" kelimesinde) kullanılan yardımcı işaret aşağıdakilerden hangisidir?", "o": [{"t": "Med", "ok": true, "why": "Med işareti elif üzerine konarak harfin uzun 'â' şeklinde okunmasını sağlar ve Türkçe ilk sesi 'a' olan kelimelerde de kullanılır."}, {"t": "Cezm", "ok": false, "why": "Cezm uzatma yapmaz, harfin sesini keserek ünsüz olarak kalmasını sağlar."}, {"t": "Şedde", "ok": false, "why": "Şedde harfi uzatmaya değil, aynı ünsüzü iki kez okutmaya yarar."}, {"t": "Tenvin", "ok": false, "why": "Tenvin kelime sonlarına genizcil 'n' sesi getiren çift harekedir."}], "hint": "Dalgalı bir çizgi şeklinde elifin üzerine yerleştirilen uzatma işaretini hatırla.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Arapça kelimelerde yan yana gelen aynı ünsüzü tek harfle yazıp iki defa okutmak için kullanılan yardımcı işaret aşağıdakilerden hangisidir?", "o": [{"t": "Şedde", "ok": true, "why": "Şedde işareti üzerine konduğu harfin çift ünsüz (ikiz) olarak okunmasını sağlar."}, {"t": "Cezm", "ok": false, "why": "Cezm harfi ikizleştirmez, sadece durağan/sakin okutur."}, {"t": "Med", "ok": false, "why": "Med işareti sesleri ikizleştirmek için değil, ünlüyü uzatmak için kullanılır."}, {"t": "Tenvin", "ok": false, "why": "Tenvin kelime sonuna /n/ sesi ekleyen hareke biçimidir."}], "hint": "'Cennet' veya 'millet' gibi kelimelerde aynı ünsüzün tekrarlanmasını sağlayan işareti düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Aşağıdaki harflerden hangisi kendisinden sonra gelen harfle bitişmeyen (birleşmeyen) harflerden biridir?", "o": [{"t": "ز (ze)", "ok": true, "why": "Elif, dal, zel, re, ze, je, vav ve hâ-i resmiye kendinden sonraki harflerle bitişmeyen gruptadır."}, {"t": "ب (be)", "ok": false, "why": "Be harfi hem kendinden önceki hem de kendinden sonraki harfle bitişen bir harftir."}, {"t": "س (sin)", "ok": false, "why": "Sin harfi hem sağındaki hem de solundaki harfe bağlanabilir."}, {"t": "ف (fe)", "ok": false, "why": "Fe harfi iki tarafa da bitişme özelliğine sahiptir."}], "hint": "Sadece sağındaki harfe bağlanan ve soluna çizgi uzatmayan 8 temel harften birini seçiniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Aşağıdaki harflerden hangisi hem kendisinden önceki hem de kendisinden sonraki harfle birleşebilen (bitişen) harflerdendir?", "o": [{"t": "ش (şin)", "ok": true, "why": "Şin harfi kelime başında, ortasında ve sonunda formu değişerek iki taraftaki harflerle de bitişir."}, {"t": "د (dal)", "ok": false, "why": "Dal harfi kendinden sonra gelen harfe bitiştirilmez."}, {"t": "ر (re)", "ok": false, "why": "Re harfi solundaki (kendisinden sonraki) harfle birleşmez."}, {"t": "و (vav)", "ok": false, "why": "Vav harfi kendisinden sonra gelen harfe bağlanmayan gruptadır."}], "hint": "Kendinden sonraki ile birleşmeyen 8 harf (ا, د, ذ, ر, ز, ژ, و, ه) dışındaki bir seçeneğe odaklanın.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Şekilce birbirine benzeyen harf grupları düşünüldüğünde, gövde yapısı aynı olup altındaki üç nokta ile \"ج\" (cim), \"ح\" (ha) ve \"خ\" (hı) harflerinden ayrılan harf hangisidir?", "o": [{"t": "çe (چ)", "ok": true, "why": "Cim ailesinde yer alan çe harfi, karın kısmına koyulan üç nokta ile diğer kardeş harflerden ayrılır."}, {"t": "pe (پ)", "ok": false, "why": "Pe harfi üç noktalıdır ancak 'be' ailesine (yayvan gövdeli harflere) aittir."}, {"t": "se (ث)", "ok": false, "why": "Peltek se harfi üç noktalıdır ancak 'be-te' grubuyla aynı gövde şekline sahiptir."}, {"t": "şin (ش)", "ok": false, "why": "Şin harfi üç noktalıdır fakat 'sin' ailesine dahil bir harftir."}], "hint": "Cim harfinin ortasında tek nokta varken, bu harfin içinde/altında üç nokta bulunur.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Cezm (sakin/sükûn) işareti ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", "o": [{"t": "Harfin üstüne konur ve üzerine geldiği harfi ünsüz (sakin) okutur.", "ok": true, "why": "Cezm işareti bir harfin üzerinde yer alarak o harfin ünlü almadan duraklayıp ünsüz sesiyle kapanmasını sağlar."}, {"t": "Harfin altına konur ve harfi /ı/ veya /i/ sesleriyle okutur.", "ok": false, "why": "Harfin altına konup /ı/i/ sesi veren işaret esre (kesre) harekesidir."}, {"t": "Kelimenin son harfine konarak /an/ veya /en/ sesi ekler.", "ok": false, "why": "Kelime sonuna /an/en/ sesi katan işaret üstünlü tenvindir."}, {"t": "Harfin üzerine konarak aynı ünsüzün iki kez tekrarlanmasını sağlar.", "ok": false, "why": "Ünsüzü ikizleştiren işaret şeddendir."}], "hint": "Kelime içinde kapalı hecelerin sonundaki ünsüzün Harekeksiz (sakin) okunduğunu belirten simgedir.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Osmanlı Türkçesinde kelime sonunda ünlü (e/a) yerine kullanıldığında kendisinden sonraki ekle bitişmeyen ve \"hâ-i resmiye\" olarak adlandırılan harf aşağıdakilerden hangisidir?", "o": [{"t": "ه (he)", "ok": true, "why": "Kelime sonunda okutucu/ünlü görevi üstlenen 'he' harfine hâ-i resmiye denir ve bu işlevdeyken kendinden sonrakine bitişmez."}, {"t": "ى (ye)", "ok": false, "why": "Ye harfi dar ünlüler için kullanılır ve kelime sonunda sonrakiyle bitişme kuralı farklı değerlendirilir."}, {"t": "ك (kef)", "ok": false, "why": "Kef harfi ünsüz işaretler; okutucu hâ-i resmiye adını almaz."}, {"t": "ت (te)", "ok": false, "why": "Te harfi asli ünsüzdür, okutucu he ile karıştırılmamalıdır."}], "hint": "Şekilce 'he' olup Türkçe kelimelerin sonunda e/a ünlüsünü göstermeye yarayan harfi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Türkçeye özgü genizsil \"n\" sesini (kâf-ı nûnî / sağır kef) göstermek için Osmanlı Türkçesi alfabesinde kullanılan özel harf aşağıdakilerden hangisidir?", "o": [{"t": "ڭ", "ok": true, "why": "Üzerinde üç nokta bulunan kef biçimindeki 'kâf-ı nûnî' (ڭ) harfi genizden gelen 'n' sesini gösterir."}, {"t": "گ", "ok": false, "why": "Üzerinde çizgi bulunan 'kâf-ı fârisî' (گ) 'g' ve 'ğ' sesleri için kullanılır."}, {"t": "ك", "ok": false, "why": "Yalın kef (ك) öncelikle 'k' sesini temsil eder."}, {"t": "ق", "ok": false, "why": "Kaf (ق) harfi kalın 'k' seslerini ifade etmek için kullanılır."}], "hint": "Kef harfinin üzerine üç nokta konularak oluşturulan ve genizsel n sesini veren işareti arayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Osmanlı Türkçesinde Türkçe kelimelerin yazımında, bugünkü alfabede tek sesle gösterilen bazı ünsüzlerin kalın ve ince hâlleri için ayrı harfler kullanılır. Buna göre \"t\" ünsüzünün kalın ve ince hâlleri aşağıdakilerin hangisinde sırasıyla doğru verilmiştir?", "o": [{"t": "ط - ت", "ok": true, "why": "Osmanlı Türkçesi alfabesinde 't' sesinin kalın şekli tı (ط), ince şekli ise te (ت) harfi ile temsil edilir."}, {"t": "ص - س", "ok": false, "why": "Bu harf çifti 's' ünsüzünün kalın (sad) ve ince (sin) şekillerini göstermek için kullanılır."}, {"t": "ظ - ز", "ok": false, "why": "Bu harf çifti 'z' ünsüzünün kalın (zı) ve ince (ze) biçimlerini karşılar."}, {"t": "ق - ك", "ok": false, "why": "Bu harf çifti 'k' ünsüzünün kalın (kaf) ve ince (kef) karşılıklarıdır."}], "hint": "Kelime başındaki 'tat' ve 'ter' kelimelerinin ilk harflerini göz önüne getiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Türkçe kelimelerin başındaki \"s\" ünsüzü yazılırken, kendisinden sonra gelen ünlünün kalın veya ince oluşuna dikkat edilir. Buna göre, birinci hecesinde kalın ünlü bulunan bir Türkçe kelimenin başındaki \"s\" sesi aşağıdaki harflerden hangisiyle gösterilir?", "o": [{"t": "ص", "ok": true, "why": "Türkçe kelime başında 's' sesinden sonra kalın ünlü gelirse, kalın sırayı göstermek üzere sad (ص) harfi tercih edilir."}, {"t": "س", "ok": false, "why": "Sin harfi, Türkçe kelimelerde ince ünlülerle birlikte veya kelime içinde ince sırayı belirtmek için kullanılır."}, {"t": "ث", "ok": false, "why": "Peltek se harfi yalnızca Arapça kökenli kelimelerin yazımında yer alır, Türkçe kelimelerin kökünde bulunmaz."}, {"t": "ظ", "ok": false, "why": "Zı harfi 'z' sesinin kalın karşılığı olup 's' sesini temsil etmez."}], "hint": "'Sat' veya 'sar' kelimelerinin yazımında kullanılan ilk harfi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Osmanlı Türkçesinde genizsi \"n\" (kâf-ı nûnî / sağır kef) sesini göstermek için kullanılan temel harf aşağıdakilerden hangisidir?", "o": [{"t": "ڭ / ك", "ok": true, "why": "Genizsi 'n' sesi Osmanlı Türkçesi alfabesinde kef (ك / ڭ) harfiyle gösterilir ve sağır kef olarak adlandırılır."}, {"t": "ن", "ok": false, "why": "Nun harfi diş sesi olan standart 'n' ünsüzünü göstermede kullanılır."}, {"t": "غ", "ok": false, "why": "Gayn harfi kalın 'ğ' sesini temsil eden bir ünsüzdür."}, {"t": "ق", "ok": false, "why": "Kaf harfi kalın 'k'
