ıdakilerden hangisidir?", "o": [{"t": "Bağlı Cümle", "ok": true, "why": "Ayrı cümlelerin veya yargıların bağlaçlar vasıtasıyla bir araya getirildiği yapıdır."}, {"t": "Sıralı Cümle", "ok": false, "why": "Yargıların bağlaç yerine virgül veya noktalı virgülle sıralandığı yapıdır."}, {"t": "Birleşik Cümle", "ok": false, "why": "Tek bir temel yüklem ve ona bağlı yan cümleciklerden oluşan yapıdır."}, {"t": "Basit Cümle", "ok": false, "why": "İçinde yalnızca tek bir yargı ve yüklem barındıran yapıdır."}], "hint": "Yargıları birbirine kavuşturan dil bilgisi bağlama ögelerine odaklanın.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "'Vişne reçeli' ve 'gül kokusu' örnekleri tamlama ilişkisi bulunan öbeklerden hangisine girmektedir?", "o": [{"t": "Belirtisiz ad tamlaması", "ok": true, "why": "Tamlayanın ilgi eki almadığı, yalnızca tamlananın iyelik eki aldığı ad tamlaması türüdür."}, {"t": "Belirtili ad tamlaması", "ok": false, "why": "Tamlayanın da ilgi eki (-ın/-in) aldığı tamlama türüdür."}, {"t": "Takısız ad tamlaması", "ok": false, "why": "Hem tamlayanın hem tamlananın ek almadığı ad tamlaması yapısıdır."}, {"t": "Sıfat tamlaması", "ok": false, "why": "Bir ismin sıfat tarafından nitelendiği ve iyelik eki içermeyen yapıdır."}], "hint": "Tamlayan ögenin yalın kaldığı, tamlanan ögenin ise iyelik eki aldığı tamlama yapısını düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Türk dilinin söz varlığı içinde yer alan; toplumsal yaşamda dilek, temenni, dua veya beddua bildirmek amacıyla kullanılan kalıplaşmış söz öbekleri aşağıdakilerden hangisidir?", "o": [{"t": "Alkış ve kargış", "ok": true, "why": "Alkış dua ve iyi dilekleri, kargış ise beddua ve kötü dilekleri ifade eden geleneksel söz varlığı ögesidir."}, {"t": "İlişki sözleri", "ok": false, "why": "Selamlaşma ve hatır sorma gibi gündelik toplumsal iletişim kalıplarını kapsar.", "p": true}, {"t": "Ağız ögeleri", "ok": false, "why": "Bölgesel veya yöresel konuşma farklılıklarından doğan sözcükleri ifade eder."}, {"t": "Argo", "ok": false, "why": "Belirli grup veya toplumsal katmanların kullandığı özel söz dağarcığına dayanır."}], "hint": "Halk kültüründe iyilik dileme veya kınama amacıyla kullanılan ikili kavram çiftini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Özel bir nesne veya marka adının zamanla o türdeki tüm ürünleri kapsayacak şekilde kullanılmasına 'genelleşme' denir. Aşağıdakilerden hangisi bu yolla söz varlığına katılmış bir kelimedir?", "o": [{"t": "Jilet", "ok": true, "why": "Marka adının zamanla tıraş bıçağının genel adı haline gelmesi genelleşme örneğidir."}, {"t": "Uydu", "ok": false, "why": "Yabancı sözcük yapısına uygun şekilde türetilmiş bir örnekseme örneğidir."}, {"t": "Başkan", "ok": false, "why": "Tarihî metinlerden veya ağızlardan taranarak yazı diline kazandırılmış bir sözcüktür."}, {"t": "Arge", "ok": false, "why": "İki farklı sözcüğün hece birleşimiyle oluşturulmuş karma bir sözcüktür."}], "hint": "Belli bir markanın bütün tıraş bıçakları için ortak ad haline gelmesini hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Yabancı bir dildeki sözcüğün biçimsel yapısı örnek alınarak Türkçe kök ve eklerle yeni bir kelime oluşturulması işlemine 'örnekseme' denir. Aşağıdakilerden hangisi bu yönteme örnektir?", "o": [{"t": "Okul", "ok": true, "why": "Fransızca 'école' sözcüğünün ses ve yapı bakımından Türkçeye uyarlanıp türetilmesiyle oluşturulmuştur."}, {"t": "Santim", "ok": false, "why": "Sözcüğün hece eksiltilmesiyle kısaltılması sonucunda ortaya çıkan kırpma örneğidir."}, {"t": "Patates", "ok": false, "why": "Başka bir dilden Türkçeye doğrudan geçmiş bir kopyalama (alıntı) örneğidir."}, {"t": "Yozlaşmak", "ok": false, "why": "Halk ağızlarından derlenerek yazı diline aktarılmış bir derleme örneğidir."}], "hint": "Fransızca 'école' kelimesinin sesletim ve yapısına benzetilerek türetilen sözcüğü arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Tarihî Türk dili metinlerinde geçen ancak unutulmuş olan sözcüklerin taranarak günümüz yazı diline yeniden kazandırılmasına 'tarama' denir. Aşağıdakilerden hangisi tarama yoluyla söz varlığına katılmıştır?", "o": [{"t": "Başkan", "ok": true, "why": "Eski metinlerin taranması sonucu ortaya çıkarılıp modern Türkçe söz varlığına kazandırılmıştır."}, {"t": "Kilo", "ok": false, "why": "Kilogram sözcüğünün sonundaki hecelerin atılmasıyla oluşmuş bir kırpma örneğidir."}, {"t": "Futbol", "ok": false, "why": "Yabancı dilden doğrudan alınan bir kopyalama örneğidir."}, {"t": "Selpak", "ok": false, "why": "Bir markanın nesne adının yerine geçmesiyle oluşan genelleşme örneğidir."}], "hint": "Eski yazılı metinlerin incelenmesi sonucu günümüz diline kazandırılan yönetsel unvanı düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Ölçünlü dilde bulunmayan ancak yörelere ait halk ağızlarında yaşayan sözcüklerin toplanıp yazı diline kazandırılmasına 'derleme' adı verilir. Aşağıdakilerden hangisi bu yolla dilimize kazandırılmıştır?", "o": [{"t": "Alan", "ok": true, "why": "Ağız araştırmaları ve halk dilinden toplanıp ölçünlü Türkçeye kazandırılmış bir derleme sözcüğüdür."}, {"t": "Bayan", "ok": false, "why": "Dil devrimi döneminde bilinçli ve amaçlı bir şekilde türetilen kasıtlı yaratma örneğidir."}, {"t": "Ordonat", "ok": false, "why": "Ordu ve donatım kelimelerinin birleştirilmesiyle yapılan karma sözcük örneğidir."}, {"t": "ASELSAN", "ok": false, "why": "Kurum adının baş harflerinden veya ilk hecelerinden oluşan bir kısaltma örneğidir."}], "hint": "Ağızlardan toplanarak 'saha/meydan' anlamında kullanılan Türkçe sözcüğü hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "İki farklı sözcüğün ilk veya son hecelerinin bir araya getirilmesiyle yeni bir kavramın türetilmesi işlemine 'karma' adı verilir. Aşağıdakilerden hangisi karma yöntemiyle oluşturulmuştur?", "o": [{"t": "Ordonat", "ok": true, "why": "'Ordu' ve 'donatım' sözcüklerinin hece birleşimiyle oluşan karma bir sözcüktür."}, {"t": "Deprenmek", "ok": false, "why": "Halk ağızlarından toplanarak dilde kullanılan derleme örneğidir."}, {"t": "Yöre", "ok": false, "why": "Tarihî kaynaklardan taranarak dile kazandırılan tarama örneğidir."}, {"t": "Köken", "ok": false, "why": "Eski metin araştırmalarıyla günümüz diline aktarılan tarama sözcüğüdür."}], "hint": "'Ordu' ve 'donatım' sözcüklerinin bir araya getirilerek kısaltılmış yeni bir yapı kazanmasını düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Başka dillerden biçim veya anlam olarak Türkçeye geçen ve söz varlığında yer alan alıntı kelimelere 'kopyalama' denir. Aşağıdakilerden hangisi kopyalama yoluyla Türkçeye girmiştir?", "o": [{"t": "Patates", "ok": true, "why": "Yabancı bir dilden Türkçeye doğrudan geçen bir kopyalama örneğidir."}, {"t": "Yüzde", "ok": false, "why": "Sözcük çekim kalıplarının zamanla sabitleşmesiyle oluşan kalıplaşma örneğidir."}, {"t": "Çıktı", "ok": false, "why": "Eylem türevinin kalıcı isim haline gelmesiyle oluşan kalıplaşma örneğidir."}, {"t": "Geliştir", "ok": false, "why": "Türkçe kök üzerine türetme eki getirilmesiyle yapılan türetme örneğidir."}], "hint": "Sebze adı olan ve yabancı dilden dilimize kopyalanarak geçen sözcüğü dikkate alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Sözcüğün sonundaki veya içindeki ses ve hecelerin atılarak daha kısa bir biçimde kullanılmasına 'kırpma' denir. Aşağıdakilerden hangisi kırpma örneğidir?", "o": [{"t": "Pop", "ok": true, "why": "'Popüler' sözcüğünün hece eksiltilmesi sonucu oluşan kırpılmış biçimidir."}, {"t": "Yazar", "ok": false, "why": "Geniş zaman ekinin kalıcı ad yapmasıyla oluşan kalıplaşma örneğidir."}, {"t": "Uygar", "ok": false, "why": "Kavram ihtiyacını karşılamak üzere bilinçli üretilen kasıtlı yaratma örneğidir."}, {"t": "Genel", "ok": false, "why": "Fransızca 'général' sözcüğünden hareketle türetilen örnekseme örneğidir."}], "hint": "'Popüler' müzik türünün dil içinde kısalmış biçimini hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Toplumda belirli kavramları karşılamak amacıyla doğrudan dil bilinciyle ve bilinçli bir planlamayla yeni sözcükler üretilmesine 'kasıtlı yaratma' denir. Aşağıdakilerden hangisi bu yolla türetilmiştir?", "o": [{"t": "Koşul", "ok": true, "why": "Şart kavramını karşılamak üzere bilinçli ve kasıtlı biçimde yaratılmış bir sözcüktür."}, {"t": "Belleten", "ok": false, "why": "Yabancı sözcük yapısına benzetilerek türetilen örnekseme örneğidir."}, {"t": "Toptan", "ok": false, "why": "Ek ve kök birleşimiyle kalıplaşmış bir sözcük örneğidir."}, {"t": "Sanayağı", "ok": false, "why": "Belirli bir margarin markasının nesneye ad olmasıyla gelişen genelleşme örneğidir."}], "hint": "Arapça 'şart' kelimesine karşılık olarak dil devrimi sürecinde bilinçli oluşturulan kelimeyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Yabancı veya kökeni bilinmeyen kelimelerin halk tarafından bilinen Türkçe ögelere benzetilerek yeniden anlamlandırılmasına 'yerlileştirme' (halk etimolojisi) denir. Kaynakta verilen bilgilere göre aşağıdakilerden hangisi yerlileştirme örneğidir?", "o": [{"t": "İstanbul", "ok": true, "why": "Halk tarafından 'İslam+bol' biçiminde anlamlandırılarak yerlileştirilmiş bir şehir adıdır."}, {"t": "Kremlin", "ok": false, "why": "Başka bir kurumun yerine kullanılan bir aktarma örneğidir."}, {"t": "Führer", "ok": false, "why": "Hitler'i zihinde canlandıran bir çağrıştırma anlamı örneğidir."}, {"t": "Kol saati", "ok": false, "why": "Somut bir varlığı doğrudan adlandıran somut anlam örneğidir."}], "hint": "Halk arasında 'İslam+bol' yakıştırmasıyla açıklanan şehir adını hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Çekimli eylemlerin veya ek almış biçimlerin zamanla ek fonksiyonunu yitirip kalıcı isim haline gelmesine 'kalıplaşma' adı verilir. Aşağıdakilerden hangisi kalıplaşma yoluyla türetilmiştir?", "o": [{"t": "Yazar", "ok": true, "why": "-ar geniş zaman ekinin zamanla kalıcı ad yapmasıyla oluşan kalıplaşma örneğidir."}, {"t": "İmge", "ok": false, "why": "Fransızca 'image' sözcüğünden örneksenerek oluşturulmuştur."}, {"t": "Sanayağı", "ok": false, "why": "Ticari bir markanın ürüne ad olmasıyla oluşan genelleşme örneğidir."}, {"t": "Derya", "ok": false, "why": "Farsçadan Türkçeye geçmiş bir kopyalama örneğidir."}], "hint": "Fiil geniş zaman eki alarak zamanla kalıcı meslek/faaliyet adı haline gelmiş sözcüğü düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Çeşitli bilim, sanat, spor veya meslek alanlarında özel anlamlarıyla kullanılan sözcüklere ne ad verilir?", "o": [{"t": "Terim", "ok": true, "why": "Belirli bir meslek veya bilim dalına özgü kavramları karşılayan özel anlamlı sözcüklerdir."}, {"t": "Argo", "ok": false, "why": "Belirli sosyal grupların ortak dilden ayrı kullandığı özel söz varlığıdır."}, {"t": "Ağız", "ok": false, "why": "Bir dilin aynı ülke sınırları içindeki bölgesel söyleyiş farklarıdır."}, {"t": "İkileme", "ok": false, "why": "Anlamı güçlendirmek için sözcüklerin yinelemesiyle kurulan öbektir."}], "hint": "Matematik, tıp veya dil bilgisi gibi uzmanlık alanlarına özgü kavram adlarını hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 6}, {"q": "Aşağıdakilerden hangisi 'Türkçenin Gücü ve İç Zenginliği' başlığı altında incelenen konulardan biri değildir?", "o": [{"t": "Akrabalık Adlarında Çeşitlilik", "ok": false, "why": "Türkçenin aile ve akrabalık bağlarını ifade eden zengin kavram dünyasını gösteren ana başlıklardan biridir."}, {"t": "Atasözleri ve Anlatım Gücü", "ok": false, "why": "Türk dilinin tarihsel süreçte biriktirdiği derin mecaz ve anlatım gücünü temsil eder."}, {"t": "İlişki ve Nezaket Sözleri", "ok": false, "why": "Toplumsal yaşamda kullanılan zengin nezaket ve selamlaşma kaliplarını kapsar."}, {"t": "Eğitim ve Öğretim Dilinin Yabancılaştırılması", "ok": true, "why": "Bu konu Türkçenin gücü ve iç zenginliği başlığında değil, dilin karşı karşıya olduğu güncel sorunlar arasında değerlendirilir."}], "hint": "Dilin olumlu nitelikleri ve derinlikleri yerine dilde yaşanan olumsuz bir gelişmeye odaklanan seçeneği arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Türk dilinin yayılma alanları dikkate alındığında, hem Halaçça hem de Horasan Türkçesinin konuşulduğu ülke aşağıdakilerden hangisidir?", "o": [{"t": "İran", "ok": true, "why": "Her iki Türk yazı dili ve değişkesi de İran sınırları içerisinde varlığını sürdürmektedir."}, {"t": "Afganistan", "ok": false, "why": "Afganistan'da Özbekçe ve Türkmence gibi diller konuşulsa da Halaçça ve Horasan Türkçesinin ana coğrafyası değildir."}, {"t": "Özbekistan", "ok": false, "why": "Özbek ve Karakalpak Türklerinin yoğun yaşadığı temel ülkedir."}, {"t": "Rusya Federasyonu", "ok": false, "why": "Tatar, Başkurt ve Hakas gibi pek çok grubun yaşadığı ülke olmasına rağmen Halaçça burada yer almaz."}], "hint": "Orta Doğu'da Afşar ve Kaşgay Türkçelerinin de yoğun olarak görüldüğü ülkeyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Türk dilinin coğrafi yayılma alanları incelendiğinde, Salar Türkçesi ve Sarı Uygur Türkçesinin ortak yayılma alanı aşağıdakilerden hangisidir?", "o": [{"t": "Çin", "ok": true, "why": "Hem Salar hem de Sarı Uygur Türkçesi Çin sınırları içerisinde varlığını sürdüren Türk yazı dillerindendir."}, {"t": "Moğolistan", "ok": false, "why": "Tuva ve Kazak Türkçesi konuşurlarına ev sahipliği yapsa da bu iki dilin ana vatanı değildir."}, {"t": "Kazakistan", "ok": false, "why": "Kazak, Ahıska, Uygur ve Karakalpak topluluklarının bulunduğu Orta Asya ülkesidir."}, {"t": "Rusya Federasyonu", "ok": false, "why": "Sibirya ve Volga bölgesindeki birçok Türk boyunun yaşadığı ancak Salar ve Sarı Uygurların bulunmadığı ülkedir."}], "hint": "Doğu Asya'da Uygur Türkçesinin de konuşulduğu geniş coğrafyayı anımsayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Gagavuz Türkçesinin özerk bir bölge olarak resmîleştiği ve yoğun biçimde konuşulduğu ülke aşağıdakilerden hangisidir?", "o": [{"t": "Moldova", "ok": true, "why": "Gagavuz Yeri Özerk Bölgesi Moldova sınırları içerisinde hukuki statüye sahiptir."}, {"t": "Ukrayna", "ok": false, "why": "Gagavuz nüfusun yaşadığı ülkelerden biri olmakla birlikte özerk bölgenin bulunduğu yer değildir."}, {"t": "Romanya", "ok": false, "why": "Balkanlar'da Gagavuz Türklerinin yerleştiği ancak özerk idarenin kurulmadığı bir ülkedir."}, {"t": "Bulgaristan", "ok": false, "why": "Gagavuz konuşurlarının bulunduğu bir diğer Balkan ülkesidir."}], "hint": "Gagavuz Yeri Özerk Bölgesi'ne ev sahipliği yapan Doğu Avrupa ülkesini hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Yakutça (Saha Türkçesi) Türk dilinin yayılma alanları içinde temelde hangi özerk cumhuriyet ve ülke sınırlarında konuşulmaktadır?", "o": [{"t": "Rusya Federasyonu (Yakutistan Cumhuriyeti)", "ok": true, "why": "Yakutça, Rusya Federasyonu'na bağlı Yakutistan Özerk Cumhuriyeti'nde konuşulmaktadır."}, {"t": "Çin Halk Cumhuriyeti", "ok": false, "why": "Uygur, Salar ve Kazakh topluluklarının yaşadığı Doğu Asya coğrafyasıdır."}, {"t": "Kırgızistan", "ok": false, "why": "Kırgız Türkçesinin ana yayılma merkezidir."}, {"t": "Özbekistan", "ok": false, "why": "Özbekçe ve Karakalpakçanın yaygın olduğu bağımsız Orta Asya devletidir."}], "hint": "Sibirya'nın kuzeydoğusunda yer alan ve Rusya'ya bağlı olan özerk bölgeyi göz önüne getirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Karayim Türkçesinin konuşulduğu Doğu Avrupa ülkeleri arasında aşağıdakilerden hangisi yer alır?", "o": [{"t": "Litvanya", "ok": true, "why": "Karayim Türkçesi Litvanya, Polonya ve Rusya Federasyonu'nda konuşulan Türk dillerindendir."}, {"t": "Çin", "ok": false, "why": "Salar ve Sarı Uygur gibi Türk topluluklarının yer aldığı Asya ülkesidir."}, {"t": "İran", "ok": false, "why": "Afşar, Halaç, Kaşgay ve Horasan Türkçesinin konuşulduğu coğrafyadır."}, {"t": "Gürcistan", "ok": false, "why": "Ahıska ve Azerbaycan Türkçesinin görüldüğü Kafkasya ülkesidir."}], "hint": "Baltık bölgesinde yer alan ve Polonya ile komşu olan ülkeyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "İlgili ders materyalindeki 'Türkçedeki Alıntı Sözcüklerin Kaynağı Diller' listesinde yer alan Doğu Asya dili aşağıdakilerden hangisidir?", "o": [{"t": "Japonca", "ok": true, "why": "Türkçe söz varlığına etki eden diller şemasında Japonca açıkça belirtilmiştir."}, {"t": "Portekizce", "ok": false, "why": "Listelenen alıntı sözcük kaynakları arasında bu dil bulunmamaktadır."}, {"t": "İsveççe", "ok": false, "why": "Ders dokümanındaki alıntı diller şemasında yer almayan bir İskandinav dilidir."}, {"t": "Norveççe", "ok": false, "why": "Alıntı sözcük kaynakları tablosuna dahil edilmemiştir."}], "hint": "Uzak Doğu kültüründen Türkçeye giren sözcüklerin kaynağı olan ada ülkesi dilini anımsayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Ders materyalinde yer alan 'Türkçedeki Alıntı Sözcüklerin Kaynağı Diller' listesine göre aşağıdaki dillerden hangisi Türkçeye sözcük veren Slav dillerindendir?", "o": [{"t": "Bulgarca", "ok": true, "why": "Türkçenin alıntı sözcük aldığı kaynak diller şemasında Bulgarca yer almaktadır."}, {"t": "Sırpça", "ok": false, "why": "Listede Türkçeye sözcük aktaran diller arasında sayılmamıştır."}, {"t": "Makedonca", "ok": false, "why": "İlgili ünitedeki alıntı diller tablosunda yer almaz."}, {"t": "Çekçe", "ok": false, "why": "Kaynak diller tablosuna girmeyen bir Batı Slav dilidir."}], "hint": "Türkiye'nin batı komşularından biri olan ve Slav dil ailesine mensup dili düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Karakalpak Türkçesinin özerk cumhuriyet olarak bünyesinde bulunduğu ülke aşağıdakilerden hangisidir?", "o": [{"t": "Özbekistan", "ok": true, "why": "Karakalpakistan Özerk Cumhuriyeti Özbekistan sınırları içinde idari yapıya sahiptir."}, {"t": "Kazakistan", "ok": false, "why": "Karakalpak nüfusu barındırmakla birlikte özerk cumhuriyet idaresini içermez."}, {"t": "Türkmenistan", "ok": false, "why": "Karakalpakların yaşadığı ancak özerk bölge statüsünün bulunmadığı komşu ülkedir."}, {"t": "Tacikistan", "ok": false, "why": "Orta Asya'da Karakalpak azınlığın yer aldığı fakat özerk yapının bulunmadığı devlettir."}], "hint": "Aril Gölü yakınlarında kurulan Karakalpakistan Özerk Cumhuriyeti'ni barındıran Orta Asya ülkesini anımsayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Türk dillerinin yayılma alanları dikkate alındığında hem Afşar hem de Kaşgay Türkçesinin konuşulduğu ortak ülke aşağıdakilerden hangisidir?", "o": [{"t": "İran", "ok": true, "why": "Afşar, Kaşgay, Halaç ve Horasan Türkçeleri İran coğrafyasında konuşulmaktadır."}, {"t": "Rusya Federasyonu", "ok": false, "why": "Altay, Hakas, Başkurt ve Tuva gibi dillerin yaygın olduğu coğrafyadır."}, {"t": "Çin", "ok": false, "why": "Salar, Uygur ve Sarı Uygur Türkçesinin konuşulduğu bölgedir."}, {"t": "Ukrayna", "ok": false, "why": "Gagavuz, Kırım Tatarı ve Karaçay gruplarının yaşadığı Doğu Avrupa ülkesidir."}], "hint": "Güneybatı Oğuz grubuna ait birçok topluluğun yaşadığı komşu Orta Doğu ülkesini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Türkçenin iç zenginliği açıklanırken akrabalık adlarındaki çeşitlilik önemli bir örnek olarak gösterilir. Aşağıdakilerden hangisi bu zenginliği doğrudan kanıtlar?", "o": [{"t": "Anne ve baba tarafındaki akrabalar için ayrı kavramların bulunması", "ok": true, "why": "Amca, dayı, hala, teyze gibi kavramların her biri için ayrı sözcüklerin kullanılması akrabalık adlarındaki anlam derinliğini ve çeşitliliği gösterir."}, {"t": "Tüm akrabalar için tek bir genel sözcüğün tercih edilmesi", "ok": false, "why": "Genel sözcük kullanımı dildeki kavramsal çeşitliliği değil, genellemeyi ifade eder."}, {"t": "Akrabalık isimlerinin yabancı dillerden kopyalanması", "ok": false, "why": "Dış etkileşimi gösterir, dilin kendi iç zenginliğini temsil etmez."}, {"t": "Sadece çekirdek aile üyelerine isim verilmiş olması", "ok": false, "why": "Sınırlı bir söz varlığına işaret eder."}], "hint": "Ebeveynlerin kardeşlerini tanımlarken kullanılan farklı kelimeleri göz önüne getirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "'Türkçedeki Alıntı Sözcüklerin Kaynağı Diller' şemasında yer alan ve Ural dil ailesine mensup olan Avrupa dili aşağıdakilerden hangisidir?", "o": [{"t": "Fince", "ok": true, "why": "Fince, Türkçe söz varlığını besleyen Ural dil ailesine ait dillerden biri olarak şemada gösterilmiştir."}, {"t": "İspanyolca", "ok": false, "why": "Hint-Avrupa dil ailesinin Roman koluna mensuptur."}, {"t": "Almanca", "ok": false, "why": "Hint-Avrupa dil ailesinin Cermen koluna aittir."}, {"t": "Fransızca", "ok": false, "why": "Hint-Avrupa dil ailesine bağlı bir Roman dilidir."}], "hint": "Kuzey Avrupa'da (İskandinavya bölgesinde) konuşulan Ural kökenli dili anımsayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Şor Türkçesi, Türk dilinin coğrafi yayılma alanları çerçevesinde Rusya Federasyonu'nun hangi idari bölgesinde konuşulmaktadır?", "o": [{"t": "Kemerovo bölgesi", "ok": true, "why": "Şor ve Teleüt Türkçesi Rusya Federasyonu'nun Kemerovo bölgesinde konuşulmaktadır."}, {"t": "Dağıstan Cumhuriyeti", "ok": false, "why": "Kumuk ve Nogay Türkçesinin yaygın olduğu özerk cumhuriyettir."}, {"t": "Kabartay-Balkar Cumhuriyeti", "ok": false, "why": "Balkar Türkçesinin ana merkezidir."}, {"t": "Gagavuz Yeri", "ok": false, "why": "Moldova sınırlarında yer alan Gagavuz bölgesidir."}], "hint": "Sibirya bölgesinde Teleüt Türkçesiyle aynı coğrafi alanda yer alan bölgeyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 7}, {"q": "Türkçenin 'yazıldığı gibi okunan ve okunduğu gibi yazılan bir dil' olduğu yönündeki yaygın inanışın doğru olmadığını gösteren durum aşağıdakilerden hangisidir?", "o": [{"t": "'Söyleyeyim' sözcüğünün ölçünlü konuşma dilinde 'söyliyim' biçiminde telaffuz edilmesi.", "ok": true, "why": "Ölçünlü Türkçe söyleyişinde yazım kuralları ile seslendirme arasında belirgin farklar bulunabilmekte, bazı sözcükler yazıldığından farklı telaffuz edilmektedir."}, {"t": "Sosyal medyada sesli harflerin kullanılmadan yazışılması.", "ok": false, "why": "Bu durum yazımdaki bir özensizlik veya iletişim alışkanlığı olup kelimenin doğal ve ölçünlü sesletim kurallarıyla doğrudan ilgili değildir."}, {"t": "Yabancı kökenli terimlerin dilimize ses uyumlarına aykırı biçimde girmesi.", "ok": false, "why": "Kelime kökenindeki farklılıklar ve ses uyumu aykırılıkları söyleyiş-yazım arasındaki doğrudan sesletim ilkesinden ziyade söz varlığıyla ilgilidir."}, {"t": "Günlük hayatta kullanılan kelime sayısının sözlükteki toplam söz varlığından az olması.", "ok": false, "why": "Bu durum konuşma ve yazıda kelime hazinesinin kısıtlılığına işaret eder, ses ile harf arasındaki karşılığa ilişkin bir kanıt sunmaz."}], "hint": "Yazı dili ile ölçünlü konuşma dili arasındaki telaffuz farklarını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Türkçenin öğretim ve bilim dili olarak gelişmesini olumsuz etkileyen durumlardan biri olan yabancı dil eğitimiyle ilgili temel yanlışlık aşağıdakilerden hangisidir?", "o": [{"t": "Yabancı dili bir ders olarak öğretmek yerine, derslerin yabancı bir dille (örneğin İngilizce) okutulması.", "ok": true, "why": "Eğitim ve öğretim dilinin yabancılaştırılması, kavramların Türkçe ile işlenmesini önleyerek dilin bilim dili olarak gelişimine engel oluşturur."}, {"t": "Yabancı dil eğitimine erken yaşlarda değil yalnızca yükseköğretim düzeyinde başlanması.", "ok": false, "why": "Eğitim kademesiyle ilgili bu durum dilin öğretim dili haline getirilmesinin yarattığı yapısal engeli açıklamaz."}, {"t": "Öğrencilerin sadece tek bir yabancı dili öğrenmeye yönlendirilip ikinci dili seçememesi.", "ok": false, "why": "Birden fazla dil öğrenimi bireysel bir imkân olup Türkçenin eğitim dili olmaktan çıkarılması sorununu doğrudan temsil etmez."}, {"t": "Yabancı dildeki dil bilgisi kurallarının ezbere dayalı biçimde öğretilmesi.", "ok": false, "why": "Metodolojik bir eksiklik olan bu yaklaşım, Türkçenin bilim ve öğretim dili olmaktan uzaklaştırılması sonucunu doğurmaz."}], "hint": "Yabancı dilin bir öğretim konusu olması ile öğretim vasıtası yapılması arasındaki farkı dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "İş yerlerinde 'Rainbow Kasabı' veya 'Börek Center' gibi adların tercih edilmesi ve ürün kullanım kılavuzlarında Türkçeye yer verilmemesi hangi soruna işaret eder?", "o": [{"t": "İş yaşamında Türkçenin göz ardı edilmesi ve yabancılaşma eğiliminin artması.", "ok": true, "why": "Ticari alandaki yabancı ad ve tabela kullanımı, dildeki yabancılaşmanın iş hayatına ve günlük kültüre yansımasını gösterir."}, {"t": "Konuşma ve yazı dilindeki söyleyiş farklılıklarının derinleşmesi.", "ok": false, "why": "Bu durum kelimelerin telaffuz özellikleriyle değil, iş yeri ve ticari isimlerdeki dil tercihiyle ilgilidir."}, {"t": "Dilin köken bakımından farklı dil aileleriyle etkileşime girmesi.", "ok": false, "why": "Tarihsel dil etkileşimleri doğal bir süreçken, ticari mekân adlarındaki bilinçli yabancılaşma güncel bir kullanım sorunudur."}, {"t": "Türkçedeki eklerin yeni kavramları karşılamada yetersiz kalması.", "ok": false, "why": "Bu tutum Türkçe eklerin yetersizliğinden ziyade toplumsal prestij ve özentiden kaynaklanmaktadır."}], "hint": "Tabela ve ticari işletme isimlerindeki dille ilgili tercihler üzerine odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Büyük Türkçe Sözlük'te yüz binlerce söz varlığı bulunmasına karşın, gündelik hayatta kısıtlı sayıda sözcükle iletişim kurulmasının doğurduğu temel sonuç aşağıdakilerden hangisidir?", "o": [{"t": "Duygu ve düşüncelerin tam aktarılamaması neticesinde yanlış anlamalar ve iletişimsizlik yaşanması.", "ok": true, "why": "Kelime hazinesinin daralması, bireylerin karmaşık düşünce ve duyguları ifade etme yeteneğini sınırlandırarak iletişim kopukluklarına yol açar."}, {"t": "Dildeki nedensizlik ilkesinin ve ses kurallarının geçersiz kılınması.", "ok": false, "why": "Nedensizlik ilkesi dilin temel yapısal bir özelliği olup kullanılan kelime miktarının azlığıyla değişmez."}, {"t": "Standart (ölçünlü) dil ile bölgesel ağızlar arasındaki sınırların ortadan kalkması.", "ok": false, "why": "Ağız çeşitliliği coğrafi ve toplumsal etkenlere bağlıdır; genel kelime kısırlığı ağızları ortadan kaldırmaz."}, {"t": "Dilin yapısal olarak bitişkenlik özelliğini kaybedip bükümlü hale gelmesi.", "ok": false, "why": "Söz varlığının daralması dilin tipolojik ve gramer yapısında bir değişikliğe sebep olmaz."}], "hint": "Kelime hazinesinin yetersizliğinin bireyler arası duygu ve düşünce aktarımına etkisini değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "İnsan dillerinin doğuşunu, insanların doğadaki sesleri taklit etmesi esasına dayandıran dil doğuş kuramı aşağıdakilerden hangisidir?", "o": [{"t": "Yansıma kuramı", "ok": true, "why": "Bu kuram, ilk kelimelerin doğadaki nesne, hayvan ve doğa seslerinin benzetilmesi ve taklit edilmesiyle ortaya çıktığını savunur."}, {"t": "Ünlem kuramı", "ok": false, "why": "Bu kuram dillerin kaynağını doğa seslerinin taklidine değil, insanların korku, sevinç gibi duygularla çıkardığı seslere bağlar."}, {"t": "Ding dong kuramı", "ok": false, "why": "Bu yaklaşım nesnelerin insan zihninde uyandırdığı doğal titreşim ve izlenimlerden hareket eder."}, {"t": "Güneş dil kuramı", "ok": false, "why": "Türkçenin dünya dillerinin kökeninde yer aldığını ileri sürer, genel bir doğa sesi taklidi tezi değildir."}], "hint": "Doğadaki seslerin taklit edilmesiyle türeyen sözcük gruplarını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "VIII-XVII. yüzyıllar arasında Doğu Türkistan'dan İstanbul'a kadar geniş bir coğrafyada kullanılan ve Soğut alfabesinden geliştirilmiş olan alfabe aşağıdakilerden hangisidir?", "o": [{"t": "Uygur alfabesi", "ok": true, "why": "Soğut alfabesinden türetilen ve 18 harften oluşan bu alfabe, uzun süre geniş bir kültür çevresinde kullanılmıştır."}, {"t": "Köktürk alfabesi", "ok": false, "why": "Türklerin bilinen ilk düzenli alfabesi olup Soğut kaynaklı değil, yerli ve orijinal işaret sistemine dayanır."}, {"t": "Brahmi alfabesi", "ok": false, "why": "Hint kökenli bir alfabe olup Türkler tarafından sınırlı alanlarda ve Budist metinlerde kullanılmıştır."}, {"t": "Arap alfabesi", "ok": false, "why": "Samî dil ailesine ait bir alfabe olup Türklerin İslamiyet'i kabulüyle yaygınlaşan bir sistemdir."}], "hint": "Soğut yazısından geliştirilen ve Göç Destanı gibi eserlerin aktarımında kullanılan alfabeyi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Genç Kalemler dergisinde başlatılan Yeni Lisan hareketinin dille ilgili benimsediği ilkeler göz önüne alındığında, aşağıdakilerden hangisi bu hareketin prensiplerinden biri değildir?", "o": [{"t": "Dildeki eksiklikleri kapatmak amacıyla diğer Türk lehçelerinden kelimeler aktarmak.", "ok": true, "why": "Yeni Lisan hareketi, zorunlu olmadıkça diğer Türk lehçelerinden sözcük taşınmasını ilke olarak reddetmiştir."}, {"t": "Yazı dilini konuşma diline yaklaştırıp İstanbul halkının konuştuğu dili esas almak.", "ok": false, "why": "Hareketin temel hedeflerinden biri konuşma dili ile yazı dili arasındaki uçurumu kapatarak İstanbul Türkçesini esas almaktır."}, {"t": "Arapça ve Farsça dil bilgisi kurallarını ve tamlamaları terk etmek.", "ok": false, "why": "Dildeki yabancı dil bilgisi kaidelerinin çıkarılması sadeleşme programının ana maddelerinden biridir."}, {"t": "Dilimize yerleşmiş yabancı kelimeleri Türkçedeki söylenişlerine göre yazmak.", "ok": false, "why": "Yaygınlaşmış ve Türkçeleşmiş yabancı sözcüklerin imlasında halkın telaffuzunun esas alınması ilkesi benimsenmiştir."}], "hint": "Ömer Seyfettin ve arkadaşlarının başka Türk lehçelerinden kelime alma konusundaki tutumunu anımsayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Süreksiz bir ünsüzün sürekli bir ünsüze dönüşmesi olayına 'süreklileşme' denir. Buna göre 'öpke > öfke' sözcük değişiminde görülen ses olayı aşağıdakilerden hangisidir?", "o": [{"t": "Süreklileşme", "ok": true, "why": "Patlamalı ve süreksiz bir ünsüz olan /p/ sesinin sızıcı ve sürekli bir ünsüz olan /f/ sesine dönüşmesi süreklileşme örneğidir."}, {"t": "Ötümlüleşme", "ok": false, "why": "Ötümlüleşme, tonlu/ötümlü olmayan bir ünsüzün ötümlü hale gelmesidir; buradaki temel değişim sızıcılaşmadır."}, {"t": "Ön damaksıllaşma", "ok": false, "why": "Ön damaksıllaşma art damak seslerinin ön damak bölgesine kaymasıyla ilgilidir, ünsüzün sürekli hale gelmesiyle açıklanamaz."}, {"t": "Ünsüz tekleşmesi", "ok": false, "why": "Çift ünsüzlerin teke düşmesini ifade eden bu olay, /p/ sesinin /f/ sesine dönüşümüyle örtüşmez."}], "hint": "Patlamalı (süreksiz) bir sesin sızıcı (sürekli) bir sese dönüşme durumunu dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Osmanlı Dönemi'nin sonlarında Şemsettin Sami tarafından hazırlanan ve Türkçenin en yetkin sözlüklerinden biri kabul edilen eser aşağıdakilerden hangisidir?", "o": [{"t": "Kamus-ı Türkî", "ok": true, "why": "Şemsettin Sami'nin kaleme aldığı Kamus-ı Türkî, Türkçe sözlükçülük tarihinin en önemli köşe taşlarından biridir."}, {"t": "Divanu Lugati't-Türk", "ok": false, "why": "Kaşgarlı Mahmut tarafından XI. yüzyılda Arapça olarak kaleme alınmış ilk Türkçe sözlüktür."}, {"t": "Muhakemetü'l-Lügateyn", "ok": false, "why": "Ali Şir Nevayi tarafından Türkçe ile Farsçayı karşılaştırmak amacıyla yazılmış bir eserdir."}, {"t": "Kavaid-i Osmaniyye", "ok": false, "why": "Ahmet Cevdet Paşa ve Fuat Paşa tarafından kaleme alınmış bir dil bilgisi (gramer) kitabıdır."}], "hint": "19. yüzyıl sonlarında Türkçe kelimelere geniş yer vererek hazırlanan başyapıtı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Dünya dilleri yapı bakımından incelendiğinde, kök değişmeden kelime türetme ve çekim eklerinin kökün sonuna eklenmesi esasına dayanan Türkçe hangi dil grubunda yer alır?", "o": [{"t": "Bitişken (eklemeli) diller", "ok": true, "why": "Bitişken dillerde kelime kökleri sabit kalır ve gramer işlevleri köke eklenen yapım ve çekim ekleriyle sağlanır."}, {"t": "Yalınlayan diller", "ok": false, "why": "Çince gibi yalınlayan dillerde ek bulunmaz, kelimeler biçim değiştirmeden cümledeki sırasına göre anlam kazanır."}, {"t": "Çekimli (bükümlü) diller", "ok": false, "why": "Arapça ve Hint-Avrupa dilleri gibi bükümlü dillerde türetme sırasında kök içi ses değişimleri yaşanır."}, {"t": "İzole diller", "ok": false, "why": "İzole diller bilinen hiçbir dil ailesiyle akrabalığı kanıtlanamamış dillerdir, yapı sınıflandırması terimi değildir."}], "hint": "Kökün değişmeyip eklerin sıralanması esasına dayalı tipolojik grubu hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Cumhuriyet Dönemi'nde Türk dilinin özleştirilmesi ve bilimsel yöntemlerle incelenip geliştirilmesi amacıyla kurulan Türk Dil Kurumu hangi tarihte faaliyete geçmiştir?", "o": [{"t": "12 Temmuz 1932", "ok": true, "why": "Türk Dil Kurumu, Atatürk'ün direktifleriyle 12 Temmuz 1932 tarihinde kurulmuştur."}, {"t": "1 Kasım 1928", "ok": false, "why": "Bu tarih Harf Devrimi'nin gerçekleştiği ve Yeni Türk Harflerinin Kabulü Kanunu'nun çıkarıldığı tarihtir."}, {"t": "1926 Bakü Türkoloji Kongresi", "ok": false, "why": "Azerbaycan'da toplanan ve Türk halklarının ortak alfabe kullanımı kararlarının tartışıldığı kongredir."}, {"t": "10 Mart 1933", "ok": false, "why": "TDK'nin kuruluş tarihi olmayıp Cumhuriyet dönemi kültür çalışmalarının yürütüldüğü takvimdeki farklı bir tarihtir."}], "hint": "1932 yılında Atatürk öncülüğünde kurulan cemiyetin kuruluş gün ve ayını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}, {"q": "Günümüz teknolojisinde 'bilgisayar' ve 'gerilim' gibi başarılı Türkçe terim türetmelerine karşın, bilimsel çalışmalarda yabancı terimlerin olduğu gibi kullanılması dil açısından hangi olumsuz sonucu doğurur?", "o": [{"t": "Türkçenin bilim dili olarak gelişmesini ve yetkinleşmesini engeller.", "ok": true, "why": "Bilimsel kavramların Türkçe terimlerle karşılanmaması dilin işlenme kapasitesini sınırlar ve terim yabancılaşmasına yol açar."}, {"t": "Dildeki eklerin türetme gücünün tamamen ortadan kalkmasına neden olur.", "ok": false, "why": "Yabancı terim kullanımı dilin ek yapısını yok etmez, ancak Türkçe türetme potansiyelinin hayata geçirilmesini kısıtlar."}, {"t": "Ağızlar ile ölçünlü dil arasındaki ses farklarının silinmesine yol açar.", "ok": false, "why": "Terim düzeyindeki yabancılaşma coğrafi söyleyiş ve ağız farklarıyla doğrudan ilgili değildir."}, {"t": "Sözcüklerin köken yapısını tamamen değiştireceğinden dilin ailesini değiştirir.", "ok": false, "why": "Terim alıntıları dilin ait olduğu dil ailesini veya genetik kökenini değiştiremez."}], "hint": "Yabancı terim egemenliğinin dilin yüksek öğretim ve araştırma alanlarındaki imkânlarına etkisini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 8}], "sources": [{"title": "TÜRK DİLİ I - Ünite 1 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=byInbvs0AVo", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 1 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=ppRXsB-OqBk", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 1 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=lWQvjMm1XBc", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=7hP2uhDnBr4", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=BnE7pVebxNs", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=wx2H6EdWWwU", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=TsVy__4JyZw", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=wSiBKUm1RiU", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=e4kNWY9q2Vs", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=bnVhBKuSIR4", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=ofRaKDHOglo", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=r2h3TZbYfSE", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=imOAfhy7dsM", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=wZ_xK3vsGUQ", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 8 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=5DzlVOV7M0Y", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 8 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=xzHUFIWxljE", "type": "youtube"}, {"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 3 (Türkçe altyazı metni)", "url": "", "type": "pasted_text"}, {"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 1 (Türkçe altyazı metni)", "url": "", "type": "pasted_text"}, {"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 2 (Türkçe altyazı metni)", "url": "", "type": "pasted_text"}, {"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 3 (Türkçe altyazı metni)", "url": "", "type": "pasted_text"}, {"title": "TÜRK DİLİ I - Ünite 7 Konu Anlatımı 1 (Türkçe altyazı metni)", "url": "", "type": "pasted_text"}, {"title": "TÜRK DİLİ I - Kitap", "url": "", "type": "file"}], "counts": {"chapters": 8, "cards": 64, "quiz": 115, "sources": 22}, "lang": "tr"}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var KEY = DATA.storageKey + ".app";
  var st = {known: {}, best: 0, seen: 0, done: {}};
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function $(s) { return document.querySelector(s); }
  function norm(s) { return (s || "").toLocaleLowerCase(); }
  var query = "";

  function blocks(parent, list) {
    var ul = null;
    list.forEach(function (b) {
      if (b.h) { ul = null; parent.appendChild(el("h4", null, b.h)); }
      else if (b.li) {
        if (!ul) { ul = el("ul", "notes"); parent.appendChild(ul); }
        ul.appendChild(el("li", null, b.li));
      } else { ul = null; parent.appendChild(el("p", null, b.p)); }
    });
  }

  // ---- progress ------------------------------------------------------------
  function progressRow(name, n, total, unitText, cls) {
    var wrap = el("div", "prog");
    wrap.appendChild(el("p", "muted", name + ": " + n + " / " + total + " " + unitText));
    var bar = el("div", "bar" + (cls ? " " + cls : ""));
    var fill = el("i");
    fill.style.width = (total ? Math.round(100 * n / total) : 0) + "%";
    bar.appendChild(fill);
    wrap.appendChild(bar);
    return wrap;
  }

  function paintChapterDone(btn, card, n) {
    var done = Boolean(st.done[n]);
    btn.textContent = done ? "Tamamlandı ✓" : "Tamamlandı işaretle";
    btn.setAttribute("aria-pressed", done ? "true" : "false");
    card.dataset.done = done ? "1" : "0";
  }

  function toggleChapter(btn, card, n) {
    if (st.done[n]) delete st.done[n]; else st.done[n] = 1;
    save();
    paintChapterDone(btn, card, n);
    paintPanel();
  }

  // ---- panel ---------------------------------------------------------------
  function paintPanel() {
    var v = $("#view-panel");
    v.textContent = "";
    var stats = el("div", "stats");
    [["Bölüm", DATA.counts.chapters], ["Kart", DATA.counts.cards],
     ["Soru", DATA.counts.quiz], ["Kaynak", DATA.counts.sources]].forEach(function (s) {
      var d = el("div", "stat");
      d.appendChild(el("b", null, String(s[1])));
      d.appendChild(el("span", null, s[0]));
      stats.appendChild(d);
    });
    v.appendChild(stats);

    var doneCh = DATA.chapters.filter(function (c) { return st.done[c.n]; }).length;
    var known = DATA.cards.filter(function (c) { return st.known[c.id]; }).length;
    var box = el("div", "card");
    box.appendChild(el("h3", null, "İlerleme"));
    box.appendChild(progressRow("Bölüm", doneCh, DATA.counts.chapters, "bölüm tamamlandı", "b1"));
    box.appendChild(progressRow("Kart", known, DATA.counts.cards, "kart biliniyor", ""));
    if (st.best) box.appendChild(el("p", "muted", "En iyi test: " + st.best + "%"));
    var row = el("div", "row");
    row.style.marginTop = "14px";
    var b1 = el("button", "act primary", "Kartlara başla");
    b1.onclick = function () { show("kartlar"); };
    var b2 = el("button", "act ghost", "Teste gir");
    b2.onclick = function () { show("test"); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    v.appendChild(box);

    if (DATA.brand.tagline) v.appendChild(el("p", "muted", DATA.brand.tagline));
  }

  // ---- cards ---------------------------------------------------------------
  var queue = [], qIndex = 0, revealed = false;
  function startCards() {
    queue = DATA.cards.filter(function (c) { return !st.known[c.id]; });
    if (!queue.length) queue = DATA.cards.slice();
    queue = queue.filter(function (c) {
      return !query || norm(c.front + " " + c.back + " " + c.chTitle).indexOf(query) >= 0;
    });
    qIndex = 0; revealed = false;
    paintCard();
  }
  function paintCard() {
    var v = $("#view-kartlar");
    v.textContent = "";
    if (!queue.length) {
      v.appendChild(el("p", "empty", DATA.counts.cards
        ? "Aramanıza uyan kart yok." : "Bu ders için henüz kart üretilmedi. Defterden kart üretmek için pipeline'ın flashcards aşamasını çalıştırın."));
      return;
    }
    var c = queue[qIndex % queue.length];
    var box = el("div", "card flash");
    box.appendChild(el("div", "kicker", (c.chTitle || "Kart") + " · " + (qIndex + 1) + "/" + queue.length));
    box.appendChild(el("div", "front", c.front));
    if (revealed) box.appendChild(el("div", "back", c.back));
    else box.appendChild(el("div", "muted", "Cevabı görmek için karta dokunun."));
    box.onclick = function () { revealed = true; paintCard(); };
    v.appendChild(box);

    var row = el("div", "row");
    var know = el("button", "act primary", "Biliyorum");
    know.onclick = function () {
      st.known[c.id] = 1; save(); revealed = false;
      queue.splice(qIndex % queue.length, 1);
      if (!queue.length) { paintPanel(); paintCard(); return; }
      paintCard();
    };
    var again = el("button", "act ghost", "Tekrar");
    again.onclick = function () {
      revealed = false; qIndex = (qIndex + 1) % queue.length; paintCard();
    };
    row.appendChild(know); row.appendChild(again);
    v.appendChild(row);
  }

  // ---- chapters ------------------------------------------------------------
  function paintChapters() {
    var v = $("#view-konular");
    v.textContent = "";
    var shown = DATA.chapters.filter(function (ch) {
      if (!query) return true;
      var hay = ch.title + " " + ch.summary + " " + ch.objectives.join(" ");
      ch.notes.forEach(function (b) { hay += " " + (b.p || b.h || b.li || ""); });
      return norm(hay).indexOf(query) >= 0;
    });
    if (!shown.length) { v.appendChild(el("p", "empty", "Aramanıza uyan bölüm yok.")); return; }
    shown.forEach(function (ch) {
      var card = el("section", "card");
      var head = el("div", "chhead");
      var left = el("div");
      left.appendChild(el("div", "kicker", "Bölüm " + ch.n));
      left.appendChild(el("h3", null, ch.title));
      var mark = el("button", "chdone", "");
      mark.type = "button";
      mark.title = "Bu bölümü bitirdiniz mi?";
      mark.onclick = function () { toggleChapter(mark, card, ch.n); };
      paintChapterDone(mark, card, ch.n);
      head.appendChild(left);
      head.appendChild(mark);
      card.appendChild(head);
      if (ch.summary) card.appendChild(el("p", "muted", ch.summary));
      if (ch.objectives.length) {
        var ul = el("ul", "obj");
        ch.objectives.forEach(function (o) { ul.appendChild(el("li", null, o)); });
        card.appendChild(ul);
      }
      if (ch.notes.length) blocks(card, ch.notes);
      if (ch.sources.length) {
        var k = el("div", "kicker", "Kaynaklar");
        k.style.marginTop = "14px";
        card.appendChild(k);
        ch.sources.forEach(function (s) {
          if (s.url) {
            var a = el("a", null, s.title);
            a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
            card.appendChild(a);
            card.appendChild(document.createElement("br"));
          } else card.appendChild(el("div", "muted", s.title));
        });
      }
      v.appendChild(card);
    });
  }

  // ---- quiz ----------------------------------------------------------------
  var pool = [], qi = 0, right = 0, partialRight = 0, answered = false;
  function startQuiz() {
    pool = DATA.quiz.filter(function (q) {
      if (!query) return true;
      return norm(q.q + " " + (q.a || "") + " "
        + q.o.map(function (o) { return o.t; }).join(" ")).indexOf(query) >= 0;
    });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    qi = 0; right = 0; partialRight = 0; answered = false;
    paintQuiz();
  }
  function paintQuiz() {
    var v = $("#view-test");
    v.textContent = "";
    if (!pool.length) {
      v.appendChild(el("p", "empty", DATA.counts.quiz
        ? "Aramanıza uyan soru yok." : "Bu ders için henüz test sorusu yok."));
      return;
    }
    if (qi >= pool.length) {
      var pct = Math.round(100 * right / pool.length);
      st.seen = (st.seen || 0) + 1;
      if (pct > (st.best || 0)) st.best = pct;
      save();
      var box = el("div", "card");
      box.appendChild(el("div", "kicker", "Test bitti"));
      box.appendChild(el("h3", null, right + " / " + pool.length + " doğru · " + pct + "%" +
        (partialRight ? " · " + partialRight + " kısmen doğru" : "")));
      box.appendChild(el("p", "muted", pct >= Math.round(DATA.passMark * 100)
        ? "Geçme sınırının üstündesiniz." : "Geçme sınırı " + Math.round(DATA.passMark * 100) + "%."));
      var row = el("div", "row");
      var again = el("button", "act primary", "Yeniden çöz");
      again.onclick = startQuiz;
      var cards = el("button", "act ghost", "Kartlara dön");
      cards.onclick = function () { show("kartlar"); };
      row.appendChild(again); row.appendChild(cards);
      box.appendChild(row);
      v.appendChild(box);
      paintPanel();
      return;
    }
    var q = pool[qi];
    var card = el("section", "card");
    card.appendChild(el("div", "kicker", "Soru " + (qi + 1) + " / " + pool.length));
    card.appendChild(el("h3", null, q.q));
    if (q.hint) card.appendChild(el("p", "muted", q.hint));
    if (!q.o.length) {  // boşluk doldurma / kısa cevap: cevap açılır, okuyucu kendi karar verir
      var rev = el("button", "act primary", "Cevabı göster");
      rev.onclick = function () { revealAnswer(card, q); };
      card.appendChild(rev);
      v.appendChild(card);
      return;
    }
    var selected = {}, labels = q.o.map(function (o) {
      var b = el("button", "opt", o.t);
      card.appendChild(b);
      return b;
    });
    // Tek doğru: tıklanan şık cevabı verir. Çoktan seçmeli: şıklar işaretlenir, küme "Kontrol et"te karşılaştırılır.
    // Üç sonuç var: doğru, kısmen doğru, yanlış. Kısmen doğru puan kazandırmaz; seçim doğru bilgi
    // içeriyor ama sorunun tam yanıtı değil.
    function settle(verdict, note) {
      answered = true;
      if (verdict === "ok") right += 1;
      if (verdict === "partial") partialRight += 1;
      q.o.forEach(function (o, j) {
        if (verdict === "partial" && selected[j]) labels[j].dataset.state = "partial";
        else labels[j].dataset.state = o.ok ? "ok" : (selected[j] ? "bad" : "");
      });
      var picked = q.o.filter(function (o, j) { return selected[j] && o.why; })[0];
      var why = verdict === "partial" ? picked : q.o.filter(function (x) { return x.ok && x.why; })[0];
      if (why) card.appendChild(el("p", verdict === "partial" ? "why partial" : "why", why.why));
      if (note) card.appendChild(el("p", "muted", note));
      card.appendChild(nextButton());
    }
    if (q.type === "multiple_select") {
      card.appendChild(el("p", "muted", "Doğru olan tüm seçenekleri işaretleyin."));
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = !selected[j];
          b.dataset.state = selected[j] ? "ok" : "";
        };
      });
      var check = el("button", "act primary", "Kontrol et");
      check.style.marginTop = "6px";
      check.onclick = function () {
        if (answered) return;
        var hits = 0, misses = 0;
        q.o.forEach(function (o, j) {
          if (!selected[j]) return;
          if (o.ok) hits += 1; else misses += 1;
        });
        if (q.o.every(function (o, j) { return Boolean(o.ok) === Boolean(selected[j]); })) {
          settle("ok", "Doğru.");
        } else if (hits && !misses) {
          settle("partial", "Kısmen doğru: doğru seçeneklerin bir kısmını işaretlediniz.");
        } else if (hits) {
          settle("partial", "Kısmen doğru: doğru seçeneklerden bazılarını işaretlediniz, ayrıca yanlış seçenek var.");
        } else {
          settle("bad", "Yanlış: doğru seçeneklerden hiçbirini işaretlemediniz.");
        }
      };
      card.appendChild(check);
    } else {
      labels.forEach(function (b, j) {
        b.onclick = function () {
          if (answered) return;
          selected[j] = true;
          if (q.o[j].ok) settle("ok");
          else if (q.o[j].p) settle("partial", "Kısmen doğru: bu seçenek doğru bilgi içeriyor, ama sorunun tam yanıtı değil.");
          else settle("bad");
        };
      });
    }
    v.appendChild(card);
  }

  function nextButton() {
    var next = el("button", "act primary", qi + 1 >= pool.length ? "Sonucu gör" : "Sonraki soru");
    next.style.marginTop = "12px";
    next.onclick = function () { qi += 1; answered = false; paintQuiz(); };
    return next;
  }

  function revealAnswer(card, q) {
    if (answered) return;
    answered = true;
    if (q.a) card.appendChild(el("p", "why", q.why ? q.a + " " + q.why : q.a));
    else if (q.why) card.appendChild(el("p", "why", q.why));
    var row = el("div", "row");
    var know = el("button", "act primary", "Bildim");
    know.onclick = function () { right += 1; qi += 1; answered = false; paintQuiz(); };
    var mid = el("button", "act ghost", "Kısmen bildim");
    mid.onclick = function () { partialRight += 1; qi += 1; answered = false; paintQuiz(); };
    var no = el("button", "act ghost", "Bilemedim");
    no.onclick = function () { qi += 1; answered = false; paintQuiz(); };
    row.appendChild(know); row.appendChild(mid); row.appendChild(no);
    card.appendChild(row);
  }

  // ---- sources -------------------------------------------------------------
  function paintSources() {
    var v = $("#view-kaynaklar");
    v.textContent = "";
    var list = DATA.sources.filter(function (s) { return !query || norm(s.title).indexOf(query) >= 0; });
    if (!list.length) { v.appendChild(el("p", "empty", "Kaynak bulunamadı.")); return; }
    list.forEach(function (s) {
      var card = el("div", "card");
      card.appendChild(el("div", "kicker", s.type || "kaynak"));
      if (s.url) {
        var a = el("a", null, s.title);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        card.appendChild(a);
      } else card.appendChild(el("div", null, s.title));
      v.appendChild(card);
    });
  }

  // ---- shell ---------------------------------------------------------------
  var VIEWS = {panel: paintPanel, kartlar: startCards, konular: paintChapters, test: startQuiz, kaynaklar: paintSources};
  var current = "panel";
  function show(name) {
    current = name;
    Object.keys(VIEWS).forEach(function (k) {
      $("#view-" + k).hidden = k !== name;
      var b = $('#tabs button[data-view="' + k + '"]');
      if (b) b.setAttribute("aria-selected", k === name ? "true" : "false");
    });
    VIEWS[name]();
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.onclick = function () { query = ""; $("#q").value = ""; show(b.dataset.view); };
  });
  var timer = null;
  $("#q").oninput = function (e) {
    clearTimeout(timer);
    var value = e.target.value;
    timer = setTimeout(function () { query = norm(value.trim()); VIEWS[current](); }, 120);
  };
  if (!DATA.counts.cards) document.querySelector('#tabs button[data-view="kartlar"]').hidden = true;
  if (!DATA.counts.quiz) document.querySelector('#tabs button[data-view="test"]').hidden = true;
  show("panel");
})();
</script>
</body>
</html>
