url": "https://www.youtube.com/watch?v=lWQvjMm1XBc"}]}, {"n": 2, "title": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "summary": "Bu bölümde Türk dilinin ilk yazılı belgelerinden günümüze kadar geçirdiği tarihsel dönemler ve geçiş evreleri incelenmektedir. Türklerin tarih boyunca kullandığı Köktürk, Uygur, Arap ve Latin gibi farklı alfabeler ile bu değişimlerin nedenleri aktarılmaktadır. Son olarak Türkiye Türkçesinin oluşumu, sadeleşme hareketleri ve Harf Devriminin etkileri ele alınmaktadır.", "objectives": ["Türk dilinin tarihsel gelişim dönemlerini ve bu dönemlerin temel niteliklerini açıklayabilme.", "Türklerin tarih boyunca kullandığı alfabeleri ve alfabe değişikliklerinin kültürel sebeplerini belirleyebilme.", "Türkiye Türkçesinin oluşum sürecini, Yeni Lisan hareketini ve Harf Devriminin sonuçlarını değerlendirebilme."], "notes": [{"h": "2. Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler"}, {"p": "Bu bölümde Türk dilinin ilk yazılı belgelerinden günümüze kadar geçirdiği tarihsel dönemler ve geçiş evreleri incelenmektedir. Türklerin tarih boyunca kullandığı Köktürk, Uygur, Arap ve Latin gibi farklı alfabeler ile bu değişimlerin nedenleri aktarılmaktadır. Son olarak Türkiye Türkçesinin oluşumu, sadeleşme hareketleri ve Harf Devriminin etkileri ele alınmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Türk dilinin tarihsel gelişim dönemlerini ve bu dönemlerin temel niteliklerini açıklayabilme."}, {"li": "Türklerin tarih boyunca kullandığı alfabeleri ve alfabe değişikliklerinin kültürel sebeplerini belirleyebilme."}, {"li": "Türkiye Türkçesinin oluşum sürecini, Yeni Lisan hareketini ve Harf Devriminin sonuçlarını değerlendirebilme."}, {"h": "Ünite 2: Türk Dilininin Gelişimi ve Tarihsel Dönemleri"}, {"p": "*AÖF ders kitabı, Ünite 2, PDF sayfa ~47-73.*"}, {"li": "Ünite - Türk Dilininin Gelişimi ve Tarihsel Dönemleri"}, {"p": "Konuşma dili olarak yaşı kesin rakamlarla ifade edilemeyen, ancak çok eski devirlere"}, {"p": "gittiği anlaşılan Türkçenin yazı dili tarihini izleyebilmekteyiz. Bugünkü bilgilerimize göre"}, {"p": "Türkçenin ilk yazılı belgesi MS 687-692 yıllarına tarihlenen Çoyr yazıtıdır. Bu yazıttan"}, {"p": "1200 yıl öncesine giden Esik kurganlarından çıkan bir tas üzerinde Köktürk yazısına çok"}, {"p": "benzeyen 26 karakter tespit edilmiştir, ancak bugüne kadar tam olarak çözülememiştir."}, {"p": "Bu yazı tam çözüldüğünde Türk yazı dilinin tarihi MÖ V- IV. yüzyıllardan başlatılacaktır."}, {"p": "Türkçe Sümerce ilişkisi hakkında bilgi veriniz."}, {"p": "Tarihi bilinen ilk belgeyi Çoyr yazıtı olarak kabul edip diğer bazı dillerin ilk belgeleriy­"}, {"p": "le karşılaştırdığımızda şöyle bir durumla karşılaşırız:"}, {"p": "Türk dili ⟦1⟧"}, {"p": ": MS 712, Nihon Şoki."}, {"p": "İngilizce"}, {"p": ": En eski belgesi MS 8. yüzyıla aittir."}, {"p": "Fransızca-Almanca : En eski belgeleri, 843 yılında iki kardeş arasında bir antlaşmadır."}, {"p": "İtalyanca"}, {"p": ": 17. yüzyılda oluşmuştur."}, {"p": "Macarca"}, {"p": ": Tihanyi Vakıfnamesi MS 1057."}, {"p": "Türk yazı dilinin yaşı konusundaki çalışmalarıyla tanınan dil bilimci Doğan Aksan"}, {"p": "(2004), Köktürk Yazıtları’nda bulunan eşanlamlıları, çok anlamlıları ve ileri ögeleri dikka­"}, {"p": "te alarak yazı dilinin yaşının çok eskilere gitmesi gerektiğini belirtir."}, {"p": "Sümerce ile Türkçe ilişkisine dair ayrıntılı bilgi edinmek için Osman Nedim Tuna’nın"}, {"p": "“Sümer ve Türk Dillerinin Tarihî ilgisi ile Türk Dili’nin Yaşı Meselesi” adlı eserini oku­"}, {"p": "yabilirsiniz. (TDK Yayınları, Ankara, 1990) ⟦2⟧"}, {"p": "**TÜRKÇENİN TARİHÎ DÖNEMLERİ**"}, {"p": "Yukarıda belirtildiği üzere Türk dilinin Altay dillerinden ayrılıp bağımsız bir dil olarak"}, {"p": "konuşulmaya başlanması, tarihin bilinmeyen zamanlarına uzanmaktadır. Ayrıca Türkçe­"}, {"p": "nin yine çok erken devirlerde Eski Doğu Türkçesi ve Eski Batı Türkçesi diye adlandırılan iki"}, {"p": "kola ayrıldığı genel kabul gören bir durumdur."}, {"p": "Bir dilin lehçelere, yani ses, biçim ve telaffuz yönlerinden değişiklikler gösteren kollara"}, {"p": "ayrılması, mekân farklılaşması ve zaman geçmesiyle ayrıca farklı dillerle ilişkilere girme­"}, {"p": "siyle ilgilidir. Bir dilin konuşurları, bölünüp farklı coğrafyalarda yaşamaya başladığında"}, {"p": "dillerinde de önceleri çok önem arz etmeyen ancak zamanla çoğalıp fark edilir duruma"}, {"p": "gelen değişiklikler görülür. Zaman geçtikçe artan bu değişiklikler, kolların başka başka"}, {"p": "dillerle ilişki içinde olmasıyla daha da artar. Türklerin hareketli, daha doğru bir ifadeyle"}, {"p": "konar-göçer bir hayat yaşamaları, sürekli yer değiştirmelerine ve parçalanmalarına yol"}, {"p": "açmıştır. Yaşadıkları hayat tarzından kaynaklanan bu bölünmeler, dillerinde de erken za­"}, {"p": "manlarda belirgin farklılıkların oluşmasının nedenidir."}, {"p": "Türkçenin tarihî dönemleri, özellikle yazıyla izlenemeyen karanlık diyebileceğimiz"}, {"p": "dönemlerin adlandırılmasında bilim adamları arasında birtakım farklılıklar görülmek­"}, {"p": "tedir. Ancak yazılı dönemlerin adlandırılması hemen bütün bilim adamlarınca benzer"}, {"p": "biçimde ve benzer ölçütler dikkate alınarak yapılmıştır."}, {"p": "Yazıyla izlenemeyen dönemlerin adlandırılmasında Altay Çağı, En Eski Türkçe Çağı, İlk"}, {"p": "Türkçe Çağı gibi terimler kullanılmıştır."}, {"p": "Kurgan, Türk ve Altay kültüründe"}, {"p": "kutsal mezar anlamındadır. Esik"}, {"p": "kurganı MÖ 5. yüzyıla ait olup"}, {"p": "Kazakistan’dadır. ⟦3⟧"}, {"p": "Dil içi ve dil dışı gelişmelerle yapılagelen adlandırmalar dikkate alınarak Türkçenin"}, {"p": "özellikle yazıyla izlenebilen dönemleri şöyle adlandırılabilir:"}, {"p": "Hun Dönemi"}, {"p": "Büyük bir imparatorluk olan Hun devletinin içerisinde pek çok halk bulunmakta ve pek"}, {"p": "çok dil konuşulmaktaydı ancak devletin kurucuları ve hâkim unsuru Türklerdi. Çin yaz­"}, {"p": "malarında karşılaşılan kişi, yer ve eşya adları Çincenin ses sistemine göre değiştirilerek"}, {"p": "yazıldıkları için Hun dili ile ilgili tam bilgi vermemektedir. Fakat bilim adamları Çin kay­"}, {"p": "naklarında karşılaşılan bu kelimelerin pek çoğunu Türkçe ile açıklamaktadırlar."}, {"p": "Çin kaynaklarında, Çince söyleyişle kaydedilmiş olan iki cümle vardır ki MS 329 ta­"}, {"p": "rihli bu kayıt, Türkçenin şimdilik ilk cümle örneğidir. Çin kaynaklarında tespit edilen ve"}, {"p": "Hunlara ait olan bazı kelimeler şunlardır: Tengri, kut, il, törü, yabgu, ordu, sü, börü, temir,"}, {"p": "kural (silah), kapagçı (bekçi), bitigçi (yazar) vb. (Ercilasun, 2011). Görüldüğü üzere keli­"}, {"p": "meler; inanç, devlet, töre ve askerlikle ilgilidir."}, {"p": "Türk Dilinin Hun Dönemi’ne yönelik ayrıntılı bilgi edinmek için Talat Tekin’in, “Hun­"}, {"p": "ların Dili” adlı eserinden yararlanabilirsiniz. (Doruk Yayınları, Ankara, 1993)"}, {"p": "Eski Türkçe Dönemi"}, {"p": "Türkçenin MS 5.-10. yüzyıllarını Eski Türkçe Dönemi olarak adlandırmak hemen her­"}, {"p": "kesçe kabul edilmektedir. Eski Türkçe Dönemi, kendi içinde Köktürk ve Uygur dönemleri"}, {"p": "olmak üzere ikiye ayrılır."}, {"p": "Köktürkler, Türkçenin bilinen ilk ve hacimli yazılı belgelerini bıraktıkları için kültür… ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 10**: VIII-XVII. yüzyıllar arasında Doğu Türkistan, Harezm, Altın Ordu bölgelerinden İstanbul’a kadar uzanan geniş bir coğrafyada kullanılmıştır."}, {"li": "[2] **2025/2026 · Soru 11**: I. Yazı dilini konuşma diline yaklaştırmak, mümkün olduğu kadar İstanbul halkının konuştuğu gibi yazmak II. Dilimizdeki Arapça ve Farsça gra"}, {"li": "[3] **2025/2026 · Soru 17**: Türkçenin tarihsel gelişiminde Karahanlı Türkçesi en çok hangi özelliğiyle öne çıkar?"}, {"li": "[4] **2025/2026 · Soru 30**: Aşağıdakilerden hangisi Türkçenin yazıyla izlenemeyen dönemleri için kullanılan ifadelerdendir?"}, {"li": "[5] **2025/2026 · Soru 31**: Bugünkü bilgilerimize göre Türkçenin metinlerle izleyebildiğimiz tarihi boyunca kullandıkları ilk düzenli, kuralları yerleşmiş yazı sistemid"}, {"li": "[6] **2025/2026 · Soru 35**: Doğu Türkçesi’nin en önemli temsilcilerinden biri aşağıdakilerden hangisidir?"}, {"li": "[7] **2025/2026 · Soru 36**: 'Kutadgu Bilig' aşağıdaki dönemlerden hangisinde yazılmıştır?"}, {"li": "[8] **2025/2026 · Soru 37**: Latin alfabesi Türkiye’de hangi yılda kabul edilmiştir?"}, {"li": "[9] **2025/2026 · Soru 48**: Aşağıdakilerden hangisi Eski Türkçe Dönemine aittir?"}, {"li": "[10] **2025/2026 · Soru 49**: Aşağıdaki eser yazar eşleştirmelerinden hangisi yanlıştır?"}, {"li": "[11] **2025/2026 · Soru 54**: Türkçenin tarihî dönemleri arasında 'Orta Türkçe' hangi yüzyıllarda başlamıştır?"}, {"li": "[12] **2025/2026 · Soru 55**: Türk dilinin tarihî dönemleri göz önünde bulundurulduğunda “Göktürkçe” ve “Uygurca” hangi dönem içinde yer alır?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=7hP2uhDnBr4"}, {"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=BnE7pVebxNs"}, {"title": "TÜRK DİLİ I - Ünite 2 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=wx2H6EdWWwU"}]}, {"n": 3, "title": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "summary": "Bu bölümde ses bilgisinin temel ilkeleri, konuşma seslerinin oluşumu ve Türkçedeki ünlü ile ünsüz seslerin nitelikleri öğretilmektedir. Türkçe sözcüklerin ses özellikleri, ünlü ve ünsüz uyumları ile altı farklı hece yapısı detaylıca açıklanmaktadır. Zamanla ortaya çıkan ses olayları ile vurgu, durak ve tonlama gibi parçalar üstü ses birimlerinin işlevleri sunulmaktadır.", "objectives": ["Seslerin konuşma organlarında oluşum biçimlerini ve Türkçe seslerin sınıflandırılmasını açıklayabilme.", "Türkçenin ünlü ve ünsüz uyumu kurallarını belirleyerek hece yapılarını çözümleyebilme.", "Türkçedeki temel ses olaylarını ve parçalar üstü ses birimlerinin anlatımdaki rolünü kavrayabilme."], "notes": [{"h": "3. Türk Dilinin Ses Yapısı ve Ses Özellikleri"}, {"p": "Bu bölümde ses bilgisinin temel ilkeleri, konuşma seslerinin oluşumu ve Türkçedeki ünlü ile ünsüz seslerin nitelikleri öğretilmektedir. Türkçe sözcüklerin ses özellikleri, ünlü ve ünsüz uyumları ile altı farklı hece yapısı detaylıca açıklanmaktadır. Zamanla ortaya çıkan ses olayları ile vurgu, durak ve tonlama gibi parçalar üstü ses birimlerinin işlevleri sunulmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Seslerin konuşma organlarında oluşum biçimlerini ve Türkçe seslerin sınıflandırılmasını açıklayabilme."}, {"li": "Türkçenin ünlü ve ünsüz uyumu kurallarını belirleyerek hece yapılarını çözümleyebilme."}, {"li": "Türkçedeki temel ses olaylarını ve parçalar üstü ses birimlerinin anlatımdaki rolünü kavrayabilme."}, {"h": "Ünite 3: Ses Bilgisi"}, {"p": "*AÖF ders kitabı, Ünite 3, PDF sayfa ~77-105.*"}, {"li": "Ünite - Ses Bilgisi"}, {"p": "Ses bilgisi ile ilgili daha ayrıntılı bilgi edinmek isterseniz Doğan Aksan’ın Her Yönüyle Dil"}, {"p": "Ana Çizgileriyle Dilbilim adlı kitabından yararlanabilirsiniz (TDK Yayınları, 2011)."}, {"p": "Harf"}, {"p": "Seslerin yazıdaki karşılığına harf denir. Bir dildeki sesleri karşılayan işaretlerin belirli bir"}, {"p": "sırada meydana getirdiği harfler topluluğuna ise alfabe denir. Sesçil, yani söyleyişle yazılı­"}, {"p": "şın mümkün olduğunca birbirine yakın olması ilkesini esas alan Türk alfabesi 29 harf, iki"}, {"p": "ayırıcı işaretten oluşur. Bağımsız olarak kullanılan ayırıcı işaretler, halk arasında ‘şapka’"}, {"p": "olarak bilinen düzeltme işareti (^) ve kesme işaretidir (’). Ünsüz harfler ön sıradan e ünlüsü"}, {"p": "ile /be/, /ce/, /he/, /ke/ vb. şeklinde okunur. 29 harften yalnızca yumuşak g (ğ) harfi kelime"}, {"p": "başında bulunmaz."}, {"p": "1928 yılında Harf Devrimi ile kabul edilen ve 1929’da resmen uygulanmaya başlayan"}, {"p": "yeni Türk alfabesinde, Latin alfabesinin temel harfleri alınmış, ayrıca bu temel harflerde"}, {"p": "bazı değişiklikler gerçekleştirilerek yeni harfler yapılmıştır. Çok sayıda farklı harften olu­"}, {"p": "şan karmaşık bir alfabeye yol açmamak amacıyla dilin sesleri ayırıcı işaretlerle gösteril­"}, {"p": "miştir."}, {"p": "Türk alfabesi, ses-yazı karşılıklığı ilkesini esas alır. Sesler (ünlüler ve ünsüzler), kısaca,"}, {"p": "iki sözcüğü ayırt eden en küçük birim; yazı (harfler) ise yazım sistemindeki en küçük"}, {"p": "birimdir. Türk alfabesinde yer alan harflerin her biri genel olarak tek ses değerini gösterir."}, {"p": "Türk alfabesinde düzeltme (^) ve kesme (’) işaretlerinin birden fazla görevi vardır. Dü­"}, {"p": "zeltme işareti, âdet örneğinde olduğu gibi, üzerine konulduğu ünlünün uzun okunduğunu"}, {"p": "gösterir. Kâr örneğinde ise üzerine konulduğu, ölçünlü söyleyişte kısalan /a/ ünlüsünün"}, {"p": "uzun söylenmesi gerektiğini değil, bir önceki ünsüzün ön damaksıl (ince, ön sıradan) söy­"}, {"p": "lenmesi gerektiğini ifade eder. Kesme işareti ise bir yandan özel adlara getirilen ekleri"}, {"p": "ayırmaya yarayan noktalama işareti olarak yaygın biçimde kullanılırken bir yandan da"}, {"p": "cüz’i, Kur’an, kıt’a vb. örneklerde, kullanımı zorunlu olmamakla birlikte, Osmanlı alfa­"}, {"p": "besindeki ayın ve hemze harflerini karşılamaktadır. Nadiren de olsa karın, kar’ın, karı’n"}, {"p": "vd. eşsesli kelimeleri birbirlerinden ayırmak üzere de kullanılmaktadır. Son dönemlerde"}, {"p": "söyleyişte düşen ünsüzlerin yerine kesme işaretinin kullanıldığını görüyoruz: bir yerine"}, {"p": "bi’ vb. yazılışlara da rastlanmaktadır. Bu ayırıcı işaretlere iki ayrı işlevin yüklenmesi, geniş"}, {"p": "kitleler tarafından içselleştirilememekte, üstelik uzun yıllardır zaman ve enerji kayıplarına"}, {"p": "yol açan önemli sorunlar yaratmaktadır."}, {"p": "Dil ile ilgili bilimsel çalışmalarda kullanılmak üzere, 1928’de yasayla kabul edilen öl­"}, {"p": "çünlü Türk alfabesinden ayrı, bu alfabedeki harflerin ayırıcı işaretlerle genişletilmiş bir"}, {"p": "gayriresmî çeviri yazı alfabesi vardır. Dil çalışmalarında yaygın kullanım alanı bulunan"}, {"p": "Türk çeviri yazısının temel harfleri şu şekildedir: a, b, c, ç, d, e, ė, f, ġ, g, ğ, h, ḥ, ḫ, i, ı, j, ḳ,"}, {"p": "k, l, m, n, ñ, o, ö, p, r, s, ṣ, s, ş, t, ṭ, u, ü, v, v̇, y, z, ż, ẓ, ẕ. Bu alfabede yer alan ayırıcı işaretli"}, {"p": "Şekil 3.2"}, {"p": "Ses / Harf"}, {"p": "Ses/Harf"}, {"p": "Ünlüler"}, {"p": "İkiz"}, {"p": "Ünlüler"}, {"p": "İkiz"}, {"p": "Ünsüzler"}, {"p": "Üçüz"}, {"p": "Ünsüzler"}, {"p": "Ünsüzler"}, {"p": "Alfabe adı Yunancada, bu"}, {"p": "alfabenin ilk iki harfine verilen… ⟦1⟧"}, {"p": "**TÜRKÇEDEKİ SESLER**"}, {"p": "Konuşma seslerini çok genel olarak ünlüler ve ünsüzler olmak üzere ikiye ayırabiliriz. Ses­"}, {"p": "lerin ünlü ve ünsüz biçimde ayrılması Eski Yunan’a, Platon ve Aristotales’e değin uzanır."}, {"p": "Antik Yunan düşünürleri sesleri işitilebilen/ses veren ve işitilemeyen/ses vermeyen yani"}, {"p": "ünlüler ve ünsüzler olarak ikiye ayırmışlardır (Eker, 2011). Aşağıda Türkçedeki sesler ün­"}, {"p": "lüler ve ünsüzler olarak ayrıntılı bir biçimde ele alınmaktadır."}, {"p": "Ünlüler"}, {"p": "Oluşumları sırasında belirli bir engele takılmadan, zorluğa uğramadan çıkan seslere ünlü"}, {"p": "adı verilir. Türkçede sekiz ünlü vardır: a, e, ı, i, o, ö, u, ü."}, {"p": "Dünya dillerindeki toplam farklı ünlü sayısı 200 civarındadır (Ladefoged, 2001) . Ünlü"}, {"p": "ve ünsüz sayısı ile ilgili olarak çok sayıda dil üzerine yapılan bir çalışmada ünlü sayılarının"}, {"p": "dillere göre 3 ile 46 arasında değiştiği, yani 8,7’lik bir ortalamanın bulunduğu anlaşılmış­"}, {"p": "tır. Bu durumda araştırmaya konu olan dillerin % 62,1’inin 5-9 arasında ünlüye sahip"}, {"p": "olduğu ortaya çıkmaktadır. Türkçenin de bu dağılımda ünlü sayısı bakımından normal sı­"}, {"p": "nırlar içinde bulunduğu anlaşılmaktadır. Dünya dillerinin önemli bir bölümü /a, e, i, o, u/"}, {"p": "seslerinden oluşan 5’li ünlü setine sahiptir (Aranoff, Rees Miller 2003). Ancak, bu seslerin"}, {"p": "tümünün niteliklerinin ve niceliklerinin bire bir aynı olduğu söylenemez."}, {"p": "Konuşma seslerinin iki ana türünden biri kabul edilen, tek başlarına bağımsız sözlüksel ve"}, {"p": "anlamsal birim olabilen, hecenin çekirdeğini teşkil eden ünlülerin üretimleri esnasında ses"}, {"p": "yolunda ünsüzlerin aksine, herhangi bir engelle karşılaşmadığı MRI fotoğraflarında açıkça"}, {"p": "görülmektedir."}, {"p": "Ünlülerin Sınıflandırılması"}, {"p": "Ünlüler oluştukları yere, dilin veya çenenin yüksekliğine, dudakların durumuna göre bi­"}, {"p": "çimlenir. Ünlüler; akciğerden gelen havanın ses tellerini titreştirmesiyle ilk özelliklerini"}, {"p": "kazandıktan sonra herhangi bir engelle karşılaşmadan ağız boşluğuna gelir ve burada"}, {"p": "hiçbir nokta ile temas etmeden dilin, alt ve üst çenenin yüksekliğine; dudakların düz ya… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 5**: Ünsüzler çıkaklarında oluşurken hava akımı kesintili biçimde veya sızarak çıkar. Hava akımının kesintili olduğu ünsüzlere süreksiz ünsüzler,"}, {"li": "[2] **2025/2026 · Soru 6**: Süreklileşme, süreksiz ünsüzlerin, akıcı ya da sızıcı sürekli ünsüzlere dönüşmesidir. Aşağıdakilerden hangisinde bu duruma örnek vardır?"}, {"li": "[3] **2025/2026 · Soru 18**: “Anne” sözcüğünde görülenses olayı aşağıdakilerden hangisine örnektir?"}, {"li": "[4] **2025/2026 · Soru 20**: Aşağıdaki sözcüklerin hangisinde söz başında ünlü düşmesi vardır?"}, {"li": "[5] **2025/2026 · Soru 28**: Sokaktayım, kimsesiz bir sokak ortasında Yürüyorum, ardıma bakmadan yürüyorum Yolumun karanlığa saplanan noktasında Sanki beni bekleyen bir"}, {"li": "[6] **2025/2026 · Soru 34**: “Dil hem araç, hem malzeme, hem de bu aracı kullanan sistemdir.” Bu ifade dilin hangi özelliğini vurgular?"}, {"li": "[7] **2025/2026 · Soru 38**: Aşağıdakilerden hangisinde ünsüz benzeşmesi yoktur?"}, {"li": "[8] **2025/2026 · Soru 52**: Aşağıdakilerden hangisi ölçünlü dilin özelliğidir?"}, {"li": "[9] **2025/2026 · Soru 57**: Aşağıdakilerden hangisi ünlülerin sınıflandırılmasında kullanılan ölçütlerden biri değildir?"}, {"li": "[10] **2025/2026 · Soru 58**: Türkçede 'd, n, s, t, z' ünsüzleri hangi özelliğe sahiptir?"}, {"li": "[11] **2025/2026 · Soru 59**: \"Bekliyorum\" sözcüğünde hangi ses olayı görülmektedir?"}, {"li": "[12] **2025/2026 · Soru 60**: “i, e” ünlüleri aşağıdaki gruplardan hangisine girer?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=TsVy__4JyZw"}, {"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=wSiBKUm1RiU"}, {"title": "TÜRK DİLİ I - Ünite 3 Konu Anlatımı 3 (Türkçe altyazı metni)", "url": ""}]}, {"n": 4, "title": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "summary": "Bu bölümde Türk dilinin biçim bilgisi yapısı, en küçük anlamlı birim olan kökler ve eklerin işlevleri incelenmektedir. Yeni sözcük türetmeye yarayan yapım ekleri ile sözcükler arası ilişki kuran çekim ekleri ve fiilimsiler örneklendirilmektedir. Ayrıca sözcüklerin anlam sınıfları ve görevlerine göre isim, sıfat, zamir gibi türleri ayrıntılı olarak sunulmaktadır.", "objectives": ["Biçim bilgisinin temel kavramlarını, kök ve gövde yapısını çözümleyebilme.", "Yapım ekleri ile ad ve eylem çekim eklerinin işlevlerini ayırt edebilme.", "Sözcüklerin anlam ve görevlerine göre türlerini sınıflandırarak türetme yollarını açıklayabilme."], "notes": [{"h": "4. Biçim Bilgisi, Ekler ve Sözcük Türleri"}, {"p": "Bu bölümde Türk dilinin biçim bilgisi yapısı, en küçük anlamlı birim olan kökler ve eklerin işlevleri incelenmektedir. Yeni sözcük türetmeye yarayan yapım ekleri ile sözcükler arası ilişki kuran çekim ekleri ve fiilimsiler örneklendirilmektedir. Ayrıca sözcüklerin anlam sınıfları ve görevlerine göre isim, sıfat, zamir gibi türleri ayrıntılı olarak sunulmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Biçim bilgisinin temel kavramlarını, kök ve gövde yapısını çözümleyebilme."}, {"li": "Yapım ekleri ile ad ve eylem çekim eklerinin işlevlerini ayırt edebilme."}, {"li": "Sözcüklerin anlam ve görevlerine göre türlerini sınıflandırarak türetme yollarını açıklayabilme."}, {"h": "Ünite 4: Biçim Bilgisi"}, {"p": "*AÖF ders kitabı, Ünite 4, PDF sayfa ~109-133.*"}, {"li": "Ünite - Biçim Bilgisi"}, {"p": "olduğu gibi Batı dillerinden çok sayıda ön ek ve son ek almıştır. Buna Türkçede ön ek gibi"}, {"p": "kullanılan Arapça kökenli ma-aile, Farsça kökenli bi-taraf, na-dide vb. ön çekim edatlarını"}, {"p": "da dâhil edebiliriz."}, {"p": "Dil olgusu üzerine popüler ve ayrıntılı bilgiler için Süer Eker’in Çağdaş Türk Dili adlı"}, {"p": "kitabını inceleyebilirsiniz. (Ankara: Grafiker Yayınları, 2011)"}, {"p": "Türkçenin ek sözlüğü, eklerin formülleri ve işlevleri için http://www.dnathan.com/language/"}, {"p": "turkish/tsd/ ağ adresindeki ‘The Suffix Dictionary’ adlı sayfasını inceleyebilirsiniz."}, {"p": "Kök, gövde, taban ve ek kavramlarını açıklayınız. ⟦1⟧"}, {"p": "**TÜRKÇENİN EKLERİ**"}, {"p": "Türetim ve çekim kavramları biçim bilgisinin önemli inceleme konularıdır ve dilin işle­"}, {"p": "yişinde temel ögelerdendir. Sözcükleri çok genel olarak adlar ve eylemler, ekleri de yapım"}, {"p": "(türetim) ve çekim ekleri olarak sınıflandırarak eklemeli bir dil olan Türkçenin yapı ve"}, {"p": "işleyiş sistemini ana çizgileri ile değerlendirmeye başlayabiliriz."}, {"p": "Yapım Ekleri"}, {"p": "Yapım/türetim ekleri yeni sözcükler yapma görevi bulunan eklerdir. Yeni sözcükler ya­"}, {"p": "pılırken sözcük türü değişebilir. Örneğin oyun adından eylem yapan -a- biçim birimi ile"}, {"p": "üretilen yeni sözcük artık bir eylemdir. Aynı şekilde aç- eyleminden -(ı)k biçim birimi ile"}, {"p": "üretilen yeni sözcük açık bir addır. Son olarak -n biçim birimi gündüz, güz, kış vb. adla­"}, {"p": "ra gelerek zaman belirteci yapar. Yapım ekleri dil bilgisel bilgi ve sözlüksel bilgi taşırlar."}, {"p": "Yukarıdaki örnekleri dil bilgisel bilgi ve sözlüksel bilgi bakımından şöyle bir çizelge ile"}, {"p": "gösterebiliriz:"}, {"p": "Yapım eki/Sözcük ⟦2⟧"}, {"p": "zaman adı"}, {"p": "Ekleri yeni sözcükler türetebilme yeteneği bakımından türetim yapabilen ekler ve tü­"}, {"p": "retim yapamayan ekler olarak ikiye ayırabiliriz. Türetim yapabilen ekler sıklıkları az da"}, {"p": "olsa yeni sözcükler yapabilen eklerdir. Türetim yapamayan ekler ise dil bilgisel işlevi bu­"}, {"p": "lunmayan eklerdir. Çoğunlukla tek bir birleşimde yer alır, ağızlarda, eskimiş veya yanlış"}, {"p": "çözümlenmiş örneklerde görülür. Örneğin Türkçe altmış ve yetmiş sözcüklerindeki -mIş"}, {"p": "yeni türetim yapamaz, yani başka sözcüklerde kullanılamaz. Odun sözcüğünün od ‘ateş’"}, {"p": "bağımsız biçim biriminden türediğini seziyoruz ancak, sondaki n bağımlı biçim birimini"}, {"p": "tanımıyoruz. Benzer biçimde eldiven, karanlık, gündüz sözcüklerinde de bu türden ekler"}, {"p": "bulunmaktadır. Eldiven, karanlık, gündüz sözcüklerinde el, kara, gün bileşenlerinin bu­"}, {"p": "lunduğunu görüyoruz ancak -diven (\u003c Far.) ve -düz ekleri ile karanlık örneğindeki n öge­"}, {"p": "sini tanımlayamıyoruz. Bu bağımlı biçim birimler âdeta fosilleşmiş durumdadır. Üretim"}, {"p": "yapmayan biçim birimler ancak art zamanlı olarak araştırılabilir."}, {"p": "Türetme isteğe bağlı olarak yapılır ve Türkçe gibi yapım eklerinin çok olduğu dillerde yeni"}, {"p": "oluşan sözcükte tür değişikliği ya da aynı türün devamı olan sözcükler oluşturur. Bir söz­"}, {"p": "cükte birden fazla yapım eki bulunabilir."}, {"p": "Türetim: Bir ekle yeni sözcük"}, {"p": "yapımı iken çekim, daha çok"}, {"p": "bir sözcüğün farklı biçimlerini"}, {"p": "ifade eder."}, {"p": "Tarihî dönemlerdeki kimi biçim"}, {"p": "birimlerin dil bilgisel işlevlerini"}, {"p": "yitirerek bugüne ulaşmasına"}, {"p": "fosilleşme, bu tür biçim birimlere"}, {"p": "fosil biçim birim adı verilir."}, {"p": "Tarihî süreçlerdeki değişikliklere"}, {"p": "odaklanan yönteme art zamanlı;"}, {"p": "Yalnızca belirli bir döneme"}, {"p": "odaklanan yönteme ise eş zamanlı"}, {"p": "denir. ⟦3⟧"}, {"p": "Yeni sözcüklerin yapımında çok kullanılan veya çok sayıda sözcükte bulunan eklere"}, {"p": "işlek ekler denir. Eklerin bir bölümü çok az sayıda sözcükte bulunur. Yalnız bir sözcükte"}, {"p": "bulunan eklere tek örnek adı verilir. Örneğin -mAk (gelmek, koşmak vb.) bütün eylemlere"}, {"p": "gelebilir ancak katmer ‘bir şeyi oluşturan katlardan her biri’ sözcüğünde yer alan -mer"}, {"p": "eki, ölçünlü dilde başka bir sözcükte görülmez. Sözcüklerin bir bölümü Dil Devrimi’nden"}, {"p": "sonra türetilmiştir. Aşağıda, Türkiye Türkçesinde kullanılan yapım ekleri Addan Ad Yap­"}, {"p": "ma Ekleri, Addan Eylem Yapma Ekleri, Eylemden Ad Yapma Ekleri, Eylemden Eylem Yap­… ⟦4⟧"}, {"p": "**KİŞİ EKLERİ**"}, {"li": "TİP"}, {"li": "TİP"}, {"p": "Tekil"}, {"p": "-(y)Im"}, {"p": "-sIn"}, {"p": "-sIn"}, {"p": "Çoğul"}, {"p": "-lIm"}, {"p": "-sInIz"}, {"p": "-lAr"}, {"p": "-(ı)n, (I)nIz"}, {"p": "-sInlAr"}, {"p": "Eklendiği Kipler"}, {"p": "İstek kipi"}, {"p": "Emir kipi"}, {"p": "Eylemsiler: Geleneksel bir terim olarak söz ya da cümle içinde eylemleri adlaştırdık­"}, {"p": "larından dolayı ad, adı niteledikleri için sıfat, iki cümleyi bağladığı için bağlaç işlevinde"}, {"p": "bulunabilen ve yan cümle kurabilen sözcük ya da sözcük öbeklerine eylemsi adı verilir."}, {"p": "Korkmaz (2007) ‘çekimsiz fiil’ adını verdiği eylemsileri ‘Fiil kök ve gövdelerinden belirli"}, {"p": "eklerle türetilen; ancak, şahıs ekleri alarak çekime girmediği için yargı bildirmeyen bitmemiş"}, {"p": "fiil’ olarak tanımlar."}, {"p": "Eylemsiler Türkçenin anlatımının temelini teşkil eden çok önemli ögelerdir. Türkçede"}, {"p": "anlam ve görevlerine göre, zarf fiiller (ulaçlar), sıfat fiiller (ortaçlar) ve isim fiiller (eylem"}, {"p": "adı, mastar) olmak üzere üç çeşit eylemsi vardır."}, {"p": "Tablo 4.4"}, {"p": "Kişi Ekleri"}, {"p": "Eylemsiler: eylemleri geçici sıfat,"}, {"p": "zarf ve ad yapan; hem ad hem"}, {"p": "de eylem özellikleri taşıyan, zarf"}, {"p": "fiiller hariç, yapım ya da çekim"}, {"p": "eki işlevlerinde kullanılabilen"}, {"p": "sözcüklerdir. ⟦5⟧"}, {"li": "Ünite - Biçim Bilgisi"}, {"p": "Sıfat fiil: Sıfat fiiller, eylemlerden geçici sıfat yapmak üzere türetilen ve genellikle"}, {"p": "kişiye bağlı olmaksızın çekimlenen eylemsilerdir. Sıfat fiiller, eylem ve sıfatların"}, {"p": "özelliklerini birlikte gösterir. Zaman kavramının ön planda olduğu sıfat fiiller, Tab­… ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 2**: \"Artık havalar, balkonda oturulmayacak kadar serinledi.\" cümlesinde altı çizili sözcüğün türü aşağıdakilerden hangisidir?"}, {"li": "[2] **2025/2026 · Soru 9**: Aşağıdaki cümlelerden hangisinde sıfat (önad) vardır?"}, {"li": "[3] **2025/2026 · Soru 13**: Aşağıdaki kuramlardan hangisi dilin doğuşunu insanın duygularını dile getirmesine bağlar?"}, {"li": "[4] **2025/2026 · Soru 21**: Aşağıdaki cümlelerde yer alan altı çizili sözcüklerden hangisi birden fazla yapım eki almıştır?"}, {"li": "[5] **2025/2026 · Soru 22**: Aşağıdakilerden hangisinde eylemden ad yapma eki alan sözcükler birlikte ve doğru verilmiştir?"}, {"li": "[6] **2025/2026 · Soru 23**: \"Fincancı katırlarını ürkütmek\" deyiminde aşağıdakilerden hangisi yoktur?"}, {"li": "[7] **2025/2026 · Soru 27**: Yalınlayan dillerde çekim yoktur. Sözcüğün biçimi değişmez veya sözcüğe herhangi bir gramatikal birim eklenmez. Dil bilgisel işlevler sözcük"}, {"li": "[8] **2025/2026 · Soru 29**: Aşağıdaki sözcüklerin hangisinde \"ünsüz tekleşmesi\" ne örnek bir sözcük vardır?"}, {"li": "[9] **2025/2026 · Soru 44**: Aşağıdakilerden hangisinde \"artık\" sözcüğü sıfat görevinde kullanılmıştır?"}, {"li": "[10] **2025/2026 · Soru 47**: Türkçe kökenli sözlerde ünsüz uyumu vardır: Ötümsüz ünsüzlerle biten sözcüklere, ötümlü ünsüzlerle başlayan ek geldiğinde, ekin ünsüzü, ötüm"}, {"li": "[11] **2025/2026 · Soru 51**: “İnsan bir bakıma dünyayı ana dilinin izin verdiği ölçüde algılar” görüşü hangi varsayımın ürünüdür?"}, {"li": "[12] **2024/2025 · Soru 6**: \"Fincancı katırlarını ürkütmek\" deyiminde aşağıdakilerden hangisi yoktur?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 1 (Türkçe altyazı metni)", "url": ""}, {"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 2 (Türkçe altyazı metni)", "url": ""}, {"title": "TÜRK DİLİ I - Ünite 4 Konu Anlatımı 3 (Türkçe altyazı metni)", "url": ""}]}, {"n": 5, "title": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "summary": "Bu bölümde söz diziminin temel ögeleri olan sözcük öbekleri ve tamlamaların yapısı ele alınmaktadır. Cümlenin temel ögeleri olan yüklem ve özne ile tümleçlerin cümle içindeki görevleri açıklanmaktadır. Cümleler yapısına, yükleminin türüne, öge dizilişine ve anlamına göre farklı kriterler açısından sınıflandırılmaktadır.", "objectives": ["İsim ve sıfat tamlamaları gibi sözcük öbeklerinin yapısal özelliklerini belirleyebilme.", "Cümlenin temel, tamamlayıcı ve bağımsız ögelerini doğru bir şekilde ayırabilme.", "Cümleleri yapısına, yükleminin türüne, öge dizilişine ve anlamına göre sınıflandırabilme."], "notes": [{"h": "5. Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri"}, {"p": "Bu bölümde söz diziminin temel ögeleri olan sözcük öbekleri ve tamlamaların yapısı ele alınmaktadır. Cümlenin temel ögeleri olan yüklem ve özne ile tümleçlerin cümle içindeki görevleri açıklanmaktadır. Cümleler yapısına, yükleminin türüne, öge dizilişine ve anlamına göre farklı kriterler açısından sınıflandırılmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "İsim ve sıfat tamlamaları gibi sözcük öbeklerinin yapısal özelliklerini belirleyebilme."}, {"li": "Cümlenin temel, tamamlayıcı ve bağımsız ögelerini doğru bir şekilde ayırabilme."}, {"li": "Cümleleri yapısına, yükleminin türüne, öge dizilişine ve anlamına göre sınıflandırabilme."}, {"h": "Ünite 5: Cümle Bilgisi"}, {"p": "*AÖF ders kitabı, Ünite 5, PDF sayfa ~137-167.*"}, {"li": "Ünite - Cümle Bilgisi"}, {"p": "Sözcük öbekleri ile ilgili ek bilgi edinmek için Hürriyet Gökdayı’nın Türki-"}, {"p": "ye Türkçesinde Öbekler adlı çalışmasını Genel Ağ’daki turkishstudies.net/"}, {"p": "Makaleler/637152171_61gökdayı_hürriyet.pdf adresinden okuyabilirsiniz."}, {"p": "Tamlayan-Tamlanan İlişkisi Bulunan Sözcük Öbekleri"}, {"p": "Tamlayan tamlanan sözcük öbeklerinde önce gelen öge, kendinden sonra gelen ögeyi"}, {"p": "farklı yönlerden belirtir ya da niteler. Bu tür sözcük öbeğinde tamlayan ve tamlanan öge"}, {"p": "birer sözcükten oluşabileceği gibi genişlemiş sözcük öbeklerinden de oluşabilir. Aşağıdaki"}, {"p": "tabloda bu grup içinde yer alan sözcük öbekleri yapısı ve örnekleriyle birlikte gösteril-"}, {"p": "mektedir. ⟦1⟧"}, {"p": "Tamlayan-Tamlanan İlişkisi Bulunan Sözcük Öbekleri"}, {"p": "Sözcük Öbeği"}, {"p": "Yapı"}, {"p": "Örnek"}, {"p": "Belirtili ad tamlaması"}, {"p": "ad-(n)In + ad-(s)I"}, {"p": "Arabanın kapısı"}, {"p": "Belirtisiz ad tamlaması"}, {"p": "ad + ad-(s)I"}, {"p": "araba kapısı"}, {"p": "Takısız ad tamlaması"}, {"p": "ad + ad"}, {"p": "demir kapı"}, {"p": "Sıfat tamlaması"}, {"p": "sıfat + ad"}, {"p": "büyük okul, bir adam birkaç ev,"}, {"p": "anlamsız söz"}, {"p": "Aitlik öbeği"}, {"p": "ad +ki eki; + ad + -dA + -ki, nIn+ki"}, {"p": "sabahki, evdeki, bizimki"}, {"p": "Ünlem öbeği"}, {"p": "ünlem + ad/ ad grubu"}, {"p": "Ey Türk gençliği, Değerli konuklar"}, {"p": "Ad Tamlamaları"}, {"p": "İyelik ekli bir adın (tamlayan), iyeliğin belirttiği başka bir adla (tamlanan) aitlik, içinde"}, {"p": "bulunma, sınırlandırma, belirtme vb. anlam ilgileriyle bağlandığı sözcük öbeğidir (Kara-"}, {"p": "han,2006). Ad tamlamaları cümlede ad, sıfat ve zarf görevlerinde, cümlenin her ögesi ola-"}, {"p": "rak bulunabilirler. Belirtili, belirtisiz ve takısız ad tamlaması olmak üzere üç türü vardır."}, {"li": "Belirtili ad tamlaması: İlk sözcüğün ilgi eki –(n)In + ikinci sözcüğün iyelik eki –sI"}, {"p": "almasıyla oluşan ad tamlamasıdır."}, {"p": "Örnek: İşinin değişmesi şansını da değiştirmişti. ⟦2⟧"}, {"p": "Esra, odanın pencerelerini sıkıca kapattı."}, {"p": "Selma’nın sesi çok güzeldir."}, {"p": "Belirtili ad tamlamasında tamlayan öge ile tamlanan öge kimi zaman, genellikle şiir-"}, {"p": "lerde yer değiştirebilir. Örneğin; Kimse bilmez dertlerini anaların. Tamlayan öge ile"}, {"p": "tamlanan öge arasına başka sözcükler girebilir. Örneğin; Ayşe masal anlatırken çocuk-"}, {"p": "ların yorgunluktan gözleri kapanırdı."}, {"p": "Pek çok kaynakta “zincirleme ad tamlaması” olarak verilen yapı, belirtili ad tamlama-"}, {"p": "sının tamlayan ögesinin de ad tamlaması biçimindeki iç içe girmiş tamlama türüdür."}, {"p": "Örneğin; kardeşimin resim defteri, evin duvarının boyası, Türkçe öğretmeninin not"}, {"p": "defteri vb."}, {"p": "Tablo 5.1"}, {"p": "Tamlayan-Tamlanan İlişkisi Bulunan Sözcük Öbekleri"}, {"p": "Alanda “ad tamlaması” terimi"}, {"p": "yerine “ad takımı” ya da “isim"}, {"p": "tamlaması” terimleri de kullanılır."}, {"p": "Belirtili ad tamlamalarında,"}, {"p": "tamlayan eki (n)In yerine -dAn"}, {"p": "durum eki de kullanılabilir."}, {"p": "Örneğin; kardeşlerimden ikisi gibi. ⟦3⟧"}, {"p": "Bazı belirtili ad tamlamaları kalıplaşmaya uğrar. Elinin körü, kaçın kurası, sözün kı-"}, {"p": "sası vb."}, {"li": "Belirtisiz ad tamlaması: İlk sözcüğün ek almayıp ikinci sözcüğün iyelik eki –sI"}, {"p": "almasıyla oluşan ad tamlamasıdır."}, {"p": "Örnek: Vişne reçelini çok severdi."}, {"p": "Odanın içini gül kokusu kaplamıştı."}, {"p": "Dedem tam bir insan sarrafıydı."}, {"p": "Belirtisiz ad tamlamalarında tamlayan ve tamlanan arasında süreklilik/belirtisizlik"}, {"p": "vardır. Sürekliliğin gereği olarak tamlayan ve tamlanan arasında başka bir sözcük gir-"}, {"p": "mez. Örneğin; limon ağacı, badem şekeri, Porsuk nehri vb.… ⟦4⟧"}, {"p": "**CÜMLENİN ÖGELERİ**"}, {"p": "Sözcük gruplarından daha geniş, bağımsız dil bilgisel bir yapı olan cümle (Eker, 2006),"}, {"p": "sözcüklerin rastgele yan yana gelmesiyle değil, belli kurallara göre birleşmesinden olu-"}, {"p": "şan bir bütündür. Örneğin; “büyük ev” biçimindeki sıfat tamlaması, sözcüklerin yerlerinin"}, {"p": "değiştirilmesiyle “ev büyük” şeklinde ad cümlesi olur. Dolayısıyla sözcükler, ancak cümle"}, {"p": "içinde anlam ve değer kazanır."}, {"p": "Cümle, değişik işlevlerdeki parçalardan oluşan bir bütündür. Bu bütünün parçaları"}, {"p": "da işlevlerine göre özne, yüklem, nesne, yer tamlayıcısı, zarf tamlayıcısı olarak adlandı-"}, {"p": "“-a/-e, -Ip, -ArAk, -ArAktAn, -Inca,"}, {"p": "-Alı, -AlIndan, -mAdAn, -ken,"}, {"p": "-dIkçA, -mAksIzIn, -dIğIndAn,"}, {"p": "-AndA” ekleri ile oluşturulan zarf-"}, {"p": "fiil öbeği cümle yapısına yakınsa"}, {"p": "da yargı bildirme özelliğine sahip"}, {"p": "değildir. ⟦5⟧"}, {"p": "rılan cümle ögeleridir. Türkçenin cümle ögelerinin sıralanışı, özne- tümleç (nesne, yer"}, {"p": "tamlayıcısı, zarf tamlayıcısı)-yüklem sırasına göredir. Cümlede, cümle dışı ögeler olarak"}, {"p": "adlandırılan başka sözcükler de yer alabilir. Bunlar cümlenin ögesi sayılmazlar. Cümlenin"}, {"p": "ögeleri; Cümlenin Temel Ögeleri ve Cümlenin Tamamlayıcı Ögeleri başlıkları altında daha"}, {"p": "ayrıntılı olarak ele alınmaktadır."}, {"p": "Cümlenin Temel Ögeleri"}, {"p": "Yeryüzündeki bütün dillerde cümlenin temel ögeleri yüklem ve öznedir (Eker, 2006)."}, {"p": "Cümle içindeki sözcükler yüklemle ilişkileri, cümle içinde ona uzak ya da yakın oluşları"}, {"p": "açısından değişik değer ve görev kazanırlar (Atabay, Özel, Çam, 1981). Cümlenin temel"}, {"p": "ögelerini daha ayrıntılı ele alalım."}, {"p": "Yüklem"}, {"p": "Cümlenin yargı taşıyan en temel öğesi durumundaki yüklemi Gencan (1979) cümle-"}, {"p": "de iş, oluş, kılış, düşünce, duygu, imge, yargı anlatan sözcük olarak tanımlamaktadır."}, {"p": "Yüklem, cümlede yargı bildiren çekimli öğedir. (Atabay, Özel, Çam, 1981). Cümledeki"}, {"p": "diğer ögeler, yüklemin anlamını çeşitli yönlerden tamamlamak ve onu daha belirgin"}, {"p": "duruma getirmek üzere cümlede yer alır. Tanımlardan da anlaşılacağı gibi yüklem,"}, {"p": "cümlede bitmişliği ifade eder. Yüklemin temel özelliklerini şöyle sıralayabiliriz (Ata-… ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 1**: Aşağıdakilerin hangisi ‘örnekseme’ yoluyla üretilmiş bir sözcük değildir?"}, {"li": "[2] **2025/2026 · Soru 4**: Dil konuşma ve dinleme işlevlerini gerçekleştirmek üzere birbirleriyle bağlantılı ses, biçim, söz dizimi, anlam vb. alt sistemlerin oluşturd"}, {"li": "[3] **2025/2026 · Soru 7**: Aşağıdaki cümlelerde altı çizili sözcüklerden hangisi mecaz anlamda kullanılmıştır?"}, {"li": "[4] **2025/2026 · Soru 8**: Aktarma: Sözcüğün dile getirdiği kavramla, bir başka kavram arasında çoğu kez benzetme yoluyla bir ilişki kurarak sözcüğün anlamını o kavram"}, {"li": "[5] **2025/2026 · Soru 14**: Dil Ailesi’ne dahil değildir?"}, {"li": "[6] **2025/2026 · Soru 19**: Türkçenin ses özellikleri düşünüldüğünde aşağıdaki sözcüklerden hangisi Türkçedir?"}, {"li": "[7] **2025/2026 · Soru 24**: Aşağıdaki cümlelerin hangisinde yüklem \"dönüşlü\" bir eylemdir?"}, {"li": "[8] **2025/2026 · Soru 25**: Aşağıdakilerin hangisi ‘birleştirme’ yoluyla üretilmiş bir sözcük değildir?"}, {"li": "[9] **2025/2026 · Soru 39**: Aşağıdakilerden hangisi parçalar üstü ses birimi değildir?"}, {"li": "[10] **2025/2026 · Soru 41**: Aşağıdakilerin hangisinde, “geri” sözcüğü “Bakkalın biraz ilerisindeydi bizim evimiz. ” cümlesindeki “ileri” sözcüğünün anlamca karşıtıdır?"}, {"li": "[11] **2025/2026 · Soru 42**: Zamirler, bir adın veya ad öbeğinin yerini tutabilen ad soylu sözcüklerdir. Aşağıdaki cümlelerin hangisinde zamir kullanılmamıştır?"}, {"li": "[12] **2025/2026 · Soru 43**: Aşağıdakilerden hangisinde \"güzel\" sözcüğü zarf görevinde kullanılmıştır?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=e4kNWY9q2Vs"}, {"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=bnVhBKuSIR4"}, {"title": "TÜRK DİLİ I - Ünite 5 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=ofRaKDHOglo"}]}, {"n": 6, "title": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "summary": "Bu bölümde Türk dilinin zengin söz varlığını oluşturan deyimler, atasözleri ve ikilemelerin kültürel değeri anlatılmaktadır. Ağız, argo, ilişki sözleri ile alkış ve kargış gibi farklı ifade biçimlerinin toplumsal işlevleri incelenmektedir. Ayrıca Türkçenin yapım ekleri ve kök birleştirmelerle sağladığı güçlü sözcük türetme kapasitesi vurgulanmaktadır.", "objectives": ["Deyimler ve atasözlerinin kalıplaşmış yapısını ve anlatım gücünü açıklayabilme.", "Ağız, argo, ilişki sözleri ve ikilemelerin iletişimdeki işlevlerini değerlendirebilme.", "Türkçenin sözcük türetme yollarını ve söz varlığının zenginliğini çözümleyebilme."], "notes": [{"h": "6. Türkçenin Söz Varlığı, Deyimler ve Atasözleri"}, {"p": "Bu bölümde Türk dilinin zengin söz varlığını oluşturan deyimler, atasözleri ve ikilemelerin kültürel değeri anlatılmaktadır. Ağız, argo, ilişki sözleri ile alkış ve kargış gibi farklı ifade biçimlerinin toplumsal işlevleri incelenmektedir. Ayrıca Türkçenin yapım ekleri ve kök birleştirmelerle sağladığı güçlü sözcük türetme kapasitesi vurgulanmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Deyimler ve atasözlerinin kalıplaşmış yapısını ve anlatım gücünü açıklayabilme."}, {"li": "Ağız, argo, ilişki sözleri ve ikilemelerin iletişimdeki işlevlerini değerlendirebilme."}, {"li": "Türkçenin sözcük türetme yollarını ve söz varlığının zenginliğini çözümleyebilme."}, {"h": "Ünite 6: Türkçenin Söz Varlığı"}, {"p": "*AÖF ders kitabı, Ünite 6, PDF sayfa ~173-199.*"}, {"p": "**TÜRKÇE SÖZ VARLIĞI**"}, {"p": "Deyimler"}, {"p": "Deyimler anlatıma açıklık kazandıran ve renk katan söz varlığı ögeleridir. Her dilin söz"}, {"p": "varlığında deyimler vardır. Kimi deyimler belirli dillere özgü olsa da bunların benzerleri"}, {"p": "başka dillerde de görülebilir. Konuyla ilgili çalışma yapanların tanımlarından hareketle"}, {"p": "şöyle bir deyim tanımı yapılabilir: İki veya daha fazla sözcükten oluşan, anlatım gücünü"}, {"p": "artırmak için az çok mantık dışına kayan, gerçek anlamından uzak, ilgi çekici bir anlam"}, {"p": "yüküne sahip, bazı sözcükleri değişmeyip bazıları değişebilen, toplum tarafından ortak­"}, {"p": "laşa benimsenen kalıplaşmış söz gruplarına deyim denir. Deyimler, anlam ögesi olarak"}, {"p": "incelendiğinde, içerisindeki sözcükler ayrı ayrı değil hepsi bir bütün olarak değerlendiril­"}, {"p": "melidir. Bu yönüyle deyimler, tıpkı sözcükler gibi bir dilin sözlüğünün içerisinde madde"}, {"p": "başı olarak yer almalıdırlar. Yani bir başka anlatımla deyimler, sözcükler gibi, sözlük mad­"}, {"p": "desi olan anlam birimleridir."}, {"p": "Deyim kavramını karşılamak üzere Osmanlı Türkçesinde darbımesel, tabir, ıstılah, temsil"}, {"p": "vb. terimler kullanılmış; ancak darbımesel zamanla yalnız atasözü kavramı için kullanılır"}, {"p": "olmuştur. Cumhuriyet döneminde ise tabir ile deyim sözcükleri kullanılmış, zaman geçtikçe"}, {"p": "deyim sözcüğü yerleşmiş ve bu kavram için tek sözcük durumuna gelmiştir."}, {"p": "Deyimlerle Atasözleri Arasındaki Farklar"}, {"p": "Deyimler ve atasözleri zaman zaman birbirine karıştırılmaktadır. Bu iki kalıplaşmış yapı"}, {"p": "arasında biçime ve anlama bağlı birtakım farklar vardır. Bunlar:"}, {"li": "Deyimler yargı bildirmezler. Deyimler; bir durumu, olayı ya da varlığı tasvir et­"}, {"p": "mek, açıklamak, ifade etmek amacıyla etkili anlatımından yararlanılan kalıplaşmış"}, {"p": "söz gruplarıdır. Atasözü ise, bir gözlem ve tecrübenin sonucunda ortaya çıkmış ve"}, {"p": "zamanla herkesçe benimsenmiş bir yargıyı dile getirir. Yaşanmış birtakım olaylar­"}, {"p": "dan, sonraki kuşakların ders almasını sağlamaya çalışır, bir öğüt verir. Bazı deyim­"}, {"p": "lerde yargı bulunsa da genelde deyimler yargısız ifadelerdir. Kısaca deyimler daha"}, {"p": "çok benzetme, kıyaslama yoluyla bir durumu açıklamak; atasözleri ise bir durum"}, {"p": "veya olayı tecrübeye dayalı bir yargıya bağlamak amacıyla kullanılırlar."}, {"li": "Atasözleri de deyimler gibi kalıplaşmış ifadelerdir. Ancak kalıplaşmanın biçimin­"}, {"p": "de bazı farklılıklar vardır. Atasözlerindeki kalıplaşma deyimlere göre daha sıkıdır."}, {"p": "Deyimlerde yer alan sözcükler başta, ortada ve sonda birtakım değişiklikler göste­"}, {"p": "rebilirler."}, {"li": "Deyimler amaç bakımından da atasözlerinden farklıdır. Deyimlerin amacı bir du­"}, {"p": "rumu ya da kavramı özel bir kalıp içinde çekici ve etkili bir anlatımla belirtmek"}, {"p": "iken atasözleri öğüt verme, yol gösterme ya da tecrübe aktarma amacı güderler. Bu"}, {"p": "yönüyle bazı kalıp sözler her iki gruba da dâhil edilebilirler (Sinan, 2001)."}, {"p": "Deyimler ve Birleşik Sözler Arasındaki Farklar"}, {"p": "Deyimlerle birleşik sözler yapı bakımından birbirine benzedikleri için zaman zaman karış­"}, {"p": "tırılabilmektedirler. Bu karışma daha çok iki sözcükten oluşan deyimlerle birleşik sözlerde"}, {"p": "olmaktadır. Deyimler ve birleşik sözler biçim özellikleri bakımından farklıdırlar:"}, {"li": "Deyimi oluşturan iki sözcük kesinlikle bitişik yazılmazken, birleşik sözlerin bir"}, {"p": "kısmı bitişik yazılır.… ⟦1⟧"}, {"p": "**Atasözlerinin Dil ve Üslup Özellikleri**"}, {"p": "Sözlü kültür ortamlarının ürünü olarak ortaya çıkan atasözleri, yoğun bir bilgiyi hatırda"}, {"p": "tutmak ve aktarmakla görevlidirler. Bu yüzden atasözlerinde kısalık, düşünceyi en az söz­"}, {"p": "cük ile ve keskin bir anlatımla vermek için belirgin bir kuraldır. Atasözlerinde gereksiz"}, {"p": "görülecek bir sözcüğe rastlanmaz. Az sözcükle çok şey anlatma, atasözlerinin en belirgin"}, {"p": "yapı ve anlam özelliğidir denebilir. Bu özellikten dolayı atasözleri genellikle bir ya da iki"}, {"p": "cümledir."}, {"p": "Atasözleri ağızdan ağza nakledilmekten dolayı kalıplaşırlar ve hiçbir sözcüğü değişti­"}, {"p": "rilemez ve atılamaz duruma gelirler. Eş anlamlısı bile olsa atasözünün bir sözcüğü değişti­"}, {"p": "ğinde üslubunun değiştiği ve etkisinin azaldığı görülür: “Pişirdiği aş olaydı, başımı yaran"}, {"p": "taş olaydı” atasözünde aş sözcüğü eş anlamlısı olan yemek ile değiştirilirse sözün büyüsü"}, {"p": "kaybolacaktır. ⟦2⟧"}, {"li": "Ünite - Türkçenin Söz Varlığı"}, {"p": "Atasözlerinde de deyimlerde olduğu gibi hece, ses ve sözcük tekrarlarından, şiir ögelerinden"}, {"p": "yararlanılarak etkili bir üslup oluşturulmaktadır."}, {"p": "Atasözlerinin genel özellikleri nelerdir?"}, {"p": "İkilemeler"}, {"p": "İkileme, anlatım gücünü artırmak, anlamı pekiştirmek, kavramı zenginleştirmek amacıy­"}, {"p": "la aynı sözcüğün tekrar edilmesi veya anlamları birbirine yakın veya karşıt olan ya da ses­"}, {"p": "leri birbirini andıran iki sözcüğün yan yana kullanılmasıdır (Hatiboğlu, 1981). Türkçenin"}, {"p": "bir zenginliği ve Türk beyninin yaşatma gücünün ürünleri olan ikilemeler, Türk düşünce­"}, {"p": "sindeki anlam zenginliğini ve kavram inceliklerini ortaya koymak üzere türlü şekillerde"}, {"p": "birbiriyle ilgili sözcüklerin yan yana getirilmesi ve bu yan yana getirilen sözcüklerde yeni"}, {"p": "bir anlatım inceliği sergilenmesiyle oluşturulur.İkileme, aslında anlamı etkili kılmak ama­"}, {"p": "cıyla oluşturulan psikolojiyle ilgili ve dilin müzik yönüne katkı sağlayan bir yapıdır."}, {"p": "Atasözleri ve deyimlerin içlerinde yer alan ikilemeler, bu dil varlıklarının belleklere"}, {"p": "kolay yerleşmelerini ve ezberlenmelerini sağlar. Deyimlerimizin büyük bir çoğunluğunda"}, {"p": "ikilemelere rastlanır ki bu durum, deyimlerin uzun anlatımlardan daha etkili olmalarını… ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 32**: Argo ile ilgili aşağıdaki ifadelerden hangisi doğrudur?"}, {"li": "[2] **2025/2026 · Soru 40**: “p-b”, “t-d” ve “k-g” karşıtlıkları Türkçede hangi sesbilimsel ölçüte göre sınıflandırılır?"}, {"li": "[3] **2021/2022 · Soru 18**: “Evrakları ararken masanın gözüne bakmamış.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[4] **2021/2022 · Soru 38**: “Aradığın çorap komodinin gözünden çıktı.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[5] **2021/2022 · Soru 58**: “Aradığın kitapları dolabın gözüne bıraktım.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[6] **2021/2022 · Soru 78**: “Arabanın anahtarını çekmecenin gözüne koydum.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[7] **2021/2022 · Soru 18**: “Evrakları ararken masanın gözüne bakmamış.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[8] **2021/2022 · Soru 38**: “Aradığın çorap komodinin gözünden çıktı.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[9] **2021/2022 · Soru 58**: “Aradığın kitapları dolabın gözüne bıraktım.” Cümlesinde hangi sözcük yan anlamlıdır?"}, {"li": "[10] **2021/2022 · Soru 78**: “Arabanın anahtarını çekmecenin gözüne koydum.” Cümlesinde hangi sözcük yan anlamlıdır?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=r2h3TZbYfSE"}, {"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=imOAfhy7dsM"}, {"title": "TÜRK DİLİ I - Ünite 6 Konu Anlatımı 3", "url": "https://www.youtube.com/watch?v=wZ_xK3vsGUQ"}]}, {"n": 7, "title": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "summary": "Bu bölümde dillerin birbirleriyle girdikleri tarihsel ve kültürel etkileşim süreçleri incelenmektedir. Türkçenin geniş coğrafyalarda farklı medeniyetlerle temas kurarak sözcük alışverişinde bulunması açıklanmaktadır. Türk dilinin dünya üzerindeki yaygınlığı ve köklü yapısıyla diğer dillere etkisi ele alınmaktadır.", "objectives": ["Kültürel ve toplumsal temasların diller arası etkileşimdeki rolünü açıklayabilme.", "Türkçenin diğer dillere verdiği ve diğer dillerden aldığı sözcükleri değerlendirebilme.", "Türk dilinin tarihsel süreçte yayıldığı coğrafi alanları ve konuşucu kitlesini belirleyebilme."], "notes": [{"h": "7. Diller Arası Etkileşim ve Türkçenin Yaygınlığı"}, {"p": "Bu bölümde dillerin birbirleriyle girdikleri tarihsel ve kültürel etkileşim süreçleri incelenmektedir. Türkçenin geniş coğrafyalarda farklı medeniyetlerle temas kurarak sözcük alışverişinde bulunması açıklanmaktadır. Türk dilinin dünya üzerindeki yaygınlığı ve köklü yapısıyla diğer dillere etkisi ele alınmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Kültürel ve toplumsal temasların diller arası etkileşimdeki rolünü açıklayabilme."}, {"li": "Türkçenin diğer dillere verdiği ve diğer dillerden aldığı sözcükleri değerlendirebilme."}, {"li": "Türk dilinin tarihsel süreçte yayıldığı coğrafi alanları ve konuşucu kitlesini belirleyebilme."}, {"h": "Ünite 7: Diller Arası Etkileşim ve Türkçe"}, {"p": "*AÖF ders kitabı, Ünite 7, PDF sayfa ~203-219.*"}, {"li": "Ünite - Diller Arası Etkileşim ve Türkçe"}, {"p": "Türkçenin Gücü ve İç Zenginliği"}, {"p": "Yukarıda ele alınanlar, Türk dilinin genel özelliklerinden bazılarıdır. Türkçenin güçlü"}, {"p": "yanları ve iç zenginliği olarak değerlendirebileceğimiz alanları da bulunmaktadır. Bunlar"}, {"p": "Türk dilinin tarihsel derinliği, coğrafi yaygınlığı, söz varlığının genişliği, ilişki ve nezaket"}, {"p": "sözlerinin yoğunluğu, akrabalık adlarının çeşitliliği, atasözlerinin çokluğu ve anlatım gü­"}, {"p": "cüdür."}, {"p": "Tarihsel Derinlik"}, {"p": "Türk yazı dili, İkinci Göktürk Kağanlığı Dönemi’nde VIII. yüzyılın ilk yarısında dikilen"}, {"p": "Orhon Yazıtları ile başlar. Ancak bu yazıtlarda kullanılan dil son derece gelişmiştir, işlek­"}, {"p": "tir. Henüz yazı dili niteliğini kazanmış, yeni yazı dili olmuş bir dil gibi değildir. Kurallı"}, {"p": "bir dil bilgisinin varlığı dikkati çeker. Sözcüklerin gerçek anlamlarının yanı sıra mecaz"}, {"p": "anlamları da gelişmiştir. Orhon Yazıtları’nda deyimler, atasözü niteliğini kazanmış söz"}, {"p": "kalıpları vardır. Bir dilde deyim ve atasözlerinin oluşabilmesi için yüzlerce yılın geçmesi"}, {"p": "gerekmektedir. Üslup son derece akıcı ve sürükleyicidir. Türk edebiyatında hitabet türü­"}, {"p": "nün ilk örneği olmasına karşın son derece etkileyici bir anlatım söz konusudur. Bütün bu"}, {"p": "özellikler, Türk dilinin tarihinin çok daha öncelere, tarihin karanlık dönemlerine kadar"}, {"p": "uzandığını gösteren kanıtlardır."}, {"p": "Aradan geçen binlerce yıla karşın varlığını sürdüren diller, tarihleri boyunca pek çok"}, {"p": "dille etkileşim içerisine girmiş, değişim yaşamıştır. Türkçe de tarihi boyunca pek çok dili"}, {"p": "etkilemiş, pek çok dilden etkilenmiştir. Başka dillerin egemenliği altına girdiği; edebiyat,"}, {"p": "bilim ve devlet dili olamadığı dönemleri de yaşamıştır. Bütün bu olumsuzluklar, âdeta"}, {"p": "Türkçenin direnç gücünü artırmıştır. Kültür ilişkileri sonucunda Türkçenin söz varlığı"}, {"p": "değişerek gelişmiş, zenginleşmiştir. Destanlar çağına kadar uzanan dille, Türk destanları"}, {"p": "meydana gelmiştir. Binlerce yıllık deneyim, atasözlerini Türkçeye kazandırmıştır. Ancak"}, {"p": "Çince ve Arapça gibi çağımızın çok az dili bu özelliklere sahiptir."}, {"p": "Coğrafi Yaygınlık"}, {"p": "Tarihsel derinliğinin yanı sıra geçmişte yaşanmış olan göçler ve fetihler sonucunda büyük"}, {"p": "bir alana yayılan Türkçe, bugün geniş bir coğrafyada konuşulma niteliğini de kazanmış­"}, {"p": "tır. Geçen yüzyılın ikinci yarısında çalışmak amacıyla Avrupa’nın çeşitli ülkelerine giden"}, {"p": "vatandaşlarımız, Türkçenin yaygınlık alanını daha da genişletmiştir. Bugün Avrupa’nın"}, {"p": "batısından Asya’nın doğusuna kadar uzanan yaklaşık on iki milyon kilometrekarelik bir"}, {"p": "alanda Türk dili konuşulmaktadır. İngilizce, Arapça, İspanyolca gibi çok az sayıda dil, bu"}, {"p": "kadar geniş bir coğrafyada konuşulma ayrıcalığına sahiptir."}, {"p": "Türk dilinin tarihte ve bugün yayılma alanları konusuyla ilgili ayrıntılı bilgi için Prof."}, {"p": "Dr. Leyla Karahan’ın Türk Dili Üzerine İncelemeler adlı kitabını okuyabilirsiniz. (Ak­"}, {"p": "çağ Yayınları, Ankara, 2011.)"}, {"p": "Söz Varlığı ve Anlatım Gücü"}, {"p": "Bir dildeki sözcüklerin bütünü, söz varlığını (söz dağarcığı, kelime hazinesi) oluşturur"}, {"p": "(TDK, 2011: 2157). Aynı coğrafyadaki farklı kültürlerle etkileşim sonucunda Türkçenin"}, {"p": "tarihsel derinliğinden gelen söz varlığı renklenmiş, çeşitlenmiş ve zenginlik kazanmıştır.… ⟦1⟧"}, {"p": "**DÜNYA DİLLERİNİN TÜRK DİLİNE ETKİSİ**"}, {"p": "Toplumlar ve kültürler arasındaki ilişkiler, dillerin birbirini etkilemesinde daima belir­"}, {"p": "leyici olmuştur. Yeryüzünde dillerin oluşumundan bu yana diller arasında bir etkileşim"}, {"p": "söz konusudur. Bir arada yaşayan veya uzak yakın komşuluk ilişkisi içerisinde bulunan"}, {"p": "toplumların en eski dönemlerden bu yana aralarında kurdukları ilişkiler sonucunda birbi­"}, {"p": "rini etkiledikleri bilinmektedir. İnsanoğlunun var oluşundan başlayıp avcılık-toplayıcılık,"}, {"p": "tarımcılık aşamalarında kurdukları ilişkilerle dilleri de etkilenmeye başlamıştır. Ticari iliş­"}, {"p": "kiler, savaşlar, barışlar, buluşlar, felaketler kısacası yeryüzünde yaşanan her olay, dillerin"}, {"p": "birbirini etkilemesinde pay sahibi olmuştur. Bir inanca girme, bir uygarlık dairesine katıl­"}, {"p": "ma da dillerin etkilenmesinde bir başka etkendir."}, {"p": "Dillerin etkileşimi genellikle sözcük alışverişi ile sınırlı kalabildiği gibi kimi zaman dil"}, {"p": "bilgisi ögelerinin bulaşmasına, söz diziminin etkilenmesine de yol açabilmiştir. Diller ara­"}, {"p": "sı etkileşimde verici dilleri konuşan toplumların uygarlıkta, bilimde, kültürde üretken ve"}, {"p": "baskın olmaları dikkat çeker. Dillerin etkisi aslında kültürlerin, uygarlıkların etkisi olarak"}, {"p": "kendisini gösterir. Bilimde, teknolojide, uygarlıkta üretken olan toplumlar verici dil olarak"}, {"p": "başka dillerin söz varlığına sözcükler aktarır. Bir kültür dairesine giren toplumlar da o"}, {"p": "kültürle ilgili sözcükleri, deyimleri alırlar."}, {"p": "Yeryüzünde yaşanan felaketler sonucunda Türkçenin söz varlığına girmiş yabancı kökenli"}, {"p": "bir sözcük anımsıyor musunuz? Araştırınız."}, {"p": "Dünden Bugüne Yabancı Dillerin Etkisi"}, {"p": "Tarihin karanlık dönemlerine kadar kökleri uzanan, geniş bir coğrafyaya yayılan Türkçe"}, {"p": "pek çok dilden etkilenmiş, pek çok dili etkilemiştir. İlişkide bulunulan çeşitli ulusların"}, {"p": "dillerinden sözcük alışverişi ile başlayan bu etkileşim; dönemden döneme değişen dillerle"}, {"p": "sürmüş, azalan veya artan yoğunlukta kendisini göstermiştir."}, {"p": "Eski Türkçe Döneminde Yabancı Dillerin Etkisi"}, {"p": "Orhon Yazıtları’nda Çince (totok ‘askerî vali’), Sanskritçe (çıntan ‘sandal ağacı’), Soğdca… ⟦2⟧ ⟦3⟧ ⟦4⟧ ⟦5⟧ ⟦6⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2025/2026 · Soru 33**: Dillerin sınıflandırılmasında “Türkçe, Ural-Altay dilleri içinde yer alır.” ifadesi hangi ölçütle ilgilidir?"}, {"li": "[2] **2025/2026 · Soru 46**: Söz dizimi bakımından Türkçeyle benzerlik gösteren diller aşağıdakilerin hangisinde birlikte ve doğru verilmiştir?"}, {"li": "[3] **2024/2025 · Soru 8**: Söz dizimi bakımından Türkçeyle benzerlik gösteren diller aşağıdakilerin hangisinde birlikte ve doğru verilmiştir?"}, {"li": "[4] **2024/2025 · Soru 48**: Aşağıdakilerin hangisinde bitişken (eklemeli) diller birlikte ve doğru verilmiştir?"}, {"li": "[5] **2023/2024 · Soru 2**: Aşağıdakilerin hangisinde bitişken (eklemeli) diller birlikte ve doğru verilmiştir?"}, {"li": "[6] **2023/2024 · Soru 6**: Aşağıdakilerden hangisi izole dillerden biridir?"}, {"li": "[7] **2023/2024 · Soru 7**: Söz dizimi bakımından Türkçeyle benzerlik gösteren diller aşağıdakilerin hangisinde birlikte ve doğru verilmiştir?"}, {"li": "[8] **2023/2024 · Soru 11**: Aşağıdakilerden hangisinde yapay diller birlikte ve doğru verilmiştir?"}, {"li": "[9] **2023/2024 · Soru 14**: Aşağıdakilerden hangisi izole dillerden biridir?"}, {"li": "[10] **2022/2023 · Soru 5**: Aşağıdakilerden hangisi izole dillerden biridir?"}, {"li": "[11] **2022/2023 · Soru 6**: Aşağıdakilerden hangisi kutsal dillerden biridir?"}, {"li": "[12] **2022/2023 · Soru 7**: Aşağıdakilerden hangisi Birleşmiş Milletler örgütünün resmî dillerinden biridir?"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 7 Konu Anlatımı 1 (Türkçe altyazı metni)", "url": ""}]}, {"n": 8, "title": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "summary": "Bu bölümde Türkçenin günümüzde karşılaştığı yozlaşma ve yabancılaşma sorunları ele alınmaktadır. Kitle iletişim araçları, sosyal medya ve iş hayatında yabancı sözcüklerin bilinçsiz kullanımının olumsuz etkileri tartışılmaktadır. Türkçenin öğretim ve bilim dili olarak korunması ve toplumda ana dili bilincinin geliştirilmesi için yapılması gerekenler açıklanmaktadır.", "objectives": ["Sosyal medyada ve kitle iletişim araçlarında görülen dil kullanım hatalarını tespit edebilme.", "Yabancı sözcük kullanımının Türkçenin yapısına ve kültürüne olan zararlarını değerlendirebilme.", "Türkçenin bir bilim dili olarak gelişmesi ve korunması için gereken bilinci kavrayabilme."], "notes": [{"h": "8. Güncel Dil Sorunları ve Türkçenin Kullanımı"}, {"p": "Bu bölümde Türkçenin günümüzde karşılaştığı yozlaşma ve yabancılaşma sorunları ele alınmaktadır. Kitle iletişim araçları, sosyal medya ve iş hayatında yabancı sözcüklerin bilinçsiz kullanımının olumsuz etkileri tartışılmaktadır. Türkçenin öğretim ve bilim dili olarak korunması ve toplumda ana dili bilincinin geliştirilmesi için yapılması gerekenler açıklanmaktadır."}, {"h": "Öğrenme hedefleri"}, {"li": "Sosyal medyada ve kitle iletişim araçlarında görülen dil kullanım hatalarını tespit edebilme."}, {"li": "Yabancı sözcük kullanımının Türkçenin yapısına ve kültürüne olan zararlarını değerlendirebilme."}, {"li": "Türkçenin bir bilim dili olarak gelişmesi ve korunması için gereken bilinci kavrayabilme."}, {"h": "Ünite 8: Türkçenin Güncel Sorunları"}, {"p": "*AÖF ders kitabı, Ünite 8, PDF sayfa ~223-239.*"}, {"li": "Ünite - Türkçenin Güncel Sorunları"}, {"p": "te, sunulan “yüksek güvenlik” ile toplumdan kopuk, komşuluk ilişkilerinden uzak yeni"}, {"p": "bir yaşam tarzı oluşturulmaktadır. Ticari hayatta ise Türkçe ihmal edilen dil durumuna"}, {"p": "düşürülmektedir. Yurt dışından getirilen pek çok ürünün, aygıtın kullanım kılavuzunda"}, {"p": "hemen her dil yer alırken Türkçe kullanım kılavuzu bulunmaması veya küçük bir çıkart­"}, {"p": "ma üzerinde minicik harflerle özet bilgi verilmesi, ticari hayatta Türkçenin durumunu"}, {"p": "ortaya koymaktadır. Yasal hükümler gereği Türkçe kullanım kılavuzu verilmesi bir ge­"}, {"p": "reklilik iken aykırı davranılması aynı zamanda tüketici haklarının da ihlal edilmesidir."}, {"p": "Türk mutfağının besleyici, sağlıklı yemekleri dururken bütün dünyada aşırı şişmanlığa"}, {"p": "yol açtığı bilinen ve kimi ülkelerde yasaklanan ayaküstü (fastfood) yiyecekler, yabancı adlı"}, {"p": "menülerle sunulmakta, beslenme alışkanlıklarımız değişmektedir. Kısacası, dilde yaşanan"}, {"p": "bu etkilenme, buzulun suyun üzerinde kalan kısmı gibidir. Asıl büyük etkilenme hayatın"}, {"p": "diğer alanlarında kendisini göstermektedir. Ancak biz konumuz gereği dilde yaşanan etki­"}, {"p": "lenmeyi, Türkçenin karşı karşıya bulunduğu sorunları yaşandıkları alanlar açısından ayrı"}, {"p": "ayrı ele alacağız ve çözüm yoları üzerinde duracağız."}, {"p": "Türkçenin karşı karşıya bulunduğu sorunları çeşitli açılardan ele alan yararlı bir kaynak"}, {"p": "olarak Mustafa Argunşah’ın Sözüm Türkçe Üstüne adlı kitabını okuyabilirsiniz. (Kesit Yay.,"}, {"p": "İstanbul, 2008) ⟦1⟧"}, {"p": "**TÜRKÇENİN KULLANIMINDA YAŞANAN SORUNLAR**"}, {"p": "Gündelik dilde, öğretim hayatında, kitle iletişim araçlarında ve sosyal medyada Türkçe­"}, {"p": "nin kullanımında yaşanan sorunların başında Türkçeye karşı kayıtsızlık ve duyarsızlık,"}, {"p": "toplumda Türkçe bilincinin gereğince yaygınlaşmamış olması gelmektedir. Geçmişte de"}, {"p": "Türkçeye karşı kayıtsızlığın, duyarsızlığın yaşandığı bir dönemde Karamanoğlu Mehmet"}, {"p": "Bey, “Şimden gerü divanda, dergâhta, bargâhta, çarşıda ve bazarda Türkçeden başka dil"}, {"p": "konuşulmaya” diyerek ferman çıkarmış; Âşık Paşa, ünlü eseri Garibname’de Türkçe bilin­"}, {"p": "cinin oluşmamasından"}, {"p": "Türk diline kimsene bakmaz idi"}, {"p": "Türklere hergiz gönül akmaz idi."}, {"p": "dizelerini dile getirerek yakınmış; Mesihî de döneminde ilginin Arap ve Acem diyarların­"}, {"p": "dan gelenlere, dolayısıyla Arapça ve Farsça yazanlara yöneldiğini"}, {"p": "Mesihî gökden insen sana yer yok"}, {"p": "Yüri var gel Arabdan ya Acemden"}, {"p": "sözleriyle vurgulamıştı."}, {"p": "Kültür etkilenmesini ve bunun sonucunda yabancı dillerden etkilenme olumsuzluğu­"}, {"p": "nu geçmişte de yaşamış olan Türkçe, Arap ve Fars kültürü ile etkileşim sonucunda Arapça"}, {"p": "ve Farsçanın etkisinde kalmıştı. Bununla birlikte Türkçe geçen dönemler içerisinde yaşa­"}, {"p": "dığı gelişmelerle bugünkü ulaştığı noktaya gelmiştir."}, {"p": "Türkçenin karşılaştığı farklı sorunlara ilişkin ayrıntılı bilgi edinmek için farklı yazar­"}, {"p": "larla hazırlanmış Türkçenin Çağdaş Sorunları adlı kitaptan yararlanabilirsiniz. (Editör­"}, {"p": "ler: Gürer Gülsevin ve Erdoğan Boz (2. Baskı). Gazi Kitabevi, Ankara, 2006 )"}, {"p": "Kitle İletişim Araçlarında Türkçenin Kullanımı"}, {"p": "“Sokaktaki insan” diye nitelenen kitlenin gündelik dilde kullandığı söz varlığının her ülke­"}, {"p": "de sınırlı olduğu bilinmektedir. Ancak kitle iletişim araçlarının söz varlığının daha geniş"}, {"p": "olması beklenir. Türk Dil Kurumunun RTÜK için 1999 yılında yaptığı bir araştırmaya ⟦2⟧"}, {"p": "göre haber programlarında bin sözcüğün kullanıldığı, ilk yüz sözcüğün ise bu söz varlığı­"}, {"p": "nın neredeyse yüzde ellisini oluşturduğu ortaya konulmuştur. Bu veri, haber programları­"}, {"p": "nın birkaç yüz sözcükle hazırlandığını göstermektedir."}, {"p": "21 Mayıs 2002 tarihli Resmî Gazete’de yayımlanarak yürürlüğe girmiş, Radyo Televizyon Üst"}, {"p": "Kurulu (RTÜK) yasasında değişiklik öngören 3984 sayılı Kanun’un değiştirilmiş 4. Madde­"}, {"p": "sinin h) fıkrası; “Türkçenin; özellikleri ve kuralları bozulmadan konuşma dili olarak kulla­"}, {"p": "nılması; millî birlik ve bütünlüğün temel unsurlarından biri olarak çağdaş kültür, eğitim, ve"}, {"p": "bilim dili hâlinde gelişmesinin sağlanması” şeklindedir."}, {"p": "Radyo ve televizyon yayımlarının yaygınlaşması, dinleme ve izleme oranlarının yük­"}, {"p": "selmesi Türkçe açısından olumlu ve yararlı bir gelişme olması gerekirken yeni sorunlar"}, {"p": "ortaya çıkarmıştır. Söyleyiş bozuklukları, cümle düşüklükleri, yanlış sözcük kullanma,"}, {"p": "Türkçenin söz varlığında bulunmayan yabancı sözcüklere yer verme, kaba dil ve argo gibi"}, {"p": "olumsuzluklar radyo ve televizyon yayınlarında sınırsızca yapılınca bu yanlışlar toplu­"}, {"p": "mun, özellikle de genç kuşakların diline yerleşmiştir. Yayımcılığın kısır bir söz varlığıyla"}, {"p": "yapılması ise bir başka sorundur."}, {"p": "Televizyon dizilerinde bir dönem moda hâlinde yayılmış kaba dil ve argo kullanımına ilişkin"}, {"p": "örnekleri bulunuz. Bugün bu örnekler aynı yaygınlıkta kullanılıyor mu? Tartışınız.… ⟦3⟧ ⟦4⟧ ⟦5⟧"}, {"h": "İlgili çıkmış vize soruları"}, {"p": "Metindeki ⟦n⟧ işaretleri bu listeye açılır. Alıntıya tıklayınca çözüm rehberinde soru açılır ve çözümü vurgulanır."}, {"li": "[1] **2023/2024 · Soru 8**: I. Bir dilin standart özellikleri ölçünlü dil olarak adlandırılır. II. Ölçünlü dil terimi hem yazı hem de konuşma dilini kapsar. III. Ölçünl"}, {"li": "[2] **2022/2023 · Soru 12**: I. Bir dilin standart özellikleri ölçünlü dil olarak adlandırılır. II. Ölçünlü dil terimi hem yazı hem de konuşma dilini kapsar. III. Ölçünl"}, {"li": "[3] **2022/2023 · Soru 14**: I. Bir ülkenin tamamında veya bir bölgesinde yönetim dili olarak kullanılır. II. Tüm resmî işlemlerde kullanılan yasal statüsü bulunan bir v"}, {"li": "[4] **2022/2023 · Soru 4**: I. Bir dilin standart özellikleri ölçünlü dil olarak adlandırılır. II. Ölçünlü dil terimi hem yazı hem de konuşma dilini kapsar. III. Ölçünl"}, {"li": "[5] **2022/2023 · Soru 11**: I. Bir ülkenin tamamında veya bir bölgesinde yönetim dili olarak kullanılır. II. Tüm resmî işlemlerde kullanılan yasal statüsü bulunan bir v"}], "sources": [{"title": "TÜRK DİLİ I - Ünite 8 Konu Anlatımı 1", "url": "https://www.youtube.com/watch?v=5DzlVOV7M0Y"}, {"title": "TÜRK DİLİ I - Ünite 8 Konu Anlatımı 2", "url": "https://www.youtube.com/watch?v=xzHUFIWxljE"}]}], "cards": [{"front": "Safir-Whorf Varsayımı", "back": "Bu varsayıma göre kişinin konuştuğu dil ile dünyayı algılama ve düşünme biçimi arasında sistemli bir ilişki bulunmaktadır . İnsan, dünyayı ana dilinin belirlediği ve izin verdiği ölçüde algılar .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:1"}, {"front": "Dil (Muharrem Ergin'in Tanımı)", "back": "Muharrem Ergin'e göre dil, insanlar arasında anlaşmayı sağlayan doğal bir vasıta ve canlı bir varlıktır . Ayrıca temeli bilinmeyen zamanlarda atılmış gizli bir antlaşmalar sistemi ve seslerden örülmüş toplumsal bir müessesedir .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:2"}, {"front": "Ölçünlü Dil", "back": "Bir ülkede farklı ağızlar ve konuşma biçimleri üstünde ortak anlaşma aracı olarak kullanılan çatı dildir . Türkiye'deki ölçünlü dil, tarihsel gelişmeler sonucunda İstanbul Türkçesine dayanmaktadır .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:3"}, {"front": "Devlet Dili ve Resmî Dil Ayrımı", "back": "Devlet dili kamu alanında ve devlet yönetiminde yasal ve zorunlu olarak kullanılan resmî dildir . Resmî dil ise ülkenin tamamında veya belirli bir bölgesinde yönetim dili olan ve yasal statüsü bulunan dildir .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:4"}, {"front": "Altay Dilleri", "back": "Türk, Moğol ve Mançu-Tunguz dillerinden oluşan ve akrabalıkları kesinleşmemiş bir dil grubu varsayımıdır . Korece ve Japonca ise bu grubun muhtemel üyeleri arasında değerlendirilmektedir .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:5"}, {"front": "Yapı Bakımından Dünya Dilleri", "back": "Dünya dilleri biçim bilgisel özelliklerine göre eklemeli (bitişken), bükünlü (çekimli) ve yalınlayan diller olmak üzere üçe ayrılır . Türkçe bu sınıflamada sondan eklemeli bir dil yapısına sahiptir .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:6"}, {"front": "Söz Dizimi Bakımından Türkçe", "back": "Dünya dilleri cümle ögelerinin sıralanışına göre altı gruba ayrılır . Türkçe, cümle ögeleri Özne-Nesne-Yüklem (ÖNY) sırasını izleyen diller arasında yer almaktadır .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:7"}, {"front": "Siyasal Dil Politikaları Türleri", "back": "Ülkelerin yerel diller ve kamu kullanımı için uyguladığı dil politikaları tek dillilik, eşit çok dillilik ve ulusal/bölgesel dil sistemleri olarak üçe ayrılır . Tek dilliliğe Türkiye, eşit çok dilliliğe Belçika, ulusal/bölgesel sistemlere Hindistan örnektir .", "ch": 1, "chTitle": "Dil, Kültür ve Dünya Dilleri", "id": "turk-dili-1:8"}, {"front": "Eski Türkçe Dönemi", "back": "Türkçenin MS 5. ile 10. yüzyılları arasındaki dönemidir ve kendi içinde Köktürk ile Uygur evreleri olmak üzere ikiye ayrılır. Bu dönemde Köktürkler Türkçenin ilk hacimli yazılı metinlerini bırakmış, Uygurlar ise yerleşik yaşama geçerek kağıt üzerine yazılı zengin bir edebiyat oluşturmuştur.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:9"}, {"front": "Köktürk Alfabesi", "back": "Türkçenin düzenli olarak yazıya geçirilmesini sağlayan ve taş üzerine kazımaya elverişli ilk milli alfabelerimizdendir. Genel olarak 4 ayrı ünlü işareti barındırır ve bu işaretler ince ile kalın olmak üzere iki farklı ses değerini karşılar.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:10"}, {"front": "Orhun Yazıtları", "back": "Orkun ırmağı kıyısında granit üzerine yazılmış olan ve 1893 yılında Danimarkalı bilgin V. Thomsen tarafından okunan ilk hacimli Türkçe yazılı belgelerdir. Yazıtlar sırasıyla Tonyukuk, Köl Tigin ve Bilge Kağan adına dikilmiştir.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:11"}, {"front": "Yeni Lisan Hareketi", "back": "1911 yılında Genç Kalemler dergisinde Ömer Seyfettin ve Ali Canip Yöntem tarafından başlatılan, Ziya Gökalp'in katılımıyla güçlenen dil hareketidir. İstanbul halkının konuşma dilini yazı diline esas alarak yabancı gramer kurallarını dilden atmayı ve milli bir dil oluşturmayı hedeflemiştir.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:12"}, {"front": "Şemsettin Sami", "back": "Eserine 'Osmanî' yerine 'Türkî' adını vererek Kamus-ı Türkî adlı çığır açıcı sözlüğü hazırlayan Osmanlı aydınıdır. Bu eser, dönemin en kapsamlı Türkçe sözlüklerinden biri kabul edilmektedir.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:13"}, {"front": "1 Kasım 1928", "back": "Türkiye Büyük Millet Meclisinde çıkarılan kanunla Latin harflerine dayanan yeni Türk alfabesinin resmen kabul edildiği Harf Devrimi tarihidir. Kanunla birlikte 1929 yılı başından itibaren tüm resmi yazışma ve basımların yeni alfabeyle yapılması zorunlu kılınmıştır.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:14"}, {"front": "Türk Dil Kurumu", "back": "Atatürk'ün talimatıyla 12 Temmuz 1932 tarihinde Türk Dili Tetkik Cemiyeti adıyla kurulan milli kurumdur. Türk dilini modern medeniyetin ihtiyaçlarını karşılayacak bir mükemmeliyete erdirmek ve öztürkçe söz varlığını geliştirmek amacıyla Derleme ve Tarama sözlüklerini hazırlamıştır.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:15"}, {"front": "Eski Oğuz Türkçesi", "back": "Batı Türkçesinin 13. yüzyıldan 15. yüzyıl sonlarına kadar Anadolu'da gelişen ilk tarihsel dönemidir. Bu dönem eserlerinde konuşma diline yakın son derece yalın bir Türkçe kullanılmıştır.", "ch": 2, "chTitle": "Türk Dilinin Tarihsel Gelişimi ve Kullanılan Alfabeler", "id": "turk-dili-1:16"}, {"front": "Biçim Birim", "back": "Biçim birim, daha küçük birimlere ayrılamayan, ses ve yapı yönünden anlamlı en küçük ögedir. Geleneksel dil bilgisindeki hem sözcük hem de ek kavramlarını kapsar.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:17"}, {"front": "Bağımsız ve Bağımlı Biçim Birimler", "back": "Tek başlarına kullanılabilen kök durumundaki yapılar bağımsız biçim birimdir. Tek başlarına kullanılamayan ve görevlerini yerine getirmek için bağımsız biçim birimlere ihtiyaç duyan ekler ise bağımlı biçim birimdir.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:18"}, {"front": "Taban", "back": "Eklerin yani bağımlı biçim birimlerin eklendiği yalın sözcüklerdir. Tabanlar kök sözcük olabileceği gibi türemiş sözcük de olabilir.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:19"}, {"front": "İşlek Ek ve Fosil Biçim Birim", "back": "Yeni sözcüklerin yapımında çok kullanılan veya çok sayıda sözcükte bulunan eklere işlek ek denir. Dil bilgisel işlevini yitirip yalnızca birkaç kalıplaşmış kelimede kalan üretimsiz eklere ise fosil biçim birim adı verilir.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:20"}, {"front": "Ad Çekim Ekleri", "back": "Ad soylu sözcüklere gelerek bağlı oldukları sözcük öbeklerine göre geçici ilişkiler kuran eklerdir. Ad durum ekleri, çoğul eki, ilgi eki, iyelik ekleri, tamlama ekleri ve ek eylem bu grupta yer alır.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:21"}, {"front": "Eylemsi (Fiilimsi)", "back": "Fiil kök ve gövdelerinden belirli eklerle türetilen, şahıs ekleri alarak çekime girmediği için yargı bildirmeyen bitmemiş fiillerdir. Cümlede isim, sıfat veya zarf görevinde kullanılan eylemsiler yan cümle oluşturmazlar.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:22"}, {"front": "Örnekseme", "back": "Yabancı sözcüklerin özellikle ses ve biçim bakımından model alınarak yerli biçim birimlerle sözcük üretilmesi yoludur. Bu yöntemde model alınan sözcüğe benzetmek esas olduğundan sözcük yapım ilkeleri zaman zaman ihmal edilebilir.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:23"}, {"front": "Eylem Çekiminde Tarz", "back": "Zamanda hareket noktasının konuşanın konuştuğu andan bir başka zamana aktarılmasıyla ortaya çıkan çekim kategorisidir. Yükleme eklenen i- eyleminin geçmiş zamanlarda ve şart kipinde çekimlenmesiyle oluşan bildirme, öykü, rivayet ve şart olmak üzere dört tarz bulunmaktadır.", "ch": 4, "chTitle": "Biçim Bilgisi, Ekler ve Sözcük Türleri", "id": "turk-dili-1:24"}, {"front": "Cümle Bilgisi (Söz Dizimi)", "back": "Bir dildeki sözcüklerin ve sözcük öbeklerinin cümle içindeki görevlerini, birbirleriyle olan ilişkilerini, sıralanışlarını ve cümle türlerini inceleyen bilim dalıdır. Anlatımın temel birimi olan cümlenin yapısını ve ögelerini ele alır.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:25"}, {"front": "Sözcük Öbeği", "back": "Birden çok sözcüğün cümle içinde tek bir işlev görecek şekilde yan yana gelmesiyle oluşan yargısız dil birimidir. Yardımcı öge olan sözcük önce, asıl öge olan sözcük sonra gelerek öbeği oluşturur.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:26"}, {"front": "Cümlenin Temel Ögeleri", "back": "Yeryüzündeki bütün dillerde cümlenin temel ögeleri yüklem ve öznedir. Yüklem cümledeki yargıyı taşıyan temel unsurken, özne yüklemde belirtilen işi, oluşu veya durumu gerçekleştiren ögedir.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:27"}, {"front": "Basit Cümle", "back": "Kuruluşunda bağımsız olarak tek yargı bulunan ve tek bir çekimli yükleme sahip olan cümledir. İçinde eylemsi öbekleri bulunsa dahi tek bir çekimli yükleme bağlandığı sürece basit cümle kabul edilir.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:28"}, {"front": "Birleşik Cümle", "back": "Bir temel cümle ile onu anlam ve görev bakımından tamamlayan bir veya birden fazla yan cümleden oluşan cümledir. Şartlı birleşik cümle, iç içe birleşik cümle ve ki'li birleşik cümle olmak üzere üç türü bulunur.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:29"}, {"front": "Sıralı Cümle", "back": "Yapıca veya anlamca birbirine bağlı olan tek başlarına bağımsız anlam taşıyan cümlelerin virgül veya noktalı virgülle dizilmesiyle oluşan yapıdır. Ögeleri ortak olanlara bağımlı sıralı cümle, ortak ögesi bulunmayanlara bağımsız sıralı cümle denir.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:30"}, {"front": "Bağlı Cümle", "back": "Aralarında anlamca ilişki bulunan ve birbirine bağlama edatlarıyla (bağlaçlarla) bağlanan cümle türüdür. Sıralı cümlelerden en belirgin farkı cümleler arasındaki bağlantının virgül yerine bağlaçlarla kurulmasıdır.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:31"}, {"front": "Ad Cümlesi", "back": "Yüklemi ad, ad soylu sözcük ya da sözcük öbeği olup ek eylemle çekimlenerek yargı bildiren cümledir. Ad cümleleri genellikle özne ve yüklemden oluşur ve kural olarak nesne almazlar.", "ch": 5, "chTitle": "Cümle Bilgisi, Sözcük Öbekleri ve Cümle Türleri", "id": "turk-dili-1:32"}, {"front": "Söz Varlığı", "back": "Bir dilin yalnızca sözlüğündeki sözcükleri değil; deyimleri, atasözlerini, kalıp sözleri, ikilemeleri, terimleri, argo ve ilişki sözlerini kapsayan bütüncül kavramdır. Dil biliminde bu zenginlik ve kavramlar dünyası dil içi dünya görüşü olarak da adlandırılmaktadır.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:33"}, {"front": "Deyim", "back": "Anlatım gücünü artırmak amacıyla gerçek anlamından uzaklaşarak ilgi çekici bir anlam kazanan, en az iki sözcükten oluşan kalıplaşmış söz grubudur. Atasözlerinden farklı olarak kesin bir yargı bildirmeyip durumsal açıklamalar yaparlar ve çoğunlukla mastarla biterler.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:34"}, {"front": "Atasözü", "back": "Uzun gözlem ve deneyimlere dayanan, topluma ders ve öğüt verme amacı taşıyan, kesin bir yargı bildiren kalıplaşmış bilgece sözlerdir. Ağızdan ağza aktarılarak kalıplaştıkları için sözcük dizilimleri ve kelimeleri değiştirilemez.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:35"}, {"front": "İkileme", "back": "Anlatımı pekiştirmek, ifadeyi etkili kılmak ve dile müzikal bir ahenk katmak amacıyla ses veya anlam bakımından ilişkili iki sözcüğün yan yana kullanılmasıyla oluşan yapılardır. Kalıplaşmış yapılar olduklarından sözcüklerin sırası veya biçimi değiştirildiğinde anlam gücü yitirilir.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:36"}, {"front": "Ağız ve İç Alıntı", "back": "Bir dilin ülke veya bölge sınırları içerisinde ses ve biçim farklılıklarıyla ayrılan yerel kollarına ağız denir. Ölçünlü dil, söz varlığını zenginleştirmek için kendi ağızlarından iç alıntı yoluyla kelimeler aktarabilmektedir.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:37"}, {"front": "Argo", "back": "Belirli toplumsal grupların kendilerini gizlemek ve ayrılmak amacıyla oluşturdukları, mevcut sözcüklere yeni mecazi anlamlar yükleyen gizli ve sanatlı dil sistemidir. Açık ve kaba bir ifade biçimi olan sövgü ve küfürden işlevsel olarak ayrılır.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:38"}, {"front": "İlişki Sözleri", "back": "İnsanların günlük sosyal münasebetlerinde nezaket ve inceliği sağlamak amacıyla kullandıkları gözün aydın veya yolun açık olsun gibi kalıplaşmış ifadelerdir. Toplumun yaşama tarzını ve geleneklerini yansıtan bu kalıplar önemli kültürel kodlar taşır.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:39"}, {"front": "Alkış ve Kargış", "back": "Eski Türkçede alkış dua veya övgü anlamına gelirken, kargış ise beddua veya ilenç demektir. İnsanların iyi dileklerini ya da kötülük edenlere karşı ceza isteklerini dile getirdikleri kalıplaşmış ifadelerdir.", "ch": 6, "chTitle": "Türkçenin Söz Varlığı, Deyimler ve Atasözleri", "id": "turk-dili-1:40"}, {"front": "Alıntı ve Verinti", "back": "Bir dilin başka dillerden bünyesine kattığı sözcükler alıntı, başka dillere kazandırdığı sözcükler ise verintidir. Türkçenin dünya dillerine kazandırdığı verinti sayısı on binin üzerindedir.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:41"}, {"front": "İşlenmişlik Ölçütü", "back": "Dillerin gelişmiş veya az gelişmiş olarak tanımlanması bilimsel değildir; dilleri değerlendirmede temel bilimsel ölçüt işlenmişlik ve yazı diline sahip olmadır. 2015 verilerine göre yeryüzündeki 7.102 dilden sadece birkaç yüzü yazı dili niteliği taşımaktadır.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:42"}, {"front": "Türk Dilinin Coğrafi Yaygınlığı", "back": "Türkçe günümüzde Avrupa'nın batısından Asya'nın doğusuna uzanan yaklaşık 12 milyon kilometrekarelik geniş bir alan
