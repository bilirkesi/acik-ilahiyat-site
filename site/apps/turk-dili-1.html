da konuşulmaktadır. Bu alan tarihsel göçler, fetihler ve yurt dışına giden çalışanlar vesilesiyle biçimlenmiştir.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:43"}, {"front": "Armin Vambery'nin Tespiti", "back": "Macar Türkolog Armin Vambery, Balkanlardan Mançurya'ya kadar seyahat edecek birinin sadece Türkçe bilerek bu yolculuğu kolayca gerçekleştirebileceğini belirtmiştir. Bu tespit Türk dilinin geniş iletişim gücünü gösterir.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:44"}, {"front": "Türkçeden En Çok Sözcük Alan Dil", "back": "Türkçenin en fazla sözcük verdiği dil Sırpçadır. Bir zamanlar dokuz bine yakın kelimenin bulunduğu tespit edilen Sırpçada günümüzde yedi bine yakın Türkçe alıntı kullanılmaktadır.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:45"}, {"front": "İlişki ve Nezaket Sözleri", "back": "İnsan ilişkilerinde iletişimi kolaylaştıran, kalıplaşmış nezaket ve incelik ifadeleridir. Ölçünlü Türkçe ve ağızlarda yer alan yüzlerce ilişki sözü kültürümüzde insan ilişkilerine verilen önemi yansıtır.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:46"}, {"front": "Söz Varlığı (Söz Dağarcığı)", "back": "Bir dildeki sözcüklerin, deyimlerin, atasözlerinin, terimlerin ve kalıp sözlerin oluşturduğu bütündür. Söz varlığı aynı zamanda o dili konuşan toplumun yaşayış tarzını ve kültürünü gösteren bir aynadır.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:47"}, {"front": "Türk Yazı Dilleri Sayısı", "back": "Türk dili günümüzde geniş bir coğrafyada 20 ayrı yazı dili halinde varlığını sürdürmektedir. Bu yazı dilleri bağımsız veya özerk cumhuriyetlerde devlet dili, resmi dil ya da özerk dil olarak kullanılmaktadır.", "ch": 7, "chTitle": "Diller Arası Etkileşim ve Türkçenin Yaygınlığı", "id": "turk-dili-1:48"}, {"front": "Dil Sorunlarının Kaynağı", "back": "Türkçenin karşı karşıya bulunduğu sorunlar dilden değil, konuşurların duyarsızlığından, yetersizliklerinden ve kayıtsız tutumlarından kaynaklanmaktadır. Türkçe kendi gereksinimlerini karşılayacak zenginliğe ve olanaklara sahip gelişmiş bir dildir.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:49"}, {"front": "1933 Üniversite Reformu", "back": "Cumhuriyet Dönemi'nde öğretim üyelerine Türkçe ders malzemesi hazırlama ve Türkçe yayın yapma zorunluluğu getirerek Türkçenin bilim dili olmasını sağlayan reformdur. Bu reform kapsamında yabancı öğretim üyelerine de üç yıl içinde Türkçeyi öğrenme şartı konulmuştur.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:50"}, {"front": "Yabancı Dille Öğretim ve Yabancı Dil Öğretimi Ayrımı", "back": "Yabancı dil öğretimi bir dilin öğrenilmesi gerekliliğiyken, yabancı dille öğretim mesleki derslerin yabancı dilde verilmesidir. Yabancı dille öğretim öğrencilerin kavrayışını zorlaştırarak Türkçenin bilim dili olarak gelişmesini engeller.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:51"}, {"front": "Atatürk'ün Geometri Terimleri Çalışması", "back": "Atatürk bizzat yazdığı Geometri kitabında üçgen, açı, açıortay, teğet, yamuk ve eşkenar dörtgen gibi 129 Türkçe terim türetmiştir. Bu çalışma ile Arapça terimlerin yerine açık ve anlaşılır Türkçe terimlerle bilim yapılabileceği kanıtlanmıştır.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:52"}, {"front": "Özenti Alıntısı", "back": "Türkçede tam karşılığı bulunduğu halde yabancı kökenli sözcüklerin statü veya özenme sebebiyle tercih edilmesidir. Örneğin trend yerine eğilim, konsensüs yerine uzlaşma, show yerine gösteri kullanılması gerekirken yabancı biçimlerin seçilmesidir.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:53"}, {"front": "Kitle İletişim Araçlarında Söz Varlığı Kısırlığı", "back": "Radyo ve televizyon haber programlarında geniş bir söz varlığı beklenirken bültenlerin yalnızca birkaç yüz sözcükle hazırlanması sorunudur. Araştırmalar haberlerde kullanılan ilk yüz sözcüğün toplam söz varlığının neredeyse yarısını oluşturduğunu göstermektedir.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:54"}, {"front": "Çeviri Yoluyla Yabancı Anlatım Kalıpları", "back": "Sözcükleri Türkçe olsa da anlatım kalıbı Batı dillerinden aktarılan ifadelere verilen addır. Örneğin çay içmek yerine çay almak veya hoşça kal yerine kendine iyi bak demek Türkçenin yapısına ve kültürüne aykırıdır.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:55"}, {"front": "İş Yaşamında Dil Yabancılaşması", "back": "İş yeri ve mağaza adlarında yabancı sözcüklerin kullanılması ile Türkçenin söz diziminin Eczane Derman örneğindeki gibi bozulmasıdır. Yasal tescil denetimi eksikliği nedeniyle caddelerde ve tabelalarda görünüm bozukluğuna yol açmaktadır.", "ch": 8, "chTitle": "Güncel Dil Sorunları ve Türkçenin Kullanımı", "id": "turk-dili-1:56"}, {"front": "Ses Bilgisi (Fonetik)", "back": "Konuşma seslerini özellikleri, türleri, sözcüklerdeki sıralanışları ve uğradıkları değişmeler açısından araştıran ve sınıflandıran dil bilgisi dalıdır. Konuşma seslerinin üretimi ve algılanması söyleyiş, akustik ve işitsel ses bilgisi olmak üzere üç alanda incelenir.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:57"}, {"front": "Artlık-Önlük Uyumu (Büyük Ünlü Uyumu)", "back": "Türkçe kökenli sözcüklerde kök hecedeki ünlünün niteliğinin, sonraki hecelerdeki ünlünün de art veya ön olmasını belirlemesidir. Kök hecede art ünlü varsa sonraki ünlüler art, ön ünlü varsa sonraki ünlüler ön ünlü olur.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:58"}, {"front": "Dudak Uyumu (Küçük Ünlü Uyumu)", "back": "Ölçünlü Türkçede düz ünlülerden sonra ancak düz ünlülerin, yuvarlak ünlülerden sonra ise dar-yuvarlak veya düz-geniş ünlülerin gelebilmesidir. Türkçe kökenli sözcüklerde ilk hece dışında o ve ö ünlüleri yer almaz.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:59"}, {"front": "Birincil Uzun Ünlü", "back": "Türkçe kökenli sözcüklerde birincil olarak bulunmayan, dilimize Arapça, Farsça veya Batı dillerinden geçen alıntı sözcüklerde görülen ses özelliğidir. Alıntı sözcüklerdeki uzun ünlüler yalın halde kısa söylenebilse de ünlüyle başlayan ek aldıklarında açık hecede ortaya çıkar.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:60"}, {"front": "Türkçedeki Hece Yapısı", "back": "Türkçe kökenli sözcüklerde en çok dört ses bulunabilen altı çeşit hece türü mevcuttur. Türkçe kelime kökünde veya hece sonunda üç ünsüz yan yana bulunmadığı gibi söz başında da çift ünsüz yer almaz.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:61"}, {"front": "En Az Çaba Yasası", "back": "Konuşma sırasında söyleyişi kolaylaştırmak amacıyla dilde en az enerjiyi harcama eğilimidir. Dilin canlılık ilkesi gereğince sözcük ve eklerde meydana gelen ses olaylarının ve zaman içindeki değişimlerin en temel nedenleri arasında yer alır.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:62"}, {"front": "Ötümsüzleşme (Ünsüz Sertleşmesi)", "back": "Ötümsüz ünsüzlerle biten sözcüklere ötümlü ünsüzlerle başlayan ek getirildiğinde ekin başındaki ünsüzün ötümsüz karşılığına gelişmesidir. Örneğin git-di yapısının git-ti veya sabah-dan yapısının sabah-tan şekline dönüşmesi bu ses olayına örnektir.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:63"}, {"front": "Parçalar Üstü Ses Birimleri", "back": "Sözlü iletilere duygu ve anlam değeri katan vurgu, durak ve tonlama gibi müzikal ses ögeleridir. Bu birimler sözcüğün anlamını, cümlede ögelerin işlevini ve bildirimin türünü doğrudan etkiler.", "ch": 3, "chTitle": "Türk Dilinin Ses Yapısı ve Ses Özellikleri", "id": "turk-dili-1:64"}], "quiz": [{"q": "Metinlerde vurgulanan görüşe göre, günümüz Türkçesinde yaşanan bozulma ve yetersizliklerin temel nedeni aşağıdakilerden hangisidir?", "o": [{"t": "Türkçenin yapısı gereği soyut ve bilimsel kavramları türetmeye elverişsiz olması", "ok": false, "why": "Metinde Türkçenin kendi ihtiyaçlarını karşılayacak olanaklara sahip olduğu ve dilin kendisinden kaynaklanan bir sorun bulunmadığı açıkça ifade edilmektedir."}, {"t": "Konuşurların dile karşı duyarsızlığı, kayıtsızlığı ve yabancı sözcüklerin özentisine kapılması", "ok": true, "why": "Kaynaklarda Türkçedeki sorunların doğrudan dilin kendisinden değil, konuşurların olumsuz tutumlarından ve yabancı sözcük özentisinden kaynaklandığı vurgulanmaktadır."}, {"t": "Türkçede hece ve ses kurallarının zamanla tamamen ortadan kalkmış olması", "ok": false, "why": "Türkçenin ses ve hece yapısı belirli kurallarla varlığını korumaktadır; sorun kuralların yok olması değil, konuşurların bu kurallara uymamasıdır."}, {"t": "Türk Dil Kurumunun terim türetme çalışmalarını tamamen durdurmuş olması", "ok": false, "why": "Türk Dil Kurumu yabancı kelimelere Türkçe karşılıklar türetmeye ve terim sözlükleri yayımlamaya aralıksız devam etmektedir."}], "hint": "Sorun dilden değil, dili kullanan bireylerin tutum ve alışkanlıklarından kaynaklanmaktadır.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Yükseköğretimde derslerin Türkçe yerine yabancı dille (örneğin İngilizce) verilmesinin en olumsuz sonucu aşağıdakilerden hangisidir?", "o": [{"t": "Türkçenin bir bilim dili olarak gelişmesinin ve terimleşmesinin önüne engel çıkarması", "ok": true, "why": "Mesleki ve bilimsel derslerin yabancı dille okutulması ve makalelerin yabancı dilde yazılmasının teşvik edilmesi Türkçenin bilim dili olarak işlenmesini engeller."}, {"t": "Öğrencilerin mezuniyet sonrasında uluslararası iş imkânlarını tamamen kaybetmesi", "ok": false, "why": "Bu durum iş imkânlarını kaybettirmekten ziyade anadille öğrenimin getireceği kavramsal kavrayışı ve Türkçenin gelişkenliğini olumsuz etkiler."}, {"t": "Yabancı dil hazırlık sınıflarının üniversitelerden tamamen kaldırılması zorunluluğu", "ok": false, "why": "Kaynakta çözüm olarak öğretim dilinin Türkçe olması, ancak bununla birlikte mükemmel bir yabancı dil ve mesleki yabancı dil eğitimi verilmesi önerilmektedir."}, {"t": "Türkçedeki yabancı kökenli sözcüklerin tamamen temizlenmesine yol açması", "ok": false, "why": "Yabancı dille öğretim yabancı kelimeleri temizlemez, aksine dildeki yabancılaşmayı artırır."}], "hint": "Bu durum Türkçenin soyut kavramlar ve terimler üreten bir vasıf kazanmasını güçleştirir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Kişinin dünyayı anadili çerçevesinde algıladığını, konuştuğu dil ile dünyayı algılama ve davranma biçimi arasında sistemli bir ilişki bulunduğunu savunan hipotez/varsayım aşağıdakilerden hangisidir?", "o": [{"t": "Tek Köken Kuramı", "ok": false, "why": "Tek Köken Kuramı, dünyadaki tüm dillerin tek bir ana dilden türediğini savunur."}, {"t": "Sapir-Whorf Hipotezi", "ok": true, "why": "Sapir-Whorf varsayımına göre insan ana dili çerçevesinde dünyayı algılar ve dil kişinin dünya görüşünü şekillendirir."}, {"t": "Yansıma Kuramı", "ok": false, "why": "Yansıma Kuramı, dillerin doğuşunu doğadaki doğa ve hayvan seslerinin taklit edilmesine bağlar."}, {"t": "Etkileşim Kuramı", "ok": false, "why": "Etkileşim Kuramı, dilin doğuşunu insanların birlikte çalışırken yaptıkları iş birliği ve seslenmelerle açıklar."}], "hint": "Bu varsayım, dilin sadece düşünceyi aktaran bir araç olmadığını, düşünceyi biçimlendiren bir rehber olduğunu öne sürer.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Arapçada fiil çekimlerinin ve çoğul yapılarının (örneğin 'mektup' kelimesinin çoğulunun 'mekatip' olması) kelime kökü içerisindeki ses değişiklikleriyle sağlanması, Arapçayı yapı bakımından hangi dil grubuna dahil eder?", "o": [{"t": "Eklemeli (Bitişken) Diller", "ok": false, "why": "Eklemeli dillerde kelime kökü sabit kalır ve kökün sonuna gramer görevli ekler getirilir (Türkçe gibi)."}, {"t": "Yalınlayan (Kök) Diller", "ok": false, "why": "Yalınlayan dillerde çekim yoktur, kelimeler ek almaz ve gramer işlevleri söz dizimiyle sağlanır (Çince gibi)."}, {"t": "Çekimli (Bükümlü) Diller", "ok": true, "why": "Çekimli dillerde türetme ve çekim sırasında kelime kökünde iç büküm veya değişme meydana gelir."}, {"t": "Isolating (İzole) Diller", "ok": false, "why": "İzole dil, herhangi bir dil ailesine mensup olmayan ya da akrabası bulunmayan dilleri ifade eden coğrafi/genetik bir tanımdır."}], "hint": "Kelime kökünün büküme uğrayarak kalıp değiştirdiği dilleri düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Türkçenin bilinen ilk ve hacimli yazılı belgeleri olan Köktürk Yazıtları (Tonyukuk, Köl Tigin, Bilge Kağan) Türk dilinin hangi tarihi dönemine aittir?", "o": [{"t": "Hun Dönemi", "ok": false, "why": "Hun Dönemi yazılı Türkçe metinlerin bulunmadığı, izlerin yalnızca Çin kaynaklarındaki birkaç sözcük ve cümleyle takip edildiği dönemdir."}, {"t": "Eski Türkçe Dönemi", "ok": true, "why": "5-10. yüzyıllar arasını kapsayan Eski Türkçe dönemi, Köktürk ve Uygur devirlerini içerir."}, {"t": "Orta Türkçe Dönemi", "ok": false, "why": "Orta Türkçe dönemi, Karahanlı ve Harezm sahalarında İslamiyet'in kabulüyle başlayan dönemdir."}, {"t": "Eski Oğuz Türkçesi Dönemi", "ok": false, "why": "Eski Oğuz Türkçesi, 13. yüzyıldan itibaren Anadolu ve çevresinde gelişen Batı Türkçesi koludur."}], "hint": "Türkçenin 5. ile 10. yüzyıllar arasındaki ilk yazılı evresini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Uygurların Soğut alfabesini geliştirerek oluşturdukları, 11-15. yüzyıllar arasında Çağatay, Altınordu ve Kıpçak sahalarında da kullanılan ve Osmanlı sarayında Doğu Türklüğü ile yazışmalarda dahi yararlanılan alfabe aşağıdakilerden hangisidir?", "o": [{"t": "Mani Alfabesi", "ok": false, "why": "Mani alfabesi yalnızca Maniheizm dinine ait sınırlı metinlerde kullanılmış dar kapsamlı bir alfabedir."}, {"t": "Uygur Alfabesi", "ok": true, "why": "Soğut yazısından geliştirilen Uygur alfabesi, millî bir nitelik kazanarak asırlarca geniş bir coğrafyada kullanılmıştır."}, {"t": "Brahmi Alfabesi", "ok": false, "why": "Brahmi alfabesi Hindistan kökenli olup yalnızca bazı Budist metinlerin tercümesinde kullanılmıştır."}, {"t": "Kiril Alfabesi", "ok": false, "why": "Kiril alfabesi Türk topluluklarına Sovyetler Birliği döneminde (özellikle 1939 sonrası) zorunlu kılınmıştır."}], "hint": "Türklerin kendi kültürleriyle özdeşleştirdiği ve Soğut türevi olan köklü yazıyı düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Türkçe kökenli sözcüklerin ses özellikleri göz önüne alındığında, aşağıdakilerden hangisi Türkçe kökenli bir sözcükte doğrudan **bulunamayacak** bir özelliktir?", "o": [{"t": "Sözcük başında J sesinin bulunması", "ok": true, "why": "Türkçe kökenli kelimelerin başında J sesi yer almaz; bu ses yansımalar hariç Fransızca ve Farsçadan geçen alıntılarda görülür."}, {"t": "İlk heceden sonraki ünlülerde 'o' ve 'ö' seslerinin yer almaması", "ok": false, "why": "Türkçede 'o' ve 'ö' sesleri kural olarak yalnızca ilk hecede bulunabilir."}, {"t": "Sözcük kökünde ikiz ünsüzün (aynı ünsüzün yan yana) bulunmaması", "ok": false, "why": "Sözcük kökünde ikiz ünsüz bulunmaması Türkçenin asli ses kuralıdır."}, {"t": "Sözcük başında genellikle c, f, ğ, h, l, m, n, r, v ünsüzlerinin yer almaması", "ok": false, "why": "Bu ünsüzlerin söz başında bulunmaması (bazı istisnalar hariç) Türkçenin temel özelliğidir."}], "hint": "Jale, jön, kolej gibi kelimelerin kökenini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Eski Türkçedeki 'barmak', 'busug', 'bastırma' gibi sözcüklerin başındaki ötümlü 'b-' ünsüzünün Batı Türkçesinde 'p-' sesine dönüşmesi (parmak, pusuk, bastırma > pastırma) hangi ses olayı ile açıklanır?", "o": [{"t": "Ötümlüleşme", "ok": false, "why": "Ötümlüleşme, t- > d- veya k- > g- örneklerinde olduğu gibi ötümsüz seslerin ötümlü hale gelmesidir."}, {"t": "Ötümsüzleşme", "ok": true, "why": "Ötümlü bir ses olan 'b' ünsüzünün ötümsüz bir ses olan 'p' ünsüzüne dönüşmesi ötümsüzleşmedir."}, {"t": "Göçüşme (Metatez)", "ok": false, "why": "Göçüşme, sözcük içindeki iki sesin yer değiştirmesidir (ekşi > eşki gibi)."}, {"t": "Süreklileşme", "ok": false, "why": "Süreklileşme, p > f veya k > h örneklerindeki gibi süreksiz seslerin sürekli sızıcı seslere dönüşmesidir."}], "hint": "Titreşimli (ötümlü) bir ünsüzün titreşimsiz (sert/ötümsüz) bir ünsüze dönüşme sürecini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Türkçede 'yıka-' eyleminden '-n' ekiyle türetilen 'yıkan-' veya 'gör-' eyleminden '-ş' ekiyle türetilen 'görüş-' yapıları, fiilde hangi biçim bilgisel kavramı ifade eder?", "o": [{"t": "Ad Durumu (Hal Ekleri)", "ok": false, "why": "Ad durum ekleri eylemlere değil, isim soylu sözcüklere gelerek ilişki kurar."}, {"t": "Çatı Ekleri (Eylemden Eylem Yapım Ekleri)", "ok": true, "why": "Eylemin özne ve nesneyle ilişkisini düzenleyen dönüşlülük, işteşlik, edilgenlik ve ettirgenlik ekleri eylemden eylem türeten çatı ekleridir."}, {"t": "İyelik Ekleri", "ok": false, "why": "İyelik ekleri isimlere eklenerek nesnenin kime/neye ait olduğunu belirtir."}, {"t": "Eylemsi (Fiilimsi) Ekleri", "ok": false, "why": "Eylemsiler eylemleri geçici olarak ad, sıfat veya zarf yapan yapılardır."}], "hint": "Özne ve nesnenin eylemle kurduğu bağlantıyı sağlayan ve fiilin yönünü belirleyen ek kategorisidir.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Fransızcadaki 'école' sözcüğünden modellenerek, Türkçe 'oku-' eylemine aslında dilde bulunmayan bir '-l' eki getirilip 'okul' kelimesinin üretilmesi hangi sözcük yapımı türüne örnektir?", "o": [{"t": "Kırpma", "ok": false, "why": "Kırpma, popüler > pop örneğinde olduğu gibi kelimenin hecelerinin atılmasıdır."}, {"t": "Örnekseme", "ok": true, "why": "Örnekseme, yabancı dildeki bir kelime model alınarak yerli ek ve köklerle ona benzetilerek yeni sözcük üretilmesidir."}, {"t": "Karma", "ok": false, "why": "Karma, araştırma-geliştirme > arge örneğindeki gibi iki kelimenin parçalarının birleştirilmesidir."}, {"t": "Kalıplaşma", "ok": false, "why": "Kalıplaşma, imambayıldı veya toptan örneklerinde olduğu gibi cümle veya ek yapıları donmasıdır."}], "hint": "Yabancı bir sözcüğün yapısı ve ses tasarımı örnek alınarak yapılan türetim yolunu hatılayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Aşağıdaki cümlelerin hangisinde yüklem geçişsiz bir eylem olduğu için cümlede **nesne** ögesi yer alamaz?", "o": [{"t": "Ağabeyim dün gece sabaha kadar uyudu.", "ok": true, "why": "'Uyu-' fiili 'neyi/kimi?' sorularına cevap vermeyen geçişsiz bir eylemdir, dolayısıyla nesne alamaz."}, {"t": "Öğrenciler kütüphanedeki kitapları dikkatle inceledi.", "ok": false, "why": "'İnceledi' eylemi geçişlidir ve 'kitapları' sözcüğü belirtili nesnedir."}, {"t": "Usta, evin kapısını kırmızıya boyadı.", "ok": false, "why": "'Boyadı' eylemi geçişlidir ve 'evin kapısını' öbeği belirtili nesnedir."}, {"t": "Tüm soruları kısa sürede çözdü.", "ok": false, "why": "'Çözdü' eylemi geçişlidir ve 'tüm soruları' öbeği nesnedir."}], "hint": "'Neyi?' veya 'Kimi?' sorularına cevap veremeyen nesnesiz fiili tespit ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "'Sanıyordu ki bir daha hiç gelmeyecek.' cümlesi, yapısına göre aşağıdaki cümle türlerinden hangisine örnektir?", "o": [{"t": "Şartlı Birleşik Cümle", "ok": false, "why": "Şartlı birleşik cümle -sa/-se ekiyle kurulan yan cümleciklerden oluşur."}, {"t": "İç İçe Birleşik Cümle", "ok": false, "why": "İç içe birleşik cümle bir cümlenin başka bir cümlenin nesnesi olduğu yapılardır (doğrudan aktarmalar gibi)."}, {"t": "Ki'li Birleşik Cümle", "ok": true, "why": "Temel cümlenin 'ki' bağlacıyla yan cümleye bağlandığı yapılar ki'li birleşik cümledir."}, {"t": "Bağımsız Sıralı Cümle", "ok": false, "why": "Sıralı cümleler virgül veya noktalı virgülle ayrılan, hiçbir ögesi ortak olmayan veya olan bağımsız yargılardır."}], "hint": "Cümledeki ana bağlayıcı öge olan Farsça kökenli bağlaca dikkat ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Atasözleri ile deyimler karşılaştırıldığında, aşağıdakilerden hangisi deyimlerin atasözlerinden ayrılan temel bir özelliğidir?", "o": [{"t": "Deyimlerin genel bir kural veya tecrübeye dayalı öğüt/yargı bildirmemesi, sadece bir durumu anlatması", "ok": true, "why": "Atasözleri öğüt veren ve kesin yargı bildiren cümlelerdir; deyimler ise yargı bildirmeyip durumu kavramlaştıran kalıplardır."}, {"t": "Deyimlerin sözlerinin hiçbir zaman değiştirilememesi, atasözlerinin ise sürekli değişmesi", "ok": false, "why": "Her ikisi de kalıplaşmış sözlerdir; ancak bazı deyimlerde ufak varyasyonlar olabilirken atasözleri değişmez kural niteliğindedir.", "p": true}, {"t": "Deyimlerin sadece tek kelimeden oluşması", "ok": false, "why": "Deyimler en az iki sözcükten oluşan kalıplaşmış öbeklerdir."}, {"t": "Atasözlerinin anonim olmaması, söyleyeninin belli olması", "ok": false, "why": "Hem atasözleri hem de deyimler toplumun ortak malı olan anonim ürünlerdir."}], "hint": "Deyimler bir olay veya tutumu resmederken, atasözleri yol gösterici bir ders sunar.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Toplumun ötekileşmiş veya belirli kesimlerinin kendilerini gizlemek, ayrıştırmak ya da ortak dili farklılaştırarak mizahi/sanatlı bir örtü kazandırmak amacıyla kullandığı özel söz varlığına ne ad verilir?", "o": [{"t": "Ölçünlü Dil", "ok": false, "why": "Ölçünlü dil, toplumun tamamının eğitim ve yönetimde kullandığı standart ortak dildir."}, {"t": "Argo", "ok": true, "why": "Argo, belirli grupların başkalarınca anlaşılmamak veya ayrışmak amacıyla ana dilin sözcüklerine yeni anlamlar yükleyerek oluşturduğu sistemdir."}, {"t": "Ağız", "ok": false, "why": "Ağız, bir ülkenin bölgesel ses ve biçim farklılıklarına dayanan konuşma şeklidir."}, {"t": "Alkış", "ok": false, "why": "Alkış, Türkçe söz varlığında iyi dilek ve dua anlamındaki kalıp ifadelerdir."}], "hint": "'Cicozlamak', 'kirişi kırmak', 'zamkinos etmek' gibi kelimelerin ait olduğu alan.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Türkçenin başka dillere verdiği sözcükler (verintiler) incelendiğinde, 10.000'in üzerindeki verintimiz içinde en çok Türkçe sözcük alan ve dilinde bini aşkın Türkçe kelime barındıran dil aşağıdakilerden hangisidir?", "o": [{"t": "Sırpça", "ok": true, "why": "Metne göre Türkçeden en fazla sözcük alan dil Sırpçadır."}, {"t": "İngilizce", "ok": false, "why": "İngilizce Türkçeden kısıtlı sayıda sözcük almıştır, günümüzde etkileyen konumundadır."}, {"t": "Fransızca", "ok": false, "why": "Fransızca Tanzimat sonrası Türkçeye çok sözcük vermiş, ancak Türkçeden çok az sözcük almıştır."}, {"t": "Çince", "ok": false, "why": "Çince Eski Türkçe döneminde Türkçeyi etkilemiş ve kısıtlı kelime alışverişi yapılmıştır."}], "hint": "Balkan coğrafyasında uzun yüzyıllar Osmanlı idaresinde kalmış bir Slav dilini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 0}, {"q": "Dilin doğuşunu, ilk insanların acı, korku, sevinç gibi içsel durumlarını dışa vururken çıkardıkları seslere ve duygularını ifade etmelerine bağlayan kuram aşağıdakilerden hangisidir?", "o": [{"t": "Ünlem kuramı", "ok": true, "why": "Bu kuram, dilin kaynağını insanın sevinç, korku veya acı anlarında çıkardığı doğal ünlemlere ve duygusal tepkilere dayandırır."}, {"t": "Yansıma kuramı", "ok": false, "why": "Yansıma kuramı duygusal tepkileri değil, doğadaki dış seslerin ve nesnelerin taklit edilmesini esas alır."}, {"t": "Ding-dong kuramı", "ok": false, "why": "Ding-dong kuramı nesnelerin insan zihninde yarattığı titreşim ve ses uyumuna odaklanır."}, {"t": "Güneş dil kuramı", "ok": false, "why": "Güneş dil kuramı, Türkçenin dünya dillerinin kökeninde yer aldığını savunan 20. yüzyıla ait antropolojik ve dil bilimsel bir hipotezdir."}], "hint": "İnsanın ruh halini gösteren ani ses tepkilerini ve hislerin dışa vurumunu düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Doğadaki seslerin, hayvan çığlıklarının ve çevredeki nesnelerin çıkardığı seslerin insanlar tarafından taklit edilmesi esasına dayanan dilin doğuşu kuramı aşağıdakilerden hangisidir?", "o": [{"t": "Yansıma kuramı", "ok": true, "why": "Bu görüş, ilk kelimelerin insanların doğadaki gürültüleri, hayvan seslerini ve nesnelerin çıkardığı sesleri taklit etmesiyle oluştuğunu ileri sürer."}, {"t": "Ünlem kuramı", "ok": false, "why": "Ünlem kuramı dış dünyadaki seslerin taklidinden ziyade insanın kendi duygusal çığlıklarını temel alır."}, {"t": "Etkileşim kuramı", "ok": false, "why": "Etkileşim kuramı dilin doğuşunu toplumsal iş birliği ve birlikte çalışma sırasındaki sesleşmelere bağlar."}, {"t": "Tek köken kuramı", "ok": false, "why": "Tek köken kuramı dilin doğuş biçiminden ziyade tüm dillerin tek bir ata dilden türediğini savunur."}], "hint": "Doğada duyulan şırıltı, patırtı gibi yansıma seslerin oluşum mantığını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "\"Tarihteki hiçbir dil günümüz modern dillerinden dil bilgisi yapıları bakımından geri değildir ve insan topluluklarının kullandığı tüm diller toplumun gereksinimlerine cevap verecek yeterliktedir.\" Bu durum bilimsel bakımdan dilin hangi özelliğini ifade eder?", "o": [{"t": "İlkel dil, gelişmiş dil ayrımı yoktur.", "ok": true, "why": "Dil bilimi ilkelerine göre her dil, ait olduğu toplumun ihtiyaçlarını karşılayabilecek gelişmişliktedir ve ilkel dil tanımı bilimsel olarak geçerli değildir."}, {"t": "Dilin üretim yetisi sınırsızdır.", "ok": false, "why": "Üretim yetisinin sınırsızlığı, sınırlı sayıda sesle sonsuz sayıda yeni cümle üretilebilmesi özelliğini anlatır."}, {"t": "Dilde nedensizlik ilkesi esastır.", "ok": false, "why": "Nedensizlik ilkesi, gösterge ile gösterilen (kavram ile ses imgesi) arasında zorunlu bir bağ olmamasını ifade eder."}, {"t": "Dil, öncelikle yazılı bir anlatım aracıdır.", "ok": false, "why": "Dil tarihsel ve bilimsel açıdan öncelikle sözlü bir sistemdir; yazı dili sonradan geliştirilmiştir."}], "hint": "Diller arasında gelişim seviyesi yönünden bir hiyerarşi bulunmadığı fikrine odaklanın.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Dilin sesli ve yazılı biçimleri ile ilgili aşağıdaki ifadelerden hangisi bilimsel olarak doğrudur?", "o": [{"t": "Dilin temeli sestir ve tarihsel olarak konuşma dili yazıdan çok daha eskidir.", "ok": true, "why": "İnsanlık tarihinde sözlü iletişim yazıdan çok daha önce var olmuştur ve dilin temel yapı taşını konuşma sesleri oluşturur."}, {"t": "Yazılı dil, konuşma dilinden mantıksal açıdan her zaman üstündür.", "ok": false, "why": "Bilimsel olarak sözlü ve yazılı dil arasında niteliksel veya mantıksal bir üstünlük hiyerarşisi bulunmamaktadır."}, {"t": "Konuşma sesleri tek başlarına bağımsız birer anlam taşırlar.", "ok": false, "why": "Tek başlarına konuşma sesleri anlamsızdır; anlam ancak seslerin belirli kurallarla dizilmesiyle ortaya çıkar."}, {"t": "Dillerin öncelikli amacı yazılı belgeler oluşturmaktır.", "ok": false, "why": "Dilin temel işlevi toplumsal iletişimi ve anlaşmayı sağlamaktır; yazılı belge oluşturmak ikincil bir araçtır."}], "hint": "İnsanlık tarihinin ilk iletişim biçimlerini ve konuşmanın yazıya göre önceliğini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Herhangi bir dil ailesiyle akrabalık bağı kanıtlanamamış, bilinen diğer dillerden tamamen bağımsız yapıda olan diller \"izole dil\" olarak adlandırılır. Buna göre aşağıdakilerden hangisi izole dillerden biridir?", "o": [{"t": "Gürcüce", "ok": true, "why": "Gürcüce, bilinen büyük dil ailelerinin hiçbiriyle doğrudan akrabalık bağı kurulamayan izole diller kategorisindedir."}, {"t": "Farsça", "ok": false, "why": "Farsça, izole bir dil olmayıp Hint-Avrupa dil ailesinin Hint-İran koluna mensuptur."}, {"t": "Yunanca", "ok": false, "why": "Yunanca, Hint-Avrupa dil ailesine dahil olan köklü bir dildir."}, {"t": "Kazakça", "ok": false, "why": "Kazakça, Türk dilleri ailesine ait Kıpçak grubu dillerindendir."}], "hint": "Kafkas coğrafyasında konuşulan ve bilinen büyük dil ailelerinin hiçbirine dahil edilmeyen dili arayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Tarihte dinî metinlerin yazıldığı, ibadet dili olarak kabul edildiği ve kutsallık atfedildiği bilinen dillerden biri aşağıdakilerden hangisidir?", "o": [{"t": "Sanskritçe", "ok": true, "why": "Sanskritçe, Eski Hindistan'da dinî metinlerin, duaların ve kutsal metinlerin dili olarak kabul edilmiş klasik bir kutsal dildir."}, {"t": "Almanca", "ok": false, "why": "Almanca, Cermen dil grubuna ait ulusal ve resmî bir dildir, kutsal diller sınıflandırmasında yer almaz."}, {"t": "İsveççe", "ok": false, "why": "İsveççe, Kuzey Cermen dilleri arasında yer alan ulusal bir konuşma dilidir."}, {"t": "Tatarca", "ok": false, "why": "Tatarca, Kıpçak grubuna ait bir Türk dili olup kutsal dil statüsünde değerlendirilmez."}], "hint": "Eski Hindistan'da dinî ve felsefi metinlerin kaleme alındığı tarihi dili hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Ölçünlü (standart) dil kavramı ile ilgili aşağıdaki yargılardan hangisi yanlıştır?", "o": [{"t": "Ölçünlü Türkçe, Ankara ağzı esas alınarak oluşturulmuş bir konuşma dilidir.", "ok": true, "why": "Ölçünlü (standart) Türkçe Ankara ağzına değil, İstanbul konuşma ağzına dayalı olarak biçimlenmiştir."}, {"t": "Bir dilin kurala bağlanmış, kurumlarca kabul görmüş standart özelliklerine ölçünlü dil denir.", "ok": false, "why": "Ölçünlü dil terimi, dilin gramer ve imla kurallarıyla standartlaştırılmış biçimini doğru tanımlar."}, {"t": "Ölçünlü dil hem yazı hem de konuşma dilini kapsayan kurallaştırılmış yapıdır.", "ok": false, "why": "Standart dil kuralları hem resmî konuşmalarda hem de yazılı anlatımda geçerlidir."}, {"t": "Resmî yazışmalarda ve eğitimde kullanılan standart dil ölçünlü dildir.", "ok": false, "why": "Eğitim, kamu yönetimi ve hukuk gibi resmî alanlarda karmaşayı önlemek için ölçünlü dil kullanılır."}], "hint": "Türkiye Türkçesinin ölçünlü formunun tarihsel olarak hangi şehir ağzına dayandığını düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Kültürün kuşaktan kuşağa aktarılmasını sağlayan, taşıyıcısı ve en temel ögesi konumundaki unsur aşağıdakilerden hangisidir?", "o": [{"t": "Dil", "ok": true, "why": "Dil, bir toplumun geçmişten getirdiği tüm maddi ve manevi değerleri muhafaza eden ve kuşaktan kuşağa aktaran ana vasıtadır."}, {"t": "Sanat", "ok": false, "why": "Sanat kültürün önemli bir dışa vurumu olsa da birikimin aktarılmasını sağlayan temel araç dilin kendisidir."}, {"t": "Hukuk", "ok": false, "why": "Hukuk toplumsal düzeni sağlayan kurallar bütünüdür, kültür aktarımının ana taşıyıcısı konumunda değildir."}, {"t": "Mimari", "ok": false, "why": "Mimari maddi kültür ögesidir; soyut fikir, inanç ve değerlerin bütüncül aktarımını tek başına sağlayamaz."}], "hint": "Soyut duygu, düşünce ve birikimlerin sözel veya yazılı aktarım vasıtasını hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Kültürü oluşturan maddi ve manevi ögeler dikkate alındığında, aşağıdakilerden hangisi manevi ögeler arasında yer alır?", "o": [{"t": "Atasözleri ve inançlar", "ok": true, "why": "Toplumun zihinsel birikimlerini, değer yargılarını, sözlü geleneklerini ve dünya görüşünü yansıtan unsurlar manevi kültür ögeleridir."}, {"t": "Geleneksel giysi ve kıyafetler", "ok": false, "why": "Giysi ve kıyafetler somut ve nesnel nitelik taşıdıkları için maddi kültür ögeleri arasında sayılır."}, {"t": "Mimari yapılar ve binalar", "ok": false, "why": "Fiziksel olarak inşa edilen tüm yapılar maddi kültürün somut tezahürleridir."}, {"t": "Üretimde kullanılan araç-gereçler", "ok": false, "why": "Araç ve gereçler somut nesneler olduğu için maddi kültür alanına girer."}], "hint": "Zihinsel, soyut ve toplumsal değer yargıları içeren unsurları göz önünde bulundurun.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "\"Dil; ses, biçim, söz dizimi ve anlam gibi birbiriyle bağlantılı alt sistemlerin oluşturduğu bütüncül bir yapıdır.\" Bu tanım dilin hangi temel özelliğini vurgulamaktadır?", "o": [{"t": "Dilin bir sistem olduğunu", "ok": true, "why": "Birbiriyle uyumlu çalışarak iletişimi mümkün kılan alt birimlerin oluşturduğu bütünlük, dilin sistemik yapısını açıklar."}, {"t": "Dilde nedensizlik ilkesinin geçerli olduğunu", "ok": false, "why": "Nedensizlik ilkesi nesneler ile onları karşılayan kelimeler arasındaki nedensiz bağ ilişkisini ifade eder."}, {"t": "Dilin coğrafyalara göre değiştiğini", "ok": false, "why": "Coğrafi değişim diyalekt ve ağız farklılıklarını açıklar, alt sistemlerin bütünlüğünü vurgulamaz."}, {"t": "Dilin tamamen bireysel bir edim olduğunu", "ok": false, "why": "Dil bireysel değil, toplumsal uzlaşıya dayanan kuralcı bir sistemdir."}], "hint": "Ögelerin düzenli bir bütün oluşturması ve belirli kurallara göre işlemesi durumuna ne ad verildiğini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Bir dilin coğrafi, toplumsal ve tarihî süreçlerde ağız, şive ve lehçe gibi farklı \"değişke\"lere ayrılmasının temel nedeni aşağıdakilerden hangisidir?", "o": [{"t": "Dilin zamana, coğrafyaya ve toplumsal katmanlara bağlı olarak sürekli değişmesi", "ok": true, "why": "Dil durağan olmayıp zamanla, farklı coğrafyalarla ve toplumsal gruplarla etkileşime girerek çeşitlenir ve değişkelere ayrılır."}, {"t": "Dilde ilkeller ve gelişmişler ayrımının bulunması", "ok": false, "why": "Dil biliminde ilkel dil-gelişmiş dil ayrımı yoktur, dolayısıyla değişke sebebi olamaz."}, {"t": "Dillerin yalnızca resmî yazışmalarda kullanılması", "ok": false, "why": "Dilin günlük yaşamda ve her kesimce kullanılması değişkeleșmeyi artırır; sadece resmî kullanım çeşitliliği azaltırdı."}, {"t": "Yazı dilinin konuşma dilinden daha sonra keşfedilmiş olması", "ok": false, "why": "Yazının keşif zamanı, dilde coğrafi veya toplumsal varyasyonların oluşmasının doğrudan nedeni değildir."}], "hint": "Dilin durağan olmayıp toplumla ve mekanla birlikte dönüşme karakterini göz önüne alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "\"Dil hem düşünceyi aktaran bir araç, hem edebî ve fikrî ürünlerin hammaddesi olan malzeme, hem de bu sistemi işleten bir düzendir.\" ifadesi dilin hangi yönünü öne çıkarmaktadır?", "o": [{"t": "Araç-amaç ikiliği ve çok yönlülüğü", "ok": true, "why": "Dilin hem duygu/düşünce aktarımında vasıta olması hem de kendisinin inceleme ve sanat nesnesi yapılması çok yönlü yapısını gösterir."}, {"t": "Yalnızca yazılı kurallara dayanmasını", "ok": false, "why": "Bu ifade dilin tek yönlü yazılı kuralcılığını değil, işlevsel çeşitliliğini ve esnekliğini anlatır."}, {"t": "Sözcüklerin nedensiz bağlarla oluşmasını", "ok": false, "why": "Nedensizlik kavramı kelimelerin anlamlandırılmasıyla ilgilidir, dilin işlevsel çift yönlülüğünü kapsamaz."}, {"t": "Yalnızca tek bir toplumsal sınıfa ait olmasını", "ok": false, "why": "Dil tüm topluma ait ortak bir kurumdur, tek bir sınıfla sınırlandırılamaz."}], "hint": "Dilin hem iletişimi sağlayan bir vasıta hem de incelenen nesnenin kendisi olması durumunu değerlendirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Aşağıdakilerden hangisi Birleşmiş Milletler (BM) örgütünün resmî dillerinden biridir?", "o": [{"t": "Çince", "ok": true, "why": "Çince, Birleşmiş Milletler'in İngilizce, Fransızca, Rusça, İspanyolca ve Arapça ile birlikte kabul ettiği altı resmî dilden biridir."}, {"t": "Almanca", "ok": false, "why": "Almanca Avrupa'da yaygın konuşulsa da Birleşmiş Milletler'in resmî dilleri arasında yer almaz."}, {"t": "Korece", "ok": false, "why": "Korece Doğu Asya'da önemli bir dil olmasına karşın BM resmî dili statüsünde değildir."}, {"t": "Portekizce", "ok": false, "why": "Portekizce küresel düzeyde geniş bir coğrafyada konuşulmasına rağmen BM resmî diller listesinde yoktur."}], "hint": "Dünyada en çok konuşuru bulunan ve BM'nin altı resmî dilinden biri olan Doğu Asya dilini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 1}, {"q": "Türkçenin metinlerle takip edilebilen tarihi boyunca kullandığı, kendine özgü ilk düzenli ve kuralları yerleşmiş yerli yazı sistemi aşağıdakilerden hangisidir?", "o": [{"t": "Köktürk alfabesi", "ok": true, "why": "Türklerin bilinen ilk millî alfabesi olup Orhun Yazıtları bu gelişmiş ve kuralları oturmuş yazı sistemiyle taşa kazınmıştır."}, {"t": "Uygur alfabesi", "ok": false, "why": "Soğd alfabesinden türetilen ve Köktürk alfabesinden sonra geniş kabul gören bir yazı sistemidir."}, {"t": "Soğd alfabesi", "ok": false, "why": "İran kökenli bir alfabe olup Uygur yazısının oluşumuna temel sağlamıştır ancak Türklerin özgün ilk alfabesi değildir."}, {"t": "Mani alfabesi", "ok": false, "why": "Maniheizm dininin kabulüyle beraber dar bir çevrede tercih edilen alfabelerden biridir."}], "hint": "Batılı bilginlerce 'Runik' olarak adlandırılan ve Orhun Yazıtları'nın yazımında kullanılan alfabeyi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Türk dilinin yazıyla izlenebilen ilk dönemi olan ve MS 5.-10. yüzyıllar arasında Göktürk ile Uygur metinlerini kapsayan tarihî dönem aşağıdakilerden hangisidir?", "o": [{"t": "Eski Türkçe Dönemi", "ok": true, "why": "Türkçenin bilinen ilk hacimli yazılı belgelerinin verildiği ve Köktürk ile Uygur evrelerini kapsayan ilk tarihî dönemdir."}, {"t": "Orta Türkçe Dönemi", "ok": false, "why": "İslamiyet'in kabulünden sonra Karahanlı, Harezm ve Çağatay sahalarını kapsayan sonraki evredir."}, {"t": "Çağatay Türkçesi Dönemi", "ok": false, "why": "Doğu Türkçesi kolunda Müşterek Türkistan Türkçesi olarak gelişen daha geç bir dönemi ifade eder."}, {"t": "Yeni Türkçe Dönemi", "ok": false, "why": "20. yüzyıl sonrasını ve modern yazı dillerinin oluştuğu evreyi kapsar."}], "hint": "MS 5. ile 10. yüzyıllar arasında varlık gösteren ve Türkçenin bilinen en eski yazılı örneklerini barındıran ilk dönemi hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Soğd yazı sisteminin dönüştürülmesiyle oluşturulan ve Moğol ile Mançu gibi toplulukların alfabelerine de kaynaklık eden tarihî alfabe aşağıdakilerden hangisidir?", "o": [{"t": "Uygur alfabesi", "ok": true, "why": "Soğd alfabesinden uyarlanarak geliştirilmiş ve çevre halkların alfabe yapılarına da modellik etmiştir."}, {"t": "Brahmi alfabesi", "ok": false, "why": "Hindistan kaynaklı olup Budist metinlerin tercümesinde kısıtlı biçimde kullanılmıştır."}, {"t": "Köktürk alfabesi", "ok": false, "why": "Yerli ve özgün damgalardan gelişmiş olup dış kaynaklı Soğd alfabesine dayanmaz."}, {"t": "Süryani alfabesi", "ok": false, "why": "Yakın Doğu kökenli bir alfabe olup Türkçenin yazımında kısıtlı dinî metinlerde tercih edilmiştir."}], "hint": "Yerleşik hayata geçen Türk topluluklarının uzun yıllar zengin bir edebiyat külliyatı oluştururken yararlandığı alfabeyi göz önüne getiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Karahanlı ve Harezm Türkçesi metinlerini kapsayan, Türklerin İslam kültür çevresine girmesiyle şekillenen tarihî evre aşağıdakilerden hangisidir?", "o": [{"t": "Orta Türkçe Dönemi", "ok": true, "why": "Karahanlı ve Harezm sahası eserleriyle İslam etkisindeki ilk yazılı ürünlerin ortaya konduğu dönemi ifade eder."}, {"t": "Eski Türkçe Dönemi", "ok": false, "why": "İslam öncesi Göktürk ve Uygur metinlerinin üretildiği ilk dönemi kapsar."}, {"t": "Hun Dönemi", "ok": false, "why": "Türkçenin henüz yazılı belgelerle geniş biçimde takip edilemediği çok daha eski döneme aittir."}, {"t": "Yeni Türkçe Dönemi", "ok": false, "why": "Modern Çağ'daki çağdaş Türk şivelerini ve yazı dillerini kapsayan evredir."}], "hint": "Divânü Lügati't-Türk ve Kutadgu Bilig gibi geçiş dönemi eserlerinin kaleme alındığı yüzyılları kapsayan dönemi değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Müşterek Türkistan Türkçesi adıyla da anılan ve Ali Şîr Nevâî'nin Muhakemetü'l-Lügateyn adlı eseriyle zirveye ulaşan edebî dil dönemi aşağıdakilerden hangisidir?", "o": [{"t": "Çağatay Türkçesi", "ok": true, "why": "Doğu Türkçesi sahasında gelişen ve Orta Asya Türk dünyasının ortak edebî dili olarak işlev gören tarihî yazı dilidir."}, {"t": "Kıpçak Türkçesi", "ok": false, "why": "Kuzey Türkçesi alanında Altınordu ve Karadeniz'in kuzeyinde gelişen yazı dilidir."}, {"t": "Oğuz Türkçesi", "ok": false, "why": "Türkiye Türkçesi ve Azerbaycan Türkçesinin temelini oluşturan Batı Türkçesi koludur."}, {"t": "Uygur Türkçesi", "ok": false, "why": "Eski Türkçe dönemi içinde yer alan ve Budist-Maniheist metinlerle tanınan evredir."}], "hint": "Doğu Türkçesi kolunun en önemli edebî gelişim safhasını dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "MS 687-692 yıllarına tarihlenen ve Türk dilinin tarihi bilinen ilk yazılı belgesi kabul edilen yazıt aşağıdakilerden hangisidir?", "o": [{"t": "Çoyr Yazıtı", "ok": true, "why": "Tarihi kesin olarak belirlenebilen en eski Türk yazılı belgesi olma niteliğini taşır."}, {"t": "Bilge Kağan Yazıtı", "ok": false, "why": "8. yüzyılda (735 civarı) dikilmiş ana Orhun abidelerinden biridir."}, {"t": "Kül Tigin Yazıtı", "ok": false, "why": "732 yılında dikilen ve Köktürk alfabesiyle yazılan görkemli bir anıttır."}, {"t": "Yenisey Yazıtları", "ok": false, "why": "Tarihlenmesi tam olarak kesinleşmemiş, daha kısa nitelikli mezar taşlarıdır."}], "hint": "MS 7. yüzyılın sonlarına tarihlenen ve bilinen en eski yazılı Türk anıtı olma özelliğini taşıyan metni düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Kuzey Türkçesi (Kıpçak Türkçesi) sahasında kaleme alınan, Kıpçak Türkçesinin söz varlığı ve dil bilgisi bakımından en önemli kaynağı sayılan eser aşağıdakilerden hangisidir?", "o": [{"t": "Codex Cumanicus", "ok": true, "why": "Karadeniz'in kuzeyindeki Kıpçak Türklerinin dilini yansıtan ve Hristiyan misyonerlerce derlenen temel kaynaktır."}, {"t": "Kutadgu Bilig", "ok": false, "why": "Karahanlı Türkçesi dönemiyle yazılmış siyasetname niteliğinde ilk İslami eserdir."}, {"t": "Atebetü'l-Hakâyık", "ok": false, "why": "Edip Ahmet Yüknekî tarafından Karahanlı Türkçesiyle yazılmış ahlaki bir öğüt kitabıdır."}, {"t": "Muhakemetü'l-Lügateyn", "ok": false, "why": "Ali Şîr Nevâî tarafından Çağatay Türkçesi ile Farsça karşılaştırmalı olarak yazılmıştır."}], "hint": "Karadeniz'in kuzeyindeki Kıpçaklar ile Avrupalılar arasındaki ticari ve dinî ilişkiler sonucu derlenen derleme eseri hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Çağdaş Türkiye Türkçesi aşağıdaki tarihî Türk dili kollarından hangisinin doğrudan devamı kabul edilmektedir?", "o": [{"t": "Oğuz Türkçesi", "ok": true, "why": "Selçuklu ve Osmanlı üzerinden günümüz Türkiye Türkçesine ulaşan Batı Türkçesi kolunu oluşturur."}, {"t": "Kıpçak Türkçesi", "ok": false, "why": "Tatar, Başkurt ve Kazak Türkçesi gibi Kuzey grubu lehçelerinin kaynağını oluşturur."}, {"t": "Çağatay Türkçesi", "ok": false, "why": "Özbek ve Doğu Türkistan alanındaki çağdaş lehçelerin tarihî temelidir."}, {"t": "Karluk Türkçesi", "ok": false, "why": "Doğu grubunun oluşumunda rol oynayan ve Karahanlı Türkçesine zemin oluşturan koldur."}], "hint": "Yunus Emre ve Âşık Paşa gibi isimlerin ilk örneklerini verdiği Batı Türkçesi ana kolunu dikkate alınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "1926 yılında toplanan ve Çuvaşlar haricindeki tüm Türk topluluklarının Latin alfabesine geçmesi yönünde tarihi bir karar alan kongre aşağıdakilerden hangisidir?", "o": [{"t": "Bakü Türkoloji Kongresi", "ok": true, "why": "Türk dünyasının ortak alfabe kullanımı ve dil meselelerinin karara bağlandığı simge toplantıdır."}, {"t": "Taşkent Dil Kurultayı", "ok": false, "why": "Orta Asya'da bölgesel alfabe düzenlemeleri yapılan ancak bu kararın alındığı ana kongre olmayan bir toplantıdır."}, {"t": "Almatı Kültür Kongresi", "ok": false, "why": "Kazakistan sahasındaki dil çalışmalarıyla sınırlı yerel bir buluşmadır."}, {"t": "Kazan Türkoloji Toplantısı", "ok": false, "why": "Tatar dili üzerine odaklanan, tüm Türk dünyasını bağlayan genel kararın çıkmadığı bir etkinliktir."}], "hint": "1920'li yıllarda Azerbaycan'ın başkentinde düzenlenen geniş katılımlı Türkoloji kongresini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Türkçenin metinlerle takip edilemeyen, teorik karşılaştırmalarla (rekonstrüksiyon) kurgulanan en eski karanlık dönemi aşağıdakilerden hangisidir?", "o": [{"t": "Altay Dönemi", "ok": true, "why": "Türkçenin henüz ayrı bir dil olarak şekillenmediği, Altay dil birliği içinde değerlendirildiği yazısız evredir."}, {"t": "Uygur Dönemi", "ok": false, "why": "Yüzlerce yazılı belgenin günümüze ulaştığı metinlerle izlenebilir bir dönemdir."}, {"t": "Karahanlı Dönemi", "ok": false, "why": "İslami dönemin ilk yazılı eserlerinin verildiği takipli evredir."}, {"t": "Harezm Dönemi", "ok": false, "why": "14. yüzyılda Altınordu ve Orta Asya sahasında zengin yazılı metinler sunan dönemdir."}], "hint": "Türkçenin henüz Moğolca, Mançu-Tunguzca gibi akraba dillerle bir arada bulunduğu düşünülen en eski evreyi değerlendiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Batı Türkçesinin ilk evresi olan Eski Oğuz Türkçesi dönemi dil özelliklerini yansıtan ve destansı anlatılar barındıran eser aşağıdakilerden hangisidir?", "o": [{"t": "Dede Korkut Kitabı", "ok": true, "why": "Oğuz Türklerinin toplumsal hayatını ve dil yapısını Eski Anadolu Türkçesi dönemi özellikleriyle günümüze taşıyan destansı metindir."}, {"t": "Divânü Lügati't-Türk", "ok": false, "why": "11. yüzyılda Kâşgarlı Mahmud tarafından Karahanlı sahasında yazılmış Arapça-Türkçe sözlüktür."}, {"t": "Nehcü'l-Ferâdis", "ok": false, "why": "Harezm Türkçesi döneminde dinsel ve ahlaki konularda kaleme alınan bir yapıttır."}, {"t": "Mukaddimetü'l-Edeb", "ok": false, "why": "Zemahşerî tarafından Harezm Türkçesi sahasında hazırlanan Arapça öğretim sözlüğüdür."}], "hint": "Salur Kazan, Bamsı Beyrek gibi kahramanların yer aldığı ve Batı Türkçesinin ilk evresini yansıtan eseri hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Tarih boyunca Türklerin dillerini kaydetmek için kullandığı 13 farklı alfabe arasında aşağıdakilerden hangisi yer almaz?", "o": [{"t": "Japon alfabesi", "ok": true, "why": "Türklerin tarihsel süreçte coğrafi ve kültürel temaslar sonucunda kullandığı 13 yazı sistemi arasında bulunmamaktadır."}, {"t": "Süryani alfabesi", "ok": false, "why": "Hristiyan Türk topluluklarının dinî metinleri yazarken tercih ettiği alfabelerdendir."}, {"t": "İbrani alfabesi", "ok": false, "why": "Musevi dinine mensup Hazar Türkleri ve Karaylar tarafından kullanılan yazılardandır."}, {"t": "Mani alfabesi", "ok": false, "why": "Uygur döneminde Maniheizm inancının benimsenmesiyle kullanılan yazı sistemlerinden biridir."}], "hint": "Türkçenin yazımında kullanılan 13 tarihî ve çağdaş alfabeden biri olmayan Doğu Asya kökenli yazı sistemini arayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 2}, {"q": "Konuşurların sesleri nasıl ürettiğini, ciğerlerden gelen havanın ses organlarında uğradığı değişiklikleri ve oluşum noktalarını inceleyen ses bilgisi alt dalı aşağıdakilerden hangisidir?", "o": [{"t": "Söyleyiş ses bilgisi", "ok": true, "why": "Konuşanın ses organlarını kullanarak sesleri üretme ve boğumlama sürecini doğrudan inceleyen alan söyleyiş ses bilgisidir."}, {"t": "Akustik ses bilgisi", "ok": false, "why": "Bu alan seslerin fiziksel olarak havada nasıl yol aldığını ve ses dalgalarının özelliklerini inceler."}, {"t": "İşitsel ses bilgisi", "ok": false, "why": "Bu alt dal seslerin dinleyen kişinin kulağı ve beyni tarafından nasıl algılandığını konu edinir."}, {"t": "Tarihî ses bilgisi", "ok": false, "why": "Bu alan dilin ses yapısının tarihsel süreç içerisindeki evrimini ve değişimlerini inceler."}], "hint": "Seslerin konuşmacı tarafından fizyolojik olarak organlar vasıtasıyla çıkarılması sürecine odaklanmalısınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçedeki 'e' ünlüsünün boğumlanma özelliklerine göre sınıflandırılması aşağıdakilerin hangisinde doğru ve eksiksiz olarak verilmiştir?", "o": [{"t": "Ön, düz, geniş", "ok": true, "why": "/e/ sesi dilin ön tarafının yükselmesiyle oluşur, dudaklar düzdür ve çene açıklığı geniş konumdadır."}, {"t": "Art, düz, dar", "ok": false, "why": "Bu özellikler dilin arka tarafında oluşan /ı/ ünlüsüne aittir."}, {"t": "Ön, yuvarlak, geniş", "ok": false, "why": "Dudakların yuvarlaklaşması durumunda ön-geniş konumda /ö/ ünlüsü oluşur."}, {"t": "Ön, düz, dar", "ok": false, "why": "Ağız açıklığının dar olması durumunda ön-düz konumda /i/ ünlüsü ortaya çıkar."}], "hint": "Ünlünün dil pozisyonu (ön/art), dudak biçimi (düz/yuvarlak) ve çene açıklığı (geniş/dar) ölçütlerini değerlendirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Eski Türkçe dönemindeki 'öpke > öfke' veya 'beg > bey' örneklerinde görülen ses olayı aşağıdakilerden hangisidir?", "o": [{"t": "Süreklileşme", "ok": true, "why": "Patlamalı/süreksiz bir ünsüzün (/p/, /g/), sızıcı/sürekli bir ünsüze (/f/, /y/) dönüşmesi süreklileşme olarak adlandırılır."}, {"t": "Ötümlüleşme", "ok": false, "why": "Ötümsüz bir sesin ses tellerinin titreşimiyle ötümlü hâle gelmesidir."}, {"t": "Göçüşme", "ok": false, "why": "Sözcük içindeki iki ünsüzün birbiriyle yer değiştirmesidir."}, {"t": "Ünsüz tekleşmesi", "ok": false, "why": "İkizleşmiş veya çift yazılan bir ünsüzün teke düşmesidir."}], "hint": "Hava akımını aniden kesen patlamalı bir sesin, havayı sızdıran sürekli bir sese dönüşmesini düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Arapçadan dilimize geçen 'hamir' sözcüğünün Türkçede 'hamur' şekline dönüşmesinde görülen ses olayı aşağıdakilerden hangisidir?", "o": [{"t": "Ünlü yuvarlaklaşması", "ok": true, "why": "İkinci hecedeki düz-dar /i/ ünlüsü, birinci hecedeki dudak ünsüzü veya çevre etkisiyle yuvarlak-dar /u/ sesine dönüşmüştür."}, {"t": "Ön damaksıllaşma", "ok": false, "why": "Art ünlünün ön ünlüye dönüşmesi olayıdır (bıç- > biç- gibi)."}, {"t": "Ünlü daralması", "ok": false, "why": "Geniş bir ünlünün dar bir ünlüye dönüşmesidir."}, {"t": "Ünsüz benzeşmesi", "ok": false, "why": "Ünsüz seslerin nitelikçe birbirine yaklaşması veya aynı olmasıdır."}], "hint": "İkinci hecedeki düz sesin dudakların büzülmesiyle aldığı yeni biçimi göz önüne getirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçe kökenli sözcüklerin ses özellikleri dikkate alındığında, aşağıdakilerden hangisi doğrudan yabancı kökenli bir sözcüktür?", "o": [{"t": "Neşe", "ok": true, "why": "Türkçe kökenli sözcüklerin başında istisnalar dışında /n/ ünsüzü bulunmaz ve 'neşe' bu istisnai Türkçe köklerden biri değildir."}, {"t": "Pınar", "ok": false, "why": "Söz başında /p/ bulunmasına rağmen Türkçe kökenli istisnai sözcükler arasında yer alır."}, {"t": "Şimdi", "ok": false, "why": "Söz başında /ş/ bulunmasına rağmen Eski Türkçedeki biçimden gelişmiş Türkçe kökenli bir istisnadır."}, {"t": "Pek", "ok": false, "why": "Başta /p/ ünsüzü barındırmasına karşın Türkçe kökenli kabul edilen istisnai kelimelerdendir."}], "hint": "Türkçe sözcüklerin başında bulunmayan ünsüzleri ve bu kuralın Türkçe kökenli bilinen istisnalarını dikkate alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "'kirpik > kiprik' ve 'ekşi > eşki' örneklerinde görülen, sözcük içindeki ünsüzlerin birbiriyle yer değiştirmesi olayına ne ad verilir?", "o": [{"t": "Göçüşme", "ok": true, "why": "Komşu hecelerdeki veya yan yana duran ünsüzlerin yer değiştirmesi göçüşme (metatez) olarak tanımlanır."}, {"t": "Ötümsüzleşme", "ok": false, "why": "Ötümlü bir sesin sertleşerek ötümsüz hâle gelmesidir."}, {"t": "Ünsüz ikizleşmesi", "ok": false, "why": "Sözcük içindeki tek bir ünsüzün iki defa telaffuz edilmesidir."}, {"t": "Ünsüz aykırılaşması", "ok": false, "why": "Birbiriyle aynı veya benzer olan iki sesin farklılaşmasıdır."}], "hint": "Seslerin sözcük içinde karşılıklı olarak yer değiştirmesi terimini hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Aşağıdaki cümlelerin hangisinde yer alan altı çizili sözcükte ünlü daralması gerçekleşmiştir?", "o": [{"t": "Çocuk neden sürekli ağlıyorsun diye sordu.", "ok": true, "why": "'ağla-' fiil kökündeki geniş /a/ ünlüsü, şimdiki zaman ekinin etkisiyle daralarak /ı/ sesine dönüşmüştür."}, {"t": "Akşamüstü kütüphanede ders çalışıyordu.", "ok": false, "why": "'çalış-' fiili dar ünlülü bittiği için araya bağlama ünlüsü girmiştir, kökte geniş ünlü daralması yoktur."}, {"t": "Yeni aldığı kitabı büyük bir keyifle okuyordu.", "ok": false, "why": "'oku-' fiil kökü zaten dar ünlü ile bittiğinden bir daralma gerçekleşmemiştir."}, {"t": "Olayın ardından polisler şüpheliyi götürüyordu.", "ok": false, "why": "'götür-' fiili dar ünlü barındırdığı için geniş ünlünün daralması durumu söz konusu değildir."}], "hint": "Fiil kök veya gövdesindeki geniş ünlünün (a, e) /-yor/ ekinin etkisiyle daralıp daralmadığını kontrol edin.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçede 'kardeş' sözcüğüne 'benim' iyelik eki getirildiğinde sözcüğün 'kardeşim' biçimini almasında araya giren '-i-' sesinin temel işlevi nedir?", "o": [{"t": "Bağlama ünlüsü", "ok": true, "why": "Ünsüzle biten bir sözcüğe ünsüzle başlayan ek getirildiğinde hece yapısını korumak üzere araya giren yardımcı ses bağlama ünlüsüdür."}, {"t": "Bağlama ünsüzü", "ok": false, "why": "İki ünlü yan yana geldiğinde ikiz ünlü oluşumunu önlemek için araya giren ünsüz yardımcı sestir."}, {"t": "Ünlü türemesi", "ok": false, "why": "Kök veya gövdede pekiştirme veya küçültme gibi süreçlerde ortaya çıkan yapım işlevli ünlü belirmesidir."}, {"t": "Ünlü birleşmesi", "ok": false, "why": "Aşınma yoluyla iki ünlünün tek bir ünlüde toplanması olayıdır."}], "hint": "Ünsüzle biten kelime ile ünsüzle başlayan ek arasında heceleme olanağı sağlayan yardımcı sesi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Konuşma sırasında cümlenin veya sözcüklerin anlamını değiştiren; vurgu, tonlama ve durak gibi doğrudan harflerle gösterilmeyen unsurlara ne ad verilir?", "o": [{"t": "Parçalar üstü ses birimleri", "ok": true, "why": "Vurgu, tonlama ve durak gibi söyleyişin ezgisini ve anlamını belirleyen nitelikler parçalar üstü ses birimleridir."}, {"t": "Parçasal ses birimleri", "ok": false, "why": "Doğrudan harflerle temsil edilen ünlü ve ünsüz seslerin kendisidir."}, {"t": "Bağlama sesleri", "ok": false, "why": "Ek birleşmelerinde hece uyumu sağlayan yardımcı ünlü ve ünsüzlerdir."}, {"t": "İkincil ünsüzler", "ok": false, "why": "Tarihsel süreçte sonradan ortaya çıkmış olan ünsüz seslerdir."}], "hint": "Ses birimlerinin ötesinde söyleyiş ezgisi ve duraklamalarla sağlanan anlam katmanını arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Eski Türkçe döneminden beri var olan 'penbe > pembe' sözcüğünde görülen ses olayı aşağıdakilerden hangisidir?", "o": [{"t": "Ünsüz benzeşmesi", "ok": true, "why": "Dudak ünsüzü olan /b/, kendinden önceki diş-damak ünsüzü /n/ sesini etkileyerek dudak ünsüzü /m/ hâline getirmiştir (dudak benzeşmesi)."}, {"t": "Ötümlüleşme", "ok": false, "why": "Ötümsüz bir sesin ötümlü hâle dönüşmesidir."}, {"t": "Ünsüz tekleşmesi", "ok": false, "why": "Çift ünsüzün teke düşmesidir."}, {"t": "Süreklileşme", "ok": false, "why": "Patlamalı bir ünsüzün sızıcı ünsüze dönüşmesidir."}], "hint": "Bir ünsüzün diğer ünsüzü kendisine benzeterek boğumlanma noktasını değiştirmesini göz önüne alın.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "'kavuşak > kavşak' veya 'devirim > devrim' örneklerinde görülen ses olayı aşağıdakilerden hangisidir?", "o": [{"t": "Ünlü düşmesi", "ok": true, "why": "Sözcük türetilirken veya ek alırken vurgusuz orta hecedeki dar ünlünün kaybolması olayıdır."}, {"t": "Ünlü türemesi", "ok": false, "why": "Sözcükte daha önce bulunmayan bir ünlünün ortaya çıkmasıdır."}, {"t": "Ünlü daralması", "ok": false, "why": "Geniş ünlünün dar ünlüye dönüşmesidir."}, {"t": "Hece düşmesi", "ok": false, "why": "Ünlü ve ünsüzden oluşan bütün bir hecenin kaybolmasıdır (ilerilemek > ilerlemek)."}], "hint": "İki ünsüz arasında yer alan vurgusuz dar ünlünün kaybolması durumunu düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Eski Türkçe 'ana' ve 'elig' sözcüklerinin Türkiye Türkçesinde 'anne' ve 'elli' biçimlerini alması hangi ses olayının sonucudur?", "o": [{"t": "Ünsüz ikizleşmesi", "ok": true, "why": "Kök veya gövde içindeki tek bir ünsüzün vurgu ve seslik nedenlerle çiftleşerek söylenmesidir."}, {"t": "Ünsüz benzeşmesi", "ok": false, "why": "Farklı ünsüzlerin birbirini etkileyerek benzer hâle gelmesidir."}, {"t": "Ünsüz türemesi", "ok": false, "why": "Sözcük başında veya içinde önceden var olmayan yeni bir ünsüz belirmesidir."}, {"t": "Ünsüz tekleşmesi", "ok": false, "why": "Çift ünsüzlü yabancı kelimelerin Türkçede tek ünsüzle söylenmesidir."}], "hint": "Sözcük kökündeki tek ünsüzün iki kez telaffuz edilmeye başlanmasını değerlendirin.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçenin düzlük-yuvarlaklık (dudak) uyumu kuralına göre, ilk hecesinde yuvarlak ünlü (o, ö, u, ü) bulunan bir sözcüğün sonraki hecelerinde hangi ünlüler yer alabilir?", "o": [{"t": "Dar-yuvarlak (u, ü) veya düz-geniş (a, e)", "ok": true, "why": "Dudak uyumu kuralına göre yuvarlak ünlüleri ancak dar-yuvarlak (u, ü) veya düz-geniş (a, e) ünlüler takip edebilir (ör. bora, kuru, bölüm)."}, {"t": "Yalnızca düz-dar (ı, i) ünlüler", "ok": false, "why": "Düz ünlülerden sonra düz ünlüler gelebilir kuralı ile karıştırılmamalıdır."}, {"t": "Yalnızca yuvarlak-geniş (o, ö) ünlüler", "ok": false, "why": "Türkçe kökenli sözcüklerde ikinci ve sonraki hecelerde yuvarlak-geniş (o, ö) ünlüler bulunmaz."}, {"t": "Yalnızca art-düz (a, ı) ünlüler", "ok": false, "why": "Bu durum kalınlık-incelik (önlük-artlık) uyumu kuralıyla ilgilidir."}], "hint": "Dudak uyumunda yuvarlak ünlüden sonra gelebilecek iki ünlü grubunu hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Türkçe kökenli sözcüklerde asli olarak bulunmayıp zamanla ses değişimleri ve sızıcılaşma ile ortaya çıkan 'c, f, ğ, h, v' ünsüzlerine ne ad verilir?", "o": [{"t": "İkincil ünsüzler", "ok": true, "why": "Eski Türkçedeki ana seslerin (yupka > yufka, eb > ev) değişimiyle sonradan oluşan bu sesler ikincil ünsüzler olarak adlandırılır."}, {"t": "Asli ünsüzler", "ok": false, "why": "Dilin en eski dönemlerinden beri köklerde yer alan temel ünsüzlerdir."}, {"t": "Süreksiz ünsüzler", "ok": false, "why": "Hava akımının çıkakta engellenip patlamayla çıktığı ünsüzlerdir."}, {"t": "Titreşimsiz ünsüzler", "ok": false, "why": "Ses tellerinin titreşmemesiyle oluşan ötümsüz/tonsuz ünsüzlerdir."}], "hint": "Tarihsel süreçte sonradan türeyen veya dönüşen ünsüz türünü düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 3}, {"q": "Biri bağımsız biçim birim olmak üzere, en az iki biçim birimden oluşan ve bir veya daha fazla ek alan kök biçim birimlere 'gövde' adı verilir. Buna göre aşağıdaki sözcüklerden hangisi gövde durumundadır?", "o": [{"t": "Gelişmişlik", "ok": true, "why": "Kök üzerine eklenen türetme ekleriyle birden fazla biçim birimden oluşan türemiş bir yapıdır."}, {"t": "Bahçe", "ok": false, "why": "Herhangi bir ek almamış, daha küçük anlamlı parçalara ayrılamayan yalın bir köktür."}, {"t": "Kelebek", "ok": false, "why": "Sözlüksel anlam taşıyan ve ek almamış kök durumunda tek bir biçim birimdir."}, {"t": "Dinozor", "ok": false, "why": "Daha küçük anlamlı birimlere bölünemeyen tek başına bir kök biçim birimdir."}], "hint": "Sözcüğün kök durumundan çıkıp en az bir türetme eki alarak genişleyip genişlemediğine dikkat ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Yabancı dildeki bir sözcüğün yapısına veya ses yapısına benzetilerek Türkçe kök ve eklerle yeni sözcük türetilmesi yoluna 'örnekseme' denir. Aşağıdaki sözcüklerden hangisi örnekseme yoluyla üretilmiş bir sözcük değildir?", "o": [{"t": "Arge", "ok": true, "why": "İki ayrı sözcüğün hece veya parçalarının bir araya getirilmesiyle oluşturulmuş karma bir yapı örneğidir."}, {"t": "Okul", "ok": false, "why": "Fransızcadaki 'école' sözcüğünün ses ve yapı özellikleri örnek alınarak üretilmiştir."}, {"t": "İmge", "ok": false, "why": "Fransızca 'image' sözcüğünün biçimsel yapısı esas alınarak Türkçeye kazandırılmıştır."}, {"t": "Genel", "ok": false, "why": "Fransızcadaki 'général' kelimesinin yapısına benzetilerek türetilmiş bir sözcüktür."}], "hint": "Sözcüklerden hangisinin iki farklı ifadenin kısaltılarak birleştirilmesiyle oluştuğuna odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "'Bayılmak' eyleminden 'bay-', 'ayılmak' eyleminden 'ay-' eylemlerinin türetilmesinde olduğu gibi, var olan bir eylemden ek yapısının eksiltilmesiyle yeni bir eylem oluşturulması yöntemi aşağıdakilerden hangisidir?", "o": [{"t": "Ters türetme", "ok": true, "why": "Var olan ekli bir biçim birimden ek yapısı eksiltilerek geriye doğru yeni bir kök/eylem elde edilmesidir."}, {"t": "Kasıtlı yaratma", "ok": false, "why": "Herhangi bir var olan kök veya ek bulunmaksızın dilcilerce sıfırdan sözcük oluşturulmasıdır."}, {"t": "Kırpma", "ok": false, "why": "Uzun kelimelerin hecelerinin günlük dilde kısaltılarak kullanılması esasına dayanır."}, {"t": "Derleme", "ok": false, "why": "Halk ağızlarında yaşayan sözlerin taranıp yazı diline aktarılması sürecidir."}], "hint": "Var olan türemiş bir eylemin ek kısmının mantıksal olarak eksiltilip geriye dönük türetilmesini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Çekim eklerinin ya da sözcük öbeklerinin kendi gramatikal işlevlerinin dışında yeni bir kavramı karşılayacak biçimde adlaşması durumuna 'kalıplaşma' adı verilir. Aşağıdaki sözcüklerden hangisi kalıplaşma yoluyla türetilmiştir?", "o": [{"t": "İmambayıldı", "ok": true, "why": "Cümle yapısındaki bir öbeğin zamanla bir yemek adı olarak sabitlenip kalıcı ad durumuna gelmesidir."}, {"t": "Selpak", "ok": false, "why": "Özel bir marka adının ürünün tümü yerine geçmesiyle oluşan genelleşme örneğidir."}, {"t": "Uygar", "ok": false, "why": "Belirli bir kavramı karşılamak üzere dil uzmanlarınca üretilmiş kasıtlı yaratma örneğidir."}, {"t": "Kilo", "ok": false, "why": "'Kilogram' sözcüğünün hece atımıyla elde edilen kırpma yöntemine örnektir."}], "hint": "Bir eylem cümlesinin zamanla bir yemek adı olarak sabitleşip kalıcı ad haline gelmesini göz önüne getiriniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Aşağıdaki seçeneklerin hangisinde yer alan sözcüklerin tamamı 'eylemden ad yapma eki' almıştır?", "o": [{"t": "Çekingen, akın, saplantı", "ok": true, "why": "Sözcüklerin tamamı eylem köklerine gelen yapım ekleriyle ad soyundan sözcüklere dönüştürülmüştür."}, {"t": "Yolsuz, cızırtı, toptan", "ok": false, "why": "İçlerinde addan ad yapma eki barındıran veya yansıma ad köklü sözcükler yer almaktadır."}, {"t": "İlçe, odun, yüzey", "ok": false, "why": "Kökü ad olan veya farklı türde ek birleşimleri içeren yapılardan oluşmaktadır."}, {"t": "Azımsa, yüksün, kısal", "ok": false, "why": "Seçenekteki ekler ad soyundan köklere gelerek eylem türeten ek işlevindedir."}], "hint": "Sözcüklerin türetildiği ilk durumlarının eylem (fiil) olup olmadığına dikkat ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Uzun bir sözcüğün bazı hece veya seslerinin düşürülerek günlük dilde daha kısa bir biçimde kullanılması işlemine 'kırpma' denir. Aşağıdakilerden hangisi kırpma yoluyla oluşturulmuş bir sözcüktür?", "o": [{"t": "Kilo", "ok": true, "why": "'Kilogram' sözcüğünün hecelerinin kısaltılarak günlük dile aktarılmış biçimidir."}, {"t": "Okul", "ok": false, "why": "Yabancı bir sözcüğün yapısının Türkçeye örneksenmesiyle türetilmiştir."}, {"t": "Tümce", "ok": false, "why": "Örnekseme veya türetme yollarıyla Türkçe eklerle oluşturulmuş bir sözcüktür."}, {"t": "İmge", "ok": false, "why": "Başka bir dildeki kelimenin ses yapısına benzetilerek türetilmiştir."}], "hint": "'Kilogram' veya 'santimetre' gibi uzun ölçü birimlerinin günlük konuşmada kısaltılarak kullanılmasını hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Biçim bilgisinde, eklerin (bağımlı biçim birimlerin) üzerine eklendiği yalın veya türemiş biçim birim yapısına ne ad verilir?", "o": [{"t": "Taban", "ok": true, "why": "Ekin doğrudan eklendiği temel birimi veya gövdeleşmiş aşamayı ifade eden kavramdır."}, {"t": "Kök", "ok": false, "why": "Sözcüğün parçalanamayan en küçük anlamlı yapı birimidir."}, {"t": "Gövde", "ok": false, "why": "Kökün en az bir yapım eki almış durumunu ifade eden türemiş yapıdır."}, {"t": "Karma", "ok": false, "why": "Farklı sözcük parçalarının birleştirilmesiyle yapılan sözcük oluşturma yöntemidir."}], "hint": "Örneğin 'gözlük' türemiş sözcüğünün üzerine getirilen yeni bir ek için 'gözlük' kelimesinin üstlendiği birimi düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Aşağıdaki sözcüklerin hangisinde hem birden çok yapım eki hem de birden çok çekim eki yer almaktadır?", "o": [{"t": "Yaşanmışlıklarımız", "ok": true, "why": "Sözcük yapısında birden fazla yapım eki ile çoğul ve iyelik ekleri gibi birden fazla çekim eki bir arada kullanılmıştır."}, {"t": "Beklemek", "ok": false, "why": "Yalnızca bir yapım eki ile isim-fiil eki içeren sınırlı bir ek dizilimine sahiptir."}, {"t": "Eleştirmenin", "ok": false, "why": "İçeriğinde birden fazla çekim eki çeşidi barındırmayan daha dar bir ek dizilimidir."}, {"t": "Gitmişlerse", "ok": false, "why": "Yapım eki içermeyip yalnızca birleşik zaman ve çoğul gibi çekim ekleri almıştır."}], "hint": "Sözcükteki türetme ekleri ile çekim eklerinin (çoğul, iyelik vb.) sayısını ayrı ayrı analiz ediniz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Dil uzmanları veya yetkili kurumlarca belirli bir kavramı karşılamak üzere doğrudan doğruya oluşturulan sözcük yapım yoluna 'kasıtlı yaratma' denir. Aşağıdakilerden hangisi bu yolla üretilmiş sözcüklerden biridir?", "o": [{"t": "Uygar", "ok": true, "why": "Yeni bir kavramı karşılamak amacıyla dil planlamacıları tarafından doğrudan oluşturulmuş bir sözcüktür."}, {"t": "Jilet", "ok": false, "why": "Bir marka adının ürün türünün genel adı haline dönüşmesiyle oluşan genelleşmedir."}, {"t": "Deprenmek", "ok": false, "why": "Halk ağızlarından taranıp yazı diline aktarılan derleme kökenli bir sözcüktür."}, {"t": "Futbol", "ok": false, "why": "Başka bir dilden doğrudan alınan kopyalama bir sözcüktür."}], "hint": "'Bayan', 'koşul' veya 'uygar' gibi kavramların dil kurulları tarafından türetilme amacını düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "'Araştırmacılık' sözcüğü biçim birimlerine ayrıldığında, anlam ilişkisi kopmaksızın ulaşılabilen en küçük anlamlı kök aşağıdakilerden hangisidir?", "o": [{"t": "Ara", "ok": true, "why": "Sözcüğün türetilme sürecindeki ilk ve anlamca ilişkili en temel bağımsız biçim birimidir."}, {"t": "Araştır", "ok": false, "why": "Kök üzerine gelen ekle oluşmuş eylem gövdesi aşamasıdır."}, {"t": "Araştırma", "ok": false, "why": "Eylemden ad türetilmiş bir alt gövde veya taban durumudur."}, {"t": "Ar", "ok": false, "why": "Kelimenin genel anlam bağlamıyla ilişkisi bulunmayan bağımsız bir köktür."}], "hint": "'Aramak' eylemi ile 'araştırmak' arasındaki ilk anlam bağına odaklanınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Ticari bir marka adının zaman içerisinde o türdeki ürünlerin tümünü karşılar hale gelmesine 'genelleşme' denir. Aşağıdaki sözcüklerden hangisi bu yolla dili zenginleştiren sözcüklerden biridir?", "o": [{"t": "Selpak", "ok": true, "why": "Marka adının zamanla kağıt mendil ürünlerinin tümünü ifade edecek şekilde genelleşmesidir."}, {"t": "Yozlaşmak", "ok": false, "why": "Halk dili kaynaklı derleme sürecine ait bir sözcüktür."}, {"t": "Başkan", "ok": false, "why": "Tarihsel metinlerden taranarak yazı diline kazandırılmış bir sözcüktür."}, {"t": "Aşçı", "ok": false, "why": "Standart addan ad yapma ekiyle türetilmiş bir sözcüktür."}], "hint": "Bir marka adının mendil türündeki tüm ürünler için genel isim olarak kullanılması örneğini hatırlayınız.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "İki ayrı sözcüğün hecelerinin veya parçalarının bir araya getirilerek yeni ve tek bir kavramı karşılayacak biçimde birleştirilmesiyle yapılan sözcük oluşturma yöntemine 'karma' adı verilir. Aşağıdakilerden hangisi bu yöntemle oluşturulmuştur?", "o": [{"t": "Ordonat", "ok": true, "why": "'Ordu' ve 'donatım' sözcüklerinin hece parçalarının birleştirilmesiyle türetilmiş karma bir sözcüktür."}, {"t": "Karatavuk", "ok": false, "why": "İki ayrı sözcüğün eksiltilmeden bir araya getirildiği geleneksel birleştirme örneğidir."}, {"t": "Şükretmek", "ok": false, "why": "Bir ad ile yardımcı eylemin birleşmesinden oluşan birleşik eylemdir."}, {"t": "Açık öğretim", "ok": false, "why": "Sözcüklerin eksiltilmeden yan yana gelmesiyle kurulan birleşik ad yapısıdır."}], "hint": "'Ordu donatım' veya 'araştırma geliştirme' gibi tamlamaların hece birleştirilmesiyle tek kelime haline getirilmesini düşününüz.", "type": "multiple_choice", "a": "", "why": "", "ch": 4}, {"q": "Cümle türleri yapısına göre incelendiğinde aşağıdakilerden hangisi 'Basit Cümle' türüne örnektir?", "o": [{"t": "Benim gecem yeni bir umutla başladı.", "ok": true, "why": "Tek bir eylem ve tek bir yargı bildiren, içinde fiilimsi veya başka tümce barındırmayan yapılar basit cümle oluşturur."}, {"t": "Onu seviyorsan bunu ona açıkça söylemelisin.", "ok": false, "why": "İçinde şart ekiyle kurulmuş yan yargı barındıran cümleler birleşik cümle yapısındadır."}, {"t": "Bir öğrenci geldi sınıfa, etrafa bakıp arka sıraya geçti.", "ok": false, "why": "Virgülle birbirinden ayrılmış birden fazla bağımsız yüklem barındıran yapılar sıralı cümle örneğidir."}, {"t": "Belki onlar seviyorlar da ben farkına varmıyorum.", "ok": false, "why": "Ayrı yargıların bağlaçla birbirine bağlandığı yapılar bağlı cümle sınıfına girer."}], "hint": "İçinde yan yargı, fiilimsi veya ek bir bağlaç bulunmayan tek yargılı yapıyı arayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Cümlenin ögeleri değerlendirildiğinde, öznenin yaptığı işten doğrudan etkilenen ve geçişli eylemleri tamlayan öge aşağıdakilerden hangisidir?", "o": [{"t": "Nesne", "ok": true, "why": "Geçişli fiillerin doğrudan etkilediği ve yükleme sorulan 'ne, neyi, kimi' sorularına yanıt veren öge nesnedir."}, {"t": "Dolaylı tümleç", "ok": false, "why": "Yüklemin bildirdiği hareketin gerçekleştiği yeri veya yönü yaklaşma, bulunma ve uzaklaşma ekleriyle bildiren ögedir."}, {"t": "Zarf tümleci", "ok": false, "why": "Eylemin zaman, tarz, miktar veya sebep yönünden sınırlarını belirleyen tümleç türüdür."}, {"t": "Yüklem", "ok": false, "why": "Cümledeki işi, hareketi, yargıyı veya durumu üstlenen temel ögedir."}], "hint": "Geçişli fiillere sorulan 'neyi' veya 'kimi' sorularının yanıtı olan ögeyi düşünün.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "'Sıcak güneş' ve 'mavi deniz' kelime öbekleri tamlama ilişkisi bakımından aşağıdakilerden hangisine örnektir?", "o": [{"t": "Sıfat tamlaması", "ok": true, "why": "Bir ismin rengini, durumunu veya niteliğini gösteren niteleme sözcükleriyle oluşturulan öbeklerdir."}, {"t": "Belirtili ad tamlaması", "ok": false, "why": "Hem tamlayanın ilgi eki hem de tamlananın iyelik eki aldığı tamlama yapısıdır."}, {"t": "Takısız ad tamlaması", multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "'Onun gibi benimsenmiş bir lider yoktur bu coğrafyada.' cümlesi yüklemin türüne göre hangi cümle grubunda yer alır?", "o": [{"t": "Ad cümlesi", "ok": true, "why": "Yüklemi isim köklü bir sözcük ('yok') olan ve ek eylem alarak yüklemleşen cümleler ad cümlesidir."}, {"t": "Eylem cümlesi", "ok": false, "why": "Yüklemi çekimlenmiş bir fiilden oluşan cümle türüdür."}, {"t": "Devrik cümle", "ok": false, "why": "Yüklemin türünü değil, yüklemin cümle içerisindeki yerini ifade eden bir sınıflandırmadır."}, {"t": "Bağlı cümle", "ok": false, "why": "Cümlenin yüklem türünü değil, yapısını belirten bir tanımdır."}], "hint": "Cümlenin yükleminin fiil kökenli mi yoksa isim kökenli mi olduğuna dikkat edin.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "Yüklemin anlamını zaman, sebep, tarz, yön, ölçü veya şart gibi yönlerden tamamlayan ve sınırlayan cümlenin ögesi aşağıdakilerden hangisidir?", "o": [{"t": "Zarf tümleci (Belirteç tümleci)", "ok": true, "why": "Eylemin nasıl, ne zaman, ne kadar ve ne sebeple yapıldığını belirten ögedir."}, {"t": "Dolaylı tümleç", "ok": false, "why": "Yüklemi yer ve mekân ilişkisi yönünden tamamlayan ögedir."}, {"t": "Özne", "ok": false, "why": "Eylemi gerçekleştiren veya durumu taşıyan ana ögedir."}, {"t": "Nesne", "ok": false, "why": "Eylemden etkilenen ögedir ve eylemin tarzını veya zamanını bildirmez."}], "hint": "Yükleme sorulan 'Nasıl?', 'Ne zaman?' ve 'Ne kadar?' sorularına yanıt veren ögeyi hatırlayın.", "type": "multiple_choice", "a": "", "why": "", "ch": 5}, {"q": "'Ertuğrul Gazi' ve 'Selin Hanım' ifadeleri sözcük öbekleri bakımından aşağıdakilerden hangisine örnektir?", "o": [{"t": "Unvan öbeği", "ok": true, "why": "Özel adlara eklenen saygı, derece, san veya meslek adlarının oluşturduğu öbektir."}, {"t": "Aitlik öbeği", "ok": false, "why": "Aitlik eki (-ki) kullanılarak kurulan söz öbeğidir."}, {"t": "Ünlem öbeği", "ok": false, "why": "Seslenme ve duygu belirten ünlem
