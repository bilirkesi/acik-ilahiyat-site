<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<title>teknik-gelistirim zihin haritası</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#f8f4ea; color:#1b2a4a; }
  header { padding:12px 16px; background:#1b2a4a; color:#f8f4ea; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header select { font-size:14px; padding:4px 8px; }
  #cy { width:100vw; height:calc(100vh - 52px); }
  #detail { position:fixed; right:12px; bottom:12px; max-width:360px; background:#fff; border:1px solid #b08d4a; border-radius:8px; padding:12px; display:none; box-shadow:0 4px 16px rgba(0,0,0,.12); }
  #detail h3 { margin:0 0 6px; font-size:14px; color:#b08d4a; }
  #detail p { margin:0; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<header>
  <strong>teknik-gelistirim</strong>
  <select id="mapSel"></select>
  <span id="meta" style="opacity:.8;font-size:12px"></span>
</header>
<div id="cy"></div>
<div id="detail"><h3 id="dTitle"></h3><p id="dBody"></p></div>
<script>
const DATA = {"course": "teknik-gelistirim", "mindmaps": [{"id": "graph-derived", "title": "teknik-gelistirim kavram ağacı (graf)", "source": "coursegraph", "nodes": [{"id": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "label": "Teknik Gelişim", "desc": "", "depth": 0, "mindmap": "graph-derived", "course": "teknik-gelistirim"}, {"id": "mm:teknik-gelistirim:graph-derived:1:1:program orientation and ifs clou", "label": "Program Orientation and IFS Cloud Oracle Architecture", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 1, "href": "#/course/teknik-gelistirim/chapter/1"}, {"id": "mm:teknik-gelistirim:graph-derived:1:2:multitenant database administrat", "label": "Multitenant Database Administration: CDB and PDB", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 2, "href": "#/course/teknik-gelistirim/chapter/2"}, {"id": "mm:teknik-gelistirim:graph-derived:1:3:release lifecycle and patching: ", "label": "Release Lifecycle and Patching: RU, RUR and Upgrades", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 3, "href": "#/course/teknik-gelistirim/chapter/3"}, {"id": "mm:teknik-gelistirim:graph-derived:1:4:storage, asm and capacity manage", "label": "Storage, ASM and Capacity Management", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 4, "href": "#/course/teknik-gelistirim/chapter/4"}, {"id": "mm:teknik-gelistirim:graph-derived:1:5:rac and grid infrastructure", "label": "RAC and Grid Infrastructure", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 5, "href": "#/course/teknik-gelistirim/chapter/5"}, {"id": "mm:teknik-gelistirim:graph-derived:1:6:data guard, maa standards and fa", "label": "Data Guard, MAA Standards and Failover Operations", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 6, "href": "#/course/teknik-gelistirim/chapter/6"}, {"id": "mm:teknik-gelistirim:graph-derived:1:7:application continuity and resil", "label": "Application Continuity and Resilience", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 7, "href": "#/course/teknik-gelistirim/chapter/7"}, {"id": "mm:teknik-gelistirim:graph-derived:1:8:performance management and tunin", "label": "Performance Management and Tuning", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 8, "href": "#/course/teknik-gelistirim/chapter/8"}, {"id": "mm:teknik-gelistirim:graph-derived:1:9:monitoring, alerting and inciden", "label": "Monitoring, Alerting and Incident Management", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 9, "href": "#/course/teknik-gelistirim/chapter/9"}, {"id": "mm:teknik-gelistirim:graph-derived:1:10:backup, recovery and operational", "label": "Backup, Recovery and Operational Practice", "desc": "", "depth": 1, "mindmap": "graph-derived", "course": "teknik-gelistirim", "chapter": 10, "href": "#/course/teknik-gelistirim/chapter/10"}], "edges": [{"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:1:program orientation and ifs clou"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:2:multitenant database administrat"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:3:release lifecycle and patching: "}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:4:storage, asm and capacity manage"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:5:rac and grid infrastructure"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:6:data guard, maa standards and fa"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:7:application continuity and resil"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:8:performance management and tunin"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:9:monitoring, alerting and inciden"}, {"source": "mm:teknik-gelistirim:graph-derived:0:1:teknik gelisim", "target": "mm:teknik-gelistirim:graph-derived:1:10:backup, recovery and operational"}]}]};
const sel = document.getElementById('mapSel');
DATA.mindmaps.forEach((m, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = m.title + ' (' + m.nodes.length + ')';
  sel.appendChild(o);
});
let cy;
function build(idx) {
  const m = DATA.mindmaps[idx];
  document.getElementById('meta').textContent = m.source;
  const nodes = m.nodes.map(n => ({
    data: { id: n.id, label: n.label, desc: n.desc || '' },
    classes: 'd' + Math.min(n.depth || 0, 4)
  }));
  const edges = m.edges.map((e, i) => ({ data: { id: 'e'+i, source: e.source, target: e.target } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: nodes.concat(edges),
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'text-wrap':'wrap', 'text-max-width':'140px',
        'font-size':'11px', 'text-valign':'bottom', 'text-margin-y':'6px',
        'background-color':'#1b2a4a', 'color':'#1b2a4a',
        'width': 18, 'height': 18, 'shape':'ellipse'
      } },
      { selector: 'edge', style: { 'curve-style':'bezier', 'target-arrow-shape':'triangle', 'line-color':'#b08d4a', 'target-arrow-color':'#b08d4a', 'width':1.5 } },
      { selector: 'node.d0', style: { 'background-color':'#b08d4a', 'width':28, 'height':28, 'font-weight':'bold', 'font-size':'13px' } },
      { selector: 'node.d2', style: { 'background-color':'#3d5a80' } },
      { selector: 'node.d3, node.d4', style: { 'background-color':'#6b7c93', 'width':12, 'height':12 } },
      { selector: '.highlight', style: { 'border-width':3, 'border-color':'#b08d4a' } }
    ],
    layout: { name:'cose', animate:false, padding:40 }
  });
  cy.on('tap', 'node', evt => {
    const n = evt.target;
    document.getElementById('dTitle').textContent = n.data('label');
    document.getElementById('dBody').textContent = n.data('desc') || '';
    document.getElementById('detail').style.display = 'block';
  });
  cy.on('tap', evt => { if (evt.target === cy) document.getElementById('detail').style.display = 'none'; });
}
sel.onchange = () => build(+sel.value);
build(0);
</script>
</body>
</html>
