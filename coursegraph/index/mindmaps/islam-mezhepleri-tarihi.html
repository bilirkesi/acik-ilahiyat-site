const DATA = {"course": "islam-mezhepleri-tarihi", "mindmaps": [{"id": "panel-tree", "title": "İslam Mezhepleri Tarihi İnteraktif Paneli", "source": "interactive.tree", "nodes": [{"id": "mm:islam-mezhepleri-tarihi:panel-tree:0:1:hiricilik", "label": "Hâricîlik", "desc": "Tahkim Olayı'nda Hz. Ali'nin ordusundan ayrılan ilk radikal akım. 'La hükme illa lillah' (Hüküm ancak Allah'a aittir) sloganını benimser.", "depth": 0, "mindmap": "panel-tree", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-tree:1:1:ezarika", "label": "Ezarika", "desc": "Nafi b. el-Ezrak'a nispet edilir; kendilerinden olmayan tüm Müslümanları tekfir etmiş, mallarını ve canlarını helal saymışlardır (isti'raz).", "depth": 1, "mindmap": "panel-tree", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-tree:1:2:ibadiyye", "label": "İbadiyye", "desc": "Abdullah b. İbaz'a nispet edilir; Hâricîliğin günümüze ulaşan tek ılımlı koludur. Büyük günahı 'küfr-i nimet' olarak yorumlar. Umman ve Kuzey Afrika'da yaşar.", "depth": 1, "mindmap": "panel-tree", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-tree:0:2:murciye", "label": "Mürciye", "desc": "Hâricîlerin tekfirci tutumuna tepki olarak doğan, toplumsal huzuru ve barışı arzulayan ekoldür. İmanı kalbin tasdiki olarak tanımlar, ameli imandan ayırır. İmam-ı Azam Ebu Hanife sünnet mürciyesi çizgisinde değerlendirilir.", "depth": 0, "mindmap": "panel-tree", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-tree:0:3:mu'tezile", "label": "Mu'tezile", "desc": "Vasıl b. Ata ve Amr b. Ubeyd tarafından kurulmuş, Ebu'l-Hüzeyl el-Allaf tarafından sistemleştirilmiş akılcı kelam ekolüdür.", "depth": 0, "mindmap": "panel-tree", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-tree:1:1:usul-i hamse", "label": "Usûl-i Hamse", "desc": "Tevhid (zâta zait sıfatların reddi), Adalet (insanın fiillerinde özgürlüğü), el-Va'd ve'l-Va'id ource": "interactive.chapters", "nodes": [{"id": "mm:islam-mezhepleri-tarihi:panel-chapters:0:1:din - mezhep iliskisi ve mezhepl", "label": "Din - Mezhep İlişkisi ve Mezhepleşme Süreci", "desc": "Din tektir, ilahidir ve masumdur. Mezhepler ise çokludur, beşeridir, dinamiktir ve ulema zihninin ürünüdür.", "depth": 0, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi", "chapter": 1, "href": "#/course/islam-mezhepleri-tarihi/chapter/1"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:1:din vs mezhep ayrimi", "label": "Din vs Mezhep Ayrımı", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:din tektir, ilahidir ve masumdur", "label": "Din tektir, ilahidir ve masumdur. Mezhepler ise çokludur, beşeridir, dinamiktir ve ulema zihninin ürünüdür.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:2:mezheplesmenin dogalligi", "label": "Mezhepleşmenin Doğallığı", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:hz. peygamber'in vefatiyla masum", "label": "Hz. Peygamber'in vefatıyla masum otorite sona ermiş, yerini metinlere (Nas) bırakmıştır. Metinleri yorumlayan ulema masum olmadığı için ihtilaf ve mezhepleşme kaçınılmaz bir gerekliliktir.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:3:4 asamali seruven", "label": "4 Aşamalı Serüven", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:mezhepler masa basinda kurulmaz.", "label": "Mezhepler masa başında kurulmaz. Şahsi görüşle başlar, cemaatleşir, 'İkinci Adam' ile sistemleşir ve nihayetinde kurumsallaşır.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:4:cift yonlu dinamikler", "label": "Çift Yönlü Dinamikler", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:itikadi ayrismalar sadece ic siy", "label": "İtikadî ayrışmalar sadece iç siyasi krizlerden (Cemel, Sıffîn, Tahkim) değil, aynı zamanda dış felsefi karşılaşmalardan ve tercüme faaliyetlerinden beslenmiştir.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:5:orta yol tavri", "label": "Orta Yol Tavrı", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:mezhebi dinin kendisiyle ayniles", "label": "Mezhebi dinin kendisiyle aynileştiren 'mezhepçilik' ile mezhepleri tamamen reddedip metot kazasını doğuran 'mezhepsizlik' iki aşırı uçtur; makbul olan metodolojik bağımlılıktır.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:0:2:hak mezhep soylemi ve mezheplesm", "label": "Hak Mezhep Söylemi ve Mezhepleşmenin Sebepleri", "desc": "İhtilaf farklı düşünmektir ve doğaldır. Yasaklanan şey, farklılıkları ümmeti bölen bir ayrılık vesilesine (iftirak) dönüştürmektir.", "depth": 0, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi", "chapter": 2, "href": "#/course/islam-mezhepleri-tarihi/chapter/2"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:1:ihtilaf vs iftirak", "label": "İhtilaf vs İftirak", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:ihtilaf farkli dusunmektir ve do", "label": "İhtilaf farklı düşünmektir ve doğaldır. Yasaklanan şey, farklılıkları ümmeti bölen bir ayrılık vesilesine (iftirak) dönüştürmektir.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:2:hak mezhep soylemi", "label": "Hak Mezhep Söylemi", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:her mezhep kendini en dogru yoru", "label": "Her mezhep kendini en doğru yorum olarak görür; bu tabiidir. Ancak bunu Allah katında da kesin doğru kabul edip diğerlerini din dışına atmak problemli bir tutumdur.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:3:iki asiri uc", "label": "İki Aşırı Uç", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:mezhebi din ile aynilestirmek (m", "label": "Mezhebi din ile aynileştirmek (mezhepçilik) ve mezhepleri bütünüyle reddetmek (mezhepsizlik) birbirinin aynasıdır; her ikisi de metodolojik çöküşe götürür.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:1:4:cok nedenli yapi", "label": "Çok Nedenli Yapı", "desc": "", "depth": 1, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:2:1:itikadi mezheplesme tek bir nede", "label": "İtikadî mezhepleşme tek bir nedene indirgenemez; iç siyasi krizler, metinlerin yapısı ve dış kültürle yüzleşme bir arada çalışır.", "desc": "", "depth": 2, "mindmap": "panel-chapters", "course": "islam-mezhepleri-tarihi"}, {"id": "mm:islam-mezhepleri-tarihi:panel-chapters:0:3:ilk siyasi-itikadi kirilma: hiri", "label": "İlk Siyasi-İtikadi Kırılma: Hâricîler", "desc": "Hâricîlik Sıffîn ve Tahkim sonrası doğdu; siyasî bir tepki hızla katı bir itikadî sisteme dönüştü.", "depth": 0, "mi const sel = document.getElementById('mapSel');
DATA.mindmaps.forEach((m, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = m.title + ' (' + m.nodes.length + ')';
  sel.appendChild(o);
});
let cy;
function build(idx) {
  const m = DATA.mindmaps[idx];
  document.getElementById('meta').textContent = m.source;
  const nodes = m.nodes.map(n => ({
    data: { id: n.id, label: n.label, desc: n.desc || '' },
    classes: 'd' + Math.min(n.depth || 0, 4)
  }));
  const edges = m.edges.map((e, i) => ({ data: { id: 'e'+i, source: e.source, target: e.target } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: nodes.concat(edges),
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'text-wrap':'wrap', 'text-max-width':'140px',
        'font-size':'11px', 'text-valign':'bottom', 'text-margin-y':'6px',
        'background-color':'#1b2a4a', 'color':'#1b2a4a',
        'width': 18, 'height': 18, 'shape':'ellipse'
      } },
      { selector: 'edge', style: { 'curve-style':'bezier', 'target-arrow-shape':'triangle', 'line-color':'#b08d4a', 'target-arrow-color':'#b08d4a', 'width':1.5 } },
      { selector: 'node.d0', style: { 'background-color':'#b08d4a', 'width':28, 'height':28, 'font-weight':'bold', 'font-size':'13px' } },
      { selector: 'node.d2', style: { 'background-color':'#3d5a80' } },
      { selector: 'node.d3, node.d4', style: { 'background-color':'#6b7c93', 'width':12, 'height':12 } },
      { selector: '.highlight', style: { 'border-width':3, 'border-color':'#b08d4a' } }
    ],
    layout: { name:'cose', animate:false, padding:40 }
  });
  cy.on('tap', 'node', evt => {
    const n = evt.target;
    document.getElementById('dTitle').textContent = n.data('label');
    document.getElementById('dBody').textContent = n.data('desc') || '';
    document.getElementById('detail').style.display = 'block';
  });
  cy.on('tap', evt => { if (evt.target === cy) document.getElementById('detail').style.display = 'none'; });
}
sel.onchange = () => build(+sel.value);
build(0);
</script>
